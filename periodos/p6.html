<html lang="pt-BR" data-per="p6">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>medASp</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="medASp">

<link rel="icon" href="rainha2-192.png">
<link rel="apple-touch-icon" href="rainha2-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Archivo:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: app de uma tela, bem simples: o nome no centro do preto, o baralho, o resumo e o cartão. */
/* medASp (28/10): preto predominante, branco, vermelho sutil e mínimos detalhes de azul; só a chama do nome muda de cor. */
/* O Dr. Casa (avatar, falas e casos) continua no código, fora da tela: .casa[hidden]. Para trazê-lo de volta, tirar o hidden do <aside class="casa">. */
:root{
  --bg:#050505; --surface:#0b0b0b; --surface-2:#111111; --line:#1f1f1f; --line-2:#333333;
  --fg:#ebebeb; --muted:#9c9c9c; --dim:#6b6b6b;
  --red:#b02a30; --red-ink:#d0585e; --blue:#7f97bd;
  --bad:#c2414a; --hard:#bdbdbd; --good:#7f97bd; --easy:#5aa883;
  --brand:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;color:inherit}
a{color:var(--fg);text-decoration-color:#5a5a5a;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* barra */
.bar{display:flex;justify-content:center;padding:clamp(28px,8vh,72px) 0 clamp(8px,3vh,24px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.word{font:700 clamp(64px,16vw,104px)/.9 var(--brand);letter-spacing:.01em;display:inline-flex;align-items:flex-end;color:#f5f5f5}
.flame{width:.36em;height:.5em;margin-left:.03em;margin-bottom:.04em;overflow:visible;flex:none}
.app-name{font:500 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.24em;text-transform:uppercase}

/* chama: desenho animado, quente e macabra; a única coisa que muda de cor */
.flame .tongue{transform-box:fill-box;transform-origin:50% 100%}
.flame .all{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .flame .hue{animation:hue 16s linear infinite}
  .flame .eyes{animation:blink 5s steps(1) infinite}
}
@keyframes hue{0%{filter:hue-rotate(0deg) saturate(1.1)}22%{filter:hue-rotate(-28deg) saturate(1.3)}45%{filter:hue-rotate(-95deg) saturate(1.2)}68%{filter:hue-rotate(75deg) saturate(1.25)}84%{filter:hue-rotate(20deg) saturate(1.2)}100%{filter:hue-rotate(0deg) saturate(1.1)}}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.97,1.05) skewX(-2deg)}100%{transform:scale(1.03,.96) skewX(2deg)}}
@keyframes lick{from{transform:rotate(-6deg) scaleY(.94)}to{transform:rotate(5deg) scaleY(1.08)}}
@keyframes blink{0%,92%{opacity:1}93%,96%{opacity:0}97%{opacity:1}}
@keyframes pulse{from{opacity:.45}to{opacity:.85}}

/* painel */
.deckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--display);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:#4a4a4a;background:#141414}
.chip .n{font:700 11px var(--mono);padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip[aria-pressed="true"] .n{color:var(--red-ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font:400 13px/1.3 var(--body);color:var(--muted)}
.stat.hot b{color:var(--red-ink)}

.main{display:block}
.casa[hidden]{display:none!important}

/* cartão */
.card{display:flex;flex-direction:column;gap:16px;min-height:340px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.tag{padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg)}
.tag.new{border-color:#6a2226;color:var(--red-ink)}
.meta .pos{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.q{font:600 clamp(21px,3.4vw,26px)/1.35 var(--body);letter-spacing:0;margin:6px 0 0;text-wrap:balance}
.ans{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ans p{margin:0;font:400 18px/1.65 var(--body)}
.ans .lbl{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ans .read{font:500 13px var(--display);color:var(--blue);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.ans .read:hover{text-decoration:underline}
.spacer{flex:1}
.reveal{align-self:stretch;font:500 15px var(--display);letter-spacing:.02em;padding:14px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:#fff;cursor:pointer}
.reveal:hover{border-color:var(--red)}
kbd{font:500 11px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.7;margin-left:8px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;min-width:0}
.grade b{font:500 14px var(--display)}
.grade small{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.grade.g0{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}.grade.g0 b{color:var(--bad)}
.grade.g3{border-color:color-mix(in srgb,var(--hard) 50%,transparent)}.grade.g3 b{color:var(--hard)}
.grade.g4{border-color:color-mix(in srgb,var(--good) 55%,transparent)}.grade.g4 b{color:var(--good)}
.grade.g5{border-color:color-mix(in srgb,var(--easy) 55%,transparent)}.grade.g5 b{color:var(--easy)}
.grade:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--line-2))}
.done{display:flex;flex-direction:column;gap:14px}
.done h2{font:600 clamp(24px,4vw,32px)/1.15 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.done .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.done .sum div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.done .sum b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.done .sum span{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{font:500 14px var(--display);padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.ghost:hover{border-color:#5a5a5a}

/* Dr. Casa */
.casa{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.casa-top{display:flex;gap:12px;align-items:center}
.avatar{width:96px;height:112px;flex:none}
.who b{display:block;font:600 20px/1 var(--display);letter-spacing:-.02em}
.who span{display:block;font:500 12px/1.35 var(--body);color:var(--muted);margin-top:4px}
.bubble{position:relative;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;font:500 15px/1.55 var(--body);min-height:84px}
.bubble::before{content:"";position:absolute;top:-7px;left:38px;width:12px;height:12px;background:var(--surface-2);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
.bubble.story{border-color:#6a2226}
.bubble .case{display:block;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red-ink);margin-bottom:4px}
.casa .row .ghost{flex:1;font-size:13px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){
  .avatar .cane{transform-box:view-box;transform-origin:165px 236px}
  .avatar.tap .cane{animation:tap .5s ease-in-out 2}
  .avatar .lids{animation:blink 6s steps(1) infinite}
  .avatar .brow-r{transform-box:fill-box;transform-origin:0 100%;transition:transform .25s}
  .avatar.raise .brow-r{transform:translateY(-4px) rotate(-8deg)}
  .avatar.smug .mouth{transform:translateY(-1px)}
}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}

footer{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
footer .linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.confirm{display:inline-flex;gap:8px;align-items:center}
.confirm button{font:500 12px var(--display);padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.confirm .danger{border-color:var(--bad);color:var(--bad)}

@media (max-width:820px){
  .casa{position:static;order:-1;gap:10px}
  .avatar{width:64px;height:75px}
  .who b{font-size:17px}
  .bubble{min-height:0;font-size:14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .card{min-height:0}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
  .done .sum{grid-template-columns:minmax(0,1fr)}
}
/* tablet e toque: alvos maiores, sem dica de teclado */
@media (min-width:700px){
  .wrap{max-width:780px}
  .q{font-size:clamp(24px,3.2vw,30px)}
  .ans p{font-size:20px}
}
@media (min-width:600px) and (max-width:820px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (pointer:coarse){
  kbd{display:none}
  .chip{padding:10px 14px;font-size:14px}
  .reveal{padding:18px;font-size:17px}
  .grade{padding:14px 6px}
  .grade b{font-size:16px}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
}

/* app único: abas */
.tabs{display:flex;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center;margin-top:-6px}
.tabs a{font:500 14px var(--display);color:var(--muted);text-decoration:none;padding:8px 16px;border-radius:999px;letter-spacing:.02em}
.tabs a[aria-current="page"]{color:#fff;background:#151515;box-shadow:inset 0 -2px 0 var(--red)}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:18px}
.vh{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.today .when{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.today h2{font:600 clamp(22px,3.6vw,28px)/1.3 var(--body);margin:6px 0 0;text-wrap:pretty}
.today .area{font:500 14px var(--display);color:var(--fg)}
.today .eixo{font:400 15px/1.6 var(--body);color:var(--muted);margin:0}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums span{font:500 12px var(--mono);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px}
.go{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);text-decoration:none;color:var(--fg)}
.go b{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink)}
.go span{font:500 16px/1.45 var(--display)}
a.go:hover{border-color:var(--red)}
.go.off{opacity:.7}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.week{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.week div{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font:400 14px/1.45 var(--body)}
.week div b{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.week div.on b{color:var(--red-ink)}
.start{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:400 13px var(--body);color:var(--muted)}
.start input{font:500 13px var(--mono);color:var(--fg);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;color-scheme:dark}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line-2);border-radius:12px;text-decoration:none;color:var(--fg);background:var(--surface-2)}
.bitem b{font:600 17px var(--display)}
.bitem span{font:400 14px/1.45 var(--body);color:var(--muted)}
.bitem:hover{border-color:var(--red)}
.bwrap{display:flex;flex-direction:column;gap:0}
.bwrap .bitem{border-bottom-left-radius:0;border-bottom-right-radius:0}
.lida{font:500 13px var(--display);color:var(--muted);background:transparent;border:1px solid var(--line-2);border-top:0;border-radius:0 0 12px 12px;padding:10px 18px;text-align:left;cursor:pointer}
.lida[aria-pressed="true"]{color:#5aa883;border-color:#2e5a45}
.lida[aria-pressed="true"]::before{content:"✓ "}
.soon{font:400 14px/1.5 var(--body);color:var(--dim);margin:0}
.area{border-top:1px solid var(--line);padding-top:6px}
.area summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;padding:10px 0;font:600 17px var(--display);list-style:none}
.area summary::-webkit-details-marker{display:none}
.area summary::before{content:"+";font:500 15px var(--mono);color:var(--muted);margin-right:-4px;width:14px}
.area[open] summary::before{content:"−"}
.area summary span{margin-left:auto;font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.area .blist{padding-bottom:12px}
.bitem.off{background:transparent;border-style:dashed}
.bitem.off b{font-weight:500;color:var(--muted)}
@media (pointer:coarse){.tabs a{padding:11px 18px;font-size:15px}}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}.week div{grid-template-columns:56px minmax(0,1fr)}}
/*mj:logo*/
/* chama do medASp (28/10 17h15): preta, com contorno na cor da página, balançando devagar; olhos = sombras */
.flame{color:#5c5c5c}
.flame .sway{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){.flame .sway{animation:mj-sway 7s ease-in-out infinite alternate}}
@keyframes mj-sway{0%{transform:rotate(-2.5deg) scale(1,.98)}50%{transform:rotate(1deg) scale(.98,1.03)}100%{transform:rotate(2.5deg) scale(1.01,.99)}}
/*/mj:logo*/
/*per:css*/
.pers{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:-10px}
.pers a{display:inline-flex;align-items:center;gap:7px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 10px;white-space:nowrap;border-radius:999px;border:1px solid var(--line)}
.pers a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pers a[data-per="res"]{--c:#b02a30}.pers a[data-per="p6"]{--c:#c8174a}.pers a[data-per="p7"]{--c:#12a5b8}.pers a[data-per="p8"]{--c:#9446ff;}
.pers a[aria-current]{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
@media (pointer:coarse){.pers a{padding:10px 10px}}
@media (max-width:360px){.pers a{letter-spacing:.02em;padding:9px 8px}}
/* a chama mescla de cor a cada 5 segundos (pedido de 28/10): seis cores em 30 s, sempre em transição */
@media (prefers-reduced-motion:no-preference){.flame .hue{animation:hue5 30s linear infinite}}
@keyframes hue5{0%{filter:hue-rotate(0deg) saturate(1.15)}16.66%{filter:hue-rotate(-40deg) saturate(1.35)}33.33%{filter:hue-rotate(-110deg) saturate(1.25)}50%{filter:hue-rotate(160deg) saturate(1.2)}66.66%{filter:hue-rotate(80deg) saturate(1.3)}83.33%{filter:hue-rotate(28deg) saturate(1.2)}100%{filter:hue-rotate(0deg) saturate(1.15)}}
.flame{color:var(--red)}
/*/per:css*/

/* 28/10: fonte Caslon em tudo (escolha do Arthur); Cormorant fica só no nome medaj */
:root{--display:"Libre Caslon Text",Georgia,serif;--body:"Newsreader",Georgia,serif;--mono:"Libre Caslon Text",Georgia,serif}
.today h2,.q{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,serif;font-weight:400}
/* período: cor oficial no lugar do vermelho, sobre preto e branco */
:root{--bg:#030303;--surface:#0a0a0a;--surface-2:#101010;--line:#1b1b1b;--line-2:#2e2e2e;--red:#c8174a;--red-ink:#ff8fb0;--red-deep:#5a0a22}
.tag.new{border-color:var(--red-deep)}.bubble.story{border-color:var(--red-deep)}
.tabs a[aria-current="page"]{background:#111;box-shadow:inset 0 -2px 0 var(--red)}
.chip[aria-pressed="true"]{border-color:var(--red);background:#111}
.disc{display:block;font:600 13px var(--display);color:var(--red-ink);margin:8px 0 6px;letter-spacing:.02em}
.mat{border:1px solid var(--line-2);border-radius:12px;padding:0 16px;background:var(--surface)}
.mat[open]{padding-bottom:12px}
.mat summary{display:flex;align-items:center;gap:12px;padding:15px 0;cursor:pointer;list-style:none}
.mat summary::-webkit-details-marker{display:none}
.mat summary b{font:600 17px var(--display);flex:1}
.mat summary span{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.mat summary::after{content:"›";font:400 22px/1 var(--display);color:var(--muted);transition:transform .2s}
.mat[open] summary::after{transform:rotate(90deg)}
#v-apostilas{gap:10px}
.mat .soon{margin:0 0 6px}
.avbar{justify-content:center}
.espbar{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}.espbar .chip{flex:1 1 auto;justify-content:center}
.tag.pa{border-color:var(--red);color:var(--red-ink)}
.bfoot{display:flex}.bfoot .lida{flex:1}.bfoot .refs{flex:none;border-left:1px solid var(--line-2);border-bottom-left-radius:0;text-decoration:none;color:var(--blue)}
.bfoot .lida:first-child:not(:last-child){border-bottom-right-radius:0}
.week div{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.week div b{font:500 14px var(--display);color:var(--fg);padding:0}
.week .start{flex-wrap:nowrap}.week label{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
@media (max-width:520px){.week div{grid-template-columns:minmax(0,1fr)}.week .start{flex-wrap:wrap}}
/* chama: só as cores desta página, mudando a cada 5 s */
.flame .hue{animation:none!important}

archa, declínio cognitivo e incontinência urinária (Hakim-Adams).","sec":"/a/pa6-neuro-a1/1","w":"Provas antigas · Neurologia · Idosa com declínio cognitivo, quedas e incontinência","pa":1,"pa6":1},{"id":"pa6-neuro-a2-0-0","ch":"provas6-A2","av":"A2","q":"Como é a fraqueza da síndrome de Guillain-Barré?","a":"Flácida, simétrica, ascendente, com hipo/arreflexia e nadir em até 4 semanas.","sec":"/a/pa6-neuro-a2/1","w":"Provas antigas · Neurologia · Síndrome de Guillain-Barré","pa":1,"pa6":1},{"id":"neuro-alzheimer-1-0","ch":"neuro-A2","av":"A2","q":"Qual a sobrevida média na doença de Alzheimer?","a":"De 7 a 10 anos.","sec":"/a/neuro-alzheimer/2","w":"Doença de Alzheimer · Epidemiologia · slide 6"},{"id":"cm2-cardio-taqui-1-0","ch":"cardio-A2","av":"A2","q":"Quais as três condições da reentrada?","a":"Duas vias, bloqueio unidirecional e condução lenta.","sec":"/a/cm2-cardio-taqui/2","w":"Taquiarritmias supraventriculares · Os três mecanismos e a reentrada · slides 4–5"},{"id":"pa6-neuro-a1-0-1","ch":"provas6-A1","av":"A1","q":"Qual sintoma costuma abrir o quadro da HPN e mais melhora com a derivação?","a":"O distúrbio da marcha.","sec":"/a/pa6-neuro-a1/1","w":"Provas antigas · Neurologia · Idosa com declínio cognitivo, quedas e incontinência","pa":1,"pa6":1},{"id":"pa6-neuro-a2-0-1","ch":"provas6-A2","av":"A2","q":"Qual o achado clássico do líquor no Guillain-Barré?","a":"Dissociação albuminocitológica: proteína alta com celularidade normal.","sec":"/a/pa6-neuro-a2/1","w":"Provas antigas · Neurologia · Síndrome de Guillain-Barré","pa":1,"pa6":1},{"id":"neuro-alzheimer-2-0","ch":"neuro-A2","av":"A2","q":"Onde começam os emaranhados nos estágios I e II de Braak?","a":"No córtex transentorrinal e entorrinal.","sec":"/a/neuro-alzheimer/3","w":"Doença de Alzheimer · Fisiopatologia: placa, emaranhado e Braak · slide 7"},{"id":"cm2-cardio-taqui-2-0","ch":"cardio-A2","av":"A2","q":"Quais os limites do triângulo de Koch?","a":"Tendão de Todaro, anel da tricúspide e óstio do seio coronário.","sec":"/a/cm2-cardio-taqui/3","w":"Taquiarritmias supraventriculares · Triângulo de Koch: onde mora o nó AV · slides 7–8"},{"id":"pa6-neuro-a1-0-2","ch":"provas6-A1","av":"A1","q":"O que é o tap test na HPN?","a":"Punção lombar de alívio (30 a 50 mL) com reavaliação da marcha; melhora indica boa resposta à derivação ventriculoperitoneal.","sec":"/a/pa6-neuro-a1/1","w":"Provas antigas · Neurologia · Idosa com declínio cognitivo, quedas e incontinência","pa":1,"pa6":1},{"id":"pa6-neuro-a2-0-2","ch":"provas6-A2","av":"A2","q":"Tratamento do Guillain-Barré?","a":"Imunoglobulina IV ou plasmaférese; corticoide não é eficaz.","sec":"/a/pa6-neuro-a2/1","w":"Provas antigas · Neurologia · Síndrome de Guillain-Barré","pa":1,"pa6":1},{"id":"neuro-alzheimer-3-0","ch":"neuro-A2","av":"A2","q":"Cite os três fatores de proteção do slide.","a":"Anos de educação formal, atividade física e vida social.","sec":"/a/neuro-alzheimer/4","w":"Doença de Alzheimer · Fatores de risco e de proteção · slides 8–10"},{"id":"cm2-cardio-taqui-3-0","ch":"cardio-A2","av":"A2","q":"Como é o ECG basal de quem tem TRN?","a":"Normal.","sec":"/a/cm2-cardio-taqui/4","w":"Taquiarritmias supraventriculares · TRN: a dupla via nodal e a clínica · slides 9–11"},{"id":"pa6-neuro-a1-0-3","ch":"provas6-A1","av":"A1","q":"Que achado de imagem sustenta HPN?","a":"Ventriculomegalia (índice de Evans > 0,3) com padrão DESH: sulcos apertados na alta convexidade e fissuras silvianas alargadas.","sec":"/a/pa6-neuro-a1/1","w":"Provas antigas · Neurologia · Idosa com declínio cognitivo, quedas e incontinência","pa":1,"pa6":1},{"id":"pa6-neuro-a2-0-3","ch":"provas6-A2","av":"A2","q":"Tríade da variante de Miller Fisher?","a":"Oftalmoplegia, ataxia e arreflexia (anti-GQ1b).","sec":"/a/pa6-neuro-a2/1","w":"Provas antigas · Neurologia · Síndrome de Guillain-Barré","pa":1,"pa6":1},{"id":"neuro-alzheimer-4-0","ch":"neuro-A2","av":"A2","q":"O valaciclovir funcionou no ensaio VALAD?","a":"Não; não é recomendado para tratar Alzheimer.","sec":"/a/neuro-alzheimer/5","w":"Doença de Alzheimer · Infecções como fator de risco · slides 11–12"},{"id":"cm2-cardio-taqui-4-0","ch":"cardio-A2","av":"A2","q":"Qual o RP' da TRN e onde está a P?","a":"Menor que 70 ms, com a P no final do QRS em V1.","sec":"/a/cm2-cardio-taqui/5","w":"Taquiarritmias supraventriculares · TRN: o ECG da crise · slides 14–17"},{"id":"pa6-cardio-a1-0-0","ch":"provas6-A1","av":"A1","q":"Tríade clínica do feocromocitoma?","a":"Cefaleia, palpitação e sudorese em paroxismos, com hipertensão.","sec":"/a/pa6-cardio-a1/1","w":"Provas antigas · Cardiologia · Hipertensão resistente com paroxismos","pa":1,"pa6":1},{"id":"pa6-cardio-a2-0-0","ch":"provas6-A2","av":"A2","q":"Quais drogas do IAMCSST reduzem mortalidade?","a":"AAS, inibidor de P2Y12, anticoagulante, betabloqueador, IECA e estatina; e a reperfusão.","sec":"/a/pa6-cardio-a2/1","w":"Provas antigas · Cardiologia · IAM com supra de ST: tratamento farmacológico","pa":1,"pa6":1},{"id":"neuro-alzheimer-5-0","ch":"neuro-A2","av":"A2","q":"Quanto o APOE ε4 em homozigose aumenta o risco?","a":"Cerca de 10 vezes em relação ao ε3/ε3.","sec":"/a/neuro-alzheimer/6","w":"Doença de Alzheimer · Genética: APOE e companhia · slides 13–17"},{"id":"cm2-cardio-taqui-5-0","ch":"cardio-A2","av":"A2","q":"Qual via é ablacionada na TRN e com que sucesso?","a":"A via lenta, com cerca de 95% de sucesso.","sec":"/a/cm2-cardio-taqui/6","w":"Taquiarritmias supraventriculares · TRN: tratamento e ablação por cateter · slides 18–24"},{"id":"pa6-cardio-a1-0-1","ch":"provas6-A1","av":"A1","q":"Exame inicial para feocromocitoma?","a":"Metanefrinas livres plasmáticas ou metanefrinas fracionadas na urina de 24 h.","sec":"/a/pa6-cardio-a1/1","w":"Provas antigas · Cardiologia · Hipertensão resistente com paroxismos","pa":1,"pa6":1},{"id":"pa6-cardio-a2-0-1","ch":"provas6-A2","av":"A2","q":"Método de reperfusão preferido no IAMCSST?","a":"Angioplastia primária em até 120 min do diagnóstico.","sec":"/a/pa6-cardio-a2/1","w":"Provas antigas · Cardiologia · IAM com supra de ST: tratamento farmacológico","pa":1,"pa6":1},{"id":"neuro-alzheimer-6-0","ch":"neuro-A2","av":"A2","q":"Quanto do CCL progride para DA em 2 anos?","a":"14,9% (22,9 a 50% se Aβ positivo).","sec":"/a/neuro-alzheimer/7","w":"Doença de Alzheimer · Apresentação clássica e comprometimento cognitivo leve · slides 18–23"},{"id":"cm2-cardio-taqui-6-0","ch":"cardio-A2","av":"A2","q":"Quais os dois achados da pré-excitação no ECG?","a":"PR curto e onda delta.","sec":"/a/cm2-cardio-taqui/7","w":"Taquiarritmias supraventriculares · Via acessória e Wolff-Parkinson-White · slides 26, 28–29"},{"id":"pa6-cardio-a1-0-2","ch":"provas6-A1","av":"A1","q":"Por que não iniciar betabloqueador antes do alfa no feocromocitoma?","a":"Deixa a vasoconstrição alfa sem oposição e pode precipitar crise hipertensiva.","sec":"/a/pa6-cardio-a1/1","w":"Provas antigas · Cardiologia · Hipertensão resistente com paroxismos","pa":1,"pa6":1},{"id":"pa6-cardio-a2-0-2","ch":"provas6-A2","av":"A2","q":"Cirurgia há 7 dias e IAMCSST: fibrinólise?","a":"Não; cirurgia recente contraindica: angioplastia primária.","sec":"/a/pa6-cardio-a2/1","w":"Provas antigas · Cardiologia · IAM com supra de ST: tratamento farmacológico","pa":1,"pa6":1},{"id":"neuro-alzheimer-7-0","ch":"neuro-A2","av":"A2","q":"O que significa CDR 2?","a":"Demência moderada.","sec":"/a/neuro-alzheimer/8","w":"Doença de Alzheimer · CDR: a régua da gravidade · slide 24"},{"id":"cm2-cardio-taqui-7-0","ch":"cardio-A2","av":"A2","q":"Qual a forma mais comum de TRAV e como é o QRS?","a":"Ortodrômica (95%), com QRS estreito.","sec":"/a/cm2-cardio-taqui/8","w":"Taquiarritmias supraventriculares · TRAV: o ECG da crise e a comparação com a TRN · slides 27, 30–32"},{"id":"pa6-cardio-a1-1-0","ch":"provas6-A1","av":"A1","q":"Tríade de sintomas da estenose aórtica grave?","a":"Angina, síncope (de esforço) e dispneia/insuficiência cardíaca.","sec":"/a/pa6-cardio-a1/2","w":"Provas antigas · Cardiologia · Síncope ao esforço com sopro sistólico aórtico","pa":1,"pa6":1},{"id":"pa6-cardio-a2-0-3","ch":"provas6-A2","av":"A2","q":"Quando dar O₂ no infarto?","a":"Só se SatO₂ < 90%.","sec":"/a/pa6-cardio-a2/1","w":"Provas antigas · Cardiologia · IAM com supra de ST: tratamento farmacológico","pa":1,"pa6":1},{"id":"neuro-alzheimer-8-0","ch":"neuro-A2","av":"A2","q":"Qual a tríade da hidrocefalia de pressão normal?","a":"Apraxia da marcha, incontinência urinária e alteração da memória.","sec":"/a/neuro-alzheimer/9","w":"Doença de Alzheimer · Diagnóstico diferencial: as demências tratáveis · slide 25"},{"id":"cm2-cardio-taqui-8-0","ch":"cardio-A2","av":"A2","q":"Qual cardiopatia mais se associa ao WPW?","a":"A anomalia de Ebstein.","sec":"/a/cm2-cardio-taqui/9","w":"Taquiarritmias supraventriculares · WPW: quem tem, o que sente e o risco · slide 33"},{"id":"pa6-cardio-a1-1-1","ch":"provas6-A1","av":"A1","q":"Critérios ecocardiográficos de estenose aórtica grave?","a":"Vmáx ≥ 4 m/s, gradiente médio ≥ 40 mmHg, área ≤ 1,0 cm².","sec":"/a/pa6-cardio-a1/2","w":"Provas antigas · Cardiologia · Síncope ao esforço com sopro sistólico aórtico","pa":1,"pa6":1},{"id":"pa6-cardio-a2-1-0","ch":"provas6-A2","av":"A2","q":"Como se reconhece o BAV total no ECG?","a":"Ondas P regulares sem relação com os QRS (dissociação AV) e escape lento.","sec":"/a/pa6-cardio-a2/2","w":"Provas antigas · Cardiologia · Idosa com bradicardia extrema e síncope","pa":1,"pa6":1},{"id":"neuro-alzheimer-9-0","ch":"neuro-A2","av":"A2","q":"Qual a 2ª causa de demência pelo ranking da aula?","a":"A mista: Alzheimer + AVC.","sec":"/a/neuro-alzheimer/10","w":"Doença de Alzheimer · Outras demências degenerativas · slide 26"},{"id":"cm2-cardio-taqui-9-0","ch":"cardio-A2","av":"A2","q":"Cite dois antiarrítmicos da profilaxia da TRAV.","a":"Sotalol, propafenona, flecainida ou amiodarona.","sec":"/a/cm2-cardio-taqui/10","w":"Taquiarritmias supraventriculares · TRAV: tratamento · slides 34–37"},{"id":"pa6-cardio-a1-1-2","ch":"provas6-A1","av":"A1","q":"Por que a estenose aórtica causa síncope no esforço?","a":"Débito fixo pela valva não acompanha a vasodilatação do exercício: hipotensão e hipofluxo cerebral.","sec":"/a/pa6-cardio-a1/2","w":"Provas antigas · Cardiologia · Síncope ao esforço com sopro sistólico aórtico","pa":1,"pa6":1},{"id":"pa6-cardio-a2-1-1","ch":"provas6-A2","av":"A2","q":"Causa mais comum de BAVT no idoso sem isquemia?","a":"Degeneração fibrótica do sistema de condução (Lev e Lenègre); no Brasil, lembrar Chagas.","sec":"/a/pa6-cardio-a2/2","w":"Provas antigas · Cardiologia · Idosa com bradicardia extrema e síncope","pa":1,"pa6":1},{"id":"neuro-alzheimer-10-0","ch":"neuro-A2","av":"A2","q":"Biomarcador negativo faz o quê com o diagnóstico de DA?","a":"Exclui DA.","sec":"/a/neuro-alzheimer/11","w":"Doença de Alzheimer · Biomarcadores · slides 27–31"},{"id":"cm2-cardio-taqui-10-0","ch":"cardio-A2","av":"A2","q":"O que fazer na TPSV com instabilidade?","a":"Cardioversão elétrica.","sec":"/a/cm2-cardio-taqui/11","w":"Taquiarritmias supraventriculares · TPSV na emergência · slides 38–39"},{"id":"pa6-cardio-a1-2-0","ch":"provas6-A1","av":"A1","q":"Achado de exame que sugere coarctação da aorta?","a":"PA maior nos braços que nas pernas, pulsos femorais fracos e atrasados, sopro irradiado para o dorso.","sec":"/a/pa6-cardio-a1/3","w":"Provas antigas · Cardiologia · Adolescente com PA maior nos braços que nas pernas","pa":1,"pa6":1},{"id":"pa6-cardio-a2-1-2","ch":"provas6-A2","av":"A2","q":"Tratamento definitivo do BAVT sem causa reversível?","a":"Marca-passo definitivo, em geral de dupla câmara.","sec":"/a/pa6-cardio-a2/2","w":"Provas antigas · Cardiologia · Idosa com bradicardia extrema e síncope","pa":1,"pa6":1},{"id":"neuro-alzheimer-11-0","ch":"neuro-A2","av":"A2","q":"Que três medidas compõem o MTA?","a":"Fissura coroide, corno temporal e altura do hipocampo.","sec":"/a/neuro-alzheimer/12","w":"Doença de Alzheimer · Exames complementares e o escore MTA · slides 32–34"},{"id":"cm2-cardio-taqui-11-0","ch":"cardio-A2","av":"A2","q":"Por que a FC do flutter típico costuma ser 150?","a":"Átrio a 300 bpm com condução AV 2:1.","sec":"/a/cm2-cardio-taqui/12","w":"Taquiarritmias supraventriculares · Flutter atrial: o circuito e o ECG · slides 42–44"},{"id":"pa6-cardio-a1-2-1","ch":"provas6-A1","av":"A1","q":"Sinais radiográficos da coarctação?","a":"Erosão do bordo inferior das costelas (Roesler) e sinal do 3.","sec":"/a/pa6-cardio-a1/3","w":"Provas antigas · Cardiologia · Adolescente com PA maior nos braços que nas pernas","pa":1,"pa6":1},{"id":"pa6-reumato-a2-0-0","ch":"provas6-A2","av":"A2","q":"Características da lombalgia inflamatória?","a":"Início antes dos 40 anos, insidiosa, melhora com exercício, não com repouso, dor noturna e rigidez matinal.","sec":"/a/pa6-reumato-a2/1","w":"Provas antigas · Reumatologia · Lombalgia inflamatória em jovem: espondilite anquilosante","pa":1,"pa6":1},{"id":"neuro-alzheimer-12-0","ch":"neuro-A2","av":"A2","q":"Qual variante da afasia primária progressiva é mais ligada à DA?","a":"A logopênica (86 a 90%).","sec":"/a/neuro-alzheimer/13","w":"Doença de Alzheimer · Alzheimer atípico · slides 35–42"},{"id":"cm2-cardio-taqui-12-0","ch":"cardio-A2","av":"A2","q":"Com quanto tempo o flutter traz risco de tromboembolismo?","a":"Mais de 48 horas.","sec":"/a/cm2-cardio-taqui/13","w":"Taquiarritmias supraventriculares · Flutter atrial: classificação e clínica · slide 48"},{"id":"pa6-cardio-a1-2-2","ch":"provas6-A1","av":"A1","q":"Malformação valvar mais associada à coarctação?","a":"Valva aórtica bicúspide.","sec":"/a/pa6-cardio-a1/3","w":"Provas antigas · Cardiologia · Adolescente com PA maior nos braços que nas pernas","pa":1,"pa6":1},{"id":"pa6-reumato-a2-0-1","ch":"provas6-A2","av":"A2","q":"Dor no calcanhar na espondilite anquilosante é o quê?","a":"Entesite (fáscia plantar ou tendão de Aquiles).","sec":"/a/pa6-reumato-a2/1","w":"Provas antigas · Reumatologia · Lombalgia inflamatória em jovem: espondilite anquilosante","pa":1,"pa6":1},{"id":"neuro-alzheimer-13-0","ch":"neuro-A2","av":"A2","q":"Que proteína define a LATE?","a":"TDP-43.","sec":"/a/neuro-alzheimer/14","w":"Doença de Alzheimer · LATE, PART e outras doenças do idoso muito idoso · slides 43, 54–57"},{"id":"cm2-cardio-taqui-13-0","ch":"cardio-A2","av":"A2","q":"Qual o alvo da ablação do flutter típico?","a":"O istmo cavotricuspídeo.","sec":"/a/cm2-cardio-taqui/14","w":"Taquiarritmias supraventriculares · Flutter atrial: tratamento · slides 45–47, 49"},{"id":"pa6-reumato-a1-0-0","ch":"provas6-A1","av":"A1","q":"Deformidades clássicas da mão na artrite reumatoide?","a":"Desvio ulnar, pescoço de cisne, botoeira, polegar em Z; IFD poupadas.","sec":"/a/pa6-reumato-a1/1","w":"Provas antigas · Reumatologia · Mãos de artrite reumatoide de longa data","pa":1,"pa6":1},{"id":"pa6-reumato-a2-0-2","ch":"provas6-A2","av":"A2","q":"Manifestação extra-articular mais comum da espondilite anquilosante?","a":"Uveíte anterior aguda.","sec":"/a/pa6-reumato-a2/1","w":"Provas antigas · Reumatologia · Lombalgia inflamatória em jovem: espondilite anquilosante","pa":1,"pa6":1},{"id":"neuro-alzheimer-14-0","ch":"neuro-A2","av":"A2","q":"Quais os efeitos colaterais dos IAChE anotados na aula?","a":"Hipotensão postural e anorexia.","sec":"/a/neuro-alzheimer/15","w":"Doença de Alzheimer · Tratamento sintomático · slides 44–46"},{"id":"cm2-cardio-taqui-14-0","ch":"cardio-A2","av":"A2","q":"Qual a pista mais forte de FA no ECG?","a":"RR irregularmente irregular, sem onda P.","sec":"/a/cm2-cardio-taqui/15","w":"Taquiarritmias supraventriculares · Fibrilação atrial: o que é e como aparece no ECG · slides 51–54"},{"id":"pa6-reumato-a1-0-1","ch":"provas6-A1","av":"A1","q":"Rigidez matinal: AR × osteoartrite?","a":"AR: mais de 1 hora. Osteoartrite: menos de 30 minutos.","sec":"/a/pa6-reumato-a1/1","w":"Provas antigas · Reumatologia · Mãos de artrite reumatoide de longa data","pa":1,"pa6":1},{"id":"pa6-reumato-a2-1-0","ch":"provas6-A2","av":"A2","q":"Quadro típico da polimialgia reumática?","a":"Mais de 50 anos, dor e rigidez das cinturas escapular e pélvica, VHS e PCR muito elevadas.","sec":"/a/pa6-reumato-a2/2","w":"Provas antigas · Reumatologia · Idosa com dor nas cinturas e VHS de 108: a 4ª hipótese","pa":1,"pa6":1},{"id":"neuro-alzheimer-15-0","ch":"neuro-A2","av":"A2","q":"Qual o principal efeito adverso dos anticorpos anti-amiloide?","a":"ARIA: edema e micro-hemorragia cerebral.","sec":"/a/neuro-alzheimer/16","w":"Doença de Alzheimer · Anticorpos anti-amiloide · slides 47–49"},{"id":"cm2-cardio-taqui-15-0","ch":"cardio-A2","av":"A2","q":"Que fração dos AVC isquêmicos se deve à FA?","a":"De 20 a 30%.","sec":"/a/cm2-cardio-taqui/16","w":"Taquiarritmias supraventriculares · Fibrilação atrial: epidemiologia e prognóstico · slides 55–56, 61, 63"},{"id":"pa6-reumato-a1-0-2","ch":"provas6-A1","av":"A1","q":"Nódulos de Heberden e Bouchard são de quê?","a":"Osteoartrite (IFD e IFP), não de AR.","sec":"/a/pa6-reumato-a1/1","w":"Provas antigas · Reumatologia · Mãos de artrite reumatoide de longa data","pa":1,"pa6":1},{"id":"pa6-reumato-a2-1-1","ch":"provas6-A2","av":"A2","q":"Tratamento e resposta na polimialgia reumática?","a":"Prednisona 12,5 a 25 mg/dia, com melhora dramática em dias.","sec":"/a/pa6-reumato-a2/2","w":"Provas antigas · Reumatologia · Idosa com dor nas cinturas e VHS de 108: a 4ª hipótese","pa":1,"pa6":1},{"id":"neuro-alzheimer-16-0","ch":"neuro-A2","av":"A2","q":"Qual a 1ª linha para sintomas psiquiátricos na DA?","a":"Donepezila e memantina.","sec":"/a/neuro-alzheimer/17","w":"Doença de Alzheimer · Sintomas psiquiátricos e delirium · slides 50–52"},{"id":"cm2-cardio-taqui-16-0","ch":"cardio-A2","av":"A2","q":"O que é FA permanente?","a":"A FA aceita por paciente e médico, sem novas tentativas de reverter.","sec":"/a/cm2-cardio-taqui/17","w":"Taquiarritmias supraventriculares · Fibrilação atrial: classificação e evolução · slides 62, 65–66"},{"id":"pa6-reumato-a1-1-0","ch":"provas6-A1","av":"A1","q":"Como é o eritema malar do lúpus?","a":"Em asa de borboleta, fotossensível, poupando os sulcos nasolabiais.","sec":"/a/pa6-reumato-a1/2","w":"Provas antigas · Reumatologia · Mulher jovem com artralgia e lesões de pele: lúpus","pa":1,"pa6":1},{"id":"pa6-reumato-a2-1-2","ch":"provas6-A2","av":"A2","q":"Doença associada à polimialgia que é urgência?","a":"Arterite de células gigantes (risco de cegueira).","sec":"/a/pa6-reumato-a2/2","w":"Provas antigas · Reumatologia · Idosa com dor nas cinturas e VHS de 108: a 4ª hipótese","pa":1,"pa6":1},{"id":"neuro-alzheimer-17-0","ch":"neuro-A2","av":"A2","q":"Até quando o tratamento será sintomático?","a":"Até surgirem novas terapias modificadoras.","sec":"/a/neuro-alzheimer/18","w":"Doença de Alzheimer · Conclusões do professor · slide 53"},{"id":"cm2-cardio-taqui-17-0","ch":"cardio-A2","av":"A2","q":"Quantas derivações tem o ECG de bolso do slide?","a":"Seis: DI, DII, DIII, aVR, aVL e aVF.","sec":"/a/cm2-cardio-taqui/18","w":"Taquiarritmias supraventriculares · Detectar a arritmia: do ECG de bolso ao monitor implantável · slides 12–13, 57–60"},{"id":"pa6-reumato-a1-1-1","ch":"provas6-A1","av":"A1","q":"Autoanticorpo mais sensível e mais específico no LES?","a":"Sensível: FAN. Específicos: anti-Sm (o mais) e anti-dsDNA (ligado à nefrite e atividade).","sec":"/a/pa6-reumato-a1/2","w":"Provas antigas · Reumatologia · Mulher jovem com artralgia e lesões de pele: lúpus","pa":1,"pa6":1},{"id":"pa6-reumato-a2-1-3","ch":"provas6-A2","av":"A2","q":"FAN negativo num caso suspeito de LES significa?","a":"Praticamente exclui LES (sensibilidade > 95%).","sec":"/a/pa6-reumato-a2/2","w":"Provas antigas · Reumatologia · Idosa com dor nas cinturas e VHS de 108: a 4ª hipótese","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-18-0","ch":"cardio-A2","av":"A2","q":"Com quantos pontos a ESC 2020 recomenda anticoagular um homem?","a":"Com 2 ou mais.","sec":"/a/cm2-cardio-taqui/19","w":"Taquiarritmias supraventriculares · CHA2DS2-VASc e anticoagulação · slides 64, 67–69"},{"id":"pa6-reumato-a1-1-2","ch":"provas6-A1","av":"A1","q":"Complemento no LES ativo?","a":"C3 e C4 baixos por consumo.","sec":"/a/pa6-reumato-a1/2","w":"Provas antigas · Reumatologia · Mulher jovem com artralgia e lesões de pele: lúpus","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-0-0","ch":"provas6-A2","av":"A2","q":"D-dímero no TEP com alta probabilidade clínica?","a":"Não serve; vai direto à angiotomografia.","sec":"/a/pa6-pneumo-a2/1","w":"Provas antigas · Pneumologia · Dispneia súbita no pós-operatório: TEP","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-19-0","ch":"cardio-A2","av":"A2","q":"Qual a meta de FC em repouso no slide?","a":"De 60 a 80 bpm (menos de 110 no esforço).","sec":"/a/cm2-cardio-taqui/20","w":"Taquiarritmias supraventriculares · Fibrilação atrial: tratamento · slide 70"},{"id":"pa6-pneumo-a1-0-0","ch":"provas6-A1","av":"A1","q":"Quatro perguntas do controle da asma (GINA)?","a":"Sintomas diurnos > 2x/semana, despertar noturno, resgate > 2x/semana, limitação de atividade. 0 = controlada; 1-2 = parcial; 3-4 = não controlada.","sec":"/a/pa6-pneumo-a1/1","w":"Provas antigas · Pneumologia · Asma parcialmente controlada em uso de corticoide inalatório","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-0-1","ch":"provas6-A2","av":"A2","q":"Tratamento imediato do TEP estável?","a":"Anticoagulação já na suspeita alta (HBPM ou HNF), depois anticoagulante oral por pelo menos 3 meses.","sec":"/a/pa6-pneumo-a2/1","w":"Provas antigas · Pneumologia · Dispneia súbita no pós-operatório: TEP","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-20-0","ch":"cardio-A2","av":"A2","q":"De onde vêm os gatilhos da FA?","a":"Das veias pulmonares.","sec":"/a/cm2-cardio-taqui/21","w":"Taquiarritmias supraventriculares · Ablação da FA: isolar as veias pulmonares · slides 71–77"},{"id":"pa6-pneumo-a1-0-1","ch":"provas6-A1","av":"A1","q":"O que é MART na asma?","a":"Corticoide inalatório + formoterol como manutenção e também como resgate.","sec":"/a/pa6-pneumo-a1/1","w":"Provas antigas · Pneumologia · Asma parcialmente controlada em uso de corticoide inalatório","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-0-2","ch":"provas6-A2","av":"A2","q":"Quando trombolisar no TEP?","a":"Só com instabilidade hemodinâmica (choque ou PAS < 90 mmHg).","sec":"/a/pa6-pneumo-a2/1","w":"Provas antigas · Pneumologia · Dispneia súbita no pós-operatório: TEP","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-21-0","ch":"cardio-A2","av":"A2","q":"O que fazer antes de cardioverter uma FA com mais de 48 h?","a":"Anticoagular por 3 semanas ou fazer ETE sem trombo.","sec":"/a/cm2-cardio-taqui/22","w":"Taquiarritmias supraventriculares · FA e flutter na emergência · slide 78"},{"id":"pa6-pneumo-a1-0-2","ch":"provas6-A1","av":"A1","q":"Asma só com SABA em adulto: pode?","a":"Não; a GINA recomenda corticoide inalatório com formoterol desde a etapa 1.","sec":"/a/pa6-pneumo-a1/1","w":"Provas antigas · Pneumologia · Asma parcialmente controlada em uso de corticoide inalatório","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-1-0","ch":"provas6-A2","av":"A2","q":"Esquema básico de tuberculose no adulto?","a":"2RHZE/4RH: 2 meses com rifampicina, isoniazida, pirazinamida e etambutol; 4 meses com rifampicina e isoniazida.","sec":"/a/pa6-pneumo-a2/2","w":"Provas antigas · Pneumologia · Tosse com hemoptise e TRM-TB positivo","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-22-0","ch":"cardio-A2","av":"A2","q":"Quais são as três condições para existir uma reentrada?","a":"Duas vias de condução, bloqueio unidirecional em uma delas e condução lenta na outra.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"pa6-pneumo-a1-1-0","ch":"provas6-A1","av":"A1","q":"Por que a bupropiona é contraindicada na epilepsia?","a":"Reduz o limiar convulsivo.","sec":"/a/pa6-pneumo-a1/2","w":"Provas antigas · Pneumologia · Cessação do tabagismo em paciente com epilepsia","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-1-1","ch":"provas6-A2","av":"A2","q":"O que o TRM-TB informa?","a":"Presença de M. tuberculosis e resistência ou não à rifampicina.","sec":"/a/pa6-pneumo-a2/2","w":"Provas antigas · Pneumologia · Tosse com hemoptise e TRM-TB positivo","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-22-1","ch":"cardio-A2","av":"A2","q":"Qual é a TPSV mais comum e qual a sua proporção?","a":"A taquicardia reentrante nodal AV (TRN), com 60 a 70% das TPSV.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"pa6-pneumo-a1-1-1","ch":"provas6-A1","av":"A1","q":"Mecanismo da vareniclina?","a":"Agonista parcial do receptor nicotínico α4β2: alivia a fissura e bloqueia a recompensa da nicotina.","sec":"/a/pa6-pneumo-a1/2","w":"Provas antigas · Pneumologia · Cessação do tabagismo em paciente com epilepsia","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-1-2","ch":"provas6-A2","av":"A2","q":"Contato assintomático de TB: conduta?","a":"PT ou IGRA e radiografia; sem TB ativa, tratar infecção latente se PT ≥ 5 mm ou IGRA positivo.","sec":"/a/pa6-pneumo-a2/2","w":"Provas antigas · Pneumologia · Tosse com hemoptise e TRM-TB positivo","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-22-2","ch":"cardio-A2","av":"A2","q":"O que é o \"frog sign\"?","a":"A turgência jugular pulsátil na crise de TPSV (típica da TRN), porque o átrio contrai com a tricúspide fechada.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"pa6-pneumo-a1-1-2","ch":"provas6-A1","av":"A1","q":"Fármaco isolado mais eficaz para cessar o tabagismo?","a":"Vareniclina (EAGLES).","sec":"/a/pa6-pneumo-a1/2","w":"Provas antigas · Pneumologia · Cessação do tabagismo em paciente com epilepsia","pa":1,"pa6":1},{"id":"pa6-pneumo-a2-1-3","ch":"provas6-A2","av":"A2","q":"Por que evitar quinolona em tosse arrastada sem diagnóstico?","a":"Pode mascarar e atrasar o diagnóstico de TB e selecionar resistência.","sec":"/a/pa6-pneumo-a2/2","w":"Provas antigas · Pneumologia · Tosse com hemoptise e TRM-TB positivo","pa":1,"pa6":1},{"id":"cm2-cardio-taqui-22-3","ch":"cardio-A2","av":"A2","q":"Onde fica a onda P na crise de TRN e qual o RP'?","a":"No final do QRS (vista em V1), com RP' menor que 70 ms.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-4","ch":"cardio-A2","av":"A2","q":"Onde fica a onda P na crise de TRAV e qual o RP'?","a":"Depois do QRS, separada dele, com RP' maior que 70 ms.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-5","ch":"cardio-A2","av":"A2","q":"O que define a síndrome de Wolff-Parkinson-White?","a":"Pré-excitação ventricular no ECG (PR curto e onda delta) acompanhada de sintomas (taquiarritmia).","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-6","ch":"cardio-A2","av":"A2","q":"Qual a forma mais comum de TRAV e como é o QRS nela?","a":"A ortodrômica (95%), com QRS estreito: desce pelo nó AV e volta pela via acessória.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-7","ch":"cardio-A2","av":"A2","q":"Qual a sequência de tratamento da TPSV estável na emergência?","a":"Manobra vagal, depois adenosina IV (6 mg em bolus rápido), depois verapamil IV (se FE maior que 40%) e, se falhar, cardioversão elétrica.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-8","ch":"cardio-A2","av":"A2","q":"Qual o tratamento curativo da TRN e o da TRAV?","a":"Ablação por cateter: da via lenta na TRN (cerca de 95%) e do feixe anômalo na TRAV (cerca de 94%).","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-9","ch":"cardio-A2","av":"A2","q":"Qual a FC atrial do flutter típico e por que a FC ventricular costuma ser 150?","a":"De 250 a 300 bpm, com condução AV 2:1, o que dá cerca de 150 bpm no ventrículo.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-10","ch":"cardio-A2","av":"A2","q":"Em quais derivações aparecem as ondas F negativas do flutter típico anti-horário?","a":"DII, DIII e aVF (o \"serrilhado\").","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-11","ch":"cardio-A2","av":"A2","q":"Quais os três achados do ECG na fibrilação atrial?","a":"Ausência de onda P, ondas f e intervalos RR irregularmente irregulares.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-12","ch":"cardio-A2","av":"A2","q":"Como se classifica a FA pelo tempo?","a":"Paroxística (menos de 7 dias), persistente (7 dias ou mais), persistente de longa duração (mais de 1 ano) e permanente (sem novas tentativas de reverter).","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-13","ch":"cardio-A2","av":"A2","q":"Quais itens valem 2 pontos no CHA2DS2-VASc?","a":"Idade de 75 anos ou mais e AVC, AIT ou tromboembolismo prévio.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-14","ch":"cardio-A2","av":"A2","q":"Quando se pode cardioverter uma FA sem anticoagulação prévia de 3 semanas?","a":"Se começou há menos de 48 h (ESC 2024: menos de 24 h) ou se o ecocardiograma transesofágico não mostra trombo.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"},{"id":"cm2-cardio-taqui-22-15","ch":"cardio-A2","av":"A2","q":"Qual o alvo da ablação da fibrilação atrial?","a":"O isolamento elétrico das veias pulmonares, onde nascem as extrassístoles que disparam a FA.","sec":"/a/cm2-cardio-taqui/23","w":"Taquiarritmias supraventriculares · Perguntas para revisar"}],"provas":[["cm","Clínica médica"],["pato","Patologia"],["aps","Atenção primária"],["psiq","Psiquiatria"]],"datas":{},"soon":"Reumatologia, Pneumologia, Patologia e Atenção primária entram aqui quando chegarem os slides."};</script>

 "Em 2021 eu vi a razão de mortalidade materna passar de cem por cem mil. Aquilo não era estatística, eram mulheres. É por isso que a banca cobra esse indicador: para você nunca esquecer o que ele mede.",

 "Conheci um prefeito que contava merenda escolar como gasto em saúde para fechar os 15%. A LC 141 não deixa. O Tribunal de Contas também não deixou.",
 "Num surto de sarampo numa creche, a enfermeira me perguntou se 40 em 200 era prevalência. Era taxa de ataque: 20%. Dois anos depois ela passou na residência e me mandou um bolo. O bolo estava ruim, mas o gesto valeu.",
 "Atendi um paciente que achava que o ambulatório de especialidades era porta de entrada do SUS. A culpa não era dele, era de quem ensinou. Porta de entrada é atenção primária, urgência, atenção psicossocial e serviço especial de acesso aberto.",
 "Minha perna dói desde antes de você nascer. Mesmo assim chego ao plantão antes de quem tem as duas boas. Disciplina é isso: ir mesmo quando dói. Revise hoje.",
 "Uma vez um interno me disse que o INAMPS acabou junto com a Lei 8.080. Acabou em 1993, pela Lei 8.689. Ele ainda me deve um café pela aposta. Juros de três décadas."
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* Estado e repetição espaçada (SM-2 adaptado) */
const DAY=86400000,NEW_PER_DAY=20,KEY="medaj-p6-cards-v1";
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/DAY)};
let S={cards:{},days:{},t:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const st=id=>S.cards[id]||{r:0,i:0,e:2.5,due:0,l:0,last:0,seen:0};
function plan(c,q){
  let {r,i,e,l}=c;
  if(q===0) return {r:0,i:0,e:Math.max(1.3,e-.2),l:l+1,again:true};
  const e2=Math.max(1.3,e+(.1-(5-q)*(.08+(5-q)*.02)));
  let i2;
  if(r===0) i2=q===5?4:1;
  else if(r===1) i2=q===3?3:q===4?6:8;
  else i2=Math.max(i+1,Math.round(i*(q===3?1.2:q===4?e2:e2*1.3)));
  return {r:r+1,i:i2,e:e2,l};
}
const fmt=p=>p.again?"agora":p.i===1?"amanhã":p.i<14?p.i+" dias":p.i<60?Math.round(p.i/7)+" sem":Math.round(p.i/30)+" meses";

let deck="all",queue=[],cur=null,shown=false,sess={n:0,ok:0,total:0,streak:0};
const inDeck=c=>deck==="all"||c.ch===deck||c.av===deck;
const isNew=c=>!S.cards[c.id];
const newToday=()=>(S.days[today()]||{}).nw||0;
function counts(filter){
  const t=today(),list=CARDS.filter(filter);
  const due=list.filter(c=>!isNew(c)&&st(c.id).due<=t).length;
  const nw=list.filter(isNew).length;
  return {due,nw,avail:due+Math.min(nw,Math.max(0,NEW_PER_DAY-newToday()))};
}
function build(){
  const t=today(),list=CARDS.filter(inDeck);
  const rev=list.filter(c=>!isNew(c)&&st(c.id).due<=t).sort((a,b)=>st(a.id).due-st(b.id).due);
  const nw=list.filter(isNew).slice(0,Math.max(0,NEW_PER_DAY-newToday()));
  queue=[];while(rev.length||nw.length){if(rev.length)queue.push(rev.shift());if(rev.length)queue.push(rev.shift());if(nw.length)queue.push(nw.shift())}
  sess={n:0,ok:0,total:queue.length,streak:0};
}

/* Tela */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function say(text,story){const b=$("bubble");b.classList.toggle("story",!!story);b.innerHTML=story?`<span class="case">Caso do Dr. Casa</span>${esc(text)}`:esc(text)}
function mood(m){const a=$("avatar");a.classList.remove("raise","smug","tap");void a.getBoundingClientRect();if(m)m.split(" ").forEach(x=>a.classList.add(x))}
function renderDecks(){
  const opts=[["all","Tudo"],...Object.entries(CHAPTERS)];
  $("decks").innerHTML=opts.map(([k,l])=>{const c=counts(x=>k==="all"||x.ch===k||x.av===k);return `<button class="chip" type="button" data-deck="${k}" aria-pressed="${deck===k}">${esc(l)}<span class="n">${c.avail}</span></button>`}).join("");
}
function renderStats(){
  const c=counts(inDeck),d=S.days[today()]||{n:0,ok:0};
  $("s-due").textContent=queue.length+(cur?1:0);
  $("s-new").textContent=c.nw;
  $("s-acc").textContent=d.n?Math.round(100*d.ok/d.n)+"%":"–";
  let s=0,t=today();if(!(S.days[t]&&S.days[t].n))t--;while(S.days[t]&&S.days[t].n){s++;t--}
  $("s-streak").textContent=s;
  $("foot-info").textContent=`${CARDS.length} cartões das apostilas do 6º período`;
}
function renderCard(){
  const el=$("card");
  if(!cur){
    if(sess.total===0){
      el.innerHTML=`<div class="done"><h2>Nada para hoje neste baralho</h2><p>Os cartões que você já estudou voltam na data certa. Cartões novos entram ${NEW_PER_DAY} por dia.</p><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(SAY.empty));
    }else{
      const acc=sess.n?Math.round(100*sess.ok/sess.n):0,tm=counts(inDeck);
      el.innerHTML=`<div class="done"><span class="meta">${esc(deck==="all"?"Tudo":CHAPTERS[deck])}</span><h2>Plantão encerrado</h2><div class="sum"><div><b>${sess.n}</b><span>respostas</span></div><div><b>${acc}%</b><span>de acerto</span></div><div><b>${tm.nw}</b><span>cartões novos ainda na fila</span></div></div><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(acc>=70?SAY.done:SAY.doneBad));mood(acc>=70?"smug":"raise");
    }
    renderStats();return;
  }
  const s=st(cur.id),fresh=isNew(cur),pos=sess.total-queue.length;
  const pct=sess.total?Math.round(100*(pos-1)/sess.total):0;
  let html=`<div class="meta"><span class="tag">${esc(CHAPTERS[cur.ch])}</span>${fresh?'<span class="tag new">novo</span>':""}<span class="pos">${pos} de ${sess.total}</span></div><div class="progress"><i style="width:${pct}%"></i></div><p class="q">${esc(cur.q)}</p>`;
  if(!shown){
    html+=`<div class="spacer"></div><button class="reveal" type="button" data-act="reveal">Mostrar resposta<kbd>espaço</kbd></button>`;
  }else{
    const g=[[0,"Errei"],[3,"Difícil"],[4,"Bom"],[5,"Fácil"]];
    html+=`<div class="ans"><span class="lbl">Resposta</span><p>${esc(cur.a)}</p><a class="read" href="${FILE[cur.ch]||APOSTILA}#${cur.sec}">Ler na apostila: ${esc(cur.w||"")} ↗</a></div><div class="spacer"></div><div class="grades">${g.map(([q,l],k)=>`<button class="grade g${q}" type="button" data-q="${q}"><b>${l}</b><small>${fmt(plan(s,q))} · ${k+1}</small></button>`).join("")}</div>`;
  }
  el.innerHTML=html;renderStats();
}
function next(){cur=queue.shift()||null;shown=false;renderCard();if(cur&&sess.n>0&&Math.random()<.5)say(pick(SAY.ask));}
function grade(q){
  if(!cur||!shown)return;
  const p=plan(st(cur.id),q),t=today(),was=isNew(cur);
  S.cards[cur.id]={r:p.r,i:p.i,e:+p.e.toFixed(2),due:p.again?t:t+p.i,l:p.l,last:Date.now(),seen:(st(cur.id).seen||0)+1};
  const d=S.days[t]||(S.days[t]={n:0,ok:0,nw:0});d.n++;if(q>=3)d.ok++;if(was)d.nw=(d.nw||0)+1;
  sess.n++;if(q>=3){sess.ok++;sess.streak++}else sess.streak=0;
  if(p.again){queue.splice(Math.min(3,queue.length),0,cur);sess.total++}
  if(sess.streak===3||sess.streak===7){say(pick(SAY.streak));mood("smug tap")}
  else{say(pick(SAY["g"+q]));mood(q===0?"raise tap":q===5?"raise":"smug")}
  save();next();renderDecks();
}

/* Salvar: aparelho sempre; conta (claude.ai) quando disponível */
let remote=null,busy=Promise.resolve(),timer=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(timer);timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));busy=busy.then(()=>remote.set(body)).catch(()=>{$("sync").textContent="Não deu para salvar na conta agora. O progresso ficou neste aparelho."})},800)}
}
function merge(o){
  if(!o||!o.cards)return;
  for(const [id,c] of Object.entries(o.cards)){const m=S.cards[id];if(!m||(c.last||0)>(m.last||0))S.cards[id]=c}
  for(const [d,v] of Object.entries(o.days||{})){const m=S.days[d];if(!m||v.n>m.n)S.days[d]=v}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    remote=db.doc("data/users/"+uid+"/drcasa");
    const snap=await remote.get();
    if(snap.exists){merge(snap.data());try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(Object.keys(S.cards).length)save();
    $("sync").textContent="Progresso salvo na sua conta: aparece no celular e no computador.";
    if(!cur||!shown){build();next()}
    renderDecks();
  }catch(e){}
})();

/* Eventos */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-deck],[data-act],[data-q]");if(!b)return;
  if(b.dataset.deck){deck=b.dataset.deck;build();next();renderDecks();say(pick(SAY.hello));return}
  if(b.dataset.act==="reveal"){shown=true;renderCard();say(pick(SAY.reveal));return}
  if(b.dataset.act==="ahead"){const t=today();const pool=CARDS.filter(inDeck).filter(c=>!isNew(c)&&st(c.id).due>t).sort((a,b)=>st(a.id).due-st(b.id).due);const nw=CARDS.filter(inDeck).filter(isNew);queue=pool.concat(nw).slice(0,10);sess={n:0,ok:0,total:queue.length,streak:0};if(!queue.length){say("Não sobrou nada para adiantar. Você zerou o baralho. Vá ler o próximo capítulo.");return}next();say("Adiantando. Ambição é bom, desde que venha acompanhada de sono.");return}
  if(b.dataset.q!==undefined)grade(+b.dataset.q);
});
$("b-case").addEventListener("click",()=>{say(pick(CASES),true);mood("tap")});
$("b-hint").addEventListener("click",()=>{if(!cur){say("Dica: abra a apostila. É onde moram as respostas. Revolucionário, eu sei.");return}say(`Dica: está na seção "${cur.w}" do ${CHAPTERS[cur.ch]}. A resposta eu não dou. Sofrer um pouco também ensina.`);mood("raise")});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if((e.key===" "||e.key==="Enter")&&cur&&!shown&&!e.target.closest("button,a")){e.preventDefault();shown=true;renderCard();say(pick(SAY.reveal));return}
  if(shown&&["1","2","3","4"].includes(e.key)){grade([0,3,4,5][+e.key-1])}
});
$("b-reset").addEventListener("click",()=>{
  const slot=$("reset-slot");
  slot.innerHTML=`<span class="confirm">Apagar todo o progresso? <button class="danger" type="button" id="r-yes">Apagar</button><button type="button" id="r-no">Cancelar</button></span>`;
  $("r-no").onclick=()=>location.reload();
  $("r-yes").onclick=()=>{S={cards:{},days:{},t:Date.now()};save();location.reload()};
});

/* Tema: escuro por padrão */

build();renderDecks();next();say(pick(SAY.hello));
</script>

const AKEY="medaj-"+PER.id+"-av";let ABERTA={};
document.addEventListener("toggle",ev=>{const d=ev.target;if(d.matches&&d.matches("details.mat"))ABERTA[d.dataset.mat]=d.open},true);
let AV=(()=>{let v=null;try{v=localStorage.getItem(AKEY)}catch(e){}return v||(PER.aulas.some(a=>a.av==="A2")?"A2":"A1")})();
function renderApostilas(){
  const el=document.getElementById("v-apostilas");
  if(!PER.grade.length){el.innerHTML=`<p class="soon">${e_(PER.soon)}</p>`;return}
  let h=`<div class="deckbar avbar">${["A1","A2"].map(av=>`<button class="chip" type="button" data-av="${av}" aria-pressed="${AV===av}">${av}<span class="n">${PER.aulas.filter(a=>a.av===av).length}</span></button>`).join("")}</div>`;
  const item=a=>`<div class="bwrap"><a class="bitem${a.pa?" pa":""}" href="${e_(site(a.u))}"><b>${e_(a.t)}</b>${a.s?`<span>${e_(a.s)}</span>`:""}</a><div class="bfoot"><button class="lida" type="button" data-lida="${e_(a.id)}" aria-pressed="false">Marcar como lida</button>${a.refs?`<a class="lida refs" href="${e_(site(a.refs))}">Artigos ↗</a>`:""}</div></div>`;
  for(const [mat,subs] of PER.grade){
    const n=PER.aulas.filter(a=>a.mat===mat&&a.av===AV).length,lid=PER.aulas.filter(a=>a.mat===mat&&a.av===AV&&LIDAS[a.id]).length;
    h+=`<details class="mat"${ABERTA[mat]?" open":""} data-mat="${e_(mat)}"><summary><b>${e_(mat)}</b><span>${n?`${lid} de ${n} lidas`:"em breve"}</span></summary>`;
    /* 28/10: matéria com especialidades = uma fileira de botões; mostra só a especialidade escolhida (pedido dele: mais simples) */
    const nomes=subs.map(x=>x[0]).filter(Boolean),de=sub=>PER.aulas.filter(a=>a.mat===mat&&a.sub===sub&&a.av===AV);
    if(nomes.length>1){let cur=ESP[mat];if(!nomes.includes(cur))cur=nomes.find(x=>de(x).length)||nomes[0];
      h+=`<div class="espbar">${nomes.map(x=>`<button class="chip" type="button" data-esp="${e_(x)}" data-espmat="${e_(mat)}" aria-pressed="${x===cur}">${e_(x)}<span class="n">${de(x).length}</span></button>`).join("")}</div>`;
      const L=de(cur);h+=L.length?`<div class="blist">${L.map(item).join("")}</div>`:`<p class="soon">${e_(cur)} da ${AV}: em breve.</p>`}
    else for(const [sub] of subs){const L=de(sub);
      if(sub)h+=`<span class="disc">${e_(sub)}</span>`;
      h+=L.length?`<div class="blist">${L.map(item).join("")}</div>`:`<p class="soon">Em breve</p>`}
    h+=`</details>`}
  el.innerHTML=h;renderLidas();
}
