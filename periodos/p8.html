ch":"obst-A1","av":"A1","q":"Faixa normal do BCF e quando se ouve com sonar e com Pinard?","a":"110–160 bpm; sonar a partir de 12 sem; Pinard a partir de 18 sem.","sec":"obst/resumos/2/9/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Batimentos cardíacos fetais"},{"id":"ci-abd-hernias-parede-L7","ch":"cirurgia-A1","av":"A1","q":"Cite três fatores predisponentes da hérnia incisional.","a":"Tensão, infecção do sítio cirúrgico, aumento da pressão intra-abdominal (e má cicatrização, idade, tabagismo, emergência, reoperação).","sec":"cirurgia/resumos/2/7/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Hérnia incisional"},{"id":"of-palp-L15","ch":"oftalmo-A1","av":"A1","q":"Qual o princípio da DCR?","a":"Criar uma fístula entre a via lacrimal e a cavidade nasal.","sec":"oftalmo/resumos/1/15/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Dacriocistite crônica e a dacriocistorrinostomia · slides 73–78"},{"id":"or-otites-L0","ch":"otorrino-A1","av":"A1","q":"Qual otite é a vilã do verão e qual é a do inverno?","a":"Verão: otite externa. Inverno: otite média aguda.","sec":"otorrino/resumos/2/0/or-otites","w":"Otologia · Otites · Otite: o que é e as duas vilãs"},{"id":"urg-metabolico-L1","ch":"urg-A1","av":"A1","q":"Quando acrescentar soro glicosado na CAD?","a":"Quando a glicemia cair abaixo de 250 mg/dL.","sec":"urg/resumos/7/1/urg-metabolico","w":"Emergências metabólicas · Cetoacidose: tratamento em quatro frentes"},{"id":"2-vulvovaginites-vaginose-tr-31","ch":"gineco-A1","av":"A1","q":"Prurido intenso sem odor + pseudo-hifas: diagnóstico?","a":"Candidíase.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre2-L0","ch":"obst-A1","av":"A1","q":"Qual exame de glicose se pede na 1ª consulta e qual com 24–28 semanas?","a":"Glicemia de jejum na 1ª consulta; TOTG 75 g com 24–28 semanas.","sec":"obst/resumos/3/0/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Rotina de exames por trimestre"},{"id":"ci-abd-hernias-parede-L8","ch":"cirurgia-A1","av":"A1","q":"O que é perda de domicílio?","a":"Mais de 20 a 30% do conteúdo abdominal no saco herniário.","sec":"cirurgia/resumos/2/8/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Incisional: diagnóstico e tratamento"},{"id":"of-palp-L16","ch":"oftalmo-A1","av":"A1","q":"Qual o tratamento da dacriocistite aguda?","a":"Antibiótico sistêmico, compressas mornas e incisão para alívio.","sec":"oftalmo/resumos/1/16/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Dacriocistite aguda e o mapa final · slides 79–81, 83"},{"id":"or-otites-L1","ch":"otorrino-A1","av":"A1","q":"Qual porção do conduto é mais dolorosa?","a":"A medial (óssea), sem anexos epiteliais.","sec":"otorrino/resumos/2/1/or-otites","w":"Otologia · Otites · Orelha externa: anatomia e inervação"},{"id":"urg-metabolico-L2","ch":"urg-A1","av":"A1","q":"O que dar antes da glicose no etilista?","a":"Tiamina 100 mg IV.","sec":"urg/resumos/7/2/urg-metabolico","w":"Emergências metabólicas · Hipoglicemia"},{"id":"2-vulvovaginites-vaginose-tr-32","ch":"gineco-A1","av":"A1","q":"Corrimento fino com odor, sem leucócitos, clue cells: diagnóstico?","a":"Vaginose bacteriana.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre2-L1","ch":"obst-A1","av":"A1","q":"Rh negativo, Coombs negativo: quando se faz a imunoglobulina anti-D?","a":"Com 28 semanas e até 72 h após o parto se o RN for Rh positivo.","sec":"obst/resumos/3/1/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Tipagem sanguínea e Coombs"},{"id":"ci-abd-hernias-inguinais-L0","ch":"cirurgia-A1","av":"A1","q":"Qual é o risco de hérnia inguinal ao longo da vida no homem e na mulher?","a":"Homem 27 a 43%; mulher 3 a 6%.","sec":"cirurgia/resumos/3/0/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Quem tem e quanto"},{"id":"of-olhov-L0","ch":"oftalmo-A1","av":"A1","q":"O que define a síndrome do olho vermelho?","a":"Inflamação primária ou secundária de qualquer estrutura do segmento anterior, com hiperemia ocular.","sec":"oftalmo/resumos/2/0/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · O que é a síndrome do olho vermelho · slides 1–4"},{"id":"or-otites-L2","ch":"otorrino-A1","av":"A1","q":"Qual o principal agente e o que falta no quadro clínico?","a":"Pseudomonas aeruginosa; não há febre e o estado geral fica preservado.","sec":"otorrino/resumos/2/2/or-otites","w":"Otologia · Otites · Otite externa difusa aguda"},{"id":"urg-metabolico-L3","ch":"urg-A1","av":"A1","q":"O cálcio baixa o potássio?","a":"Não; só estabiliza a membrana do miócito por 30 a 60 min.","sec":"urg/resumos/7/3/urg-metabolico","w":"Emergências metabólicas · Hipercalemia: o ECG manda"},{"id":"2-vulvovaginites-vaginose-tr-33","ch":"gineco-A1","av":"A1","q":"Corrimento com dor pélvica e dor à mobilização do colo: o que afastar?","a":"DIP (não tratar como vaginite simples).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre2-L2","ch":"obst-A1","av":"A1","q":"Glicemia de jejum de 96 na 1ª consulta. Diagnóstico?","a":"Diabetes gestacional (92 a 125). Não precisa de TOTG.","sec":"obst/resumos/3/2/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Glicemia e diabetes gestacional"},{"id":"ci-abd-hernias-inguinais-L1","ch":"cirurgia-A1","av":"A1","q":"A hérnia que sai lateral aos vasos epigástricos é direta ou indireta?","a":"Indireta.","sec":"cirurgia/resumos/3/1/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Os tipos"},{"id":"of-olhov-L1","ch":"oftalmo-A1","av":"A1","q":"Que achados mandam o olho vermelho ao oftalmologista?","a":"Dor forte, baixa visual, pupila alterada, córnea opaca; ex.: ceratite, uveíte, glaucoma agudo.","sec":"oftalmo/resumos/2/1/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Benigno ou perigoso: separando pela gravidade · slides 5–9"},{"id":"or-otites-L3","ch":"otorrino-A1","av":"A1","q":"Que parte do pavilhão a pericondrite poupa?","a":"O lóbulo, que não tem cartilagem.","sec":"otorrino/resumos/2/3/or-otites","w":"Otologia · Otites · Otomicose, furunculose e pericondrite"},{"id":"urg-intox-L0","ch":"urg-A1","av":"A1","q":"Qual a dose de carvão ativado e quando usar?","a":"1 g/kg (máx. 50 g), ingestão recente (até 1 a 2 h), substância que adsorve e via aérea protegida.","sec":"urg/resumos/8/0/urg-intox","w":"Intoxicações · Abordagem do intoxicado"},{"id":"3-fisiologia-do-ciclo-menstr-01","ch":"gineco-A1","av":"A1","q":"O que é polimenorreia e oligomenorreia?","a":"Ciclos < 24 dias e > 35 dias, respectivamente.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L3","ch":"obst-A1","av":"A1","q":"Gestante, VDRL 1/64, duração desconhecida. Tratamento?","a":"Penicilina benzatina 2,4 milhões UI IM 1×/semana por 3 semanas; tratar o parceiro.","sec":"obst/resumos/3/3/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Sífilis"},{"id":"ci-abd-hernias-inguinais-L2","ch":"cirurgia-A1","av":"A1","q":"Qual cirurgia prévia aumenta 4 vezes o risco de hérnia inguinal?","a":"Prostatectomia.","sec":"cirurgia/resumos/3/2/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Fatores de risco"},{"id":"of-olhov-L2","ch":"oftalmo-A1","av":"A1","q":"Quais as três porções da conjuntiva?","a":"Palpebral (aderida ao tarso), fundo de saco e bulbar (sobre a esclera).","sec":"oftalmo/resumos/2/2/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Anatomia da conjuntiva · slides 10–14"},{"id":"or-otites-L4","ch":"otorrino-A1","av":"A1","q":"Qual o tratamento da otite externa necrosante?","a":"Internação e ceftazidima com ciprofloxacino EV por 4 a 8 semanas.","sec":"otorrino/resumos/2/4/or-otites","w":"Otologia · Otites · Otite externa necrosante e herpes zóster ótico"},{"id":"urg-intox-L1","ch":"urg-A1","av":"A1","q":"Como diferenciar anticolinérgico de simpatomimético se ambos têm midríase?","a":"Pela pele: seca no anticolinérgico, suada no simpatomimético.","sec":"urg/resumos/8/1/urg-intox","w":"Intoxicações · As toxíndromes"},{"id":"3-fisiologia-do-ciclo-menstr-02","ch":"gineco-A1","av":"A1","q":"Na Aula 3, o que é hipermenorreia e o que é menorragia?","a":"Hipermenorreia = duração aumentada; menorragia = volume aumentado.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L4","ch":"obst-A1","av":"A1","q":"CV de 600 cópias com 36 semanas. Via de parto e AZT?","a":"Via obstétrica, com AZT EV desde o início do trabalho de parto.","sec":"obst/resumos/3/4/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · HIV"},{"id":"ci-abd-hernias-inguinais-L3","ch":"cirurgia-A1","av":"A1","q":"Qual manobra oblitera o anel interno para diferenciar o tipo de hérnia?","a":"Landivar (dedo fletido).","sec":"cirurgia/resumos/3/3/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Diagnóstico: o exame"},{"id":"of-olhov-L3","ch":"oftalmo-A1","av":"A1","q":"Que secreção sugere vírus e qual sugere bactéria grave?","a":"Aquosa: viral ou alérgica; purulenta: bacteriana aguda severa.","sec":"oftalmo/resumos/2/3/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Conjuntivite: conceito, sintomas e secreção · slides 16–17"},{"id":"or-otites-L5","ch":"otorrino-A1","av":"A1","q":"Quais os três agentes da OMA?","a":"Pneumococo, Haemophilus influenzae e Moraxella catarrhalis.","sec":"otorrino/resumos/2/5/or-otites","w":"Otologia · Otites · Otite média aguda: definição, agentes e epidemiologia"},{"id":"urg-intox-L2","ch":"urg-A1","av":"A1","q":"Qual o alvo da atropinização no organofosforado?","a":"Secar a secreção brônquica (com FC > 80 e PAS > 80), não a pupila.","sec":"urg/resumos/8/2/urg-intox","w":"Intoxicações · Antídotos que o plantonista precisa ter de cabeça"},{"id":"3-fisiologia-do-ciclo-menstr-03","ch":"gineco-A1","av":"A1","q":"Por que o sangue menstrual não coagula?","a":"Não tem fibrinogênio e é fibrinolítico.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L5","ch":"obst-A1","av":"A1","q":"Por que testar HTLV no pré-natal?","a":"A principal via de transmissão vertical é a amamentação; o diagnóstico permite contraindicar o aleitamento.","sec":"obst/resumos/3/5/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · HTLV"},{"id":"ci-abd-hernias-inguinais-L4","ch":"cirurgia-A1","av":"A1","q":"Qual é o padrão-ouro de imagem na hérnia inguinal duvidosa?","a":"RM dinâmica.","sec":"cirurgia/resumos/3/4/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Diagnóstico: quando pedir exame"},{"id":"of-olhov-L4","ch":"oftalmo-A1","av":"A1","q":"Onde aparecem folículos?","a":"Conjuntivites virais, por Chlamydia e tóxicas (colírios para glaucoma).","sec":"oftalmo/resumos/2/4/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Sinais: quemose, folículos, papilas e membranas · slides 15, 18–20"},{"id":"or-otites-L6","ch":"otorrino-A1","av":"A1","q":"Cite dois fatores extrínsecos.","a":"Creche e tabagismo passivo (também mamada deitada, chupeta, falta de vacina).","sec":"otorrino/resumos/2/6/or-otites","w":"Otologia · Otites · Fatores de risco da OMA"},{"id":"urg-intox-L3","ch":"urg-A1","av":"A1","q":"A partir de quantas horas o nível de paracetamol vale no nomograma?","a":"A partir de 4 horas da ingestão.","sec":"urg/resumos/8/3/urg-intox","w":"Intoxicações · Paracetamol: a intoxicação silenciosa"},{"id":"3-fisiologia-do-ciclo-menstr-04","ch":"gineco-A1","av":"A1","q":"Qual fase determina a duração do ciclo?","a":"A folicular (a lútea é fixa em 14 dias).","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L6","ch":"obst-A1","av":"A1","q":"IgG+ e IgM+ com 10 semanas, avidez alta. Conduta?","a":"Infecção anterior à gestação: conduta expectante.","sec":"obst/resumos/3/6/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Toxoplasmose"},{"id":"ci-abd-hernias-inguinais-L5","ch":"cirurgia-A1","av":"A1","q":"O que é S2 na EHS 2023?","a":"Hérnia inguinoescrotal até o meio da coxa.","sec":"cirurgia/resumos/3/5/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Classificação"},{"id":"of-olhov-L5","ch":"oftalmo-A1","av":"A1","q":"Qual o sintoma que mais distingue a alérgica?","a":"Coceira (prurido) intensa.","sec":"oftalmo/resumos/2/5/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Os três tipos lado a lado · slide 21"},{"id":"or-otites-L7","ch":"otorrino-A1","av":"A1","q":"Qual o antibiótico e a dose da aula?","a":"Amoxicilina 50 mg/kg/dia por 10 dias.","sec":"otorrino/resumos/2/7/or-otites","w":"Otologia · Otites · Classificação e tratamento da OMA"},{"id":"urg-prescricao-L0","ch":"urg-A1","av":"A1","q":"Qual a ordem clássica dos itens da prescrição?","a":"Dieta, hidratação, medicações, sintomáticos, cuidados de enfermagem e profilaxias.","sec":"urg/resumos/9/0/urg-prescricao","w":"Prescrição de plantão · A estrutura de uma prescrição"},{"id":"3-fisiologia-do-ciclo-menstr-05","ch":"gineco-A1","av":"A1","q":"Explique a teoria das duas células.","a":"LH na teca produz androgênios; FSH na granulosa ativa a aromatase e converte em estradiol.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L7","ch":"obst-A1","av":"A1","q":"Bacteriúria assintomática na gestante: trata ou não?","a":"Sempre trata (guiada pelo antibiograma) e faz urocultura de controle.","sec":"obst/resumos/3/7/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Infecção urinária"},{"id":"ci-abd-hernias-inguinais-L6","ch":"cirurgia-A1","av":"A1","q":"O que acontece a cada 24 horas de irredutibilidade?","a":"Duplica a chance de estrangulamento.","sec":"cirurgia/resumos/3/6/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Quando operar"},{"id":"of-olhov-L6","ch":"oftalmo-A1","av":"A1","q":"Como é a conjuntivite gonocócica do adulto?","a":"Hiperaguda, pus espesso e abundante, quemose e linfonodo pré-auricular.","sec":"oftalmo/resumos/2/6/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Conjuntivite bacteriana: simples e gonocócica · slides 22–25"},{"id":"or-otites-L8","ch":"otorrino-A1","av":"A1","q":"Quais as complicações da serosa crônica?","a":"Timpanoesclerose e retrações timpânicas.","sec":"otorrino/resumos/2/8/or-otites","w":"Otologia · Otites · Complicações das otites médias"},{"id":"urg-prescricao-L1","ch":"urg-A1","av":"A1","q":"Qual a dose máxima diária de paracetamol?","a":"4 g/dia (3 g se hepatopata ou etilista).","sec":"urg/resumos/9/1/urg-prescricao","w":"Prescrição de plantão · Sintomáticos mais usados (adulto)"},{"id":"3-fisiologia-do-ciclo-menstr-06","ch":"gineco-A1","av":"A1","q":"Como são os pulsos de GnRH na fase folicular e na lútea?","a":"Folicular: frequentes e de baixa amplitude. Lútea: menos frequentes e de maior amplitude.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L8","ch":"obst-A1","av":"A1","q":"Quando se faz o morfológico do 2º trimestre?","a":"Entre 20 e 24 semanas.","sec":"obst/resumos/3/8/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Ultrassonografia"},{"id":"ci-abd-hernias-inguinais-L7","ch":"cirurgia-A1","av":"A1","q":"Qual técnica usa tela por via anterior?","a":"Lichtenstein.","sec":"cirurgia/resumos/3/7/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Técnicas"},{"id":"of-olhov-L7","ch":"oftalmo-A1","av":"A1","q":"Qual o agente mais provável entre 24 h e 5 dias de vida?","a":"Neisseria gonorrhoeae (até 24 h química; 5 a 14 dias clamídia).","sec":"oftalmo/resumos/2/7/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Conjuntivite neonatal · slides 26–28"},{"id":"or-otites-L9","ch":"otorrino-A1","av":"A1","q":"Qual a queixa principal da otite serosa?","a":"Hipoacusia, sem dor e sem febre (\"glue ear\").","sec":"otorrino/resumos/2/9/or-otites","w":"Otologia · Otites · Otite média serosa (secretora)"},{"id":"urg-prescricao-L2","ch":"urg-A1","av":"A1","q":"Qual o volume de água de manutenção por dia no adulto?","a":"Cerca de 25 a 30 mL/kg/dia.","sec":"urg/resumos/9/2/urg-prescricao","w":"Prescrição de plantão · Soro: manutenção e reposição"},{"id":"3-fisiologia-do-ciclo-menstr-07","ch":"gineco-A1","av":"A1","q":"Qual o gatilho do pico de LH?","a":"Estradiol alto e sustentado (~200 pg/mL por ~50 h) → feedback positivo.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L9","ch":"obst-A1","av":"A1","q":"Quem recebe profilaxia intraparto sem precisar de swab?","a":"Quem teve bacteriúria por GBS na gestação ou filho anterior com doença por GBS.","sec":"obst/resumos/3/9/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Estreptococo do grupo B"},{"id":"ci-abd-hernias-inguinais-L8","ch":"cirurgia-A1","av":"A1","q":"O que é inguinodinia?","a":"Dor crônica por mais de 3 meses após a correção da hérnia.","sec":"cirurgia/resumos/3/8/ci-abd-hernias-inguinais","w":"Abdome · Hérnias inguinais · Complicações"},{"id":"of-olhov-L8","ch":"oftalmo-A1","av":"A1","q":"Por quanto tempo o adenovírus é eliminado após o início?","a":"Por 12 dias; o quadro dura 10 a 21 dias.","sec":"oftalmo/resumos/2/8/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Ceratoconjuntivite adenoviral · slides 29–34"},{"id":"or-otites-L10","ch":"otorrino-A1","av":"A1","q":"Com quantos dias sem resolução se indica o tubo?","a":"90 dias (ou alteração auditiva, ou otites de repetição).","sec":"otorrino/resumos/2/10/or-otites","w":"Otologia · Otites · Timpanotomia com tubo de ventilação"},{"id":"3-fisiologia-do-ciclo-menstr-08","ch":"gineco-A1","av":"A1","q":"O que acontece com o folículo em microambiente androgênico?","a":"Atresia.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L10","ch":"obst-A1","av":"A1","q":"Qual a dose de ácido fólico para quem teve filho com DTN?","a":"4 a 5 mg/dia, ao menos 3 meses antes da concepção e no 1º trimestre.","sec":"obst/resumos/3/10/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Suplementos"},{"id":"ci-torax-L0","ch":"cirurgia-A1","av":"A1","q":"Fumante com dor no braço, ptose, miose e anidrose do mesmo lado: onde está o tumor?","a":"No ápice do pulmão (tumor do sulco superior, síndrome de Pancoast).","sec":"cirurgia/resumos/4/0/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Propedêutica: o que o exame físico entrega"},{"id":"of-olhov-L9","ch":"oftalmo-A1","av":"A1","q":"Que porcentagem tem ceratite?","a":"50%; vesículas palpebrais unilaterais.","sec":"oftalmo/resumos/2/9/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Conjuntivite por herpes simples · slides 35–37"},{"id":"or-otites-L11","ch":"otorrino-A1","av":"A1","q":"Qual a pista e o tratamento do colesteatoma?","a":"Otorreia crônica fétida; timpanomastoidectomia.","sec":"otorrino/resumos/2/11/or-otites","w":"Otologia · Otites · Otite média crônica: simples e colesteatomatosa"},{"id":"3-fisiologia-do-ciclo-menstr-09","ch":"gineco-A1","av":"A1","q":"Quando há o número máximo de oócitos e quantos ovulam?","a":"Às 16–20 semanas de gestação (~7 milhões); ~400 ovulam na vida.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L11","ch":"obst-A1","av":"A1","q":"Quais vacinas são de rotina na gestação?","a":"Influenza, COVID-19, dTpa após 20 sem, hepatite B se suscetível, VSR de 28 a 36 sem.","sec":"obst/resumos/3/11/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Vacinas"},{"id":"ci-torax-L1","ch":"cirurgia-A1","av":"A1","q":"Na atelectasia, para que lado vai o mediastino?","a":"Para o lado da lesão, com os espaços intercostais reduzidos.","sec":"cirurgia/resumos/4/1/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Propedêutica: lendo a radiografia"},{"id":"of-olhov-L10","ch":"oftalmo-A1","av":"A1","q":"Quais as duas variantes da alérgica?","a":"Rinoconjuntivite alérgica e ceratoconjuntivite primaveril.","sec":"oftalmo/resumos/2/10/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Conjuntivite alérgica · slides 38–43"},{"id":"or-rino-L0","ch":"otorrino-A1","av":"A1","q":"Como se divide a pirâmide nasal?","a":"Terço superior ósseo e dois terços inferiores cartilaginosos.","sec":"otorrino/resumos/3/0/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Nariz externo e cavidade nasal · slides 2–4"},{"id":"3-fisiologia-do-ciclo-menstr-10","ch":"gineco-A1","av":"A1","q":"A pílula ou a gravidez \"poupam\" folículos?","a":"Não. A atresia continua.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L12","ch":"obst-A1","av":"A1","q":"Cite três drogas categoria X.","a":"Talidomida, isotretinoína, warfarina (também metotrexato e sinvastatina).","sec":"obst/resumos/3/12/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Medicamentos na gestação"},{"id":"ci-torax-L2","ch":"cirurgia-A1","av":"A1","q":"Que exame, junto com a espirometria, estima a função pulmonar depois da ressecção?","a":"Cintilografia pulmonar de perfusão.","sec":"cirurgia/resumos/4/2/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Propedêutica: exames de imagem e de função"},{"id":"of-olhov-L11","ch":"oftalmo-A1","av":"A1","q":"Como se usa o antibiótico tópico na bacteriana?","a":"Por 7 a 10 dias, 4 a 5 vezes ao dia.","sec":"oftalmo/resumos/2/11/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Tratamento geral e da conjuntivite bacteriana · slides 44–46"},{"id":"or-rino-L1","ch":"otorrino-A1","av":"A1","q":"Para onde drenam predominantemente os seios paranasais?","a":"Para o meato médio (complexo ostiomeatal).","sec":"otorrino/resumos/3/1/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Seios paranasais · slide 5"},{"id":"3-fisiologia-do-ciclo-menstr-11","ch":"gineco-A1","av":"A1","q":"Quanto tempo antes da ovulação ocorre o pico de LH?","a":"~36 horas antes.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-pre2-L13","ch":"obst-A1","av":"A1","q":"O que é o plano de parto?","a":"O registro das preferências da gestante (analgesia, posição, acompanhante) e o alinhamento de expectativas.","sec":"obst/resumos/3/13/ob-pre2","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas · Preparo para o parto"},{"id":"ci-torax-L3","ch":"cirurgia-A1","av":"A1","q":"Pneumotórax espontâneo em usuário de drogas: o que pesquisar?","a":"HIV (o RX da aula tinha pneumocistose).","sec":"cirurgia/resumos/4/3/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Propedêutica: procedimentos e vias de acesso"},{"id":"of-olhov-L12","ch":"oftalmo-A1","av":"A1","q":"Quais os efeitos colaterais do corticoide ocular?","a":"Aumento da PIO, catarata e mais herpes e fungos.","sec":"oftalmo/resumos/2/12/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Tratamento da viral e da alérgica, e o perigo do corticoide · slides 47–49"},{"id":"or-rino-L2","ch":"otorrino-A1","av":"A1","q":"Quais seios já existem ao nascimento?","a":"Maxilar e etmoidal.","sec":"otorrino/resumos/3/2/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Desenvolvimento e pneumatização dos seios · slide 6"},{"id":"3-fisiologia-do-ciclo-menstr-12","ch":"gineco-A1","av":"A1","q":"Em que fase da meiose o oócito está na ovulação?","a":"Metáfase II.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L0","ch":"obst-A1","av":"A1","q":"Qual é o maior obstáculo da pelve e a maior estrutura fetal?","a":"O estreito médio (plano 0 de DeLee) e o polo cefálico.","sec":"obst/resumos/4/0/ob-mec","w":"5. Mecanismo de parto · Definição"},{"id":"ci-torax-L4","ch":"cirurgia-A1","av":"A1","q":"Qual compartimento concentra a maioria das massas do mediastino?","a":"O anterior (59%).","sec":"cirurgia/resumos/4/4/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Mediastino: os três compartimentos"},{"id":"of-olhov-L13","ch":"oftalmo-A1","av":"A1","q":"A pinguécula invade a córnea?","a":"Não; é depósito branco-amarelado justalímbico, cirurgia rara.","sec":"oftalmo/resumos/2/13/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Pinguécula · slides 50–52"},{"id":"or-rino-L3","ch":"otorrino-A1","av":"A1","q":"Qual o principal sítio de epistaxe?","a":"A área de Kiesselbach (plexo de Little), no septo anterior.","sec":"otorrino/resumos/3/3/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Vascularização nasal e a área de Kiesselbach · slide 7"},{"id":"3-fisiologia-do-ciclo-menstr-13","ch":"gineco-A1","av":"A1","q":"Por que a libido aumenta no meio do ciclo?","a":"O pico de LH aumenta os androgênios tecais.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L1","ch":"obst-A1","av":"A1","q":"Defina posição fetal.","a":"Relação do dorso fetal com o lado materno (direita/esquerda; na transversa, anterior/posterior).","sec":"obst/resumos/4/1/ob-mec","w":"5. Mecanismo de parto · Estática fetal: as quatro relações"},{"id":"ci-torax-L5","ch":"cirurgia-A1","av":"A1","q":"Quais são os 4 T do mediastino anterior?","a":"Timoma, teratoma, tireoide e \"terrível\" linfoma.","sec":"cirurgia/resumos/4/5/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Mediastino: o que pensar em cada lugar"},{"id":"of-olhov-L14","ch":"oftalmo-A1","av":"A1","q":"Quando operar o pterígio?","a":"Por motivo cosmético ou invasão do eixo visual.","sec":"oftalmo/resumos/2/14/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Pterígio · slides 53–58"},{"id":"or-rino-L4","ch":"otorrino-A1","av":"A1","q":"Por qual nervo chega o parassimpático ao gânglio esfenopalatino?","a":"Nervo vidiano (facial, petroso superficial maior).","sec":"otorrino/resumos/3/4/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Inervação nasal · slide 8"},{"id":"3-fisiologia-do-ciclo-menstr-14","ch":"gineco-A1","av":"A1","q":"O que mantém o corpo lúteo na gravidez e até quando?","a":"hCG, até ~8 semanas.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L2","ch":"obst-A1","av":"A1","q":"Qual diâmetro se apresenta na cabeça fletida e quanto mede?","a":"Suboccipitobregmático, 9,5 cm.","sec":"obst/resumos/4/2/ob-mec","w":"5. Mecanismo de parto · O crânio fetal"},{"id":"ci-torax-L6","ch":"cirurgia-A1","av":"A1","q":"Qual é o principal exame para massa do mediastino, e o que ele não faz?","a":"TC com contraste; não dá o diagnóstico patológico (precisa de biópsia).","sec":"cirurgia/resumos/4/6/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Mediastino: sintomas e diagnóstico"},{"id":"of-olhov-L15","ch":"oftalmo-A1","av":"A1","q":"Quais os tumores malignos da conjuntiva na aula?","a":"Melanoma, sarcoma de Kaposi e linfoma.","sec":"oftalmo/resumos/2/15/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · Tumores da conjuntiva · slides 59–67"},{"id":"or-rino-L5","ch":"otorrino-A1","av":"A1","q":"Para onde o clearance mucociliar leva o muco?","a":"Para a rinofaringe.","sec":"otorrino/resumos/3/5/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Mucosa respiratória e funções do nariz · slides 9–10"},{"id":"3-fisiologia-do-ciclo-menstr-15","ch":"gineco-A1","av":"A1","q":"Ciclo de 40 dias com fase lútea normal: o que está prolongado?","a":"A fase folicular (lútea fixa em 14 dias).","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L3","ch":"obst-A1","av":"A1","q":"No assinclitismo anterior, a sutura sagital fica perto do quê?","a":"Do sacro (o parietal anterior desce primeiro).","sec":"obst/resumos/4/3/ob-mec","w":"5. Mecanismo de parto · Sinclitismo e assinclitismo"},{"id":"ci-torax-L7","ch":"cirurgia-A1","av":"A1","q":"Qual é o tumor mais frequente do mediastino?","a":"O timoma (cerca de 20%).","sec":"cirurgia/resumos/4/7/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Timoma e linfoma"},{"id":"of-olhov-L16","ch":"oftalmo-A1","av":"A1","q":"Que verbo usar para colírio na receita?","a":"Instilar (nunca \"pingar\").","sec":"oftalmo/resumos/2/16/of-olhov","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho · A receita oftalmológica e o fim da aula · slides 68–73"},{"id":"or-rino-L6","ch":"otorrino-A1","av":"A1","q":"O que a rinoscopia anterior avalia?","a":"Septo, conchas inferiores e secreções.","sec":"otorrino/resumos/3/6/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Semiologia: o exame clínico · slide 11"},{"id":"3-fisiologia-do-ciclo-menstr-16","ch":"gineco-A1","av":"A1","q":"Em que dia ovula uma mulher com ciclos de 35 dias?","a":"Por volta do dia 21 (35 − 14).","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L4","ch":"obst-A1","av":"A1","q":"Qual o ponto de referência da apresentação de face?","a":"O mento (símbolo M).","sec":"obst/resumos/4/4/ob-mec","w":"5. Mecanismo de parto · Polo pélvico e referências"},{"id":"ci-torax-L8","ch":"cirurgia-A1","av":"A1","q":"Que marcadores dosar numa massa do mediastino anterior em homem jovem?","a":"β-hCG e alfafetoproteína.","sec":"cirurgia/resumos/4/8/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Células germinativas e tireoide"},{"id":"of-crist-L0","ch":"oftalmo-A1","av":"A1","q":"Qual o poder de refração do cristalino e como ele se nutre?","a":"Cerca de 20 dioptrias; avascular, nutrido pelo humor aquoso e pelo vítreo.","sec":"oftalmo/resumos/3/0/of-crist","w":"Oftalmologia · Distúrbios do cristalino · O cristalino: anatomia em uma lente · slides 2–4"},{"id":"or-rino-L7","ch":"otorrino-A1","av":"A1","q":"Exame de escolha para o complexo ostiomeatal?","a":"TC dos seios da face.","sec":"otorrino/resumos/3/7/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Endoscopia nasal e exames de imagem · slide 12"},{"id":"3-fisiologia-do-ciclo-menstr-17","ch":"gineco-A1","av":"A1","q":"FSH e LH altos com estrogênio baixo: qual compartimento?","a":"II (ovário) — hipogonadismo hipergonadotrófico.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L5","ch":"obst-A1","av":"A1","q":"O zero de DeLee corresponde a qual plano de Hodge?","a":"Ao III plano de Hodge, nas espinhas isquiáticas.","sec":"obst/resumos/4/5/ob-mec","w":"5. Mecanismo de parto · Altura da apresentação: planos de DeLee e de Hodge"},{"id":"ci-torax-L9","ch":"cirurgia-A1","av":"A1","q":"Por que a massa do mediastino posterior pede ressonância?","a":"Para ver se entra no canal medular (tumor em halter).","sec":"cirurgia/resumos/4/9/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Tumores neurogênicos e o mediastino do trauma"},{"id":"of-crist-L1","ch":"oftalmo-A1","av":"A1","q":"Quais as causas de cegueira no Brasil, em ordem?","a":"Catarata, glaucoma, retinopatia diabética e trauma.","sec":"oftalmo/resumos/3/1/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Catarata: o que é e quanto pesa · slides 5–6"},{"id":"or-rino-L8","ch":"otorrino-A1","av":"A1","q":"Qual queixa é alerta de complicação infecciosa dos seios?","a":"Edema da face.","sec":"otorrino/resumos/3/8/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Queixas comuns em rinologia · slide 13"},{"id":"3-fisiologia-do-ciclo-menstr-18","ch":"gineco-A1","av":"A1","q":"FSH e LH baixos com estrogênio baixo: qual compartimento?","a":"III ou IV (hipófise ou hipotálamo) — hipogonadotrófico.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L6","ch":"obst-A1","av":"A1","q":"Lambda à direita e anterior da mãe. Qual a variedade?","a":"ODA (occipito-direita-anterior).","sec":"obst/resumos/4/6/ob-mec","w":"5. Mecanismo de parto · Variedade de posição"},{"id":"ci-torax-L10","ch":"cirurgia-A1","av":"A1","q":"Quem entra no rastreamento de câncer de pulmão no Brasil?","a":"50 a 80 anos, fumante ou ex-fumante há até 15 anos, com 20 anos-maço ou mais, por TC de baixa dose.","sec":"cirurgia/resumos/4/10/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Rastreamento do câncer de pulmão"},{"id":"of-crist-L2","ch":"oftalmo-A1","av":"A1","q":"Quais vias de corticoide causam catarata?","a":"Todas: sistêmico, inalatório e colírio.","sec":"oftalmo/resumos/3/2/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Catarata adquirida: tipos e fatores de risco · slide 7"},{"id":"or-rino-L9","ch":"otorrino-A1","av":"A1","q":"Quais os dois eixos da classificação ARIA?","a":"Frequência (intermitente ou persistente) e gravidade (leve ou moderada/grave).","sec":"otorrino/resumos/3/9/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Rinites: definição e classificação · slide 14"},{"id":"3-fisiologia-do-ciclo-menstr-19","ch":"gineco-A1","av":"A1","q":"FSH aumentado com LH normal/baixo sugere o quê? [Complemento]","a":"Reserva ovariana diminuída / transição menopausal inicial (queda da inibina B).","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L7","ch":"obst-A1","av":"A1","q":"Conjugata diagonal de 12 cm: quanto mede a obstétrica?","a":"10,5 cm (diagonal − 1,5).","sec":"obst/resumos/4/7/ob-mec","w":"5. Mecanismo de parto · O trajeto: a bacia"},{"id":"ci-torax-L11","ch":"cirurgia-A1","av":"A1","q":"Qual tipo periférico dá broncorreia em clara de ovo em não fumante?","a":"Adenocarcinoma lepídico.","sec":"cirurgia/resumos/4/11/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: quem tem risco e onde o tumor nasce"},{"id":"of-crist-L3","ch":"oftalmo-A1","av":"A1","q":"Por que o idoso com catarata volta a ler sem óculos?","a":"A catarata nuclear causa miopização, que compensa a presbiopia.","sec":"oftalmo/resumos/3/3/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Quadro clínico: como o paciente enxerga · slides 8–10"},{"id":"or-rino-L10","ch":"otorrino-A1","av":"A1","q":"O que a citologia nasal mostra na rinite alérgica?","a":"Eosinófilos.","sec":"otorrino/resumos/3/10/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Rinite alérgica: sinais clínicos e diagnóstico · slide 15"},{"id":"3-fisiologia-do-ciclo-menstr-20","ch":"gineco-A1","av":"A1","q":"Lesão das células da teca com FSH normal: o que acontece com o estradiol?","a":"Cai, por falta de substrato androgênico para a aromatase.","sec":"gineco/resumos/2","w":"3. Fisiologia do ciclo menstrual"},{"id":"ob-mec-L8","ch":"obst-A1","av":"A1","q":"Qual o tipo de pelve mais comum e mais favorável?","a":"Ginecoide (~50%, arredondada).","sec":"obst/resumos/4/8/ob-mec","w":"5. Mecanismo de parto · Tipos de pelve (Caldwell-Moloy)"},{"id":"ci-torax-L12","ch":"cirurgia-A1","av":"A1","q":"Pneumonia de repetição no mesmo segmento em fumante: o que pedir?","a":"Broncoscopia.","sec":"cirurgia/resumos/4/12/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: os sintomas da lesão central"},{"id":"of-crist-L4","ch":"oftalmo-A1","av":"A1","q":"O que define a catarata madura?","a":"AV menor que 20/400, leucocoria e cristalino todo opaco.","sec":"oftalmo/resumos/3/4/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Diagnóstico e estágios da catarata · slides 11–12"},{"id":"or-rino-L11","ch":"otorrino-A1","av":"A1","q":"Cite três alterações faciais do respirador bucal.","a":"Face alongada, mandíbula retrognata e palato ogival.","sec":"otorrino/resumos/3/11/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Obstrução nasal e crescimento facial · slide 16"},{"id":"4-amenorreias-01","ch":"gineco-A1","av":"A1","q":"Defina amenorreia primária e secundária (slide).","a":"Primária: 13 anos sem caracteres ou 15 com caracteres. Secundária: 3 meses (regulares) ou 6 meses (irregulares).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-mec-L9","ch":"obst-A1","av":"A1","q":"Qual o tempo acessório que acompanha a descida?","a":"A rotação interna.","sec":"obst/resumos/4/9/ob-mec","w":"5. Mecanismo de parto · Os tempos do mecanismo de parto"},{"id":"ci-torax-L13","ch":"cirurgia-A1","av":"A1","q":"Derrame leitoso por invasão do ducto torácico: o que dosar?","a":"Triglicerídeos (quilotórax).","sec":"cirurgia/resumos/4/13/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: invasão, Pancoast e veia cava"},{"id":"of-crist-L5","ch":"oftalmo-A1","av":"A1","q":"Quando se indica hoje a cirurgia de catarata?","a":"Quando a visão prejudica as atividades diárias.","sec":"oftalmo/resumos/3/5/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Tratamento: só cirurgia, a facectomia · slide 13"},{"id":"or-rino-L12","ch":"otorrino-A1","av":"A1","q":"Qual o principal diferencial com a rinite alérgica?","a":"IgE total e específica negativas (pele e sangue).","sec":"otorrino/resumos/3/12/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Rinites não alérgicas · slide 14"},{"id":"4-amenorreias-02","ch":"gineco-A1","av":"A1","q":"Qual a causa mais comum de amenorreia e sua frequência?","a":"Gravidez, ~70%.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L0","ch":"obst-A1","av":"A1","q":"Quais são os quatro períodos do parto?","a":"Dilatação, expulsivo, dequitação e Greenberg.","sec":"obst/resumos/5/0/ob-parto","w":"6. Assistência ao parto · Definição e os quatro períodos"},{"id":"ci-torax-L14","ch":"cirurgia-A1","av":"A1","q":"Que órgão o PET-scan não avalia bem?","a":"O encéfalo (pede-se RM).","sec":"cirurgia/resumos/4/14/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: paraneoplásicas e metástases"},{"id":"of-crist-L6","ch":"oftalmo-A1","av":"A1","q":"Que exame calcula a lente intraocular?","a":"A biometria (ultrassônica modo A ou a laser).","sec":"oftalmo/resumos/3/6/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Avaliação pré-operatória · slides 14–16"},{"id":"or-rino-L13","ch":"otorrino-A1","av":"A1","q":"Qual classe é a mais eficaz isolada na rinite alérgica?","a":"O corticoide tópico (intranasal).","sec":"otorrino/resumos/3/13/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Tratamento das rinites: as classes · slide 17"},{"id":"4-amenorreias-03","ch":"gineco-A1","av":"A1","q":"Liste os 4 compartimentos.","a":"I útero/vagina; II ovário; III hipófise anterior; IV SNC/hipotálamo.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L1","ch":"obst-A1","av":"A1","q":"1 contração em 10 minutos, colo posterior com 1 cm. Fase?","a":"Fase latente (ou pródromos): reavaliar e dar alta se mantido.","sec":"obst/resumos/5/1/ob-parto","w":"6. Assistência ao parto · Pródromos e fase latente"},{"id":"ci-torax-L15","ch":"cirurgia-A1","av":"A1","q":"Qual N tira o paciente da cirurgia?","a":"N3.","sec":"cirurgia/resumos/4/15/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: diagnóstico e estadiamento"},{"id":"of-crist-L7","ch":"oftalmo-A1","av":"A1","q":"Qual a incisão da facoemulsificação?","a":"2 a 4 mm (a extracapsular usa 10 a 14 mm).","sec":"oftalmo/resumos/3/7/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Técnicas cirúrgicas: facoemulsificação, extracapsular e intracapsular · slides 17–21"},{"id":"or-rino-L14","ch":"otorrino-A1","av":"A1","q":"Em quais rinites o anticolinérgico é +++?","a":"Infecciosas, do idoso e gustativa.","sec":"otorrino/resumos/3/14/or-rino","w":"Rinologia · Anatomia, fisiologia e rinites · Tabela de eficácia por tipo de rinite · slide 17"},{"id":"4-amenorreias-04","ch":"gineco-A1","av":"A1","q":"Radioterapia e quimioterapia causam amenorreia em qual compartimento?","a":"II (ovário).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L2","ch":"obst-A1","av":"A1","q":"Quando começa a fase ativa segundo o slide?","a":"Com 4 cm e 2 contrações em 10 minutos com modificação do colo.","sec":"obst/resumos/5/2/ob-parto","w":"6. Assistência ao parto · 1º período: dilatação"},{"id":"ci-torax-L16","ch":"cirurgia-A1","av":"A1","q":"N2 descoberto na mediastinoscopia: o que vem primeiro?","a":"Quimioterapia neoadjuvante.","sec":"cirurgia/resumos/4/16/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Câncer de pulmão: tratamento"},{"id":"of-crist-L8","ch":"oftalmo-A1","av":"A1","q":"Dor, baixa visual e hipópio dias após a catarata sugerem o quê?","a":"Endoftalmite: urgência, com antibiótico intravítreo.","sec":"oftalmo/resumos/3/8/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Complicações da cirurgia de catarata · slides 22–27"},{"id":"or-sinus-L0","ch":"otorrino-A1","av":"A1","q":"Por que o resfriado comum já é uma rinossinusite?","a":"Porque é inflamação viral da mucosa contínua do nariz e dos seios: uma rinossinusite viral aguda.","sec":"otorrino/resumos/4/0/or-sinus","w":"Rinologia · Rinossinusites agudas · O que é rinossinusite · slides 1–3"},{"id":"4-amenorreias-05","ch":"gineco-A1","av":"A1","q":"Qual a sequência de investigação da amenorreia secundária?","a":"Beta-hCG → TSH e PRL → teste da progesterona → teste E+P → FSH → (teste do GnRH / RNM).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L3","ch":"obst-A1","av":"A1","q":"O que é o tríplice gradiente descendente?","a":"A contração nasce, é mais forte e dura mais no fundo uterino.","sec":"obst/resumos/5/3/ob-parto","w":"6. Assistência ao parto · Fisiologia da contração"},{"id":"ci-torax-L18","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no pneumotórax de um piloto?","a":"Videotoracoscopia com tratamento definitivo (pleurectomia ou pleurodese).","sec":"cirurgia/resumos/4/18/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Pneumotórax"},{"id":"of-crist-L9","ch":"oftalmo-A1","av":"A1","q":"Existe prevenção efetiva da catarata?","a":"Não; recomenda-se proteção UV, parar de fumar e controlar o diabetes.","sec":"oftalmo/resumos/3/9/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Prevenção da catarata · slide 28"},{"id":"or-sinus-L1","ch":"otorrino-A1","av":"A1","q":"Até quando a rinossinusite é aguda pela ABR e pelo EPOS?","a":"Até 12 semanas; crônica com 12 semanas ou mais (AAO-HNSF: aguda até 4, subaguda 4 a 12).","sec":"otorrino/resumos/4/1/or-sinus","w":"Rinologia · Rinossinusites agudas · Classificação temporal: aguda × crônica · slides 4, 19"},{"id":"4-amenorreias-06","ch":"gineco-A1","av":"A1","q":"Teste da progesterona positivo significa?","a":"Endométrio estrogenizado e trato pérvio: anovulação crônica (ex.: SOP).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L4","ch":"obst-A1","av":"A1","q":"Cite duas condutas recomendadas e duas proscritas no 1º período.","a":"Recomendadas: deambulação e analgesia a pedido. Proscritas: tricotomia e enteroclisma.","sec":"obst/resumos/5/4/ob-parto","w":"6. Assistência ao parto · Condutas no 1º período"},{"id":"ci-torax-L19","ch":"cirurgia-A1","av":"A1","q":"Qual biópsia confirma a tuberculose pleural?","a":"Biópsia pleural com agulha de Cope.","sec":"cirurgia/resumos/4/19/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Derrame pleural, empiema e tuberculose pleural"},{"id":"of-crist-L10","ch":"oftalmo-A1","av":"A1","q":"Qual a principal doença associada e o maior risco de atrasar o tratamento?","a":"Rubéola; ambliopia.","sec":"oftalmo/resumos/3/10/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Catarata congênita · slides 29–34"},{"id":"or-sinus-L2","ch":"otorrino-A1","av":"A1","q":"Quais os quatro subtipos e quantos adultos com RSAV viram bacterianos?","a":"Viral, viral prolongada, bacteriana e recorrente; só 0,5 a 2% dos adultos (5 a 13% das crianças).","sec":"otorrino/resumos/4/2/or-sinus","w":"Rinologia · Rinossinusites agudas · Os quatro subtipos e a epidemiologia · slides 5–6"},{"id":"4-amenorreias-07","ch":"gineco-A1","av":"A1","q":"Teste E+P negativo indica?","a":"Causa estrutural uterina (ex.: Asherman) → HSG ou histeroscopia.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L5","ch":"obst-A1","av":"A1","q":"Duração máxima do expulsivo em primíparas e multíparas (slide)?","a":"Até 2 h e 1 h, mais 1 h com analgesia.","sec":"obst/resumos/5/5/ob-parto","w":"6. Assistência ao parto · 2º período: expulsivo"},{"id":"ci-torax-L20","ch":"cirurgia-A1","av":"A1","q":"Qual fungo se pega em grutas?","a":"Histoplasma (histoplasmose).","sec":"cirurgia/resumos/4/20/ci-torax","w":"Tórax · Propedêutica, mediastino, pulmão e pleura · Abscesso e fungos"},{"id":"of-crist-L11","ch":"oftalmo-A1","av":"A1","q":"Qual a causa mais comum de catarata secundária?","a":"Uveíte anterior crônica.","sec":"oftalmo/resumos/3/11/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Catarata traumática e catarata secundária · slides 35–39"},{"id":"or-sinus-L3","ch":"otorrino-A1","av":"A1","q":"Quais sintomas fecham RSA?","a":"Dois ou mais por até 12 semanas: obstrução, rinorreia, dor facial, redução do olfato (tosse na criança).","sec":"otorrino/resumos/4/3/or-sinus","w":"Rinologia · Rinossinusites agudas · Critérios diagnósticos: o Quadro 2.1 da ABR · slide 7"},{"id":"4-amenorreias-08","ch":"gineco-A1","av":"A1","q":"Teste E+P positivo exclui o quê?","a":"Causas anatômicas (útero e vagina). Próximo passo: FSH.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L6","ch":"obst-A1","av":"A1","q":"Por que as posições verticais ajudam?","a":"Gravidade, contração mais eficaz, puxo melhor e retropulsão do cóccix.","sec":"obst/resumos/5/6/ob-parto","w":"6. Assistência ao parto · Posição no expulsivo"},{"id":"ci-coloprocto-L0","ch":"cirurgia-A1","av":"A1","q":"Que achado nas fezes a aula marca como sinal de alarme?","a":"Muco.","sec":"cirurgia/resumos/5/0/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Propedêutica: a anamnese"},{"id":"of-crist-L12","ch":"oftalmo-A1","av":"A1","q":"Qual a diferença entre luxado e subluxado?","a":"Luxado: fora da área pupilar. Subluxado: parcialmente deslocado, ainda na pupila.","sec":"oftalmo/resumos/3/12/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Ectopia do cristalino: luxação e subluxação · slide 40"},{"id":"or-sinus-L4","ch":"otorrino-A1","av":"A1","q":"Quais os 5 sinais de RSA bacteriana?","a":"Secreção amarelada unilateral, dor intensa unilateral, febre acima de 38 °C, PCR/VHS altos e dupla piora (precisa de 3).","sec":"otorrino/resumos/4/4/or-sinus","w":"Rinologia · Rinossinusites agudas · Viral × bacteriana: os cinco sinais · slide 8"},{"id":"4-amenorreias-09","ch":"gineco-A1","av":"A1","q":"FSH alto após E+P positivo indica? E baixo?","a":"Alto: compartimento II (ovário). Baixo: III ou IV (central).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L7","ch":"obst-A1","av":"A1","q":"Qual ombro sai primeiro?","a":"O anterior, sob o púbis; depois o posterior.","sec":"obst/resumos/5/7/ob-parto","w":"6. Assistência ao parto · Proteção do períneo, cordão e ombros"},{"id":"ci-coloprocto-L1","ch":"cirurgia-A1","av":"A1","q":"Coágulo no sangramento anal significa o quê?","a":"Sangramento ativo.","sec":"cirurgia/resumos/5/1/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Propedêutica: o sangramento"},{"id":"of-crist-L13","ch":"oftalmo-A1","av":"A1","q":"Para onde subluxa o cristalino no Marfan?","a":"Para cima, bilateral e simétrico.","sec":"oftalmo/resumos/3/13/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Síndrome de Marfan · slides 41–45"},{"id":"or-sinus-L5","ch":"otorrino-A1","av":"A1","q":"Qual a curva da RSA bacteriana?","a":"Dupla piora por volta do 5º dia ou quadro intenso mantido além de 10 a 14 dias.","sec":"otorrino/resumos/4/5/or-sinus","w":"Rinologia · Rinossinusites agudas · A curva dos sintomas · slide 9"},{"id":"4-amenorreias-10","ch":"gineco-A1","av":"A1","q":"Como o teste do GnRH diferencia hipotálamo de hipófise?","a":"Se as gonadotrofinas sobem = hipotálamo; se não sobem = hipófise.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L8","ch":"obst-A1","av":"A1","q":"Quais os passos do manejo ativo do 3º período?","a":"Ocitocina 10 UI IM, clampeamento em 1–3 min, tração controlada do cordão e avaliação do tônus uterino.","sec":"obst/resumos/5/8/ob-parto","w":"6. Assistência ao parto · 3º período: dequitação"},{"id":"ci-coloprocto-L2","ch":"cirurgia-A1","av":"A1","q":"Em que posição se faz o exame proctológico hoje?","a":"Decúbito lateral esquerdo (Sims).","sec":"cirurgia/resumos/5/2/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Propedêutica: o exame físico e a posição"},{"id":"of-crist-L14","ch":"oftalmo-A1","av":"A1","q":"Para onde subluxa o cristalino nessas duas síndromes?","a":"Para baixo nas duas; no Weill-Marchesani com microesferofacia.","sec":"oftalmo/resumos/3/14/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Weill-Marchesani e homocistinúria · slides 46–49"},{"id":"or-sinus-L6","ch":"otorrino-A1","av":"A1","q":"Como a ABR define RSA recorrente?","a":"4 ou mais episódios de RSAB por ano, com normalidade comprovada entre as crises.","sec":"otorrino/resumos/4/6/or-sinus","w":"Rinologia · Rinossinusites agudas · Rinossinusite aguda recorrente · slide 10"},{"id":"4-amenorreias-11","ch":"gineco-A1","av":"A1","q":"Critérios de IOP do slide?","a":"< 40 anos com FSH > 25 mUI/mL em duas dosagens.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L9","ch":"obst-A1","av":"A1","q":"Qual a principal causa de hemorragia pós-parto?","a":"Atonia uterina (tônus), cerca de 70%.","sec":"obst/resumos/5/9/ob-parto","w":"6. Assistência ao parto · 4º período: Greenberg"},{"id":"ci-coloprocto-L3","ch":"cirurgia-A1","av":"A1","q":"Fezes endurecidas no dedo de luva indicam o quê?","a":"Constipação (não se esperam fezes no reto).","sec":"cirurgia/resumos/5/3/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Propedêutica: inspeção e toque retal"},{"id":"of-crist-L15","ch":"oftalmo-A1","av":"A1","q":"Qual a origem do coloboma?","a":"Fechamento deficiente da fissura embrionária (1º ou 2º mês de gestação).","sec":"oftalmo/resumos/3/15/of-crist","w":"Oftalmologia · Distúrbios do cristalino · Coloboma de cristalino · slides 50–52"},{"id":"or-sinus-L7","ch":"otorrino-A1","av":"A1","q":"Quando pedir exame de imagem?","a":"Só na suspeita de complicação ou de diagnóstico alternativo.","sec":"otorrino/resumos/4/7/or-sinus","w":"Rinologia · Rinossinusites agudas · Exames complementares: só quando foge do típico · slide 11"},{"id":"4-amenorreias-12","ch":"gineco-A1","av":"A1","q":"Prolactina acima de quanto sugere tumor e qual o tratamento?","a":"> 100; cabergolina ou bromocriptina.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L10","ch":"obst-A1","av":"A1","q":"Bishop 4 em gestante sem cicatriz. Como induzir?","a":"Amadurecer o colo primeiro (misoprostol 25 mcg vaginal 6/6 h ou Foley) e depois ocitocina.","sec":"obst/resumos/5/10/ob-parto","w":"6. Assistência ao parto · Indução do parto"},{"id":"ci-coloprocto-L4","ch":"cirurgia-A1","av":"A1","q":"O que marca a 2ª válvula de Houston?","a":"A reflexão peritoneal.","sec":"cirurgia/resumos/5/4/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Anatomia: canal anal e reto"},{"id":"of-crist-L16","ch":"oftalmo-A1","av":"A1","q":"Quais alterações oculares graves das arboviroses reduzem a visão?","a":"Neurite óptica e alterações maculares (e glaucoma agudo bilateral).","sec":"oftalmo/resumos/3/16/of-crist","w":"Oftalmologia · Distúrbios do cristalino · O olho na dengue e na Zika · slides 53–65"},{"id":"or-sinus-L8","ch":"otorrino-A1","av":"A1","q":"Qual a janela do oseltamivir e do nirmatrelvir com ritonavir?","a":"Oseltamivir até 48 horas; nirmatrelvir + ritonavir até 5 dias do início.","sec":"otorrino/resumos/4/8/or-sinus","w":"Rinologia · Rinossinusites agudas · Princípios do tratamento e antivirais · slide 12"},{"id":"4-amenorreias-13","ch":"gineco-A1","av":"A1","q":"Tratamento do Asherman?","a":"Lise das aderências por histeroscopia + DIU.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L11","ch":"obst-A1","av":"A1","q":"Dilatação parada por 2 h com boa dinâmica. Diagnóstico?","a":"Parada secundária da dilatação, típica de desproporção cefalopélvica.","sec":"obst/resumos/5/11/ob-parto","w":"6. Assistência ao parto · Partograma"},{"id":"ci-coloprocto-L5","ch":"cirurgia-A1","av":"A1","q":"Qual artéria nunca se liga na colectomia?","a":"A mesentérica superior (irriga o delgado).","sec":"cirurgia/resumos/5/5/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Anatomia: artérias e veias do cólon"},{"id":"of-anat-01","ch":"oftalmo-A1","av":"A1","q":"Quais são o formato, o volume e o número de ossos da órbita?","a":"Cônica, cerca de 27 mL, pirâmide de 7 ossos (frontal, esfenoide, zigomático, maxilar, palatino, etmoide e lacrimal).","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L9","ch":"otorrino-A1","av":"A1","q":"Quando a ABR indica antibiótico?","a":"Só na RSAB inequívoca e grave; na moderada, espera cuidadosa por 48 a 72 h; nunca na viral.","sec":"otorrino/resumos/4/9/or-sinus","w":"Rinologia · Rinossinusites agudas · Antibiótico: quando tratar · slide 13"},{"id":"4-amenorreias-14","ch":"gineco-A1","av":"A1","q":"Mamas e pelos normais, sem útero, 46,XX: diagnóstico?","a":"MRKH.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-parto-L12","ch":"obst-A1","av":"A1","q":"Qual período tem o maior risco de hemorragia?","a":"O 4º período (Greenberg), a primeira hora pós-parto.","sec":"obst/resumos/5/12/ob-parto","w":"6. Assistência ao parto · Conclusões do professor"},{"id":"ci-coloprocto-L6","ch":"cirurgia-A1","av":"A1","q":"Qual exame estadia o câncer de reto na pelve?","a":"Ressonância magnética da pelve.","sec":"cirurgia/resumos/5/6/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Exames de imagem"},{"id":"of-anat-02","ch":"oftalmo-A1","av":"A1","q":"Qual nervo inerva cada músculo extraocular?","a":"Oblíquo superior pelo IV par (troclear), reto lateral pelo VI (abducente); todos os outros pelo III (oculomotor). Macete: OS4, RL6.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L10","ch":"otorrino-A1","av":"A1","q":"Qual a dose de amoxicilina no adulto?","a":"500 mg 8/8 h ou 875 mg 12/12 h, por 7 a 10 dias.","sec":"otorrino/resumos/4/10/or-sinus","w":"Rinologia · Rinossinusites agudas · Esquemas antibióticos no adulto · slide 14"},{"id":"4-amenorreias-15","ch":"gineco-A1","av":"A1","q":"Mamas normais, sem pelos, 46,XY, hérnia inguinal: diagnóstico e conduta?","a":"Morris (insensibilidade androgênica); gonadectomia + estrogênio.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-01","ch":"obst-A1","av":"A1","q":"(Pergunta 1 do slide) Liste os sinais e sintomas de presunção da Sônia.","a":"Sinais: atraso menstrual, congestão mamária, hipertrofia das glândulas sebáceas mamárias (Montgomery) e aréola secundária bem desenvolvida (Hunter). Sintomas: náuseas e mastalgia. Constipação, dispneia, lombalgia e edema também são queixas compatíveis, mas o gabarito do slide cita náusea e mastalgia.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L7","ch":"cirurgia-A1","av":"A1","q":"A colonoscopia é invasiva?","a":"Sim: sedação, preparo e risco de perfuração.","sec":"cirurgia/resumos/5/7/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Colonoscopia"},{"id":"of-anat-03","ch":"oftalmo-A1","av":"A1","q":"De onde vem a artéria oftálmica e quais são seus ramos principais?","a":"Da carótida interna; ramos: artéria central da retina, ciliares posteriores e ciliares anteriores.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L11","ch":"otorrino-A1","av":"A1","q":"Qual a dose de amoxicilina na criança com suspeita de pneumococo resistente?","a":"90 mg/kg/dia, 8/8 h ou 12/12 h, por 7 a 10 dias.","sec":"otorrino/resumos/4/11/or-sinus","w":"Rinologia · Rinossinusites agudas · Esquemas antibióticos na criança · slide 15"},{"id":"4-amenorreias-16","ch":"gineco-A1","av":"A1","q":"Amenorreia primária + anosmia: diagnóstico?","a":"Kallmann.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-02","ch":"obst-A1","av":"A1","q":"(Pergunta 2 do slide) Liste os sinais de probabilidade.","a":"Arroxeamento da mucosa vulvar e vaginal; amolecimento da cérvice; útero aumentado de volume e abaulado à esquerda.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L8","ch":"cirurgia-A1","av":"A1","q":"Que fração dos casos novos é esporádica?","a":"75%.","sec":"cirurgia/resumos/5/8/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Rastreamento: prevenção e risco"},{"id":"of-anat-04","ch":"oftalmo-A1","av":"A1","q":"Para onde drenam as veias oftálmicas e a veia central da retina?","a":"Para o seio cavernoso. As 4 veias vorticosas drenam a úvea para as veias oftálmicas.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L12","ch":"otorrino-A1","av":"A1","q":"Quando se usa corticoide IM de depósito na RSA?","a":"Nunca, em nenhum tipo de RSA.","sec":"otorrino/resumos/4/12/or-sinus","w":"Rinologia · Rinossinusites agudas · Corticoides sistêmicos e nasais · slide 16"},{"id":"4-amenorreias-17","ch":"gineco-A1","av":"A1","q":"Por que Turner tem pubarca normal?","a":"Os androgênios adrenais não dependem do ovário.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-03","ch":"obst-A1","av":"A1","q":"(Pergunta 3 do slide) Cite o epônimo de cada sinal do exame físico.","a":"Goodell (cérvice amolecida) · Piskacek (útero abaulado à esquerda) · Hunter (aréola secundária) · tubérculos de Montgomery (glândulas sebáceas hipertrofiadas) · Jacquemier (vulva arroxeada) · Kluge (mucosa vaginal arroxeada).","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L9","ch":"cirurgia-A1","av":"A1","q":"Sangue oculto positivo: qual é a conduta?","a":"Colonoscopia.","sec":"cirurgia/resumos/5/9/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Rastreamento: os testes e os intervalos"},{"id":"of-anat-05","ch":"oftalmo-A1","av":"A1","q":"Qual a ação do oblíquo superior com o olho aduzido e abduzido?","a":"Aduzido: depressão. Abduzido: intorção. Na PPO: depressão, abdução e intorção.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L13","ch":"otorrino-A1","av":"A1","q":"Por que preferir lavagem de baixo volume e baixa pressão?","a":"Alto volume e alta pressão podem levar líquido à orelha média.","sec":"otorrino/resumos/4/13/or-sinus","w":"Rinologia · Rinossinusites agudas · Salinas, sintomáticos e terapias adjuvantes · slide 17"},{"id":"4-amenorreias-18","ch":"gineco-A1","av":"A1","q":"Hemorragia no parto e não conseguiu amamentar: diagnóstico?","a":"Sheehan.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-04","ch":"obst-A1","av":"A1","q":"Por que se dosa a subunidade beta do hCG, e não a alfa?","a":"A alfa é igual à do LH, FSH e TSH; a beta é específica da gonadotrofina coriônica.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L10","ch":"cirurgia-A1","av":"A1","q":"Com pai que teve câncer colorretal, quando começar o rastreamento?","a":"Colonoscopia aos 40 anos.","sec":"cirurgia/resumos/5/10/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Rastreamento: alto risco"},{"id":"of-anat-06","ch":"oftalmo-A1","av":"A1","q":"Qual a inervação dos músculos da pálpebra?","a":"Elevador: III par; Müller (tarsal superior) e társico inferior: simpático; orbicular: VII par.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L14","ch":"otorrino-A1","av":"A1","q":"A que antibiótico o H. influenzae é 100% sensível no SIREVA 2023?","a":"À ceftriaxona.","sec":"otorrino/resumos/4/14/or-sinus","w":"Rinologia · Rinossinusites agudas · Resistência bacteriana: a tabela do SIREVA · slide 18"},{"id":"4-amenorreias-19","ch":"gineco-A1","av":"A1","q":"Curetagem prévia + E+P negativo: diagnóstico e exame?","a":"Asherman; histeroscopia ou HSG.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-05","ch":"obst-A1","av":"A1","q":"Quando o hCG fica detectável, quanto ele sobe no começo e quando faz pico?","a":"Cerca de 6 dias após a fecundação; dobra a cada ~48 h (2 a 3 dias); pico perto de 8 semanas.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L11","ch":"cirurgia-A1","av":"A1","q":"Dor anal com febre: qual é a hipótese?","a":"Abscesso anal.","sec":"cirurgia/resumos/5/11/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Da prova antiga: doenças orificiais e diverticulite"},{"id":"of-anat-07","ch":"oftalmo-A1","av":"A1","q":"Qual o caminho da lágrima?","a":"Glândula lacrimal → superfície do olho → pontos lacrimais → canalículos → saco lacrimal → ducto nasolacrimal → nariz.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-sinus-L15","ch":"otorrino-A1","av":"A1","q":"Por que a infecção do seio chega à órbita?","a":"Por fluxo venoso retrógrado num sistema avalvular.","sec":"otorrino/resumos/4/15/or-sinus","w":"Rinologia · Rinossinusites agudas · Complicações e sinais de alarme · slide 18"},{"id":"4-amenorreias-20","ch":"gineco-A1","av":"A1","q":"Corredora, IMC 18, FSH/LH baixos, PRL normal: diagnóstico?","a":"Amenorreia hipotalâmica funcional.","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-06","ch":"obst-A1","av":"A1","q":"Qual a sequência de estruturas no USG transvaginal e em que semanas?","a":"Saco gestacional (4 sem) → vesícula vitelínica (5 sem) → embrião (6 sem), depois atividade cardíaca.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-coloprocto-L12","ch":"cirurgia-A1","av":"A1","q":"Tumor que invade órgão vizinho é qual T?","a":"T4 (T4b).","sec":"cirurgia/resumos/5/12/ci-coloprocto","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento · Da prova antiga: câncer colorretal e estadiamento"},{"id":"of-anat-08","ch":"oftalmo-A1","av":"A1","q":"Quais são as três túnicas do olho e o que forma cada uma?","a":"Externa fibrosa (córnea e esclera); média vascular ou úvea (coroide, corpo ciliar, íris); interna nervosa (retina).","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-01","ch":"otorrino-A1","av":"A1","q":"Weber lateraliza para a direita e o Rinne é negativo à direita. Que perda é essa?","a":"Perda condutiva à direita: na condutiva o Weber vai para o lado da perda e o Rinne fica negativo (aérea menor que óssea).","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"4-amenorreias-21","ch":"gineco-A1","av":"A1","q":"Mulher de 34 anos tratada com quimiorradiação para câncer de colo evolui com amenorreia: padrão hormonal e compartimento?","a":"FSH e LH altos, estradiol baixo: insuficiência ovariana (compartimento II), causa citada no slide (irradiação pélvica/QT).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-07","ch":"obst-A1","av":"A1","q":"Qual o parâmetro mais preciso de datação e em que intervalo?","a":"CCN, entre 6 e 14 semanas.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L0","ch":"cirurgia-A1","av":"A1","q":"A aorta e a carótida comum são artérias elásticas ou musculares?","a":"Elásticas (lamelas elásticas circulares).","sec":"cirurgia/resumos/6/0/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Fisiologia: a parede e os tipos de artéria"},{"id":"of-anat-09","ch":"oftalmo-A1","av":"A1","q":"Quais são as cinco camadas da córnea, de fora para dentro?","a":"Epitélio, membrana de Bowman, estroma, membrana de Descemet e endotélio.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-02","ch":"otorrino-A1","av":"A1","q":"Weber lateraliza para a direita e o Rinne é positivo dos dois lados. Que perda é essa?","a":"Perda neurossensorial à esquerda: na neurossensorial o Weber vai para o lado bom e o Rinne continua positivo.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"4-amenorreias-22","ch":"gineco-A1","av":"A1","q":"Amenorreia com dor cíclica após conização: mecanismo? [Complemento]","a":"Estenose cervical com hematometra (compartimento I).","sec":"gineco/resumos/3","w":"4. Amenorreias"},{"id":"ob-diag-08","ch":"obst-A1","av":"A1","q":"DUM e USG discordam. Quando você troca a IG pela do USG?","a":"Quando a diferença passa de 1 semana; se for menor, mantém a DUM.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L1","ch":"cirurgia-A1","av":"A1","q":"Quem faz a principal resistência periférica ao fluxo?","a":"As arteríolas e os esfíncteres pré-capilares.","sec":"cirurgia/resumos/6/1/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Fisiologia: os vasos por função e a inervação"},{"id":"of-anat-10","ch":"oftalmo-A1","av":"A1","q":"Quais as medidas da córnea normal e os limites de megalo e microcórnea?","a":"Diâmetro 11,6 mm horizontal e 10,6 mm vertical; espessura 0,52 mm no centro e 1,0 mm na periferia. Megalocórnea acima de 12,5 mm; microcórnea abaixo de 11,0 mm.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-03","ch":"otorrino-A1","av":"A1","q":"Como se faz o teste de Rinne?","a":"Diapasão na apófise mastoide até o paciente deixar de ouvir; depois na frente do trago, sem tocar. Positivo: aérea maior que óssea; negativo: aérea menor que óssea.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-01","ch":"gineco-A1","av":"A1","q":"Quais são os agentes principais da DIP?","a":"Neisseria gonorrhoeae e Chlamydia trachomatis.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-09","ch":"obst-A1","av":"A1","q":"Por que a amenorreia é o primeiro sinal da gravidez? Explique o mecanismo.","a":"O sinciciotrofoblasto produz hCG, que mantém o corpo lúteo produzindo progesterona; o endométrio não descama.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L2","ch":"cirurgia-A1","av":"A1","q":"O que impede o sangue venoso de voltar para baixo quando a panturrilha relaxa?","a":"As valvas venosas.","sec":"cirurgia/resumos/6/2/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Retorno venoso: quem empurra e quem puxa"},{"id":"of-anat-11","ch":"oftalmo-A1","av":"A1","q":"Qual a função da coroide e até quando a pigmentação da íris é incompleta?","a":"Nutrir a retina; a pigmentação da íris e da coroide é incompleta até os 9 meses.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-04","ch":"otorrino-A1","av":"A1","q":"O que o slide chama de Rinne \"positivo patológico\"?","a":"A perda neurossensorial: as duas vias caem, mas a aérea continua maior que a óssea, então o Rinne segue positivo.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-02","ch":"gineco-A1","av":"A1","q":"Descreva a sequência de ascensão da DIP.","a":"Cervicite → endometrite → salpingite → ooforite/abscesso tubovariano → peritonite pélvica.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-10","ch":"obst-A1","av":"A1","q":"Classifique Hegar, Piskacek, Nobile-Budin e Goodell e diga o que cada um descreve.","a":"Todos de probabilidade (cerca de 8 sem). Hegar: istmo amolecido. Piskacek: útero assimétrico. Nobile-Budin: útero ocupando o fundo de saco. Goodell: colo amolecido.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L3","ch":"cirurgia-A1","av":"A1","q":"Quantos acamados por mais de 1 semana fazem TVP, segundo o slide?","a":"80%.","sec":"cirurgia/resumos/6/3/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · TVP: por que importa e quem tem risco"},{"id":"of-anat-12","ch":"oftalmo-A1","av":"A1","q":"Quais são as duas funções do corpo ciliar?","a":"Secretar humor aquoso pelos processos ciliares (regula a pressão ocular) e, pelo músculo ciliar, acomodar o cristalino para perto.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-05","ch":"otorrino-A1","av":"A1","q":"Qual a função de cada parte da orelha?","a":"Externa: captação e amplificação. Média: converter as ondas e manter a pressão. Interna: transdução.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-03","ch":"gineco-A1","av":"A1","q":"Qual o momento típico de início da DIP?","a":"Pós-menstrual, sem atraso menstrual.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-11","ch":"obst-A1","av":"A1","q":"Diferencie Jacquemier, Kluge e Osiander.","a":"Jacquemier: vulva violácea. Kluge: mucosa vaginal violácea. Osiander: pulso vaginal palpável.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L4","ch":"cirurgia-A1","av":"A1","q":"Quais são os três elementos da tríade de Virchow?","a":"Estase venosa, lesão endotelial e hipercoagulabilidade.","sec":"cirurgia/resumos/6/4/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · TVP: a tríade de Virchow"},{"id":"of-anat-13","ch":"oftalmo-A1","av":"A1","q":"Que músculo e que inervação fazem miose e midríase?","a":"Miose: esfíncter da íris, parassimpático. Midríase: dilatador da pupila, simpático.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-06","ch":"otorrino-A1","av":"A1","q":"Qual a faixa de frequência da audição humana e da fala?","a":"Audição: 20 a 20.000 Hz. Fala: 500 a 3.000 Hz.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-04","ch":"gineco-A1","av":"A1","q":"Em que porcentagem há febre na DIP?","a":"Apenas 20 a 30%.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-12","ch":"obst-A1","av":"A1","q":"Em que semana surgem Montgomery, Haller e Hunter, e o que é cada um?","a":"8 sem: tubérculos de Montgomery (glândulas sebáceas hipertrofiadas). 16 sem: rede venosa de Haller (com colostro). 20 sem: sinal de Hunter (aréola secundária).","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L5","ch":"cirurgia-A1","av":"A1","q":"Qual é a complicação mais frequente da TVP proximal?","a":"A embolia pulmonar.","sec":"cirurgia/resumos/6/5/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · TVP: evolução e quadro clínico"},{"id":"of-anat-14","ch":"oftalmo-A1","av":"A1","q":"Quais as duas porções da retina e qual a camada mais externa?","a":"Epitélio pigmentar da retina (a mais externa) e retina sensorial (9 camadas, dos fotorreceptores à limitante interna).","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-07","ch":"otorrino-A1","av":"A1","q":"Quais os fatores de risco para deficiência auditiva no recém-nascido?","a":"Prematuridade e baixo peso, ototóxicos, permanência prolongada em UTI, infecções congênitas, anomalias craniofaciais e história familiar.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-05","ch":"gineco-A1","av":"A1","q":"Qual a taxa de erro do diagnóstico só clínico?","a":"30%.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-13","ch":"obst-A1","av":"A1","q":"Qual a faixa de BCF e quando se ausculta com sonar e com Pinard?","a":"110 a 160 bpm; sonar-doppler a partir de 12 sem (10–12); Pinard a partir de 18 sem (18–20).","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L6","ch":"cirurgia-A1","av":"A1","q":"Qual é o exame de imagem de escolha hoje para confirmar TVP?","a":"Ultrassom com compressão (duplex).","sec":"cirurgia/resumos/6/6/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · TVP: diagnóstico"},{"id":"of-anat-15","ch":"oftalmo-A1","av":"A1","q":"Onde fica a mácula e por que o disco óptico é o ponto cego?","a":"A mácula fica a 3 a 4 mm do disco, com fóvea e fovéola; o disco é o início do II par e não tem fotorreceptores, é insensível à luz.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-08","ch":"otorrino-A1","av":"A1","q":"Qual a prevalência de deficiência auditiva em neonatos, geral e no CTI?","a":"1 a 6 por 1.000 nascidos vivos; 1 a 4 por 100 no CTI neonatal.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-06","ch":"gineco-A1","av":"A1","q":"Defina os 4 estádios de Monif.","a":"1: endometrite/salpingite sem peritonite. 2: salpingite com peritonite. 3: oclusão tubária/abscesso íntegro. 4: abscesso roto.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-14","ch":"obst-A1","av":"A1","q":"O que é o sinal de Puzos, quando aparece e em que grupo entra?","a":"Rechaço fetal ao toque vaginal, com 14 semanas; sinal de certeza.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L7","ch":"cirurgia-A1","av":"A1","q":"Até quando o AVC contraindica a anticoagulação, segundo a aula?","a":"Até 4 a 6 semanas.","sec":"cirurgia/resumos/6/7/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · TVP: tratamento"},{"id":"of-anat-16","ch":"oftalmo-A1","av":"A1","q":"Quem produz o humor aquoso e o que ele preenche?","a":"O epitélio não pigmentado do corpo ciliar; preenche as câmaras anterior e posterior. É semelhante ao plasma.","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-09","ch":"otorrino-A1","av":"A1","q":"Classifique pela tabela do slide perdas de 30, 60, 80 e 95 dB.","a":"30 dB: leve. 60 dB: moderada a grave. 80 dB: severa. 95 dB: profunda.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-07","ch":"gineco-A1","av":"A1","q":"Monif 3: conduta? Monif 4: conduta?","a":"3: internar, antibiótico, observar 48 h e operar se não melhorar. 4: cirurgia imediata.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-15","ch":"obst-A1","av":"A1","q":"Movimento fetal: quando é presunção e quando é certeza?","a":"Percebido pela mãe (16–20 sem): presunção. Percebido pelo médico (18–20 sem): certeza.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L8","ch":"cirurgia-A1","av":"A1","q":"O que é dermite ocre?","a":"A hiperpigmentação da pele na insuficiência venosa crônica.","sec":"cirurgia/resumos/6/8/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Síndrome pós-trombótica e insuficiência venosa crônica"},{"id":"of-anat-17","ch":"oftalmo-A1","av":"A1","q":"Qual a composição do cristalino e do vítreo?","a":"Cristalino: 65% água, 35% proteína e traços de minerais (cápsula, córtex, núcleo). Vítreo: 99% água, ácido hialurônico e hialócitos, 4 mL (até 10 mL na alta miopia).","sec":"oftalmo/resumos/0","w":"Oftalmologia · Anatomia ocular"},{"id":"or-disacusias-10","ch":"otorrino-A1","av":"A1","q":"Como se divide a perda auditiva quanto ao tipo?","a":"Condutiva, neurossensorial (coclear, retrococlear e central) e mista.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-08","ch":"gineco-A1","av":"A1","q":"Cite 5 indicações de internação na DIP.","a":"Dúvida diagnóstica, abscesso, gravidez, adolescência, má adesão, falha ambulatorial, doença grave, sem reavaliação.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-16","ch":"obst-A1","av":"A1","q":"O que é o sinal de Hartman e por que ele atrapalha o cálculo da IG?","a":"Sangramento de nidação, pequeno e escuro, de 3 a 5 dias; pode ser tomado por menstruação e falsear a DUM.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L9","ch":"cirurgia-A1","av":"A1","q":"Em que situação a compressão exige cuidado?","a":"Na isquemia arterial.","sec":"cirurgia/resumos/6/9/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · IVC: tratamento"},{"id":"of-palp-01","ch":"oftalmo-A1","av":"A1","q":"Qual músculo abre a pálpebra e qual nervo o inerva? E o de Müller?","a":"O elevador da pálpebra (III par) faz 2/3 da abertura; o músculo de Müller (simpático) faz 1/3.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-11","ch":"otorrino-A1","av":"A1","q":"Quais as estruturas da membrana timpânica normal na otoscopia?","a":"Parte flácida, parte tensa, processo lateral e cabo do martelo, umbo e triângulo luminoso.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-09","ch":"gineco-A1","av":"A1","q":"Quais as sequelas da DIP e suas frequências?","a":"Esterilidade 12,5–25%; dor pélvica crônica/dispareunia 18%; ectópica; hidrossalpinge.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-diag-17","ch":"obst-A1","av":"A1","q":"Defina hiperêmese gravídica.","a":"Vômitos persistentes com perda de peso, desidratação e distúrbio eletrolítico.","sec":"obst/resumos/0","w":"1. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-vascular-L10","ch":"cirurgia-A1","av":"A1","q":"Qual arteriosclerose deixa a artéria em \"traqueia de passarinho\"?","a":"A esclerose calcificante da média (Mönckeberg).","sec":"cirurgia/resumos/6/10/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Aterosclerose: o que é e como complica"},{"id":"of-palp-02","ch":"oftalmo-A1","av":"A1","q":"Qual músculo fecha a pálpebra e qual o seu nervo?","a":"O orbicular das pálpebras, inervado pelo VII par (facial).","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-12","ch":"otorrino-A1","av":"A1","q":"O que é imitância e o que a imitanciometria mede?","a":"Imitância é a oposição do aparelho condutor da orelha à onda sonora que entra no meato; a imitanciometria mede pressão sonora / velocidade volumétrica.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-10","ch":"gineco-A1","av":"A1","q":"\"Febre > 38 °C raramente é cirúrgica\": qual a exceção na DIP?","a":"Monif 4 (abscesso roto) é cirúrgico imediato.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-mod-02","ch":"obst-A1","av":"A1","q":"Em uma frase, o que a progesterona faz e o que o estrogênio faz?","a":"Progesterona relaxa (músculo liso, útero, GI, ureter, vasos) e aumenta a ventilação; estrogênio constrói (volume sanguíneo, miocárdio, ductos mamários, miométrio, ligamentos).","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-vascular-L11","ch":"cirurgia-A1","av":"A1","q":"Qual é a taxa de amputação em 5 anos de quem continua e de quem para de fumar?","a":"11,4% contra 0.","sec":"cirurgia/resumos/6/11/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Aterosclerose: fatores de risco"},{"id":"of-palp-03","ch":"oftalmo-A1","av":"A1","q":"Quais são as glândulas da pálpebra e de que tipo é cada uma?","a":"Zeis (sebáceas, junto aos cílios), Meibomius (sebáceas, no tarso) e Moll (sudoríparas, na margem).","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-13","ch":"otorrino-A1","av":"A1","q":"Quando a otoemissão acústica fica ausente?","a":"Em doença de orelha média e quando a audição está pior qu
