oida interna não dói?","a":"Fica acima da linha pectínea, com epitélio cilíndrico e inervação visceral.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-18","ch":"cirurgia-A1","av":"A1","q":"O que marca a reflexão peritoneal na retossigmoidoscopia?","a":"A 2ª válvula de Houston; abaixo dela o reto é extraperitoneal.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-19","ch":"cirurgia-A1","av":"A1","q":"Qual artéria nunca se liga na cirurgia do cólon e por quê?","a":"A mesentérica superior, porque irriga também o intestino delgado.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-20","ch":"cirurgia-A1","av":"A1","q":"Qual região do cólon é mais vulnerável à colite isquêmica?","a":"O ângulo esplênico, a área menos irrigada.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-21","ch":"cirurgia-A1","av":"A1","q":"Para onde metastatiza o câncer de reto inferior e o de cólon?","a":"Reto inferior: pulmão (circulação sistêmica). Cólon e reto superior: fígado (sistema porta).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-22","ch":"cirurgia-A1","av":"A1","q":"Qual exame de imagem estadia o câncer de reto na pelve?","a":"A ressonância magnética da pelve (avalia a fáscia mesorretal).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-23","ch":"cirurgia-A1","av":"A1","q":"Quais são os critérios de qualidade da colonoscopia?","a":"Tempo de retirada maior que 6 minutos, intubação cecal, taxa de detecção de adenoma e qualidade do preparo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-24","ch":"cirurgia-A1","av":"A1","q":"Qual é a modalidade preferencial de rastreamento do câncer colorretal e com que intervalo?","a":"Colonoscopia a cada 10 anos no risco moderado, a partir de 45 a 50 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-25","ch":"cirurgia-A1","av":"A1","q":"Em quem não se deve pedir sangue oculto nas fezes?","a":"Sangramento visível, anemia ou suspeita de câncer, menores de 40 anos, já rastreados por colonoscopia ou com teste anterior positivo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-26","ch":"cirurgia-A1","av":"A1","q":"Como é o rastreamento na polipose adenomatosa familiar?","a":"Aconselhamento e teste genético e colonoscopia anual a partir dos 10 a 12 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-27","ch":"cirurgia-A1","av":"A1","q":"Quando começar a vigilância na doença inflamatória intestinal?","a":"8 a 10 anos depois do início da doença.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-28","ch":"cirurgia-A1","av":"A1","q":"Homem de 65 anos com hemorroida, sangue misturado às fezes, constipação piorando e perda de peso. O que pedir e por quê?","a":"Colonoscopia (ou retossigmoidoscopia flexível) para pesquisar câncer colorretal: sangue misturado, mudança do hábito e emagrecimento não se explicam pela hemorroida.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-29","ch":"cirurgia-A1","av":"A1","q":"Paciente operado de polipose adenomatosa familiar: como seguir os filhos?","a":"Aconselhamento e teste genético, e colonoscopia anual a partir dos 10 a 12 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-vascular-01","ch":"cirurgia-A1","av":"A1","q":"Quais são as três túnicas da parede vascular?","a":"Íntima, média e adventícia.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-02","ch":"cirurgia-A1","av":"A1","q":"Quais artérias são elásticas e quais são musculares?","a":"Elásticas: aorta e ramos principais, carótida comum, subclávia, ilíacas comuns, pulmonares. Musculares: coronária, carótida, axilar, uterina, palmar.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-03","ch":"cirurgia-A1","av":"A1","q":"Quem dá a principal resistência periférica ao fluxo?","a":"As arteríolas e os esfíncteres pré-capilares (vasos de resistência).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-04","ch":"cirurgia-A1","av":"A1","q":"O que fazem os barorreceptores e os quimiorreceptores com a pressão arterial?","a":"Barorreceptores (seio carotídeo, arco aórtico) baixam a PA. Quimiorreceptores (glomo carotídeo, corpo aórtico) sobem a PA quando falta O2 ou sobra CO2.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-05","ch":"cirurgia-A1","av":"A1","q":"O que é vis a fronte e vis a tergo?","a":"Vis a fronte é a força que puxa pela frente (aspiração torácica, cardíaca, bomba abdominal). Vis a tergo é a que empurra por trás (pressão).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-07","ch":"cirurgia-A1","av":"A1","q":"Onde começa a maioria das TVP e quais as duas complicações?","a":"92% na perna. Embolia pulmonar e síndrome pós-trombótica.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-08","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais mais frequentes da TVP na tabela da aula?","a":"Dor, edema e aumento da consistência muscular (86,7% cada).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-09","ch":"cirurgia-A1","av":"A1","q":"Quais são as contraindicações à anticoagulação citadas na aula?","a":"Moléstias hemorrágicas e neurocirurgia ou AVC recentes (até 4 a 6 semanas).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-10","ch":"cirurgia-A1","av":"A1","q":"Quais são as complicações da heparina?","a":"Hemorragia, reação alérgica, trombocitopenia (precoce ou tardia), osteoporose, alopecia e febre.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-11","ch":"cirurgia-A1","av":"A1","q":"Qual complicação da varfarina aparece em membros e mamas?","a":"Necrose de pele e subcutâneo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-12","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais da insuficiência venosa crônica?","a":"Edema, lipodermatosclerose, dermite ocre, eczema, erisipela e úlcera.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-13","ch":"cirurgia-A1","av":"A1","q":"Qual é o cuidado com a compressão na IVC?","a":"Não comprimir sem checar o lado arterial: cuidado nas isquemias arteriais.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-14","ch":"cirurgia-A1","av":"A1","q":"Quais são as opções cirúrgicas da IVC no slide?","a":"Operação de Linton, safenectomia e plástica com enxertos livres de pele.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-15","ch":"cirurgia-A1","av":"A1","q":"O que é a esclerose de Mönckeberg?","a":"Esclerose calcificante da média, a artéria em \"traqueia de passarinho\".","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-16","ch":"cirurgia-A1","av":"A1","q":"Qual é o fator de risco mais importante para a doença arterial periférica?","a":"O tabagismo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o segmento preferido da doença arterial no diabético?","a":"O infrapoplíteo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-18","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome de Leriche?","a":"Claudicação de nádegas e coxas com impotência sexual, por oclusão aortoilíaca.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-19","ch":"cirurgia-A1","av":"A1","q":"O que indica um tempo de enchimento venoso maior que 10 segundos?","a":"Insuficiência arterial importante.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-20","ch":"cirurgia-A1","av":"A1","q":"Quais são os tratamentos cirúrgicos da oclusão arterial crônica?","a":"Endarterectomia, enxertos anatômicos e extra-anatômicos, angioplastia com stent e amputação.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-21","ch":"cirurgia-A1","av":"A1","q":"Como se usa o escore de Wells na suspeita de TVP?","a":"2 pontos ou mais: TVP provável, vai direto ao duplex. Menos de 2: improvável, pede-se D-dímero; se normal, afasta TVP; se alterado, duplex.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-22","ch":"cirurgia-A1","av":"A1","q":"Qual valor de ITB confirma doença arterial periférica?","a":"0,90 ou menos. Acima de 1,40 sugere artéria incompressível (calcificada).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-23","ch":"cirurgia-A1","av":"A1","q":"O que é CEAP C6 e o que é C4?","a":"C6 é úlcera venosa ativa (C5, cicatrizada). C4 são as alterações de pele: pigmentação, eczema, lipodermatosclerose.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-prova-antiga-01","ch":"cirurgia-A1","av":"A1","q":"Defina câncer gástrico precoce e explique a relação com linfonodos.","a":"Tumor restrito à mucosa ou à submucosa (T1), com ou sem linfonodo comprometido. O risco de linfonodo é cerca de 0,5% na mucosa e de 11 a 23% na submucosa, conforme a profundidade.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-02","ch":"cirurgia-A1","av":"A1","q":"Quais são os critérios de Burke da profilaxia antibiótica?","a":"Antibiótico sítio-específico, dose única, EV, bactericida, poucos efeitos colaterais; iniciar até 1 hora antes da incisão; repetir se a cirurgia for longa; não passar de 24 h.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-03","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no hemangioma hepático gigante assintomático?","a":"Observar. Confirmar com TC ou RM, sem biópsia; tratar só se sintomático.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-04","ch":"cirurgia-A1","av":"A1","q":"Como se faz o diagnóstico de CHC em cirrótico?","a":"Nódulo de 1 cm ou mais com hiper-realce arterial e washout na TC ou RM, sem biópsia.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-05","ch":"cirurgia-A1","av":"A1","q":"Quais são a tríade de Charcot e a pêntade de Reynolds?","a":"Charcot: dor no hipocôndrio direito, febre com calafrios e icterícia. Reynolds: mais hipotensão e confusão mental.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-07","ch":"cirurgia-A1","av":"A1","q":"Cite indicações de nefrolitotripsia percutânea.","a":"Cálculo maior que 2 cm, cálculo de cálice inferior, coraliforme, em divertículo calicinal, rim em ferradura, falha da litotripsia extracorpórea.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-08","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no nódulo testicular sólido?","a":"Marcadores tumorais e orquiectomia por via inguinal, mesmo com marcadores normais.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-09","ch":"cirurgia-A1","av":"A1","q":"Quais são os parâmetros de via aérea difícil?","a":"Incisivos superiores, relação dos incisivos no fechamento e na protrusão, distância interincisivos, visibilidade da úvula, palato, espaço mandibular, comprimento e largura do pescoço e mobilidade cervical.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-10","ch":"cirurgia-A1","av":"A1","q":"Qual é a droga vasoativa do choque séptico e por quê?","a":"Noradrenalina: efeito alfa, vasoconstrição, aumenta a resistência vascular sistêmica num paciente vasodilatado.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-11","ch":"cirurgia-A1","av":"A1","q":"Quais são os efeitos adversos dos anestésicos locais?","a":"Formigamento perioral, zumbido, alteração visual, abalos, convulsão, coma, parada respiratória e depressão cardiovascular.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-12","ch":"cirurgia-A1","av":"A1","q":"O que é o sinal de Drehmann e em que doença aparece?","a":"Rotação externa do quadril ao fletir; epifisiólise proximal do fêmur.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-13","ch":"cirurgia-A1","av":"A1","q":"Quais são 3 indicações de colecistectomia em assintomático, segundo a resposta da prova antiga?","a":"Vesícula em porcelana, anemia falciforme e mulher jovem que quer engravidar. A indicação absoluta é a vesícula em porcelana.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-14","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco e os critérios de risco de progressão do câncer de próstata?","a":"Risco: idade, raça negra e história familiar. Progressão: PSA, Gleason/ISUP e estádio clínico (T).","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-15","ch":"cirurgia-A1","av":"A1","q":"Câncer de próstata metastático: o que usar na doença sensível e na resistente à castração?","a":"Sensível: bloqueio androgênico (análogo do LHRH ou orquiectomia bilateral), com docetaxel ou abiraterona/enzalutamida. Resistente: docetaxel, abiraterona ou enzalutamida.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-16","ch":"cirurgia-A1","av":"A1","q":"Quando o reflexo bulbocavernoso tem valor no trauma raquimedular?","a":"Só depois que o choque medular termina; aí se classifica a lesão e se fala em prognóstico.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o papel do ortopedista no politraumatizado grave já operado de tórax e abdome?","a":"Controle de danos: estabilização provisória, não a fixação definitiva.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-18","ch":"cirurgia-A1","av":"A1","q":"SvcO2 de 75% numa cirurgia de grande porte: o que significa? E se fosse 60%?","a":"75%: oxigenação tecidual adequada (normal acima de 70%). 60%: a oferta de O2 não cobre o consumo e o tecido extrai mais (anemia, hipovolemia, baixo débito ou hipoxemia).","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-prova-antiga-19","ch":"cirurgia-A1","av":"A1","q":"Que tipo de choque tem resistência vascular sistêmica baixa, e qual é a conduta inicial no séptico?","a":"O distributivo (séptico, anafilático, neurogênico). No séptico: lactato, hemoculturas, antibiótico de largo espectro na 1ª hora, cristaloide e noradrenalina para PAM de 65 mmHg ou mais.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu","pa":1},{"id":"ci-an-vias-01","ch":"cirurgia-A1","av":"A1","q":"Cite três situações de emergência com indicação de intubação orotraqueal.","a":"Glasgow ≤ 8, apneia e necessidade de proteger a via aérea (queimadura de via aérea, edema, sangue ou vômito).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-02","ch":"cirurgia-A1","av":"A1","q":"Quais são as quatro indicações de intubação traqueal do slide?","a":"Prejuízo real ou potencial da permeabilidade da via aérea, deficiência da proteção da laringe, atenuar o risco de aspiração e facilitar a ventilação com pressão positiva.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-03","ch":"cirurgia-A1","av":"A1","q":"Quais os preparativos antes de uma IOT?","a":"Checar o material, avaliar a via aérea, checar a medicação da IOT e de emergência, posicionar e pré-oxigenar, e planejar as alternativas.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-04","ch":"cirurgia-A1","av":"A1","q":"Cite cinco parâmetros da avaliação da via aérea.","a":"Abertura da boca (interincisivos), Mallampati, distância tireomentoniana, mobilidade do pescoço e protrusão da mandíbula (ou o LEMON: Look, 3-3-2, Mallampati, Obstrução, Neck).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-05","ch":"cirurgia-A1","av":"A1","q":"O que significa o 3-3-2 do LEMON?","a":"3 dedos de abertura da boca, 3 dedos do mento ao hioide e 2 dedos do hioide à cartilagem tireoide.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-06","ch":"cirurgia-A1","av":"A1","q":"Qual a distância interincisivos considerada desfavorável pela ASA?","a":"Menor que 3 cm.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-07","ch":"cirurgia-A1","av":"A1","q":"O que se vê na classe IV de Mallampati?","a":"Só o palato duro.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-08","ch":"cirurgia-A1","av":"A1","q":"O que se vê na classe II de Cormack-Lehane?","a":"Só a parte posterior da glote, as aritenoides.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-09","ch":"cirurgia-A1","av":"A1","q":"Onde se faz a manobra de Sellick e para quê?","a":"Na cartilagem cricoide, comprimindo o esôfago contra a coluna para evitar regurgitação.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-10","ch":"cirurgia-A1","av":"A1","q":"Para que serve a manobra de BURP?","a":"Para melhorar a visão da glote, deslocando a tireoide para trás, para cima e para a direita.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-11","ch":"cirurgia-A1","av":"A1","q":"Cite os fatores de ventilação difícil sob máscara.","a":"Barba, IMC acima de 26, falta de dentes, idade acima de 55 anos e ronco (2 ou mais).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-13","ch":"cirurgia-A1","av":"A1","q":"Como fica a capnografia na intubação esofágica?","a":"Algumas ondas cada vez menores até zerar, sem CO2 sustentado.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-14","ch":"cirurgia-A1","av":"A1","q":"Qual o desenho da capnografia no broncoespasmo e no bloqueio insuficiente?","a":"Broncoespasmo: barbatana de tubarão (subida inclinada, sem platô). Bloqueio insuficiente: fenda de curare no platô.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-16","ch":"cirurgia-A1","av":"A1","q":"Qual o material básico da cricotireoidostomia cirúrgica?","a":"Bisturi, pinça Kelly e cânula de traqueostomia infantil ou tubo de pequeno calibre.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-venosos-01","ch":"cirurgia-A1","av":"A1","q":"Paciente estável no pós-operatório imediato de laparotomia, com dor 9/10. Qual analgésico?","a":"Morfina IV, titulada, com monitorização; somada a analgesia multimodal (dor intensa pede opioide forte).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-02","ch":"cirurgia-A1","av":"A1","q":"Opioide causa náusea e vômito? Por quê?","a":"Sim: estimula a zona quimiorreceptora do gatilho (área postrema), sensibiliza o vestíbulo e retarda o esvaziamento gástrico.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-03","ch":"cirurgia-A1","av":"A1","q":"Qual hipnótico se escolhe para induzir o paciente instável de trauma e por quê?","a":"Cetamina: é simpaticomimética e mantém pressão arterial e frequência cardíaca.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-04","ch":"cirurgia-A1","av":"A1","q":"Qual bloqueador neuromuscular desencadeia hipertermia maligna, e qual o tratamento da crise?","a":"Succinilcolina (com os voláteis halogenados). Suspender gatilhos, O₂ 100% e dantrolene 2,5 mg/kg IV, repetido.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-05","ch":"cirurgia-A1","av":"A1","q":"A membrana da junção neuromuscular é eletroexcitável ou quimioexcitável?","a":"Quimioexcitável: a placa motora responde à acetilcolina no receptor nicotínico.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-06","ch":"cirurgia-A1","av":"A1","q":"Quais são as quatro ausências que definem a anestesia geral?","a":"Ausência de consciência (e memória), de dor, de resposta motora e de resposta do sistema nervoso autônomo.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-07","ch":"cirurgia-A1","av":"A1","q":"Como o opioide age na sinapse do corno dorsal?","a":"Pré-sináptico: fecha Ca²⁺ e bloqueia a liberação de glutamato e substância P. Pós-sináptico: abre K⁺ e hiperpolariza.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-08","ch":"cirurgia-A1","av":"A1","q":"Coloque em ordem crescente: MAC, MAC-BAR e MAC-awake. O que cada uma abole?","a":"MAC-awake (consciência) < MAC (movimento) < MAC-BAR (resposta autonômica).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-09","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença entre potência e eficácia?","a":"Potência é a dose necessária para o efeito (deslocamento da curva); eficácia é o efeito máximo (altura do platô).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-10","ch":"cirurgia-A1","av":"A1","q":"Dê exemplo de agonista total, agonista parcial e antagonista opioide.","a":"Total: morfina ou metadona. Parcial: buprenorfina. Antagonista: naloxona.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-12","ch":"cirurgia-A1","av":"A1","q":"O que é sinergismo? Dê o exemplo da aula.","a":"Efeito da combinação maior que a soma dos efeitos isolados; midazolam + fentanil.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-13","ch":"cirurgia-A1","av":"A1","q":"Quais hipnóticos se ligam ao receptor GABA-A, e que íon ele conduz?","a":"Propofol, etomidato, barbitúricos (um sítio) e benzodiazepínicos (outro); é canal de cloreto.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-14","ch":"cirurgia-A1","av":"A1","q":"Quais são as fases da anestesia geral?","a":"Indução (hipnose, analgesia, BNM?), manutenção e recuperação, com suporte de vida e monitorização em todas.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a potência do fentanil em relação à morfina, segundo a aula?","a":"80 a 100 vezes maior.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-locais-01","ch":"cirurgia-A1","av":"A1","q":"Cite quatro cuidados para evitar intoxicação sistêmica por anestésico local.","a":"Respeitar a dose máxima pelo peso, aspirar antes de injetar (não injetar no vaso), injetar devagar e fracionado com monitorização, usar vasoconstritor quando permitido; também perguntar alergia e evitar interações.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-02","ch":"cirurgia-A1","av":"A1","q":"Quais são os efeitos adversos da intoxicação por anestésico local, na ordem?","a":"Formigamento de língua e lábios, zumbido, distúrbio visual, abalos musculares, convulsão, inconsciência e coma, parada respiratória e depressão cardiovascular.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento específico da intoxicação sistêmica grave e a dose do slide?","a":"Emulsão lipídica 20%: bolus de 1,5 mL/kg, repetível a cada 5 min se colapso, e infusão de 0,25 mL/kg/min.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-04","ch":"cirurgia-A1","av":"A1","q":"Quais são as doses máximas de lidocaína e bupivacaína, sem e com vasoconstritor?","a":"Lidocaína 5 mg/kg sem e 7 mg/kg com; bupivacaína 2,5 mg/kg sem e 3 mg/kg com.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-05","ch":"cirurgia-A1","av":"A1","q":"Quantos mg há em 1 mL de lidocaína 2% e de bupivacaína 0,5%?","a":"20 mg/mL e 5 mg/mL (porcentagem × 10).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-06","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença de metabolismo entre ésteres e amidas?","a":"Ésteres: plasma, pela pseudocolinesterase (geram PABA, alergênico). Amidas: fígado, pelo citocromo P450.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-07","ch":"cirurgia-A1","av":"A1","q":"Como o anestésico local bloqueia o nervo?","a":"Bloqueia o canal de sódio pelo lado de dentro: atravessa a membrana na forma não ionizada e bloqueia na forma ionizada.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-08","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência do bloqueio das fibras?","a":"Simpático (B), dor e temperatura (C), tato e pressão (A), motor (A), propriocepção profunda (A).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-09","ch":"cirurgia-A1","av":"A1","q":"Que propriedade determina potência, latência e duração?","a":"Lipossolubilidade → potência; pKa → latência; ligação proteica → duração.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-10","ch":"cirurgia-A1","av":"A1","q":"Coloque em ordem de absorção: peridural, intercostal, subcutâneo, plexo braquial.","a":"Intercostal > peridural > plexo braquial > subcutâneo.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-11","ch":"cirurgia-A1","av":"A1","q":"Quais são as contraindicações do vasoconstritor?","a":"HAS grave, doença vascular cerebral isquêmica, coronariopatia, hipertireoidismo descompensado, pré-eclâmpsia grave; proibido em circulação terminal (dedo, pênis, ponta do nariz, orelha).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-12","ch":"cirurgia-A1","av":"A1","q":"Qual a concentração ideal de adrenalina e o que ela faz?","a":"1:200.000 (5 µg/mL): reduz a absorção, prolonga a ação e limita a toxicidade.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-13","ch":"cirurgia-A1","av":"A1","q":"Como tratar a convulsão na intoxicação por anestésico local?","a":"Benzodiazepínico (ex.: midazolam), O2 a 100% e ventilação; evitar propofol se houver instabilidade cardiovascular.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-14","ch":"cirurgia-A1","av":"A1","q":"Por que o anestésico local falha em tecido infectado?","a":"O meio ácido mantém a droga na forma ionizada, que não atravessa a membrana do nervo.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-15","ch":"cirurgia-A1","av":"A1","q":"Qual anestésico local é o mais cardiotóxico e por quê?","a":"A bupivacaína: muito lipossolúvel e muito ligada a proteína; a cardiotoxicidade pode vir junto ou antes dos sinais neurológicos, e a parada é difícil de reverter.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-neuro-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a diferença de espaço entre a raquianestesia e a peridural?","a":"Raqui: espaço subaracnóideo (entre pia e aracnoide, no líquor). Peridural: entre a dura-máter e o ligamento amarelo.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-02","ch":"cirurgia-A1","av":"A1","q":"Até onde vai a medula e abaixo de qual nível se faz a raqui?","a":"A medula vai até L2; a raqui é feita abaixo de L2. A peridural pode ser feita em qualquer nível.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-03","ch":"cirurgia-A1","av":"A1","q":"Qual referência anatômica marca L4 e qual marca T7?","a":"A linha bicrista (cristas ilíacas) marca L4; a linha interescapular (pontas das escápulas) marca T7.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-04","ch":"cirurgia-A1","av":"A1","q":"Quais camadas a agulha atravessa na via mediana até o espaço subaracnóideo?","a":"Pele, subcutâneo, ligamento supraespinhoso, interespinhoso, ligamento amarelo e dura-máter.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-05","ch":"cirurgia-A1","av":"A1","q":"Como se confirma que a agulha de raqui está no lugar certo?","a":"Ao retirar o mandril, há fluxo livre de líquor.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-06","ch":"cirurgia-A1","av":"A1","q":"Por que a raqui causa hipotensão e quando causa bradicardia?","a":"Pelo bloqueio simpático (T1 a L2), com vasodilatação e queda da RVP; bradicardia só em bloqueio alto, de T1 a T4.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-07","ch":"cirurgia-A1","av":"A1","q":"Como se corrige a hipotensão da raqui segundo o slide?","a":"Cristaloide antes e durante, posição de Trendelenburg e vasopressores (efedrina, fenilefrina, adrenalina).","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-08","ch":"cirurgia-A1","av":"A1","q":"O que é baricidade e quais os três tipos?","a":"O \"peso\" do anestésico em relação ao líquor: hiperbárico (pesado), isobárico e hipobárico.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-09","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença entre fentanil e morfina na raqui?","a":"Fentanil melhora o bloqueio e dá analgesia segmentar de até 3 h; morfina dá analgesia não segmentar por mais de 18 h.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-10","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da cefaleia pós-punção?","a":"Hipotensão liquórica, postural, mais em mulher jovem, agulha grossa e várias tentativas; começa em 12 a 24 h.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-12","ch":"cirurgia-A1","av":"A1","q":"Qual contraindicação da raqui não aparece na lista da peridural?","a":"O aumento da pressão intracraniana.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-13","ch":"cirurgia-A1","av":"A1","q":"Como se identifica o espaço peridural e para que serve a dose-teste?","a":"Pelo sinal de Dogliotti ou perda de resistência ao passar o ligamento amarelo; a dose-teste (lidocaína 2% + adrenalina) detecta injeção em vaso ou no líquor.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-14","ch":"cirurgia-A1","av":"A1","q":"Quais as complicações próprias da peridural?","a":"Injeção IV de AL, raqui total, perfuração da dura (cefaleia), infecção/abscesso e hematoma peridural compressivo.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-16","ch":"cirurgia-A1","av":"A1","q":"Quanto tempo antes da punção se suspende a enoxaparina profilática e a terapêutica (ASRA 2018)?","a":"12 h na dose profilática e 24 h na terapêutica (pela ASRA 2018).","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"}],"provas":[["gineco","Ginecologia"],["obst","Obstetrícia"],["cirurgia","Clínica cirúrgica"],["oftorl","Oftalmo e otorrino"],["legal","Medicina legal"],["urg","Urgência e emergência"],["ped","Pediatria 2"]],"datas":{"obst-A1":["2026-11-06","A3 com a matéria da A1"]},"soon":"A2 em curso: Medicina legal, Pediatria 2 e as aulas novas de cada disciplina entram aqui quando chegarem os slides."};</script>

const CASES=[
 "Caso de 2003. Um secretário de saúde jurou que o Conselho Municipal era \"só consultivo\". Mostrei a Lei 8.142: permanente e deliberativo. Ele mudou de cor três vezes. Nenhuma delas era saudável.",

/* Estado e repetição espaçada (SM-2 adaptado) */
const DAY=86400000,NEW_PER_DAY=20,KEY="medaj-p8-cards-v1";
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/DAY)};
let S={cards:{},days:{},t:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const st=id=>S.cards[id]||{r:0,i:0,e:2.5,due:0,l:0,last:0,seen:0};
function plan(c,q){
  let {r,i,e,l}=c;
  if(q===0) return {r:0,i:0,e:Math.max(1.3,e-.2),l:l+1,again:true};
  const e2=Math.max(1.3,e+(.1-(5-q)*(.08+(5-q)*.02)));
  let i2;
  if(r===0) i2=q===5?4:1;
  else if(r===1) i2=q===3?3:q===4?6:8;
  else i2=Math.max(i+1,Math.round(i*(q===3?1.2:q===4?e2:e2*1.3)));
  return {r:r+1,i:i2,e:e2,l};
}
const fmt=p=>p.again?"agora":p.i===1?"amanhã":p.i<14?p.i+" dias":p.i<60?Math.round(p.i/7)+" sem":Math.round(p.i/30)+" meses";

let deck="all",queue=[],cur=null,shown=false,sess={n:0,ok:0,total:0,streak:0};

  const due=list.filter(c=>!isNew(c)&&st(c.id).due<=t).length;

}

  const t=today(),list=CARDS.filter(inDeck);
  const rev=list.filter(c=>!isNew(c)&&st(c.id).due<=t).sort((a,b)=>st(a.id).due-st(b.id).due);
  const nw=list.filter(isNew).slice(0,Math.max(0,NEW_PER_DAY-newToday()));
  queue=[];while(rev.length||nw.length){if(rev.length)queue.push(rev.shift());if(rev.length)queue.push(rev.shift());if(nw.length)queue.push(nw.shift())}
  sess={n:0,ok:0,total:queue.length,streak:0};
}

/* Tela */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function say(text,story){const b=$("bubble");b.classList.toggle("story",!!story);b.innerHTML=story?`<span class="case">Caso do Dr. Casa</span>${esc(text)}`:esc(text)}
function mood(m){const a=$("avatar");a.classList.remove("raise","smug","tap");void a.getBoundingClientRect();if(m)m.split(" ").forEach(x=>a.classList.add(x))}
function renderDecks(){
  const opts=[["all","Tudo"],...Object.entries(CHAPTERS)];
  $("decks").innerHTML=opts.map(([k,l])=>{const c=counts(x=>k==="all"||x.ch===k||x.av===k);return `<button class="chip" type="button" data-deck="${k}" aria-pressed="${deck===k}">${esc(l)}<span class="n">${c.avail}</span></button>`}).join("");
}
function renderStats(){
  const c=counts(inDeck),d=S.days[today()]||{n:0,ok:0};
  $("s-due").textContent=queue.length+(cur?1:0);
  $("s-new").textContent=c.nw;
  $("s-acc").textContent=d.n?Math.round(100*d.ok/d.n)+"%":"–";
  let s=0,t=today();if(!(S.days[t]&&S.days[t].n))t--;while(S.days[t]&&S.days[t].n){s++;t--}
  $("s-streak").textContent=s;
  $("foot-info").textContent=`${CARDS.length} cartões das apostilas do 8º período`;
}
function renderCard(){
  const el=$("card");
  if(!cur){
    if(sess.total===0){
      el.innerHTML=`<div class="done"><h2>Nada para hoje neste baralho</h2><p>Os cartões que você já estudou voltam na data certa. Cartões novos entram ${NEW_PER_DAY} por dia.</p><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(SAY.empty));
    }else{
      const acc=sess.n?Math.round(100*sess.ok/sess.n):0,tm=counts(inDeck);
      el.innerHTML=`<div class="done"><span class="meta">${esc(deck==="all"?"Tudo":CHAPTERS[deck])}</span><h2>Plantão encerrado</h2><div class="sum"><div><b>${sess.n}</b><span>respostas</span></div><div><b>${acc}%</b><span>de acerto</span></div><div><b>${tm.nw}</b><span>cartões novos ainda na fila</span></div></div><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(acc>=70?SAY.done:SAY.doneBad));mood(acc>=70?"smug":"raise");
    }
    renderStats();return;
  }
  const s=st(cur.id),fresh=isNew(cur),pos=sess.total-queue.length;
  const pct=sess.total?Math.round(100*(pos-1)/sess.total):0;
  let html=`<div class="meta"><span class="tag">${esc(CHAPTERS[cur.ch])}</span>${fresh?'<span class="tag new">novo</span>':""}<span class="pos">${pos} de ${sess.total}</span></div><div class="progress"><i style="width:${pct}%"></i></div><p class="q">${esc(cur.q)}</p>`;
  if(!shown){
    html+=`<div class="spacer"></div><button class="reveal" type="button" data-act="reveal">Mostrar resposta<kbd>espaço</kbd></button>`;
  }else{
    const g=[[0,"Errei"],[3,"Difícil"],[4,"Bom"],[5,"Fácil"]];
    html+=`<div class="ans"><span class="lbl">Resposta</span><p>${esc(cur.a)}</p><a class="read" href="${FILE[cur.ch]||APOSTILA}#${cur.sec}">Ler na apostila: ${esc(cur.w||"")} ↗</a></div><div class="spacer"></div><div class="grades">${g.map(([q,l],k)=>`<button class="grade g${q}" type="button" data-q="${q}"><b>${l}</b><small>${fmt(plan(s,q))} · ${k+1}</small></button>`).join("")}</div>`;
  }
  el.innerHTML=html;renderStats();
}
function next(){cur=queue.shift()||null;shown=false;renderCard();if(cur&&sess.n>0&&Math.random()<.5)say(pick(SAY.ask));}
function grade(q){
  if(!cur||!shown)return;
  const p=plan(st(cur.id),q),t=today(),was=isNew(cur);
  S.cards[cur.id]={r:p.r,i:p.i,e:+p.e.toFixed(2),due:p.again?t:t+p.i,l:p.l,last:Date.now(),seen:(st(cur.id).seen||0)+1};
  const d=S.days[t]||(S.days[t]={n:0,ok:0,nw:0});d.n++;if(q>=3)d.ok++;if(was)d.nw=(d.nw||0)+1;
  sess.n++;if(q>=3){sess.ok++;sess.streak++}else sess.streak=0;
  if(p.again){queue.splice(Math.min(3,queue.length),0,cur);sess.total++}
  if(sess.streak===3||sess.streak===7){say(pick(SAY.streak));mood("smug tap")}
  else{say(pick(SAY["g"+q]));mood(q===0?"raise tap":q===5?"raise":"smug")}
  save();next();renderDecks();
}

/* Salvar: aparelho sempre; conta (claude.ai) quando disponível */
let remote=null,busy=Promise.resolve(),timer=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(timer);timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));busy=busy.then(()=>remote.set(body)).catch(()=>{$("sync").textContent="Não deu para salvar na conta agora. O progresso ficou neste aparelho."})},800)}
}
function merge(o){
  if(!o||!o.cards)return;
  for(const [id,c] of Object.entries(o.cards)){const m=S.cards[id];if(!m||(c.last||0)>(m.last||0))S.cards[id]=c}
  for(const [d,v] of Object.entries(o.days||{})){const m=S.days[d];if(!m||v.n>m.n)S.days[d]=v}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    remote=db.doc("data/users/"+uid+"/drcasa");
    const snap=await remote.get();
    if(snap.exists){merge(snap.data());try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(Object.keys(S.cards).length)save();
    $("sync").textContent="Progresso salvo na sua conta: aparece no celular e no computador.";
    if(!cur||!shown){build();next()}
    renderDecks();
  }catch(e){}
})();

/* Eventos */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-deck],[data-act],[data-q]");if(!b)return;
  if(b.dataset.deck){deck=b.dataset.deck;build();next();renderDecks();say(pick(SAY.hello));return}
  if(b.dataset.act==="reveal"){shown=true;renderCard();say(pick(SAY.reveal));return}
  if(b.dataset.act==="ahead"){const t=today();const pool=CARDS.filter(inDeck).filter(c=>!isNew(c)&&st(c.id).due>t).sort((a,b)=>st(a.id).due-st(b.id).due);const nw=CARDS.filter(inDeck).filter(isNew);queue=pool.concat(nw).slice(0,10);sess={n:0,ok:0,total:queue.length,streak:0};if(!queue.length){say("Não sobrou nada para adiantar. Você zerou o baralho. Vá ler o próximo capítulo.");return}next();say("Adiantando. Ambição é bom, desde que venha acompanhada de sono.");return}
  if(b.dataset.q!==undefined)grade(+b.dataset.q);
});
$("b-case").addEventListener("click",()=>{say(pick(CASES),true);mood("tap")});
$("b-hint").addEventListener("click",()=>{if(!cur){say("Dica: abra a apostila. É onde moram as respostas. Revolucionário, eu sei.");return}say(`Dica: está na seção "${cur.w}" do ${CHAPTERS[cur.ch]}. A resposta eu não dou. Sofrer um pouco também ensina.`);mood("raise")});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if((e.key===" "||e.key==="Enter")&&cur&&!shown&&!e.target.closest("button,a")){e.preventDefault();shown=true;renderCard();say(pick(SAY.reveal));return}
  if(shown&&["1","2","3","4"].includes(e.key)){grade([0,3,4,5][+e.key-1])}
});
$("b-reset").addEventListener("click",()=>{
  const slot=$("reset-slot");
  slot.innerHTML=`<span class="confirm">Apagar todo o progresso? <button class="danger" type="button" id="r-yes">Apagar</button><button type="button" id="r-no">Cancelar</button></span>`;
  $("r-no").onclick=()=>location.reload();
  $("r-yes").onclick=()=>{S={cards:{},days:{},t:Date.now()};save();location.reload()};
});

/* Tema: escuro por padrão */

build();renderDecks();next();say(pick(SAY.hello));
</script>

<script>
/* período: Hoje + Apostilas + Flashcards (gerado por build-periodos.py) */
const e_=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"],pad=n=>String(n).padStart(2,"0");
const br=d=>DIAS[d.getDay()]+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
const LKEY="medaj-"+PER.id+"-lidas",DKEY="medaj-"+PER.id+"-provas";
let LIDAS={},DATAS={};try{LIDAS=JSON.parse(localStorage.getItem(LKEY)||"{}")}catch(e){}
DATAS=Object.assign({},PER.datas);   /* 28/10: datas de prova só pelo código (DATAS no gerador), sem campo no app */
const site=u=>PER.site+"#"+u;
/* link "Ler na apostila" de cada cartão: página certa do site do período */
const _rc=renderCard;renderCard=function(){_rc();const a=document.querySelector("#card .ans .read");if(a&&cur){a.href=site(cur.sec);a.textContent="Ler na apostila: "+cur.w+" ↗"}
  const m=document.querySelector("#card .meta .tag");if(m&&cur&&cur.pa)m.insertAdjacentHTML("afterend",'<span class="tag pa">Baseado em provas antigas</span>')};   /* 28/10: selo pedido por ele */
function proxima(){const t=new Date();t.setHours(0,0,0,0);let best=null;
  for(const [id,nome] of PER.provas)for(const av of ["A1","A2"]){const v=DATAS[id+"-"+av];const d=v&&new Date((Array.isArray(v)?v[0]:v)+"T12:00:00");
    if(d&&d>=t&&(!best||d<best.d))best={d,id,nome,av,obs:Array.isArray(v)?v[1]:""}}return best}
function renderHoje(){
  // 28/10 21h: aba Hoje simplificada (pedido do Arthur): próxima prova em destaque e duas ações
  const el=document.getElementById("v-hoje"),now=new Date(),p=proxima();
  let h=`<style>.hj-prova{display:flex;align-items:center;gap:16px;padding:18px 0 22px}.hj-n{font:400 64px/1 "Libre Caslon Display",Georgia,serif;color:var(--ink,#fff);min-width:1.1em;text-align:center}.hj-prova b{display:block;font-weight:400;font-size:21px;line-height:1.3}.hj-prova small{display:block;color:var(--muted,#999);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}.hj-acoes{display:grid;gap:12px}.hj-acoes .go{margin:0}</style>`;
  if(p){const n=Math.round((p.d-new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))/864e5);
    h+=`<div class="hj-prova"><span class="hj-n">${n<=0?"Hoje":n}</span><span><b>${e_(p.nome)} · ${p.obs?e_(p.obs):p.av}</b><small>${n<=0?"a prova é hoje":(n===1?"dia":"dias")+" para a prova · "+br(p.d)}</small></span></div>`}
  else h+=`<div class="hj-prova"><span><b>Nenhuma prova marcada</b></span></div>`;
  const nx=(p&&PER.aulas.find(a=>!LIDAS[a.id]&&a.pv===p.id&&a.av===p.av))||PER.aulas.find(a=>!LIDAS[a.id]);
  const c=counts(()=>true);
  h+=`<div class="hj-acoes">`+(!PER.aulas.length?`<div class="go off"><b>Apostilas</b><span>${e_(PER.soon)}</span></div>`:
    nx?`<a class="go" href="${e_(site(nx.u))}"><b>Continuar leitura</b><span>${e_(nx.disc)} · ${e_(nx.t)}</span></a>`:`<div class="go off"><b>Apostilas</b><span>Todas lidas.</span></div>`)+
    `<a class="go" href="#cards"><b>Flashcards</b><span>${c.avail} para revisar hoje</span></a></div>`;
  el.innerHTML=h;
}
const AKEY="medaj-"+PER.id+"-av";let ABERTA={};
document.addEventListener("toggle",ev=>{const d=ev.target;if(d.matches&&d.matches("details.mat"))ABERTA[d.dataset.mat]=d.open},true);
let AV=(()=>{let v=null;try{v=localStorage.getItem(AKEY)}catch(e){}return v||(PER.aulas.some(a=>a.av==="A2")?"A2":"A1")})();
function renderApostilas(){
  const el=document.getElementById("v-apostilas");
  if(!PER.grade.length){el.innerHTML=`<p class="soon">${e_(PER.soon)}</p>`;return}
  let h=`<div class="deckbar avbar">${["A1","A2"].map(av=>`<button class="chip" type="button" data-av="${av}" aria-pressed="${AV===av}">${av}<span class="n">${PER.aulas.filter(a=>a.av===av).length}</span></button>`).join("")}</div>`;
  const item=a=>`<div class="bwrap"><a class="bitem${a.pa?" pa":""}" href="${e_(site(a.u))}"><b>${e_(a.t)}</b>${a.s?`<span>${e_(a.s)}</span>`:""}</a><div class="bfoot"><button class="lida" type="button" data-lida="${e_(a.id)}" aria-pressed="false">Marcar como lida</button>${a.refs?`<a class="lida refs" href="${e_(site(a.refs))}">Artigos ↗</a>`:""}</div></div>`;
  for(const [mat,subs] of PER.grade){
    const n=PER.aulas.filter(a=>a.mat===mat&&a.av===AV).length,lid=PER.aulas.filter(a=>a.mat===mat&&a.av===AV&&LIDAS[a.id]).length;
    h+=`<details class="mat"${ABERTA[mat]?" open":""} data-mat="${e_(mat)}"><summary><b>${e_(mat)}</b><span>${n?`${lid} de ${n} lidas`:"em breve"}</span></summary>`;
    /* 28/10: matéria com especialidades = uma fileira de botões; mostra só a especialidade escolhida (pedido dele: mais simples) */
    const nomes=subs.map(x=>x[0]).filter(Boolean),de=sub=>PER.aulas.filter(a=>a.mat===mat&&a.sub===sub&&a.av===AV);
    if(nomes.length>1){let cur=ESP[mat];if(!nomes.includes(cur))cur=nomes.find(x=>de(x).length)||nomes[0];
      h+=`<div class="espbar">${nomes.map(x=>`<button class="chip" type="button" data-esp="${e_(x)}" data-espmat="${e_(mat)}" aria-pressed="${x===cur}">${e_(x)}<span class="n">${de(x).length}</span></button>`).join("")}</div>`;
      const L=de(cur);h+=L.length?`<div class="blist">${L.map(item).join("")}</div>`:`<p class="soon">${e_(cur)} da ${AV}: em breve.</p>`}
    else for(const [sub] of subs){const L=de(sub);
      if(sub)h+=`<span class="disc">${e_(sub)}</span>`;
      h+=L.length?`<div class="blist">${L.map(item).join("")}</div>`:`<p class="soon">Em breve</p>`}
    h+=`</details>`}
  el.innerHTML=h;renderLidas();
}
const EKEY="medaj-"+PER.id+"-esp";let ESP={};try{ESP=JSON.parse(localStorage.getItem(EKEY)||"{}")}catch(e){}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-esp]");if(!b)return;ESP[b.dataset.espmat]=b.dataset.esp;try{localStorage.setItem(EKEY,JSON.stringify(ESP))}catch(e){}renderApostilas()});
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-av]");if(!b)return;AV=b.dataset.av;try{localStorage.setItem(AKEY,AV)}catch(e){}renderApostilas()});
function renderLidas(){document.querySelectorAll("[data-lida]").forEach(b=>{const on=!!LIDAS[b.dataset.lida];b.setAttribute("aria-pressed",on);b.textContent=on?"Lida":"Marcar como lida"})}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-lida]");if(!b)return;const k=b.dataset.lida;if(LIDAS[k])delete LIDAS[k];else LIDAS[k]=Date.now();try{localStorage.setItem(LKEY,JSON.stringify(LIDAS))}catch(e){}renderLidas()});
renderApostilas();
function view(){
  let h=location.hash.slice(1)||"hoje",v=h.startsWith("cards")?"cards":h;
  if(!["hoje","apostilas","cards"].includes(v))v="hoje";
  document.querySelectorAll(".view").forEach(x=>x.hidden=x.id!=="v-"+v);

}
addEventListener("hashchange",view);view();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
