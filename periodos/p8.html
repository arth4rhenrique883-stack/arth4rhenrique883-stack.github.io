e por que o termo substituiu \"sinusite\"?","a":"Inflamação da mucosa do nariz e dos seios paranasais; a mucosa é contínua pelos óstios, então a inflamação raramente fica num só sítio.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-12","ch":"gineco-A1","av":"A1","q":"Diferencie PAAF, core e mamotomia.","a":"PAAF: células soltas. Core: fragmento tecidual. Mamotomia: tecido e microcalcificações.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-13","ch":"obst-A1","av":"A1","q":"Como se calcula e se usa o índice de Bishop?","a":"Soma altura, dilatação, apagamento, consistência e posição do colo (0 a 13). Bishop 6: induzir com ocitocina.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L12","ch":"cirurgia-A1","av":"A1","q":"Cite dois cuidados contra a intoxicação.","a":"Respeitar a dose máxima e aspirar antes de injetar.","sec":"cirurgia/resumos/10/12/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Toxicidade: o que eleva o nível plasmático · slide 29"},{"id":"or-sinus-02","ch":"otorrino-A1","av":"A1","q":"Até quando a rinossinusite é aguda pela ABR e pelo EPOS, e como a AAO-HNSF divide?","a":"Aguda até 12 semanas (crônica 12 ou mais). AAO-HNSF: aguda até 4 semanas, subaguda de 4 a 12, crônica 12 ou mais.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-13","ch":"gineco-A1","av":"A1","q":"PAAF que não aspira nada sugere?","a":"Nódulo sólido.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-14","ch":"obst-A1","av":"A1","q":"Quais as contraindicações do misoprostol na indução?","a":"Cicatriz uterina prévia, hepatopatia e presença de contrações.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L13","ch":"cirurgia-A1","av":"A1","q":"Qual o primeiro sinal e qual o último?","a":"Formigamento de língua e lábios; depressão cardiovascular.","sec":"cirurgia/resumos/10/13/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Sintomas da sobredose: a escada da lidocaína · slides 30–31"},{"id":"or-sinus-03","ch":"otorrino-A1","av":"A1","q":"Quais são os critérios clínicos de RSA?","a":"Dois ou mais sintomas por até 12 semanas: obstrução/congestão nasal, rinorreia anterior ou posterior, dor/pressão facial, redução do olfato (tosse em criança).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-14","ch":"gineco-A1","av":"A1","q":"Sítios de metástase do câncer de mama?","a":"Osso, fígado, pulmão e cérebro.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-15","ch":"obst-A1","av":"A1","q":"Diferencie fase ativa prolongada de parada secundária da dilatação.","a":"Prolongada: dilatação lenta (< 1 cm/h), cruza a linha de alerta, por contração ineficiente; corrige-se com ocitocina e medidas. Parada secundária: dilatação igual em 2 toques com 2 h de intervalo apesar de boa dinâmica, por desproporção; cesárea.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L14","ch":"cirurgia-A1","av":"A1","q":"Por que oxigenar e ventilar?","a":"Elevam o limiar convulsivo e evitam a acidose.","sec":"cirurgia/resumos/10/14/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Tratamento: respiração e circulação · slides 32–33"},{"id":"or-sinus-04","ch":"otorrino-A1","av":"A1","q":"Como evolui a RSA viral?","a":"Pico em 2 a 3 dias e melhora gradual, resolvendo até 7 a 10 dias (normalmente até 14).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-15","ch":"gineco-A1","av":"A1","q":"Cite os 4 subtipos moleculares.","a":"Luminal A, luminal B, HER2 e triplo negativo.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ci-an-locais-L15","ch":"cirurgia-A1","av":"A1","q":"Qual a dose de emulsão lipídica 20%?","a":"Bolus de 1,5 mL/kg, depois 0,25 mL/kg/min.","sec":"cirurgia/resumos/10/15/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Emulsão lipídica e o protocolo de LAST · slides 34–35"},{"id":"or-sinus-05","ch":"otorrino-A1","av":"A1","q":"O que é a RSA viral prolongada?","a":"Sintomas intensos nos 2 a 3 primeiros dias e melhora mais lenta, por 3 a 4 semanas ou mais, sem piora e sem sinais bacterianos (no EPOS, pós-viral).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-16","ch":"gineco-A1","av":"A1","q":"Suspeita de prótese rota: exame? E seroma tardio?","a":"RNM sem contraste; linfoma anaplásico de grandes células.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ci-an-neuro-L0","ch":"cirurgia-A1","av":"A1","q":"Entre quais estruturas fica o espaço peridural?","a":"Entre a dura-máter e o ligamento amarelo (a raqui vai no subaracnóideo, entre pia e aracnoide).","sec":"cirurgia/resumos/11/0/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Coluna e meninges: onde a agulha para · slides 2–4"},{"id":"or-sinus-06","ch":"otorrino-A1","av":"A1","q":"Quais os dois padrões que definem a RSA bacteriana no Quadro 2.1?","a":"Dupla piora após melhora dos primeiros 5 dias, ou manutenção do quadro intenso sem melhora após 14 dias.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-01","ch":"gineco-A1","av":"A1","q":"Gestante com corrimento fino, odor de peixe e clue cells: tratamento do slide?","a":"Metronidazol 250 mg VO 8/8 h por 7 dias.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L1","ch":"cirurgia-A1","av":"A1","q":"Até onde vai a medula e onde se faz a raqui?","a":"A medula vai até L2; a raqui é feita abaixo de L2.","sec":"cirurgia/resumos/11/1/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Medula, cauda equina e líquor · slides 5–6"},{"id":"or-sinus-07","ch":"otorrino-A1","av":"A1","q":"Quais os 5 sinais de RSA bacteriana e quantos são necessários?","a":"Pelo menos 3: secreção amarelada unilateral, dor local intensa unilateral, febre acima de 38 °C, PCR/VHS aumentados, dupla piora.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-02","ch":"gineco-A1","av":"A1","q":"Corrimento espumoso + colo em morango: quem tratar?","a":"Paciente e parceiro (metronidazol).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L2","ch":"cirurgia-A1","av":"A1","q":"De quais segmentos sai o simpático?","a":"De T1 a L2 (toracolombar).","sec":"cirurgia/resumos/11/2/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Dermátomos e o sistema simpático · slides 7–8"},{"id":"or-sinus-08","ch":"otorrino-A1","av":"A1","q":"Quantos adultos e crianças com RSAV evoluem para bacteriana?","a":"0,5 a 2% dos adultos e 5 a 13% das crianças.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-03","ch":"gineco-A1","av":"A1","q":"5 episódios de candidíase em 1 ano: conduta?","a":"Cultura, tópico 14 dias e fluconazol 150 mg semanal por 6 meses.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L3","ch":"cirurgia-A1","av":"A1","q":"Que vértebra a linha bicrista marca?","a":"O corpo de L4.","sec":"cirurgia/resumos/11/3/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raquianestesia: preparo e posição · slides 9–13"},{"id":"or-sinus-09","ch":"otorrino-A1","av":"A1","q":"Defina RSA recorrente e diga o que a separa da crônica.","a":"4 ou mais episódios de RSAB por ano; o que a separa da crônica é a normalidade comprovada entre as crises.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-04","ch":"gineco-A1","av":"A1","q":"Abscesso tubovariano íntegro: Monif e conduta?","a":"Monif 3; internar, observar 48 h, cirurgia se não melhorar.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L4","ch":"cirurgia-A1","av":"A1","q":"O que confirma a agulha de raqui no lugar?","a":"Fluxo livre de líquor ao retirar o mandril.","sec":"cirurgia/resumos/11/4/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raquianestesia: a técnica da punção · slides 14–20"},{"id":"or-sinus-10","ch":"otorrino-A1","av":"A1","q":"Quando pedir exame de imagem na RSA?","a":"Só na suspeita de complicação ou de diagnóstico alternativo; caso típico e não grave não pede exame.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-05","ch":"gineco-A1","av":"A1","q":"DNA-HPV positivo para HPV 18: conduta?","a":"Colposcopia.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L5","ch":"cirurgia-A1","av":"A1","q":"Que ponta de agulha causa menos cefaleia pós-punção?","a":"A ponta de lápis (Whitacre, Sprotte), e quanto mais fina melhor.","sec":"cirurgia/resumos/11/5/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · As agulhas de raqui · slide 21"},{"id":"or-sinus-11","ch":"otorrino-A1","av":"A1","q":"Qual a conduta com antibiótico na RSAV, na RSAVP e na RSAB moderada?","a":"Contra antibiótico na RSAV e RSAVP; na RSAB moderada, espera cuidadosa com antibiótico só se não melhorar ou piorar em 48 a 72 h.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-06","ch":"gineco-A1","av":"A1","q":"Tumor de colo de 5 cm restrito ao colo: estádio e tratamento?","a":"IB3; radioterapia + quimioterapia.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L6","ch":"cirurgia-A1","av":"A1","q":"Quando a raqui causa bradicardia?","a":"Só no bloqueio alto, que pega T1 a T4.","sec":"cirurgia/resumos/11/6/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Efeitos do bloqueio espinhal · slide 22"},{"id":"or-sinus-12","ch":"otorrino-A1","av":"A1","q":"Qual o antibiótico de escolha no adulto e as doses?","a":"Amoxicilina 500 mg 8/8 h ou 875 mg 12/12 h, 7 a 10 dias; amoxicilina + clavulanato 500/125 mg 8/8 h ou 875/125 mg 12/12 h se betalactamase.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-07","ch":"gineco-A1","av":"A1","q":"Tratada por quimiorradiação de colo, amenorreia: FSH esperado?","a":"Alto (> 25 em duas dosagens) — insuficiência ovariana, compartimento II.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L7","ch":"cirurgia-A1","av":"A1","q":"Quanto dura a analgesia da morfina na raqui?","a":"Mais de 18 h, não segmentar (o fentanil, até 3 h, segmentar).","sec":"cirurgia/resumos/11/7/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Drogas da raqui: anestésicos, baricidade e adjuvantes · slides 23–24"},{"id":"or-sinus-13","ch":"otorrino-A1","av":"A1","q":"Qual a dose de amoxicilina na criança?","a":"25 a 50 mg/kg/dia; 90 mg/kg/dia se suspeita de pneumococo resistente, 8/8 h ou 12/12 h, 7 a 10 dias.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-08","ch":"gineco-A1","av":"A1","q":"Teste da progesterona positivo: diagnóstico?","a":"Anovulação crônica (ex.: SOP).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L8","ch":"cirurgia-A1","av":"A1","q":"Quando se indica o blood patch?","a":"Nas formas graves e incapacitantes; as leves a moderadas, tratamento conservador.","sec":"cirurgia/resumos/11/8/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Cefaleia pós-punção e o blood patch · slides 25–26"},{"id":"or-sinus-14","ch":"otorrino-A1","av":"A1","q":"Quando usar corticoide sistêmico na RSA?","a":"Nunca IM de depósito; oral só na RSAB com dor intensa refratária a 48 a 72 h de tratamento, pelo menor tempo.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-09","ch":"gineco-A1","av":"A1","q":"FSH e LH baixos, estradiol baixo, PRL normal: compartimento?","a":"III ou IV (central).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L9","ch":"cirurgia-A1","av":"A1","q":"Qual contraindicação é só da raqui?","a":"Aumento da pressão intracraniana.","sec":"cirurgia/resumos/11/9/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Outras complicações e contraindicações da raqui · slides 27–28"},{"id":"or-sinus-15","ch":"otorrino-A1","av":"A1","q":"Por que as complicações orbitárias acontecem e qual a frequência das complicações?","a":"Por fluxo venoso retrógrado num sistema avalvular; são raras, 2 a 5 casos por milhão.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-10","ch":"gineco-A1","av":"A1","q":"Pico de LH em relação à ovulação?","a":"~36 h antes.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L10","ch":"cirurgia-A1","av":"A1","q":"Que referência marca T7?","a":"A linha interescapular (pontas das escápulas).","sec":"cirurgia/resumos/11/10/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: preparo, níveis e agulha · slides 29–35"},{"id":"revisao-final-misturada-11","ch":"gineco-A1","av":"A1","q":"Mioma com crescimento após a menopausa: o que fazer?","a":"Tratamento invasivo — suspeita de malignidade.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L11","ch":"cirurgia-A1","av":"A1","q":"Com o que se faz a dose-teste da peridural?","a":"Lidocaína 2% com adrenalina.","sec":"cirurgia/resumos/11/11/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: achar o espaço, dose-teste e cateter · slides 36–39"},{"id":"revisao-final-misturada-12","ch":"gineco-A1","av":"A1","q":"Degeneração mais comum do mioma?","a":"Hialina.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L12","ch":"cirurgia-A1","av":"A1","q":"O que é a raqui total?","a":"Injeção inadvertida da dose de peridural no espaço subaracnóideo.","sec":"cirurgia/resumos/11/12/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: drogas, complicações e contraindicações · slides 40–42"},{"id":"revisao-final-misturada-13","ch":"gineco-A1","av":"A1","q":"Descarga sanguinolenta unilateral: conduta?","a":"Encaminhar ao mastologista para biópsia (papiloma provável).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L13","ch":"cirurgia-A1","av":"A1","q":"No bloqueio combinado, qual técnica é a base?","a":"A raquianestesia; a peridural é complementar.","sec":"cirurgia/resumos/11/13/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raqui × peridural e o bloqueio combinado · slide 43"},{"id":"revisao-final-misturada-14","ch":"gineco-A1","av":"A1","q":"BI-RADS 3: conduta?","a":"Controle semestral.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L14","ch":"cirurgia-A1","av":"A1","q":"De quais raízes nasce o plexo braquial?","a":"De C5 a T1.","sec":"cirurgia/resumos/11/14/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios periféricos: equipamento e anatomia · slides 44–50"},{"id":"revisao-final-misturada-15","ch":"gineco-A1","av":"A1","q":"Mastite puerperal: suspender amamentação?","a":"Não.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L15","ch":"cirurgia-A1","av":"A1","q":"No supraclavicular, ao lado de qual vaso fica o plexo?","a":"Da artéria subclávia, sobre a primeira costela.","sec":"cirurgia/resumos/11/15/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios do pescoço e do membro superior · slides 51–61"},{"id":"revisao-final-misturada-16","ch":"gineco-A1","av":"A1","q":"Fator que NÃO é de risco para câncer de colo: multiparidade ou menarca precoce?","a":"Menarca precoce (multiparidade é fator de risco).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ci-an-neuro-L16","ch":"cirurgia-A1","av":"A1","q":"O que o ciático poplíteo não anestesia abaixo do joelho?","a":"A face medial da perna e do pé (território do safeno).","sec":"cirurgia/resumos/11/16/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios do membro inferior · slides 62–69"},{"id":"ci-an-neuro-L17","ch":"cirurgia-A1","av":"A1","q":"Em que plano vai o anestésico no TAP?","a":"Entre o oblíquo interno e o transverso do abdome.","sec":"cirurgia/resumos/11/17/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios da parede abdominal · slides 70–75"},{"id":"ci-abd-agudo-01","ch":"cirurgia-A1","av":"A1","q":"Defina abdome agudo.","a":"Afecção não traumática, que acomete de modo súbito as vísceras abdominais, perdura por mais de 6 horas e requer decisão urgente, em geral operação nas próximas 6 a 12 horas.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-02","ch":"cirurgia-A1","av":"A1","q":"Quais são as 5 síndromes do abdome agudo e um exemplo de cada?","a":"Perfurativa (úlcera duodenal perfurada), inflamatória (apendicite aguda), oclusiva ou obstrutiva (obstrução por aderência), hemorrágica (prenhez tubária rota) e vascular (trombose da artéria mesentérica superior).","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o exame de eleição de cada síndrome, segundo a prova antiga?","a":"Inflamatória: USG ou TC. Obstrutiva: RX simples ou TC. Perfurativa: RX simples ou TC. Hemorrágica: beta-hCG e USG. Vascular: angio-TC.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-04","ch":"cirurgia-A1","av":"A1","q":"Diferencie dor visceral de dor parietal.","a":"Visceral: sistema nervoso autônomo, estímulo por distensão, inflamação ou isquemia, início gradual, mal localizada na linha média. Parietal: nervo cerebroespinal de T6 a L1, localiza o quadrante, com sinais de irritação peritoneal.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-05","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais comemorativos do abdome agudo cirúrgico, e quando se diz Blumberg?","a":"Dor, defesa, contratura e descompressão dolorosa. Blumberg é a descompressão dolorosa no quadrante inferior direito.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-06","ch":"cirurgia-A1","av":"A1","q":"Cite 5 causas não operatórias de abdome agudo.","a":"Por exemplo: IAM, pneumonia, cetoacidose diabética, crise falciforme e porfiria; também embolia pulmonar, pericardite, herpes-zóster, crise addisoniana, intoxicação por chumbo e abstinência de narcóticos.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-07","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência de exames na mulher com dor abdominal aguda?","a":"Beta-hCG, EAS, PCR e USG de abdome. Se não grávida, TC; se grávida, USG e ressonância. Se nada concluir, laparoscopia.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-08","ch":"cirurgia-A1","av":"A1","q":"Quais são as recomendações que pesam para indicar a laparoscopia no abdome agudo?","a":"Estabilidade hemodinâmica (instável: ressuscitar primeiro) e ausência de grande distensão abdominal (muita distensão: laparotomia); pesam também distúrbios da coagulação e cirurgias abdominais prévias. O compromisso é com o paciente, não com o método.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-09","ch":"cirurgia-A1","av":"A1","q":"Quais são os 4 objetivos do tratamento da síndrome perfurativa?","a":"Medidas clínicas de ressuscitação, eliminar a causa da contaminação, reduzir o inóculo bacteriano e impedir a sepse persistente.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-10","ch":"cirurgia-A1","av":"A1","q":"Por que a úlcera perfurada não vomita e a pancreatite vomita?","a":"Na perfuração o estômago esvazia na cavidade. Na pancreatite há gastroparesia, o estômago fica cheio e ainda estimula a secreção pancreática: dor com vômito.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-11","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar no RX a alça de delgado da alça de cólon?","a":"Delgado: válvulas coniventes (Kerckring) que atravessam a alça inteira, no centro, em empilhamento de moedas. Cólon: haustrações que não atravessam a alça, na periferia.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-12","ch":"cirurgia-A1","av":"A1","q":"Quais são os preditores radiológicos de obstrução do delgado?","a":"Dois ou mais níveis hidroaéreos, níveis com 2,5 cm ou mais e diferença de altura maior que 5 mm entre níveis no mesmo segmento de alça.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-13","ch":"cirurgia-A1","av":"A1","q":"O que significa o colar de pérolas com ausência de ar no reto e no ceco?","a":"Obstrução completa: inversão total do padrão de gases. Oclusão grave ou completa é cirúrgica.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-14","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento inicial da obstrução de delgado por aderência?","a":"Sonda nasogástrica para desobstrução gástrica, correção dos distúrbios hidroeletrolíticos, antiemético e TC.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-15","ch":"cirurgia-A1","av":"A1","q":"Por que o cólon rompe no ceco na obstrução em 2 pontos?","a":"Com a papila ileocecal competente a alça fica fechada; o ceco tem o maior diâmetro do cólon e por isso sofre a maior tensão na parede.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-16","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco de ruptura do aneurisma de aorta?","a":"Diâmetro maior que 5 cm, morfologia do aneurisma, hipertensão arterial e DPOC. Metade não chega ao hospital.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-17","ch":"cirurgia-A1","av":"A1","q":"Quem é o doente da síndrome vascular e como é o quadro?","a":"Cardiopata com fibrilação atrial, aterosclerose, trombose prévia, trombofilia ou sepse grave. Dor intensa de rápida instalação, desproporcional ao exame no início, depois reação peritoneal difusa e íleo adinâmico difuso.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-agudo-18","ch":"cirurgia-A1","av":"A1","q":"Segundo o gabarito da prova antiga, quais são as medidas comuns no tratamento da obstrução intestinal?","a":"Descompressão nasogástrica por cateter, reposição hidroeletrolítica com dieta zero e cobertura antimicrobiana.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ci-abd-apendicite-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a incidência, a faixa etária e a mortalidade da apendicite?","a":"Incidência de 7%, entre 10 e 30 anos (75% antes dos 40). Mortalidade de 0,5% sem perfuração e 2,5% perfurada, maior em lactentes e idosos.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-02","ch":"cirurgia-A1","av":"A1","q":"Qual é a causa da obstrução apendicular na criança e no adulto?","a":"Na criança, hiperplasia linfoide. No adulto, fecalito.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-03","ch":"cirurgia-A1","av":"A1","q":"Descreva a sequência da fisiopatologia da apendicite.","a":"Obstrução em alça fechada, multiplicação bacteriana e disória (mucosa secreta), distensão intraluminal, comprometimento do retorno venoso, obstrução arterial, necrose e perfuração. Depois, bloqueio pelo omento (abscesso) ou peritonite difusa.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-04","ch":"cirurgia-A1","av":"A1","q":"Por que a dor da apendicite começa no epigástrio e migra para a fossa ilíaca direita?","a":"Na 1ª fase a distensão do apêndice gera dor visceral, autonômica, mal localizada na linha média. Na 2ª fase a inflamação atinge a serosa e o peritônio parietal, de inervação somática, e a dor localiza na FID.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-05","ch":"cirurgia-A1","av":"A1","q":"Quais sinais podem faltar na apendicite?","a":"Psoas, obturador, Rovsing, vômitos, febre, leucocitose e bastonetose.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-06","ch":"cirurgia-A1","av":"A1","q":"Por que não dar antibiótico antes de decidir pela cirurgia na suspeita de apendicite?","a":"Porque mascara o quadro: dá falsa sensação de melhora e o doente volta depois, já com necrose ou perfuração.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-07","ch":"cirurgia-A1","av":"A1","q":"Como interpretar o EAS com piócitos na suspeita de apendicite?","a":"Mais de 20 piócitos pode ser tratado como infecção urinária; menos de 20 pode ser piúria da própria apendicite. O EAS tem 30% de falso-positivo.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-08","ch":"cirurgia-A1","av":"A1","q":"Qual é o critério de apendicite na USG e quais são as vantagens da TC?","a":"Diâmetro apendicular maior que 6 mm. A TC é o padrão-ouro (exceto na gestante), melhor nos atípicos, nos obesos e para abscesso e perfuração, com sensibilidade de 96% e especificidade de 97%.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-10","ch":"cirurgia-A1","av":"A1","q":"Cite os graus da classificação da WSES para apendicite.","a":"0 normal, 1 inflamado, 2 necrose, 3 tumor inflamatório (flegmão, abscesso menor ou maior que 4 cm) e 4 perfurado com peritonite difusa.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-11","ch":"cirurgia-A1","av":"A1","q":"Qual é a principal complicação da apendicectomia aberta e da laparoscópica?","a":"Na aberta, infecção do sítio cirúrgico superficial. Na laparoscópica, infecção do sítio cirúrgico intra-abdominal (abscesso).","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-apendicite-12","ch":"cirurgia-A1","av":"A1","q":"O que é hérnia de Amyand?","a":"Apêndice dentro do saco de uma hérnia inguinal.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ci-abd-hernias-parede-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a diferença entre hérnia e evisceração?","a":"Na hérnia peritônio e pele estão íntegros (há saco). Na evisceração há rompimento total de todos os componentes da parede.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-02","ch":"cirurgia-A1","av":"A1","q":"Diferencie hérnia redutível, encarcerada e estrangulada.","a":"Redutível volta à cavidade. Encarcerada é irredutível (aguda ou crônica) sem sofrimento vascular. Estrangulada é irredutível com sofrimento vascular: dor intensa, hiperemia, necrose.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-03","ch":"cirurgia-A1","av":"A1","q":"Quais são as faixas de tamanho das hérnias ventrais pela EHS/AHS 2020?","a":"Menor que 1 cm, de 1 a 4 cm e maior que 4 cm.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-04","ch":"cirurgia-A1","av":"A1","q":"Onde fica a hérnia de Spiegel?","a":"Entre a linha semilunar e a linha arqueada, lateral ao músculo reto.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-05","ch":"cirurgia-A1","av":"A1","q":"O que define diástase dos retos e por que ela não é hérnia?","a":"Separação dos retos maior que 2 cm. A aponeurose está íntegra e não há anel, então não encarcera nem estrangula; mas 45% têm hérnia associada.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-06","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento da diástase dos retos?","a":"Perda de peso e atividade física para aumentar o tônus abdominal; cirurgia em casos selecionados.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-07","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia epigástrica?","a":"1,6 a 3,6% das hérnias, 2 a 3 vezes mais no homem, 20% múltiplas, 40 a 50% assintomáticas, dor desproporcional, estrangulamento raro, 5 a 10% de recidiva.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-08","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia umbilical no adulto e na criança?","a":"Adulto: 3 vezes mais na mulher, 70% entre a 4ª e a 6ª década, estrangula pouco (5%) mas com mortalidade mais de 15 vezes maior. Criança: 80% fecham até os 5 anos se o anel tem menos de 1 cm.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-09","ch":"cirurgia-A1","av":"A1","q":"Quando se indica tela na hérnia ventral?","a":"Defeito maior que 4 cm, ou de 1 a 4 cm com fator de risco (trabalho braçal, tosse crônica, gestação planejada, incisional, corticoide, má cicatrização, ascite, colágeno, diástase).","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-10","ch":"cirurgia-A1","av":"A1","q":"O que deve ser feito antes da cirurgia eletiva de hérnia?","a":"Corrigir os fatores de risco: perder peso, controlar o diabetes, tratar constipação e ascite, parar de fumar.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-11","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores predisponentes da hérnia incisional?","a":"Tensão, infecção do sítio cirúrgico, má cicatrização (DM, desnutrição), aumento da pressão intra-abdominal (DPOC, obesidade), idade, tabagismo, cirurgia de emergência, reoperações e falhas técnicas.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-12","ch":"cirurgia-A1","av":"A1","q":"Qual é a incidência e a recidiva da hérnia incisional?","a":"Incidência de 10 a 15% das laparotomias; recidiva de 25 a 43%; estrangulamento em 17%.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-parede-14","ch":"cirurgia-A1","av":"A1","q":"Qual posição de tela está associada à recidiva?","a":"Inlay (tela só nas bordas do defeito).","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ci-abd-hernias-inguinais-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a proporção das hérnias inguinais e a relação entre os sexos?","a":"75% de todas as hérnias, 9 a 12 vezes mais no homem. Risco ao longo da vida de 27 a 43% no homem e 3 a 6% na mulher.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-02","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar hérnia direta de indireta pela anatomia?","a":"A indireta sai lateral aos vasos epigástricos inferiores, pelo anel inguinal interno e canal. A direta sai medial a eles, pelo trígono de Hesselbach.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-03","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia femoral?","a":"4% das inguinais, 4 vezes mais na mulher, estrangula 10 vezes mais.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-04","ch":"cirurgia-A1","av":"A1","q":"Quais são os picos de incidência da hérnia inguinal?","a":"De 0 a 5 anos e de 75 a 80 anos.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-05","ch":"cirurgia-A1","av":"A1","q":"Cite os fatores de risco de hérnia inguinal.","a":"História familiar, hérnia contralateral prévia, sexo masculino, idade avançada, deficiência de colágeno, IMC baixo e prostatectomia (4 vezes).","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-06","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar medial e lateral no exame físico?","a":"Medial: redução fácil, ovalada, bilateral, acima de 30 anos. Lateral: redução mais difícil, tubular, desce para a bolsa escrotal. Manobra de Landivar (dedo fletido) oblitera o anel interno.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-07","ch":"cirurgia-A1","av":"A1","q":"Quando pedir exame de imagem na hérnia inguinal e qual é o padrão-ouro?","a":"Só quando o exame clínico é duvidoso (obeso, por exemplo). USG primeiro (USG + clínica = 95%); padrão-ouro é a RM dinâmica.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-08","ch":"cirurgia-A1","av":"A1","q":"Descreva a classificação de Nyhus.","a":"I: indireta com anel interno normal. II: indireta com anel alargado. III: defeito da parede posterior (A direta, B indireta, C femoral). IV: recidivada.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-09","ch":"cirurgia-A1","av":"A1","q":"O que significam S1, S2 e S3 na EHS 2023?","a":"Extensão da hérnia inguinoescrotal: até a raiz da coxa, até o meio da coxa e até o joelho.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-10","ch":"cirurgia-A1","av":"A1","q":"Quando a hérnia inguinal assintomática deve ser operada?","a":"Na mulher e na criança. No homem assintomático a conduta expectante é segura, mas mais de 2/3 ficam sintomáticos.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-12","ch":"cirurgia-A1","av":"A1","q":"O que é inguinodinia e quais são seus fatores de risco?","a":"Dor crônica por mais de 3 meses após a correção (2 a 11%). Fatores: dor intensa no pré e pós-operatório, sexo feminino, via anterior, paciente jovem, recidiva.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-13","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de recidiva da hérnia inguinal?","a":"Técnica incorreta, sexo feminino (orifício femoral não tratado), colágeno, hérnia por deslizamento, obesidade, hérnia medial e cirurgião de baixo volume.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-14","ch":"cirurgia-A1","av":"A1","q":"Qual técnica usa tela por via anterior e quais são as laparoscópicas?","a":"Lichtenstein por via anterior; TEP e TAPP laparoscópicas. Shouldice e Bassini são sem tela.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta na hérnia inguinal sintomática, em cirurgia eletiva?","a":"Herniorrafia com tela: técnica de Lichtenstein (via anterior) ou laparoscópica (TEP ou TAPP). Caiu numa fechada.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-torax-01","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome de Pancoast?","a":"Tumor do sulco superior que comprime o simpático em T1 e T2: dor e parestesia no braço, com anidrose da face, miose, enoftalmia e ptose (Horner).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-02","ch":"cirurgia-A1","av":"A1","q":"Em que incidência se avalia a área cardíaca no RX?","a":"Só em PA, e com o RX bem inspirado.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-03","ch":"cirurgia-A1","av":"A1","q":"O que sugere fratura dos três primeiros arcos costais?","a":"Lesão vascular.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-04","ch":"cirurgia-A1","av":"A1","q":"Para que lado vai o mediastino na atelectasia?","a":"Para o lado da lesão, com diminuição dos espaços intercostais.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-05","ch":"cirurgia-A1","av":"A1","q":"O que é o sinal da maçã mordida?","a":"No esofagograma, a estenose irregular do câncer de esôfago, com dilatação a montante.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-06","ch":"cirurgia-A1","av":"A1","q":"Para que serve a cintilografia pulmonar de perfusão na cirurgia torácica?","a":"Mostra quanto sangue vai para cada pulmão e, com a espirometria, estima a função depois da ressecção.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-07","ch":"cirurgia-A1","av":"A1","q":"Quantos segmentos e quanto da função tem cada pulmão?","a":"Direito: 10 segmentos, 55%. Esquerdo: 8 segmentos, 45%.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-08","ch":"cirurgia-A1","av":"A1","q":"O que faz a videomediastinoscopia?","a":"Retira linfonodos do mediastino para anatomopatológico (estadiamento).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-09","ch":"cirurgia-A1","av":"A1","q":"Para que serve a agulha de Cope?","a":"Biópsia pleural.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-10","ch":"cirurgia-A1","av":"A1","q":"Quais são os três compartimentos do mediastino e o que pensar em cada um?","a":"Anterior: os 4 T. Médio: cistos (broncogênico, pericárdico). Posterior: tumor neurogênico.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-12","ch":"cirurgia-A1","av":"A1","q":"Qual faixa etária tem mais massas mediastinais malignas e quais são elas?","a":"20 a 40 anos: linfomas e tumores de células germinativas.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-13","ch":"cirurgia-A1","av":"A1","q":"Qual é o primeiro exame e qual é o principal exame na massa do mediastino?","a":"Primeiro o RX PA e perfil; o principal é a TC com contraste, que não dá diagnóstico patológico.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-14","ch":"cirurgia-A1","av":"A1","q":"O que dá a compressão do laríngeo recorrente e por que o esquerdo?","a":"Disfonia e rouquidão; o esquerdo passa por baixo da aorta, perto do mediastino médio.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a relação entre timoma e miastenia?","a":"Timoma está em 10% dos miastênicos acima de 40 anos; na miastenia se faz timectomia com limpeza da gordura do mediastino.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-16","ch":"cirurgia-A1","av":"A1","q":"Quais marcadores pedir na massa mediastinal do homem jovem?","a":"β-hCG e alfafetoproteína, e palpar a bolsa escrotal.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o tumor de células germinativas maligno mais comum do mediastino?","a":"O seminoma (50% pela aula). No geral, contando os benignos, o mais comum é o teratoma maduro.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-18","ch":"cirurgia-A1","av":"A1","q":"Qual é o sinal mais frequente do bócio mergulhante e por onde se opera?","a":"Compressão da traqueia; acesso pela via cervical.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-19","ch":"cirurgia-A1","av":"A1","q":"Por que pedir RM no tumor neurogênico do mediastino posterior?","a":"Porque ele pode entrar no canal medular (tumor em halter), e a cirurgia pode lesar a medula.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-20","ch":"cirurgia-A1","av":"A1","q":"Qual é o tumor neurogênico mais comum no adulto e na criança?","a":"Adulto: schwannoma (neurilemoma). Criança: ganglioneuroma.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-21","ch":"cirurgia-A1","av":"A1","q":"Quem deve fazer rastreamento de câncer de pulmão no Brasil?","a":"Pessoas de 50 a 80 anos, fumantes atuais ou ex-fumantes que pararam há até 15 anos, com carga tabágica de 20 anos-maço ou mais, com TC de baixa dose anual.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-22","ch":"cirurgia-A1","av":"A1","q":"Como se calcula a carga tabágica?","a":"Cigarros por dia divididos por 20, multiplicados pelos anos de tabagismo. Resultado em anos-maço.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-23","ch":"cirurgia-A1","av":"A1","q":"Qual tipo de câncer de pulmão dá broncorreia em \"clara de ovo\"?","a":"Adenocarcinoma lepídico (antigo bronquioloalveolar), em geral em não fumante, com consolidação que não resolve.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-24","ch":"cirurgia-A1","av":"A1","q":"Pneumonia de repetição no mesmo lobo em fumante: como investigar?","a":"TC de tórax e broncoscopia, pensando em obstrução brônquica por tumor.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-25","ch":"cirurgia-A1","av":"A1","q":"Quais tipos de câncer de pulmão são centrais e quais são periféricos?","a":"Centrais: epidermoide e oat cell (sintomáticos, tosse). Periféricos: adenocarcinoma e grandes células (silenciosos, o primeiro sintoma costuma ser o emagrecimento).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-26","ch":"cirurgia-A1","av":"A1","q":"Qual é o tipo de câncer de pulmão mais frequente, segundo a aula?","a":"O adenocarcinoma, com 45 a 50% dos casos.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-27","ch":"cirurgia-A1","av":"A1","q":"Quando a aula manda pedir broncoscopia no fumante com pneumonia?","a":"Quando a resolução radiológica é lenta (mais de 10 dias) ou a pneumonia se repete no mesmo segmento em 6 meses a 1 ano.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-28","ch":"cirurgia-A1","av":"A1","q":"Derrame pleural leitoso num paciente com câncer de pulmão: o que é e o que dosar?","a":"Quilotórax por invasão do ducto torácico; dosar triglicerídeos no líquido.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-29","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome da veia cava superior e qual tumor costuma causá-la?","a":"Edema e pletora da face, veias do pescoço, ombro e braços dilatadas, sintomas de hipertensão craniana; em geral oat cell com metástase mediastinal, diagnosticado por biópsia de linfonodo.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-30","ch":"cirurgia-A1","av":"A1","q":"Que parte do corpo o PET-scan não estuda bem no estadiamento?","a":"O encéfalo, que já capta glicose; usa-se RM de crânio.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-31","ch":"cirurgia-A1","av":"A1","q":"Por que a TC de estadiamento inclui o andar superior do abdome?","a":"Para pegar fígado e adrenais, sítios de metástase.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-32","ch":"cirurgia-A1","av":"A1","q":"O que muda a conduta quando aparece N2?","a":"Se é conhecido antes (TC ou mediastinoscopia), quimioterapia neoadjuvante e depois cirurgia; se é achado na cirurgia, quimioterapia adjuvante.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-33","ch":"cirurgia-A1","av":"A1","q":"Quando o câncer de pulmão não é cirúrgico, pelas anotações da aula?","a":"T4 ou N3: sem cirurgia, prognóstico ruim, radioterapia.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-34","ch":"cirurgia-A1","av":"A1","q":"Qual paraneoplásica é clássica do carcinoma escamoso e qual do oat cell?","a":"Escamoso: hipercalcemia por PTHrP. Oat cell: SIADH, Cushing ectópico e Lambert-Eaton (o slide agrupa diferente; ver a caixa âmbar).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-36","ch":"cirurgia-A1","av":"A1","q":"O que pedir no líquido pleural para descartar empiema?","a":"pH, DHL, glicose, Gram e cultura.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-37","ch":"cirurgia-A1","av":"A1","q":"Como se confirma a tuberculose pleural?","a":"Exsudato linfocítico com ADA alta; a confirmação clássica é a biópsia pleural com agulha de Cope mostrando granuloma.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-38","ch":"cirurgia-A1","av":"A1","q":"Qual fungo forma bola fúngica em caverna e qual se pega em grutas?","a":"Aspergillus fumigatus forma o aspergiloma; histoplasmose se pega em grutas.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-39","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência de exames de diagnóstico e estadiamento no tumor de pulmão do tabagista (caiu como discursiva)?","a":"TC com contraste incluindo o andar superior do abdome; tecido por broncoscopia, EBUS ou punção percutânea; mediastino por EBUS ou mediastinoscopia; se operável, prova de função respiratória e cintilografia perfusional.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-coloprocto-01","ch":"cirurgia-A1","av":"A1","q":"Quais são os riscos e cuidados da colonoscopia?","a":"É invasiva: exige preparo do cólon, é feita sob sedação e pode perfurar ou sangrar.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-02","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar abscesso anal, fissura e trombose hemorroidária?","a":"Abscesso: dor contínua com febre. Fissura: dor ao evacuar com sangue no papel. Trombose: nódulo azulado doloroso, súbito, sem febre.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o exame de escolha na suspeita de diverticulite aguda?","a":"TC de abdome e pelve. A colonoscopia fica para 6 a 8 semanas depois.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-04","ch":"cirurgia-A1","av":"A1","q":"A maioria dos cânceres colorretais é esporádica ou hereditária? De onde se originam?","a":"Esporádica, a partir do adenoma (sequência adenoma-carcinoma).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-05","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco do câncer colorretal?","a":"Idade, história familiar, DII, obesidade, tabagismo, álcool, sedentarismo, carne vermelha e processada.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-06","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta diante de sangue oculto positivo?","a":"Colonoscopia.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-07","ch":"cirurgia-A1","av":"A1","q":"Quando começar o rastreamento com parente de 1º grau com câncer colorretal?","a":"Colonoscopia aos 40 anos, ou 10 anos antes da idade do diagnóstico do parente, o que vier primeiro.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-08","ch":"cirurgia-A1","av":"A1","q":"Como se estadia o T do câncer colorretal?","a":"T1 submucosa, T2 muscular própria, T3 até a gordura pericólica, T4a peritônio visceral, T4b órgãos adjacentes.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-09","ch":"cirurgia-A1","av":"A1","q":"O que muda quando há linfonodo comprometido?","a":"Vira estádio III, piora o prognóstico e indica quimioterapia adjuvante.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-10","ch":"cirurgia-A1","av":"A1","q":"Qual é o papel do CEA?","a":"Prognóstico e seguimento após o tratamento, não diagnóstico.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-11","ch":"cirurgia-A1","av":"A1","q":"Como se diferencia sangue de hemorroida, melena e coágulo?","a":"Hemorroida: vermelho vivo (arterial), no vaso ou no papel. Melena: sangue digerido (ou sulfato ferroso). Coágulo: sangramento ativo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-12","ch":"cirurgia-A1","av":"A1","q":"Que sintoma da anamnese a aula marca como sinal de alarme?","a":"Muco nas fezes (e acordar à noite para evacuar).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-14","ch":"cirurgia-A1","av":"A1","q":"Por que nunca liberar da emergência uma dor anal sem examinar?","a":"Pode ser abscesso anal, e deixá-lo passar tem consequências catastróficas.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-15","ch":"cirurgia-A1","av":"A1","q":"O que o toque retal avalia?","a":"Dor, tônus e contratilidade esfincteriana, próstata ou útero, massas e o fundo de saco de Douglas.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-16","ch":"cirurgia-A1","av":"A1","q":"O que se espera encontrar no reto ao toque?","a":"Ânus fechado em repouso e reto sem fezes; fezes endurecidas indicam constipação.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-17","ch":"cirurgia-A1","av":"A1","q":"Por que a hemorroida interna não dói?","a":"Fica acima da linha pectínea, com epitélio cilíndrico e inervação visceral.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-18","ch":"cirurgia-A1","av":"A1","q":"O que marca a reflexão peritoneal na retossigmoidoscopia?","a":"A 2ª válvula de Houston; abaixo dela o reto é extraperitoneal.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-19","ch":"cirurgia-A1","av":"A1","q":"Qual artéria nunca se liga na cirurgia do cólon e por quê?","a":"A mesentérica superior, porque irriga também o intestino delgado.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-20","ch":"cirurgia-A1","av":"A1","q":"Qual região do cólon é mais vulnerável à colite isquêmica?","a":"O ângulo esplênico, a área menos irrigada.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-21","ch":"cirurgia-A1","av":"A1","q":"Para onde metastatiza o câncer de reto inferior e o de cólon?","a":"Reto inferior: pulmão (circulação sistêmica). Cólon e reto superior: fígado (sistema porta).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-22","ch":"cirurgia-A1","av":"A1","q":"Qual exame de imagem estadia o câncer de reto na pelve?","a":"A ressonância magnética da pelve (avalia a fáscia mesorretal).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-23","ch":"cirurgia-A1","av":"A1","q":"Quais são os critérios de qualidade da colonoscopia?","a":"Tempo de retirada maior que 6 minutos, intubação cecal, taxa de detecção de adenoma e qualidade do preparo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-24","ch":"cirurgia-A1","av":"A1","q":"Qual é a modalidade preferencial de rastreamento do câncer colorretal e com que intervalo?","a":"Colonoscopia a cada 10 anos no risco moderado, a partir de 45 a 50 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-25","ch":"cirurgia-A1","av":"A1","q":"Em quem não se deve pedir sangue oculto nas fezes?","a":"Sangramento visível, anemia ou suspeita de câncer, menores de 40 anos, já rastreados por colonoscopia ou com teste anterior positivo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-26","ch":"cirurgia-A1","av":"A1","q":"Como é o rastreamento na polipose adenomatosa familiar?","a":"Aconselhamento e teste genético e colonoscopia anual a partir dos 10 a 12 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-27","ch":"cirurgia-A1","av":"A1","q":"Quando começar a vigilância na doença inflamatória intestinal?","a":"8 a 10 anos depois do início da doença.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-28","ch":"cirurgia-A1","av":"A1","q":"Homem de 65 anos com hemorroida, sangue misturado às fezes, constipação piorando e perda de peso. O que pedir e por quê?","a":"Colonoscopia (ou retossigmoidoscopia flexível) para pesquisar câncer colorretal: sangue misturado, mudança do hábito e emagrecimento não se explicam pela hemorroida.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-29","ch":"cirurgia-A1","av":"A1","q":"Paciente operado de polipose adenomatosa familiar: como seguir os filhos?","a":"Aconselhamento e teste genético, e colonoscopia anual a partir dos 10 a 12 anos.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-vascular-01","ch":"cirurgia-A1","av":"A1","q":"Quais são as três túnicas da parede vascular?","a":"Íntima, média e adventícia.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-02","ch":"cirurgia-A1","av":"A1","q":"Quais artérias são elásticas e quais são musculares?","a":"Elásticas: aorta e ramos principais, carótida comum, subclávia, ilíacas comuns, pulmonares. Musculares: coronária, carótida, axilar, uterina, palmar.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-03","ch":"cirurgia-A1","av":"A1","q":"Quem dá a principal resistência periférica ao fluxo?","a":"As arteríolas e os esfíncteres pré-capilares (vasos de resistência).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-04","ch":"cirurgia-A1","av":"A1","q":"O que fazem os barorreceptores e os quimiorreceptores com a pressão arterial?","a":"Barorreceptores (seio carotídeo, arco aórtico) baixam a PA. Quimiorreceptores (glomo carotídeo, corpo aórtico) sobem a PA quando falta O2 ou sobra CO2.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-05","ch":"cirurgia-A1","av":"A1","q":"O que é vis a fronte e vis a tergo?","a":"Vis a fronte é a força que puxa pela frente (aspiração torácica, cardíaca, bomba abdominal). Vis a tergo é a que empurra por trás (pressão).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-07","ch":"cirurgia-A1","av":"A1","q":"Onde começa a maioria das TVP e quais as duas complicações?","a":"92% na perna. Embolia pulmonar e síndrome pós-trombótica.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-08","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais mais frequentes da TVP na tabela da aula?","a":"Dor, edema e aumento da consistência muscular (86,7% cada).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-09","ch":"cirurgia-A1","av":"A1","q":"Quais são as contraindicações à anticoagulação citadas na aula?","a":"Moléstias hemorrágicas e neurocirurgia ou AVC recentes (até 4 a 6 semanas).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-10","ch":"cirurgia-A1","av":"A1","q":"Quais são as complicações da heparina?","a":"Hemorragia, reação alérgica, trombocitopenia (precoce ou tardia), osteoporose, alopecia e febre.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-11","ch":"cirurgia-A1","av":"A1","q":"Qual complicação da varfarina aparece em membros e mamas?","a":"Necrose de pele e subcutâneo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-12","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais da insuficiência venosa crônica?","a":"Edema, lipodermatosclerose, dermite ocre, eczema, erisipela e úlcera.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-13","ch":"cirurgia-A1","av":"A1","q":"Qual é o cuidado com a compressão na IVC?","a":"Não comprimir sem checar o lado arterial: cuidado nas isquemias arteriais.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-14","ch":"cirurgia-A1","av":"A1","q":"Quais são as opções cirúrgicas da IVC no slide?","a":"Operação de Linton, safenectomia e plástica com enxertos livres de pele.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-15","ch":"cirurgia-A1","av":"A1","q":"O que é a esclerose de Mönckeberg?","a":"Esclerose calcificante da média, a artéria em \"traqueia de passarinho\".","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-16","ch":"cirurgia-A1","av":"A1","q":"Qual é o fator de risco mais importante para a doença arterial periférica?","a":"O tabagismo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o segmento preferido da doença arterial no diabético?","a":"O infrapoplíteo.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-18","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome de Leriche?","a":"Claudicação de nádegas e coxas com impotência sexual, por oclusão aortoilíaca.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-19","ch":"cirurgia-A1","av":"A1","q":"O que indica um tempo de enchimento venoso maior que 10 segundos?","a":"Insuficiência arterial importante.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-20","ch":"cirurgia-A1","av":"A1","q":"Quais são os tratamentos cirúrgicos da oclusão arterial crônica?","a":"Endarterectomia, enxertos anatômicos e extra-anatômicos, angioplastia com stent e amputação.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-21","ch":"cirurgia-A1","av":"A1","q":"Como se usa o escore de Wells na suspeita de TVP?","a":"2 pontos ou mais: TVP provável, vai direto ao duplex. Menos de 2: improvável, pede-se D-dímero; se normal, afasta TVP; se alterado, duplex.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-22","ch":"cirurgia-A1","av":"A1","q":"Qual valor de ITB confirma doença arterial periférica?","a":"0,90 ou menos. Acima de 1,40 sugere artéria incompressível (calcificada).","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-vascular-23","ch":"cirurgia-A1","av":"A1","q":"O que é CEAP C6 e o que é C4?","a":"C6 é úlcera venosa ativa (C5, cicatrizada). C4 são as alterações de pele: pigmentação, eczema, lipodermatosclerose.","sec":"cirurgia/resumos/6","w":"Vascular · Veias, TVP, IVC e oclusão arterial"},{"id":"ci-prova-antiga-01","ch":"cirurgia-A1","av":"A1","q":"Defina câncer gástrico precoce e explique a relação com linfonodos.","a":"Tumor restrito à mucosa ou à submucosa (T1), com ou sem linfonodo comprometido. O risco de linfonodo é cerca de 0,5% na mucosa e de 11 a 23% na submucosa, conforme a profundidade.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-02","ch":"cirurgia-A1","av":"A1","q":"Quais são os critérios de Burke da profilaxia antibiótica?","a":"Antibiótico sítio-específico, dose única, EV, bactericida, poucos efeitos colaterais; iniciar até 1 hora antes da incisão; repetir se a cirurgia for longa; não passar de 24 h.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-03","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no hemangioma hepático gigante assintomático?","a":"Observar. Confirmar com TC ou RM, sem biópsia; tratar só se sintomático.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-04","ch":"cirurgia-A1","av":"A1","q":"Como se faz o diagnóstico de CHC em cirrótico?","a":"Nódulo de 1 cm ou mais com hiper-realce arterial e washout na TC ou RM, sem biópsia.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-05","ch":"cirurgia-A1","av":"A1","q":"Quais são a tríade de Charcot e a pêntade de Reynolds?","a":"Charcot: dor no hipocôndrio direito, febre com calafrios e icterícia. Reynolds: mais hipotensão e confusão mental.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-07","ch":"cirurgia-A1","av":"A1","q":"Cite indicações de nefrolitotripsia percutânea.","a":"Cálculo maior que 2 cm, cálculo de cálice inferior, coraliforme, em divertículo calicinal, rim em ferradura, falha da litotripsia extracorpórea.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-08","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no nódulo testicular sólido?","a":"Marcadores tumorais e orquiectomia por via inguinal, mesmo com marcadores normais.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-09","ch":"cirurgia-A1","av":"A1","q":"Quais são os parâmetros de via aérea difícil?","a":"Incisivos superiores, relação dos incisivos no fechamento e na protrusão, distância interincisivos, visibilidade da úvula, palato, espaço mandibular, comprimento e largura do pescoço e mobilidade cervical.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-10","ch":"cirurgia-A1","av":"A1","q":"Qual é a droga vasoativa do choque séptico e por quê?","a":"Noradrenalina: efeito alfa, vasoconstrição, aumenta a resistência vascular sistêmica num paciente vasodilatado.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-11","ch":"cirurgia-A1","av":"A1","q":"Quais são os efeitos adversos dos anestésicos locais?","a":"Formigamento perioral, zumbido, alteração visual, abalos, convulsão, coma, parada respiratória e depressão cardiovascular.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-12","ch":"cirurgia-A1","av":"A1","q":"O que é o sinal de Drehmann e em que doença aparece?","a":"Rotação externa do quadril ao fletir; epifisiólise proximal do fêmur.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-13","ch":"cirurgia-A1","av":"A1","q":"Quais são 3 indicações de colecistectomia em assintomático, segundo a resposta da prova antiga?","a":"Vesícula em porcelana, anemia falciforme e mulher jovem que quer engravidar. A indicação absoluta é a vesícula em porcelana.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-14","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco e os critérios de risco de progressão do câncer de próstata?","a":"Risco: idade, raça negra e história familiar. Progressão: PSA, Gleason/ISUP e estádio clínico (T).","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-15","ch":"cirurgia-A1","av":"A1","q":"Câncer de próstata metastático: o que usar na doença sensível e na resistente à castração?","a":"Sensível: bloqueio androgênico (análogo do LHRH ou orquiectomia bilateral), com docetaxel ou abiraterona/enzalutamida. Resistente: docetaxel, abiraterona ou enzalutamida.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-16","ch":"cirurgia-A1","av":"A1","q":"Quando o reflexo bulbocavernoso tem valor no trauma raquimedular?","a":"Só depois que o choque medular termina; aí se classifica a lesão e se fala em prognóstico.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o papel do ortopedista no politraumatizado grave já operado de tórax e abdome?","a":"Controle de danos: estabilização provisória, não a fixação definitiva.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-18","ch":"cirurgia-A1","av":"A1","q":"SvcO2 de 75% numa cirurgia de grande porte: o que significa? E se fosse 60%?","a":"75%: oxigenação tecidual adequada (normal acima de 70%). 60%: a oferta de O2 não cobre o consumo e o tecido extrai mais (anemia, hipovolemia, baixo débito ou hipoxemia).","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-prova-antiga-19","ch":"cirurgia-A1","av":"A1","q":"Que tipo de choque tem resistência vascular sistêmica baixa, e qual é a conduta inicial no séptico?","a":"O distributivo (séptico, anafilático, neurogênico). No séptico: lactato, hemoculturas, antibiótico de largo espectro na 1ª hora, cristaloide e noradrenalina para PAM de 65 mmHg ou mais.","sec":"cirurgia/resumos/7","w":"Prova antiga · Tudo o que já caiu"},{"id":"ci-an-vias-01","ch":"cirurgia-A1","av":"A1","q":"Cite três situações de emergência com indicação de intubação orotraqueal.","a":"Glasgow ≤ 8, apneia e necessidade de proteger a via aérea (queimadura de via aérea, edema, sangue ou vômito).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-02","ch":"cirurgia-A1","av":"A1","q":"Quais são as quatro indicações de intubação traqueal do slide?","a":"Prejuízo real ou potencial da permeabilidade da via aérea, deficiência da proteção da laringe, atenuar o risco de aspiração e facilitar a ventilação com pressão positiva.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-03","ch":"cirurgia-A1","av":"A1","q":"Quais os preparativos antes de uma IOT?","a":"Checar o material, avaliar a via aérea, checar a medicação da IOT e de emergência, posicionar e pré-oxigenar, e planejar as alternativas.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-04","ch":"cirurgia-A1","av":"A1","q":"Cite cinco parâmetros da avaliação da via aérea.","a":"Abertura da boca (interincisivos), Mallampati, distância tireomentoniana, mobilidade do pescoço e protrusão da mandíbula (ou o LEMON: Look, 3-3-2, Mallampati, Obstrução, Neck).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-05","ch":"cirurgia-A1","av":"A1","q":"O que significa o 3-3-2 do LEMON?","a":"3 dedos de abertura da boca, 3 dedos do mento ao hioide e 2 dedos do hioide à cartilagem tireoide.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-06","ch":"cirurgia-A1","av":"A1","q":"Qual a distância interincisivos considerada desfavorável pela ASA?","a":"Menor que 3 cm.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-07","ch":"cirurgia-A1","av":"A1","q":"O que se vê na classe IV de Mallampati?","a":"Só o palato duro.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-08","ch":"cirurgia-A1","av":"A1","q":"O que se vê na classe II de Cormack-Lehane?","a":"Só a parte posterior da glote, as aritenoides.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-09","ch":"cirurgia-A1","av":"A1","q":"Onde se faz a manobra de Sellick e para quê?","a":"Na cartilagem cricoide, comprimindo o esôfago contra a coluna para evitar regurgitação.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-10","ch":"cirurgia-A1","av":"A1","q":"Para que serve a manobra de BURP?","a":"Para melhorar a visão da glote, deslocando a tireoide para trás, para cima e para a direita.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-11","ch":"cirurgia-A1","av":"A1","q":"Cite os fatores de ventilação difícil sob máscara.","a":"Barba, IMC acima de 26, falta de dentes, idade acima de 55 anos e ronco (2 ou mais).","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-13","ch":"cirurgia-A1","av":"A1","q":"Como fica a capnografia na intubação esofágica?","a":"Algumas ondas cada vez menores até zerar, sem CO2 sustentado.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-14","ch":"cirurgia-A1","av":"A1","q":"Qual o desenho da capnografia no broncoespasmo e no bloqueio insuficiente?","a":"Broncoespasmo: barbatana de tubarão (subida inclinada, sem platô). Bloqueio insuficiente: fenda de curare no platô.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-vias-16","ch":"cirurgia-A1","av":"A1","q":"Qual o material básico da cricotireoidostomia cirúrgica?","a":"Bisturi, pinça Kelly e cânula de traqueostomia infantil ou tubo de pequeno calibre.","sec":"cirurgia/resumos/8","w":"Anestesiologia · Vias aéreas e intubação"},{"id":"ci-an-venosos-01","ch":"cirurgia-A1","av":"A1","q":"Paciente estável no pós-operatório imediato de laparotomia, com dor 9/10. Qual analgésico?","a":"Morfina IV, titulada, com monitorização; somada a analgesia multimodal (dor intensa pede opioide forte).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-02","ch":"cirurgia-A1","av":"A1","q":"Opioide causa náusea e vômito? Por quê?","a":"Sim: estimula a zona quimiorreceptora do gatilho (área postrema), sensibiliza o vestíbulo e retarda o esvaziamento gástrico.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-03","ch":"cirurgia-A1","av":"A1","q":"Qual hipnótico se escolhe para induzir o paciente instável de trauma e por quê?","a":"Cetamina: é simpaticomimética e mantém pressão arterial e frequência cardíaca.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-04","ch":"cirurgia-A1","av":"A1","q":"Qual bloqueador neuromuscular desencadeia hipertermia maligna, e qual o tratamento da crise?","a":"Succinilcolina (com os voláteis halogenados). Suspender gatilhos, O₂ 100% e dantrolene 2,5 mg/kg IV, repetido.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-05","ch":"cirurgia-A1","av":"A1","q":"A membrana da junção neuromuscular é eletroexcitável ou quimioexcitável?","a":"Quimioexcitável: a placa motora responde à acetilcolina no receptor nicotínico.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-06","ch":"cirurgia-A1","av":"A1","q":"Quais são as quatro ausências que definem a anestesia geral?","a":"Ausência de consciência (e memória), de dor, de resposta motora e de resposta do sistema nervoso autônomo.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-07","ch":"cirurgia-A1","av":"A1","q":"Como o opioide age na sinapse do corno dorsal?","a":"Pré-sináptico: fecha Ca²⁺ e bloqueia a liberação de glutamato e substância P. Pós-sináptico: abre K⁺ e hiperpolariza.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-08","ch":"cirurgia-A1","av":"A1","q":"Coloque em ordem crescente: MAC, MAC-BAR e MAC-awake. O que cada uma abole?","a":"MAC-awake (consciência) < MAC (movimento) < MAC-BAR (resposta autonômica).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-09","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença entre potência e eficácia?","a":"Potência é a dose necessária para o efeito (deslocamento da curva); eficácia é o efeito máximo (altura do platô).","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-10","ch":"cirurgia-A1","av":"A1","q":"Dê exemplo de agonista total, agonista parcial e antagonista opioide.","a":"Total: morfina ou metadona. Parcial: buprenorfina. Antagonista: naloxona.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-12","ch":"cirurgia-A1","av":"A1","q":"O que é sinergismo? Dê o exemplo da aula.","a":"Efeito da combinação maior que a soma dos efeitos isolados; midazolam + fentanil.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-13","ch":"cirurgia-A1","av":"A1","q":"Quais hipnóticos se ligam ao receptor GABA-A, e que íon ele conduz?","a":"Propofol, etomidato, barbitúricos (um sítio) e benzodiazepínicos (outro); é canal de cloreto.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-14","ch":"cirurgia-A1","av":"A1","q":"Quais são as fases da anestesia geral?","a":"Indução (hipnose, analgesia, BNM?), manutenção e recuperação, com suporte de vida e monitorização em todas.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-venosos-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a potência do fentanil em relação à morfina, segundo a aula?","a":"80 a 100 vezes maior.","sec":"cirurgia/resumos/9","w":"Anestesiologia · Anestesia geral e anestésicos venosos"},{"id":"ci-an-locais-01","ch":"cirurgia-A1","av":"A1","q":"Cite quatro cuidados para evitar intoxicação sistêmica por anestésico local.","a":"Respeitar a dose máxima pelo peso, aspirar antes de injetar (não injetar no vaso), injetar devagar e fracionado com monitorização, usar vasoconstritor quando permitido; também perguntar alergia e evitar interações.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-02","ch":"cirurgia-A1","av":"A1","q":"Quais são os efeitos adversos da intoxicação por anestésico local, na ordem?","a":"Formigamento de língua e lábios, zumbido, distúrbio visual, abalos musculares, convulsão, inconsciência e coma, parada respiratória e depressão cardiovascular.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento específico da intoxicação sistêmica grave e a dose do slide?","a":"Emulsão lipídica 20%: bolus de 1,5 mL/kg, repetível a cada 5 min se colapso, e infusão de 0,25 mL/kg/min.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-04","ch":"cirurgia-A1","av":"A1","q":"Quais são as doses máximas de lidocaína e bupivacaína, sem e com vasoconstritor?","a":"Lidocaína 5 mg/kg sem e 7 mg/kg com; bupivacaína 2,5 mg/kg sem e 3 mg/kg com.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-05","ch":"cirurgia-A1","av":"A1","q":"Quantos mg há em 1 mL de lidocaína 2% e de bupivacaína 0,5%?","a":"20 mg/mL e 5 mg/mL (porcentagem × 10).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-06","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença de metabolismo entre ésteres e amidas?","a":"Ésteres: plasma, pela pseudocolinesterase (geram PABA, alergênico). Amidas: fígado, pelo citocromo P450.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-07","ch":"cirurgia-A1","av":"A1","q":"Como o anestésico local bloqueia o nervo?","a":"Bloqueia o canal de sódio pelo lado de dentro: atravessa a membrana na forma não ionizada e bloqueia na forma ionizada.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-08","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência do bloqueio das fibras?","a":"Simpático (B), dor e temperatura (C), tato e pressão (A), motor (A), propriocepção profunda (A).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-09","ch":"cirurgia-A1","av":"A1","q":"Que propriedade determina potência, latência e duração?","a":"Lipossolubilidade → potência; pKa → latência; ligação proteica → duração.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-10","ch":"cirurgia-A1","av":"A1","q":"Coloque em ordem de absorção: peridural, intercostal, subcutâneo, plexo braquial.","a":"Intercostal > peridural > plexo braquial > subcutâneo.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-11","ch":"cirurgia-A1","av":"A1","q":"Quais são as contraindicações do vasoconstritor?","a":"HAS grave, doença vascular cerebral isquêmica, coronariopatia, hipertireoidismo descompensado, pré-eclâmpsia grave; proibido em circulação terminal (dedo, pênis, ponta do nariz, orelha).","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-12","ch":"cirurgia-A1","av":"A1","q":"Qual a concentração ideal de adrenalina e o que ela faz?","a":"1:200.000 (5 µg/mL): reduz a absorção, prolonga a ação e limita a toxicidade.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-13","ch":"cirurgia-A1","av":"A1","q":"Como tratar a convulsão na intoxicação por anestésico local?","a":"Benzodiazepínico (ex.: midazolam), O2 a 100% e ventilação; evitar propofol se houver instabilidade cardiovascular.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-14","ch":"cirurgia-A1","av":"A1","q":"Por que o anestésico local falha em tecido infectado?","a":"O meio ácido mantém a droga na forma ionizada, que não atravessa a membrana do nervo.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-locais-15","ch":"cirurgia-A1","av":"A1","q":"Qual anestésico local é o mais cardiotóxico e por quê?","a":"A bupivacaína: muito lipossolúvel e muito ligada a proteína; a cardiotoxicidade pode vir junto ou antes dos sinais neurológicos, e a parada é difícil de reverter.","sec":"cirurgia/resumos/10","w":"Anestesiologia · Anestésicos locais"},{"id":"ci-an-neuro-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a diferença de espaço entre a raquianestesia e a peridural?","a":"Raqui: espaço subaracnóideo (entre pia e aracnoide, no líquor). Peridural: entre a dura-máter e o ligamento amarelo.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-02","ch":"cirurgia-A1","av":"A1","q":"Até onde vai a medula e abaixo de qual nível se faz a raqui?","a":"A medula vai até L2; a raqui é feita abaixo de L
