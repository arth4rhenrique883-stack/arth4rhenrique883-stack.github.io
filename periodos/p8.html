<!doctype html>
<html lang="pt-BR" data-per="p8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>medaj. · 8º período</title>
<meta name="theme-color" content="#05040a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="chama2-192.png">
<link rel="apple-touch-icon" href="chama2-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Archivo:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de uma tela, bem simples: o nome no centro do preto, o baralho, o resumo e o cartão. */
/* medaj. (28/10): preto predominante, branco, vermelho sutil e mínimos detalhes de azul; só a chama do nome muda de cor. */
/* O Dr. Casa (avatar, falas e casos) continua no código, fora da tela: .casa[hidden]. Para trazê-lo de volta, tirar o hidden do <aside class="casa">. */
:root{
  --bg:#050505; --surface:#0b0b0b; --surface-2:#111111; --line:#1f1f1f; --line-2:#333333;
  --fg:#ebebeb; --muted:#9c9c9c; --dim:#6b6b6b;
  --red:#b02a30; --red-ink:#d0585e; --blue:#7f97bd;
  --bad:#c2414a; --hard:#bdbdbd; --good:#7f97bd; --easy:#5aa883;
  --brand:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;color:inherit}
a{color:var(--fg);text-decoration-color:#5a5a5a;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* barra */
.bar{display:flex;justify-content:center;padding:clamp(28px,8vh,72px) 0 clamp(8px,3vh,24px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.word{font:700 clamp(64px,16vw,104px)/.9 var(--brand);letter-spacing:.01em;display:inline-flex;align-items:flex-end;color:#f5f5f5}
.flame{width:.36em;height:.5em;margin-left:.03em;margin-bottom:.04em;overflow:visible;flex:none}
.app-name{font:500 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.24em;text-transform:uppercase}

/* chama: desenho animado, quente e macabra; a única coisa que muda de cor */
.flame .tongue{transform-box:fill-box;transform-origin:50% 100%}
.flame .all{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .flame .hue{animation:hue 16s linear infinite}
  .flame .eyes{animation:blink 5s steps(1) infinite}
}
@keyframes hue{0%{filter:hue-rotate(0deg) saturate(1.1)}22%{filter:hue-rotate(-28deg) saturate(1.3)}45%{filter:hue-rotate(-95deg) saturate(1.2)}68%{filter:hue-rotate(75deg) saturate(1.25)}84%{filter:hue-rotate(20deg) saturate(1.2)}100%{filter:hue-rotate(0deg) saturate(1.1)}}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.97,1.05) skewX(-2deg)}100%{transform:scale(1.03,.96) skewX(2deg)}}
@keyframes lick{from{transform:rotate(-6deg) scaleY(.94)}to{transform:rotate(5deg) scaleY(1.08)}}
@keyframes blink{0%,92%{opacity:1}93%,96%{opacity:0}97%{opacity:1}}
@keyframes pulse{from{opacity:.45}to{opacity:.85}}

/* painel */
.deckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--display);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:#4a4a4a;background:#141414}
.chip .n{font:700 11px var(--mono);padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip[aria-pressed="true"] .n{color:var(--red-ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font:400 13px/1.3 var(--body);color:var(--muted)}
.stat.hot b{color:var(--red-ink)}

.main{display:block}
.casa[hidden]{display:none!important}

/* cartão */
.card{display:flex;flex-direction:column;gap:16px;min-height:340px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.tag{padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg)}
.tag.new{border-color:#6a2226;color:var(--red-ink)}
.meta .pos{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.q{font:600 clamp(21px,3.4vw,26px)/1.35 var(--body);letter-spacing:0;margin:6px 0 0;text-wrap:balance}
.ans{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ans p{margin:0;font:400 18px/1.65 var(--body)}
.ans .lbl{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ans .read{font:500 13px var(--display);color:var(--blue);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.ans .read:hover{text-decoration:underline}
.spacer{flex:1}
.reveal{align-self:stretch;font:500 15px var(--display);letter-spacing:.02em;padding:14px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:#fff;cursor:pointer}
.reveal:hover{border-color:var(--red)}
kbd{font:500 11px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.7;margin-left:8px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;min-width:0}
.grade b{font:500 14px var(--display)}
.grade small{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.grade.g0{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}.grade.g0 b{color:var(--bad)}
.grade.g3{border-color:color-mix(in srgb,var(--hard) 50%,transparent)}.grade.g3 b{color:var(--hard)}
.grade.g4{border-color:color-mix(in srgb,var(--good) 55%,transparent)}.grade.g4 b{color:var(--good)}
.grade.g5{border-color:color-mix(in srgb,var(--easy) 55%,transparent)}.grade.g5 b{color:var(--easy)}
.grade:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--line-2))}
.done{display:flex;flex-direction:column;gap:14px}
.done h2{font:600 clamp(24px,4vw,32px)/1.15 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.done .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.done .sum div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.done .sum b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.done .sum span{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{font:500 14px var(--display);padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.ghost:hover{border-color:#5a5a5a}

/* Dr. Casa */
.casa{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.casa-top{display:flex;gap:12px;align-items:center}
.avatar{width:96px;height:112px;flex:none}
.who b{display:block;font:600 20px/1 var(--display);letter-spacing:-.02em}
.who span{display:block;font:500 12px/1.35 var(--body);color:var(--muted);margin-top:4px}
.bubble{position:relative;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;font:500 15px/1.55 var(--body);min-height:84px}
.bubble::before{content:"";position:absolute;top:-7px;left:38px;width:12px;height:12px;background:var(--surface-2);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
.bubble.story{border-color:#6a2226}
.bubble .case{display:block;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red-ink);margin-bottom:4px}
.casa .row .ghost{flex:1;font-size:13px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){
  .avatar .cane{transform-box:view-box;transform-origin:165px 236px}
  .avatar.tap .cane{animation:tap .5s ease-in-out 2}
  .avatar .lids{animation:blink 6s steps(1) infinite}
  .avatar .brow-r{transform-box:fill-box;transform-origin:0 100%;transition:transform .25s}
  .avatar.raise .brow-r{transform:translateY(-4px) rotate(-8deg)}
  .avatar.smug .mouth{transform:translateY(-1px)}
}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}

footer{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
footer .linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.confirm{display:inline-flex;gap:8px;align-items:center}
.confirm button{font:500 12px var(--display);padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.confirm .danger{border-color:var(--bad);color:var(--bad)}

@media (max-width:820px){
  .casa{position:static;order:-1;gap:10px}
  .avatar{width:64px;height:75px}
  .who b{font-size:17px}
  .bubble{min-height:0;font-size:14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .card{min-height:0}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
  .done .sum{grid-template-columns:minmax(0,1fr)}
}
/* tablet e toque: alvos maiores, sem dica de teclado */
@media (min-width:700px){
  .wrap{max-width:780px}
  .q{font-size:clamp(24px,3.2vw,30px)}
  .ans p{font-size:20px}
}
@media (min-width:600px) and (max-width:820px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (pointer:coarse){
  kbd{display:none}
  .chip{padding:10px 14px;font-size:14px}
  .reveal{padding:18px;font-size:17px}
  .grade{padding:14px 6px}
  .grade b{font-size:16px}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
}

/* app único: abas */
.tabs{display:flex;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center;margin-top:-6px}
.tabs a{font:500 14px var(--display);color:var(--muted);text-decoration:none;padding:8px 16px;border-radius:999px;letter-spacing:.02em}
.tabs a[aria-current="page"]{color:#fff;background:#151515;box-shadow:inset 0 -2px 0 var(--red)}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:18px}
.vh{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.today .when{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.today h2{font:600 clamp(22px,3.6vw,28px)/1.3 var(--body);margin:6px 0 0;text-wrap:pretty}
.today .area{font:500 14px var(--display);color:var(--fg)}
.today .eixo{font:400 15px/1.6 var(--body);color:var(--muted);margin:0}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums span{font:500 12px var(--mono);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px}
.go{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);text-decoration:none;color:var(--fg)}
.go b{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink)}
.go span{font:500 16px/1.45 var(--display)}
a.go:hover{border-color:var(--red)}
.go.off{opacity:.7}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.week{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.week div{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font:400 14px/1.45 var(--body)}
.week div b{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.week div.on b{color:var(--red-ink)}
.start{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:400 13px var(--body);color:var(--muted)}
.start input{font:500 13px var(--mono);color:var(--fg);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;color-scheme:dark}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line-2);border-radius:12px;text-decoration:none;color:var(--fg);background:var(--surface-2)}
.bitem b{font:600 17px var(--display)}
.bitem span{font:400 14px/1.45 var(--body);color:var(--muted)}
.bitem:hover{border-color:var(--red)}
.bwrap{display:flex;flex-direction:column;gap:0}
.bwrap .bitem{border-bottom-left-radius:0;border-bottom-right-radius:0}
.lida{font:500 13px var(--display);color:var(--muted);background:transparent;border:1px solid var(--line-2);border-top:0;border-radius:0 0 12px 12px;padding:10px 18px;text-align:left;cursor:pointer}
.lida[aria-pressed="true"]{color:#5aa883;border-color:#2e5a45}
.lida[aria-pressed="true"]::before{content:"✓ "}
.soon{font:400 14px/1.5 var(--body);color:var(--dim);margin:0}
.area{border-top:1px solid var(--line);padding-top:6px}
.area summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;padding:10px 0;font:600 17px var(--display);list-style:none}
.area summary::-webkit-details-marker{display:none}
.area summary::before{content:"+";font:500 15px var(--mono);color:var(--muted);margin-right:-4px;width:14px}
.area[open] summary::before{content:"−"}
.area summary span{margin-left:auto;font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.area .blist{padding-bottom:12px}
.bitem.off{background:transparent;border-style:dashed}
.bitem.off b{font-weight:500;color:var(--muted)}
@media (pointer:coarse){.tabs a{padding:11px 18px;font-size:15px}}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}.week div{grid-template-columns:56px minmax(0,1fr)}}
/*per:css*/
.pers{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:-10px}
.pers a{display:inline-flex;align-items:center;gap:7px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 10px;white-space:nowrap;border-radius:999px;border:1px solid var(--line)}
.pers a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pers a[data-per="res"]{--c:#b02a30}.pers a[data-per="p6"]{--c:#8c2340}.pers a[data-per="p7"]{--c:#1f6f7d}.pers a[data-per="p8"]{--c:#6b3fa0;}
.pers a[aria-current]{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
@media (pointer:coarse){.pers a{padding:10px 10px}}
@media (max-width:360px){.pers a{letter-spacing:.02em;padding:9px 8px}}
/* a chama mescla de cor a cada 5 segundos (pedido de 28/10): seis cores em 30 s, sempre em transição */
@media (prefers-reduced-motion:no-preference){.flame .hue{animation:hue5 30s linear infinite}}
@keyframes hue5{0%{filter:hue-rotate(0deg) saturate(1.15)}16.66%{filter:hue-rotate(-40deg) saturate(1.35)}33.33%{filter:hue-rotate(-110deg) saturate(1.25)}50%{filter:hue-rotate(160deg) saturate(1.2)}66.66%{filter:hue-rotate(80deg) saturate(1.3)}83.33%{filter:hue-rotate(28deg) saturate(1.2)}100%{filter:hue-rotate(0deg) saturate(1.15)}}
/*/per:css*/

/* período: cor oficial no lugar do vermelho, sobre preto e branco */
:root{--bg:#05040a;--surface:#0b0912;--surface-2:#120e1b;--line:#1f1a2b;--line-2:#342a48;--red:#6b3fa0;--red-ink:#f0b9d6;--red-deep:#3b2457}
.tag.new{border-color:var(--red-deep)}.bubble.story{border-color:var(--red-deep)}
.tabs a[aria-current="page"]{background:color-mix(in srgb,var(--red) 18%,#0d0d0d)}
.chip[aria-pressed="true"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,#0d0d0d)}
.disc{display:block;font:600 13px var(--display);color:var(--red-ink);margin:8px 0 6px;letter-spacing:.02em}
.mat{border:1px solid var(--line-2);border-radius:12px;padding:0 16px;background:var(--surface)}
.mat[open]{padding-bottom:12px}
.mat summary{display:flex;align-items:center;gap:12px;padding:15px 0;cursor:pointer;list-style:none}
.mat summary::-webkit-details-marker{display:none}
.mat summary b{font:600 17px var(--display);flex:1}
.mat summary span{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.mat summary::after{content:"›";font:400 22px/1 var(--display);color:var(--muted);transition:transform .2s}
.mat[open] summary::after{transform:rotate(90deg)}
#v-apostilas{gap:10px}
.mat .soon{margin:0 0 6px}
.avbar{justify-content:center}
.bfoot{display:flex}.bfoot .lida{flex:1}.bfoot .refs{flex:none;border-left:1px solid var(--line-2);border-bottom-left-radius:0;text-decoration:none;color:var(--blue)}
.bfoot .lida:first-child:not(:last-child){border-bottom-right-radius:0}
.week div{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.week div b{font:500 14px var(--display);color:var(--fg);padding:0}
.week .start{flex-wrap:nowrap}.week label{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
@media (max-width:520px){.week div{grid-template-columns:minmax(0,1fr)}.week .start{flex-wrap:wrap}}
/* chama: só as cores desta página, mudando a cada 5 s */
.flame .hue{animation:none!important}
#fl-out stop:nth-child(1){stop-color:#3b2457}#fl-out stop:nth-child(2){stop-color:#6b3fa0}#fl-out stop:nth-child(3){stop-color:#8d5cc4}
#fl-in stop:nth-child(1){stop-color:#f0b9d6}#fl-in stop:nth-child(2){stop-color:#ffd9ea}
#fl-core stop{stop-color:#fff2f8}#fl-glow stop{stop-color:#6b3fa0}
@keyframes cf0{0.00%{stop-color:#3b2457}16.67%{stop-color:#6b3fa0}33.33%{stop-color:#8d5cc4}50.00%{stop-color:#4f2e78}66.67%{stop-color:#a070d4}83.33%{stop-color:#5d3590}100%{stop-color:#3b2457}}
@keyframes cf1{0.00%{stop-color:#8d5cc4}16.67%{stop-color:#4f2e78}33.33%{stop-color:#a070d4}50.00%{stop-color:#5d3590}66.67%{stop-color:#3b2457}83.33%{stop-color:#6b3fa0}100%{stop-color:#8d5cc4}}
@keyframes cf2{0.00%{stop-color:#a070d4}16.67%{stop-color:#5d3590}33.33%{stop-color:#3b2457}50.00%{stop-color:#6b3fa0}66.67%{stop-color:#8d5cc4}83.33%{stop-color:#4f2e78}100%{stop-color:#a070d4}}

a Gonik · otoscopia, diapasão, audiometria, imitância, EOA, PEATE, vertigem, nistagmo, HINTS, Romberg, Fukuda, neurite e VPPB · 47 slides","u":"otorrino/resumos/1","mat":"Oftalmologia e otorrinolaringologia","sub":"Otorrinolaringologia"},{"id":"or-otites","ch":"otorrino-A1","av":"A1","pv":"oftorl","disc":"Otorrinolaringologia","t":"Otologia · Otites","s":"Pelo resumo do Notion (os slides desta aula ainda não chegaram) · externa, média aguda, serosa e crônica","u":"otorrino/resumos/2","mat":"Oftalmologia e otorrinolaringologia","sub":"Otorrinolaringologia"},{"id":"or-rino","ch":"otorrino-A1","av":"A1","pv":"oftorl","disc":"Otorrinolaringologia","t":"Rinologia · Anatomia, fisiologia e rinites","s":"Aulas da Dra. Liora Gonik · anatomia do nariz e seios, pneumatização, vascularização, inervação, fisiologia, semiologia e rinites · 17 + 18 slides","u":"otorrino/resumos/3","mat":"Oftalmologia e otorrinolaringologia","sub":"Otorrinolaringologia"},{"id":"or-sinus","ch":"otorrino-A1","av":"A1","pv":"oftorl","disc":"Otorrinolaringologia","t":"Rinologia · Rinossinusites agudas","s":"Aula da Dra. Liora Gonik · conceito, subtipos, viral × bacteriana, exames, antibiótico com doses, corticoide e complicações · 20 slides","u":"otorrino/resumos/4","mat":"Oftalmologia e otorrinolaringologia","sub":"Otorrinolaringologia"},{"id":"urg-plantao","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Primeiro plantão: como se situar","s":"Organização, triagem, ABCDE e passagem de caso","u":"urg/resumos/0","mat":"Urgência e emergência","sub":""},{"id":"urg-pcr","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Parada cardiorrespiratória","s":"BLS e ACLS pelas diretrizes da AHA de 2025","u":"urg/resumos/1","mat":"Urgência e emergência","sub":""},{"id":"urg-sca","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Dor torácica e síndrome coronariana aguda","s":"Pela diretriz ACC/AHA de 2025 para SCA","u":"urg/resumos/2","mat":"Urgência e emergência","sub":""},{"id":"urg-neuro","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"AVC e crise convulsiva","s":"Diretriz AHA/ASA 2026 de AVC isquêmico, 2022 de hemorragia e estado de mal epiléptico","u":"urg/resumos/3","mat":"Urgência e emergência","sub":""},{"id":"urg-sepse","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Sepse, choque e anafilaxia","s":"Surviving Sepsis Campaign 2021, Sepsis-3 e WAO 2020","u":"urg/resumos/4","mat":"Urgência e emergência","sub":""},{"id":"urg-via-aerea","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Insuficiência respiratória e intubação","s":"Oxigênio, VNI e sequência rápida de intubação","u":"urg/resumos/5","mat":"Urgência e emergência","sub":""},{"id":"urg-trauma","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Trauma: atendimento inicial","s":"Pelo ATLS (10ª edição) e CRASH-2","u":"urg/resumos/6","mat":"Urgência e emergência","sub":""},{"id":"urg-metabolico","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Emergências metabólicas","s":"Cetoacidose, estado hiperosmolar, hipoglicemia e hipercalemia","u":"urg/resumos/7","mat":"Urgência e emergência","sub":""},{"id":"urg-intox","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Intoxicações","s":"Toxíndromes, antídotos e as intoxicações mais vistas no PS","u":"urg/resumos/8","mat":"Urgência e emergência","sub":""},{"id":"urg-prescricao","ch":"urg-A1","av":"A1","pv":"urg","disc":"Urgência e emergência","t":"Prescrição de plantão","s":"Estrutura da prescrição e sintomáticos mais usados no PS","u":"urg/resumos/9","mat":"Urgência e emergência","sub":""}],"grade":[["Ginecologia",[["",["ch:gineco"]]]],["Obstetrícia",[["",["ch:obst"]]]],["Clínica cirúrgica",[["Abdome",["id:ci-abd-"]],["Tórax",["id:ci-torax"]],["Coloproctologia",["id:ci-coloprocto"]],["Vascular",["id:ci-vascular"]],["Anestesiologia",["id:ci-an-"]],["Urologia",[]],["Ortopedia",[]],["Provas antigas",["id:ci-prova"]]]],["Medicina legal",[["",[]]]],["Oftalmologia e otorrinolaringologia",[["Oftalmologia",["ch:oftalmo"]],["Otorrinolaringologia",["ch:otorrino"]]]],["Urgência e emergência",[["",["ch:urg"]]]],["Pediatria 2",[["",[]]]]],"cards":[{"id":"1-anamnese-01","ch":"gineco-A1","av":"A1","q":"Quais são os parâmetros do ciclo menstrual normal no slide?","a":"Intervalo de 24 a 35 dias, fluxo de 3 a 7 dias, volume de 30 a 80 mL.","sec":"gineco/resumos/0","w":"1. Anamnese — o que ela antecipa dos spoilers"},{"id":"ob-diag-L0","ch":"obst-A1","av":"A1","q":"Útero aumentado e abaulado à esquerda e cérvice amolecida: quais os epônimos?","a":"Piskacek (abaulamento assimétrico no sítio de implantação) e Goodell (amolecimento do colo).","sec":"obst/resumos/0/0/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · O caso que abre a aula"},{"id":"ci-abd-agudo-L0","ch":"cirurgia-A1","av":"A1","q":"Quantas questões tem a prova de Clínica cirúrgica e como ela vale?","a":"3 dissertativas e 20 de múltipla escolha valendo 8 pontos, mais 2 pontos de conceito.","sec":"cirurgia/resumos/0/0/ci-abd-agudo","w":"Abdome · Abdome agudo · Definição e a prova"},{"id":"of-anat-L0","ch":"oftalmo-A1","av":"A1","q":"Quanto da relação com o ambiente passa pela visão e quanto da cegueira o exame periódico evita?","a":"70% e 70%.","sec":"oftalmo/resumos/0/0/of-anat","w":"Oftalmologia · Anatomia ocular · Por que o olho merece uma especialidade · slides 1–5, 62–63"},{"id":"or-disacusias-L0","ch":"otorrino-A1","av":"A1","q":"Quantos dos cinco sentidos ficam com o otorrino, e quais?","a":"Três: audição, olfato e paladar.","sec":"otorrino/resumos/0/0/or-disacusias","w":"Otologia · Aula inaugural e disacusias · A especialidade, os temas e as provas · slides 1–3, 8–9"},{"id":"urg-plantao-L0","ch":"urg-A1","av":"A1","q":"Qual a regra de ouro do atendimento de urgência?","a":"Tratar primeiro o que mata primeiro: garantir A, B e C antes de investigar a causa.","sec":"urg/resumos/0/0/urg-plantao","w":"Primeiro plantão: como se situar · O que se espera do interno na urgência"},{"id":"1-anamnese-02","ch":"gineco-A1","av":"A1","q":"Qual o primeiro exame diante de sangramento na pós-menopausa?","a":"USG transvaginal (avaliar o endométrio); depois histeroscopia com biópsia se indicado.","sec":"gineco/resumos/0","w":"1. Anamnese — o que ela antecipa dos spoilers"},{"id":"ob-diag-L1","ch":"obst-A1","av":"A1","q":"Por que o ácido fólico precisa começar antes da gravidez?","a":"O tubo neural fecha por volta de 6 semanas desde a DUM, quando muitas mulheres nem sabem que estão grávidas.","sec":"obst/resumos/0/1/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Preconcepção e por que diagnosticar cedo"},{"id":"ci-abd-agudo-L1","ch":"cirurgia-A1","av":"A1","q":"A laparoscopia no abdome agudo serve para diagnóstico, tratamento ou os dois?","a":"Os dois: confirma o diagnóstico e trata na mesma anestesia.","sec":"cirurgia/resumos/0/1/ci-abd-agudo","w":"Abdome · Abdome agudo · Laparoscopia no abdome agudo"},{"id":"of-anat-L1","ch":"oftalmo-A1","av":"A1","q":"Formato, volume e número de ossos da órbita?","a":"Cônica, cerca de 27 mL, pirâmide de 7 ossos.","sec":"oftalmo/resumos/0/1/of-anat","w":"Oftalmologia · Anatomia ocular · O aparelho visual e a órbita · slides 6–11"},{"id":"or-disacusias-L1","ch":"otorrino-A1","av":"A1","q":"Que norma tornou obrigatório o RQE em anúncio e carimbo?","a":"A Resolução CFM nº 1.974/2011.","sec":"otorrino/resumos/0/1/or-disacusias","w":"Otologia · Aula inaugural e disacusias · RQE e os otorrinos no Brasil · slides 4–7"},{"id":"urg-plantao-L1","ch":"urg-A1","av":"A1","q":"Qual o tempo-alvo de atendimento da cor laranja no Manchester?","a":"10 minutos (muito urgente).","sec":"urg/resumos/0/1/urg-plantao","w":"Primeiro plantão: como se situar · Triagem: o sistema de Manchester"},{"id":"1-anamnese-03","ch":"gineco-A1","av":"A1","q":"Qual medicamento obriga a investigar sangramento como possível doença endometrial?","a":"Tamoxifeno.","sec":"gineco/resumos/0","w":"1. Anamnese — o que ela antecipa dos spoilers"},{"id":"ob-diag-L2","ch":"obst-A1","av":"A1","q":"Qual é o método de escolha para a IG e qual o substituto quando a DUM é incerta?","a":"DUM conhecida e certa; sem ela, o USG mais precoce, com o CCN como medida mais fidedigna.","sec":"obst/resumos/0/2/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Idade gestacional: DUM ou primeiro USG"},{"id":"ci-abd-agudo-L2","ch":"cirurgia-A1","av":"A1","q":"Cite causas clínicas que simulam abdome agudo.","a":"Cetoacidose diabética, IAM de parede inferior, pneumonia de base, porfiria, crise falciforme, entre outras.","sec":"cirurgia/resumos/0/2/ci-abd-agudo","w":"Abdome · Abdome agudo · O que não é cirúrgico"},{"id":"of-anat-L2","ch":"oftalmo-A1","av":"A1","q":"Quais músculos não são inervados pelo III par?","a":"Oblíquo superior (IV) e reto lateral (VI): OS4, RL6.","sec":"oftalmo/resumos/0/2/of-anat","w":"Oftalmologia · Anatomia ocular · Os nervos do olho · slide 12"},{"id":"or-disacusias-L2","ch":"otorrino-A1","av":"A1","q":"Qual a função das orelhas externa, média e interna?","a":"Captação e amplificação; converter as ondas e manter a pressão; transdução.","sec":"otorrino/resumos/0/2/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Anatomia funcional da orelha · slides 10–14, 46"},{"id":"urg-plantao-L2","ch":"urg-A1","av":"A1","q":"Que exame simples entra no D de todo paciente com alteração de consciência?","a":"A glicemia capilar.","sec":"urg/resumos/0/2/urg-plantao","w":"Primeiro plantão: como se situar · A abordagem ABCDE do paciente clínico"},{"id":"1-anamnese-04","ch":"gineco-A1","av":"A1","q":"Qual exame é obrigatório em toda dor pélvica na idade reprodutiva?","a":"Beta-hCG.","sec":"gineco/resumos/0","w":"1. Anamnese — o que ela antecipa dos spoilers"},{"id":"ob-diag-L3","ch":"obst-A1","av":"A1","q":"DUM 10/06/2025. Qual a DPP?","a":"10 + 7 = 17; junho − 3 = março; ano + 1: DPP 17/03/2026.","sec":"obst/resumos/0/3/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Data provável do parto: regra de Näegele"},{"id":"ci-abd-agudo-L3","ch":"cirurgia-A1","av":"A1","q":"Qual dor é mal localizada e na linha média: a visceral ou a parietal?","a":"A visceral.","sec":"cirurgia/resumos/0/3/ci-abd-agudo","w":"Abdome · Abdome agudo · Dor visceral e dor parietal"},{"id":"of-anat-L3","ch":"oftalmo-A1","av":"A1","q":"De onde vem a artéria oftálmica e para onde drenam as veias?","a":"Da carótida interna; as veias drenam para o seio cavernoso.","sec":"oftalmo/resumos/0/3/of-anat","w":"Oftalmologia · Anatomia ocular · Vasos oftálmicos · slides 13–14"},{"id":"or-disacusias-L3","ch":"otorrino-A1","av":"A1","q":"Qual a faixa de audição humana e a da fala?","a":"20 a 20.000 Hz; fala de 500 a 3.000 Hz.","sec":"otorrino/resumos/0/3/or-disacusias","w":"Otologia · Aula inaugural e disacusias · O som e o caminho até o córtex · slides 15–17"},{"id":"urg-plantao-L3","ch":"urg-A1","av":"A1","q":"O que significa cada letra do SBAR?","a":"Situação, Background (contexto), Avaliação e Recomendação.","sec":"urg/resumos/0/3/urg-plantao","w":"Primeiro plantão: como se situar · Passar o caso: SBAR"},{"id":"2-vulvovaginites-vaginose-tr-01","ch":"gineco-A1","av":"A1","q":"Qual o pH vaginal normal na menacme e na pós-menopausa (slide)?","a":"Menacme: 3,5 a 4,5. Pré-púbere e pós-menopausa: 5 a 7.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L4","ch":"obst-A1","av":"A1","q":"Quais são os três caminhos do diagnóstico de gravidez?","a":"Laboratorial (β-hCG), clínico (sinais e sintomas) e ultrassonográfico.","sec":"obst/resumos/0/4/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Os três caminhos do diagnóstico"},{"id":"ci-abd-agudo-L4","ch":"cirurgia-A1","av":"A1","q":"Por que a localização da dor ajuda no abdome agudo?","a":"Cada quadrante aponta para os órgãos que estão embaixo e encurta a lista de hipóteses.","sec":"cirurgia/resumos/0/4/ci-abd-agudo","w":"Abdome · Abdome agudo · Onde dói: os quadrantes"},{"id":"of-anat-L4","ch":"oftalmo-A1","av":"A1","q":"O que faz o oblíquo superior com o olho aduzido?","a":"Depressão (abaixa o olho).","sec":"oftalmo/resumos/0/4/of-anat","w":"Oftalmologia · Anatomia ocular · Músculos extraoculares e suas ações · slides 15–17"},{"id":"or-disacusias-L4","ch":"otorrino-A1","av":"A1","q":"Prevalência de perda auditiva em neonatos, geral e no CTI?","a":"1 a 6 por 1.000 nascidos vivos; 1 a 4 por 100 no CTI.","sec":"otorrino/resumos/0/4/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Perda auditiva em números e fatores de risco · slides 18–19"},{"id":"urg-plantao-L4","ch":"urg-A1","av":"A1","q":"O qSOFA negativo descarta sepse?","a":"Não; serve para alertar, e a Surviving Sepsis 2021 recomenda não usá-lo sozinho como triagem.","sec":"urg/resumos/0/4/urg-plantao","w":"Primeiro plantão: como se situar · Sinais de alarme: quem não pode esperar"},{"id":"2-vulvovaginites-vaginose-tr-02","ch":"gineco-A1","av":"A1","q":"Cite 4 fatores que alcalinizam o pH vaginal.","a":"Sêmen, sangue menstrual, muco cervical, duchas/antibióticos, IST, gravidez/menopausa.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L5","ch":"obst-A1","av":"A1","q":"Quando o β-hCG fica detectável e quando faz pico?","a":"Cerca de 6 dias após a fecundação; pico perto de 8–10 semanas, depois cai.","sec":"obst/resumos/0/5/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Laboratorial: o β-hCG"},{"id":"ci-abd-agudo-L5","ch":"cirurgia-A1","av":"A1","q":"Qual é o primeiro exame de imagem para pneumoperitônio?","a":"Radiografia de tórax em pé (ou abdome em pé).","sec":"cirurgia/resumos/0/5/ci-abd-agudo","w":"Abdome · Abdome agudo · Diagnóstico: a ordem dos exames"},{"id":"of-anat-L5","ch":"oftalmo-A1","av":"A1","q":"Qual estrabismo se corrige com óculos?","a":"O convergente acomodativo.","sec":"oftalmo/resumos/0/5/of-anat","w":"Oftalmologia · Anatomia ocular · Estrabismo: quando os músculos não andam juntos · slides 18–19"},{"id":"or-disacusias-L5","ch":"otorrino-A1","av":"A1","q":"Como se classifica uma perda de 60 dB?","a":"Moderada a grave (56 a 70 dB).","sec":"otorrino/resumos/0/5/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Classificação da deficiência auditiva · slides 20–22"},{"id":"urg-pcr-L0","ch":"urg-A1","av":"A1","q":"Qual a frequência e a profundidade das compressões?","a":"100 a 120 por minuto, 5 a 6 cm, com retorno total do tórax.","sec":"urg/resumos/1/0/urg-pcr","w":"Parada cardiorrespiratória · Reconhecer a parada e começar"},{"id":"2-vulvovaginites-vaginose-tr-03","ch":"gineco-A1","av":"A1","q":"PEGADINHA: pós-menopausa assintomática com pH 6 tem vaginose?","a":"Não. pH 5 a 7 é normal nessa fase; pH isolado não fecha VB.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L6","ch":"obst-A1","av":"A1","q":"Qual a sequência do USG transvaginal e em que semanas?","a":"Saco gestacional (4–5 sem) → vesícula vitelínica (5 sem) → embrião (6 sem) → atividade cardíaca.","sec":"obst/resumos/0/6/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Ultrassonográfico"},{"id":"ci-abd-agudo-L6","ch":"cirurgia-A1","av":"A1","q":"Quais são as 5 síndromes do abdome agudo?","a":"Inflamatória, perfurativa, oclusiva, hemorrágica e vascular.","sec":"cirurgia/resumos/0/6/ci-abd-agudo","w":"Abdome · Abdome agudo · As 5 síndromes"},{"id":"of-anat-L6","ch":"oftalmo-A1","av":"A1","q":"Qual nervo abre e qual fecha o olho?","a":"O III par (elevador) abre; o VII par (orbicular) fecha.","sec":"oftalmo/resumos/0/6/of-anat","w":"Oftalmologia · Anatomia ocular · Pálpebras · slides 20–22"},{"id":"or-disacusias-L6","ch":"otorrino-A1","av":"A1","q":"Onde fica o triângulo luminoso da membrana normal?","a":"No quadrante anteroinferior, saindo do umbo.","sec":"otorrino/resumos/0/6/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Semiologia otológica: anamnese e otoscopia · slides 23–24"},{"id":"urg-pcr-L1","ch":"urg-A1","av":"A1","q":"Quando entra a adrenalina na FV e na assistolia?","a":"Na FV, depois do 2º choque; na assistolia/AESP, o quanto antes.","sec":"urg/resumos/1/1/urg-pcr","w":"Parada cardiorrespiratória · Os quatro ritmos e os dois caminhos"},{"id":"2-vulvovaginites-vaginose-tr-04","ch":"gineco-A1","av":"A1","q":"Qual a causa mais comum de corrimento e qual a frequência?","a":"Vaginose bacteriana: 40 a 50% dos corrimentos.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L7","ch":"obst-A1","av":"A1","q":"Por que os sinais de presunção não confirmam gravidez?","a":"Porque dependem da percepção da mulher ou de alterações que outras condições também causam (atraso, náusea, mastalgia, polaciúria).","sec":"obst/resumos/0/7/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Clínico: sinais e sintomas de presunção"},{"id":"ci-abd-agudo-L7","ch":"cirurgia-A1","av":"A1","q":"Como se chama o sinal da perda da macicez hepática na perfuração?","a":"Sinal de Jobert.","sec":"cirurgia/resumos/0/7/ci-abd-agudo","w":"Abdome · Abdome agudo · Síndrome perfurativa"},{"id":"of-anat-L7","ch":"oftalmo-A1","av":"A1","q":"Qual o caminho da lágrima depois dos pontos lacrimais?","a":"Canalículos, saco lacrimal e ducto nasolacrimal até o nariz.","sec":"oftalmo/resumos/0/7/of-anat","w":"Oftalmologia · Anatomia ocular · Sistema lacrimal e conjuntiva · slides 23–24"},{"id":"or-disacusias-L7","ch":"otorrino-A1","av":"A1","q":"Para onde lateraliza o Weber na perda condutiva e na neurossensorial?","a":"Condutiva: para o lado da perda. Neurossensorial: para o lado bom.","sec":"otorrino/resumos/0/7/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Diapasão: via aérea e teste de Weber · slides 25–27"},{"id":"urg-pcr-L2","ch":"urg-A1","av":"A1","q":"Cite os 5T.","a":"Tensão no tórax, tamponamento, toxinas, trombose pulmonar e trombose coronária.","sec":"urg/resumos/1/2/urg-pcr","w":"Parada cardiorrespiratória · As causas reversíveis: 5H e 5T"},{"id":"2-vulvovaginites-vaginose-tr-05","ch":"gineco-A1","av":"A1","q":"A VB é mais comum em qual grupo?","a":"Mulheres negras (3×).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L8","ch":"obst-A1","av":"A1","q":"Hegar, Piskacek e Nobile-Budin: o que é cada um?","a":"Hegar: istmo amolecido (dedos se tocam); Piskacek: útero assimétrico; Nobile-Budin: fundo de saco lateral preenchido (útero globoso).","sec":"obst/resumos/0/8/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Clínico: sinais de probabilidade"},{"id":"ci-abd-agudo-L8","ch":"cirurgia-A1","av":"A1","q":"Qual é o exemplo clássico de síndrome inflamatória?","a":"A apendicite aguda.","sec":"cirurgia/resumos/0/8/ci-abd-agudo","w":"Abdome · Abdome agudo · Síndrome inflamatória"},{"id":"of-anat-L8","ch":"oftalmo-A1","av":"A1","q":"Quais são as três túnicas do olho?","a":"Fibrosa (córnea e esclera), vascular (úvea) e nervosa (retina).","sec":"oftalmo/resumos/0/8/of-anat","w":"Oftalmologia · Anatomia ocular · O globo ocular e suas três túnicas · slides 25–26"},{"id":"or-disacusias-L8","ch":"otorrino-A1","av":"A1","q":"O que significa Rinne negativo?","a":"Via aérea menor que a óssea: perda condutiva.","sec":"otorrino/resumos/0/8/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Teste de Rinne e a dupla Weber × Rinne · slide 28"},{"id":"urg-pcr-L3","ch":"urg-A1","av":"A1","q":"Qual a meta de PAM e de SpO2 depois do RCE?","a":"PAM ≥ 65 mmHg e SpO2 entre 92 e 98%.","sec":"urg/resumos/1/3/urg-pcr","w":"Parada cardiorrespiratória · Depois do retorno da circulação (RCE)"},{"id":"2-vulvovaginites-vaginose-tr-06","ch":"gineco-A1","av":"A1","q":"Por que se chama vaginose e não vaginite?","a":"Não há inflamação nem leucócitos; é disbiose.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L9","ch":"obst-A1","av":"A1","q":"Quais são os sinais de certeza?","a":"BCF (sonar ~10–12 sem), movimentos fetais percebidos pelo examinador, rechaço (Puzos) e partes fetais palpáveis; e o embrião no USG.","sec":"obst/resumos/0/9/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Clínico: sinais de certeza"},{"id":"ci-abd-agudo-L9","ch":"cirurgia-A1","av":"A1","q":"Quais são os quatro sinais clássicos da obstrução intestinal?","a":"Dor em cólica, vômitos, distensão e parada de eliminação de gases e fezes.","sec":"cirurgia/resumos/0/9/ci-abd-agudo","w":"Abdome · Abdome agudo · Síndrome oclusiva: o quadro"},{"id":"of-anat-L9","ch":"oftalmo-A1","av":"A1","q":"Quais as cinco camadas da córnea?","a":"Epitélio, Bowman, estroma, Descemet e endotélio.","sec":"oftalmo/resumos/0/9/of-anat","w":"Oftalmologia · Anatomia ocular · Córnea · slides 27–31"},{"id":"or-disacusias-L9","ch":"otorrino-A1","av":"A1","q":"Com que idade a criança localiza o som em qualquer ângulo?","a":"Entre 21 e 24 meses.","sec":"otorrino/resumos/0/9/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Avaliação comportamental da criança · slides 29–31"},{"id":"urg-pcr-L4","ch":"urg-A1","av":"A1","q":"Qual a dose de atropina na bradicardia instável?","a":"1 mg IV a cada 3 a 5 min, máximo de 3 mg.","sec":"urg/resumos/1/4/urg-pcr","w":"Parada cardiorrespiratória · Arritmias com pulso: instável ou estável?"},{"id":"2-vulvovaginites-vaginose-tr-07","ch":"gineco-A1","av":"A1","q":"Explique o odor de peixe e por que piora após o coito.","a":"Anaeróbios produzem aminas que volatilizam em pH alto; o sêmen é alcalino.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-diag-L10","ch":"obst-A1","av":"A1","q":"Em que ordem aparecem Montgomery, Haller e Hunter?","a":"Montgomery (8 sem) → rede de Haller (16 sem) → aréola secundária de Hunter (20 sem).","sec":"obst/resumos/0/10/ob-diag","w":"1. Diagnóstico de gravidez e idade gestacional · Tabela-resumo do slide 35"},{"id":"ci-abd-agudo-L10","ch":"cirurgia-A1","av":"A1","q":"Pregas que atravessam toda a alça na radiografia indicam delgado ou cólon?","a":"Delgado (válvulas coniventes de Kerckring).","sec":"cirurgia/resumos/0/10/ci-abd-agudo","w":"Abdome · Abdome agudo · Obstrução: o que o RX mostra"},{"id":"of-anat-L10","ch":"oftalmo-A1","av":"A1","q":"Quais são as funções da esclera?","a":"Proteção e contenção.","sec":"oftalmo/resumos/0/10/of-anat","w":"Oftalmologia · Anatomia ocular · Esclera · slides 32–35"},{"id":"or-disacusias-L10","ch":"otorrino-A1","av":"A1","q":"Vias aérea e óssea caídas juntas, sem gap: que perda?","a":"Neurossensorial.","sec":"otorrino/resumos/0/10/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Audiometria tonal e o audiograma · slides 32–34"},{"id":"urg-sca-L0","ch":"urg-A1","av":"A1","q":"Em quanto tempo o ECG deve ser feito na dor torácica?","a":"Em até 10 minutos da chegada.","sec":"urg/resumos/2/0/urg-sca","w":"Dor torácica e síndrome coronariana aguda · Dor torácica: os 10 primeiros minutos"},{"id":"2-vulvovaginites-vaginose-tr-08","ch":"gineco-A1","av":"A1","q":"Cite os 4 elementos diagnósticos do slide.","a":"Clínica, pH > 4,5, teste das aminas positivo (KOH 10%), clue cells ≥ 20%.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L0","ch":"obst-A1","av":"A1","q":"Quais são as três origens das modificações maternas?","a":"Hormonal, mecânica e fetal (demanda de O₂ e nutrientes).","sec":"obst/resumos/1/0/ob-mod","w":"2. Modificações do organismo materno · Por que o corpo muda: três origens"},{"id":"ci-abd-agudo-L11","ch":"cirurgia-A1","av":"A1","q":"Qual é a causa mais comum de obstrução do delgado?","a":"Bridas (aderências pós-operatórias).","sec":"cirurgia/resumos/0/11/ci-abd-agudo","w":"Abdome · Abdome agudo · Obstrução de delgado: conduta e causas"},{"id":"of-anat-L11","ch":"oftalmo-A1","av":"A1","q":"Qual a função da coroide?","a":"Nutrir a retina.","sec":"oftalmo/resumos/0/11/of-anat","w":"Oftalmologia · Anatomia ocular · Úvea: a coroide · slides 35–36"},{"id":"or-disacusias-L11","ch":"otorrino-A1","av":"A1","q":"Que curva do timpanograma sugere líquido na orelha média?","a":"A curva B, plana.","sec":"otorrino/resumos/0/11/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Imitanciometria · slide 35"},{"id":"urg-sca-L1","ch":"urg-A1","av":"A1","q":"Que derivações fazer num IAM inferior e por quê?","a":"V3R e V4R, para procurar infarto de VD.","sec":"urg/resumos/2/1/urg-sca","w":"Dor torácica e síndrome coronariana aguda · Ler o ECG: IAM com supra (IAMCSST)"},{"id":"2-vulvovaginites-vaginose-tr-09","ch":"gineco-A1","av":"A1","q":"Fatores de risco e de proteção da VB?","a":"Risco: múltiplos parceiros e ducha. Proteção: preservativo e ACO combinado.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L1","ch":"obst-A1","av":"A1","q":"Qual tópico é classicamente contraindicado na gestação?","a":"Retinoides (tretinoína). Estria: hidratante não comprovou prevenção.","sec":"obst/resumos/1/1/ob-mod","w":"2. Modificações do organismo materno · Pele e fâneros"},{"id":"ci-abd-agudo-L12","ch":"cirurgia-A1","av":"A1","q":"Qual é a causa mais comum de obstrução do cólon?","a":"O câncer colorretal.","sec":"cirurgia/resumos/0/12/ci-abd-agudo","w":"Abdome · Abdome agudo · Obstrução do cólon"},{"id":"of-anat-L12","ch":"oftalmo-A1","av":"A1","q":"Quais as duas funções do corpo ciliar?","a":"Secretar humor aquoso e acomodar o cristalino.","sec":"oftalmo/resumos/0/12/of-anat","w":"Oftalmologia · Anatomia ocular · Úvea: o corpo ciliar · slides 37–38, 41"},{"id":"or-disacusias-L12","ch":"otorrino-A1","av":"A1","q":"Quando a EOA fica ausente?","a":"Em doença de orelha média e quando a audição está pior que 30 dB.","sec":"otorrino/resumos/0/12/or-disacusias","w":"Otologia · Aula inaugural e disacusias · Otoemissões acústicas e a triagem neonatal · slides 36–38"},{"id":"urg-sca-L2","ch":"urg-A1","av":"A1","q":"Qual a dose de ataque do ticagrelor?","a":"180 mg.","sec":"urg/resumos/2/2/urg-sca","w":"Dor torácica e síndrome coronariana aguda · Tratamento inicial da SCA"},{"id":"2-vulvovaginites-vaginose-tr-10","ch":"gineco-A1","av":"A1","q":"Tratamento da VB na não gestante?","a":"Metronidazol 500 mg VO 12/12 h por 7 dias (ou gel 0,75% 5 noites, ou clindamicina creme 7 noites).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L2","ch":"obst-A1","av":"A1","q":"O que é a embebição gravídica e para que serve?","a":"Relaxamento ligamentar das articulações pélvicas (até ~1,2 cm no púbis), que facilita o parto.","sec":"obst/resumos/1/2/ob-mod","w":"2. Modificações do organismo materno · Osteoarticular e postura"},{"id":"ci-abd-agudo-L13","ch":"cirurgia-A1","av":"A1","q":"Mulher jovem com dor e choque: qual exame pedir primeiro?","a":"Beta-hCG (gravidez ectópica rota).","sec":"cirurgia/resumos/0/13/ci-abd-agudo","w":"Abdome · Abdome agudo · Síndrome hemorrágica"},{"id":"of-anat-L13","ch":"oftalmo-A1","av":"A1","q":"Quem faz miose e quem faz midríase?","a":"Esfíncter (parassimpático) faz miose; dilatador (simpático) faz midríase.","sec":"oftalmo/resumos/0/13/of-anat","w":"Oftalmologia · Anatomia ocular · Úvea: a íris e a pupila · slides 39–45"},{"id":"or-disacusias-L13","ch":"otorrino-A1","av":"A1","q":"O que o PEATE avalia?","a":"A condução eletrofisiológica do estímulo da periferia até o tronco encefálico.","sec":"otorrino/resumos/0/13/or-disacusias","w":"Otologia · Aula inaugural e disacusias · PEATE, o potencial evocado de tronco · slides 39–40"},{"id":"urg-sca-L3","ch":"urg-A1","av":"A1","q":"Qual o tempo porta-agulha da trombólise?","a":"Até 30 minutos.","sec":"urg/resumos/2/3/urg-sca","w":"Dor torácica e síndrome coronariana aguda · Reperfusão: o relógio do IAM com supra"},{"id":"2-vulvovaginites-vaginose-tr-11","ch":"gineco-A1","av":"A1","q":"Tratamento da VB na gestante segundo o slide?","a":"Metronidazol 250 mg VO 8/8 h por 7 dias (ou clindamicina 300 mg 12/12 h 7 dias).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L3","ch":"obst-A1","av":"A1","q":"Corrimento aumentado é normal. Quando deixa de ser?","a":"Quando vem com prurido, odor ou ardor: infecção, ligada a parto prematuro.","sec":"obst/resumos/1/3/ob-mod","w":"2. Modificações do organismo materno · Sistema genital: vulva, vagina e mama"},{"id":"ci-abd-agudo-L14","ch":"cirurgia-A1","av":"A1","q":"Qual é a pista clássica da isquemia mesentérica?","a":"Dor desproporcional ao exame físico, em idoso com fibrilação atrial.","sec":"cirurgia/resumos/0/14/ci-abd-agudo","w":"Abdome · Abdome agudo · Síndrome vascular"},{"id":"of-anat-L14","ch":"oftalmo-A1","av":"A1","q":"Qual a camada mais externa da retina?","a":"O epitélio pigmentar da retina (EPR).","sec":"oftalmo/resumos/0/14/of-anat","w":"Oftalmologia · Anatomia ocular · Retina: as dez camadas · slides 46–49"},{"id":"or-disacusias-L14","ch":"otorrino-A1","av":"A1","q":"Qual o primeiro sinal audiométrico da PAIR?","a":"Entalhe em 3, 4 ou 6 kHz com recuperação em 8 kHz.","sec":"otorrino/resumos/0/14/or-disacusias","w":"Otologia · Aula inaugural e disacusias · PAIR: a perda induzida por ruído · slides 41, 43–44"},{"id":"urg-sca-L4","ch":"urg-A1","av":"A1","q":"Quando a estratégia invasiva é imediata (< 2 h) no IAM sem supra?","a":"Instabilidade hemodinâmica, dor refratária, arritmia grave, IC aguda ou complicação mecânica.","sec":"urg/resumos/2/4/urg-sca","w":"Dor torácica e síndrome coronariana aguda · Sem supra: troponina e risco"},{"id":"2-vulvovaginites-vaginose-tr-12","ch":"gineco-A1","av":"A1","q":"Complicações da VB na gestação?","a":"Rotura prematura de membranas (~7,3×), parto prematuro, endometrite pós-cesárea.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L4","ch":"obst-A1","av":"A1","q":"Quanto pesa e quanto cabe no útero a termo?","a":"~1.100 g e ~5 L (era 70 g e 10 mL).","sec":"obst/resumos/1/4/ob-mod","w":"2. Modificações do organismo materno · Útero"},{"id":"ci-abd-apendicite-L0","ch":"cirurgia-A1","av":"A1","q":"Qual é a mortalidade da apendicite com e sem perfuração?","a":"0,5% sem perfuração e 2,5% perfurada.","sec":"cirurgia/resumos/1/0/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Epidemiologia"},{"id":"of-anat-L15","ch":"oftalmo-A1","av":"A1","q":"Por que o disco óptico é o ponto cego?","a":"É o início do II par e é insensível à luz.","sec":"oftalmo/resumos/0/15/of-anat","w":"Oftalmologia · Anatomia ocular · Mácula e disco óptico · slides 50–52"},{"id":"or-disacusias-L15","ch":"otorrino-A1","av":"A1","q":"Quanto tempo por dia a NR-15 permite a 85 dB(A)?","a":"8 horas (90 dB: 4 h; 100 dB: 1 h).","sec":"otorrino/resumos/0/15/or-disacusias","w":"Otologia · Aula inaugural e disacusias · PAIR, NR-15 e saúde do trabalhador · slides 42, 45, 47"},{"id":"urg-neuro-L0","ch":"urg-A1","av":"A1","q":"Qual a pergunta mais importante na suspeita de AVC?","a":"A que horas o paciente foi visto bem pela última vez.","sec":"urg/resumos/3/0/urg-neuro","w":"AVC e crise convulsiva · Suspeita de AVC: tempo é cérebro"},{"id":"2-vulvovaginites-vaginose-tr-13","ch":"gineco-A1","av":"A1","q":"Trata o parceiro na VB?","a":"Não, de rotina.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L5","ch":"obst-A1","av":"A1","q":"Como fica a gasometria normal da gestante?","a":"Alcalose respiratória compensada: PCO₂ ~30 mmHg, HCO₃ ~22 mmol/L.","sec":"obst/resumos/1/5/ob-mod","w":"2. Modificações do organismo materno · Respiratório"},{"id":"ci-abd-apendicite-L1","ch":"cirurgia-A1","av":"A1","q":"Qual é a posição mais comum do apêndice?","a":"Retrocecal.","sec":"cirurgia/resumos/1/1/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Anatomia: o apêndice que muda de lugar"},{"id":"of-anat-L16","ch":"oftalmo-A1","av":"A1","q":"Quem produz o humor aquoso?","a":"O epitélio não pigmentado do corpo ciliar.","sec":"oftalmo/resumos/0/16/of-anat","w":"Oftalmologia · Anatomia ocular · Meios de refração: córnea e humor aquoso · slides 53–55"},{"id":"or-semio-L0","ch":"otorrino-A1","av":"A1","q":"Onde fica o triângulo luminoso da membrana normal?","a":"Anteroinferior, saindo do umbo.","sec":"otorrino/resumos/1/0/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Semiologia otológica: anamnese e otoscopia · slides 2–3"},{"id":"urg-neuro-L1","ch":"urg-A1","av":"A1","q":"Qual a dose da alteplase no AVC?","a":"0,9 mg/kg (máx. 90 mg), 10% em bolus e o resto em 60 min.","sec":"urg/resumos/3/1/urg-neuro","w":"AVC e crise convulsiva · Isquêmico: trombólise e trombectomia"},{"id":"2-vulvovaginites-vaginose-tr-14","ch":"gineco-A1","av":"A1","q":"Qual o agente da tricomoníase e como se transmite?","a":"Trichomonas vaginalis, protozoário flagelado; transmissão exclusivamente sexual.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L6","ch":"obst-A1","av":"A1","q":"Por que a anemia da gestação é chamada de fisiológica?","a":"O plasma sobe 40–50% e as hemácias só 20–30%: hemodiluição.","sec":"obst/resumos/1/6/ob-mod","w":"2. Modificações do organismo materno · Hematológico"},{"id":"ci-abd-apendicite-L2","ch":"cirurgia-A1","av":"A1","q":"Qual é a causa de obstrução apendicular na criança e no adulto?","a":"Criança: hiperplasia linfoide. Adulto: fecalito.","sec":"cirurgia/resumos/1/2/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Etiologia"},{"id":"of-anat-L17","ch":"oftalmo-A1","av":"A1","q":"Qual o volume do vítreo?","a":"Cerca de 4 mL, até 10 mL na alta miopia.","sec":"oftalmo/resumos/0/17/of-anat","w":"Oftalmologia · Anatomia ocular · Cristalino e humor vítreo · slides 56–61"},{"id":"or-semio-L1","ch":"otorrino-A1","av":"A1","q":"Como o slide divide a perda neurossensorial?","a":"Coclear, retrococlear e central.","sec":"otorrino/resumos/1/1/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Tipos de perda auditiva · slide 4"},{"id":"urg-neuro-L2","ch":"urg-A1","av":"A1","q":"Como reverter a varfarina numa hemorragia intracerebral?","a":"Vitamina K IV e complexo protrombínico.","sec":"urg/resumos/3/2/urg-neuro","w":"AVC e crise convulsiva · Hemorrágico: baixar a pressão e reverter"},{"id":"2-vulvovaginites-vaginose-tr-15","ch":"gineco-A1","av":"A1","q":"Qual pH o tricomonas prefere / qual o pH do slide para o diagnóstico?","a":"Acima de 6.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L7","ch":"obst-A1","av":"A1","q":"Quanto aumenta o risco de TEV na gestação e no puerpério?","a":"4 a 5 vezes na gestação; cerca de 20 vezes no puerpério.","sec":"obst/resumos/1/7/ob-mod","w":"2. Modificações do organismo materno · Coagulação e risco de trombose"},{"id":"ci-abd-apendicite-L3","ch":"cirurgia-A1","av":"A1","q":"Na alça fechada, o que sofre primeiro: veia ou artéria?","a":"A veia (retorno venoso); depois a artéria, a necrose e a perfuração.","sec":"cirurgia/resumos/1/3/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Fisiopatologia: a alça fechada"},{"id":"of-palp-L0","ch":"oftalmo-A1","av":"A1","q":"Quem abre e quem fecha a pálpebra, e qual o nervo de cada um?","a":"Abre: elevador (III par, 2/3) e Müller (simpático, 1/3). Fecha: orbicular (VII par).","sec":"oftalmo/resumos/1/0/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Anatomia da pálpebra: camadas e músculos · slides 3–4, 6–7"},{"id":"or-semio-L2","ch":"otorrino-A1","av":"A1","q":"Para que lado vai o Weber na perda condutiva?","a":"Para o lado da perda (doente); na neurossensorial, para o lado bom.","sec":"otorrino/resumos/1/2/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Testes com diapasão: via aérea, Weber e Rinne · slides 5–8"},{"id":"urg-neuro-L3","ch":"urg-A1","av":"A1","q":"A partir de quantos minutos uma crise é estado de mal?","a":"Mais de 5 minutos (ou crises repetidas sem recuperação).","sec":"urg/resumos/3/3/urg-neuro","w":"AVC e crise convulsiva · Crise convulsiva e estado de mal epiléptico"},{"id":"2-vulvovaginites-vaginose-tr-16","ch":"gineco-A1","av":"A1","q":"Descreva o corrimento e o sinal clássico ao especular.","a":"Espumoso, amarelo-esverdeado, fétido; colo em morango (colpite focal/difusa).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L8","ch":"obst-A1","av":"A1","q":"Por que a PA cai se o débito cardíaco sobe?","a":"PA = RVP × DC, e a RVP cai mais do que o DC sobe.","sec":"obst/resumos/1/8/ob-mod","w":"2. Modificações do organismo materno · Cardiovascular"},{"id":"ci-abd-apendicite-L4","ch":"cirurgia-A1","av":"A1","q":"Por que a dor migra do epigástrio para a fossa ilíaca direita?","a":"Começa visceral (distensão) e vira somática quando a inflamação atinge o peritônio parietal.","sec":"cirurgia/resumos/1/4/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Clínica: as duas dores"},{"id":"of-palp-L1","ch":"oftalmo-A1","av":"A1","q":"Quais as glândulas sebáceas e qual a sudorípara da pálpebra?","a":"Sebáceas: Zeis (cílios) e Meibomius (tarso). Sudorípara: Moll (margem).","sec":"oftalmo/resumos/1/1/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Funções da pálpebra e suas glândulas · slides 5, 8"},{"id":"or-semio-L3","ch":"otorrino-A1","av":"A1","q":"Com que idade a criança localiza o som em qualquer ângulo?","a":"Entre 21 e 24 meses.","sec":"otorrino/resumos/1/3/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Avaliação comportamental da criança · slides 9–11"},{"id":"urg-sepse-L0","ch":"urg-A1","av":"A1","q":"O que define choque séptico pela Sepsis-3?","a":"Vasopressor para PAM ≥ 65 mmHg e lactato > 2 mmol/L apesar de volume.","sec":"urg/resumos/4/0/urg-sepse","w":"Sepse, choque e anafilaxia · Sepse: definição que se usa hoje"},{"id":"2-vulvovaginites-vaginose-tr-17","ch":"gineco-A1","av":"A1","q":"Com qual IST a tricomoníase se associa?","a":"Gonorreia.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L9","ch":"obst-A1","av":"A1","q":"O que caracteriza a 2ª metade da gestação no metabolismo da glicose?","a":"Resistência à insulina (hPL), hiperglicemia pós-prandial e hiperinsulinemia compensatória.","sec":"obst/resumos/1/9/ob-mod","w":"2. Modificações do organismo materno · Metabolismo"},{"id":"ci-abd-apendicite-L5","ch":"cirurgia-A1","av":"A1","q":"Febre e leucocitose ausentes excluem apendicite?","a":"Não. Podem faltar.","sec":"cirurgia/resumos/1/5/ci-abd-apendicite","w":"Abdome · Apendicite aguda · O que pode faltar e a pegadinha do antibiótico"},{"id":"of-palp-L2","ch":"oftalmo-A1","av":"A1","q":"Qual a causa da ptose congênita e o que ela pode causar?","a":"Elevador mal desenvolvido; associa estrabismo e ambliopia; tratamento cirúrgico.","sec":"oftalmo/resumos/1/2/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Ptose congênita e retração palpebral · slides 9–11"},{"id":"or-semio-L4","ch":"otorrino-A1","av":"A1","q":"O que indica o gap aéreo-ósseo?","a":"Perda condutiva (via óssea normal, aérea rebaixada).","sec":"otorrino/resumos/1/4/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Audiometria tonal: condicionada e limiar · slides 12–14"},{"id":"urg-sepse-L1","ch":"urg-A1","av":"A1","q":"Quanto de cristaloide se dá na sepse com hipotensão?","a":"30 mL/kg nas primeiras 3 horas, reavaliando.","sec":"urg/resumos/4/1/urg-sepse","w":"Sepse, choque e anafilaxia · O pacote da primeira hora"},{"id":"2-vulvovaginites-vaginose-tr-18","ch":"gineco-A1","av":"A1","q":"Como se confirma no consultório?","a":"Exame a fresco mostrando protozoário móvel (com muitos leucócitos).","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L10","ch":"obst-A1","av":"A1","q":"Qual o limite normal de proteinúria de 24 h na gestação?","a":"Até 300 mg/24 h. Acima disso, pensar em pré-eclâmpsia ou nefropatia.","sec":"obst/resumos/1/10/ob-mod","w":"2. Modificações do organismo materno · Urinário"},{"id":"ci-abd-apendicite-L6","ch":"cirurgia-A1","av":"A1","q":"Quantos piócitos no EAS ainda são compatíveis com apendicite?","a":"Menos de 20 por campo.","sec":"cirurgia/resumos/1/6/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Diagnóstico: laboratório"},{"id":"of-palp-L3","ch":"oftalmo-A1","av":"A1","q":"Qual a diferença entre entrópio e triquíase?","a":"Entrópio: margem virada para dentro. Triquíase: margem normal, cílios maldirecionados.","sec":"oftalmo/resumos/1/3/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Entrópio e triquíase: o cílio contra a córnea · slides 12–15"},{"id":"or-semio-L5","ch":"otorrino-A1","av":"A1","q":"O que significa a curva B?","a":"Curva plana: líquido na orelha média (efusão) ou perfuração.","sec":"otorrino/resumos/1/5/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Imitanciometria e timpanometria · slide 15"},{"id":"urg-sepse-L2","ch":"urg-A1","av":"A1","q":"Quais choques têm pele quente e resistência vascular baixa?","a":"Os distributivos (sepse, anafilaxia, neurogênico).","sec":"urg/resumos/4/2/urg-sepse","w":"Sepse, choque e anafilaxia · Os quatro tipos de choque"},{"id":"2-vulvovaginites-vaginose-tr-19","ch":"gineco-A1","av":"A1","q":"Esquema do slide para homem e para mulher?","a":"Homem: metronidazol 2 g dose única. Mulher: 500 mg 12/12 h por 7 dias.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L11","ch":"obst-A1","av":"A1","q":"Por que a gestante tem pirose?","a":"A progesterona reduz o tônus do esfíncter esofágico inferior e o esvaziamento gástrico fica lento.","sec":"obst/resumos/1/11/ob-mod","w":"2. Modificações do organismo materno · Gastrointestinal"},{"id":"ci-abd-apendicite-L7","ch":"cirurgia-A1","av":"A1","q":"Qual é o diâmetro do apêndice que sugere apendicite na USG?","a":"Maior que 6 mm.","sec":"cirurgia/resumos/1/7/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Diagnóstico: imagem"},{"id":"of-palp-L4","ch":"oftalmo-A1","av":"A1","q":"Qual nervo está envolvido no ectrópio paralítico?","a":"O VII par (facial), que inerva o orbicular.","sec":"oftalmo/resumos/1/4/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Ectrópio e madarose · slides 16–18"},{"id":"or-semio-L6","ch":"otorrino-A1","av":"A1","q":"Quando a EOA está ausente?","a":"Em doença da orelha média e em perda pior que 30 dB.","sec":"otorrino/resumos/1/6/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Otoemissões acústicas e triagem auditiva neonatal · slides 16–19"},{"id":"urg-sepse-L3","ch":"urg-A1","av":"A1","q":"Qual a dose máxima de adrenalina IM no adulto?","a":"0,5 mg (0,01 mg/kg da solução 1 mg/mL).","sec":"urg/resumos/4/3/urg-sepse","w":"Sepse, choque e anafilaxia · Anafilaxia: adrenalina intramuscular primeiro"},{"id":"2-vulvovaginites-vaginose-tr-20","ch":"gineco-A1","av":"A1","q":"Trata o parceiro? E o gel?","a":"Sim, sempre. O gel de metronidazol só alivia sintomas.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-mod-L12","ch":"obst-A1","av":"A1","q":"Em uma frase: o que a progesterona faz e o que o estrogênio faz?","a":"Progesterona relaxa (frouxo e lento); estrogênio constrói (mais volume e mais tecido).","sec":"obst/resumos/1/12/ob-mod","w":"2. Modificações do organismo materno · Resumo para a prova discursiva"},{"id":"ci-abd-apendicite-L8","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta no flegmão apendicular?","a":"Antibiótico primeiro e apendicectomia de intervalo depois (acima de 35 anos).","sec":"cirurgia/resumos/1/8/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Tratamento"},{"id":"of-palp-L5","ch":"oftalmo-A1","av":"A1","q":"Qual a base do tratamento da blefarite?","a":"Higiene palpebral 2x/dia e compressas quentes.","sec":"oftalmo/resumos/1/5/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Blefarite · slides 19–23"},{"id":"or-semio-L7","ch":"otorrino-A1","av":"A1","q":"Qual a onda mais constante do PEATE?","a":"A onda V.","sec":"otorrino/resumos/1/7/or-semio","w":"Otologia · Semiologia da audição e do labirinto · PEATE: potencial evocado auditivo de tronco encefálico · slides 20–21"},{"id":"urg-via-aerea-L0","ch":"urg-A1","av":"A1","q":"Qual o alvo de SpO2 no paciente com DPOC retentor?","a":"88 a 92%.","sec":"urg/resumos/5/0/urg-via-aerea","w":"Insuficiência respiratória e intubação · Oxigênio: nem de menos nem de mais"},{"id":"2-vulvovaginites-vaginose-tr-21","ch":"gineco-A1","av":"A1","q":"Quando tratar a gestante, segundo o slide?","a":"A partir do terceiro mês.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L0","ch":"obst-A1","av":"A1","q":"Cite três objetivos do pré-natal.","a":"Confirmar a gravidez, prevenir e detectar precocemente agravos maternos e fetais, orientar parto e puerpério.","sec":"obst/resumos/2/0/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Para que serve o pré-natal"},{"id":"ci-abd-apendicite-L9","ch":"cirurgia-A1","av":"A1","q":"Abscesso periapendicular maior que 4 cm é qual grau da WSES?","a":"Grau 3C.","sec":"cirurgia/resumos/1/9/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Prognóstico: a classificação da WSES"},{"id":"of-palp-L6","ch":"oftalmo-A1","av":"A1","q":"Quais glândulas se infectam no hordéolo interno e no externo?","a":"Interno: Meibomius. Externo (terçol): Zeis ou Moll. Ambos por estafilococo.","sec":"oftalmo/resumos/1/6/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Hordéolo interno e externo (terçol) · slides 24–28"},{"id":"or-semio-L8","ch":"otorrino-A1","av":"A1","q":"Quais os três sistemas do equilíbrio?","a":"Labirinto, olhos e propriocepção.","sec":"otorrino/resumos/1/8/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Labirinto e equilíbrio · slides 22–24, 29"},{"id":"urg-via-aerea-L1","ch":"urg-A1","av":"A1","q":"Em quais duas situações a VNI tem melhor evidência?","a":"DPOC exacerbada com acidose respiratória e edema agudo de pulmão cardiogênico.","sec":"urg/resumos/5/1/urg-via-aerea","w":"Insuficiência respiratória e intubação · Ventilação não invasiva (VNI)"},{"id":"2-vulvovaginites-vaginose-tr-22","ch":"gineco-A1","av":"A1","q":"Por que achar Candida no exame não significa doença?","a":"Ela é comensal em 20 a 50% das mulheres saudáveis.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L1","ch":"obst-A1","av":"A1","q":"Qual o ritmo das consultas?","a":"1ª até 12 sem; mensais até 28; quinzenais de 28 a 36; semanais de 36 a 41.","sec":"obst/resumos/2/1/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Calendário de consultas"},{"id":"ci-abd-apendicite-L10","ch":"cirurgia-A1","av":"A1","q":"De quanto em quanto tempo reavaliar o caso duvidoso?","a":"A cada 8 horas.","sec":"cirurgia/resumos/1/10/ci-abd-apendicite","w":"Abdome · Apendicite aguda · Lembrar e complicações"},{"id":"of-palp-L7","ch":"oftalmo-A1","av":"A1","q":"Como é o nódulo do calázio?","a":"Indolor, arredondado, no tarso, crônico (Meibomius).","sec":"oftalmo/resumos/1/7/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Calázio · slides 29–32"},{"id":"or-semio-L9","ch":"otorrino-A1","av":"A1","q":"O que é vertigem?","a":"Ilusão de movimento ou de automovimento.","sec":"otorrino/resumos/1/9/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Anamnese da tontura: vertigem não é tontura · slides 25–27, 46"},{"id":"urg-via-aerea-L2","ch":"urg-A1","av":"A1","q":"Quais as quatro perguntas para indicar intubação?","a":"Protege a via aérea? Oxigena? Ventila? Qual o curso esperado?","sec":"urg/resumos/5/2/urg-via-aerea","w":"Insuficiência respiratória e intubação · Quando intubar"},{"id":"2-vulvovaginites-vaginose-tr-23","ch":"gineco-A1","av":"A1","q":"Qual forma da Candida coloniza e qual causa infecção?","a":"Levedura coloniza; pseudo-hifa é a forma invasiva.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L2","ch":"obst-A1","av":"A1","q":"Gemelar anterior com 34 semanas, grávida agora. Fórmula?","a":"G2 P1 A0: gêmeos contam como um parto.","sec":"obst/resumos/2/2/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Primeira consulta: anamnese"},{"id":"ci-abd-hernias-parede-L0","ch":"cirurgia-A1","av":"A1","q":"O que continua íntegro na hérnia e se rompe na evisceração?","a":"Peritônio e pele.","sec":"cirurgia/resumos/2/0/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Hérnia não é evisceração"},{"id":"of-palp-L8","ch":"oftalmo-A1","av":"A1","q":"O que significa zóster na ponta do nariz?","a":"Sinal de Hutchinson: risco ocular; aciclovir sistêmico precoce.","sec":"oftalmo/resumos/1/8/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Herpes simples e herpes zóster oftálmico · slides 33–38"},{"id":"or-semio-L10","ch":"otorrino-A1","av":"A1","q":"O que é oscilopsia?","a":"Distorção visual com a movimentação da cabeça.","sec":"otorrino/resumos/1/10/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Desencadeantes e sintomas visuais e posturais · slides 28, 30–31"},{"id":"urg-via-aerea-L3","ch":"urg-A1","av":"A1","q":"Como confirmar a posição do tubo?","a":"Capnografia com curva (além de ausculta e expansão).","sec":"urg/resumos/5/3/urg-via-aerea","w":"Insuficiência respiratória e intubação · Sequência rápida de intubação: os 7 P"},{"id":"2-vulvovaginites-vaginose-tr-24","ch":"gineco-A1","av":"A1","q":"Cite 5 condições que perpetuam a candidíase.","a":"Antibiótico, DM, gravidez, ACO, imunossupressão, roupas justas, açúcar, álcool no tratamento, não tratar parceiro na recidiva.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L3","ch":"obst-A1","av":"A1","q":"Quais nutrientes são enfatizados no 1º trimestre?","a":"Ácido fólico e iodo.","sec":"obst/resumos/2/3/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Primeira consulta: exame físico e orientações"},{"id":"ci-abd-hernias-parede-L1","ch":"cirurgia-A1","av":"A1","q":"Qual é a diferença entre encarcerada e estrangulada?","a":"Encarcerada é irredutível sem sofrimento vascular; estrangulada tem sofrimento vascular.","sec":"cirurgia/resumos/2/1/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Números e classificação"},{"id":"of-palp-L9","ch":"oftalmo-A1","av":"A1","q":"Qual tumor benigno da lista é pré-maligno?","a":"A ceratose actínica (solar).","sec":"oftalmo/resumos/1/9/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Xantelasma e tumores benignos · slides 39–47"},{"id":"or-semio-L11","ch":"otorrino-A1","av":"A1","q":"Cite duas causas centrais de vertigem.","a":"AVC de tronco ou cerebelo e insuficiência vertebrobasilar.","sec":"otorrino/resumos/1/11/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Síndromes vertiginosas: periféricas e centrais · slides 32–33"},{"id":"urg-via-aerea-L4","ch":"urg-A1","av":"A1","q":"Qual o volume corrente inicial e por qual peso?","a":"6 a 8 mL/kg do peso predito pela altura e sexo.","sec":"urg/resumos/5/4/urg-via-aerea","w":"Insuficiência respiratória e intubação · Primeiro ajuste do ventilador"},{"id":"2-vulvovaginites-vaginose-tr-25","ch":"gineco-A1","av":"A1","q":"Como é a clínica da candidíase?","a":"Prurido que piora com calor, corrimento em leite talhado sem odor, ardor, dispareunia, disúria.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L4","ch":"obst-A1","av":"A1","q":"O que se avalia em toda consulta de seguimento?","a":"PA, peso, Leopold, altura uterina, BCF, contrações/movimentos fetais e membros inferiores.","sec":"obst/resumos/2/4/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Consultas seguintes: o que se faz em todas"},{"id":"ci-abd-hernias-parede-L2","ch":"cirurgia-A1","av":"A1","q":"Quais são as faixas de tamanho da EHS/AHS 2020?","a":"Menor que 1 cm, 1 a 4 cm e maior que 4 cm.","sec":"cirurgia/resumos/2/2/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Hérnias ventrais: tipos e tamanhos"},{"id":"of-palp-L10","ch":"oftalmo-A1","av":"A1","q":"Qual o tumor maligno mais frequente da pálpebra?","a":"Carcinoma basocelular, no idoso, na pálpebra inferior.","sec":"oftalmo/resumos/1/10/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Tumores malignos da pálpebra · slides 48–49"},{"id":"or-semio-L12","ch":"otorrino-A1","av":"A1","q":"O que define a direção do nistagmo?","a":"A componente rápida.","sec":"otorrino/resumos/1/12/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Nistagmo · slides 35–36"},{"id":"urg-trauma-L0","ch":"urg-A1","av":"A1","q":"Onde procurar sangue no paciente traumatizado em choque?","a":"No chão (externo), tórax, abdome, pelve e ossos longos.","sec":"urg/resumos/6/0/urg-trauma","w":"Trauma: atendimento inicial · Avaliação primária: XABCDE"},{"id":"2-vulvovaginites-vaginose-tr-26","ch":"gineco-A1","av":"A1","q":"Achado do KOH 10%?","a":"Pseudo-hifas.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L5","ch":"obst-A1","av":"A1","q":"O que separa hipertensão gestacional de pré-eclâmpsia?","a":"Proteinúria ≥ 300 mg/24 h ou sinais de deterioração clínica.","sec":"obst/resumos/2/5/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Pressão arterial"},{"id":"ci-abd-hernias-parede-L3","ch":"cirurgia-A1","av":"A1","q":"A partir de quantos centímetros é diástase, e por que não estrangula?","a":"Mais de 2 cm; não tem anel herniário.","sec":"cirurgia/resumos/2/3/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Diástase dos retos abdominais"},{"id":"of-palp-L11","ch":"oftalmo-A1","av":"A1","q":"Qual o caminho da lágrima até o nariz?","a":"Ponto, ampola, canalículos, saco lacrimal, ducto nasolacrimal, válvula de Hasner.","sec":"oftalmo/resumos/1/11/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Aparelho lacrimal: secreção, drenagem e a bomba · slides 50–54"},{"id":"or-semio-L13","ch":"otorrino-A1","av":"A1","q":"Head impulse normal na vertigem aguda contínua significa o quê?","a":"Sinal central: conduzir como AVC.","sec":"otorrino/resumos/1/13/or-semio","w":"Otologia · Semiologia da audição e do labirinto · HINTS: labirinto ou AVC? · slides 34, 37"},{"id":"urg-trauma-L1","ch":"urg-A1","av":"A1","q":"Onde se faz a descompressão por agulha no adulto pelo ATLS 10ª edição?","a":"No 4º ou 5º espaço intercostal, à frente da linha axilar média.","sec":"urg/resumos/6/1/urg-trauma","w":"Trauma: atendimento inicial · As lesões do B que matam em minutos"},{"id":"2-vulvovaginites-vaginose-tr-27","ch":"gineco-A1","av":"A1","q":"Tratamento da não complicada (slide)?","a":"Fluconazol 150 mg VO dose única ou azólico tópico.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L6","ch":"obst-A1","av":"A1","q":"Quanto deve ganhar uma gestante com IMC normal?","a":"11,5 a 16 kg (~0,4 kg/semana no 2º e 3º trimestres).","sec":"obst/resumos/2/6/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Peso e IMC"},{"id":"ci-abd-hernias-parede-L4","ch":"cirurgia-A1","av":"A1","q":"Que proporção das epigástricas é múltipla?","a":"20%.","sec":"cirurgia/resumos/2/4/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Hérnia epigástrica"},{"id":"of-palp-L12","ch":"oftalmo-A1","av":"A1","q":"Qual tipo de lacrimejamento piora no frio e vento e é tratado com cirurgia?","a":"A epífora obstrutiva.","sec":"oftalmo/resumos/1/12/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Lacrimejamento e epífora: causas e avaliação · slides 55–60"},{"id":"or-semio-L14","ch":"otorrino-A1","av":"A1","q":"Para que lado o paciente desvia no Fukuda?","a":"Para o lado do labirinto hipoativo (doente).","sec":"otorrino/resumos/1/14/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Reflexo vestíbulo-espinhal: Romberg e Fukuda · slides 38–39"},{"id":"urg-trauma-L2","ch":"urg-A1","av":"A1","q":"Até quando dar ácido tranexâmico no trauma?","a":"Nas primeiras 3 horas: 1 g em 10 min e 1 g em 8 h.","sec":"urg/resumos/6/2/urg-trauma","w":"Trauma: atendimento inicial · Choque hemorrágico"},{"id":"2-vulvovaginites-vaginose-tr-28","ch":"gineco-A1","av":"A1","q":"Definição e conduta na CVVR?","a":"≥ 4 episódios/ano; cultura, 14 dias de tópico e fluconazol 150 mg semanal por 6 meses.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L7","ch":"obst-A1","av":"A1","q":"AU de 30 cm com 30 semanas: é normal?","a":"Sim. De 20 a 32 semanas, AU (cm) ≈ IG (semanas).","sec":"obst/resumos/2/7/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Altura uterina"},{"id":"ci-abd-hernias-parede-L5","ch":"cirurgia-A1","av":"A1","q":"Até que idade a umbilical da criança costuma fechar sozinha?","a":"Até os 5 anos, se o anel tiver menos de 1 cm (80%).","sec":"cirurgia/resumos/2/5/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Hérnia umbilical"},{"id":"of-palp-L13","ch":"oftalmo-A1","av":"A1","q":"Qual o exame de escolha para órbita e tecidos moles?","a":"A dacriocistorressonância magnética.","sec":"oftalmo/resumos/1/13/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Exames de imagem da via lacrimal · slides 61–69"},{"id":"or-semio-L15","ch":"otorrino-A1","av":"A1","q":"Por quanto tempo o slide indica supressor vestibular?","a":"2 dias (dimenidrinato 50 mg ou meclizina 25 mg).","sec":"otorrino/resumos/1/15/or-semio","w":"Otologia · Semiologia da audição e do labirinto · Neurite vestibular · slides 40–41"},{"id":"urg-trauma-L3","ch":"urg-A1","av":"A1","q":"Qual Glasgow indica intubação?","a":"8 ou menos.","sec":"urg/resumos/6/3/urg-trauma","w":"Trauma: atendimento inicial · Glasgow e o TCE"},{"id":"2-vulvovaginites-vaginose-tr-29","ch":"gineco-A1","av":"A1","q":"Quando tratar o parceiro na candidíase?","a":"Só com balanite ou dermatite peniana.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L8","ch":"obst-A1","av":"A1","q":"O que avalia cada manobra de Leopold?","a":"1ª situação, 2ª posição (dorso), 3ª apresentação, 4ª insinuação.","sec":"obst/resumos/2/8/ob-pre1","w":"3. Pré-natal I: consultas, anamnese e exame físico · Palpação: manobras de Leopold"},{"id":"ci-abd-hernias-parede-L6","ch":"cirurgia-A1","av":"A1","q":"O que o slide marca como PROVA antes da cirurgia eletiva?","a":"Corrigir os fatores de risco antes de operar.","sec":"cirurgia/resumos/2/6/ci-abd-hernias-parede","w":"Abdome · Hérnias da parede abdominal · Tela: quando e por quê"},{"id":"of-palp-L14","ch":"oftalmo-A1","av":"A1","q":"Quando fazer a sondagem lacrimal?","a":"Entre 12 e 18 meses, sob anestesia geral; após 3 anos a chance cai.","sec":"oftalmo/resumos/1/14/of-palp","w":"Oftalmologia · Pálpebras e vias lacrimais · Obstrução lacrimal congênita · slides 70–72"},{"id":"or-semio-L16","ch":"otorrino-A1","av":"A1","q":"Qual manobra diagnostica e qual trata a VPPB?","a":"Dix-Hallpike diagnostica; Epley trata.","sec":"otorrino/resumos/1/16/or-semio","w":"Otologia · Semiologia da audição e do labirinto · VPPB: Dix-Hallpike e Epley · slides 42–45"},{"id":"urg-metabolico-L0","ch":"urg-A1","av":"A1","q":"Quais os três critérios (D, K, A) da CAD no consenso 2024?","a":"Glicemia ≥ 200 ou DM conhecido; β-hidroxibutirato ≥ 3,0 mmol/L; pH < 7,3 e/ou HCO3 < 18.","sec":"urg/resumos/7/0/urg-metabolico","w":"Emergências metabólicas · Cetoacidose diabética: diagnóstico"},{"id":"2-vulvovaginites-vaginose-tr-30","ch":"gineco-A1","av":"A1","q":"Corrimento + pH 6,5 + disúria + colo em morango: diagnóstico e conduta?","a":"Tricomoníase; metronidazol para paciente e parceiro.","sec":"gineco/resumos/1","w":"2. Vulvovaginites: vaginose, tricomoníase e candidíase"},{"id":"ob-pre1-L9","
