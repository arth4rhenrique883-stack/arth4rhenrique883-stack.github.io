2. A peridural pode ser feita em qualquer nível.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-03","ch":"cirurgia-A1","av":"A1","q":"Qual referência anatômica marca L4 e qual marca T7?","a":"A linha bicrista (cristas ilíacas) marca L4; a linha interescapular (pontas das escápulas) marca T7.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-04","ch":"cirurgia-A1","av":"A1","q":"Quais camadas a agulha atravessa na via mediana até o espaço subaracnóideo?","a":"Pele, subcutâneo, ligamento supraespinhoso, interespinhoso, ligamento amarelo e dura-máter.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-05","ch":"cirurgia-A1","av":"A1","q":"Como se confirma que a agulha de raqui está no lugar certo?","a":"Ao retirar o mandril, há fluxo livre de líquor.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-06","ch":"cirurgia-A1","av":"A1","q":"Por que a raqui causa hipotensão e quando causa bradicardia?","a":"Pelo bloqueio simpático (T1 a L2), com vasodilatação e queda da RVP; bradicardia só em bloqueio alto, de T1 a T4.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-07","ch":"cirurgia-A1","av":"A1","q":"Como se corrige a hipotensão da raqui segundo o slide?","a":"Cristaloide antes e durante, posição de Trendelenburg e vasopressores (efedrina, fenilefrina, adrenalina).","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-08","ch":"cirurgia-A1","av":"A1","q":"O que é baricidade e quais os três tipos?","a":"O \"peso\" do anestésico em relação ao líquor: hiperbárico (pesado), isobárico e hipobárico.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-09","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença entre fentanil e morfina na raqui?","a":"Fentanil melhora o bloqueio e dá analgesia segmentar de até 3 h; morfina dá analgesia não segmentar por mais de 18 h.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-10","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da cefaleia pós-punção?","a":"Hipotensão liquórica, postural, mais em mulher jovem, agulha grossa e várias tentativas; começa em 12 a 24 h.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-12","ch":"cirurgia-A1","av":"A1","q":"Qual contraindicação da raqui não aparece na lista da peridural?","a":"O aumento da pressão intracraniana.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-13","ch":"cirurgia-A1","av":"A1","q":"Como se identifica o espaço peridural e para que serve a dose-teste?","a":"Pelo sinal de Dogliotti ou perda de resistência ao passar o ligamento amarelo; a dose-teste (lidocaína 2% + adrenalina) detecta injeção em vaso ou no líquor.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-14","ch":"cirurgia-A1","av":"A1","q":"Quais as complicações próprias da peridural?","a":"Injeção IV de AL, raqui total, perfuração da dura (cefaleia), infecção/abscesso e hematoma peridural compressivo.","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"},{"id":"ci-an-neuro-16","ch":"cirurgia-A1","av":"A1","q":"Quanto tempo antes da punção se suspende a enoxaparina profilática e a terapêutica (ASRA 2018)?","a":"12 h na dose profilática e 24 h na terapêutica (pela ASRA 2018).","sec":"cirurgia/resumos/11","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos"}],"provas":[["gineco","Ginecologia"],["obst","Obstetrícia"],["cirurgia","Clínica cirúrgica"],["oftorl","Oftalmo e otorrino"],["legal","Medicina legal"],["urg","Urgência e emergência"],["ped","Pediatria 2"]],"datas":{"obst-A1":["2026-11-06","A3 com a matéria da A1"]},"soon":"A2 em curso: Medicina legal, Pediatria 2 e as aulas novas de cada disciplina entram aqui quando chegarem os slides."};</script>

 g4:["Certo. Não vou bater palma, senão você se acostuma mal.","Correto. Fiquei levemente impressionado. Levemente.","Bom. Volta em alguns dias, para eu ter certeza de que não foi sorte."],
 g5:["Fácil, é? Vou lembrar disso quando ele voltar daqui a uma semana e você travar.","Arrogância é um sintoma. Neste caso, justificada.","Rápido e certo. Se continuar assim, vou ter que arrumar outro alvo."],
 streak:["Três seguidas. Começo a suspeitar que você leu a apostila. Não conto para ninguém.","Sequência boa. Não se empolgue: o próximo cartão não sabe que você está inspirado."],

};
const CASES=[
 "Caso de 2003. Um secretário de saúde jurou que o Conselho Municipal era \"só consultivo\". Mostrei a Lei 8.142: permanente e deliberativo. Ele mudou de cor três vezes. Nenhuma delas era saudável.",
 "Num plantão de 2011, um colega escreveu a causa básica na primeira linha da Declaração de Óbito. A causa básica vai na última linha preenchida da Parte I. Hoje ele revisa declarações de óbito. Por castigo, claro.",
 "Tive uma residente que dizia: \"o paciente era meu, eu assino\". Ele tinha caído da cama da enfermaria. Morte violenta é com o IML, mesmo dentro do hospital. Ela aprendeu no dia em que o delegado ligou.",
 "Uma vez me pediram para comparar a mortalidade de uma cidade de aposentados com a de uma cidade universitária, sem padronizar. Recusei. Comparar coeficiente bruto entre populações diferentes é como comparar a febre de um bebê com a de um elefante.",
 "Em 2021 eu vi a razão de mortalidade materna passar de cem por cem mil. Aquilo não era estatística, eram mulheres. É por isso que a banca cobra esse indicador: para você nunca esquecer o que ele mede.",
 "Um gestor apresentou o aumento da prevalência como fracasso do programa. Era um remédio novo que fazia os pacientes viverem mais. Prevalência sobe quando a duração aumenta. Ele foi promovido mesmo assim. O mundo é injusto.",
 "Um aluno jurou que \"equidade\" estava escrita no art. 7º da Lei 8.080. Pedi que ele achasse. Ele procura até hoje. O texto diz igualdade.",

 "Num surto de sarampo numa creche, a enfermeira me perguntou se 40 em 200 era prevalência. Era taxa de ataque: 20%. Dois anos depois ela passou na residência e me mandou um bolo. O bolo estava ruim, mas o gesto valeu.",
 "Atendi um paciente que achava que o ambulatório de especialidades era porta de entrada do SUS. A culpa não era dele, era de quem ensinou. Porta de entrada é atenção primária, urgência, atenção psicossocial e serviço especial de acesso aberto.",
 "Minha perna dói desde antes de você nascer. Mesmo assim chego ao plantão antes de quem tem as duas boas. Disciplina é isso: ir mesmo quando dói. Revise hoje.",
 "Uma vez um interno me disse que o INAMPS acabou junto com a Lei 8.080. Acabou em 1993, pela Lei 8.689. Ele ainda me deve um café pela aposta. Juros de três décadas."
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* Estado e repetição espaçada (SM-2 adaptado) */
const DAY=86400000,NEW_PER_DAY=20,KEY="medaj-p8-cards-v1";
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/DAY)};
let S={cards:{},days:{},t:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const st=id=>S.cards[id]||{r:0,i:0,e:2.5,due:0,l:0,last:0,seen:0};
function plan(c,q){
  let {r,i,e,l}=c;
  if(q===0) return {r:0,i:0,e:Math.max(1.3,e-.2),l:l+1,again:true};
  const e2=Math.max(1.3,e+(.1-(5-q)*(.08+(5-q)*.02)));
  let i2;
  if(r===0) i2=q===5?4:1;
  else if(r===1) i2=q===3?3:q===4?6:8;
  else i2=Math.max(i+1,Math.round(i*(q===3?1.2:q===4?e2:e2*1.3)));
  return {r:r+1,i:i2,e:e2,l};
}
const fmt=p=>p.again?"agora":p.i===1?"amanhã":p.i<14?p.i+" dias":p.i<60?Math.round(p.i/7)+" sem":Math.round(p.i/30)+" meses";

let deck="all",queue=[],cur=null,shown=false,sess={n:0,ok:0,total:0,streak:0};
const inDeck=c=>deck==="all"||c.ch===deck||c.av===deck;
const isNew=c=>!S.cards[c.id];
const newToday=()=>(S.days[today()]||{}).nw||0;
function counts(filter){
  const t=today(),list=CARDS.filter(filter);
  const due=list.filter(c=>!isNew(c)&&st(c.id).due<=t).length;
  const nw=list.filter(isNew).length;
  return {due,nw,avail:due+Math.min(nw,Math.max(0,NEW_PER_DAY-newToday()))};
}
function build(){
  const t=today(),list=CARDS.filter(inDeck);
  const rev=list.filter(c=>!isNew(c)&&st(c.id).due<=t).sort((a,b)=>st(a.id).due-st(b.id).due);
  const nw=list.filter(isNew).slice(0,Math.max(0,NEW_PER_DAY-newToday()));
  queue=[];while(rev.length||nw.length){if(rev.length)queue.push(rev.shift());if(rev.length)queue.push(rev.shift());if(nw.length)queue.push(nw.shift())}
  sess={n:0,ok:0,total:queue.length,streak:0};
}

/* Tela */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function say(text,story){const b=$("bubble");b.classList.toggle("story",!!story);b.innerHTML=story?`<span class="case">Caso do Dr. Casa</span>${esc(text)}`:esc(text)}
function mood(m){const a=$("avatar");a.classList.remove("raise","smug","tap");void a.getBoundingClientRect();if(m)m.split(" ").forEach(x=>a.classList.add(x))}
function renderDecks(){
  const opts=[["all","Tudo"],...Object.entries(CHAPTERS)];
  $("decks").innerHTML=opts.map(([k,l])=>{const c=counts(x=>k==="all"||x.ch===k||x.av===k);return `<button class="chip" type="button" data-deck="${k}" aria-pressed="${deck===k}">${esc(l)}<span class="n">${c.avail}</span></button>`}).join("");
}
function renderStats(){
  const c=counts(inDeck),d=S.days[today()]||{n:0,ok:0};
  $("s-due").textContent=queue.length+(cur?1:0);
  $("s-new").textContent=c.nw;
  $("s-acc").textContent=d.n?Math.round(100*d.ok/d.n)+"%":"–";
  let s=0,t=today();if(!(S.days[t]&&S.days[t].n))t--;while(S.days[t]&&S.days[t].n){s++;t--}
  $("s-streak").textContent=s;
  $("foot-info").textContent=`${CARDS.length} cartões das apostilas do 8º período`;
}
function renderCard(){
  const el=$("card");
  if(!cur){
    if(sess.total===0){
      el.innerHTML=`<div class="done"><h2>Nada para hoje neste baralho</h2><p>Os cartões que você já estudou voltam na data certa. Cartões novos entram ${NEW_PER_DAY} por dia.</p><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(SAY.empty));
    }else{
      const acc=sess.n?Math.round(100*sess.ok/sess.n):0,tm=counts(inDeck);
      el.innerHTML=`<div class="done"><span class="meta">${esc(deck==="all"?"Tudo":CHAPTERS[deck])}</span><h2>Plantão encerrado</h2><div class="sum"><div><b>${sess.n}</b><span>respostas</span></div><div><b>${acc}%</b><span>de acerto</span></div><div><b>${tm.nw}</b><span>cartões novos ainda na fila</span></div></div><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(acc>=70?SAY.done:SAY.doneBad));mood(acc>=70?"smug":"raise");
    }
    renderStats();return;
  }
  const s=st(cur.id),fresh=isNew(cur),pos=sess.total-queue.length;
  const pct=sess.total?Math.round(100*(pos-1)/sess.total):0;
  let html=`<div class="meta"><span class="tag">${esc(CHAPTERS[cur.ch])}</span>${fresh?'<span class="tag new">novo</span>':""}<span class="pos">${pos} de ${sess.total}</span></div><div class="progress"><i style="width:${pct}%"></i></div><p class="q">${esc(cur.q)}</p>`;
  if(!shown){
    html+=`<div class="spacer"></div><button class="reveal" type="button" data-act="reveal">Mostrar resposta<kbd>espaço</kbd></button>`;
  }else{
    const g=[[0,"Errei"],[3,"Difícil"],[4,"Bom"],[5,"Fácil"]];
    html+=`<div class="ans"><span class="lbl">Resposta</span><p>${esc(cur.a)}</p><a class="read" href="${APOSTILA}#${cur.sec}">Ler na apostila: ${esc(cur.w||"")} ↗</a></div><div class="spacer"></div><div class="grades">${g.map(([q,l],k)=>`<button class="grade g${q}" type="button" data-q="${q}"><b>${l}</b><small>${fmt(plan(s,q))} · ${k+1}</small></button>`).join("")}</div>`;
  }
  el.innerHTML=html;renderStats();
}
function next(){cur=queue.shift()||null;shown=false;renderCard();if(cur&&sess.n>0&&Math.random()<.5)say(pick(SAY.ask));}
function grade(q){
  if(!cur||!shown)return;
  const p=plan(st(cur.id),q),t=today(),was=isNew(cur);
  S.cards[cur.id]={r:p.r,i:p.i,e:+p.e.toFixed(2),due:p.again?t:t+p.i,l:p.l,last:Date.now(),seen:(st(cur.id).seen||0)+1};
  const d=S.days[t]||(S.days[t]={n:0,ok:0,nw:0});d.n++;if(q>=3)d.ok++;if(was)d.nw=(d.nw||0)+1;
  sess.n++;if(q>=3){sess.ok++;sess.streak++}else sess.streak=0;
  if(p.again){queue.splice(Math.min(3,queue.length),0,cur);sess.total++}
  if(sess.streak===3||sess.streak===7){say(pick(SAY.streak));mood("smug tap")}
  else{say(pick(SAY["g"+q]));mood(q===0?"raise tap":q===5?"raise":"smug")}
  save();next();renderDecks();
}

/* Salvar: aparelho sempre; conta (claude.ai) quando disponível */
let remote=null,busy=Promise.resolve(),timer=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(timer);timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));busy=busy.then(()=>remote.set(body)).catch(()=>{$("sync").textContent="Não deu para salvar na conta agora. O progresso ficou neste aparelho."})},800)}
}
function merge(o){
  if(!o||!o.cards)return;
  for(const [id,c] of Object.entries(o.cards)){const m=S.cards[id];if(!m||(c.last||0)>(m.last||0))S.cards[id]=c}
  for(const [d,v] of Object.entries(o.days||{})){const m=S.days[d];if(!m||v.n>m.n)S.days[d]=v}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    remote=db.doc("data/users/"+uid+"/drcasa");
    const snap=await remote.get();
    if(snap.exists){merge(snap.data());try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(Object.keys(S.cards).length)save();
    $("sync").textContent="Progresso salvo na sua conta: aparece no celular e no computador.";
    if(!cur||!shown){build();next()}
    renderDecks();
  }catch(e){}
})();

/* Eventos */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-deck],[data-act],[data-q]");if(!b)return;
  if(b.dataset.deck){deck=b.dataset.deck;build();next();renderDecks();say(pick(SAY.hello));return}
  if(b.dataset.act==="reveal"){shown=true;renderCard();say(pick(SAY.reveal));return}
  if(b.dataset.act==="ahead"){const t=today();const pool=CARDS.filter(inDeck).filter(c=>!isNew(c)&&st(c.id).due>t).sort((a,b)=>st(a.id).due-st(b.id).due);const nw=CARDS.filter(inDeck).filter(isNew);queue=pool.concat(nw).slice(0,10);sess={n:0,ok:0,total:queue.length,streak:0};if(!queue.length){say("Não sobrou nada para adiantar. Você zerou o baralho. Vá ler o próximo capítulo.");return}next();say("Adiantando. Ambição é bom, desde que venha acompanhada de sono.");return}
  if(b.dataset.q!==undefined)grade(+b.dataset.q);
});
$("b-case").addEventListener("click",()=>{say(pick(CASES),true);mood("tap")});
$("b-hint").addEventListener("click",()=>{if(!cur){say("Dica: abra a apostila. É onde moram as respostas. Revolucionário, eu sei.");return}say(`Dica: está na seção "${cur.w}" do ${CHAPTERS[cur.ch]}. A resposta eu não dou. Sofrer um pouco também ensina.`);mood("raise")});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if((e.key===" "||e.key==="Enter")&&cur&&!shown&&!e.target.closest("button,a")){e.preventDefault();shown=true;renderCard();say(pick(SAY.reveal));return}
  if(shown&&["1","2","3","4"].includes(e.key)){grade([0,3,4,5][+e.key-1])}
});
$("b-reset").addEventListener("click",()=>{
  const slot=$("reset-slot");
  slot.innerHTML=`<span class="confirm">Apagar todo o progresso? <button class="danger" type="button" id="r-yes">Apagar</button><button type="button" id="r-no">Cancelar</button></span>`;
  $("r-no").onclick=()=>location.reload();
  $("r-yes").onclick=()=>{S={cards:{},days:{},t:Date.now()};save();location.reload()};
});

/* Tema: escuro por padrão */

build();renderDecks();next();say(pick(SAY.hello));
</script>

<script>
/* período: Hoje + Apostilas + Flashcards (gerado por build-periodos.py) */
const e_=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"],pad=n=>String(n).padStart(2,"0");
const br=d=>DIAS[d.getDay()]+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
const LKEY="medaj-"+PER.id+"-lidas",DKEY="medaj-"+PER.id+"-provas";
let LIDAS={},DATAS={};try{LIDAS=JSON.parse(localStorage.getItem(LKEY)||"{}")}catch(e){}
try{DATAS=Object.assign({},PER.datas,JSON.parse(localStorage.getItem(DKEY)||"{}"))}catch(e){DATAS=Object.assign({},PER.datas)}
const site=u=>PER.site+"#"+u;
/* link "Ler na apostila" de cada cartão: página certa do site do período */
const _rc=renderCard;renderCard=function(){_rc();const a=document.querySelector("#card .ans .read");if(a&&cur){a.href=site(cur.sec);a.textContent="Ler na apostila: "+cur.w+" ↗"}};
function proxima(){const t=new Date();t.setHours(0,0,0,0);let best=null;
  for(const [id,nome] of PER.provas)for(const av of ["A1","A2"]){const v=DATAS[id+"-"+av];const d=v&&new Date((Array.isArray(v)?v[0]:v)+"T12:00:00");
    if(d&&d>=t&&(!best||d<best.d))best={d,id,nome,av,obs:Array.isArray(v)?v[1]:""}}return best}
function renderHoje(){
  const el=document.getElementById("v-hoje"),now=new Date(),p=proxima();
  let h=`<div class="today"><span class="when">${br(now)}</span>`;
  if(p){const n=Math.round((p.d-new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))/864e5);
    h+=`<h2>${e_(p.nome)} · ${p.obs?e_(p.obs):p.av}</h2><span class="when">${n===0?"a prova é hoje":n===1?"amanhã":"faltam "+n+" dias"} · ${br(p.d)}</span>`}
  else h+=`<h2>Nenhuma prova marcada</h2>${PER.provas.length?`<span class="when">marque as datas lá embaixo</span>`:""}`;
  h+=`</div>`;
  const nx=(p&&PER.aulas.find(a=>!LIDAS[a.id]&&a.pv===p.id&&a.av===p.av))||PER.aulas.find(a=>!LIDAS[a.id]);
  if(!PER.aulas.length)h+=`<div class="go off"><b>Apostilas</b><span>${e_(PER.soon)}</span></div>`;
  else h+=nx?`<a class="go" href="${e_(site(nx.u))}"><b>Continuar · ${e_(nx.disc)} · ${nx.av}</b><span>${e_(nx.t)}</span></a>`:`<div class="go off"><b>Apostilas</b><span>Todas marcadas como lidas.</span></div>`;
  const c=counts(()=>true);
  h+=`<a class="ghost" href="#cards" style="text-decoration:none;text-align:center">Revisar flashcards · ${c.avail} para hoje</a>`;
  if(PER.provas.length)h+=`<h2 class="vh">Datas de prova</h2><div class="week">${PER.provas.map(([id,nome])=>`<div><b>${e_(nome)}</b><span class="start">${["A1","A2"].map(av=>{const v=DATAS[id+"-"+av];return `<label>${av} <input type="date" data-prova="${id}-${av}" value="${e_(Array.isArray(v)?v[0]:v||"")}"></label>`}).join("")}</span></div>`).join("")}</div>`;
  el.innerHTML=h;
}
document.addEventListener("change",ev=>{const i=ev.target.closest("[data-prova]");if(!i)return;
  const k=i.dataset.prova;if(i.value)DATAS[k]=i.value;else DATAS[k]="";try{localStorage.setItem(DKEY,JSON.stringify(DATAS))}catch(e){}renderHoje()});
const AKEY="medaj-"+PER.id+"-av";let ABERTA={};
document.addEventListener("toggle",ev=>{const d=ev.target;if(d.matches&&d.matches("details.mat"))ABERTA[d.dataset.mat]=d.open},true);
let AV=(()=>{let v=null;try{v=localStorage.getItem(AKEY)}catch(e){}return v||(PER.aulas.some(a=>a.av==="A2")?"A2":"A1")})();
function renderApostilas(){
  const el=document.getElementById("v-apostilas");
  if(!PER.grade.length){el.innerHTML=`<p class="soon">${e_(PER.soon)}</p>`;return}
  let h=`<div class="deckbar avbar">${["A1","A2"].map(av=>`<button class="chip" type="button" data-av="${av}" aria-pressed="${AV===av}">${av}<span class="n">${PER.aulas.filter(a=>a.av===av).length}</span></button>`).join("")}</div>`;
  const item=a=>`<div class="bwrap"><a class="bitem" href="${e_(site(a.u))}"><b>${e_(a.t)}</b>${a.s?`<span>${e_(a.s)}</span>`:""}</a><div class="bfoot"><button class="lida" type="button" data-lida="${e_(a.id)}" aria-pressed="false">Marcar como lida</button>${a.refs?`<a class="lida refs" href="${e_(site(a.refs))}">Artigos ↗</a>`:""}</div></div>`;
  for(const [mat,subs] of PER.grade){
    const n=PER.aulas.filter(a=>a.mat===mat&&a.av===AV).length,lid=PER.aulas.filter(a=>a.mat===mat&&a.av===AV&&LIDAS[a.id]).length;
    h+=`<details class="mat"${ABERTA[mat]?" open":""} data-mat="${e_(mat)}"><summary><b>${e_(mat)}</b><span>${n?`${lid} de ${n} lidas`:"em breve"}</span></summary>`;
    for(const [sub] of subs){const L=PER.aulas.filter(a=>a.mat===mat&&a.sub===sub&&a.av===AV);
      if(sub)h+=`<span class="disc">${e_(sub)}</span>`;
      h+=L.length?`<div class="blist">${L.map(item).join("")}</div>`:`<p class="soon">Em breve</p>`}
    h+=`</details>`}
  el.innerHTML=h;renderLidas();
}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-av]");if(!b)return;AV=b.dataset.av;try{localStorage.setItem(AKEY,AV)}catch(e){}renderApostilas()});
function renderLidas(){document.querySelectorAll("[data-lida]").forEach(b=>{const on=!!LIDAS[b.dataset.lida];b.setAttribute("aria-pressed",on);b.textContent=on?"Lida":"Marcar como lida"})}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-lida]");if(!b)return;const k=b.dataset.lida;if(LIDAS[k])delete LIDAS[k];else LIDAS[k]=Date.now();try{localStorage.setItem(LKEY,JSON.stringify(LIDAS))}catch(e){}renderLidas()});
renderApostilas();
function view(){
  let h=location.hash.slice(1)||"hoje",v=h.startsWith("cards")?"cards":h;
  if(!["hoje","apostilas","cards"].includes(v))v="hoje";
  document.querySelectorAll(".view").forEach(x=>x.hidden=x.id!=="v-"+v);
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(v==="hoje")renderHoje();
  if(v==="cards"){const d=h.slice(6);const b=document.querySelector(`[data-deck="${d||"all"}"]`);if(b&&b.getAttribute("aria-pressed")!=="true")b.click()}
  window.scrollTo(0,0);
}
addEventListener("hashchange",view);view();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
