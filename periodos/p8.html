l"},{"id":"ci-an-locais-L5","ch":"cirurgia-A1","av":"A1","q":"Qual fibra é bloqueada primeiro e qual função some por último?","a":"Simpáticas (B) primeiro; propriocepção profunda por último.","sec":"cirurgia/resumos/10/5/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Tipos de fibra e a sequência do bloqueio · slides 12–14"},{"id":"or-rino-12","ch":"otorrino-A1","av":"A1","q":"Qual queixa nasal é sinal de alerta para complicação infecciosa dos seios?","a":"Edema da face.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-06","ch":"gineco-A1","av":"A1","q":"Puérpera com febre, dor e abaulamento mamário: conduta?","a":"Compressa fria e esvaziamento da mama; manter a amamentação.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-diag-15","ch":"obst-A1","av":"A1","q":"Movimento fetal: quando é presunção e quando é certeza?","a":"Percebido pela mãe (16-20 sem): presunção. Percebido pelo médico (18-20 sem): certeza.","sec":"obst/resumos/1","w":"2. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-an-locais-L6","ch":"cirurgia-A1","av":"A1","q":"O que determina potência, latência e duração?","a":"Lipossolubilidade, pKa e ligação proteica, respectivamente.","sec":"cirurgia/resumos/10/6/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Propriedades físico-químicas: potência, latência e duração · slides 15–16"},{"id":"or-rino-13","ch":"otorrino-A1","av":"A1","q":"Como a ARIA classifica a rinite alérgica?","a":"Frequência: intermitente ou persistente. Gravidade: leve ou moderada/grave.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-07","ch":"gineco-A1","av":"A1","q":"Diabética com abscesso mamário: conduta?","a":"Antibiótico (cefalexina/amoxicilina/clindamicina), drenagem do abscesso e controle do diabetes.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-diag-16","ch":"obst-A1","av":"A1","q":"O que é o sinal de Hartman e por que ele atrapalha o cálculo da IG?","a":"Sangramento de nidação, pequeno e escuro, de 3 a 5 dias; pode ser tomado por menstruação e falsear a DUM.","sec":"obst/resumos/1","w":"2. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-an-locais-L7","ch":"cirurgia-A1","av":"A1","q":"Como se chama a anestesia venosa regional?","a":"Anestesia de Bier.","sec":"cirurgia/resumos/10/7/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Vias de administração · slide 17"},{"id":"or-rino-14","ch":"otorrino-A1","av":"A1","q":"Quais os critérios diagnósticos e os sinais de exame da rinite alérgica?","a":"Diagnóstico clínico com início precoce (5 a 20 anos), IgE específica positiva (sangue ou pele) e citologia com eosinófilos; olheiras alérgicas, prega periorbitária, prega nasal transversa (saudação alérgica) e respiração bucal.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-08","ch":"gineco-A1","av":"A1","q":"Mastite do tabagista: onde ocorre e o que pode exigir?","a":"Seios lactíferos (subareolar recidivante); pode exigir amputação de papila.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-diag-17","ch":"obst-A1","av":"A1","q":"Defina hiperêmese gravídica.","a":"Vômitos persistentes com perda de peso, desidratação e distúrbio eletrolítico.","sec":"obst/resumos/1","w":"2. Diagnóstico de gravidez e idade gestacional"},{"id":"ci-an-locais-L8","ch":"cirurgia-A1","av":"A1","q":"Qual bloqueio absorve mais e qual absorve menos?","a":"Intercostal absorve mais; subcutâneo, menos (depois da via IV e traqueal).","sec":"cirurgia/resumos/10/8/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Absorção sistêmica: onde injetou importa · slides 18–19, 22"},{"id":"or-rino-15","ch":"otorrino-A1","av":"A1","q":"O que diferencia a rinite não alérgica da alérgica?","a":"Não é mediada por IgE (IgE total e específica negativas), começa mais tarde e tem mais neutrófilos na citologia.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-09","ch":"gineco-A1","av":"A1","q":"Compressa quente trata abscesso mamário?","a":"Não; é preciso drenar.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-01","ch":"obst-A1","av":"A1","q":"Quais são as três origens das modificações maternas?","a":"Hormonal, mecânica (compressão pelo útero) e fetal (demanda crescente de O₂ e nutrientes).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L9","ch":"cirurgia-A1","av":"A1","q":"Onde a adrenalina é proibida?","a":"Circulação terminal: dedo, pênis, ponta do nariz e orelha.","sec":"cirurgia/resumos/10/9/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Adjuvantes: bicarbonato e adrenalina · slides 20–21, 23"},{"id":"or-rino-16","ch":"otorrino-A1","av":"A1","q":"Quais alterações faciais a respiração bucal crônica causa na criança?","a":"Face alongada, mandíbula retrognata, palato ogival e más oclusões dentárias.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-10","ch":"gineco-A1","av":"A1","q":"Prurido mamilar unilateral aos 50 anos: conduta?","a":"Corticoide tópico 30 dias; sem melhora, biópsia (Paget).","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-02","ch":"obst-A1","av":"A1","q":"Em uma frase, o que o estriol e a progesterona fazem (slide 6)?","a":"Estriol (anotação \"contração\"): volume sanguíneo, contratilidade do miocárdio, ductos mamários, miométrio, ligamentos pélvicos. Progesterona (anotação \"relaxamento\"): endométrio receptivo, miorrelaxante, alvéolos mamários, aumenta a ventilação.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L10","ch":"cirurgia-A1","av":"A1","q":"Quantos mg/mL tem a lidocaína 2%?","a":"20 mg/mL (porcentagem × 10).","sec":"cirurgia/resumos/10/10/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Apresentações comerciais e a conta de mg/mL · slides 24, 26–27"},{"id":"or-rino-17","ch":"otorrino-A1","av":"A1","q":"Na tabela da aula, em quais rinites o anticolinérgico é +++?","a":"Infecciosas, do idoso e gustativa.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-11","ch":"gineco-A1","av":"A1","q":"BI-RADS 3: características e conduta (slide)?","a":"Margens circunscritas, eixo paralelo à pele; controle semestral.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-03","ch":"obst-A1","av":"A1","q":"Por que a anemia da gestação é dita \"fisiológica\"?","a":"O plasma aumenta 40–50% e a massa eritrocitária 20–30%: hemodiluição, com ↓ de hematócrito e viscosidade. Serve de preparo para a perda do parto.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L11","ch":"cirurgia-A1","av":"A1","q":"Dose máxima de lidocaína sem e com adrenalina?","a":"5 mg/kg sem e 7 mg/kg com.","sec":"cirurgia/resumos/10/11/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Doses máximas · slides 25, 28"},{"id":"or-sinus-01","ch":"otorrino-A1","av":"A1","q":"O que é rinossinusite e por que o termo substituiu \"sinusite\"?","a":"Inflamação da mucosa do nariz e dos seios paranasais; a mucosa é contínua pelos óstios, então a inflamação raramente fica num só sítio.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-12","ch":"gineco-A1","av":"A1","q":"Diferencie PAAF, core e mamotomia.","a":"PAAF: células soltas. Core: fragmento tecidual. Mamotomia: tecido e microcalcificações.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-04","ch":"obst-A1","av":"A1","q":"Por que a PA cai na gestação, se o débito cardíaco aumenta?","a":"PA = RVP × DC. A RVP cai (hormônios, placenta como fístula AV) mais do que o DC sobe. A queda exige boa implantação placentária; se a RVP sobe, pode haver pré-eclâmpsia.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L12","ch":"cirurgia-A1","av":"A1","q":"Cite dois cuidados contra a intoxicação.","a":"Respeitar a dose máxima e aspirar antes de injetar.","sec":"cirurgia/resumos/10/12/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Toxicidade: o que eleva o nível plasmático · slide 29"},{"id":"or-sinus-02","ch":"otorrino-A1","av":"A1","q":"Até quando a rinossinusite é aguda pela ABR e pelo EPOS, e como a AAO-HNSF divide?","a":"Aguda até 12 semanas (crônica 12 ou mais). AAO-HNSF: aguda até 4 semanas, subaguda de 4 a 12, crônica 12 ou mais.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-13","ch":"gineco-A1","av":"A1","q":"PAAF que não aspira nada sugere?","a":"Nódulo sólido.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-05","ch":"obst-A1","av":"A1","q":"Quais valores de hemoglobina a anotação no slide 20 usa para ferro profilático e terapêutico?","a":"Hb > 11: ferro profilático; Hb < 11: suplementar ferro terapêutico; Hb < 8: patológico (corte anotado pela aluna; pela OMS, anemia grave é Hb < 7).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L13","ch":"cirurgia-A1","av":"A1","q":"Qual o primeiro sinal e qual o último?","a":"Formigamento de língua e lábios; depressão cardiovascular.","sec":"cirurgia/resumos/10/13/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Sintomas da sobredose: a escada da lidocaína · slides 30–31"},{"id":"or-sinus-03","ch":"otorrino-A1","av":"A1","q":"Quais são os critérios clínicos de RSA?","a":"Dois ou mais sintomas por até 12 semanas: obstrução/congestão nasal, rinorreia anterior ou posterior, dor/pressão facial, redução do olfato (tosse em criança).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-14","ch":"gineco-A1","av":"A1","q":"Sítios de metástase do câncer de mama?","a":"Osso, fígado, pulmão e cérebro.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-06","ch":"obst-A1","av":"A1","q":"Como fica o equilíbrio ácido-base na gestação?","a":"Hiperventilação (↑ volume corrente, ↓ volume residual) → ↓ PCO₂ → alcalose respiratória compensada (HCO₃ 26 → 22 mmol/L). É fisiológico.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L14","ch":"cirurgia-A1","av":"A1","q":"Por que oxigenar e ventilar?","a":"Elevam o limiar convulsivo e evitam a acidose.","sec":"cirurgia/resumos/10/14/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Tratamento: respiração e circulação · slides 32–33"},{"id":"or-sinus-04","ch":"otorrino-A1","av":"A1","q":"Como evolui a RSA viral?","a":"Pico em 2 a 3 dias e melhora gradual, resolvendo até 7 a 10 dias (normalmente até 14).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-15","ch":"gineco-A1","av":"A1","q":"Cite os 4 subtipos moleculares.","a":"Luminal A, luminal B, HER2 e triplo negativo.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-07","ch":"obst-A1","av":"A1","q":"Cite as alterações da coagulação no slide 23 e o risco de TEV.","a":"↑↑↑ fatores VII e VIII, fibrinogênio ↑ 20 a 200%, ↓↓ proteínas S e C. TEV 4–5× na gestação e 20× no puerpério. Tríade de Virchow: hipercoagulabilidade, estase venosa e lesão endotelial.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-locais-L15","ch":"cirurgia-A1","av":"A1","q":"Qual a dose de emulsão lipídica 20%?","a":"Bolus de 1,5 mL/kg, depois 0,25 mL/kg/min.","sec":"cirurgia/resumos/10/15/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Emulsão lipídica e o protocolo de LAST · slides 34–35"},{"id":"or-sinus-05","ch":"otorrino-A1","av":"A1","q":"O que é a RSA viral prolongada?","a":"Sintomas intensos nos 2 a 3 primeiros dias e melhora mais lenta, por 3 a 4 semanas ou mais, sem piora e sem sinais bacterianos (no EPOS, pós-viral).","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"8-mastologia-16","ch":"gineco-A1","av":"A1","q":"Suspeita de prótese rota: exame? E seroma tardio?","a":"RNM sem contraste; linfoma anaplásico de grandes células.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mod-08","ch":"obst-A1","av":"A1","q":"O que acontece com o metabolismo da glicose no 1º trimestre e depois?","a":"1º tri anabólico (estriol, ↑ insulina, hipoglicemia de jejum, glicogênio); 2º e 3º tri catabólico, com lactogênio placentário gerando resistência à insulina, hiperglicemia pós-prandial e hiperinsulinemia compensatória. Falha da compensação: DMG.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L0","ch":"cirurgia-A1","av":"A1","q":"Entre quais estruturas fica o espaço peridural?","a":"Entre a dura-máter e o ligamento amarelo (a raqui vai no subaracnóideo, entre pia e aracnoide).","sec":"cirurgia/resumos/11/0/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Coluna e meninges: onde a agulha para · slides 2–4"},{"id":"or-sinus-06","ch":"otorrino-A1","av":"A1","q":"Quais os dois padrões que definem a RSA bacteriana no Quadro 2.1?","a":"Dupla piora após melhora dos primeiros 5 dias, ou manutenção do quadro intenso sem melhora após 14 dias.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-01","ch":"gineco-A1","av":"A1","q":"Gestante com corrimento fino, odor de peixe e clue cells: tratamento do slide?","a":"Metronidazol 250 mg VO 8/8 h por 7 dias.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-09","ch":"obst-A1","av":"A1","q":"Qual o valor normal de proteinúria de 24 h e o que significa acima disso?","a":"Até 300 mg/24 h é normal. A anotação do slide associa \"> 300\" a DMG, mas ≥ 300 mg/24 h com hipertensão é critério de pré-eclâmpsia (ou doença renal).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L1","ch":"cirurgia-A1","av":"A1","q":"Até onde vai a medula e onde se faz a raqui?","a":"A medula vai até L2; a raqui é feita abaixo de L2.","sec":"cirurgia/resumos/11/1/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Medula, cauda equina e líquor · slides 5–6"},{"id":"or-sinus-07","ch":"otorrino-A1","av":"A1","q":"Quais os 5 sinais de RSA bacteriana e quantos são necessários?","a":"Pelo menos 3: secreção amarelada unilateral, dor local intensa unilateral, febre acima de 38 °C, PCR/VHS aumentados, dupla piora.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-02","ch":"gineco-A1","av":"A1","q":"Corrimento espumoso + colo em morango: quem tratar?","a":"Paciente e parceiro (metronidazol).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-10","ch":"obst-A1","av":"A1","q":"Qual a faixa de creatinina da gestante e quanto sobe a TFG?","a":"Creatinina de 0,7–1,2 cai para 0,5–0,9 mg/dL; ureia e creatinina ↓ 25%. TFG e depuração ↑ 30–50% (slide 30: 50%); fluxo plasmático renal ↑ 25% (slide).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L2","ch":"cirurgia-A1","av":"A1","q":"De quais segmentos sai o simpático?","a":"De T1 a L2 (toracolombar).","sec":"cirurgia/resumos/11/2/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Dermátomos e o sistema simpático · slides 7–8"},{"id":"or-sinus-08","ch":"otorrino-A1","av":"A1","q":"Quantos adultos e crianças com RSAV evoluem para bacteriana?","a":"0,5 a 2% dos adultos e 5 a 13% das crianças.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-03","ch":"gineco-A1","av":"A1","q":"5 episódios de candidíase em 1 ano: conduta?","a":"Cultura, tópico 14 dias e fluconazol 150 mg semanal por 6 meses.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-11","ch":"obst-A1","av":"A1","q":"Por que a hidronefrose é mais comum à direita?","a":"Atonia (progesterona) + compressão pelo útero aumentado e dextrorrotado. Ocorre em 80%, é fisiológica, mas aumenta o risco de cólica nefrética e ITU.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L3","ch":"cirurgia-A1","av":"A1","q":"Que vértebra a linha bicrista marca?","a":"O corpo de L4.","sec":"cirurgia/resumos/11/3/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raquianestesia: preparo e posição · slides 9–13"},{"id":"or-sinus-09","ch":"otorrino-A1","av":"A1","q":"Defina RSA recorrente e diga o que a separa da crônica.","a":"4 ou mais episódios de RSAB por ano; o que a separa da crônica é a normalidade comprovada entre as crises.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-04","ch":"gineco-A1","av":"A1","q":"Abscesso tubovariano íntegro: Monif e conduta?","a":"Monif 3; internar, observar 48 h, cirurgia se não melhorar.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-12","ch":"obst-A1","av":"A1","q":"O que a progesterona faz no trato digestivo?","a":"Atonia: esvaziamento gástrico lento, pirose (relaxamento do esfíncter), constipação, edema gengival, eructações, flatulência, cálculo biliar e ↓ da secreção ácida (↓ úlcera péptica).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L4","ch":"cirurgia-A1","av":"A1","q":"O que confirma a agulha de raqui no lugar?","a":"Fluxo livre de líquor ao retirar o mandril.","sec":"cirurgia/resumos/11/4/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raquianestesia: a técnica da punção · slides 14–20"},{"id":"or-sinus-10","ch":"otorrino-A1","av":"A1","q":"Quando pedir exame de imagem na RSA?","a":"Só na suspeita de complicação ou de diagnóstico alternativo; caso típico e não grave não pede exame.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-05","ch":"gineco-A1","av":"A1","q":"DNA-HPV positivo para HPV 18: conduta?","a":"Colposcopia.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-13","ch":"obst-A1","av":"A1","q":"Por que o útero pode se romper no fim da gestação?","a":"Estiramento das fibras: a espessura da parede diminui (chega a 1,5 cm), por hipertrofia com produção limitada de novos miócitos.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L5","ch":"cirurgia-A1","av":"A1","q":"Que ponta de agulha causa menos cefaleia pós-punção?","a":"A ponta de lápis (Whitacre, Sprotte), e quanto mais fina melhor.","sec":"cirurgia/resumos/11/5/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · As agulhas de raqui · slide 21"},{"id":"or-sinus-11","ch":"otorrino-A1","av":"A1","q":"Qual a conduta com antibiótico na RSAV, na RSAVP e na RSAB moderada?","a":"Contra antibiótico na RSAV e RSAVP; na RSAB moderada, espera cuidadosa com antibiótico só se não melhorar ou piorar em 48 a 72 h.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-06","ch":"gineco-A1","av":"A1","q":"Tumor de colo de 5 cm restrito ao colo: estádio e tratamento?","a":"IB3; radioterapia + quimioterapia.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-14","ch":"obst-A1","av":"A1","q":"Qual a diferença entre sopro sistólico e diastólico na gestação?","a":"Sistólico (90%) é fisiológico (anemia dilucional + rotação do coração). Diastólico (20% no slide) deve ser investigado.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L6","ch":"cirurgia-A1","av":"A1","q":"Quando a raqui causa bradicardia?","a":"Só no bloqueio alto, que pega T1 a T4.","sec":"cirurgia/resumos/11/6/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Efeitos do bloqueio espinhal · slide 22"},{"id":"or-sinus-12","ch":"otorrino-A1","av":"A1","q":"Qual o antibiótico de escolha no adulto e as doses?","a":"Amoxicilina 500 mg 8/8 h ou 875 mg 12/12 h, 7 a 10 dias; amoxicilina + clavulanato 500/125 mg 8/8 h ou 875/125 mg 12/12 h se betalactamase.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-07","ch":"gineco-A1","av":"A1","q":"Tratada por quimiorradiação de colo, amenorreia: FSH esperado?","a":"Alto (> 25 em duas dosagens) — insuficiência ovariana, compartimento II.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-15","ch":"obst-A1","av":"A1","q":"O que são os sinais de Hegar, Piskacek e Nobile-Budin e de Jacquemier e Kluge?","a":"Hegar, Piskacek e Nobile-Budin (slides 15-16) são sinais do útero. Jacquemier é a hiperemia da vulva e Kluge a mucosa vaginal arroxeada (slide 17).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L7","ch":"cirurgia-A1","av":"A1","q":"Quanto dura a analgesia da morfina na raqui?","a":"Mais de 18 h, não segmentar (o fentanil, até 3 h, segmentar).","sec":"cirurgia/resumos/11/7/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Drogas da raqui: anestésicos, baricidade e adjuvantes · slides 23–24"},{"id":"or-sinus-13","ch":"otorrino-A1","av":"A1","q":"Qual a dose de amoxicilina na criança?","a":"25 a 50 mg/kg/dia; 90 mg/kg/dia se suspeita de pneumococo resistente, 8/8 h ou 12/12 h, 7 a 10 dias.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-08","ch":"gineco-A1","av":"A1","q":"Teste da progesterona positivo: diagnóstico?","a":"Anovulação crônica (ex.: SOP).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-16","ch":"obst-A1","av":"A1","q":"O que a anotação no slide 17 orienta sobre o corrimento da gestante?","a":"O corrimento aumentado pode parecer \"bolsa rota\", mas não pode ter prurido nem cheiro: infecção vaginal pode levar a parto prematuro. pH vaginal ácido 3,5–6.","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L8","ch":"cirurgia-A1","av":"A1","q":"Quando se indica o blood patch?","a":"Nas formas graves e incapacitantes; as leves a moderadas, tratamento conservador.","sec":"cirurgia/resumos/11/8/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Cefaleia pós-punção e o blood patch · slides 25–26"},{"id":"or-sinus-14","ch":"otorrino-A1","av":"A1","q":"Quando usar corticoide sistêmico na RSA?","a":"Nunca IM de depósito; oral só na RSAB com dor intensa refratária a 48 a 72 h de tratamento, pelo menor tempo.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-09","ch":"gineco-A1","av":"A1","q":"FSH e LH baixos, estradiol baixo, PRL normal: compartimento?","a":"III ou IV (central).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-mod-17","ch":"obst-A1","av":"A1","q":"Quais são os números de diafragma, tórax e osteoarticular do slide?","a":"Diafragma sobe 4 cm; tórax +2 cm (transverso) e +6 cm (circunferência); ligamentos pélvicos até 1,2 cm de mobilidade (embebição gravídica).","sec":"obst/resumos/2","w":"3. Modificações do organismo materno"},{"id":"ci-an-neuro-L9","ch":"cirurgia-A1","av":"A1","q":"Qual contraindicação é só da raqui?","a":"Aumento da pressão intracraniana.","sec":"cirurgia/resumos/11/9/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Outras complicações e contraindicações da raqui · slides 27–28"},{"id":"or-sinus-15","ch":"otorrino-A1","av":"A1","q":"Por que as complicações orbitárias acontecem e qual a frequência das complicações?","a":"Por fluxo venoso retrógrado num sistema avalvular; são raras, 2 a 5 casos por milhão.","sec":"otorrino/resumos/4","w":"Rinologia · Rinossinusites agudas"},{"id":"revisao-final-misturada-10","ch":"gineco-A1","av":"A1","q":"Pico de LH em relação à ovulação?","a":"~36 h antes.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-01","ch":"obst-A1","av":"A1","q":"Qual o calendário de consultas do pré-natal de risco habitual?","a":"Mínimo 6 consultas no slide (Rede Alyne 2024: 7; OMS: 8 contatos); 1ª até 12 semanas; mensais até 28; quinzenais de 28 a 36; semanais de 36 a 41.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L10","ch":"cirurgia-A1","av":"A1","q":"Que referência marca T7?","a":"A linha interescapular (pontas das escápulas).","sec":"cirurgia/resumos/11/10/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: preparo, níveis e agulha · slides 29–35"},{"id":"revisao-final-misturada-11","ch":"gineco-A1","av":"A1","q":"Mioma com crescimento após a menopausa: o que fazer?","a":"Tratamento invasivo — suspeita de malignidade.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-02","ch":"obst-A1","av":"A1","q":"Como se define e se escreve a fórmula obstétrica?","a":"G = número de gestações (incluindo a atual); P = partos com mais de 20 semanas (gemelar conta 1); A = perdas antes de 20 semanas. Ex.: G3P1A1.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L11","ch":"cirurgia-A1","av":"A1","q":"Com o que se faz a dose-teste da peridural?","a":"Lidocaína 2% com adrenalina.","sec":"cirurgia/resumos/11/11/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: achar o espaço, dose-teste e cateter · slides 36–39"},{"id":"revisao-final-misturada-12","ch":"gineco-A1","av":"A1","q":"Degeneração mais comum do mioma?","a":"Hialina.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-03","ch":"obst-A1","av":"A1","q":"Como se calcula a DPP pela regra de Näegele?","a":"DUM + 7 dias e + 9 meses (equivale a −3 meses e +1 ano para DUM de abril a dezembro). Ex.: DUM 20/05/18 → DPP 27/02/19.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L12","ch":"cirurgia-A1","av":"A1","q":"O que é a raqui total?","a":"Injeção inadvertida da dose de peridural no espaço subaracnóideo.","sec":"cirurgia/resumos/11/12/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Peridural: drogas, complicações e contraindicações · slides 40–42"},{"id":"revisao-final-misturada-13","ch":"gineco-A1","av":"A1","q":"Descarga sanguinolenta unilateral: conduta?","a":"Encaminhar ao mastologista para biópsia (papiloma provável).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-04","ch":"obst-A1","av":"A1","q":"Quais as faixas de semanas de cada trimestre no slide 12?","a":"1º: 0 a 13; 2º: 14 a 27; 3º: 28 a 42 semanas.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L13","ch":"cirurgia-A1","av":"A1","q":"No bloqueio combinado, qual técnica é a base?","a":"A raquianestesia; a peridural é complementar.","sec":"cirurgia/resumos/11/13/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Raqui × peridural e o bloqueio combinado · slide 43"},{"id":"revisao-final-misturada-14","ch":"gineco-A1","av":"A1","q":"BI-RADS 3: conduta?","a":"Controle semestral.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-05","ch":"obst-A1","av":"A1","q":"O que fazer se o BCF não é audível com sonar após 12 semanas?","a":"Afastar obesidade e dificuldade de achar o dorso; se persistir, USG ou referência a serviço de maior complexidade.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L14","ch":"cirurgia-A1","av":"A1","q":"De quais raízes nasce o plexo braquial?","a":"De C5 a T1.","sec":"cirurgia/resumos/11/14/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios periféricos: equipamento e anatomia · slides 44–50"},{"id":"revisao-final-misturada-15","ch":"gineco-A1","av":"A1","q":"Mastite puerperal: suspender amamentação?","a":"Não.","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-06","ch":"obst-A1","av":"A1","q":"Qual o critério de hipertensão na gestação?","a":"PAS ≥ 140 e/ou PAD ≥ 90 mmHg, em duas medidas com intervalo de 4 horas.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L15","ch":"cirurgia-A1","av":"A1","q":"No supraclavicular, ao lado de qual vaso fica o plexo?","a":"Da artéria subclávia, sobre a primeira costela.","sec":"cirurgia/resumos/11/15/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios do pescoço e do membro superior · slides 51–61"},{"id":"revisao-final-misturada-16","ch":"gineco-A1","av":"A1","q":"Fator que NÃO é de risco para câncer de colo: multiparidade ou menarca precoce?","a":"Menarca precoce (multiparidade é fator de risco).","sec":"gineco/resumos/8","w":"Revisão final misturada"},{"id":"ob-pre1-07","ch":"obst-A1","av":"A1","q":"Diferencie hipertensão crônica, gestacional, pré-eclâmpsia e pré-eclâmpsia sobreposta.","a":"Crônica: antes da gravidez ou de 20 semanas. Gestacional: após 20 semanas, sem proteinúria nem deterioração, some após o parto. Pré-eclâmpsia: após 20 semanas com proteinúria (> 300 mg/24 h) e/ou deterioração clínica. Sobreposta: piora da hipertensão, proteinúria ou deterioração clínica após 20 semanas em quem já tinha hipertensão.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L16","ch":"cirurgia-A1","av":"A1","q":"O que o ciático poplíteo não anestesia abaixo do joelho?","a":"A face medial da perna e do pé (território do safeno).","sec":"cirurgia/resumos/11/16/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios do membro inferior · slides 62–69"},{"id":"ob-pre1-08","ch":"obst-A1","av":"A1","q":"Qual o ganho de peso recomendado para uma gestante com IMC pré-gestacional normal?","a":"11,5 a 16 kg no total, cerca de 0,4 kg por semana no 2º e 3º trimestres.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-neuro-L17","ch":"cirurgia-A1","av":"A1","q":"Em que plano vai o anestésico no TAP?","a":"Entre o oblíquo interno e o transverso do abdome.","sec":"cirurgia/resumos/11/17/ci-an-neuro","w":"Anestesiologia · Raquianestesia, peridural e bloqueios periféricos · Bloqueios da parede abdominal · slides 70–75"},{"id":"ob-pre1-09","ch":"obst-A1","av":"A1","q":"Qual a relação entre altura uterina e idade gestacional?","a":"12 sem na sínfise; 16 entre sínfise e umbigo; 20 no umbigo; de 20 a 32 sem, AU ≈ IG (1 cm/sem); após 32, 0,5 cm/sem.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-abd-agudo-01","ch":"cirurgia-A1","av":"A1","q":"Defina abdome agudo.","a":"Afecção não traumática, que acomete de modo súbito as vísceras abdominais, perdura por mais de 6 horas e requer decisão urgente, em geral operação nas próximas 6 a 12 horas.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre1-10","ch":"obst-A1","av":"A1","q":"Cite causas de AU maior e menor que a IG.","a":"Maior: polidrâmnio, gemelar, macrossomia, mola, erro de data. Menor: oligoâmnio, CIUR, erro de data, tabagismo, óbito fetal.","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-abd-agudo-02","ch":"cirurgia-A1","av":"A1","q":"Quais são as 5 síndromes do abdome agudo e um exemplo de cada?","a":"Perfurativa (úlcera duodenal perfurada), inflamatória (apendicite aguda), oclusiva ou obstrutiva (obstrução por aderência), hemorrágica (prenhez tubária rota) e vascular (trombose da artéria mesentérica superior).","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre1-12","ch":"obst-A1","av":"A1","q":"A partir de quando o BCF é audível e qual a faixa normal?","a":"Sonar Doppler a partir de 12 semanas; Pinard a partir de 18 semanas. Normal 110-160 bpm (anotação no slide: 120-160).","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-abd-agudo-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o exame de eleição de cada síndrome, segundo a prova antiga?","a":"Inflamatória: USG ou TC. Obstrutiva: RX simples ou TC. Perfurativa: RX simples ou TC. Hemorrágica: beta-hCG e USG. Vascular: angio-TC.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre1-13","ch":"obst-A1","av":"A1","q":"O que significa aceleração do BCF após movimento fetal?","a":"Boa vitalidade fetal (feto reativo).","sec":"obst/resumos/3","w":"4. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-abd-agudo-04","ch":"cirurgia-A1","av":"A1","q":"Diferencie dor visceral de dor parietal.","a":"Visceral: sistema nervoso autônomo, estímulo por distensão, inflamação ou isquemia, início gradual, mal localizada na linha média. Parietal: nervo cerebroespinal de T6 a L1, localiza o quadrante, com sinais de irritação peritoneal.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-01","ch":"obst-A1","av":"A1","q":"Quais os exames da rotina do 1º trimestre?","a":"Hemograma, ABO/Rh (Coombs indireto se Rh −), glicemia de jejum, anti-HIV, VDRL, HTLV, HBsAg/anti-HBs, toxoplasmose IgG e IgM, EAS e urocultura; anti-HCV; eletroforese de Hb em pardas e negras; Papanicolau se indicado.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-05","ch":"cirurgia-A1","av":"A1","q":"Quais são os sinais comemorativos do abdome agudo cirúrgico, e quando se diz Blumberg?","a":"Dor, defesa, contratura e descompressão dolorosa. Blumberg é a descompressão dolorosa no quadrante inferior direito.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-02","ch":"obst-A1","av":"A1","q":"Como interpretar a glicemia de jejum na 1ª consulta?","a":"< 92 normal (TOTG com 24–28 sem); 92–125 DMG; ≥ 126 diabetes prévio.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-06","ch":"cirurgia-A1","av":"A1","q":"Cite 5 causas não operatórias de abdome agudo.","a":"Por exemplo: IAM, pneumonia, cetoacidose diabética, crise falciforme e porfiria; também embolia pulmonar, pericardite, herpes-zóster, crise addisoniana, intoxicação por chumbo e abstinência de narcóticos.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-03","ch":"obst-A1","av":"A1","q":"Quais os valores de corte do TOTG 75 g?","a":"Jejum ≥ 92, 1 h ≥ 180, 2 h ≥ 153 mg/dL. Um valor alterado já é DMG.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-07","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência de exames na mulher com dor abdominal aguda?","a":"Beta-hCG, EAS, PCR e USG de abdome. Se não grávida, TC; se grávida, USG e ressonância. Se nada concluir, laparoscopia.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-04","ch":"obst-A1","av":"A1","q":"Qual a conduta na gestante Rh negativo?","a":"Se parceiro Rh + ou desconhecido: Coombs indireto. Negativo: repetir mensalmente a partir de 20 sem e fazer imunoglobulina anti-D com 28 semanas e até 72 h pós-parto (RN Rh +). Positivo: alto risco.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-08","ch":"cirurgia-A1","av":"A1","q":"Quais são as recomendações que pesam para indicar a laparoscopia no abdome agudo?","a":"Estabilidade hemodinâmica (instável: ressuscitar primeiro) e ausência de grande distensão abdominal (muita distensão: laparotomia); pesam também distúrbios da coagulação e cirurgias abdominais prévias. O compromisso é com o paciente, não com o método.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-05","ch":"obst-A1","av":"A1","q":"Qual a diferença entre teste treponêmico e não treponêmico na sífilis?","a":"Treponêmico (FTA-Abs, teste rápido) é específico mas fica positivo para sempre, não serve para seguimento. Não treponêmico (VDRL) é quantitativo e serve para seguimento (deve cair 2 titulações em 3 meses).","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-09","ch":"cirurgia-A1","av":"A1","q":"Quais são os 4 objetivos do tratamento da síndrome perfurativa?","a":"Medidas clínicas de ressuscitação, eliminar a causa da contaminação, reduzir o inóculo bacteriano e impedir a sepse persistente.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-06","ch":"obst-A1","av":"A1","q":"Qual o tratamento da sífilis na gestante por estágio?","a":"Recente (primária, secundária, latente recente): benzatina 2,4 milhões UI dose única. Tardia, terciária ou ignorada: 2,4 milhões semanal × 3 (7,2 milhões). Neurossífilis: cristalina 18–24 milhões UI/dia IV por 14 dias. Alérgica: dessensibilizar. Tratar o parceiro.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-10","ch":"cirurgia-A1","av":"A1","q":"Por que a úlcera perfurada não vomita e a pancreatite vomita?","a":"Na perfuração o estômago esvazia na cavidade. Na pancreatite há gastroparesia, o estômago fica cheio e ainda estimula a secreção pancreática: dor com vômito.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-07","ch":"obst-A1","av":"A1","q":"Como a carga viral define a via de parto no HIV?","a":"CV > 1.000 ou desconhecida: cesárea eletiva com 38 sem + AZT EV 3 h antes. 50–999: via obstétrica + AZT EV. < 50: via obstétrica, sem AZT. Não amamentar (cabergolina); RN com AZT por 4 semanas.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-11","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar no RX a alça de delgado da alça de cólon?","a":"Delgado: válvulas coniventes (Kerckring) que atravessam a alça inteira, no centro, em empilhamento de moedas. Cólon: haustrações que não atravessam a alça, na periferia.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-08","ch":"obst-A1","av":"A1","q":"Interprete IgG + / IgM + para toxoplasmose com 9 semanas.","a":"Infecção aguda ou IgM residual: iniciar espiramicina e pedir avidez de IgG. Alta avidez = infecção antiga (> 4 meses), conduta expectante.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-12","ch":"cirurgia-A1","av":"A1","q":"Quais são os preditores radiológicos de obstrução do delgado?","a":"Dois ou mais níveis hidroaéreos, níveis com 2,5 cm ou mais e diferença de altura maior que 5 mm entre níveis no mesmo segmento de alça.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-09","ch":"obst-A1","av":"A1","q":"Qual o esquema de tratamento da toxoplasmose antes e depois de 16 semanas?","a":"Até 16 sem: espiramicina 1 g 8/8 h. Após 16 sem ou feto infectado (PCR + no líquido amniótico): sulfadiazina + pirimetamina + ácido folínico.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-13","ch":"cirurgia-A1","av":"A1","q":"O que significa o colar de pérolas com ausência de ar no reto e no ceco?","a":"Obstrução completa: inversão total do padrão de gases. Oclusão grave ou completa é cirúrgica.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-10","ch":"obst-A1","av":"A1","q":"Quando se faz profilaxia de ITU na gestação?","a":"Após 2 episódios de bacteriúria assintomática ou cistite, após internação por pielonefrite, ou ITU de repetição prévia. 1 cp à noite (cefalexina, nitrofurantoína ou amoxicilina-clavulanato) até o fim da gestação.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-14","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento inicial da obstrução de delgado por aderência?","a":"Sonda nasogástrica para desobstrução gástrica, correção dos distúrbios hidroeletrolíticos, antiemético e TC.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-11","ch":"obst-A1","av":"A1","q":"Quando rastrear GBS e quem recebe profilaxia sem rastreio?","a":"Swab vaginal e retal com 35–37 sem (ACOG: 36–37s6d). Sem rastreio: bacteriúria GBS atual ou filho anterior com GBS. Também: swab +, ou sem rastreio com TPP, febre intraparto ou bolsa rota > 18 h.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-15","ch":"cirurgia-A1","av":"A1","q":"Por que o cólon rompe no ceco na obstrução em 2 pontos?","a":"Com a papila ileocecal competente a alça fica fechada; o ceco tem o maior diâmetro do cólon e por isso sofre a maior tensão na parede.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-12","ch":"obst-A1","av":"A1","q":"Quais os suplementos de rotina e doses?","a":"Ácido fólico 400 mcg/dia (4–5 mg se alto risco); ferro elementar 40 mg/dia (terapêutico 120–240 mg se Hb 8–11); cálcio 1 g/dia a partir de 12 sem, longe do ferro.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-16","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco de ruptura do aneurisma de aorta?","a":"Diâmetro maior que 5 cm, morfologia do aneurisma, hipertensão arterial e DPOC. Metade não chega ao hospital.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-13","ch":"obst-A1","av":"A1","q":"Quais vacinas são recomendadas na gestação?","a":"Influenza, COVID-19, dTpa após 20 sem (toda gestação), hepatite B se suscetível, VSR 28–36 sem. Vírus vivo não.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-17","ch":"cirurgia-A1","av":"A1","q":"Quem é o doente da síndrome vascular e como é o quadro?","a":"Cardiopata com fibrilação atrial, aterosclerose, trombose prévia, trombofilia ou sepse grave. Dor intensa de rápida instalação, desproporcional ao exame no início, depois reação peritoneal difusa e íleo adinâmico difuso.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-14","ch":"obst-A1","av":"A1","q":"Cite 5 drogas categoria X.","a":"Talidomida, isotretinoína, warfarina, metotrexato, sinvastatina.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-agudo-18","ch":"cirurgia-A1","av":"A1","q":"Segundo o gabarito da prova antiga, quais são as medidas comuns no tratamento da obstrução intestinal?","a":"Descompressão nasogástrica por cateter, reposição hidroeletrolítica com dieta zero e cobertura antimicrobiana.","sec":"cirurgia/resumos/0","w":"Abdome · Abdome agudo"},{"id":"ob-pre2-15","ch":"obst-A1","av":"A1","q":"Quais os marcadores do USG do 1º trimestre para trissomia do 21?","a":"TN aumentada (80% × 5%), osso nasal ausente, ducto venoso anormal e regurgitação tricúspide; detecção 90% com 5% de falso positivo.","sec":"obst/resumos/4","w":"5. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-abd-apendicite-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a incidência, a faixa etária e a mortalidade da apendicite?","a":"Incidência de 7%, entre 10 e 30 anos (75% antes dos 40). Mortalidade de 0,5% sem perfuração e 2,5% perfurada, maior em lactentes e idosos.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-01","ch":"obst-A1","av":"A1","q":"Defina atitude, situação, posição e apresentação.","a":"Atitude: relação das partes fetais entre si (flexão generalizada). Situação: maior eixo fetal × maior eixo uterino (longitudinal, transversa, oblíqua). Posição: dorso fetal × lado materno (direita/esquerda; na transversa, anterior/posterior). Apresentação: polo fetal que ocupa o estreito superior (cefálica, pélvica, córmica).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-02","ch":"cirurgia-A1","av":"A1","q":"Qual é a causa da obstrução apendicular na criança e no adulto?","a":"Na criança, hiperplasia linfoide. No adulto, fecalito.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-02","ch":"obst-A1","av":"A1","q":"Qual o diâmetro da cabeça fletida e por que a flexão é vantajosa?","a":"Suboccipitobregmático, 9,5 cm, o menor diâmetro da cabeça; a flexão substitui o occipitofrontal (12 cm) por ele.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-03","ch":"cirurgia-A1","av":"A1","q":"Descreva a sequência da fisiopatologia da apendicite.","a":"Obstrução em alça fechada, multiplicação bacteriana e disória (mucosa secreta), distensão intraluminal, comprometimento do retorno venoso, obstrução arterial, necrose e perfuração. Depois, bloqueio pelo omento (abscesso) ou peritonite difusa.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-03","ch":"obst-A1","av":"A1","q":"Quais os diâmetros e pontos de referência das deflexões de 1º, 2º e 3º graus?","a":"1º grau, bregma: occipitofrontal 12 cm, referência bregma. 2º grau, fronte: occipitomentoniano 13,5 cm, referência glabela (raiz do nariz). 3º grau, face: submentobregmático 9,5 cm, referência mento.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-04","ch":"cirurgia-A1","av":"A1","q":"Por que a dor da apendicite começa no epigástrio e migra para a fossa ilíaca direita?","a":"Na 1ª fase a distensão do apêndice gera dor visceral, autonômica, mal localizada na linha média. Na 2ª fase a inflamação atinge a serosa e o peritônio parietal, de inervação somática, e a dor localiza na FID.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-04","ch":"obst-A1","av":"A1","q":"Cite os diâmetros do crânio fetal do slide 5 com as medidas.","a":"Biparietal 9,5; bitemporal 7,5; suboccipitofrontal 10,5; occipitofrontal 12; suboccipitobregmático 9,5; occipitomentoniano 13; submentobregmático 9,5 (cm).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-05","ch":"cirurgia-A1","av":"A1","q":"Quais sinais podem faltar na apendicite?","a":"Psoas, obturador, Rovsing, vômitos, febre, leucocitose e bastonetose.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-05","ch":"obst-A1","av":"A1","q":"Diferencie assinclitismo anterior e posterior.","a":"Anterior: parietal anterior, sutura sagital mais perto do sacro. Posterior: parietal posterior, sutura sagital mais perto do púbis. Sinclitismo: sutura equidistante, no meio. (Nägele e Litzmann são complemento.)","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-06","ch":"cirurgia-A1","av":"A1","q":"Por que não dar antibiótico antes de decidir pela cirurgia na suspeita de apendicite?","a":"Porque mascara o quadro: dá falsa sensação de melhora e o doente volta depois, já com necrose ou perfuração.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-06","ch":"obst-A1","av":"A1","q":"O que é o plano 0 de DeLee e a que plano de Hodge corresponde?","a":"A linha biespinha esquiática (espinhas isquiáticas), avaliada pelo toque; corresponde ao III plano de Hodge.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-07","ch":"cirurgia-A1","av":"A1","q":"Como interpretar o EAS com piócitos na suspeita de apendicite?","a":"Mais de 20 piócitos pode ser tratado como infecção urinária; menos de 20 pode ser piúria da própria apendicite. O EAS tem 30% de falso-positivo.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-08","ch":"obst-A1","av":"A1","q":"Qual o símbolo e o ponto de referência de cada apresentação?","a":"O lambda (fletida), B bregma, N glabela (raiz do nariz, fronte), M mento (face), S crista sacrococcígea (pélvica), A acrômio (córmica).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-08","ch":"cirurgia-A1","av":"A1","q":"Qual é o critério de apendicite na USG e quais são as vantagens da TC?","a":"Diâmetro apendicular maior que 6 mm. A TC é o padrão-ouro (exceto na gestante), melhor nos atípicos, nos obesos e para abscesso e perfuração, com sensibilidade de 96% e especificidade de 97%.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-09","ch":"obst-A1","av":"A1","q":"Defina as três conjugatas e a relação entre elas.","a":"Vera anatômica: borda superior da sínfise ao promontório, 11 cm. Vera obstétrica: face interna da sínfise ao promontório, ~10,5 cm (a que importa). Diagonal: borda inferior do púbis ao promontório, 12 cm. Obstétrica = diagonal menos 1,5 cm.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-10","ch":"cirurgia-A1","av":"A1","q":"Cite os graus da classificação da WSES para apendicite.","a":"0 normal, 1 inflamado, 2 necrose, 3 tumor inflamatório (flegmão, abscesso menor ou maior que 4 cm) e 4 perfurado com peritonite difusa.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-10","ch":"obst-A1","av":"A1","q":"Qual o menor diâmetro da pelve?","a":"O biespinha ciática (transverso do estreito médio), 10 cm; o diâmetro cefálico do bebê é menor que 10 cm.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-11","ch":"cirurgia-A1","av":"A1","q":"Qual é a principal complicação da apendicectomia aberta e da laparoscópica?","a":"Na aberta, infecção do sítio cirúrgico superficial. Na laparoscópica, infecção do sítio cirúrgico intra-abdominal (abscesso).","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-11","ch":"obst-A1","av":"A1","q":"Cite os tipos de pelve, as porcentagens e qual é a mais favorável.","a":"Ginecoide (50%, arredondada, favorável), androide (20%, triangular ou em coração, distócia), antropoide (25%, maior diâmetro anteroposterior), platipeloide (5%, achatada no sentido anteroposterior).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-apendicite-12","ch":"cirurgia-A1","av":"A1","q":"O que é hérnia de Amyand?","a":"Apêndice dentro do saco de uma hérnia inguinal.","sec":"cirurgia/resumos/1","w":"Abdome · Apendicite aguda"},{"id":"ob-mec-12","ch":"obst-A1","av":"A1","q":"Cite os tempos principais do mecanismo de parto e os acessórios.","a":"Insinuação (flexão), descida (rotação interna), desprendimento (deflexão), restituição (livramento dos ombros).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-hernias-parede-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a diferença entre hérnia e evisceração?","a":"Na hérnia peritônio e pele estão íntegros (há saco). Na evisceração há rompimento total de todos os componentes da parede.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-mec-13","ch":"obst-A1","av":"A1","q":"Por que ocorre a rotação interna?","a":"Complemento: leva a sutura sagital ao diâmetro anteroposterior do estreito inferior, o maior da saída; o occipital vai para o púbis (OP).","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-hernias-parede-02","ch":"cirurgia-A1","av":"A1","q":"Diferencie hérnia redutível, encarcerada e estrangulada.","a":"Redutível volta à cavidade. Encarcerada é irredutível (aguda ou crônica) sem sofrimento vascular. Estrangulada é irredutível com sofrimento vascular: dor intensa, hiperemia, necrose.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-mec-14","ch":"obst-A1","av":"A1","q":"Qual o ponto de apoio (hipomóclio) no desprendimento da cabeça fletida?","a":"Complemento: a região suboccipital apoiada sob a sínfise púbica; a cabeça sai por deflexão.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-hernias-parede-03","ch":"cirurgia-A1","av":"A1","q":"Quais são as faixas de tamanho das hérnias ventrais pela EHS/AHS 2020?","a":"Menor que 1 cm, de 1 a 4 cm e maior que 4 cm.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-mec-15","ch":"obst-A1","av":"A1","q":"Cite as cinco conclusões do professor.","a":"A mecânica depende da estática fetal; o polo cefálico é a maior estrutura fetal; o maior obstáculo é o estreito médio (plano 0 de DeLee); a não adaptação feto-trajeto impossibilita o parto vaginal; o feto tem papel passivo.","sec":"obst/resumos/5","w":"6. Mecanismo de parto"},{"id":"ci-abd-hernias-parede-04","ch":"cirurgia-A1","av":"A1","q":"Onde fica a hérnia de Spiegel?","a":"Entre a linha semilunar e a linha arqueada, lateral ao músculo reto.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-01","ch":"obst-A1","av":"A1","q":"Quais são os quatro períodos clínicos do parto e onde cada um começa e termina?","a":"1º dilatação: início do trabalho de parto ativo até 10 cm. 2º expulsivo: 10 cm até a saída do concepto. 3º dequitação: saída do concepto até a saída da placenta. 4º Greenberg: 1ª hora após o parto.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-05","ch":"cirurgia-A1","av":"A1","q":"O que define diástase dos retos e por que ela não é hérnia?","a":"Separação dos retos maior que 2 cm. A aponeurose está íntegra e não há anel, então não encarcera nem estrangula; mas 45% têm hérnia associada.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-02","ch":"obst-A1","av":"A1","q":"Como diferenciar fase latente de fase ativa?","a":"Latente: contrações fracas/moderadas, regulares ou não, sem dilatação do colo (~8 h). Ativa: 2 contrações em 10 min, regulares, com esvaecimento e dilatação, a partir de 4 cm (slide; ACOG 6 cm, OMS 5 cm).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-06","ch":"cirurgia-A1","av":"A1","q":"Qual é o tratamento da diástase dos retos?","a":"Perda de peso e atividade física para aumentar o tônus abdominal; cirurgia em casos selecionados.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-04","ch":"obst-A1","av":"A1","q":"Qual a velocidade esperada de dilatação na fase ativa e a duração do 1º período?","a":"Primigestas 1 cm/h (0,8–1 com analgesia); multíparas 1,2–1,5 cm/h (1–1,2 com analgesia). Duração de 4 a 6 h (até 12–24 h).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-07","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia epigástrica?","a":"1,6 a 3,6% das hérnias, 2 a 3 vezes mais no homem, 20% múltiplas, 40 a 50% assintomáticas, dor desproporcional, estrangulamento raro, 5 a 10% de recidiva.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-05","ch":"obst-A1","av":"A1","q":"Como difere o apagamento na primípara e na multípara?","a":"Primípara: apaga primeiro, depois dilata e desce. Multípara: apaga e dilata ao mesmo tempo, depois desce.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-08","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia umbilical no adulto e na criança?","a":"Adulto: 3 vezes mais na mulher, 70% entre a 4ª e a 6ª década, estrangula pouco (5%) mas com mortalidade mais de 15 vezes maior. Criança: 80% fecham até os 5 anos se o anel tem menos de 1 cm.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-06","ch":"obst-A1","av":"A1","q":"Como a dor sem tratamento atrapalha o parto?","a":"Dor, adrenalina, perda do tríplice gradiente (distócia funcional) e taquissistolia, menos relaxamento, menos oxigenação e sofrimento fetal.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-09","ch":"cirurgia-A1","av":"A1","q":"Quando se indica tela na hérnia ventral?","a":"Defeito maior que 4 cm, ou de 1 a 4 cm com fator de risco (trabalho braçal, tosse crônica, gestação planejada, incisional, corticoide, má cicatrização, ascite, colágeno, diástase).","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-07","ch":"obst-A1","av":"A1","q":"Quais condutas são recomendadas e quais são proscritas no 1º período?","a":"Recomendadas: deambulação, dieta leve, alívio não farmacológico, analgesia a pedido, BCF 30/30 min (sonar) ou CTG contínua no alto risco. Verdes no slide: analgesia, amniotomia, ocitocina. Vermelhos: tricotomia, enteroclisma.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-10","ch":"cirurgia-A1","av":"A1","q":"O que deve ser feito antes da cirurgia eletiva de hérnia?","a":"Corrigir os fatores de risco: perder peso, controlar o diabetes, tratar constipação e ascite, parar de fumar.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-08","ch":"obst-A1","av":"A1","q":"Qual a duração máxima do expulsivo segundo o slide e com que frequência se ausculta o BCF?","a":"Até 2 h em primíparas e 1 h em multíparas, +1 h com analgesia. Contrações de 5 em 10 min e BCF de 5 em 5 minutos.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-11","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores predisponentes da hérnia incisional?","a":"Tensão, infecção do sítio cirúrgico, má cicatrização (DM, desnutrição), aumento da pressão intra-abdominal (DPOC, obesidade), idade, tabagismo, cirurgia de emergência, reoperações e falhas técnicas.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-10","ch":"obst-A1","av":"A1","q":"O que é a manobra de Kristeller e por que não fazer?","a":"Pressão no fundo uterino durante o expulsivo; está em vermelho no slide. Sem benefício e com risco de ruptura uterina, lesão perineal grave e trauma fetal.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-12","ch":"cirurgia-A1","av":"A1","q":"Qual é a incidência e a recidiva da hérnia incisional?","a":"Incidência de 10 a 15% das laparotomias; recidiva de 25 a 43%; estrangulamento em 17%.","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-11","ch":"obst-A1","av":"A1","q":"Qual o tempo de clampeamento do cordão e por quê?","a":"1 a 3 minutos ou até parar de pulsar; o clampeamento tardio reduz a anemia infantil (slide 30).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-parede-14","ch":"cirurgia-A1","av":"A1","q":"Qual posição de tela está associada à recidiva?","a":"Inlay (tela só nas bordas do defeito).","sec":"cirurgia/resumos/2","w":"Abdome · Hérnias da parede abdominal"},{"id":"ob-parto-12","ch":"obst-A1","av":"A1","q":"Quais os passos do manejo ativo do 3º período?","a":"Ocitocina (10 UI IM no parto normal), clampeamento do cordão em 1–3 min, tração controlada do cordão e massagem uterina/avaliação do tônus.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-01","ch":"cirurgia-A1","av":"A1","q":"Qual é a proporção das hérnias inguinais e a relação entre os sexos?","a":"75% de todas as hérnias, 9 a 12 vezes mais no homem. Risco ao longo da vida de 27 a 43% no homem e 3 a 6% na mulher.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ob-parto-13","ch":"obst-A1","av":"A1","q":"O que é a manobra de Jacobs?","a":"Girar a placenta durante a expulsão para que as membranas se enrolem e não fiquem restos.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-02","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar hérnia direta de indireta pela anatomia?","a":"A indireta sai lateral aos vasos epigástricos inferiores, pelo anel inguinal interno e canal. A direta sai medial a eles, pelo trígono de Hesselbach.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ob-parto-15","ch":"obst-A1","av":"A1","q":"O que é o globo de segurança de Pinard?","a":"O útero firmemente contraído após a dequitação (contração uterina fixa), que garante a hemostasia por miotamponagem (ligaduras vivas).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-03","ch":"cirurgia-A1","av":"A1","q":"Quais são as características da hérnia femoral?","a":"4% das inguinais, 4 vezes mais na mulher, estrangula 10 vezes mais.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ob-parto-16","ch":"obst-A1","av":"A1","q":"Como se usa o índice de Bishop?","a":"Soma plano de De Lee, dilatação, apagamento, consistência e posição do colo. Bishop 6: induzir a contração com ocitocina em BIC (5 UI em 500 mL de SF 0,9%).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-04","ch":"cirurgia-A1","av":"A1","q":"Quais são os picos de incidência da hérnia inguinal?","a":"De 0 a 5 anos e de 75 a 80 anos.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ob-parto-17","ch":"obst-A1","av":"A1","q":"Quais as contraindicações do misoprostol na indução?","a":"Hepatopatia, presença de contrações e cicatriz uterina prévia (slide 43).","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-05","ch":"cirurgia-A1","av":"A1","q":"Cite os fatores de risco de hérnia inguinal.","a":"História familiar, hérnia contralateral prévia, sexo masculino, idade avançada, deficiência de colágeno, IMC baixo e prostatectomia (4 vezes).","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ob-parto-18","ch":"obst-A1","av":"A1","q":"Diferencie fase ativa prolongada de parada secundária da dilatação.","a":"Prolongada: dilatação lenta (< 1 cm/h), cruza a linha de alerta, por contração ineficiente; corrige-se com ocitocina e medidas. Parada secundária: dilatação igual em 2 toques com 2 h de intervalo apesar de boa dinâmica, por desproporção; cesárea.","sec":"obst/resumos/6","w":"7. Assistência ao parto"},{"id":"ci-abd-hernias-inguinais-06","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar medial e lateral no exame físico?","a":"Medial: redução fácil, ovalada, bilateral, acima de 30 anos. Lateral: redução mais difícil, tubular, desce para a bolsa escrotal. Manobra de Landivar (dedo fletido) oblitera o anel interno.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-07","ch":"cirurgia-A1","av":"A1","q":"Quando pedir exame de imagem na hérnia inguinal e qual é o padrão-ouro?","a":"Só quando o exame clínico é duvidoso (obeso, por exemplo). USG primeiro (USG + clínica = 95%); padrão-ouro é a RM dinâmica.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-08","ch":"cirurgia-A1","av":"A1","q":"Descreva a classificação de Nyhus.","a":"I: indireta com anel interno normal. II: indireta com anel alargado. III: defeito da parede posterior (A direta, B indireta, C femoral). IV: recidivada.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-09","ch":"cirurgia-A1","av":"A1","q":"O que significam S1, S2 e S3 na EHS 2023?","a":"Extensão da hérnia inguinoescrotal: até a raiz da coxa, até o meio da coxa e até o joelho.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-10","ch":"cirurgia-A1","av":"A1","q":"Quando a hérnia inguinal assintomática deve ser operada?","a":"Na mulher e na criança. No homem assintomático a conduta expectante é segura, mas mais de 2/3 ficam sintomáticos.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-12","ch":"cirurgia-A1","av":"A1","q":"O que é inguinodinia e quais são seus fatores de risco?","a":"Dor crônica por mais de 3 meses após a correção (2 a 11%). Fatores: dor intensa no pré e pós-operatório, sexo feminino, via anterior, paciente jovem, recidiva.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-13","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de recidiva da hérnia inguinal?","a":"Técnica incorreta, sexo feminino (orifício femoral não tratado), colágeno, hérnia por deslizamento, obesidade, hérnia medial e cirurgião de baixo volume.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-14","ch":"cirurgia-A1","av":"A1","q":"Qual técnica usa tela por via anterior e quais são as laparoscópicas?","a":"Lichtenstein por via anterior; TEP e TAPP laparoscópicas. Shouldice e Bassini são sem tela.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-abd-hernias-inguinais-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta na hérnia inguinal sintomática, em cirurgia eletiva?","a":"Herniorrafia com tela: técnica de Lichtenstein (via anterior) ou laparoscópica (TEP ou TAPP). Caiu numa fechada.","sec":"cirurgia/resumos/3","w":"Abdome · Hérnias inguinais"},{"id":"ci-torax-01","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome de Pancoast?","a":"Tumor do sulco superior que comprime o simpático em T1 e T2: dor e parestesia no braço, com anidrose da face, miose, enoftalmia e ptose (Horner).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-02","ch":"cirurgia-A1","av":"A1","q":"Em que incidência se avalia a área cardíaca no RX?","a":"Só em PA, e com o RX bem inspirado.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-03","ch":"cirurgia-A1","av":"A1","q":"O que sugere fratura dos três primeiros arcos costais?","a":"Lesão vascular.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-04","ch":"cirurgia-A1","av":"A1","q":"Para que lado vai o mediastino na atelectasia?","a":"Para o lado da lesão, com diminuição dos espaços intercostais.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-05","ch":"cirurgia-A1","av":"A1","q":"O que é o sinal da maçã mordida?","a":"No esofagograma, a estenose irregular do câncer de esôfago, com dilatação a montante.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-06","ch":"cirurgia-A1","av":"A1","q":"Para que serve a cintilografia pulmonar de perfusão na cirurgia torácica?","a":"Mostra quanto sangue vai para cada pulmão e, com a espirometria, estima a função depois da ressecção.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-07","ch":"cirurgia-A1","av":"A1","q":"Quantos segmentos e quanto da função tem cada pulmão?","a":"Direito: 10 segmentos, 55%. Esquerdo: 8 segmentos, 45%.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-08","ch":"cirurgia-A1","av":"A1","q":"O que faz a videomediastinoscopia?","a":"Retira linfonodos do mediastino para anatomopatológico (estadiamento).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-09","ch":"cirurgia-A1","av":"A1","q":"Para que serve a agulha de Cope?","a":"Biópsia pleural.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-10","ch":"cirurgia-A1","av":"A1","q":"Quais são os três compartimentos do mediastino e o que pensar em cada um?","a":"Anterior: os 4 T. Médio: cistos (broncogênico, pericárdico). Posterior: tumor neurogênico.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-12","ch":"cirurgia-A1","av":"A1","q":"Qual faixa etária tem mais massas mediastinais malignas e quais são elas?","a":"20 a 40 anos: linfomas e tumores de células germinativas.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-13","ch":"cirurgia-A1","av":"A1","q":"Qual é o primeiro exame e qual é o principal exame na massa do mediastino?","a":"Primeiro o RX PA e perfil; o principal é a TC com contraste, que não dá diagnóstico patológico.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-14","ch":"cirurgia-A1","av":"A1","q":"O que dá a compressão do laríngeo recorrente e por que o esquerdo?","a":"Disfonia e rouquidão; o esquerdo passa por baixo da aorta, perto do mediastino médio.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-15","ch":"cirurgia-A1","av":"A1","q":"Qual é a relação entre timoma e miastenia?","a":"Timoma está em 10% dos miastênicos acima de 40 anos; na miastenia se faz timectomia com limpeza da gordura do mediastino.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-16","ch":"cirurgia-A1","av":"A1","q":"Quais marcadores pedir na massa mediastinal do homem jovem?","a":"β-hCG e alfafetoproteína, e palpar a bolsa escrotal.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-17","ch":"cirurgia-A1","av":"A1","q":"Qual é o tumor de células germinativas maligno mais comum do mediastino?","a":"O seminoma (50% pela aula). No geral, contando os benignos, o mais comum é o teratoma maduro.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-18","ch":"cirurgia-A1","av":"A1","q":"Qual é o sinal mais frequente do bócio mergulhante e por onde se opera?","a":"Compressão da traqueia; acesso pela via cervical.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-19","ch":"cirurgia-A1","av":"A1","q":"Por que pedir RM no tumor neurogênico do mediastino posterior?","a":"Porque ele pode entrar no canal medular (tumor em halter), e a cirurgia pode lesar a medula.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-20","ch":"cirurgia-A1","av":"A1","q":"Qual é o tumor neurogênico mais comum no adulto e na criança?","a":"Adulto: schwannoma (neurilemoma). Criança: ganglioneuroma.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-21","ch":"cirurgia-A1","av":"A1","q":"Quem deve fazer rastreamento de câncer de pulmão no Brasil?","a":"Pessoas de 50 a 80 anos, fumantes atuais ou ex-fumantes que pararam há até 15 anos, com carga tabágica de 20 anos-maço ou mais, com TC de baixa dose anual.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-22","ch":"cirurgia-A1","av":"A1","q":"Como se calcula a carga tabágica?","a":"Cigarros por dia divididos por 20, multiplicados pelos anos de tabagismo. Resultado em anos-maço.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-23","ch":"cirurgia-A1","av":"A1","q":"Qual tipo de câncer de pulmão dá broncorreia em \"clara de ovo\"?","a":"Adenocarcinoma lepídico (antigo bronquioloalveolar), em geral em não fumante, com consolidação que não resolve.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-24","ch":"cirurgia-A1","av":"A1","q":"Pneumonia de repetição no mesmo lobo em fumante: como investigar?","a":"TC de tórax e broncoscopia, pensando em obstrução brônquica por tumor.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-25","ch":"cirurgia-A1","av":"A1","q":"Quais tipos de câncer de pulmão são centrais e quais são periféricos?","a":"Centrais: epidermoide e oat cell (sintomáticos, tosse). Periféricos: adenocarcinoma e grandes células (silenciosos, o primeiro sintoma costuma ser o emagrecimento).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-26","ch":"cirurgia-A1","av":"A1","q":"Qual é o tipo de câncer de pulmão mais frequente, segundo a aula?","a":"O adenocarcinoma, com 45 a 50% dos casos.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-27","ch":"cirurgia-A1","av":"A1","q":"Quando a aula manda pedir broncoscopia no fumante com pneumonia?","a":"Quando a resolução radiológica é lenta (mais de 10 dias) ou a pneumonia se repete no mesmo segmento em 6 meses a 1 ano.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-28","ch":"cirurgia-A1","av":"A1","q":"Derrame pleural leitoso num paciente com câncer de pulmão: o que é e o que dosar?","a":"Quilotórax por invasão do ducto torácico; dosar triglicerídeos no líquido.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-29","ch":"cirurgia-A1","av":"A1","q":"O que é a síndrome da veia cava superior e qual tumor costuma causá-la?","a":"Edema e pletora da face, veias do pescoço, ombro e braços dilatadas, sintomas de hipertensão craniana; em geral oat cell com metástase mediastinal, diagnosticado por biópsia de linfonodo.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-30","ch":"cirurgia-A1","av":"A1","q":"Que parte do corpo o PET-scan não estuda bem no estadiamento?","a":"O encéfalo, que já capta glicose; usa-se RM de crânio.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-31","ch":"cirurgia-A1","av":"A1","q":"Por que a TC de estadiamento inclui o andar superior do abdome?","a":"Para pegar fígado e adrenais, sítios de metástase.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-32","ch":"cirurgia-A1","av":"A1","q":"O que muda a conduta quando aparece N2?","a":"Se é conhecido antes (TC ou mediastinoscopia), quimioterapia neoadjuvante e depois cirurgia; se é achado na cirurgia, quimioterapia adjuvante.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-33","ch":"cirurgia-A1","av":"A1","q":"Quando o câncer de pulmão não é cirúrgico, pelas anotações da aula?","a":"T4 ou N3: sem cirurgia, prognóstico ruim, radioterapia.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-34","ch":"cirurgia-A1","av":"A1","q":"Qual paraneoplásica é clássica do carcinoma escamoso e qual do oat cell?","a":"Escamoso: hipercalcemia por PTHrP. Oat cell: SIADH, Cushing ectópico e Lambert-Eaton (o slide agrupa diferente; ver a caixa âmbar).","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-36","ch":"cirurgia-A1","av":"A1","q":"O que pedir no líquido pleural para descartar empiema?","a":"pH, DHL, glicose, Gram e cultura.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-37","ch":"cirurgia-A1","av":"A1","q":"Como se confirma a tuberculose pleural?","a":"Exsudato linfocítico com ADA alta; a confirmação clássica é a biópsia pleural com agulha de Cope mostrando granuloma.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-38","ch":"cirurgia-A1","av":"A1","q":"Qual fungo forma bola fúngica em caverna e qual se pega em grutas?","a":"Aspergillus fumigatus forma o aspergiloma; histoplasmose se pega em grutas.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-torax-39","ch":"cirurgia-A1","av":"A1","q":"Qual é a sequência de exames de diagnóstico e estadiamento no tumor de pulmão do tabagista (caiu como discursiva)?","a":"TC com contraste incluindo o andar superior do abdome; tecido por broncoscopia, EBUS ou punção percutânea; mediastino por EBUS ou mediastinoscopia; se operável, prova de função respiratória e cintilografia perfusional.","sec":"cirurgia/resumos/4","w":"Tórax · Propedêutica, mediastino, pulmão e pleura"},{"id":"ci-coloprocto-01","ch":"cirurgia-A1","av":"A1","q":"Quais são os riscos e cuidados da colonoscopia?","a":"É invasiva: exige preparo do cólon, é feita sob sedação e pode perfurar ou sangrar.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-02","ch":"cirurgia-A1","av":"A1","q":"Como diferenciar abscesso anal, fissura e trombose hemorroidária?","a":"Abscesso: dor contínua com febre. Fissura: dor ao evacuar com sangue no papel. Trombose: nódulo azulado doloroso, súbito, sem febre.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-03","ch":"cirurgia-A1","av":"A1","q":"Qual é o exame de escolha na suspeita de diverticulite aguda?","a":"TC de abdome e pelve. A colonoscopia fica para 6 a 8 semanas depois.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-04","ch":"cirurgia-A1","av":"A1","q":"A maioria dos cânceres colorretais é esporádica ou hereditária? De onde se originam?","a":"Esporádica, a partir do adenoma (sequência adenoma-carcinoma).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-05","ch":"cirurgia-A1","av":"A1","q":"Quais são os fatores de risco do câncer colorretal?","a":"Idade, história familiar, DII, obesidade, tabagismo, álcool, sedentarismo, carne vermelha e processada.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-06","ch":"cirurgia-A1","av":"A1","q":"Qual é a conduta diante de sangue oculto positivo?","a":"Colonoscopia.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-07","ch":"cirurgia-A1","av":"A1","q":"Quando começar o rastreamento com parente de 1º grau com câncer colorretal?","a":"Colonoscopia aos 40 anos, ou 10 anos antes da idade do diagnóstico do parente, o que vier primeiro.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-08","ch":"cirurgia-A1","av":"A1","q":"Como se estadia o T do câncer colorretal?","a":"T1 submucosa, T2 muscular própria, T3 até a gordura pericólica, T4a peritônio visceral, T4b órgãos adjacentes.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-09","ch":"cirurgia-A1","av":"A1","q":"O que muda quando há linfonodo comprometido?","a":"Vira estádio III, piora o prognóstico e indica quimioterapia adjuvante.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-10","ch":"cirurgia-A1","av":"A1","q":"Qual é o papel do CEA?","a":"Prognóstico e seguimento após o tratamento, não diagnóstico.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-11","ch":"cirurgia-A1","av":"A1","q":"Como se diferencia sangue de hemorroida, melena e coágulo?","a":"Hemorroida: vermelho vivo (arterial), no vaso ou no papel. Melena: sangue digerido (ou sulfato ferroso). Coágulo: sangramento ativo.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-12","ch":"cirurgia-A1","av":"A1","q":"Que sintoma da anamnese a aula marca como sinal de alarme?","a":"Muco nas fezes (e acordar à noite para evacuar).","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-14","ch":"cirurgia-A1","av":"A1","q":"Por que nunca liberar da emergência uma dor anal sem examinar?","a":"Pode ser abscesso anal, e deixá-lo passar tem consequências catastróficas.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-15","ch":"cirurgia-A1","av":"A1","q":"O que o toque retal avalia?","a":"Dor, tônus e contratilidade esfincteriana, próstata ou útero, massas e o fundo de saco de Douglas.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-16","ch":"cirurgia-A1","av":"A1","q":"O que se espera encontrar no reto ao toque?","a":"Ânus fechado em repouso e reto sem fezes; fezes endurecidas indicam constipação.","sec":"cirurgia/resumos/5","w":"Coloprocto · Propedêutica do cólon, reto e ânus e rastreamento"},{"id":"ci-coloprocto-17","ch":"cirurgia-A1","av":"A1","q":"Por que a hemorr
