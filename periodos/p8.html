e 30 dB.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"5-abdome-agudo-ginecologico-11","ch":"gineco-A1","av":"A1","q":"Qual a classificação sindrômica da DIP? E da torção?","a":"DIP: inflamatória. Torção: vascular.","sec":"gineco/resumos/4","w":"5. Abdome agudo ginecológico e DIP"},{"id":"ob-mod-03","ch":"obst-A1","av":"A1","q":"Por que a anemia da gestação é dita \"fisiológica\"?","a":"O plasma aumenta 40–50% e a massa eritrocitária 20–30%: hemodiluição, com ↓ de hematócrito e viscosidade. A Hb fica menor, mas a massa total de hemácias é maior; serve de reserva para a perda do parto.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-vascular-L12","ch":"cirurgia-A1","av":"A1","q":"O que a elevação e o declive do membro mostram na insuficiência arterial?","a":"Palidez à elevação e eritrocianose em declive.","sec":"cirurgia/resumos/6/12/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Oclusão arterial crônica: quadro e exame"},{"id":"of-palp-04","ch":"oftalmo-A1","av":"A1","q":"Qual a causa da ptose congênita e a que ela se associa?","a":"Desenvolvimento inadequado do músculo elevador da pálpebra; associa-se a estrabismo e ambliopia. Tratamento cirúrgico.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-14","ch":"otorrino-A1","av":"A1","q":"O que diz o slide sobre a triagem auditiva neonatal universal?","a":"Universal e obrigatória até os três meses, pelo método EOA (fácil, rápido, barato); se alterada, repetir antes dos três meses. Lei 12.303/2010.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"6-cancer-do-colo-uterino-e-l-01","ch":"gineco-A1","av":"A1","q":"Qual o fator principal de progressão do HPV ao câncer?","a":"Persistência da infecção por HPV oncogênico.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-04","ch":"obst-A1","av":"A1","q":"Por que a PA cai na gestação, se o débito cardíaco aumenta?","a":"PA = RVP × DC. A RVP cai mais do que o DC sobe (progesterona, vasodilatação, placenta como fístula AV).","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-vascular-L13","ch":"cirurgia-A1","av":"A1","q":"Claudicação com pulsos presentes e piora à extensão da coluna: o que é?","a":"Pseudoclaudicação (estenose do canal lombar).","sec":"cirurgia/resumos/6/13/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Oclusão arterial crônica: diferencial e tratamento"},{"id":"of-palp-05","ch":"oftalmo-A1","av":"A1","q":"Defina entrópio e cite os tipos.","a":"Inversão da margem palpebral; senil, cicatricial (trauma, queimadura química), espástico e congênito. Tratamento cirúrgico.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-15","ch":"otorrino-A1","av":"A1","q":"O que o PEATE avalia e quais as vantagens?","a":"A condução eletrofisiológica do estímulo da periferia até o tronco encefálico; objetivo, rápido, confiável, barato e serve para recém-nascido.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"6-cancer-do-colo-uterino-e-l-02","ch":"gineco-A1","av":"A1","q":"Em quanto tempo a maioria das infecções regride?","a":"Até 24 meses.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-05","ch":"obst-A1","av":"A1","q":"Qual o valor da hemoglobina que o professor usa para ferro profilático e terapêutico?","a":"Acima de 11: profilático; abaixo de 11: terapêutico; abaixo de 8: patológico (investigar).","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-vascular-L14","ch":"cirurgia-A1","av":"A1","q":"Quando a variz vira cirurgia de urgência?","a":"Tromboflebite ascendente chegando à crossa da safena.","sec":"cirurgia/resumos/6/14/ci-vascular","w":"Vascular · Veias, TVP, IVC e oclusão arterial · Da prova antiga: aorta, carótida e varizes"},{"id":"of-palp-06","ch":"oftalmo-A1","av":"A1","q":"Defina ectrópio e cite as causas.","a":"Eversão da margem palpebral; congênito, senil, paralítico (VII par), cicatricial, mecânico e alérgico. Tratamento cirúrgico.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-16","ch":"otorrino-A1","av":"A1","q":"Defina PAIR e diga o primeiro sinal no audiograma.","a":"Perda neurossensorial, geralmente bilateral, irreversível e progressiva por ruído acima de 80 dB por tempo prolongado; entalhe em 3, 4 ou 6 kHz com recuperação em 8 kHz.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"6-cancer-do-colo-uterino-e-l-03","ch":"gineco-A1","av":"A1","q":"HPV 6 e 11 causam o quê? E 16 e 18?","a":"6/11: condilomas (baixo risco). 16/18: alto risco — 16 escamoso, 18 adenocarcinoma.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-06","ch":"obst-A1","av":"A1","q":"Como fica o equilíbrio ácido-base na gestação?","a":"Hiperventilação → ↓ PCO₂ → alcalose respiratória compensada (HCO₃ 26 → 22 mmol/L).","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L0","ch":"cirurgia-A1","av":"A1","q":"Quais dissertativas repetiram na prova antiga?","a":"Câncer gástrico precoce (2 vezes) e o caso de câncer colorretal do Roberto (3 vezes na A2 e mais 1 no compilado).","sec":"cirurgia/resumos/7/0/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · O mapa do que já caiu"},{"id":"of-palp-07","ch":"oftalmo-A1","av":"A1","q":"O que é triquíase e como se trata?","a":"Cílios maldirecionados (por blefarite crônica, entrópio ou idiopática); retirada dos cílios desviados.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-17","ch":"otorrino-A1","av":"A1","q":"Qual o tempo máximo de exposição diária a 85, 90 e 100 dB(A) pela NR-15?","a":"85 dB: 8 horas. 90 dB: 4 horas. 100 dB: 1 hora.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"6-cancer-do-colo-uterino-e-l-04","ch":"gineco-A1","av":"A1","q":"Menarca precoce é fator de risco para câncer de colo?","a":"Não (pegadinha de prova). Multiparidade é.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-07","ch":"obst-A1","av":"A1","q":"Cite três modificações da coagulação e o risco de TEV.","a":"↑ fatores VII, VIII, X e fibrinogênio, ↓ proteína S e da fibrinólise. TEV 4–5× na gestação e ~20× no puerpério. Tríade de Virchow: hipercoagulabilidade, estase e lesão endotelial.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L1","ch":"cirurgia-A1","av":"A1","q":"Qual é a indicação absoluta de colecistectomia que caiu?","a":"Vesícula em porcelana.","sec":"cirurgia/resumos/7/1/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Abdome: profilaxia e cirurgia geral"},{"id":"of-palp-08","ch":"oftalmo-A1","av":"A1","q":"Cite causas de madarose.","a":"Queimaduras, iatrogenia, sífilis, hanseníase e lúpus.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-disacusias-18","ch":"otorrino-A1","av":"A1","q":"Desde quando a PAIR é de notificação compulsória?","a":"Desde 2004, como um dos onze agravos à saúde do trabalhador.","sec":"otorrino/resumos/0","w":"Otologia · Aula inaugural e disacusias"},{"id":"6-cancer-do-colo-uterino-e-l-05","ch":"gineco-A1","av":"A1","q":"Qual região do colo concentra as lesões?","a":"Zona de transformação (junção escamocolunar, metaplasia escamosa).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-08","ch":"obst-A1","av":"A1","q":"O que acontece com o metabolismo da glicose no 1º trimestre e depois?","a":"1º tri anabólico (↑ insulina, hipoglicemia de jejum); 2º e 3º tri catabólico, com hPL gerando resistência à insulina, hiperglicemia pós-prandial e hiperinsulinemia compensatória. Falha da compensação: DMG.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L2","ch":"cirurgia-A1","av":"A1","q":"Até que camada vai o câncer gástrico precoce?","a":"Até a submucosa, com ou sem linfonodo.","sec":"cirurgia/resumos/7/2/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Estômago"},{"id":"of-palp-09","ch":"oftalmo-A1","av":"A1","q":"Qual o tratamento da blefarite?","a":"Higiene palpebral 2 vezes ao dia, compressas quentes, pomada de corticoide, colírio de esteroide fraco e lágrimas artificiais.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-01","ch":"otorrino-A1","av":"A1","q":"Para que lado lateraliza o Weber na perda condutiva e na neurossensorial?","a":"Condutiva: para o lado da perda (doente). Neurossensorial: para o lado bom.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-06","ch":"gineco-A1","av":"A1","q":"Esquema da vacina HPV para 9 a 14 anos no SUS?","a":"Dose única.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-09","ch":"obst-A1","av":"A1","q":"Qual o valor normal de proteinúria de 24 h e o que significa acima disso?","a":"Até 300 mg/24 h é normal. ≥ 300 mg/24 h é critério de proteinúria da pré-eclâmpsia (com hipertensão), ou doença renal. Não é critério de DMG.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L3","ch":"cirurgia-A1","av":"A1","q":"Hemangioma de 10 cm assintomático: qual é a conduta?","a":"Observar, sem biópsia.","sec":"cirurgia/resumos/7/3/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Fígado e vias biliares"},{"id":"of-palp-10","ch":"oftalmo-A1","av":"A1","q":"Diferencie hordéolo interno, hordéolo externo e calázio.","a":"Hordéolo interno: inflamação aguda da Meibomius (estafilococo). Externo (terçol): abscesso de Zeis ou Moll. Calázio: inflamação crônica da Meibomius, nódulo indolor.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-03","ch":"otorrino-A1","av":"A1","q":"Na perda neurossensorial, como fica o Rinne?","a":"Positivo (aérea > óssea), chamado positivo patológico, porque as duas vias estão reduzidas.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-07","ch":"gineco-A1","av":"A1","q":"Menina de 12 anos vítima de violência sexual: esquema?","a":"2 doses (0 e 6 meses).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-10","ch":"obst-A1","av":"A1","q":"Por que a hidronefrose é mais comum à direita?","a":"Progesterona (atonia) + compressão pelo útero aumentado e dextrorrotado, que pesa mais sobre o ureter direito. Fisiológica, mas aumenta risco de ITU e cólica.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L4","ch":"cirurgia-A1","av":"A1","q":"Qual é a tríade clássica do tumor renal?","a":"Hematúria, massa em flanco e dor lombar.","sec":"cirurgia/resumos/7/4/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Urologia"},{"id":"of-palp-11","ch":"oftalmo-A1","av":"A1","q":"O que é o sinal de Hutchinson e o que ele indica?","a":"Lesões do herpes zóster na lateral ou na ponta do nariz; indica risco de acometimento ocular (ramo nasociliar).","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-04","ch":"otorrino-A1","av":"A1","q":"Onde se coloca o diapasão no teste por via aérea e quais as frequências citadas?","a":"A cerca de 1,5 cm do trago, sem tocar; 128, 256, 512, 1.024 e 2.048 Hz.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-08","ch":"gineco-A1","av":"A1","q":"Mulher de 29 anos tratada por conização por NIC 3: vacina?","a":"Sim, independente da idade, 3 doses (0-2-6), até 12 meses após o procedimento.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-11","ch":"obst-A1","av":"A1","q":"O que a progesterona faz no trato digestivo?","a":"Atonia: esvaziamento gástrico lento, pirose (↓ tônus do esfíncter esofágico inferior), constipação, ↓ ácido; cálculos biliares e edema gengival.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L5","ch":"cirurgia-A1","av":"A1","q":"Qual sinal aparece na epifisiólise proximal do fêmur?","a":"Sinal de Drehmann.","sec":"cirurgia/resumos/7/5/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Ortopedia"},{"id":"of-palp-12","ch":"oftalmo-A1","av":"A1","q":"Qual o tratamento sistêmico do herpes zóster oftálmico no slide?","a":"Aciclovir precoce, 800 mg 5 vezes ao dia por 7 dias, mais aciclovir pomada e antibiótico tópico.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-05","ch":"otorrino-A1","av":"A1","q":"Quais estruturas se reconhecem numa membrana timpânica normal?","a":"Parte flácida, parte tensa, processo lateral e cabo do martelo, umbo e triângulo luminoso (anteroinferior).","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-09","ch":"gineco-A1","av":"A1","q":"Imunossuprimida de 30 anos: esquema?","a":"3 doses (0-2-6).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-12","ch":"obst-A1","av":"A1","q":"Por que o útero pode se romper no fim da gestação?","a":"Estiramento: a parede afina de 1,5 cm para valores menores, por hipertrofia sem proliferação suficiente; o risco cresce com cicatriz prévia.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-prova-antiga-L6","ch":"cirurgia-A1","av":"A1","q":"Em que estrutura se faz a manobra de Sellick?","a":"Na cartilagem cricoide.","sec":"cirurgia/resumos/7/6/ci-prova-antiga","w":"Prova antiga · Tudo o que já caiu · Anestesiologia"},{"id":"of-palp-13","ch":"oftalmo-A1","av":"A1","q":"Qual o tumor maligno mais frequente da pálpebra e onde aparece?","a":"Carcinoma basocelular, no idoso, na pálpebra inferior.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-06","ch":"otorrino-A1","av":"A1","q":"Quando as otoemissões acústicas estão ausentes?","a":"Em doença da orelha média e quando a audição está pior que 30 dB.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-10","ch":"gineco-A1","av":"A1","q":"Rastreamento citológico: início, periodicidade e fim?","a":"25 anos; 2 anuais e depois a cada 3 anos; até 64 anos.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-mod-13","ch":"obst-A1","av":"A1","q":"Qual a diferença entre sopro sistólico e diastólico na gestação?","a":"Sistólico (90%) é fisiológico (hiperfluxo + rotação + anemia dilucional). Diastólico (~20% no slide) deve ser investigado.","sec":"obst/resumos/1","w":"2. Modificações do organismo materno"},{"id":"ci-an-vias-L0","ch":"cirurgia-A1","av":"A1","q":"Cite três situações de emergência que indicam IOT.","a":"Glasgow ≤ 8, apneia e proteção da via aérea (queimadura, edema).","sec":"cirurgia/resumos/8/0/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Intubação traqueal: o que é e quando indicar · slides 2–3"},{"id":"of-palp-14","ch":"oftalmo-A1","av":"A1","q":"Diferencie lacrimejamento de epífora obstrutiva.","a":"Lacrimejamento: hipersecreção por estímulo do trigêmeo (irritação da córnea ou conjuntiva), tratamento clínico. Epífora: obstrução do sistema excretor, piora no frio e vento, tratamento geralmente cirúrgico.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-07","ch":"otorrino-A1","av":"A1","q":"Qual lei garante a triagem auditiva neonatal e qual o método do slide?","a":"Lei nº 12.303, de 2 de agosto de 2010; EOA (mais fácil, rápido e barato).","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-11","ch":"gineco-A1","av":"A1","q":"ASC-US em mulher de 27 anos? E de 32?","a":"27: repetir em 12 meses. 32: repetir em 6 meses.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-01","ch":"obst-A1","av":"A1","q":"Qual o calendário de consultas do pré-natal de risco habitual?","a":"Mínimo 6 consultas (MS; OMS fala em 8 contatos); 1ª até 12 semanas; mensais até 28; quinzenais de 28 a 36; semanais de 36 a 41.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L1","ch":"cirurgia-A1","av":"A1","q":"Por que o tubo empurrado demais vai para a direita?","a":"O brônquio fonte direito é mais vertical (25°) que o esquerdo (45°).","sec":"cirurgia/resumos/8/1/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Anatomia e inervação da via aérea · slides 4–10"},{"id":"of-palp-15","ch":"oftalmo-A1","av":"A1","q":"Como se trata a obstrução lacrimal congênita?","a":"Massagem do saco lacrimal (10 vezes, 4x/dia), limpeza com SF, colírio de antibiótico; sondagem entre 12 e 18 meses sob anestesia geral; DCR se falhar.","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-08","ch":"otorrino-A1","av":"A1","q":"Quais são os geradores das ondas do PEATE segundo o slide?","a":"I: nervo auditivo distal; II: nervo auditivo proximal; III: núcleos cocleares; IV e V: lemnisco lateral superior (V a mais constante).","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-12","ch":"gineco-A1","av":"A1","q":"LSIL em mulher de 23 anos?","a":"Repetir citologia em 3 anos.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-02","ch":"obst-A1","av":"A1","q":"Como se define e se escreve a fórmula obstétrica?","a":"G = número de gestações (incluindo a atual); P = partos com mais de 20 semanas (gemelar conta 1); A = perdas antes de 20 semanas. Ex.: G3P1A1.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L2","ch":"cirurgia-A1","av":"A1","q":"Qual lâmina a aula anotou para o adulto?","a":"Lâmina 4 ou 5.","sec":"cirurgia/resumos/8/2/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Laringoscópios: o convencional e os não convencionais · slides 11–15"},{"id":"of-palp-16","ch":"oftalmo-A1","av":"A1","q":"Qual o princípio da dacriocistorrinostomia e quando ela é indicada?","a":"Criar uma fístula entre a via lacrimal e a cavidade nasal; indicada na dacriocistite crônica (obstrução do ducto nasolacrimal).","sec":"oftalmo/resumos/1","w":"Oftalmologia · Pálpebras e vias lacrimais"},{"id":"or-semio-09","ch":"otorrino-A1","av":"A1","q":"Quais as três funções do labirinto vestibular?","a":"Transformar aceleração da cabeça e gravidade em sinal biológico, informar velocidade e posição da cabeça e iniciar reflexos de estabilização do olhar, da cabeça e do corpo.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-13","ch":"gineco-A1","av":"A1","q":"ASC-H e HSIL: conduta?","a":"Colposcopia.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-03","ch":"obst-A1","av":"A1","q":"Qual o critério de hipertensão na gestação?","a":"PAS ≥ 140 e/ou PAD ≥ 90 mmHg, em duas medidas com intervalo de 4 horas.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L3","ch":"cirurgia-A1","av":"A1","q":"Como se mede a cânula de Guedel?","a":"Da comissura da boca ao ângulo da mandíbula.","sec":"cirurgia/resumos/8/3/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Cânulas e tubos endotraqueais · slides 16–19"},{"id":"of-olhov-01","ch":"oftalmo-A1","av":"A1","q":"O que é a síndrome do olho vermelho?","a":"Inflamação primária ou secundária de qualquer estrutura do segmento anterior (córnea, íris, corpo ciliar, cristalino, esclera, conjuntiva, pálpebras, cílios, limbo), que se manifesta como hiperemia ocular.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-10","ch":"otorrino-A1","av":"A1","q":"Qual a diferença entre vertigem e tontura?","a":"Vertigem é a ilusão de movimento ou automovimento; tontura é termo amplo (desequilíbrio, fraqueza, flutuação, sensação de desmaio).","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-14","ch":"gineco-A1","av":"A1","q":"DNA-HPV positivo para HPV 16: conduta?","a":"Colposcopia direto (sem citologia antes).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-04","ch":"obst-A1","av":"A1","q":"Diferencie hipertensão crônica, gestacional, pré-eclâmpsia e pré-eclâmpsia sobreposta.","a":"Crônica: antes da gravidez ou de 20 semanas. Gestacional: após 20 semanas, sem proteinúria nem deterioração, some após o parto. Pré-eclâmpsia: após 20 semanas com proteinúria ≥ 300 mg/24 h e/ou deterioração clínica. Sobreposta: hipertensa crônica que desenvolve proteinúria ou deterioração após 20 semanas.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L4","ch":"cirurgia-A1","av":"A1","q":"Quais os componentes da tríade da anestesia e da IOT?","a":"Analgesia, hipnose/sedação e bloqueio neuromuscular, com estabilidade hemodinâmica.","sec":"cirurgia/resumos/8/4/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Preparação para a IOT e a tríade da anestesia · slides 20–25"},{"id":"of-olhov-02","ch":"oftalmo-A1","av":"A1","q":"Cite causas de olho vermelho de evolução favorável, que o clínico pode tratar.","a":"Conjuntivites (a maioria), hemorragia subconjuntival, episclerites e hordéolos (terçol).","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-11","ch":"otorrino-A1","av":"A1","q":"Quais os quatro grupos de sintomas vestibulares da Bárány Society?","a":"Vertigem, tontura, sintomas vestíbulo-visuais e sintomas posturais.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-15","ch":"gineco-A1","av":"A1","q":"DNA-HPV positivo para HPV 51 (não 16/18): conduta?","a":"Citologia reflexa; se ASC-US+ colposcopia, se normal repetir em 1 ano.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-05","ch":"obst-A1","av":"A1","q":"Qual o ganho de peso recomendado para uma gestante com IMC pré-gestacional normal?","a":"11,5 a 16 kg no total, cerca de 0,4 kg por semana no 2º e 3º trimestres.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L5","ch":"cirurgia-A1","av":"A1","q":"Quantos fatores de Langeron predizem ventilação difícil sob máscara?","a":"Dois ou mais (barba, IMC > 26, sem dentes, idade > 55, ronco).","sec":"cirurgia/resumos/8/5/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Máscara facial: ventilar antes de intubar · slides 26–31"},{"id":"of-olhov-03","ch":"oftalmo-A1","av":"A1","q":"Cite causas de olho vermelho que exigem oftalmologista prontamente.","a":"Algumas conjuntivites, ceratites, ceratoconjuntivites, uveítes, blefarites, endoftalmites e crise aguda de glaucoma.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-12","ch":"otorrino-A1","av":"A1","q":"Como se define a direção do nistagmo?","a":"Pela direção da componente rápida.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-16","ch":"gineco-A1","av":"A1","q":"DNA-HPV negativo: quando repetir na imunocompetente e na HIV?","a":"5 anos e 3 anos.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-06","ch":"obst-A1","av":"A1","q":"Qual a relação entre altura uterina e idade gestacional?","a":"12 sem na sínfise; 16 entre sínfise e umbigo; 20 no umbigo; de 20 a 32 sem, AU ≈ IG (1 cm/sem); após 32, 0,5 cm/sem.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L6","ch":"cirurgia-A1","av":"A1","q":"Cite uma síndrome congênita de via aérea difícil da aula.","a":"Pierre-Robin (também Marfan, acondroplasia, fissura palatina).","sec":"cirurgia/resumos/8/6/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Quem tem via aérea difícil: a história · slides 32–35"},{"id":"of-olhov-04","ch":"oftalmo-A1","av":"A1","q":"Quais achados afastam conjuntivite simples e indicam encaminhamento?","a":"Dor intensa, baixa de acuidade visual, fotofobia intensa, pupila alterada (miose ou média midríase fixa), córnea opaca, halos e PIO alta.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-13","ch":"otorrino-A1","av":"A1","q":"Quais achados do HINTS indicam origem central e qual a conduta?","a":"Head impulse normal e/ou nistagmo que muda de direção e/ou desalinhamento vertical (skew): conduzir como AVC.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-17","ch":"gineco-A1","av":"A1","q":"Mulher de 61 anos com DNA-HPV negativo?","a":"Liberada do rastreamento (o próximo ultrapassaria 64 anos).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-07","ch":"obst-A1","av":"A1","q":"Cite causas de AU maior e menor que a IG.","a":"Maior: polidrâmnio, gemelar, macrossomia, mola, erro de data. Menor: oligoâmnio, CIUR, erro de data, tabagismo, óbito fetal.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L7","ch":"cirurgia-A1","av":"A1","q":"Que distância tireomentoniana é desfavorável?","a":"Menor que 3 dedos.","sec":"cirurgia/resumos/8/7/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Avaliação clínica: os 11 itens da ASA e o LEMON · slides 36, 39–41"},{"id":"of-olhov-05","ch":"oftalmo-A1","av":"A1","q":"Que tipo de secreção sugere cada causa de conjuntivite?","a":"Aquosa: viral e alérgica aguda. Mucoide: primaveril e ceratoconjuntivite seca. Purulenta: bacteriana aguda severa. Mucopurulenta: bacteriana leve e Chlamydia.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-14","ch":"otorrino-A1","av":"A1","q":"Para que lado o paciente desvia no Romberg e no Fukuda em lesão vestibular aguda unilateral?","a":"Para o lado do labirinto acometido (hipoativo). Fukuda alterado: giro maior que 45° ou deslocamento maior que 1 m.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-18","ch":"gineco-A1","av":"A1","q":"Qual o tipo histológico mais comum e qual HPV se associa a ele? E o adenocarcinoma?","a":"Escamoso (~80%), HPV 16. Adenocarcinoma (~15%), HPV 18.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-09","ch":"obst-A1","av":"A1","q":"A partir de quando o BCF é audível e qual a faixa normal?","a":"Sonar Doppler a partir de 12 semanas; Pinard a partir de 18 semanas. Normal 110–160 bpm.","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L8","ch":"cirurgia-A1","av":"A1","q":"O que se vê no Mallampati IV?","a":"Só o palato duro.","sec":"cirurgia/resumos/8/8/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Mallampati, mordida do lábio e o SARI · slides 37–38, 42–43"},{"id":"of-olhov-06","ch":"oftalmo-A1","av":"A1","q":"Em que conjuntivites aparecem folículos?","a":"Virais, por Chlamydia e tóxicas (por exemplo, colírios para glaucoma). Os folículos são avasculares.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-15","ch":"otorrino-A1","av":"A1","q":"Como tratar a neurite vestibular segundo o slide?","a":"Reabilitação vestibular, corticoide oral (discutível) e supressores por 2 dias: dimenidrinato 50 mg ou meclizina 25 mg de 8/8 ou 6/6 h.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-19","ch":"gineco-A1","av":"A1","q":"Qual o sintoma clássico do câncer de colo?","a":"Sangramento pós-coital (sinusiorragia).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre1-10","ch":"obst-A1","av":"A1","q":"O que significa aceleração do BCF após movimento fetal?","a":"Boa vitalidade fetal (feto reativo).","sec":"obst/resumos/2","w":"3. Pré-natal I: consultas, anamnese e exame físico"},{"id":"ci-an-vias-L9","ch":"cirurgia-A1","av":"A1","q":"Quem dessatura mais rápido em apneia?","a":"O obeso e a criança.","sec":"cirurgia/resumos/8/9/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Pré-oxigenação: o tempo que você ganha · slides 44–45"},{"id":"of-olhov-07","ch":"oftalmo-A1","av":"A1","q":"Quais causas de pseudomembrana e de membrana verdadeira?","a":"Pseudomembrana: adenovírus severo, gonococo e Stevens-Johnson. Membrana verdadeira: estreptococo e difteria.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-semio-16","ch":"otorrino-A1","av":"A1","q":"Qual o canal mais acometido na VPPB, como se diagnostica e como se trata?","a":"Canal posterior (80 a 90%); diagnóstico pela manobra de Dix-Hallpike; tratamento pela manobra de Epley.","sec":"otorrino/resumos/1","w":"Otologia · Semiologia da audição e do labirinto"},{"id":"6-cancer-do-colo-uterino-e-l-20","ch":"gineco-A1","av":"A1","q":"Teste de Schiller iodo-negativo confirma câncer?","a":"Não; a biópsia confirma.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-01","ch":"obst-A1","av":"A1","q":"Quais os exames da rotina do 1º trimestre?","a":"Hemograma, ABO/Rh (Coombs indireto se Rh −), glicemia de jejum, anti-HIV, VDRL, HTLV, HBsAg/anti-HBs, toxoplasmose IgG e IgM, EAS e urocultura; anti-HCV; eletroforese de Hb em pardas e negras; Papanicolau se indicado.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L10","ch":"cirurgia-A1","av":"A1","q":"Quais eixos a posição olfativa alinha?","a":"Oral, faríngeo e laríngeo.","sec":"cirurgia/resumos/8/10/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Posição olfativa: alinhar os eixos · slides 46–50"},{"id":"of-olhov-08","ch":"oftalmo-A1","av":"A1","q":"Quais são os agentes da conjuntivite bacteriana simples?","a":"Staphylococcus epidermidis e S. aureus (mais comuns), Streptococcus pneumoniae e Haemophilus influenzae.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-01","ch":"otorrino-A1","av":"A1","q":"Qual é a \"vilã do verão\" e qual é a \"vilã do inverno\"?","a":"Verão: otite externa (umidade). Inverno: otite média aguda (IVAS).","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-21","ch":"gineco-A1","av":"A1","q":"Lesão vegetante e friável no colo: conduta?","a":"Coletar o CP e biopsiar a lesão.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-02","ch":"obst-A1","av":"A1","q":"Como interpretar a glicemia de jejum na 1ª consulta?","a":"< 92 normal (TOTG com 24–28 sem); 92–125 DMG; ≥ 126 diabetes prévio.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L11","ch":"cirurgia-A1","av":"A1","q":"O que é Cormack-Lehane II?","a":"Só a parte posterior da glote (aritenoides).","sec":"cirurgia/resumos/8/11/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Laringoscopia e a classificação de Cormack-Lehane · slides 51–55"},{"id":"of-olhov-09","ch":"oftalmo-A1","av":"A1","q":"Como é a conjuntivite gonocócica do adulto e como se trata no slide?","a":"Hiperaguda, secreção purulenta espessa e abundante, pálpebras edemaciadas e doloridas, quemose e linfonodo pré-auricular. Ceftriaxona IM 250 mg dose única + azitromicina oral dose única (CDC atual: ceftriaxona 1 g IM).","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-02","ch":"otorrino-A1","av":"A1","q":"Qual porção do conduto auditivo externo é mais dolorosa e qual tem pelos e glândulas?","a":"A medial (óssea) é mais dolorosa e não tem anexos; a lateral (cartilaginosa) tem folículos pilosos e glândulas que produzem o cerúmen.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-22","ch":"gineco-A1","av":"A1","q":"Invasão de 8 mm, tumor de 3 cm restrito ao colo: estádio?","a":"IB2.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-03","ch":"obst-A1","av":"A1","q":"Quais os valores de corte do TOTG 75 g?","a":"Jejum ≥ 92, 1 h ≥ 180, 2 h ≥ 153 mg/dL. Um valor alterado já é DMG.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L12","ch":"cirurgia-A1","av":"A1","q":"Como é a capnografia da intubação esofágica?","a":"Ondas cada vez menores até zerar.","sec":"cirurgia/resumos/8/12/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Confirmar o tubo: a capnografia · slides 53–54"},{"id":"of-olhov-10","ch":"oftalmo-A1","av":"A1","q":"Qual a causa provável de conjuntivite neonatal pelo dia de início?","a":"Até 24 h: química. 24 h a 5 dias: gonococo. 5 a 14 dias: Chlamydia trachomatis. 6 a 14 dias: herpes.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-03","ch":"otorrino-A1","av":"A1","q":"Quais nervos fazem a inervação sensitiva da orelha externa?","a":"Trigêmeo (V), facial (VII), glossofaríngeo (IX) e vago (X), mais o plexo cervical.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-23","ch":"gineco-A1","av":"A1","q":"Paramétrio acometido: estádio?","a":"IIB.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-04","ch":"obst-A1","av":"A1","q":"Qual a conduta na gestante Rh negativo?","a":"Se parceiro Rh + ou desconhecido: Coombs indireto. Negativo: repetir e fazer imunoglobulina anti-D com 28 semanas e até 72 h pós-parto (RN Rh +). Positivo: alto risco.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L13","ch":"cirurgia-A1","av":"A1","q":"A máscara laríngea protege contra broncoaspiração?","a":"Não: é via aérea não protegida e temporária.","sec":"cirurgia/resumos/8/13/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Máscara laríngea · slides 56–63"},{"id":"of-olhov-11","ch":"oftalmo-A1","av":"A1","q":"Quais as opções de profilaxia da oftalmia neonatal no slide?","a":"Método de Credé (nitrato de prata, 1 gota), eritromicina 0,5% ou iodopovidona 2,5%.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-04","ch":"otorrino-A1","av":"A1","q":"Quais são os fatores causais e o quadro clínico da otite externa difusa aguda?","a":"Umidade, manipulação e corpo estranho. Otalgia, otorreia, prurido e hipoacusia condutiva, com estado geral preservado e sem febre.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-24","ch":"gineco-A1","av":"A1","q":"Hidronefrose por invasão da parede pélvica: estádio?","a":"IIIB.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-05","ch":"obst-A1","av":"A1","q":"Qual a diferença entre teste treponêmico e não treponêmico na sífilis?","a":"Treponêmico (FTA-Abs, teste rápido) é específico mas fica positivo para sempre, não serve para seguimento. Não treponêmico (VDRL) é quantitativo e serve para seguimento (deve cair 2 titulações em 3 meses).","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L14","ch":"cirurgia-A1","av":"A1","q":"Onde se faz a pressão da manobra de Sellick?","a":"Na cartilagem cricoide.","sec":"cirurgia/resumos/8/14/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · BURP e manobra de Sellick · slides 64–66"},{"id":"of-olhov-12","ch":"oftalmo-A1","av":"A1","q":"Cite os números da ceratoconjuntivite adenoviral.","a":"Dura 10 a 21 dias, incubação de 4 a 10 dias, vírus liberado por 12 dias após o início, bilateral em 60%.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-05","ch":"otorrino-A1","av":"A1","q":"Qual é o principal agente da otite externa bacteriana e o tratamento tópico do slide?","a":"Pseudomonas aeruginosa. Limpeza, evitar umidade e polimixina B + neomicina + hidrocortisona (ou preparados com gentamicina e ciprofloxacino).","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-25","ch":"gineco-A1","av":"A1","q":"Linfonodo para-aórtico: estádio? Metástase pulmonar?","a":"IIIC2; IVB.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-06","ch":"obst-A1","av":"A1","q":"Qual o tratamento da sífilis na gestante por estágio?","a":"Recente (primária, secundária, latente recente): benzatina 2,4 milhões UI dose única. Tardia ou ignorada: 2,4 milhões semanal × 3 (7,2 milhões). Neurossífilis: cristalina 18–24 milhões UI/dia IV por 14 dias. Alérgica: dessensibilizar. Tratar o parceiro.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L15","ch":"cirurgia-A1","av":"A1","q":"Cite duas vantagens do videolaringoscópio.","a":"Menos intubações falhadas e melhor visão glótica (e menos trauma).","sec":"cirurgia/resumos/8/15/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Plano B: bougie, fibroscopia e videolaringoscópio · slides 67–77"},{"id":"of-olhov-13","ch":"oftalmo-A1","av":"A1","q":"Quais as características da conjuntivite por herpes simples?","a":"Vesículas palpebrais unilaterais, edema discreto, secreção aquosa, linfadenopatia, lesões conjuntivais e ceratite em 50%. Antiviral por 21 dias.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-06","ch":"otorrino-A1","av":"A1","q":"Por que o cerúmen protege o conduto?","a":"Tem pH ácido e peptídeos antimicrobianos.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-26","ch":"gineco-A1","av":"A1","q":"Até qual estádio o tratamento é cirúrgico? A partir de qual é RT+QT?","a":"Cirúrgico até IB2; RT+QT a partir de IB3.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-07","ch":"obst-A1","av":"A1","q":"Como a carga viral define a via de parto no HIV?","a":"CV ≥ 1.000 ou desconhecida: cesárea eletiva com 38 sem + AZT EV 3 h antes. 50–999: via obstétrica + AZT EV. < 50: via obstétrica, sem AZT. Não amamentar.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-vias-L16","ch":"cirurgia-A1","av":"A1","q":"Por qual estrutura se faz a cricotireoidostomia?","a":"Pela membrana cricotireóidea, entre a tireoide e a cricoide.","sec":"cirurgia/resumos/8/16/ci-an-vias","w":"Anestesiologia · Vias aéreas e intubação · Cricotireoidostomia e situações críticas · slides 78–84"},{"id":"of-olhov-14","ch":"oftalmo-A1","av":"A1","q":"Qual o sintoma que define a conjuntivite alérgica e quais as variantes?","a":"Prurido ocular intenso e bilateral, com papilas aumentadas. Variantes: rinoconjuntivite alérgica e ceratoconjuntivite primaveril.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-07","ch":"otorrino-A1","av":"A1","q":"Otomicose: frequência, agentes e tratamento?","a":"Cerca de 20% das OE agudas; Aspergillus niger/fumigatus e Candida albicans; limpeza, gotas acidificantes e antifúngico tópico (clotrimazol, clorfenesina).","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-27","ch":"gineco-A1","av":"A1","q":"Mulher de 33 anos com câncer inicial que quer engravidar: opção?","a":"Conização (IA1) ou traquelectomia radical (IA1–IB1).","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-08","ch":"obst-A1","av":"A1","q":"Interprete IgG + / IgM + para toxoplasmose com 9 semanas.","a":"Infecção aguda ou IgM residual: iniciar espiramicina e pedir avidez de IgG. Alta avidez = infecção antiga (> 4 meses), conduta expectante.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L0","ch":"cirurgia-A1","av":"A1","q":"Quantos neurônios tem a via da dor e onde o segundo cruza?","a":"Três; o segundo cruza na medula e sobe pelo trato espinotalâmico até o tálamo.","sec":"cirurgia/resumos/9/0/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · A via ascendente da dor · slides 2, 5–6"},{"id":"of-olhov-15","ch":"oftalmo-A1","av":"A1","q":"Quais os efeitos colaterais do corticoide tópico ocular?","a":"Aumento da PIO (glaucoma), catarata e aumento da incidência de herpes e fungos.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-08","ch":"otorrino-A1","av":"A1","q":"Qual o achado típico da pericondrite do pavilhão?","a":"Dor, calor, eritema e edema de todo o pavilhão, poupando o lóbulo (que não tem cartilagem).","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"6-cancer-do-colo-uterino-e-l-28","ch":"gineco-A1","av":"A1","q":"Mulher de 48 anos, prole completa, IA1: tratamento?","a":"Histerectomia total.","sec":"gineco/resumos/5","w":"6. Câncer do colo uterino e lesões precursoras"},{"id":"ob-pre2-09","ch":"obst-A1","av":"A1","q":"Qual o esquema de tratamento da toxoplasmose antes e depois de 16 semanas?","a":"Até 16 sem: espiramicina 1 g 8/8 h. Após 16 sem ou feto infectado (PCR + no líquido amniótico): sulfadiazina + pirimetamina + ácido folínico.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L1","ch":"cirurgia-A1","av":"A1","q":"Em que receptores agem glutamato e substância P?","a":"Glutamato no NMDA (e AMPA); substância P no NK1.","sec":"cirurgia/resumos/9/1/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · A primeira sinapse: glutamato e substância P · slides 3–4"},{"id":"of-olhov-16","ch":"oftalmo-A1","av":"A1","q":"Qual a diferença entre pinguécula e pterígio?","a":"Pinguécula: depósito branco-amarelado justalímbico que não invade a córnea, cirurgia rara. Pterígio: lâmina triangular fibrovascular que invade a córnea; cirurgia por estética ou invasão do eixo visual.","sec":"oftalmo/resumos/2","w":"Oftalmologia · Conjuntiva e síndrome do olho vermelho"},{"id":"or-otites-09","ch":"otorrino-A1","av":"A1","q":"Otite externa necrosante: quem acomete e qual o tratamento?","a":"Idosos, diabéticos e imunossuprimidos; osteomielite do temporal por Pseudomonas; internação e ceftazidima + ciprofloxacino EV por 4 a 8 semanas.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-01","ch":"gineco-A1","av":"A1","q":"Qual a frequência do mioma e com que frequência é múltiplo?","a":"20–30% das mulheres (40–50% após 40 anos); múltiplo em ~84%.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-pre2-10","ch":"obst-A1","av":"A1","q":"Quando se faz profilaxia de ITU na gestação?","a":"Após 2 episódios de bacteriúria assintomática ou cistite, após internação por pielonefrite, ou ITU de repetição prévia. 1 cp à noite (cefalexina, nitrofurantoína) até o fim da gestação.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L2","ch":"cirurgia-A1","av":"A1","q":"Que neurotransmissores ativam o interneurônio de encefalina?","a":"Serotonina (rafe magna) e noradrenalina (ponte).","sec":"cirurgia/resumos/9/2/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · A via descendente: o freio da dor · slides 7, 11–12"},{"id":"of-crist-01","ch":"oftalmo-A1","av":"A1","q":"Quais são as quatro partes do cristalino e onde fica o epitélio?","a":"Cápsula, epitélio subcapsular, córtex e núcleo; o epitélio fica só na face anterior.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-10","ch":"otorrino-A1","av":"A1","q":"O que é a Síndrome de Ramsay Hunt e como se trata?","a":"Herpes zóster ótico (VZV latente no gânglio geniculado) com otalgia, vesículas no pavilhão e paralisia facial; prednisona 1 mg/kg/dia + valaciclovir 1 g 3x/dia.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-02","ch":"gineco-A1","av":"A1","q":"Por que o mioma regride na menopausa?","a":"É hormônio-dependente (receptores de estrogênio e progesterona).","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-pre2-11","ch":"obst-A1","av":"A1","q":"Quando rastrear GBS e quem recebe profilaxia sem rastreio?","a":"Swab vaginal e retal com 35–37 sem (ACOG: 36–37s6d). Sem rastreio: bacteriúria GBS atual ou filho anterior com GBS. Também: swab +, ou sem rastreio com TPP, febre intraparto ou bolsa rota > 18 h.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L3","ch":"cirurgia-A1","av":"A1","q":"O que o opioide faz no pré e no pós-sináptico?","a":"Pré: fecha Ca²⁺ e bloqueia glutamato e substância P; pós: abre K⁺ e hiperpolariza.","sec":"cirurgia/resumos/9/3/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Onde e como o opioide age · slides 8–10, 13–14"},{"id":"of-crist-02","ch":"oftalmo-A1","av":"A1","q":"Qual o poder de refração do cristalino e de onde ele recebe nutrição?","a":"Cerca de 20 dioptrias; nutrição pelo humor aquoso e pelo vítreo (é avascular).","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-11","ch":"otorrino-A1","av":"A1","q":"Quais são os três agentes da otite média aguda?","a":"Streptococcus pneumoniae, Haemophilus influenzae e Moraxella catarrhalis.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-03","ch":"gineco-A1","av":"A1","q":"Mioma que cresce na pós-menopausa sugere o quê?","a":"Malignidade (sarcoma) — indicação de tratamento invasivo.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-pre2-12","ch":"obst-A1","av":"A1","q":"Quais os suplementos de rotina e doses?","a":"Ácido fólico 400 mcg/dia (4–5 mg se alto risco); ferro elementar 40 mg/dia (terapêutico 120–240 mg se Hb 8–11); cálcio 1 g/dia a partir de 12 sem, longe do ferro.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L4","ch":"cirurgia-A1","av":"A1","q":"O que é a REMIT?","a":"Reações hormonais, metabólicas e inflamatórias à agressão tecidual para manter a homeostase.","sec":"cirurgia/resumos/9/4/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · REMIT: a resposta do corpo à cirurgia · slides 15–16"},{"id":"of-crist-03","ch":"oftalmo-A1","av":"A1","q":"Quais são as principais causas de cegueira no Brasil, em ordem?","a":"Catarata, glaucoma, retinopatia diabética e trauma.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-12","ch":"otorrino-A1","av":"A1","q":"Quais são os picos de incidência da OMA e como muda a lateralidade com a idade?","a":"Pico principal de 6 a 11 meses e segundo pico de 4 a 5 anos; até 2 anos a maioria é bilateral, depois, unilateral.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-04","ch":"gineco-A1","av":"A1","q":"Qual a degeneração mais comum? E a típica da gravidez?","a":"Hialina; vermelha (carnosa).","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-pre2-13","ch":"obst-A1","av":"A1","q":"Quais vacinas são recomendadas na gestação?","a":"Influenza, COVID-19, dTpa após 20 sem (toda gestação), hepatite B se suscetível, VSR 28–36 sem. Vírus vivo não.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L5","ch":"cirurgia-A1","av":"A1","q":"Quais as quatro ausências da anestesia geral?","a":"Consciência (e memória), dor, resposta motora e resposta do SNA.","sec":"cirurgia/resumos/9/5/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Anestesia geral: o conceito e o triângulo · slides 17–19"},{"id":"of-crist-04","ch":"oftalmo-A1","av":"A1","q":"Cite cinco fatores de risco para catarata adquirida.","a":"Idade avançada, tabagismo, exposição solar, diabetes e corticoide (sistêmico, inalatório ou colírio).","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-13","ch":"otorrino-A1","av":"A1","q":"Cite quatro fatores de risco extrínsecos da OMA.","a":"Creche/berçário, tabagismo passivo, falta de vacinação (pneumococo e influenza), mamada deitada e chupeta, falta de aleitamento materno, inverno, IVAS, baixo nível socioeconômico.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-05","ch":"gineco-A1","av":"A1","q":"Qual a frequência da degeneração sarcomatosa?","a":"0,07 a 0,5%.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-pre2-14","ch":"obst-A1","av":"A1","q":"Cite 5 drogas categoria X.","a":"Talidomida, isotretinoína, warfarina, metotrexato, sinvastatina.","sec":"obst/resumos/3","w":"4. Pré-natal II: exames, infecções, suplementos e vacinas"},{"id":"ci-an-venosos-L6","ch":"cirurgia-A1","av":"A1","q":"O que o opioide faz com MAC, MAC-BAR e MAC-awake?","a":"Reduz MAC e MAC-BAR; quase não muda a MAC-awake.","sec":"cirurgia/resumos/9/6/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · MAC, MAC-awake e MAC-BAR · slides 20, 26–28"},{"id":"of-crist-05","ch":"oftalmo-A1","av":"A1","q":"Por que o idoso com catarata pode voltar a ler sem óculos?","a":"A catarata nuclear causa miopização, que compensa a presbiopia.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-14","ch":"otorrino-A1","av":"A1","q":"Qual o tratamento da OMA segundo a aula?","a":"Analgésico e antitérmico; amoxicilina 50 mg/kg/dia por 10 dias (alternativas: amoxicilina com clavulanato, cefalosporinas, macrolídeos); prednisolona e tratamento das comorbidades.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-06","ch":"gineco-A1","av":"A1","q":"Qual o método de escolha para diagnosticar mioma?","a":"Ultrassonografia.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-01","ch":"obst-A1","av":"A1","q":"Defina atitude, situação, posição e apresentação.","a":"Atitude: relação das partes fetais entre si (flexão generalizada). Situação: maior eixo fetal × maior eixo uterino (longitudinal, transversa, oblíqua). Posição: dorso fetal × lado materno (direita/esquerda; na transversa, anterior/posterior). Apresentação: polo fetal que ocupa o estreito superior (cefálica, pélvica, córmica).","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L7","ch":"cirurgia-A1","av":"A1","q":"Quais as três fases da anestesia geral?","a":"Indução, manutenção e recuperação, com suporte de vida e monitorização.","sec":"cirurgia/resumos/9/7/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Anestesia geral: as fases · slide 21"},{"id":"of-crist-06","ch":"oftalmo-A1","av":"A1","q":"Quais os sintomas da catarata?","a":"Visão embaçada e indolor, bilateral e assimétrica, miopia nova, perda de contraste, alteração de cores e sensibilidade ao brilho (glare).","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-15","ch":"otorrino-A1","av":"A1","q":"Quais as complicações da OMA e as da otite serosa crônica?","a":"OMA: perfuração timpânica, paralisia facial periférica, meningite e mastoidite. Serosa crônica: timpanoesclerose e retrações timpânicas.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-07","ch":"gineco-A1","av":"A1","q":"Qual mioma causa mais sangramento e infertilidade?","a":"Submucoso.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-02","ch":"obst-A1","av":"A1","q":"Qual o diâmetro da cabeça fletida e por que a flexão é vantajosa?","a":"Suboccipitobregmático, 9,5 cm, o menor diâmetro anteroposterior da cabeça; a flexão substitui o occipitofrontal (12 cm) por ele.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L8","ch":"cirurgia-A1","av":"A1","q":"Quais as três classificações da anestesia geral?","a":"Inalatória, venosa total e balanceada.","sec":"cirurgia/resumos/9/8/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Classificação e anestesia balanceada · slides 22–25, 29–31"},{"id":"of-crist-07","ch":"oftalmo-A1","av":"A1","q":"Como se diferenciam catarata imatura e madura?","a":"Imatura: perda parcial da AV e reflexo vermelho presente. Madura: AV menor que 20/400, leucocoria, cristalino todo opaco.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-16","ch":"otorrino-A1","av":"A1","q":"Como é a otite média serosa crônica?","a":"Secreção na orelha média por mais de 30 dias, sem dor e sem febre, com hipoacusia e membrana alterada (\"glue ear\").","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-08","ch":"gineco-A1","av":"A1","q":"O que é a síndrome de Meigs?","a":"Tumor benigno de ovário (fibroma) com ascite e derrame pleural.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-03","ch":"obst-A1","av":"A1","q":"Quais os diâmetros e pontos de referência das deflexões de 1º, 2º e 3º graus?","a":"1º grau, bregma: occipitofrontal 12 cm, referência bregma. 2º grau, fronte: occipitomentoniano 13,5 cm, referência glabela (raiz do nariz). 3º grau, face: submentobregmático 9,5 cm, referência mento.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L9","ch":"cirurgia-A1","av":"A1","q":"Qual a diferença entre farmacocinética e farmacodinâmica?","a":"Cinética: o corpo faz com o fármaco; dinâmica: o fármaco faz com o corpo.","sec":"cirurgia/resumos/9/9/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Farmacocinética e farmacodinâmica · slides 32–33"},{"id":"of-crist-08","ch":"oftalmo-A1","av":"A1","q":"O que é a catarata morganiana?","a":"Catarata hipermatura com córtex liquefeito e núcleo solto dentro da cápsula.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-17","ch":"otorrino-A1","av":"A1","q":"Quais as indicações de timpanotomia com tubo de ventilação e quanto tempo ele fica?","a":"Sem resolução em até 90 dias, alteração auditiva (audiometria/timpanometria) ou mais de 4 episódios por ano ou 3 em 6 meses; associar adenoidectomia; o tubo fica 6 a 8 meses.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-09","ch":"gineco-A1","av":"A1","q":"Por quanto tempo pode-se usar análogo de GnRH e por quê?","a":"No máximo 6 meses, pelo risco de osteoporose (menopausa química).","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-04","ch":"obst-A1","av":"A1","q":"Diferencie assinclitismo anterior e posterior.","a":"Anterior (Nägele): parietal anterior desce primeiro, sutura sagital perto do sacro. Posterior (Litzmann): parietal posterior desce primeiro, sutura sagital perto do púbis.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L10","ch":"cirurgia-A1","av":"A1","q":"Fentanil é mais potente ou mais eficaz que a morfina?","a":"Mais potente; a eficácia (teto) é a mesma.","sec":"cirurgia/resumos/9/10/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Potência × eficácia · slides 34–35, 37"},{"id":"of-crist-09","ch":"oftalmo-A1","av":"A1","q":"Qual é a indicação atual da cirurgia de catarata?","a":"Quando a baixa visual prejudica as atividades diárias (antigamente se esperava a catarata madura).","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-otites-18","ch":"otorrino-A1","av":"A1","q":"Como diferenciar OMC simples de colesteatomatosa e como tratar cada uma?","a":"Simples: perda condutiva ou mista, indolor; miringoplastia ou timpanoplastia. Colesteatomatosa: otorreia crônica fétida, alterações na TC, risco de complicações; timpanomastoidectomia.","sec":"otorrino/resumos/2","w":"Otologia · Otites"},{"id":"7-neoplasias-do-corpo-uterin-10","ch":"gineco-A1","av":"A1","q":"Cite as indicações de tratamento invasivo do mioma.","a":"SUA refratário, anemia, suspeita de malignidade, crescimento pós-menopausa, dor/compressão, infertilidade.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-05","ch":"obst-A1","av":"A1","q":"O que é o plano 0 de DeLee e a que plano de Hodge corresponde?","a":"A linha das espinhas isquiáticas (biespinha); corresponde ao III plano de Hodge.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L11","ch":"cirurgia-A1","av":"A1","q":"Dê um exemplo de agonista parcial e de antagonista opioide.","a":"Buprenorfina (parcial) e naloxona (antagonista).","sec":"cirurgia/resumos/9/11/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Agonista total, parcial e antagonista · slides 38–39"},{"id":"of-crist-10","ch":"oftalmo-A1","av":"A1","q":"Para que servem a biometria e a microscopia especular no pré-operatório?","a":"Biometria (modo A): calcular a lente intraocular. Microscopia especular: avaliar o endotélio da córnea.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-01","ch":"otorrino-A1","av":"A1","q":"Como é dividida a pirâmide nasal?","a":"Terço superior ósseo (ossos nasais e processo frontal da maxila) e dois terços inferiores cartilaginosos.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-11","ch":"gineco-A1","av":"A1","q":"Mioma submucoso com desejo de gestar: conduta?","a":"Miomectomia histeroscópica.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-06","ch":"obst-A1","av":"A1","q":"O que significa OEA?","a":"Apresentação cefálica fletida (O = occipital, referência lambda) com o lambda voltado para a esquerda (E) e anterior (A) da pelve materna.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L12","ch":"cirurgia-A1","av":"A1","q":"Dor 9/10 no pós-operatório de laparotomia, estável: o que fazer?","a":"Morfina IV titulada; fentanil é 80 a 100 vezes mais potente que ela.","sec":"cirurgia/resumos/9/12/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · A escala de potência dos analgésicos · slide 36"},{"id":"of-crist-11","ch":"oftalmo-A1","av":"A1","q":"Compare facoemulsificação e extracapsular.","a":"Faco: incisão de 2 a 4 mm, núcleo fragmentado por ultrassom e aspirado. Extracapsular: incisão de 10 a 14 mm, núcleo removido em bloco.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-02","ch":"otorrino-A1","av":"A1","q":"Quais são os quatro pares de seios paranasais e para onde drenam predominantemente?","a":"Frontal, etmoidal, esfenoidal e maxilar; drenam sobretudo para o meato médio (complexo ostiomeatal).","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-12","ch":"gineco-A1","av":"A1","q":"Limite da miomectomia laparoscópica no slide?","a":"Miomas < 5 cm, até 5 miomas.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-07","ch":"obst-A1","av":"A1","q":"Defina as três conjugatas e a relação entre elas.","a":"Vera anatômica: borda superior da sínfise ao promontório, 11 cm. Vera obstétrica: face interna da sínfise ao promontório, ~10,5 cm (a que importa). Diagonal: borda inferior do púbis ao promontório, 12 cm (medida no toque). Obstétrica = diagonal − 1,5 cm.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L13","ch":"cirurgia-A1","av":"A1","q":"Qual estímulo exige mais opioide: incisão ou intubação?","a":"A intubação traqueal.","sec":"cirurgia/resumos/9/13/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Cada estímulo pede uma dose · slide 40"},{"id":"of-crist-12","ch":"oftalmo-A1","av":"A1","q":"Cite as complicações operatórias e pós-operatórias da cirurgia de catarata.","a":"Operatórias: ruptura da cápsula posterior com núcleo no vítreo e hemorragia. Pós: endoftalmite, edema macular cistoide, LIO mal posicionada e ceratopatia bolhosa.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-03","ch":"otorrino-A1","av":"A1","q":"Quais seios paranasais já existem ao nascimento?","a":"Maxilar e etmoidal; por isso contam para sinusite já na infância.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-13","ch":"gineco-A1","av":"A1","q":"Qual o risco da embolização?","a":"Isquemia ovariana com menopausa precoce.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-08","ch":"obst-A1","av":"A1","q":"Qual o menor diâmetro da pelve?","a":"O biespinha ciática (transverso do estreito médio), 10 cm.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L14","ch":"cirurgia-A1","av":"A1","q":"O que é sinergismo?","a":"Efeito da combinação maior que a soma; ex.: midazolam + fentanil.","sec":"cirurgia/resumos/9/14/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Sinergismo: midazolam + fentanil · slide 41"},{"id":"of-crist-13","ch":"oftalmo-A1","av":"A1","q":"Qual a principal doença associada à catarata congênita e como ela é diagnosticada?","a":"Rubéola; reflexo vermelho com o oftalmoscópio a 20 cm (obrigatório no RN) e lâmpada de fenda.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-04","ch":"otorrino-A1","av":"A1","q":"Quando o seio frontal e o esfenoidal completam o desenvolvimento?","a":"Frontal: latente até 5 anos, cresce até o fim da adolescência. Esfenoidal: completa aos 7 anos.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-14","ch":"gineco-A1","av":"A1","q":"Gestante com dor aguda sobre mioma conhecido: hipótese?","a":"Degeneração vermelha.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-09","ch":"obst-A1","av":"A1","q":"Cite os tipos de pelve e qual é a mais favorável.","a":"Ginecoide (50%, arredondada, favorável), androide (20%, triangular, distócica), antropoide (25%, maior diâmetro AP), platipeloide (5%, achatada AP).","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L15","ch":"cirurgia-A1","av":"A1","q":"Que íon passa pelo GABA-A e quais hipnóticos se ligam nele?","a":"Cloreto; propofol, etomidato, barbitúricos e benzodiazepínicos.","sec":"cirurgia/resumos/9/15/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Indução: os hipnóticos e o receptor GABA-A · slides 42–43"},{"id":"of-crist-14","ch":"oftalmo-A1","av":"A1","q":"Qual o tratamento da catarata congênita e por que deve ser precoce?","a":"Lensectomia com vitrectomia anterior; precoce para evitar ambliopia.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-05","ch":"otorrino-A1","av":"A1","q":"Quais artérias nasais vêm da carótida interna e quais da externa?","a":"Interna (via oftálmica): etmoidais anterior e posterior. Externa: esfenopalatina e palatina maior (via maxilar interna) e labial superior (via facial).","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-15","ch":"gineco-A1","av":"A1","q":"Tríade da adenomiose?","a":"SUA, dismenorreia progressiva e útero aumentado.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-10","ch":"obst-A1","av":"A1","q":"Cite os tempos principais do mecanismo de parto e os acessórios.","a":"Insinuação (+ flexão), descida (+ rotação interna), desprendimento (+ deflexão), restituição (+ livramento dos ombros).","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-venosos-L16","ch":"cirurgia-A1","av":"A1","q":"Qual BNM desencadeia hipertermia maligna e qual o hipnótico do trauma instável?","a":"Succinilcolina (tratar com dantroleno); cetamina.","sec":"cirurgia/resumos/9/16/ci-an-venosos","w":"Anestesiologia · Anestesia geral e anestésicos venosos · Complemento: os agentes venosos e os bloqueadores que caem · slide 42"},{"id":"of-crist-15","ch":"oftalmo-A1","av":"A1","q":"Qual a principal causa de catarata unilateral em jovens e de catarata secundária?","a":"Trauma (catarata traumática); uveíte anterior crônica é a causa mais comum de catarata secundária.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-06","ch":"otorrino-A1","av":"A1","q":"O que é a área de Kiesselbach?","a":"O plexo de Little: anastomose das artérias do septo anterior, principal sítio de epistaxe.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"7-neoplasias-do-corpo-uterin-16","ch":"gineco-A1","av":"A1","q":"Mecanismo comum dos fatores de risco do câncer de endométrio?","a":"Estrogênio sem oposição de progesterona.","sec":"gineco/resumos/6","w":"7. Neoplasias do corpo uterino: mioma, pólipo, adenomiose e endométrio"},{"id":"ob-mec-11","ch":"obst-A1","av":"A1","q":"Por que ocorre a rotação interna?","a":"Para levar a sutura sagital ao diâmetro anteroposterior do estreito inferior, que é o maior da saída; o occipital vai para o púbis (OP).","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-locais-L0","ch":"cirurgia-A1","av":"A1","q":"Quais as duas palavras-chave do conceito de anestésico local?","a":"Bloqueio reversível e localizado dos impulsos aferentes, sobretudo dolorosos.","sec":"cirurgia/resumos/10/0/ci-an-locais","w":"Anestesiologia · Anestésicos locais · O que é um anestésico local · slides 2, 6"},{"id":"of-crist-16","ch":"oftalmo-A1","av":"A1","q":"Para onde subluxa o cristalino em Marfan, Weill-Marchesani e homocistinúria?","a":"Marfan: para cima, bilateral e simétrica. Weill-Marchesani: inferior, com microesferofacia. Homocistinúria: para baixo, por volta dos 10 anos.","sec":"oftalmo/resumos/3","w":"Oftalmologia · Distúrbios do cristalino"},{"id":"or-rino-07","ch":"otorrino-A1","av":"A1","q":"Que fibras chegam ao gânglio esfenopalatino e o que ele inerva?","a":"Parassimpáticas pelo nervo vidiano (facial, petroso superficial maior) e simpáticas do plexo carotídeo; inervação secretomotora das glândulas nasais e lacrimais.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-01","ch":"gineco-A1","av":"A1","q":"Por que a nuliparidade aumenta o risco de câncer de mama (aula)?","a":"A mama só amadurece após a primeira gestação a termo; células ductais imaturas são menos resistentes.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-mec-12","ch":"obst-A1","av":"A1","q":"Qual o ponto de apoio (hipomóclio) no desprendimento da cabeça fletida?","a":"A região suboccipital apoiada sob a sínfise púbica; a cabeça sai por deflexão.","sec":"obst/resumos/4","w":"5. Mecanismo de parto"},{"id":"ci-an-locais-L1","ch":"cirurgia-A1","av":"A1","q":"Quais as três partes da molécula?","a":"Anel benzeno lipofílico, cadeia intermediária (éster ou amida) e amina hidrofílica.","sec":"cirurgia/resumos/10/1/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Estrutura química: uma base fraca em três partes · slide 3"},{"id":"or-rino-08","ch":"otorrino-A1","av":"A1","q":"Qual é o epitélio da cavidade nasal e para onde o clearance mucociliar leva o muco?","a":"Colunar pseudoestratificado ciliado (ciliadas, caliciformes e basais); leva o muco para a rinofaringe.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-02","ch":"gineco-A1","av":"A1","q":"Tratamento da mastalgia intensa segundo a aula?","a":"Tamoxifeno.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-01","ch":"obst-A1","av":"A1","q":"Quais são os quatro períodos clínicos do parto e onde cada um começa e termina?","a":"1º dilatação: início da fase ativa até 10 cm. 2º expulsivo: 10 cm até a saída do feto. 3º dequitação: saída do feto até a saída da placenta. 4º Greenberg: 1ª hora após a dequitação.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L2","ch":"cirurgia-A1","av":"A1","q":"Onde são metabolizados ésteres e amidas?","a":"Ésteres no plasma (pseudocolinesterase, PABA alergênico); amidas no fígado (P450).","sec":"cirurgia/resumos/10/2/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Ésteres e amidas · slides 4–5"},{"id":"or-rino-09","ch":"otorrino-A1","av":"A1","q":"Por que \"sinusite\" passou a se chamar \"rinossinusite\"?","a":"Porque nariz e seios têm a mesma mucosa respiratória, contínua pelos óstios: a doença raramente fica restrita a um só.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-03","ch":"gineco-A1","av":"A1","q":"Descarga láctea bilateral em uso de antipsicótico: conduta?","a":"Dosar prolactina e TSH, pesquisar medicamentos (sem suspender automaticamente).","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-02","ch":"obst-A1","av":"A1","q":"Como diferenciar fase latente de fase ativa?","a":"Latente: contrações fracas/irregulares sem dilatação progressiva (~8 h). Ativa: 2 contrações em 10 min regulares com modificação do colo, a partir de 4 cm (slide; ACOG 6 cm, OMS 5 cm).","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L3","ch":"cirurgia-A1","av":"A1","q":"Qual forma atravessa a membrana e qual bloqueia o canal?","a":"A não ionizada atravessa; a ionizada bloqueia o canal de sódio por dentro.","sec":"cirurgia/resumos/10/3/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Mecanismo de ação: o canal de sódio por dentro · slides 7–8"},{"id":"or-rino-10","ch":"otorrino-A1","av":"A1","q":"Cite as seis funções do nariz.","a":"Filtração, aquecimento, umidificação, olfato, ressonância e ciclo nasal.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-04","ch":"gineco-A1","av":"A1","q":"Quando pedir mamografia na descarga ceroláctea?","a":"Só se > 50 anos e nunca fez.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-04","ch":"obst-A1","av":"A1","q":"Qual a velocidade esperada de dilatação na fase ativa?","a":"Primigestas 1 cm/h (0,8–1 com analgesia); multíparas 1,2–1,5 cm/h (1–1,2 com analgesia).","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L4","ch":"cirurgia-A1","av":"A1","q":"Como o impulso se propaga no axônio mielinizado?","a":"Saltando de nódulo de Ranvier em nódulo (condução saltatória).","sec":"cirurgia/resumos/10/4/ci-an-locais","w":"Anestesiologia · Anestésicos locais · O nervo e a condução do impulso · slides 9–11"},{"id":"or-rino-11","ch":"otorrino-A1","av":"A1","q":"Qual o exame de imagem de escolha para o complexo ostiomeatal e quando preferir a RNM?","a":"TC dos seios da face; RNM para partes moles, base do crânio e órbita.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-05","ch":"gineco-A1","av":"A1","q":"Descarga sanguinolenta unilateral: causa provável e conduta?","a":"Papiloma intraductal; encaminhar ao mastologista para biópsia.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-05","ch":"obst-A1","av":"A1","q":"Como difere o apagamento na primípara e na multípara?","a":"Primípara: apaga primeiro, depois dilata. Multípara: apaga e dilata ao mesmo tempo.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L5","ch":"cirurgia-A1","av":"A1","q":"Qual fibra é bloqueada primeiro e qual função some por último?","a":"Simpáticas (B) primeiro; propriocepção profunda por último.","sec":"cirurgia/resumos/10/5/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Tipos de fibra e a sequência do bloqueio · slides 12–14"},{"id":"or-rino-12","ch":"otorrino-A1","av":"A1","q":"Qual queixa nasal é sinal de alerta para complicação infecciosa dos seios?","a":"Edema da face.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-06","ch":"gineco-A1","av":"A1","q":"Puérpera com febre, dor e abaulamento mamário: conduta?","a":"Compressa fria e esvaziamento da mama; manter a amamentação.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-06","ch":"obst-A1","av":"A1","q":"Quais condutas são recomendadas e quais são proscritas no 1º período?","a":"Recomendadas: deambulação, dieta leve, alívio não farmacológico, analgesia a pedido, BCF 30/30 min (sonar) ou CTG contínua no alto risco. Quando indicadas: amniotomia, ocitocina. Proscritas de rotina: tricotomia, enteroclisma.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L6","ch":"cirurgia-A1","av":"A1","q":"O que determina potência, latência e duração?","a":"Lipossolubilidade, pKa e ligação proteica, respectivamente.","sec":"cirurgia/resumos/10/6/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Propriedades físico-químicas: potência, latência e duração · slides 15–16"},{"id":"or-rino-13","ch":"otorrino-A1","av":"A1","q":"Como a ARIA classifica a rinite alérgica?","a":"Frequência: intermitente ou persistente. Gravidade: leve ou moderada/grave.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-07","ch":"gineco-A1","av":"A1","q":"Diabética com abscesso mamário: conduta?","a":"Antibiótico (cefalexina/amoxicilina/clindamicina), drenagem do abscesso e controle do diabetes.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-07","ch":"obst-A1","av":"A1","q":"Qual a duração máxima do expulsivo segundo o slide e com que frequência se ausculta o BCF?","a":"Até 2 h em primíparas e 1 h em multíparas, +1 h com analgesia. BCF de 5 em 5 minutos.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L7","ch":"cirurgia-A1","av":"A1","q":"Como se chama a anestesia venosa regional?","a":"Anestesia de Bier.","sec":"cirurgia/resumos/10/7/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Vias de administração · slide 17"},{"id":"or-rino-14","ch":"otorrino-A1","av":"A1","q":"Quais os critérios diagnósticos e os sinais de exame da rinite alérgica?","a":"Diagnóstico clínico com início precoce (5 a 20 anos), IgE específica positiva (sangue ou pele) e citologia com eosinófilos; olheiras alérgicas, prega periorbitária, prega nasal transversa (saudação alérgica) e respiração bucal.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-08","ch":"gineco-A1","av":"A1","q":"Mastite do tabagista: onde ocorre e o que pode exigir?","a":"Seios lactíferos (subareolar recidivante); pode exigir amputação de papila.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-08","ch":"obst-A1","av":"A1","q":"Por que as posições verticais ajudam no expulsivo?","a":"Gravidade, contrações mais eficazes, puxo melhor, retropulsão do cóccix (aumenta o estreito inferior) e não comprimem a cava.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L8","ch":"cirurgia-A1","av":"A1","q":"Qual bloqueio absorve mais e qual absorve menos?","a":"Intercostal absorve mais; subcutâneo, menos (depois da via IV e traqueal).","sec":"cirurgia/resumos/10/8/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Absorção sistêmica: onde injetou importa · slides 18–19, 22"},{"id":"or-rino-15","ch":"otorrino-A1","av":"A1","q":"O que diferencia a rinite não alérgica da alérgica?","a":"Não é mediada por IgE (IgE total e específica negativas), começa mais tarde e tem mais neutrófilos na citologia.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-09","ch":"gineco-A1","av":"A1","q":"Compressa quente trata abscesso mamário?","a":"Não; é preciso drenar.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-09","ch":"obst-A1","av":"A1","q":"O que é a manobra de Kristeller e por que não fazer?","a":"Pressão no fundo uterino durante o expulsivo; sem benefício e com risco de ruptura uterina, lesão perineal grave e trauma fetal.","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L9","ch":"cirurgia-A1","av":"A1","q":"Onde a adrenalina é proibida?","a":"Circulação terminal: dedo, pênis, ponta do nariz e orelha.","sec":"cirurgia/resumos/10/9/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Adjuvantes: bicarbonato e adrenalina · slides 20–21, 23"},{"id":"or-rino-16","ch":"otorrino-A1","av":"A1","q":"Quais alterações faciais a respiração bucal crônica causa na criança?","a":"Face alongada, mandíbula retrognata, palato ogival e más oclusões dentárias.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-10","ch":"gineco-A1","av":"A1","q":"Prurido mamilar unilateral aos 50 anos: conduta?","a":"Corticoide tópico 30 dias; sem melhora, biópsia (Paget).","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-11","ch":"obst-A1","av":"A1","q":"Quais os 4 T da hemorragia pós-parto?","a":"Tônus (atonia, a principal), trauma (lacerações), tecido (restos placentários), trombina (coagulopatia).","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L10","ch":"cirurgia-A1","av":"A1","q":"Quantos mg/mL tem a lidocaína 2%?","a":"20 mg/mL (porcentagem × 10).","sec":"cirurgia/resumos/10/10/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Apresentações comerciais e a conta de mg/mL · slides 24, 26–27"},{"id":"or-rino-17","ch":"otorrino-A1","av":"A1","q":"Na tabela da aula, em quais rinites o anticolinérgico é +++?","a":"Infecciosas, do idoso e gustativa.","sec":"otorrino/resumos/3","w":"Rinologia · Anatomia, fisiologia e rinites"},{"id":"8-mastologia-11","ch":"gineco-A1","av":"A1","q":"BI-RADS 3: características e conduta (slide)?","a":"Margens circunscritas, eixo paralelo à pele; controle semestral.","sec":"gineco/resumos/7","w":"8. Mastologia"},{"id":"ob-parto-12","ch":"obst-A1","av":"A1","q":"O que é o globo de segurança de Pinard?","a":"O útero firmemente contraído após a dequitação (contração uterina fixa), que garante a hemostasia por miotamponagem (ligaduras vivas).","sec":"obst/resumos/5","w":"6. Assistência ao parto"},{"id":"ci-an-locais-L11","ch":"cirurgia-A1","av":"A1","q":"Dose máxima de lidocaína sem e com adrenalina?","a":"5 mg/kg sem e 7 mg/kg com.","sec":"cirurgia/resumos/10/11/ci-an-locais","w":"Anestesiologia · Anestésicos locais · Doses máximas · slides 25, 28"},{"id":"or-sinus-01","ch":"otorrino-A1","av":"A1","q":"O que é rinossinusite
