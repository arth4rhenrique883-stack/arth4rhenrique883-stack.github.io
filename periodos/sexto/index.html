<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sexto Período</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Sexto Período (Bruna Rossi). Leitura limpa: uma página por tela, texto grande, cor viva de cada matéria. */
:root{
  --bg:#FBFAFE;--card:#FFFFFF;--line:#E9E5F2;--text:#24212E;--mute:#6B6680;--soft-bg:#F4F1FA;
  --c1:#8B5CF6;--c2:#EC4899;--c-soft:#F3EEFF;--c-ink:#6D28D9;
  --aula-bg:#FFF6BF;--aula-ln:#F5C518;--aula-ink:#7A5B00;
  --prova-bg:#FFE6EC;--prova-ln:#F43F5E;--prova-ink:#BE123C;
  --atual-bg:#DDF7F2;--atual-ln:#14B8A6;--atual-ink:#0F766E;
  --div-bg:#FFF0D9;--div-ln:#F59E0B;--div-ink:#B45309;
  --cx:#0284C7;--ok:#16A34A;--ok-bg:#E3F8EA;--bad:#E11D48;--bad-bg:#FFE6EC;
  /* usados pelo desenho dos doutores */
  --v-bg:#FFF;--v-ol:rgba(0,0,0,.25);--v-coat:#F4F4F8;--v-coat-ln:#C9C6D6;--accent:var(--c1);--blue:#38BDF8;--red:#E11D48;--red-ink:#9F1239;--f-mono:ui-monospace,monospace;
  --shadow:0 1px 2px rgba(40,20,80,.06),0 6px 22px rgba(40,20,80,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13111A;--card:#1D1A27;--line:#2E2A3C;--text:#EEEBF5;--mute:#A49FB8;--soft-bg:#221E2E;
  --c-soft:color-mix(in srgb,var(--c1) 16%,#1D1A27);--c-ink:color-mix(in srgb,var(--c1) 55%,#fff);
  --aula-bg:#3A3215;--aula-ln:#E8B923;--aula-ink:#FCE38A;--prova-bg:#3D1722;--prova-ln:#FB7185;--prova-ink:#FDA4AF;
  --atual-bg:#123532;--atual-ln:#2DD4BF;--atual-ink:#99F6E4;--div-bg:#3A2A12;--div-ln:#FBBF24;--div-ink:#FCD34D;
  --cx:#38BDF8;--ok-bg:#12321F;--bad-bg:#3D1722;--v-bg:#2A2638;--v-ol:rgba(0,0,0,.5);--v-coat:#3A3650;--v-coat-ln:#55506C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111A;--card:#1D1A27;--line:#2E2A3C;--text:#EEEBF5;--mute:#A49FB8;--soft-bg:#221E2E;
  --c-soft:color-mix(in srgb,var(--c1) 16%,#1D1A27);--c-ink:color-mix(in srgb,var(--c1) 55%,#fff);
  --aula-bg:#3A3215;--aula-ln:#E8B923;--aula-ink:#FCE38A;--prova-bg:#3D1722;--prova-ln:#FB7185;--prova-ink:#FDA4AF;
  --atual-bg:#123532;--atual-ln:#2DD4BF;--atual-ink:#99F6E4;--div-bg:#3A2A12;--div-ln:#FBBF24;--div-ink:#FCD34D;
  --cx:#38BDF8;--ok-bg:#12321F;--bad-bg:#3D1722;--v-bg:#2A2638;--v-ol:rgba(0,0,0,.5);--v-coat:#3A3650;--v-coat-ln:#55506C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);color-scheme:dark}
/* paleta de cada matéria */
[data-cor="neuro"]{--c1:#8B5CF6;--c2:#EC4899}
[data-cor="cardio"]{--c1:#F43F5E;--c2:#FB923C}
[data-cor="reumato"]{--c1:#14B8A6;--c2:#84CC16}
[data-cor="pneumo"]{--c1:#0EA5E9;--c2:#22D3EE}
[data-cor="pato"]{--c1:#F59E0B;--c2:#FACC15}
[data-cor="aps"]{--c1:#22C55E;--c2:#10B981}
[data-cor="psiq"]{--c1:#6366F1;--c2:#3B82F6}
[data-cor="home"]{--c1:#7C3AED;--c2:#F97316}
:root:not([data-theme="dark"]) [data-cor="cardio"]{--c-soft:#FFEFF1;--c-ink:#BE123C}
:root:not([data-theme="dark"]) [data-cor="neuro"]{--c-soft:#F3EEFF;--c-ink:#6D28D9}
:root:not([data-theme="dark"]) [data-cor="reumato"]{--c-soft:#E3FAF5;--c-ink:#0F766E}
:root:not([data-theme="dark"]) [data-cor="pneumo"]{--c-soft:#E3F4FD;--c-ink:#0369A1}
:root:not([data-theme="dark"]) [data-cor="pato"]{--c-soft:#FEF3D7;--c-ink:#B45309}
:root:not([data-theme="dark"]) [data-cor="aps"]{--c-soft:#E3F8EA;--c-ink:#15803D}
:root:not([data-theme="dark"]) [data-cor="psiq"]{--c-soft:#ECEDFE;--c-ink:#4338CA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-cor]{--c-soft:color-mix(in srgb,var(--c1) 16%,#1D1A27);--c-ink:color-mix(in srgb,var(--c1) 50%,#fff)}}
:root[data-theme="dark"] [data-cor]{--c-soft:color-mix(in srgb,var(--c1) 16%,#1D1A27);--c-ink:color-mix(in srgb,var(--c1) 50%,#fff)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17.5px/1.68 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#app{min-height:100vh}
a{color:var(--c-ink)}
b,strong{font-weight:800}
h1,h2,h3{font-family:Sora,Nunito,sans-serif;line-height:1.25;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:740px;margin:0 auto;padding:0 18px}

/* barra do topo */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.top .grow{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 15px Sora,sans-serif}
.top .grow small{font:600 12.5px Nunito,sans-serif;color:var(--mute);margin-left:6px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;color:var(--text)}
.ib:hover{border-color:var(--c1)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:4px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:0 4px 4px 0;transition:width .3s}

/* início */
.hero{padding:34px 0 10px;display:flex;gap:18px;align-items:center}
.hero h1{margin:0;font-size:clamp(30px,8vw,46px);font-weight:800;background:linear-gradient(100deg,#8B5CF6,#EC4899 45%,#FB923C);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:var(--mute);font-weight:600}
.moon{flex:none;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(255,236,170,.55))}
.sec-t{font:700 13px Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:30px 0 12px}
.mat{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mat::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.mat h3{margin:4px 0 2px;font-size:22px;color:var(--c-ink)}
.mat .soon{margin:6px 0 0;color:var(--mute);font-size:14.5px}
.mat .tag{display:inline-block;font:700 12px Nunito;padding:2px 10px;border-radius:99px;background:var(--c-soft);color:var(--c-ink)}
.aul{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--c-soft);text-decoration:none;color:var(--text)}
.aul:hover{outline:2px solid var(--c1)}
.aul .t{flex:1;min-width:0}
.aul .t b{display:block;font-family:Sora;font-weight:700;font-size:16px}
.aul .t span{font-size:13.5px;color:var(--mute)}
.ring{flex:none;width:42px;height:42px}
.trio{display:flex;gap:14px;margin:6px 0 0;flex-wrap:wrap}
.trio button{border:0;background:none;padding:2px 4px;display:grid;justify-items:center;gap:2px;font:700 12.5px Nunito;color:var(--mute);border-radius:14px}
.trio .tb{display:block}
.trio .vera-av{width:64px;height:64px}
.trio-say{min-height:24px}
.trio-say .vb{margin:10px 0 0}
.trio-hint{font-size:13.5px;color:var(--mute);margin:4px 0 0}

/* capa da aula */
.cover{padding:26px 0 8px}
.cover .k{font:700 13px Sora;color:var(--c-ink);text-transform:uppercase;letter-spacing:.07em}
.cover h1{font-size:clamp(28px,7vw,40px);margin:6px 0 4px}
.cover p.sub{margin:0;color:var(--mute);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;background:linear-gradient(100deg,var(--c1),var(--c2));color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--c1) 35%,transparent)}
.btn.alt{background:var(--card);color:var(--c-ink);border:1.5px solid var(--c1);box-shadow:none}
.toc{list-style:none;margin:8px 0 30px;padding:0;counter-reset:t}
.toc a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:700}
.toc a:hover{background:var(--c-soft)}
.toc a::before{counter-increment:t;content:counter(t);flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 13px Sora;background:var(--soft-bg);color:var(--mute)}
.toc a.seen::before{content:"✓";background:var(--c1);color:#fff}
.legend{display:grid;gap:8px;margin:10px 0 6px;font-size:14.5px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{flex:none;width:14px;height:14px;border-radius:4px}

/* página */
.page{padding:22px 0 30px}
.page h2.pt{font-size:clamp(24px,6vw,31px);margin:4px 0 14px}
.page .pn{font:700 13px Sora;color:var(--c-ink);letter-spacing:.06em;text-transform:uppercase}
.page p{margin:12px 0}
.page ul{margin:10px 0;padding-left:22px}
.page li{margin:5px 0}
.page li::marker{color:var(--c1)}
.page ul.sub{margin:4px 0}
cx{display:inline-block;font:800 11px Nunito;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--cx);border-radius:99px;padding:1px 8px;vertical-align:2px;margin-right:2px}
.bx{border-radius:16px;padding:14px 16px;margin:16px 0;border-left:5px solid}
.bx .lb{display:flex;align-items:center;gap:8px;font:800 12.5px Sora;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.bx p{margin:6px 0}
.bx.aula{background:var(--aula-bg);border-color:var(--aula-ln)}
.bx.aula .lb{color:var(--aula-ink)}
.bx.prova{background:var(--prova-bg);border-color:var(--prova-ln)}
.bx.prova .lb{color:var(--prova-ink)}
.bx.atual{background:var(--atual-bg);border-color:var(--atual-ln)}
.bx.atual .lb{color:var(--atual-ink)}
.bx.div{background:var(--div-bg);border-color:var(--div-ln)}
.bx.div .lb{color:var(--div-ink)}
.bx.box{background:var(--c-soft);border-color:var(--c1)}
.bx.box .lb{color:var(--c-ink)}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.art{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font:700 13.5px Nunito;text-decoration:none;color:var(--text);line-height:1.3}
.art:hover{border-color:var(--c1);color:var(--c-ink)}
.art::after{content:"↗";font-weight:800;color:var(--c1)}
.solo{margin:10px 0}
/* faixa de slides */
.sref{display:inline;font:800 .86em/1 Sora,sans-serif;color:var(--c-ink);background:color-mix(in srgb,currentColor 12%,transparent);border:1px solid color-mix(in srgb,currentColor 45%,transparent);border-radius:6px;padding:1px 5px;margin:0 1px;cursor:pointer;vertical-align:1px}
.sref:hover,.sref:focus-visible{background:color-mix(in srgb,currentColor 22%,transparent)}
.strip{margin:6px 0 16px}
.strip .cap{font-size:13.5px;color:var(--mute);font-weight:700;margin-bottom:6px}
.strip .row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.th{flex:none;width:132px;aspect-ratio:16/9;border-radius:10px;border:1.5px solid var(--line);background-color:#fff;background-repeat:no-repeat;position:relative;padding:0}
.th:hover{border-color:var(--c1)}
.th span{position:absolute;right:4px;bottom:4px;font:800 11px Sora;background:rgba(20,16,30,.78);color:#fff;border-radius:6px;padding:0 5px}
figure.sl{margin:16px 0}
figure.sl>button{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--line);background-color:#fff;background-repeat:no-repeat;padding:0}
figure.sl figcaption{font-size:14px;color:var(--mute);margin-top:6px}
/* escreva */
.esc{margin:18px 0;padding:14px 16px 12px;border-radius:16px;background:var(--card);border:2px dashed var(--c1);position:relative}
.esc .lb{font:800 12.5px Sora;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.esc h4{margin:2px 0 2px;font:700 17px Sora}
.esc .v{font-size:14.5px;color:var(--mute);margin:0 0 4px}
.esc ol{margin:6px 0 8px;padding-left:22px;background:repeating-linear-gradient(transparent 0 29px,var(--line) 29px 30px);line-height:30px}
.esc .mk{border:1.5px solid var(--line);background:var(--soft-bg);border-radius:10px;padding:5px 12px;font-weight:800;font-size:13.5px}
.esc .mk.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* doutores */
.vb{display:flex;gap:10px;align-items:flex-start;margin:18px 0}
.vb .vera-av{width:56px;height:56px}
.vb .bubble{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:9px 14px 10px;font-size:15.5px;line-height:1.55}
.vb .who{display:block;font:800 12.5px Sora;color:var(--c-ink);margin-bottom:2px}
.vb.by-mel .who{color:#C2410C}.vb.by-thor .who{color:#475569}.vb.by-joey .who{color:#B45309}
:root[data-theme="dark"] .vb.by-thor .who{color:#CBD5E1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vb.by-thor .who{color:#CBD5E1}}
/* tabela */
.tw{overflow-x:auto;margin:14px 0;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--c-soft);color:var(--c-ink);font:700 13.5px Sora}
tr:last-child td{border-bottom:0}
/* lance e questões */
.lance{margin:26px 0 10px;padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--c-soft),var(--card));border:1.5px solid var(--c1)}
.lance .lb{font:800 12.5px Sora;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.lance .q{font-weight:800;font-size:17.5px;margin:4px 0 10px}
.lance .ask{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.lance .ask .vera-av{flex:none;width:44px;height:44px}
.lance .ask .lb small{display:block;font:700 12px Nunito;letter-spacing:0;text-transform:none;color:var(--mute)}
.lance .re,.mcq .re{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14.5px;color:var(--mute);font-style:italic}
.lance .re .vera-av,.mcq .re .vera-av{flex:none;width:34px;height:34px}
.lance .a{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ok-bg);font-weight:700}
.lance.open .a{display:block}
.mcq{margin:18px 0;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.mcq .src{font:800 12px Sora;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.mcq .st{font-weight:700;margin:6px 0 10px}
.mcq .op{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin:7px 0;font-size:16px;line-height:1.45}
.mcq .op:hover{border-color:var(--c1)}
.mcq .op b{color:var(--c-ink);margin-right:6px}
.mcq.done .op{pointer-events:none}
.mcq .op.ok{border-color:var(--ok);background:var(--ok-bg)}
.mcq .op.no{border-color:var(--bad);background:var(--bad-bg)}
.mcq .ex{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--soft-bg);font-size:15.5px}
.mcq.done .ex{display:block}
details.fc{margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px}
details.fc summary{cursor:pointer;font-weight:700}
details.fc div{margin-top:8px;color:var(--c-ink);font-weight:700}
/* navegação */
.nav{display:flex;gap:10px;justify-content:space-between;margin:26px 0 10px}
.nav a{flex:1;min-width:0}
.nav .btn,.nav .ib{width:100%;justify-content:center;height:auto;min-height:48px;padding:10px 14px;text-align:center}
.foot{font-size:13px;color:var(--mute);text-align:center;padding:24px 0 40px}
/* visor de slides */
.vw{position:fixed;inset:0;z-index:50;background:rgba(10,8,16,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.vw.on{display:flex}
.vw .sl{width:min(100%,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;background-color:#fff;background-repeat:no-repeat;border-radius:10px}
.vw .ctl{display:flex;gap:12px;align-items:center;margin-top:14px;color:#fff;font:700 15px Sora}
.vw .ctl button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;height:44px;min-width:52px;font-size:20px}
.vw .x{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;width:44px;height:44px;font-size:22px}
/* artigos */
.alist{display:grid;gap:10px;margin:14px 0 30px}
.acard{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:700;line-height:1.35}
.acard:hover{border-color:var(--c1)}
.acard .t{flex:1;min-width:0}
.acard .t small{display:block;font-weight:600;color:var(--mute);font-size:13px;margin-top:2px}
.acard .go{flex:none;font:800 13px Sora;color:#fff;background:linear-gradient(100deg,var(--c1),var(--c2));border-radius:10px;padding:7px 11px}
.vera-av .ol{stroke:var(--v-ol);stroke-width:1}
.vera-av{display:block;flex:none}
.vera-av .ol{stroke:var(--v-ol);stroke-width:1}
.vera-av.sm{width:58px;height:58px}
.vera-av.xs{width:30px;height:30px}
.vera-av.md{width:86px;height:86px}
.vera-av.m-furiosa .steam{animation:steam 1.1s ease-in-out infinite alternate}
@keyframes steam{from{transform:translateY(2px);opacity:.5}to{transform:translateY(-2px);opacity:1}}
.vera-av.m-furiosa{animation:shake .45s ease-in-out 2}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-2px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}}
.vera-av .heart{transform-box:fill-box;transform-origin:center;animation:heartUp 1.8s ease-in-out infinite}
@keyframes heartUp{0%{transform:translateY(3px) scale(.8);opacity:.4}50%{opacity:1}100%{transform:translateY(-4px) scale(1.08);opacity:.6}}
.vera-av.dog-thor{animation:thorTremble 3.4s linear infinite}
@keyframes thorTremble{0%,78%,100%{transform:none}80%{transform:translateX(-1px) rotate(-1deg)}82%{transform:translateX(1px) rotate(1deg)}84%{transform:translateX(-1px)}86%{transform:translateX(1px)}88%{transform:none}}

@keyframes earPerk{0%,84%,100%{transform:none}88%{transform:translateY(-2.5px) scaleX(1.05)}92%{transform:none}}

@keyframes earShiver{0%,100%{transform:none}25%{transform:translateY(1px) scaleX(.97)}75%{transform:translateY(.5px) scaleX(1.02)}}

@keyframes zz{0%{opacity:0;transform:translate(-2px,5px)}30%{opacity:1}100%{opacity:0;transform:translate(5px,-9px)}}

<script>
const DADOS = {"materias": [{"id": "neuro", "nome": "Neurologia", "area": "Clínica Médica", "prova": "", "cor": "neuro", "aulas": [{"id": "neuro-alzheimer", "title": "Doença de Alzheimer", "sub": "Neurologia · Prof. Leandro Cruz · 57 slides", "deck": "neuro-alz", "nsl": 57, "blocks": [{"t": "h2", "v": "Alzheimer: quem foi, quem foi a paciente"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [1, 2, 3, 4, 5], "cap": "Abertura: Alois Alzheimer, Auguste Deter e a definição"}, {"t": "ul", "v": ["<b>Alois Alzheimer<\/b> (Alemanha, 1864 a 1915) descreveu a doença em <b>3 de novembro de 1906<\/b>: \"Uma doença peculiar dos neurônios do córtex cerebral\".", "A primeira paciente foi <b>Auguste Deter<\/b> (August D.), 51 anos: <b>declínio progressivo das funções cognitivas<\/b>, sintomas focais, <b>alucinações<\/b>, ilusões e comprometimento psicossocial.", "Os desenhos originais dos <b>novelos neurofibrilares<\/b> de August D. foram feitos pelo próprio Alzheimer.", "Definição do slide: é a <b>disfunção cognitiva mais comum<\/b>, crônica, que se desenvolve <b>silenciosamente por 10 anos ou mais<\/b> até aparecerem os primeiros sintomas."]}, {"t": "box", "label": "__aula__", "v": "Depósito de β-amiloide, seguido de degeneração neurofibrilar. <b>Diagnóstico biológico<\/b> = paciente ainda assintomático + depósito de β-amiloide. <b>Para tratar<\/b>: diagnóstico clínico + biológico."}, {"t": "div", "v": "O slide e a anotação da aula refletem um debate atual. A Alzheimer's Association (critérios revisados de 2024) define a doença de Alzheimer de forma <b>biológica<\/b>: um biomarcador \"Core 1\" alterado (PET amiloide, Aβ42/40 no líquor ou p-tau217 plasmática acurada) já basta para o diagnóstico, mesmo sem sintomas. O International Working Group (2021) discorda: só chama de Alzheimer quem tem <b>biomarcador positivo e quadro clínico<\/b> compatível; o assintomático com biomarcador positivo é \"em risco\". Na prova, use a frase da aula: tratar exige clínica + biomarcador.", "src": [["Jack 2024 · Alzheimer's Association (PubMed)", "https://doi.org/10.1002/alz.13859"], ["Dubois 2021 · IWG, Lancet Neurol (PubMed)", "https://doi.org/10.1016/S1474-4422(21)00066-1"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-alzheimer-em-uma-frase", "label": "Alzheimer em uma frase", "v": "Do slide 5 e da aula.", "li": ["Disfunção cognitiva <b>mais comum<\/b>, crônica e progressiva", "Começa <b>silenciosa por 10 anos ou mais<\/b>", "Biológico: assintomático + <b>β-amiloide<\/b>; para tratar: <b>clínica + biomarcador<\/b>"]}, {"t": "lance", "q": "O que a aula exige para tratar Alzheimer?", "a": "Diagnóstico clínico + biomarcador (β-amiloide)."}, {"t": "h2", "v": "Epidemiologia"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [6], "cap": "Os números da aula"}, {"t": "ul", "v": ["Alzheimer é a <b>causa mais comum de demência<\/b> em idosos e em jovens.", "<b>80%<\/b> dos pacientes têm <b>mais de 75 anos<\/b>.<ul class=\"sub\"><li>Incidência anual de <b>0,4%<\/b> entre 65 e 74 anos; <b>7,6%<\/b> acima de 85 anos.<\/li><li>O número de portadores vai <b>dobrar em 30 anos<\/b>.<\/li><\/ul>", "<b>2/3 são mulheres<\/b> (o dobro do risco).", "Custo estimado nos EUA em 2018: US$ 277 bilhões.", "<b>Sobrevida média de 7 a 10 anos<\/b>."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que a idade pesa tanto: a incidência praticamente dobra a cada cinco anos depois dos 65. Viver mais é o maior fator de risco, e é o único que ninguém quer tirar."}, {"t": "escreva", "id": "neuro-alzheimer-w-epidemiologia", "label": "Epidemiologia", "v": "Os números do slide 6.", "li": ["Causa <b>mais comum<\/b> de demência", "<b>80%<\/b> acima de 75 anos; incidência 0,4%/ano (65-74) e 7,6% (>85)", "<b>2/3 mulheres<\/b>; sobrevida <b>7 a 10 anos<\/b>"]}, {"t": "lance", "q": "Qual a sobrevida média na doença de Alzheimer?", "a": "De 7 a 10 anos."}, {"t": "h2", "v": "Fisiopatologia: placa, emaranhado e Braak"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [7], "cap": "Placas, emaranhados e os estágios de Braak"}, {"t": "ul", "v": ["<b>Placa senil (extracelular)<\/b>: depósito de <b>Aβ 1-42<\/b>.", "<b>Emaranhados neurofibrilares (intracelulares)<\/b>: microtúbulos de <b>proteína tau fosforilada<\/b>.", "<b>Estágios de Braak<\/b> (estudo anatomopatológico ao longo do tempo):<ul class=\"sub\"><li><b>I e II<\/b>: córtex transentorrinal e entorrinal;<\/li><li><b>III e IV<\/b>: sistema límbico;<\/li><li><b>V e VI<\/b>: isocórtex (neocórtex).<\/li><\/ul>"]}, {"t": "box", "label": "__aula__", "v": "A ordem é <b>1º placa amiloide, 2º fosforilação da própria tau<\/b>. A precursora do β-amiloide é cortada por enzimas que geram o Aβ 1-42. A doença \"vai se espalhando pelo córtex\": começa como distúrbio de memória e, ao longo do tempo, progride para outros distúrbios cognitivos."}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que a memória vai primeiro: o córtex entorrinal é a porta de entrada do hipocampo. Quando os emaranhados chegam lá (Braak I e II), o paciente ainda está quase normal; quando alcançam o neocórtex (V e VI), aparecem linguagem, praxia e função executiva. A <b>tau<\/b> acompanha melhor os sintomas do que a placa."}, {"t": "box", "label": "__ref__", "v": "Braak 1991 · Acta Neuropathol (PubMed) ¦ https://doi.org/10.1007/BF00308809"}, {"t": "escreva", "id": "neuro-alzheimer-w-placa-emaranhado", "label": "Placa × emaranhado", "v": "Slide 7.", "li": ["Placa senil: <b>extracelular<\/b>, Aβ 1-42 (vem primeiro)", "Emaranhado: <b>intracelular<\/b>, tau fosforilada (vem depois)", "Braak: <b>entorrinal<\/b> (I-II) → <b>límbico<\/b> (III-IV) → <b>isocórtex<\/b> (V-VI)"]}, {"t": "lance", "q": "Onde começam os emaranhados nos estágios I e II de Braak?", "a": "No córtex transentorrinal e entorrinal."}, {"t": "h2", "v": "Fatores de risco e de proteção"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [8, 9, 10], "cap": "Hábitos que atrasam o depósito"}, {"t": "ul", "v": ["O gráfico do slide 8 mostra o risco de cada fator ao longo da vida. <b>Mais anos de escola<\/b> (6 a 15 anos) protege.", "<b>Fatores de risco modificáveis<\/b> mais associados:<ul class=\"sub\"><li><b>HAS<\/b>, hipotensão ortostática, <b>DM<\/b>, <b>TCE<\/b>, estresse, <b>depressão<\/b>, obesidade, sedentarismo e cirurgias (bypass de coronárias e enxertos);<\/li><li><b>Insônia e apneia obstrutiva do sono<\/b>;<\/li><li><b>Restrição social<\/b> e <b>déficit auditivo<\/b>.<\/li><\/ul>", "<b>Fatores de proteção<\/b>: <b>anos de educação formal<\/b>, <b>atividade física<\/b> e <b>vida social<\/b>.", "Mensagem do slide 10: <b>abordagem agressiva dos fatores de risco<\/b> para um envelhecimento cerebral saudável."]}, {"t": "box", "label": "__aula__", "v": "<b>Hábitos que retardam o depósito = prevenção.<\/b> \"Level A\" no gráfico é o nível de evidência. Criança que sofreu abuso sexual: evidência aumentando. Insônia e apneia têm <b>elemento inflamatório<\/b>. O <b>déficit auditivo tem grande impacto<\/b>: diminui a força da cognição e a atenção."}, {"t": "box", "label": "__aula__", "v": "[02:06] \"Hábitos retardam o depósito.\" A prevenção verdadeira começa na <b>infância e na adolescência<\/b>: quanto mais tempo de <b>escola formal<\/b>, melhor. Na vida adulta, tratar <b>hipertensão, obesidade, depressão e diabetes<\/b>, quanto antes melhor.<br>[04:26] Citou o estudo <b>FINGER<\/b> (e a versão latino-americana): intervenção em vários domínios ao mesmo tempo (dieta, exercício, treino cognitivo, controle vascular), com resultado melhor onde há menos acesso à saúde, como a América Latina.<br>[07:47] Evidência classe A: <b>atividade física, dieta mediterrânea e controle da pressão<\/b>. [11:14] Musculação <b>e<\/b> aeróbico.<br>[08:53] \"<b>Conversar é exercitar a memória<\/b>\": você presta atenção, registra e responde.<br>[10:14] \"<b>Perder a visão afasta das coisas; perder a audição afasta das pessoas.<\/b>\" [10:24] Dormir bem a vida toda: o sono ruim é inflamatório.<br>[05:52] A obesidade é inflamatória, e os análogos (de GLP-1) parecem ajudar na prevenção."}, {"t": "box", "label": "__ref__", "v": "Ngandu 2015 · FINGER, Lancet (PubMed) ¦ https://doi.org/10.1016/S0140-6736(15)60461-5"}, {"t": "atual", "label": "Análogos de GLP-1", "v": "Na aula, o professor citou os análogos como possível prevenção. Para quem já tem a doença, a resposta saiu: nos ensaios <b>evoke e evoke+<\/b>, a semaglutida oral por 2 anos <b>não trouxe benefício clínico<\/b> na DA inicial, mesmo baixando marcadores de inflamação. A ideia de prevenir antes dos sintomas continua sendo hipótese.", "src": [["Cummings 2026 · evoke/evoke+, J Prev Alz Dis (PubMed)", "https://doi.org/10.1016/j.tjpad.2026.100677"]]}, {"t": "atual", "label": "Lancet Commission 2024", "v": "A comissão do Lancet de 2024 lista <b>14 fatores modificáveis<\/b> que, juntos, respondem por cerca de <b>45% dos casos de demência<\/b>. Entraram dois novos: <b>LDL alto<\/b> e <b>perda visual não tratada<\/b>. Os de maior peso são a perda auditiva e o LDL alto na meia-idade.", "src": [["Livingston 2024 · Lancet Commission (PubMed)", "https://doi.org/10.1016/S0140-6736(24)01296-0"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-prevencao", "label": "Prevenção", "v": "Slides 9-10 e Lancet 2024.", "li": ["Risco: <b>HAS, DM, TCE, depressão, obesidade, sedentarismo<\/b>", "<b>Insônia/apneia<\/b>, <b>isolamento social<\/b> e <b>déficit auditivo<\/b>", "Proteção: <b>escolaridade, atividade física, vida social<\/b>"]}, {"t": "lance", "q": "Cite os três fatores de proteção do slide.", "a": "Anos de educação formal, atividade física e vida social."}, {"t": "h2", "v": "Infecções como fator de risco"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [11, 12], "cap": "Vírus e Alzheimer"}, {"t": "ul", "v": ["Infecções associadas: <b>HSV-1<\/b> (herpes simples), <b>HSV-2<\/b> e <b>VZV<\/b>.", "Os <b>ensaios com antivirais<\/b> em DA estavam em andamento quando o slide foi feito.", "O slide 12 mostra um estudo de coorte associando <b>COVID-19<\/b> a mais diagnósticos novos de Alzheimer em idosos."]}, {"t": "box", "label": "__aula__", "v": "[11:28] Algumas infecções entram na conta, e o professor puxou o assunto da <b>vacinação<\/b>."}, {"t": "atual", "label": "Vacina do herpes-zóster", "v": "Um \"experimento natural\" no País de Gales (Nature, 2025) comparou pessoas nascidas uma semana antes e uma semana depois da data de corte para a vacina. Quem foi vacinado teve <b>20% menos diagnóstico de demência<\/b> em 7 anos. É evidência emergente, não ensaio clínico, mas reforça a hipótese viral.", "src": [["Eyting 2025 · Vacina zóster e demência, Nature (PubMed)", "https://doi.org/10.1038/s41586-025-08800-x"]]}, {"t": "atual", "label": "VALAD (JAMA, 2026)", "v": "O ensaio que o slide esperava saiu: <b>valaciclovir não funcionou<\/b> em DA inicial com sorologia positiva para HSV. A cognição até piorou um pouco mais no grupo tratado, e os autores <b>não recomendam<\/b> antiviral para tratar Alzheimer. A associação com o vírus continua sendo hipótese.", "src": [["Devanand 2026 · VALAD, JAMA (PubMed)", "https://doi.org/10.1001/jama.2025.21738"], ["Wang 2022 · COVID-19 e DA, J Alzheimers Dis (PubMed)", "https://doi.org/10.3233/JAD-220717"]]}, {"t": "lance", "q": "O valaciclovir funcionou no ensaio VALAD?", "a": "Não; não é recomendado para tratar Alzheimer."}, {"t": "h2", "v": "Genética: APOE e companhia"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [13, 14, 15, 16, 17], "cap": "Herdabilidade, APOE, outros genes e genes protetores"}, {"t": "ul", "v": ["<b>DA típica<\/b>: herdabilidade de <b>60 a 80%<\/b>, mas de vários genes somados. A <b>herança mendeliana<\/b> (um gene só) é <b>rara<\/b>.", "A maioria dos estudos genéticos (80%) foi feita em brancos não hispânicos. O uso atual é identificar grupos de risco para estudar drogas modificadoras.", "<b>APOE<\/b> regula a lipoproteína que interfere na limpeza e na agregação do Aβ. Alelos:<ul class=\"sub\"><li><b>ε2<\/b> (8,4%): <b>protetor<\/b>;<\/li><li><b>ε3<\/b> (77,9%): neutro;<\/li><li><b>ε4<\/b> (13,7%): <b>maior risco<\/b>. Reduz a limpeza do amiloide e aumenta sua agregação.<\/li><li>ε4 em <b>homozigose: 10 vezes<\/b> mais chance que ε3/ε3; em <b>heterozigose: 2 a 3 vezes<\/b>.<\/li><\/ul>", "<b>Outros genes<\/b> (40 loci): mutações <b>APP, PSEN1 e PSEN2<\/b> causam as <b>formas precoces familiares (1%)<\/b>. A <b>combinação genética<\/b> explica <b>75% dos casos<\/b>. PSEN1 e 2 têm maior risco de crise convulsiva (CTCG). Também: TREM2, SORL1, PLCG2, ABI3, ABCA7.", "<b>Genes protetores<\/b>: APP A673T (Islândia), ABCA7, Klotho, a <b>mutação Christchurch<\/b> do APOE (Colômbia), que atrasou em 30 anos a doença de quem tinha PSEN1, e CCL11 (eotaxina), atraso de 10 anos."]}, {"t": "box", "label": "__aula__", "v": "Futuro: analisar a carga de β-amiloide e <b>tratar antes de os sintomas aparecerem<\/b>. Sobre o ε4: <b>não pode anticorpo monoclonal para limpar β-amiloide<\/b>, pelo risco de <b>ARIA<\/b> (chance de hemorragia cerebral)."}, {"t": "box", "label": "__aula__", "v": "[13:19] A herança mendeliana é <b>rara<\/b>; a doença é <b>multigênica<\/b>. [13:28] 80% dos estudos genéticos foram em população <b>branca<\/b>: latinos, africanos e asiáticos quase não foram estudados.<br>[15:06] \"Hoje, se eu quiser tratar com <b>droga modificadora<\/b>, preciso pelo menos da <b>genotipagem do APOE<\/b>.\" ε4 homozigoto: o anticorpo <b>não é indicado<\/b>, pelo risco de ARIA (edema e hemorragia cerebral).<br>[16:42] Contou o primeiro paciente dele em anticorpo: <b>ε4 heterozigoto<\/b>, indicado, com <b>RM de controle por protocolo<\/b> depois das primeiras doses, sem ARIA clínica.<br>[18:12] Futuro: calcular o risco genético e a carga de amiloide de cada pessoa e tratar <b>antes dos sintomas<\/b>. [20:31] Populações que resistem à doença (Colômbia, Christchurch) mostram genes protetores."}, {"t": "box", "label": "__prova__", "v": "O professor repetiu duas vezes, no meio e no fechamento da aula [16:10] [1:05:36]: <b>APOE ε4 homozigoto não pode receber anticorpo anti-amiloide<\/b>."}, {"t": "atual", "label": "APOE ε4 e anticorpos", "v": "A recomendação de uso do lecanemabe pede <b>genotipar o APOE<\/b> antes de tratar: o homozigoto ε4 tem o maior risco de ARIA. Na Europa, a EMA só autorizou o lecanemabe para quem <b>não é homozigoto ε4<\/b>.", "src": [["Cummings 2023 · Lecanemab AUR, J Prev Alz Dis (PubMed)", "https://doi.org/10.14283/jpad.2023.30"], ["Arboleda-Velasquez 2019 · APOE Christchurch, Nat Med (PubMed)", "https://doi.org/10.1038/s41591-019-0611-3"], ["Jonsson 2012 · APP A673T, Nature (PubMed)", "https://doi.org/10.1038/nature11283"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-apoe", "label": "APOE", "v": "Slides 14-15.", "li": ["<b>ε2<\/b> protege · <b>ε3<\/b> neutro · <b>ε4<\/b> risco", "ε4/ε4 = <b>10x<\/b>; ε4 heterozigoto = <b>2-3x<\/b>", "APP, PSEN1, PSEN2: forma <b>precoce familiar (1%)<\/b>", "ε4: mais <b>ARIA<\/b> com anticorpo anti-amiloide"]}, {"t": "lance", "q": "Quanto o APOE ε4 em homozigose aumenta o risco?", "a": "Cerca de 10 vezes em relação ao ε3/ε3."}, {"t": "h2", "v": "Apresentação clássica e comprometimento cognitivo leve"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [18, 19, 20, 21, 22, 23], "cap": "A forma amnéstica, os testes e o CCL"}, {"t": "ul", "v": ["<b>Apresentação clássica<\/b>: <b>amnéstica<\/b> (verbal e visual), <b>progressiva<\/b> e <b>incurável<\/b>.", "A curva do slide 19: fase <b>pré-clínica<\/b> (depósito de β-amiloide sem sintomas) → <b>CCL<\/b> (comprometimento cognitivo leve, a \"pré-demência\") → <b>demência<\/b>.", "Testes mostrados: <b>MoCA<\/b> e <b>Mini-Exame do Estado Mental<\/b> (slides 20-21) e o <b>teste do relógio<\/b> (slide 22), que avalia <b>função executiva<\/b> (escores 1-2 passam; 3 a 6 falham).", "<b>CCL forma amnéstica<\/b>, quatro perguntas:<ul class=\"sub\"><li>Houve declínio cognitivo?<\/li><li>O sintoma é consistente?<\/li><li>Os sintomas trazem impacto? É quando o paciente busca ajuda; sempre estará em algum grau. Provável mudança de critério.<\/li><li>Há alterações nos testes específicos?<\/li><\/ul>", "<b>Evolução do CCL em 2 anos<\/b>:<ul class=\"sub\"><li>progride para DA em <b>14,9%<\/b> (IC 95%: 11,6 a 19,1%);<\/li><li>com <b>Aβ positivo<\/b> no PET amiloide: <b>22,9 a 50%<\/b>;<\/li><li><b>reverte em 14 a 39%<\/b>;<\/li><li>o volume do hipocampo na RM, isolado, <b>não prediz<\/b> neurodegeneração.<\/li><\/ul>", "Slide 23: progressão dos sintomas (leve, moderada, grave) em cognitivos, psiquiátricos e não neuropsiquiátricos."]}, {"t": "box", "label": "__aula__", "v": "Principalmente <b>inicia como perda de memória<\/b>: essa é a forma clássica. Na fase grave há <b>perda da autonomia<\/b>: o paciente sabe que alguém é alguém, que tem filho, que é casado, mas não reconhece isso em ninguém."}, {"t": "box", "label": "__aula__", "v": "[22:28] O que separa CCL de demência é a <b>autonomia<\/b>. Todo idoso que diz \"estou mais esquecido\" precisa da pergunta: ainda vai ao mercado, ao banco, sozinho? [23:06] \"Foi sozinho, se perdeu e não achou o caminho de casa\": já é <b>demência leve<\/b>.<br>[24:35] \"Eu gosto muito do <b>teste do relógio<\/b>, porque ele avalia <b>função executiva<\/b>.\" Na dúvida, avaliação neuropsicológica completa.<br>[26:57] Fases: no começo esquece itens, compromissos, repete perguntas e ainda <b>percebe<\/b> o próprio déficit. Depois vem a desorientação espacial: \"não pode mais ir à padaria, porque não sabe voltar\", e a família assume. Depois, irritação, agressividade, desconfiança, perda de peso e incontinência.<br>[27:45] \"<b>O que é a doença? Perda de autonomia. Você é a sua memória; é a perda da sua história.<\/b>\"<br>[29:24] \"O paciente quer ir para casa: ele sabe que tem uma casa, mas não é aquela. Sabe que tem um filho, mas não é aquele que está na frente.\" [29:48] \"A pessoa morre muito antes de ter morrido.\""}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Demência × CCL: os dois têm declínio cognitivo medido em teste. O que separa é a <b>funcionalidade<\/b>. No CCL a pessoa ainda faz suas atividades sozinha (talvez com mais esforço); na demência, o declínio já tira a independência."}, {"t": "escreva", "id": "neuro-alzheimer-w-ccl", "label": "CCL", "v": "Slides 21-22.", "li": ["Declínio <b>consistente<\/b>, que traz <b>impacto<\/b> e aparece nos <b>testes<\/b>", "Funcionalidade <b>preservada<\/b> (na demência, não)", "2 anos: <b>14,9%<\/b> viram DA (22,9-50% se Aβ+); <b>14-39% revertem<\/b>"]}, {"t": "lance", "q": "Quanto do CCL progride para DA em 2 anos?", "a": "14,9% (22,9 a 50% se Aβ positivo)."}, {"t": "h2", "v": "CDR: a régua da gravidade"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [24], "cap": "Clinical Dementia Rating (CDR)"}, {"t": "ul", "v": ["O <b>CDR<\/b> classifica a demência em: <b>0<\/b> saudável · <b>0,5<\/b> questionável · <b>1<\/b> leve · <b>2<\/b> moderada · <b>3<\/b> grave.", "Avalia seis domínios: <b>memória<\/b>, <b>orientação<\/b>, <b>julgamento e solução de problemas<\/b>, <b>assuntos da comunidade<\/b>, <b>lar e passatempos<\/b> e <b>cuidados pessoais<\/b>."]}, {"t": "table", "head": ["Domínio", "CDR 0,5", "CDR 1", "CDR 2", "CDR 3"], "rows": [["Memória", "Esquecimento leve e consistente", "Perda moderada, mais para fatos recentes, atrapalha o dia a dia", "Perda grave; só retém material muito aprendido", "Só restam fragmentos"], ["Orientação", "Plenamente orientado", "Desorientação geográfica em outros locais", "Geralmente desorientado", "Só orientação pessoal"], ["Cuidados pessoais", "Plenamente capaz", "Precisa de ajuda ocasional", "Precisa de assistência para vestir e higiene", "Muito auxílio; geralmente incontinente"]]}, {"t": "box", "label": "__aula__", "v": "O CDR é um <b>índice de funcionalidade<\/b>. É ele que determina as drogas sintomáticas liberadas pelo <b>SUS<\/b>."}, {"t": "box", "label": "__aula__", "v": "[31:28] \"A escala CDR é exatamente um <b>índice de funcionalidade<\/b>.\" [32:02] É o formulário que o professor preenche para o remédio ser liberado: \"as drogas sintomáticas não são baratas\"."}, {"t": "p", "v": "<cx>[Complemento]<\/cx> No SUS, o Protocolo Clínico e Diretrizes Terapêuticas (PCDT) da doença de Alzheimer usa o MEEM e o CDR para liberar os remédios: inibidores da acetilcolinesterase na DA <b>leve a moderada<\/b> e memantina na <b>moderada a grave<\/b>."}, {"t": "lance", "q": "O que significa CDR 2?", "a": "Demência moderada."}, {"t": "h2", "v": "Diagnóstico diferencial: as demências tratáveis"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [25], "cap": "O que precisa ser excluído antes de chamar de Alzheimer"}, {"t": "ul", "v": ["<b>Depressão<\/b>", "<b>Déficit de B12 e de ácido fólico<\/b>", "<b>Hipotireoidismo<\/b>", "<b>HIV<\/b>", "<b>Neurossífilis<\/b>", "<b>Medicações<\/b>", "<b>Epilepsia disperceptiva<\/b>", "<b>Hidrocefalia de pressão normal (HPN)<\/b>", "<b>Alcoolismo<\/b>"]}, {"t": "box", "label": "__aula__", "v": "<b>Causas de demência TRATÁVEIS<\/b> (destacado na aula). <b>Faça sempre neuroimagem e exame de sangue.<\/b><br>Depressão = <b>pseudodemência<\/b>: aplico a escala do DSM-5; se pontua muito, dou antidepressivo e o <b>MEEM melhora já na consulta de controle<\/b>.<br>↓B12, ↓ácido fólico e ↑homocisteína: <b>anemia macrocítica<\/b>. B12 acima de 400 é o ideal. ↓Ferro: anemia microcítica.<br>Medicações: <b>remédio para dormir<\/b>. Alcoolismo: também <b>piora uma demência preexistente<\/b>.<br>HPN: <b>apraxia da marcha, incontinência urinária e alteração da memória<\/b>, frequente no idoso; o diagnóstico vem da <b>neuroimagem<\/b>."}, {"t": "box", "label": "__prova__", "v": "[32:24] O professor disse: este é o <b>slide mais importante da aula<\/b>, para quem vai ser clínico, cirurgião, qualquer médico. Nas anotações, \"causas de demência TRATÁVEIS\" está grifado. Saiba a lista e o exame que acha cada uma."}, {"t": "box", "label": "__aula__", "v": "[33:06] \"Chegou paciente esquecido: <b>neuroimagem<\/b> e <b>exame de sangue<\/b>.\" [33:31] A depressão do idoso é tão parecida com demência que se chama <b>pseudodemência<\/b>: trata e o MEEM melhora no retorno.<br>[35:42] B12 baixa muitas vezes não é só problema de estômago; a pista é a <b>anemia macrocítica<\/b> (VCM grande).<br>[36:36] <b>Remédio para dormir<\/b>: \"não é seguro\".<br>[37:58] <b>Epilepsia disperceptiva<\/b> é frequente no idoso: além de diferencial, é <b>complicador<\/b>. Quem tem atrofia cortical em evolução tem mais crises.<br>[38:44] <b>HPN<\/b>: apraxia da marcha, alteração da memória e incontinência, com ventrículo alargado. Tira líquor e o paciente <b>anda melhor<\/b>.<br>[39:26] <b>Álcool<\/b>: atrofia cerebral, neuropatia periférica e doença psiquiátrica."}, {"t": "p", "v": "<cx>[Complemento]<\/cx> O \"tira líquor e anda melhor\" é o <b>tap test<\/b>: punção lombar de alívio (30 a 50 mL). A melhora da marcha prevê boa resposta à derivação ventriculoperitoneal."}, {"t": "table", "head": ["Causa tratável", "Como achar"], "rows": [["Depressão (pseudodemência)", "Escala de depressão; melhora com antidepressivo"], ["B12 e folato baixos", "Dosagem; anemia macrocítica, homocisteína alta"], ["Hipotireoidismo", "TSH e T4 livre"], ["HIV e neurossífilis", "Sorologias (anti-HIV, VDRL/treponêmico)"], ["Medicações e álcool", "História (hipnóticos, anticolinérgicos)"], ["HPN", "Neuroimagem: ventrículos grandes; tríade marcha, urina, memória"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-demencias-trataveis", "label": "Demências tratáveis", "v": "Slide 25: exclua sempre.", "li": ["<b>Depressão<\/b> (pseudodemência)", "<b>B12/folato<\/b>, <b>hipotireoidismo<\/b>", "<b>HIV<\/b>, <b>neurossífilis<\/b>", "<b>Medicações<\/b>, <b>álcool<\/b>, <b>HPN<\/b> (marcha + urina + memória)", "Sempre: <b>neuroimagem + exames de sangue<\/b>"]}, {"t": "lance", "q": "Qual a tríade da hidrocefalia de pressão normal?", "a": "Apraxia da marcha, incontinência urinária e alteração da memória."}, {"t": "h2", "v": "Outras demências degenerativas"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [26], "cap": "Lewy, vascular, LATE e as formas focais"}, {"t": "ul", "v": ["Lista do slide: <b>demência com corpos de Lewy<\/b>, <b>vascular<\/b>, <b>LATE<\/b>, <b>afasia primária progressiva<\/b>, <b>atrofia cortical posterior<\/b>, <b>degeneração corticobasal<\/b> e <b>demência frontotemporal (DFT)<\/b>."]}, {"t": "box", "label": "__aula__", "v": "Ranking das causas: <b>1ª Alzheimer; 2ª Alzheimer + AVC (mista); 3ª AVC (vascular)<\/b>.<br><b>Lewy<\/b>: alucinação visual, flutuação cognitiva e síndrome parkinsoniana; <b>muito sensível a neuroléptico<\/b> (fica rígido).<br><b>Vascular<\/b>: o AVC é causador e comorbidade.<br><b>LATE<\/b>: tardia (85 anos ou mais), forma amnéstica pura, no idoso longevo, mais lenta.<br><b>Afasia primária progressiva<\/b>: pode ser subtipo do Alzheimer. <b>DFT<\/b>: frontotemporal, começa com alterações comportamentais."}, {"t": "box", "label": "__aula__", "v": "[40:51] Vascular: <b>vários AVCs<\/b> e também a <b>microangiopatia<\/b>; o AVC é causa e comorbidade. [41:11] Perguntou à turma: \"Primeira causa de demência? Segunda? Terceira?\" Resposta: <b>Alzheimer, mista, vascular<\/b>.<br>[41:25] LATE: depois dos <b>85<\/b>, forma <b>amnéstica pura<\/b>, que pouco evolui.<br>[42:03] Afasia primária progressiva: começa pela perda da <b>linguagem<\/b> (\"a doença do Bruce Willis\"); segundo ele, na maioria das vezes a anatomia patológica mostra Alzheimer.<br>[42:33] DFT começa pelo <b>comportamento<\/b>: lembrou o caso, do 3º período, da senhora que começou a trair o marido (desinibição)."}, {"t": "div", "v": "Dois ajustes à fala: o Bruce Willis tem <b>demência frontotemporal<\/b>, diagnosticada depois de começar com afasia. E a chance de achar Alzheimer depende da variante: <b>86 a 90% na logopênica<\/b> (slide 38), bem menos na semântica e na agramática.", "src": [["Dubois 2021 · IWG, Lancet Neurol (PubMed)", "https://doi.org/10.1016/S1474-4422(21)00066-1"]]}, {"t": "table", "head": ["Demência", "A pista"], "rows": [["Lewy", "Alucinação visual + flutuação + parkinsonismo; piora muito com neuroléptico"], ["Vascular", "AVC prévio, piora em degraus"], ["LATE", "Muito idoso (>80-85), amnésia pura e lenta"], ["Frontotemporal", "Começa pelo comportamento"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-ranking-e-lewy", "label": "Ranking e Lewy", "v": "Slide 26 e aula.", "li": ["<b>1º Alzheimer · 2º mista (DA + AVC) · 3º vascular<\/b>", "Lewy: <b>alucinação visual, flutuação, parkinsonismo<\/b>", "Lewy: <b>sensibilidade a neuroléptico<\/b>"]}, {"t": "lance", "q": "Qual a 2ª causa de demência pelo ranking da aula?", "a": "A mista: Alzheimer + AVC."}, {"t": "h2", "v": "Biomarcadores"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [27, 28, 29, 30, 31], "cap": "Para que servem, onde se dosam e quando pedir"}, {"t": "ul", "v": ["Os biomarcadores <b>expandiram o conhecimento<\/b> sobre a DA, permitem <b>diagnóstico mais precoce<\/b> e o <b>diferencial<\/b> com outras demências com mais acurácia. Ganham importância com os <b>tratamentos modificadores<\/b>.", "<b>Positivos não garantem DA. Negativos excluem DA.<\/b>", "<b>Líquor<\/b>: Aβ42 e relação <b>Aβ42/Aβ40<\/b>, <b>tau total<\/b>, <b>p-tau 181<\/b> e <b>NfL<\/b> (neurofilamento de cadeia leve: lesão neuroaxonal).", "<b>Imagem<\/b>: RM; PET-CT amiloide, tau e FDG.", "<b>Sangue<\/b>: Aβ42/40 (com idade e APOE), <b>p-tau 181 e 217 (promissor)<\/b> e NfL.", "<b>Quando pedir<\/b> (slide 31): demência <b>rapidamente progressiva<\/b>, forma <b>precoce<\/b>, <b>etiologia incerta<\/b>, paciente ou família que desejam para <b>planejamento<\/b>, e <b>tratamento com drogas modificadoras<\/b>."]}, {"t": "box", "label": "__aula__", "v": "Objetivo = <b>diagnóstico<\/b>: provar que há uma unidade de β-amiloide. O <b>NfL é inespecífico<\/b>: a ELA também aumenta o neurofilamento; todo dano que mata neurônio aumenta. Preciso de neuroimagem: a <b>RM procura tumor, hematoma e AVC<\/b> (exclui causas) e mede o volume do hipocampo; a atrofia apoia o diagnóstico, <b>mas o principal é o biomarcador<\/b>. Sangue: <b>mais barato<\/b>. E: <b>o SUS ainda não paga<\/b> biomarcador."}, {"t": "box", "label": "__aula__", "v": "[44:13] O líquor (Aβ42, Aβ42/40, tau total, p-tau) está aprovado como diagnóstico pelas academias <b>brasileira, americana e europeia<\/b>; hoje existe também no <b>sangue<\/b>.<br>[45:32] Excluiu as outras causas? \"Para fechar o diagnóstico, comprovar o biomarcador\": líquor, sangue ou PET. [45:46] O PET custa de <b>5 a 10 mil reais<\/b>.<br>[45:58] A <b>p-tau217<\/b> no sangue \"vai estar em várias aulas do congresso brasileiro\". O problema: pode dar positivo <b>até 20 anos antes<\/b> da doença. Por isso, só em quem tem <b>sintoma<\/b>. \"Esquecer a chave em casa é normal. Ficar dependente de alguém, não.\"<br>[47:25] O slide de \"quando pedir\" foi montado antes; <b>hoje, na dúvida, pede o marcador<\/b>. Só não se pede para todo mundo por causa do custo."}, {"t": "atual", "label": "Biomarcador no sangue (2025)", "v": "A diretriz da Alzheimer's Association de 2025 diz que um exame de sangue (sobretudo <b>p-tau217<\/b>) com sensibilidade ≥90% e especificidade ≥90% pode <b>substituir o PET amiloide ou o líquor<\/b> em serviço especializado de memória. Com ≥90% e ≥75%, serve de <b>triagem<\/b>. Não vale para rastrear gente sem sintoma.", "src": [["Palmqvist 2025 · Diretriz da Alzheimer's Association (PubMed)", "https://doi.org/10.1002/alz.70535"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-biomarcadores", "label": "Biomarcadores", "v": "Slides 28-31.", "li": ["Positivo <b>não garante<\/b> DA; negativo <b>exclui<\/b>", "Líquor: <b>↓Aβ42 (ou Aβ42/40), ↑tau total, ↑p-tau<\/b>; NfL inespecífico", "Pedir: <b>rápida, precoce, incerta<\/b>, planejamento, droga modificadora"]}, {"t": "lance", "q": "Biomarcador negativo faz o quê com o diagnóstico de DA?", "a": "Exclui DA."}, {"t": "h2", "v": "Exames complementares e o escore MTA"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [32, 33, 34], "cap": "RM, PET e a régua do hipocampo"}, {"t": "ul", "v": ["<b>RM<\/b>: <b>atrofia dos hipocampos<\/b>.", "<b>FDG-PET / SPECT<\/b>: <b>hipometabolismo<\/b> (PET) ou <b>hipoperfusão<\/b> (SPECT) no córtex <b>temporoparietal<\/b> e na região posterior do <b>cíngulo/pré-cúneo<\/b>.", "<b>PET amiloide + PET tau<\/b>.", "<b>Líquor<\/b>: <b>redução de Aβ1-42<\/b> e <b>aumento de tau total e tau fosforilada<\/b>.", "<b>Escore MTA<\/b> (atrofia do lobo temporal medial), na RM coronal, mede: largura da <b>fissura coroide<\/b>, largura do <b>corno temporal<\/b> do ventrículo lateral e <b>altura do hipocampo<\/b>.<ul class=\"sub\"><li><b>0<\/b>: sem líquor visível ao redor do hipocampo;<\/li><li><b>1<\/b>: fissura coroide levemente alargada;<\/li><li><b>2<\/b>: fissura moderadamente alargada, corno temporal levemente aumentado, perda leve da altura do hipocampo;<\/li><li><b>3<\/b>: alargamento acentuado da fissura, corno temporal moderado, perda moderada do hipocampo;<\/li><li><b>4<\/b>: tudo acentuado; hipocampo muito atrofiado, sem estrutura interna.<\/li><\/ul>"]}, {"t": "box", "label": "__aula__", "v": "O <b>marcador da glicose (FDG) dá boas pistas<\/b>. No MTA, a fissura entre o lobo temporal e o hipocampo vai aumentando."}, {"t": "box", "label": "__aula__", "v": "[44:37] A ressonância serve para <b>excluir<\/b> tumor, hematoma subdural, hemorragia e AVC, e para medir o hipocampo. [44:57] Hipocampo mais atrofiado que o esperado para a idade ajuda, \"mas <b>a peça que falta é sempre o biomarcador<\/b>\"."}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Na prática, MTA <b>≥2 é anormal abaixo de 75 anos<\/b> e <b>≥3 é anormal a partir de 75<\/b>, porque o hipocampo também encolhe com a idade."}, {"t": "box", "label": "__ref__", "v": "Scheltens 1992 · escore MTA, JNNP (PubMed) ¦ https://doi.org/10.1136/jnnp.55.10.967"}, {"t": "lance", "q": "Que três medidas compõem o MTA?", "a": "Fissura coroide, corno temporal e altura do hipocampo."}, {"t": "h2", "v": "Alzheimer atípico"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [35, 36, 37, 38, 39, 40, 41, 42], "cap": "As formas que não começam pela memória"}, {"t": "ul", "v": ["<b>Formas atípicas<\/b>: amnéstica precoce, <b>visuoespacial (ACP)<\/b>, <b>linguagem (APP)<\/b>, <b>comportamental/disexecutiva<\/b> e <b>motora (SCB)<\/b>.", "Características: forma amnéstica precoce (<b>antes dos 65<\/b>), <b>evolução acelerada<\/b>, atenção, linguagem, função executiva e visuoespacial. <b>Pode poupar o hipocampo<\/b>. Biomarcadores úteis. Genética desconhecida (estudo LEADS).", "<b>Visuoespacial (atrofia cortical posterior)<\/b>: <b>96% são DA<\/b>. Dificuldade de achar objetos, dirigir, organizar e se orientar (subir e descer escada). Tipos: <b>Balint<\/b> (simultanagnosia, ataxia óptica, apraxia oculomotora), <b>Gerstmann<\/b> (direita-esquerda, agnosia digital, discalculia, disgrafia), apraxia de membros e de vestir. Testes: escrever em linha e copiar desenho.", "<b>Linguagem (afasia primária progressiva)<\/b>:<ul class=\"sub\"><li><b>Logopênica: 86 a 90% DA<\/b>. Dificuldade de achar palavras, circunlóquios, erros de pronúncia.<\/li><li>Semântica: 11 a 16% DA.<\/li><li>Agramática (não fluente): 15 a 20% DA.<\/li><\/ul>", "<b>Comportamental/disexecutiva: 2% DA<\/b> (7 a 20% das DFT têm patologia de DA). Dificuldade de multitarefa e de planejar, apatia, desinibição, falta de empatia, hiperoralidade, reflexos primitivos (palmomentoniano, sucção, preensão), perseveração. Teste de Luria (slide 40).", "<b>Motora (síndrome corticobasal): 15 a 54% DA<\/b>. Síndrome rígido-acinética, apraxia de membros, mioclonias, distonia, <b>membro alienígena<\/b>, discalculia."]}, {"t": "box", "label": "__aula__", "v": "Alzheimer é a <b>maior causa de demência pré-senil<\/b> (antes dos 65)."}, {"t": "box", "label": "__aula__", "v": "[49:30] O professor passou rápido pelos slides de detalhe das formas atípicas (\"não vem ao caso\", \"só colei esses slides mais específicos\"), o que bate com o X nas anotações dos slides 37 a 42. Fique com o quadro geral: as cinco formas, o início antes dos 65 e as duas que quase sempre são Alzheimer."}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A regra para guardar: <b>logopênica<\/b> e <b>atrofia cortical posterior<\/b> são quase sempre Alzheimer. Semântica e agramática costumam ser outra doença (DFT, TDP-43, tau)."}, {"t": "box", "label": "__ref__", "v": "Dubois 2021 · IWG, Lancet Neurol (PubMed) ¦ https://doi.org/10.1016/S1474-4422(21)00066-1"}, {"t": "escreva", "id": "neuro-alzheimer-w-atipicos", "label": "Atípicos", "v": "Slides 35-38.", "li": ["Antes dos <b>65<\/b>, evolução rápida, pode <b>poupar hipocampo<\/b>", "<b>ACP (visuoespacial): 96% DA<\/b>", "<b>APP logopênica: 86-90% DA<\/b>"]}, {"t": "lance", "q": "Qual variante da afasia primária progressiva é mais ligada à DA?", "a": "A logopênica (86 a 90%)."}, {"t": "h2", "v": "LATE, PART e outras doenças do idoso muito idoso"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [43, 54, 55, 56, 57], "cap": "Quando a memória falha e não é (só) Alzheimer"}, {"t": "ul", "v": ["<b>LATE<\/b> (encefalopatia TDP-43 límbica relacionada à idade):<ul class=\"sub\"><li>pode coexistir ou não com DA;<\/li><li>demência <b>amnéstica em muito idosos (>80)<\/b>, <b>mais lenta<\/b> que a DA;<\/li><li>atinge amígdalas, hipocampo e giro frontal médio;<\/li><li><b>90% da esclerose hipocampal do idoso é LATE<\/b>;<\/li><li>hiper-homocisteinemia talvez aumente o risco: repor B12 e ácido fólico.<\/li><\/ul>", "<b>Doença dos grãos argirofílicos (AGD)<\/b>: alteração de personalidade e humor flutuante <b>antes<\/b> da memória; CCL de evolução lenta; 9,3% aos 65 e 31,3% nos centenários; comorbidade com Alzheimer.", "<b>Esclerose hipocampal<\/b> (esclerose mesial temporal): epilepsia do lobo temporal. Lobo temporal <b>esquerdo<\/b> afeta a memória <b>verbal<\/b>; o <b>direito<\/b>, a memória <b>não verbal<\/b> (visual e espacial). Politerapia com fenobarbital, primidona e fenitoína também causa lentidão e falha de memória.", "<b>PART<\/b> (tauopatia primária relacionada à idade): emaranhados de tau no lobo temporal medial <b>sem placas amiloides<\/b>. Descrita em 2014; idade mais avançada e menos disfunção cognitiva grave que a DA."]}, {"t": "box", "label": "__ref__", "v": "Nelson 2019 · LATE, Brain (PubMed) ¦ https://doi.org/10.1093/brain/awz099"}, {"t": "box", "label": "__ref__", "v": "Crary 2014 · PART, Acta Neuropathol (PubMed) ¦ https://doi.org/10.1007/s00401-014-1349-0"}, {"t": "lance", "q": "Que proteína define a LATE?", "a": "TDP-43."}, {"t": "h2", "v": "Tratamento sintomático"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [44, 45, 46], "cap": "Inibidores da acetilcolinesterase, memantina e o resto"}, {"t": "ul", "v": ["<b>DA: o tratamento é sintomático.<\/b> Interdisciplinar, com orientações.", "<b>Inibidores da acetilcolinesterase<\/b>: <b>donepezila<\/b>, <b>rivastigmina<\/b> e <b>galantamina<\/b>.", "<b>Memantina<\/b>: antagonista do receptor <b>NMDA<\/b>.", "<b>Não liberados para CCL.<\/b> Pacientes com depressão que usaram donepezila tiveram mais recorrência da depressão em 2 anos.", "<b>Memantina<\/b> (slide 45): antagonista NMDA de afinidade baixa a moderada. Efeito <b>estatisticamente significativo<\/b>, mas <b>clinicamente pequeno<\/b> na cognição, no funcionamento global e nas AVD. Análises post hoc sugerem efeito em agitação, delírios e alucinações. Efeitos colaterais leves, parecidos com o placebo.", "<b>Outros tratamentos<\/b>: <b>ácido fólico<\/b> reduz homocisteína (menos atrofia); <b>vitamina E em dose alta (2.000 UI/dia)<\/b>: melhora funcional; dieta cetogênica: impreciso; <b>dieta mediterrânea<\/b>: preserva o hipocampo e diminui o risco de demência."]}, {"t": "box", "label": "__aula__", "v": "Inibidores da acetilcolinesterase: <b>ganho sintomático<\/b> (principalmente amnéstico), melhor na <b>fase inicial<\/b>; diminuem as complicações neuropsiquiátricas e de memória nas formas moderadas e avançadas. Efeitos colaterais: <b>hipotensão postural e anorexia<\/b>.<br>Memantina: melhor para as formas <b>mais avançadas<\/b>, no paciente <b>mais agitado<\/b>. Anotado ao lado: <b>apatia<\/b>.<br>Doença já instalada: já não adianta muito a prevenção; fica tratando a memória e o paciente angustiado. Fase inicial: vida social, outras atividades, diário. Fase avançada: que o ambiente não mude, ter <b>rotina<\/b>."}, {"t": "box", "label": "__aula__", "v": "[49:51] O tratamento começa <b>sem remédio<\/b>: explicar à família a próxima fase, chamar para conversar quem cuida, organizar cuidador, transporte e dinheiro.<br>[50:55] No SUS, a liberação é pelo <b>CDR<\/b>; <b>não<\/b> se libera para CCL. O ganho do inibidor da colinesterase é <b>principalmente na memória<\/b>.<br>[51:23] Quando o paciente passa da fase inicial para a moderada, o benefício cai, \"<b>mas você não tira o remédio<\/b>\": parece diminuir as complicações neuropsiquiátricas e do sono. Usa a doença inteira.<br>[52:01] A <b>memantina<\/b> é melhor nas formas <b>avançadas<\/b>. Começa com o inibidor; na fase moderada a grave, no paciente <b>agitado<\/b>, associa a memantina. Não é a droga de início.<br>[52:25] Efeitos colaterais do inibidor da colinesterase: <b>inapetência, perda de peso e hipotensão postural<\/b>.<br>[53:31] \"Academia do cérebro\" com a doença já instalada: o paciente fica <b>angustiado<\/b>, porque não consegue. E não fique testando o paciente (\"sabe quem eu sou?\").<br>[54:57] Na fase inicial: <b>diário<\/b> escrito todo dia, agenda, atividade física e vida social. [55:31] Depois, uma festa ou uma viagem à praia pode <b>desorientar por dias<\/b>. \"<b>Quanto mais rotina, melhor<\/b>\": hora do banho, de comer e de dormir."}, {"t": "table", "head": ["Droga", "Mecanismo", "Fase", "Atenção"], "rows": [["Donepezila", "Inibe a acetilcolinesterase", "Leve a moderada (e grave)", "Bradicardia, náusea, anorexia, sonhos vívidos"], ["Rivastigmina", "Inibe a acetil e a butirilcolinesterase", "Leve a moderada", "Adesivo tem menos efeito gastrintestinal"], ["Galantamina", "Inibe a acetilcolinesterase + modula nicotínico", "Leve a moderada", "Náusea, bradicardia"], ["Memantina", "Antagonista NMDA", "Moderada a grave", "Tontura, cefaleia; bem tolerada"]]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A tabela vem de fora do slide. Doses usuais: donepezila 5 a 10 mg/dia; rivastigmina 6 a 12 mg/dia (ou adesivo 9,5 a 13,3 mg/24 h); galantamina 16 a 24 mg/dia; memantina 20 mg/dia. A Cochrane confirma benefício pequeno da memantina na DA moderada a grave e <b>nenhum na DA leve<\/b>."}, {"t": "box", "label": "__ref__", "v": "Birks 2018 · Donepezila, Cochrane (PubMed) ¦ https://doi.org/10.1002/14651858.CD001190.pub3"}, {"t": "box", "label": "__ref__", "v": "McShane 2019 · Memantina, Cochrane (PubMed) ¦ https://doi.org/10.1002/14651858.CD003154.pub6"}, {"t": "box", "label": "__ref__", "v": "van Marum 2009 · Memantina (referência do slide) (PubMed) ¦ https://doi.org/10.2147/ndt.s4048"}, {"t": "box", "label": "__ref__", "v": "Dysken 2014 · Vitamina E, TEAM-AD, JAMA (PubMed) ¦ https://doi.org/10.1001/jama.2013.282834"}, {"t": "escreva", "id": "neuro-alzheimer-w-tratamento-sintomatico", "label": "Tratamento sintomático", "v": "Slides 44-46 e aula.", "li": ["IAChE: <b>donepezila, rivastigmina, galantamina<\/b> (fase <b>inicial<\/b>)", "Efeitos: <b>hipotensão postural, anorexia<\/b> (e bradicardia)", "<b>Memantina<\/b> (anti-NMDA): fase <b>avançada<\/b>, paciente agitado", "<b>Não<\/b> liberados para CCL"]}, {"t": "lance", "q": "Quais os efeitos colaterais dos IAChE anotados na aula?", "a": "Hipotensão postural e anorexia."}, {"t": "h2", "v": "Anticorpos anti-amiloide"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [47, 48, 49], "cap": "Aducanumabe, donanemabe e lecanemabe"}, {"t": "ul", "v": ["<b>Aducanumabe<\/b> (Biogen) e <b>donanemabe<\/b> (Lilly): a FDA aprovou pela <b>redução das placas no PET amiloide<\/b>, <b>sem claros benefícios clínicos<\/b>.<ul class=\"sub\"><li>Aducanumabe: MEEM > 23, CDR 0,5, biomarcadores positivos.<\/li><li><b>40% na fase 3 tiveram ARIA<\/b> (anormalidades de imagem relacionadas ao amiloide): <b>edema cerebral e micro-hemorragias<\/b>; mais em quem tem <b>APOE ε4<\/b> (40% × 20%). RM de controle antes do pico de dose em 6 meses e no fim do primeiro ano.<\/li><\/ul>", "<b>Lecanemabe (Clarity AD)<\/b>: 1.795 pacientes em fase precoce.<ul class=\"sub\"><li><b>Reduziu o declínio clínico em 27%<\/b> contra placebo e reduziu o depósito de amiloide no PET.<\/li><li><b>ARIA-E (edema): 12,5%<\/b> × 1,7% no placebo; sintomático 2,8%.<\/li><li><b>ARIA-H<\/b> (micro e macro-hemorragia, siderose): 17% × 8,7%; sintomático 0,7%.<\/li><li>Julho de 2022: FDA em processo acelerado e prioritário.<\/li><\/ul>"]}, {"t": "box", "label": "__aula__", "v": "<b>Donanemabe e lecanemabe aprovados pela Anvisa.<\/b> Limpam o depósito de β-amiloide (limpam 85%), mas <b>não têm tanta diferença na clínica<\/b>, por causa da deposição da tau. <b>Usa em fase muito inicial.<\/b> Não exclui os tratamentos sintomáticos."}, {"t": "box", "label": "__aula__", "v": "[00:06] \"O resultado <b>radiológico é muito bom<\/b>, mas o <b>clínico não é tão bom<\/b>, porque tem o outro componente, a <b>tau<\/b>, que continua.\"<br>[01:31] Conta do professor: os ~30% de desaceleração não valem sobre os 7 a 10 anos de sobrevida, e sim sobre a <b>fase leve, de uns 2,5 anos<\/b>. Dá um ganho de uns <b>5 a 7 meses<\/b> de fase leve, com uma droga cara.<br>[56:32] <b>Donanemabe e lecanemabe estão aprovados no Brasil.<\/b> Não são sintomáticos: limpam o amiloide no PET, mas a degeneração continua. ARIA principalmente no <b>ε4<\/b>.<br>[58:14] Foi cético: lembrou que o efeito estatístico dos ensaios era <b>muito pequeno<\/b>. [59:25] Com a família, é preciso discutir se vale a pena um benefício pequeno, caro e que exige RM de controle; já há paciente conseguindo pela Justiça.<br>[1:01:44] \"É só para a <b>fase inicial<\/b>\" e \"não exclui os tratamentos sintomáticos\"."}, {"t": "box", "label": "__prova__", "v": "Fechamento da aula [1:05:28]: paciente na <b>fase inicial<\/b>, com condição de pagar: <b>donanemabe ou lecanemabe<\/b>, lembrando que o benefício é <b>pequeno<\/b> e que <b>não pode ser ε4 homozigoto<\/b>. E: \"leiam os estudos pivotais\" (estão na página Artigos)."}, {"t": "atual", "label": "O que mudou depois do slide", "v": "O <b>aducanumabe foi retirado do mercado<\/b> pela Biogen em 2024. O donanemabe teve o ensaio de fase 3 publicado (TRAILBLAZER-ALZ 2): desacelerou a progressão em 76 semanas, com <b>ARIA-E em 24%<\/b>. Em abril de 2026, uma <b>revisão Cochrane<\/b> com 17 ensaios (20.342 pessoas) concluiu que o efeito desses anticorpos na cognição é <b>trivial<\/b> e na funcionalidade é <b>pequeno, no máximo<\/b>, com mais ARIA. Grupos de especialistas contestaram a revisão (juntou anticorpos que funcionam com os que falharam). O debate está aberto: é <b>evidência em disputa<\/b>, não consenso.", "src": [["van Dyck 2023 · Clarity AD, NEJM (PubMed)", "https://doi.org/10.1056/NEJMoa2212948"], ["Sims 2023 · TRAILBLAZER-ALZ 2, JAMA (PubMed)", "https://doi.org/10.1001/jama.2023.13239"], ["Nonino 2026 · Cochrane, anticorpos anti-amiloide (PubMed)", "https://doi.org/10.1002/14651858.CD016297"], ["Snyder 2026 · Crítica à revisão Cochrane (PubMed)", "https://doi.org/10.1002/alz.71696"]]}, {"t": "escreva", "id": "neuro-alzheimer-w-anticorpos-anti-amiloide", "label": "Anticorpos anti-amiloide", "v": "Slides 47-49 e aula.", "li": ["Limpam a <b>placa<\/b>, benefício clínico <b>pequeno<\/b> (a tau continua)", "Só na fase <b>muito inicial<\/b> (CCL ou demência leve), com <b>biomarcador +<\/b>", "Risco: <b>ARIA<\/b> (edema e micro-hemorragia), maior no <b>APOE ε4<\/b>", "Lecanemabe: <b>-27%<\/b> no declínio; ARIA-E 12,5%"]}, {"t": "lance", "q": "Qual o principal efeito adverso dos anticorpos anti-amiloide?", "a": "ARIA: edema e micro-hemorragia cerebral."}, {"t": "h2", "v": "Sintomas psiquiátricos e delirium"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [50, 51, 52], "cap": "Agitação, alucinação e o que fazer antes do remédio"}, {"t": "ul", "v": ["Os sintomas psiquiátricos <b>pioram o prognóstico<\/b>, <b>podem melhorar sem tratamento em 3 meses<\/b>; antes de tratar, <b>afastar outras causas<\/b> e usar <b>medidas não farmacológicas<\/b>.", "Slide 51: <b>delirium e Alzheimer<\/b> compartilham fisiopatologia. Um cérebro vulnerável (CCL, DA pré-clínica) sofre um gatilho, faz delirium e pode sair com declínio cognitivo permanente.", "Tratamento (slide 52):<ul class=\"sub\"><li><b>1ª linha: donepezila e memantina<\/b> (evidência modesta);<\/li><li><b>2ª linha: ISRS<\/b>: <b>citalopram até 30 mg/dia<\/b> ou <b>trazodona<\/b>;<\/li><li><b>Antipsicóticos<\/b>: <b>aumentam mortalidade, AVC, distúrbios do movimento, quedas, pneumonia e hospitalização<\/b>. Menor dose e menor tempo possíveis. <b>Risperidona > aripiprazol<\/b>.<\/li><li>Pimavanserina: eficaz em fase 2.<\/li><\/ul>"]}, {"t": "box", "label": "__aula__", "v": "Alteração comportamental no Alzheimer: tem que <b>investigar infecção urinária<\/b>, distúrbio eletrolítico, alteração do padrão. O paciente fica 3 a 4 horas sem dormir, alucina, dorme, acorda gritando e agitado: <b>agita no ciclo sono-vigília<\/b>. Usar medicação para que ele <b>durma à noite e acorde de dia<\/b>."}, {"t": "box", "label": "__aula__", "v": "[1:02:34] Mudou o comportamento? Investigue <b>intercorrência<\/b>: infecção urinária, distúrbio de sódio e potássio e, o mais comum, \"<b>remédio demais<\/b>\".<br>[1:03:16] Muito grave é o paciente que agita no ciclo sono-vigília: dorme 24 horas e depois agita, grita, vê coisas, por dias. Isso é <b>delirium<\/b>, e a mortalidade \"<b>não é baixa<\/b>\". Não tem droga específica: usa o mínimo possível para dormir à noite e acordar de dia.<br>[1:04:28] O que precipita delirium: <b>mudanças, viagens, festas<\/b>. De novo: quanto mais rotina, melhor.<br>[1:04:56] Antipsicótico aumenta a mortalidade, \"mas às vezes é a <b>única droga<\/b> que a gente tem\" para controlar a situação."}, {"t": "div", "v": "O slide diz citalopram até 30 mg/dia (dose do ensaio CitAD). A FDA limita o citalopram a <b>20 mg/dia acima de 60 anos<\/b>, pelo risco de <b>QT longo<\/b>; no CitAD, a dose de 30 mg também piorou um pouco a cognição e alongou o QT. Na prova, fique com o slide; na prática, faça ECG.", "src": [["Porsteinsson 2014 · CitAD, JAMA (PubMed)", "https://doi.org/10.1001/jama.2014.93"], ["Fong 2019 · Delirium e Alzheimer (referência do slide) (PubMed)", "https://doi.org/10.1002/gps.5088"]]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A pimavanserina é aprovada para psicose da doença de Parkinson, não para a do Alzheimer. Para agitação na demência de Alzheimer, a FDA aprovou o <b>brexpiprazol<\/b> em 2023, ainda com o mesmo alerta de mortalidade dos antipsicóticos."}, {"t": "escreva", "id": "neuro-alzheimer-w-agitacao-na-da", "label": "Agitação na DA", "v": "Slides 50-52 e aula.", "li": ["Primeiro: <b>afastar causas<\/b> (ITU, eletrólitos) e medidas <b>não farmacológicas<\/b>", "1ª linha: <b>donepezila e memantina<\/b>; 2ª: <b>citalopram ou trazodona<\/b>", "Antipsicótico: <b>↑ mortalidade e AVC<\/b>; menor dose e tempo"]}, {"t": "lance", "q": "Qual a 1ª linha para sintomas psiquiátricos na DA?", "a": "Donepezila e memantina."}, {"t": "h2", "v": "Conclusões do professor"}, {"t": "slides", "deck": "neuro-alz", "tot": 57, "n": [53], "cap": "O fechamento da aula"}, {"t": "ul", "v": ["<b>Prevenção<\/b>: atuar <b>agressivamente nos fatores de risco<\/b>.", "<b>Genética<\/b>: poderosa arma para um futuro próximo.", "<b>Biomarcadores<\/b>: modificaram nosso entendimento.", "<b>Atenção às formas atípicas.<\/b>", "<b>Tratamento sintomático<\/b> até que surjam novas terapias modificadoras."]}, {"t": "box", "label": "__aula__", "v": "[1:05:16] Resumo final do professor: tratamento <b>sintomático<\/b> com inibidor da colinesterase; <b>memantina<\/b> no mais avançado; na fase inicial, com dinheiro, donanemabe ou lecanemabe, com benefício pequeno e nunca em ε4 homozigoto. [1:05:44] \"Essa é uma aula <b>bem atualizada<\/b>.\" [1:06:03] \"Leiam os estudos pivotais: é exatamente como a droga foi lançada.\""}, {"t": "escreva", "id": "neuro-alzheimer-w-as-5-conclusoes", "label": "As 5 conclusões", "v": "Slide 53.", "li": ["<b>Prevenção<\/b> agressiva nos fatores de risco", "<b>Genética<\/b> e <b>biomarcadores<\/b>", "Atenção às <b>formas atípicas<\/b>", "Tratamento <b>sintomático<\/b> por enquanto"]}, {"t": "lance", "q": "Até quando o tratamento será sintomático?", "a": "Até surgirem novas terapias modificadoras."}, {"t": "h2", "v": "Questões"}, {"t": "p", "v": "Oito questões no estilo de prova. Toque numa alternativa: a correção comenta a certa, as erradas e o que revisar."}, {"t": "mcq", "src": "Treino · fisiopatologia", "stem": "Na doença de Alzheimer, qual é a ordem dos eventos e a localização das lesões?", "opts": ["Emaranhados de tau extracelulares surgem primeiro e depois as placas amiloides intracelulares", "Placas de Aβ 1-42 extracelulares surgem primeiro e depois os emaranhados de tau fosforilada intracelulares", "Placas e emaranhados surgem juntos, ambos intracelulares", "Corpos de Lewy no hipocampo precedem as placas amiloides"], "ok": 1, "exp": "<b>B<\/b>: a aula marcou \"1º placa, 2º tau\": a placa senil é <b>extracelular<\/b> (Aβ 1-42) e o emaranhado é <b>intracelular<\/b> (tau fosforilada). A e C trocam a localização. D descreve outra doença (demência com corpos de Lewy). Revise: <i>Fisiopatologia: placa, emaranhado e Braak<\/i>."}, {"t": "mcq", "src": "Treino · diagnóstico diferencial", "stem": "Mulher de 74 anos, esquecida há 6 meses, com anemia macrocítica no hemograma. Qual exame NÃO pode faltar antes de pensar em Alzheimer?", "opts": ["PET amiloide", "Genotipagem do APOE", "Dosagem de vitamina B12 e ácido fólico", "Eletroneuromiografia"], "ok": 2, "exp": "<b>C<\/b>: anemia macrocítica + esquecimento aponta para <b>B12/folato baixos<\/b>, uma causa <b>tratável<\/b> de demência (a aula destacou: \"causas de demência tratáveis\"; B12 acima de 400 é o ideal). A e B não excluem nada tratável e o SUS ainda não paga biomarcador. D não ajuda na queixa cognitiva. Revise: <i>Diagnóstico diferencial<\/i>."}, {"t": "mcq", "src": "Treino · biomarcadores", "stem": "Sobre os biomarcadores da doença de Alzheimer, assinale a correta:", "opts": ["Um biomarcador positivo confirma Alzheimer em qualquer paciente", "Biomarcadores negativos praticamente excluem Alzheimer", "O NfL elevado no líquor é específico de Alzheimer", "No líquor de Alzheimer o Aβ42 está aumentado e a tau diminuída"], "ok": 1, "exp": "<b>B<\/b>: frase do slide 28: \"quando positivos não garantem DA; quando negativos excluem DA\". A é o oposto. C: o NfL sobe em qualquer morte neuronal (a aula citou a ELA). D inverte: no Alzheimer o <b>Aβ42 cai<\/b> (fica preso na placa) e a <b>tau sobe<\/b>. Revise: <i>Biomarcadores<\/i>."}, {"t": "mcq", "src": "Treino · tratamento", "stem": "Homem de 80 anos com Alzheimer moderado a grave, CDR 2, agitado. Qual droga a aula indicou para esse perfil?", "opts": ["Aducanumabe", "Valaciclovir", "Memantina", "Haloperidol como primeira escolha"], "ok": 2, "exp": "<b>C<\/b>: na aula, a memantina (antagonista NMDA) é melhor nas <b>formas avançadas<\/b> e no paciente <b>mais agitado<\/b>, e é primeira linha com a donepezila para sintomas psiquiátricos. A: anticorpos só em fase muito inicial (e o aducanumabe saiu do mercado). B: o VALAD mostrou que antiviral não funciona. D: antipsicótico aumenta mortalidade e AVC; só depois de afastar causas e com a menor dose. Revise: <i>Tratamento sintomático<\/i>."}, {"t": "mcq", "src": "Treino · genética", "stem": "Qual genótipo do APOE tem o maior risco de Alzheimer e de ARIA com anticorpo anti-amiloide?", "opts": ["ε2/ε2", "ε3/ε3", "ε2/ε3", "ε4/ε4"], "ok": 3, "exp": "<b>D<\/b>: o ε4 reduz a limpeza do amiloide; em homozigose dá cerca de <b>10 vezes<\/b> mais risco que ε3/ε3 e também mais ARIA (a aula: \"não pode anticorpo monoclonal\"). A e C têm o ε2, que é protetor. B é o genótipo neutro de referência. Revise: <i>Genética: APOE e companhia<\/i>."}, {"t": "mcq", "src": "Treino · outras demências", "stem": "Idoso com alucinações visuais bem formadas, flutuação da atenção e parkinsonismo, que ficou muito rígido após haloperidol. Diagnóstico mais provável:", "opts": ["Doença de Alzheimer típica", "Demência com corpos de Lewy", "Demência vascular", "LATE"], "ok": 1, "exp": "<b>B<\/b>: a tríade da aula para Lewy é <b>alucinação visual, flutuação cognitiva e síndrome parkinsoniana<\/b>, com <b>sensibilidade a neuroléptico<\/b> (\"fica rígido\"). A começa pela memória. C tem AVC e piora em degraus. D é amnésia pura e lenta no muito idoso. Revise: <i>Outras demências degenerativas<\/i>."}, {"t": "mcq", "src": "Treino · CCL × demência (dito em aula)", "stem": "Idoso de 76 anos se queixa de esquecimento. MoCA alterado. Ainda vai sozinho ao banco e ao mercado, mas semana passada se perdeu voltando para casa, num caminho que faz há anos. Pela aula, como classificar?", "opts": ["Esquecimento normal da idade", "Comprometimento cognitivo leve, porque o MoCA está alterado", "Demência leve, porque já há perda de autonomia", "Pseudodemência, sem necessidade de outra investigação"], "ok": 2, "exp": "<b>C<\/b>: o professor foi claro: o que separa CCL de demência é a <b>autonomia<\/b>, e \"foi sozinho, se perdeu e não achou o caminho de casa\" já é demência leve. A ignora o teste alterado e a perda funcional. B: teste alterado sozinho não define; a funcionalidade decide. D: depressão é diferencial obrigatório, mas nunca \"sem investigar\": neuroimagem e exames de sangue sempre. Revise: <i>Apresentação clássica e CCL<\/i>."}, {"t": "mcq", "src": "Treino · biomarcador no sangue (dito em aula)", "stem": "Por que o professor não recomenda pedir p-tau217 no sangue em quem não tem sintoma?", "opts": ["Porque o exame só existe em líquor", "Porque pode dar positivo até 20 anos antes da doença, sem conduta a oferecer", "Porque a p-tau217 é marcador de ELA, não de Alzheimer", "Porque um resultado negativo não exclui Alzheimer"], "ok": 1, "exp": "<b>B<\/b>: [45:58] a p-tau217 pode positivar <b>até 20 anos antes<\/b>; no assintomático, vira só uma informação angustiante. Use em quem tem <b>sintoma<\/b>. A: já existe no sangue. C: quem sobe na ELA é o NfL, que é inespecífico. D: é o contrário, biomarcador negativo exclui. Revise: <i>Biomarcadores<\/i>."}]}]}, {"id": "cardio", "nome": "Cardiologia", "area": "Clínica Médica", "prova": "Prova A2", "cor": "cardio", "aulas": [{"id": "cm2-cardio-taqui", "title": "Taquiarritmias supraventriculares", "sub": "Aula 7 · Prof. Hélio Brito Jr. · TPSV, WPW, flutter e fibrilação atrial · 79 slides", "deck": "cm-taqui", "nsl": 79, "blocks": [{"t": "h2", "v": "O mapa das taquiarritmias"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [3, 6], "cap": "A classificação que abre e organiza a aula"}, {"t": "ul", "v": ["Taquiarritmia é ritmo acelerado. A primeira divisão é pelo <b>lugar de origem<\/b>.", "<b>Supraventriculares<\/b>: nascem <b>acima da divisão do feixe de His<\/b> (átrios, nó AV ou um circuito que usa os dois).<ul class=\"sub\"><li><b>Taquicardia paroxística supraventricular (TPSV)<\/b>, que tem dois tipos: <b>reentrante nodal AV (TRN)<\/b> e <b>reentrante AV (TRAV)<\/b>, esta ligada à <b>síndrome de Wolff-Parkinson-White<\/b>.<\/li><li>Taquicardia atrial, taquicardia sinoatrial e taquicardia sinusal inapropriada.<\/li><li><b>Flutter atrial<\/b> e <b>fibrilação atrial<\/b>.<\/li><\/ul>", "<b>Ventriculares<\/b>: origem limitada aos ventrículos (taquicardia ventricular, flutter e fibrilação ventricular). Ficam para outra aula.", "A aula aprofunda quatro: <b>TRN, TRAV/WPW, flutter e fibrilação atrial<\/b>. No slide eles aparecem em vermelho."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que a origem importa: se o impulso desce pelo sistema His-Purkinje normal, o QRS sai <b>estreito<\/b> (menos de 120 ms). Por isso \"supraventricular\" e \"QRS estreito\" andam quase sempre juntos. As exceções (bloqueio de ramo, aberrância, via acessória conduzindo para baixo) aparecem mais adiante."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-as-supraventriculares-da-aula", "label": "As supraventriculares da aula", "v": "Nascem acima da divisão do feixe de His.", "li": ["<b>TPSV<\/b>: TRN (dupla via nodal) e TRAV (via acessória, WPW)", "Taquicardia atrial, sinoatrial e sinusal inapropriada", "<b>Flutter atrial<\/b> e <b>fibrilação atrial<\/b>"]}, {"t": "lance", "q": "O que define uma taquiarritmia como supraventricular?", "a": "Nascer acima da divisão do feixe de His."}, {"t": "h2", "v": "Os três mecanismos e a reentrada"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [4, 5], "cap": "Mecanismos eletrofisiológicos e o \"carrossel\" da reentrada"}, {"t": "img", "src": "img/cm-taqui/s05.webp", "cap": "Slide 5: a reentrada precisa de duas vias, bloqueio unidirecional e condução lenta. O exemplo do slide é a dupla via nodal AV (o círculo de setas). As placas de rotatória são a analogia do professor."}, {"t": "ul", "v": ["Toda taquiarritmia nasce de um de três mecanismos:<ul class=\"sub\"><li><b>Reentrada<\/b>: o impulso entra num circuito e fica dando voltas. É o mecanismo da TRN, da TRAV e do flutter.<\/li><li><b>Aumento do automatismo<\/b>: um grupo de células passa a disparar sozinho, mais rápido que o nó sinusal.<\/li><li><b>Atividade deflagrada<\/b>: pós-potenciais (oscilações depois do potencial de ação) disparam novos batimentos.<\/li><\/ul>", "Para a reentrada existir são necessárias três condições:<ul class=\"sub\"><li><b>Duas vias de condução<\/b> com propriedades diferentes;<\/li><li><b>Bloqueio unidirecional<\/b> em uma delas;<\/li><li><b>Condução lenta<\/b> na outra, o bastante para a primeira se recuperar e aceitar o impulso de volta.<\/li><\/ul>"]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Pense numa rotatória: o carro (impulso) entra por uma via, encontra a outra fechada naquele sentido, dá a volta pelo caminho lento e, quando chega, a primeira via já r
