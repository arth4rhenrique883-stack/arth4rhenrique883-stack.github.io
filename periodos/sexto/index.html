eabriu. Pronto: ele não sai mais. Por isso a reentrada começa e termina de repente, com uma extrassístole que \"abre a porta\", e por isso cortar um pedaço do circuito (ablação) cura."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-reentrada-as-3-condicoes", "label": "Reentrada: as 3 condições", "v": "O mecanismo da TRN, da TRAV e do flutter.", "li": ["<b>Duas vias<\/b> de condução", "<b>Bloqueio unidirecional<\/b>", "<b>Condução lenta<\/b>", "Outros mecanismos: <b>automatismo aumentado<\/b> e <b>atividade deflagrada<\/b>"]}, {"t": "lance", "q": "Quais as três condições da reentrada?", "a": "Duas vias, bloqueio unidirecional e condução lenta."}, {"t": "h2", "v": "Triângulo de Koch: onde mora o nó AV"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [7, 8], "cap": "Anatomia do coração direito e o triângulo de Koch"}, {"t": "img", "src": "img/cm-taqui/s07.webp", "cap": "Slide 7: triângulo de Koch, com o óstio do seio coronário, o tendão de Todaro, o anel da tricúspide, o nó AV compacto no vértice e as duas vias nodais (rápida em cima, lenta embaixo)."}, {"t": "ul", "v": ["O nó AV compacto fica no <b>triângulo de Koch<\/b>, no átrio direito.", "O triângulo é limitado pelo <b>tendão de Todaro<\/b>, pelo <b>anel da valva tricúspide<\/b> e, na base, pelo <b>óstio do seio coronário<\/b>.", "Chegam ao nó duas \"estradas\": a <b>via rápida<\/b> (em cima, perto do tendão de Todaro) e a <b>via lenta<\/b> (embaixo, perto do seio coronário).", "No slide 8, a peça anatômica mostra o nó AV perto da fossa oval (FO)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Este é o mapa do eletrofisiologista: a ablação da TRN mira a <b>via lenta<\/b>, que fica embaixo, longe do nó compacto. Isso reduz o risco de bloqueio AV total, a complicação temida do procedimento."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-triangulo-de-koch", "label": "Triângulo de Koch", "v": "O endereço do nó AV, no átrio direito.", "li": ["Limites: <b>tendão de Todaro<\/b>, <b>anel tricúspide<\/b> e <b>óstio do seio coronário<\/b>", "<b>Via rápida<\/b> em cima; <b>via lenta<\/b> embaixo, perto do seio coronário", "A ablação da TRN mira a via lenta"]}, {"t": "lance", "q": "Quais os limites do triângulo de Koch?", "a": "Tendão de Todaro, anel da tricúspide e óstio do seio coronário."}, {"t": "h2", "v": "TRN: a dupla via nodal e a clínica"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [9, 10, 11], "cap": "Clínica e ECG basal da taquicardia reentrante nodal"}, {"t": "img", "src": "img/cm-taqui/s11.webp", "cap": "Slide 11: o \"frog sign\", turgência jugular pulsátil no pescoço durante a crise."}, {"t": "ul", "v": ["<b>Etiologia<\/b>: \"dupla via\" nodal. São extensões nodais ou conexões átrio-nodais: <b>uma via rápida e quatro ou mais vias lentas<\/b>. Há <b>concentração familiar<\/b>.", "<b>Prevalência<\/b>: <b>60 a 70% das TPSV<\/b>. É a TPSV mais comum.", "<b>Clínica<\/b>: crises de <b>palpitação taquicárdica<\/b> que começam e terminam de repente (paroxísticas).<ul class=\"sub\"><li>A maioria reverte sozinha; as outras revertem com manobra vagal, medicação ou cardioversão elétrica.<\/li><li><b>\"Frog sign\"<\/b>: <b>turgência jugular pulsátil<\/b> no pescoço.<\/li><li>Dispneia, dor precordial, tontura, palidez, sudorese, pré-síncope e, às vezes, síncope.<\/li><\/ul>", "<b>ECG basal (fora da crise)<\/b>: <b>normal<\/b>."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> O \"frog sign\" acontece porque átrios e ventrículos contraem quase ao mesmo tempo: o átrio direito se contrai com a tricúspide fechada e o sangue reflui para a jugular, que pulsa como a garganta de um sapo. Na TRN isso é típico porque a ativação atrial e a ventricular são praticamente simultâneas."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-trn-clinica", "label": "TRN: clínica", "v": "A TPSV mais comum.", "li": ["<b>Dupla via nodal<\/b>: 1 rápida e 4 ou mais lentas; concentração familiar", "<b>60 a 70%<\/b> das TPSV", "Crises paroxísticas de palpitação; <b>frog sign<\/b> (jugular pulsátil)", "<b>ECG basal normal<\/b>"]}, {"t": "lance", "q": "Como é o ECG basal de quem tem TRN?", "a": "Normal."}, {"t": "h2", "v": "TRN: o ECG da crise"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [14, 15, 16, 17], "cap": "O circuito e os ECGs de TRN do professor"}, {"t": "img", "src": "img/cm-taqui/s15.webp", "cap": "Slide 15: ECG de TPSV por TRN. QRS estreito, frequência alta e regular; a seta em V1 marca a onda P escondida no fim do QRS."}, {"t": "ul", "v": ["No circuito típico, o impulso <b>desce pela via lenta<\/b> e <b>volta pela via rápida<\/b>. Como a volta é muito rápida, átrio e ventrículo despolarizam quase juntos.", "ECG na crise:<ul class=\"sub\"><li><b>QRS estreito<\/b> (na maioria). Pode sair <b>largo<\/b> se houver aberrância de condução ou bloqueio de ramo.<\/li><li><b>FC de cerca de 150 a 220 bpm<\/b>, regular.<\/li><li><b>RP' menor que 70 ms<\/b>: a onda P cai <b>no final do QRS<\/b>, vista em <b>V1<\/b>.<\/li><\/ul>", "O slide 17 mostra a indução da TRN no estudo eletrofisiológico."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Na prática, essa P \"grudada\" no fim do QRS aparece como um <b>pseudo-r'<\/b> em V1 e uma <b>pseudo-onda S<\/b> em DII, DIII e aVF, que somem quando a crise acaba. Compare o ECG da crise com o basal: o que mudou no fim do QRS é a P."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-trn-ecg-na-crise", "label": "TRN: ECG na crise", "v": "", "li": ["<b>QRS estreito<\/b> (largo se aberrância ou bloqueio de ramo)", "FC <b>150 a 220 bpm<\/b>, regular", "<b>RP' menor que 70 ms<\/b>: P no <b>final do QRS em V1<\/b>", "Circuito: desce pela <b>via lenta<\/b>, volta pela <b>rápida<\/b>"]}, {"t": "lance", "q": "Qual o RP' da TRN e onde está a P?", "a": "Menor que 70 ms, com a P no final do QRS em V1."}, {"t": "h2", "v": "TRN: tratamento e ablação por cateter"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [18, 19, 20, 21, 22, 23, 24], "cap": "Resumo da TRN, fontes de energia, lesão e sala de ablação"}, {"t": "img", "src": "img/cm-taqui/s20.webp", "cap": "Slide 20: a radiofrequência aquece o tecido; a temperatura máxima fica cerca de 1 mm abaixo da superfície e a lesão tem de 5 a 10 mm de diâmetro."}, {"t": "ul", "v": ["O slide 18 é o resumo da TRN: dupla via, cerca de 60% das TPSV, paroxística, ECG sinusal normal.", "<b>Tratamento curativo<\/b>: <b>ablação por cateter da via lenta<\/b>, com <b>sucesso de cerca de 95%<\/b>.", "<b>Tratamento paliativo<\/b>:<ul class=\"sub\"><li><b>Emergência<\/b>, nesta ordem: <b>manobra vagal<\/b> (Valsalva, massagem do seio carotídeo) → <b>adenosina IV<\/b> → <b>verapamil IV<\/b> → <b>cardioversão elétrica externa<\/b>.<\/li><li><b>Profilaxia com drogas<\/b>: betabloqueador, verapamil, propafenona, amiodarona etc.<\/li><\/ul>", "Fontes de energia para ablação: corrente direta, <b>radiofrequência<\/b> (a mais usada, destacada no slide), micro-ondas, ultrassom, laser, química, <b>crioablação<\/b> e cirurgia.", "Os slides 21 a 24 mostram a lesão após a ablação, a sala de eletrofisiologia e a ablação da via lenta na radioscopia."]}, {"t": "atual", "label": "ablação e manobra vagal", "v": "A diretriz europeia de 2019 coloca a <b>ablação por cateter como primeira linha<\/b> na TRN recorrente e sintomática, à frente do remédio de uso contínuo. Para a manobra vagal, o estudo REVERT mostrou que a <b>Valsalva modificada<\/b> (soprar com força por 15 segundos sentado e logo deitar com as pernas elevadas) reverte bem mais que a Valsalva comum (cerca de 43% contra 17%).", "src": [["ESC 2019 · Taquicardia supraventricular", "https://doi.org/10.1093/eurheartj/ehz467"], ["REVERT · Lancet 2015", "https://doi.org/10.1016/S0140-6736(15)61485-4"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-trn-tratamento", "label": "TRN: tratamento", "v": "Cura = ablação da <b>via lenta<\/b> (cerca de <b>95%<\/b>).", "li": ["Emergência: <b>manobra vagal → adenosina IV → verapamil IV → cardioversão<\/b>", "Profilaxia: <b>betabloqueador, verapamil<\/b>, propafenona, amiodarona", "Energia mais usada: <b>radiofrequência<\/b> (também crioablação)"]}, {"t": "lance", "q": "Qual via é ablacionada na TRN e com que sucesso?", "a": "A via lenta, com cerca de 95% de sucesso."}, {"t": "h2", "v": "Via acessória e Wolff-Parkinson-White"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [26, 28, 29], "cap": "Pré-excitação: PR curto e onda delta"}, {"t": "img", "src": "img/cm-taqui/s26.webp", "cap": "Slide 26: a onda delta, o empastamento no começo do QRS causado pela pré-excitação ventricular."}, {"t": "ul", "v": ["Na TRAV o circuito usa uma <b>via anômala<\/b> (feixe anômalo, via acessória): uma ponte muscular extra entre átrio e ventrículo, fora do nó AV.", "<b>Etiologia<\/b>: via anômala; existe <b>WPW familiar<\/b> (provavelmente hereditário).", "<b>Prevalência<\/b>: <b>20 a 30% das TPSV<\/b>.", "<b>Clínica<\/b>: crises de palpitação paroxísticas, como na TRN, com os mesmos sintomas.", "<b>ECG basal<\/b>:<ul class=\"sub\"><li><b>Normal<\/b> quando a via só conduz de volta: <b>via anômala oculta<\/b> (a maioria).<\/li><li><b>Pré-excitado<\/b> quando a via também conduz para baixo: <b>intervalo PR curto + onda delta<\/b>. É a <b>via anômala manifesta<\/b>.<\/li><\/ul>", "<b>Pré-excitação ventricular<\/b> é o achado de ECG. <b>Síndrome de Wolff-Parkinson-White<\/b> é a pré-excitação <b>mais sintomas<\/b> (taquiarritmia).", "O slide 29 mostra um ECG de WPW com <b>feixe à esquerda<\/b> (posterosseptal esquerdo)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que PR curto e onda delta: o impulso pega o \"atalho\" da via acessória, que não tem o freio do nó AV. Parte do ventrículo começa a despolarizar antes (PR curto) e devagar, célula a célula (o empastamento da onda delta). Logo depois o impulso normal chega pelo His e completa o QRS."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-pre-excitacao-wpw", "label": "Pré-excitação × WPW", "v": "Via acessória manifesta.", "li": ["ECG: <b>PR curto + onda delta<\/b> = pré-excitação ventricular", "<b>WPW<\/b> = pré-excitação <b>+ sintomas<\/b>", "Via <b>oculta<\/b> (a maioria): ECG basal normal", "TRAV = <b>20 a 30%<\/b> das TPSV"]}, {"t": "lance", "q": "Quais os dois achados da pré-excitação no ECG?", "a": "PR curto e onda delta."}, {"t": "h2", "v": "TRAV: o ECG da crise e a comparação com a TRN"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [27, 30, 31, 32], "cap": "Macrorreentrada AV ortodrômica e antidrômica"}, {"t": "img", "src": "img/cm-taqui/s27.webp", "cap": "Slide 27: ritmo sinusal com via acessória (VA), TRAV ortodrômica (desce pelo nó, volta pela via: QRS estreito) e antidrômica (desce pela via, volta pelo nó: QRS largo)."}, {"t": "ul", "v": ["A TRAV é uma <b>macrorreentrada<\/b>: o circuito passa pelo nó AV, pelo ventrículo, pela via acessória e pelo átrio.", "ECG na crise:<ul class=\"sub\"><li><b>QRS estreito<\/b> na forma <b>ortodrômica (95%)<\/b>: desce pelo nó AV e volta pela via acessória.<\/li><li><b>QRS largo<\/b> na forma <b>antidrômica (5%)<\/b>: desce pela via acessória e volta pelo nó.<\/li><li><b>FC de cerca de 150 a 220 bpm<\/b>.<\/li><li><b>RP' maior que 70 ms<\/b>: a onda P vem <b>depois do QRS<\/b> em V1, separada dele.<\/li><\/ul>", "O slide 32 mostra o estudo eletrofisiológico invasivo: indução da TRAV ortodrômica e o potencial do feixe anômalo."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que o RP' é mais longo na TRAV: para chegar de volta ao átrio, o impulso precisa percorrer o ventrículo inteiro até a via acessória. Na TRN, a volta é pelo próprio nó, logo ali."}, {"t": "table", "head": ["", "TRN", "TRAV"], "rows": [["Circuito", "Dupla via dentro do nó AV", "Nó AV + via acessória (macrorreentrada)"], ["Frequência nas TPSV", "60 a 70%", "20 a 30%"], ["FC na crise", "150 a 220 bpm", "150 a 220 bpm"], ["Onda P na crise", "No final do QRS (V1)", "Depois do QRS (V1)"], ["RP'", "Menor que 70 ms", "Maior que 70 ms"], ["QRS", "Estreito (largo se aberrância)", "Estreito na ortodrômica (95%); largo na antidrômica (5%)"], ["ECG fora da crise", "Normal", "Normal (via oculta) ou PR curto + onda delta (manifesta)"], ["Ablação", "Via lenta, cerca de 95%", "Feixe anômalo, cerca de 94%"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-trn-trav-no-ecg", "label": "TRN × TRAV no ECG", "v": "A pergunta que separa as duas é onde está a P.", "li": ["TRN: <b>RP' menor que 70 ms<\/b>, P no <b>final do QRS<\/b>", "TRAV: <b>RP' maior que 70 ms<\/b>, P <b>depois do QRS<\/b>", "TRAV <b>ortodrômica 95%<\/b> (QRS estreito) × <b>antidrômica 5%<\/b> (QRS largo)"]}, {"t": "lance", "q": "Qual a forma mais comum de TRAV e como é o QRS?", "a": "Ortodrômica (95%), com QRS estreito."}, {"t": "h2", "v": "WPW: quem tem, o que sente e o risco"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [33], "cap": "Consenso PACES/HRS 2012 sobre o padrão de WPW"}, {"t": "ul", "v": ["O <b>padrão de WPW no ECG<\/b> aparece em <b>1 a 3 por 1.000<\/b> pessoas da população geral e em <b>5,5 por 1.000<\/b> parentes de primeiro grau de quem tem.", "<b>Cardiopatia de base<\/b>: ausente na maioria. Quando existe, a mais comum é a <b>anomalia de Ebstein<\/b>; também cardiomiopatia hipertrófica e, raramente, rabdomioma.", "<b>Sintomas<\/b>:<ul class=\"sub\"><li>Ausentes em <b>40 a 65%<\/b> (\"WPW\" assintomático, ou seja, padrão de WPW).<\/li><li><b>Palpitações<\/b> em cerca de 30% (por volta dos 7 a 8 anos): TRAV, taquicardia atrial e FA.<\/li><li>Pré-síncope e síncope.<\/li><li><b>Morte súbita<\/b>: 4,5 por 1.000 pessoas com WPW; em 10% dela é a <b>primeira manifestação<\/b>.<\/li><\/ul>", "A pré-excitação pode <b>desaparecer<\/b> (até 31%). Mas se está presente há mais de 5 anos, <b>75% persiste<\/b> no seguimento."]}, {"t": "atual", "label": "FA com pré-excitação", "v": "A morte súbita no WPW vem da <b>FA pré-excitada<\/b>: a FA desce rápido pela via acessória, que não tem o freio do nó AV, e pode virar fibrilação ventricular. O ECG mostra QRS largos, bizarros e irregulares. Nesse caso <b>não se usam<\/b> adenosina, verapamil, diltiazem, digoxina, betabloqueador e nem <b>amiodarona IV<\/b> (classe III na ESC 2019): elas podem empurrar ainda mais o estímulo pela via. Instável: <b>cardioversão elétrica<\/b>. Estável: <b>procainamida ou ibutilida<\/b> IV, ou cardioversão. Sobre o risco: uma metanálise de 2012 estimou a morte súbita no WPW <b>assintomático<\/b> em cerca de <b>1,25 por 1.000 pessoas-ano<\/b> (1,93 em crianças, 0,86 em adultos), número menor que o do slide, que fala de todos os pacientes com WPW.", "src": [["ESC 2019 · Taquicardia supraventricular", "https://doi.org/10.1093/eurheartj/ehz467"], ["Obeyesekere · Circulation 2012", "https://doi.org/10.1161/CIRCULATIONAHA.111.055350"], ["PACES/HRS 2012 · WPW assintomático", "https://doi.org/10.1016/j.hrthm.2012.03.050"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-wpw-numeros-e-perigo", "label": "WPW: números e perigo", "v": "", "li": ["Padrão no ECG: <b>1 a 3 por 1.000<\/b>; assintomáticos <b>40 a 65%<\/b>", "Cardiopatia associada mais comum: <b>Ebstein<\/b>", "Morte súbita: <b>4,5 por 1.000<\/b>; primeira manifestação em 10%", "<b>FA pré-excitada<\/b>: não usar bloqueador do nó AV; cardioversão ou procainamida"]}, {"t": "lance", "q": "Qual cardiopatia mais se associa ao WPW?", "a": "A anomalia de Ebstein."}, {"t": "h2", "v": "TRAV: tratamento"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [34, 35, 36, 37], "cap": "Resumo da TRAV e ablação do feixe anômalo"}, {"t": "img", "src": "img/cm-taqui/s37.webp", "cap": "Slide 37: a pré-excitação (onda delta) some do ECG depois da ablação do feixe anômalo."}, {"t": "ul", "v": ["O slide 34 é o resumo: TRAV = <b>20 a 30% das TPSV<\/b>, paroxística, ECG da crise com <b>RP' maior que 70 ms<\/b>, ortodrômica 95% e antidrômica 5%; ECG sinusal normal (oculta) ou com PR curto e onda delta (manifesta, WPW).", "<b>Tratamento curativo<\/b>: <b>ablação por cateter do feixe anômalo<\/b>, com <b>sucesso de cerca de 94%<\/b>.", "<b>Tratamento paliativo<\/b>:<ul class=\"sub\"><li><b>Emergência<\/b>: <b>manobra vagal → adenosina IV → verapamil IV → cardioversão elétrica externa<\/b>.<\/li><li><b>Profilaxia com drogas<\/b>: <b>sotalol, propafenona, flecainida, amiodarona<\/b> etc.<\/li><\/ul>", "Os slides 36 e 37 mostram a ablação de um feixe manifesto à esquerda e o ECG antes e depois: a onda delta desaparece."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Repare na diferença da profilaxia: na TRN o slide cita betabloqueador e verapamil (que agem no nó); na TRAV, os antiarrítmicos que agem também na via acessória (sotalol, propafenona, flecainida, amiodarona). Faz sentido: na TRAV o alvo é o atalho."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-trav-tratamento", "label": "TRAV: tratamento", "v": "Cura = ablação do <b>feixe anômalo<\/b> (cerca de <b>94%<\/b>).", "li": ["Emergência: <b>vagal → adenosina → verapamil → cardioversão<\/b>", "Profilaxia: <b>sotalol, propafenona, flecainida, amiodarona<\/b>", "Depois da ablação a <b>onda delta some<\/b>"]}, {"t": "lance", "q": "Cite dois antiarrítmicos da profilaxia da TRAV.", "a": "Sotalol, propafenona, flecainida ou amiodarona."}, {"t": "h2", "v": "TPSV na emergência"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [38, 39], "cap": "O fluxograma do professor e a adenosina"}, {"t": "img", "src": "img/cm-taqui/s38.webp", "cap": "Slide 38: abordagem da TPSV na emergência (Manual Prático de Cardiologia SBLC, 2012)."}, {"t": "ul", "v": ["Primeira pergunta: o paciente está <b>estável ou instável<\/b>?<ul class=\"sub\"><li><b>Instável<\/b>: <b>cardioversão elétrica (CVE)<\/b>.<\/li><li><b>Estável<\/b>: <b>manobra vagal<\/b>. Sem sucesso: <b>adenosina IV<\/b>. Sem sucesso, decide-se pela fração de ejeção:<ul class=\"sub\"><li><b>FE maior que 40%<\/b>: <b>verapamil IV<\/b>, amiodarona IV, betabloqueador IV, digital IV ou CVE.<\/li><li><b>FE menor que 40%<\/b>: digital IV, amiodarona IV ou CVE.<\/li><\/ul><\/li><\/ul>", "O slide 39 mostra o efeito da <b>adenosina 6 mg IV<\/b>: a taquicardia para de repente, há uma pausa e o ritmo sinusal volta."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A adenosina bloqueia o nó AV por segundos (meia-vida de menos de 10 s). Por isso é feita em <b>bolus rápido seguido de flush de soro<\/b>, em veia calibrosa, com o paciente monitorizado e avisado da sensação ruim e passageira (aperto no peito, rubor, \"sensação de morte iminente\")."}, {"t": "atual", "label": "dose da adenosina e drogas na fase aguda", "v": "A dose inicial é <b>6 mg<\/b> em bolus rápido. Se não reverter: <b>12 mg<\/b> (diretriz americana de 2015 e ACLS); a europeia de 2019 fala em <b>6 a 18 mg<\/b>, subindo até 18 mg se preciso. A diretriz europeia também tirou a <b>amiodarona e a digoxina<\/b> do tratamento agudo da TPSV; depois da adenosina, ficam verapamil ou diltiazem IV, ou betabloqueador IV (classe IIa), e a cardioversão sincronizada se houver instabilidade. Na prova vale o fluxograma do professor, mas saiba que a conduta atual mudou.", "src": [["ESC 2019 · Taquicardia supraventricular", "https://doi.org/10.1093/eurheartj/ehz467"], ["AHA/ACC/HRS 2015 · TSV", "https://doi.org/10.1161/CIR.0000000000000311"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-tpsv-na-emergencia", "label": "TPSV na emergência", "v": "Primeiro: estável ou instável?", "li": ["<b>Instável → cardioversão elétrica<\/b>", "Estável: <b>manobra vagal → adenosina 6 mg IV<\/b> (bolus rápido + flush)", "Depois: FE maior que 40% → <b>verapamil<\/b> IV (ou BB, amiodarona, digital)", "FE menor que 40% → digital ou amiodarona IV, ou CVE"]}, {"t": "lance", "q": "O que fazer na TPSV com instabilidade?", "a": "Cardioversão elétrica."}, {"t": "h2", "v": "Flutter atrial: o circuito e o ECG"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [42, 43, 44], "cap": "O circuito em torno da tricúspide e o ECG \"em dentes de serrote\""}, {"t": "img", "src": "img/cm-taqui/s43.webp", "cap": "Slide 43: flutter atrial típico anti-horário. As ondas F negativas em DII, DIII e aVF formam o serrilhado; as setas marcam as ondas F."}, {"t": "ul", "v": ["O flutter atrial típico é uma <b>macrorreentrada no átrio direito<\/b> que gira em volta do anel da tricúspide e passa obrigatoriamente pelo <b>istmo cavotricuspídeo<\/b> (ICT), entre a veia cava inferior e a tricúspide.", "O sentido mais comum é o <b>anti-horário<\/b>.", "ECG do flutter <b>típico<\/b> (ICT-dependente):<ul class=\"sub\"><li><b>FC atrial de 250 a 300 bpm<\/b>;<\/li><li>Condução <b>AV 2:1<\/b> ou variável;<\/li><li>Ondas P em <b>\"serrilhado\" ou \"dentes de serrote\"<\/b> (ondas F): <b>negativas em DII, DIII e aVF<\/b> no anti-horário; positivas no horário.<\/li><\/ul>", "ECG do flutter <b>atípico<\/b> (por cicatriz no AD ou no AE): FC atrial <b>acima de 300 bpm<\/b> e P variável."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A conta que cai: átrio a 300 e condução 2:1 dá ventrículo a <b>150 bpm<\/b>. Taquicardia regular de QRS estreito com FC fixa em torno de 150 é flutter até prova em contrário. Procure as ondas F em DII, DIII e aVF (e positivas em V1)."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-flutter-circuito-e-ecg", "label": "Flutter: circuito e ECG", "v": "", "li": ["Macrorreentrada no <b>AD<\/b>, passando pelo <b>istmo cavotricuspídeo<\/b>", "Típico: atrial <b>250 a 300 bpm<\/b>, condução <b>2:1<\/b> (FC cerca de 150)", "<b>Dentes de serrote<\/b>: F negativas em <b>DII, DIII e aVF<\/b> (anti-horário)", "Atípico (cicatriz): atrial acima de 300, P variável"]}, {"t": "lance", "q": "Por que a FC do flutter típico costuma ser 150?", "a": "Átrio a 300 bpm com condução AV 2:1."}, {"t": "h2", "v": "Flutter atrial: classificação e clínica"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [48], "cap": "Resumo do flutter atrial"}, {"t": "ul", "v": ["O flutter é <b>5 a 10% das TPSV<\/b>.", "Classificação pelo tempo:<ul class=\"sub\"><li><b>Paroxístico<\/b>: reverte sozinho em <b>menos de 7 dias<\/b> (em geral em menos de 24 a 48 h);<\/li><li><b>Persistente<\/b>: <b>mais de 7 dias<\/b>;<\/li><li><b>Persistente de longa data<\/b>: <b>mais de 1 ano<\/b>;<\/li><li><b>Permanente<\/b>: aceito como crônico.<\/li><\/ul>", "Clínica: palpitações, dispneia, dor precordial, tontura, palidez, sudorese fria, pré-síncope e mais:<ul class=\"sub\"><li><b>Fenômenos tromboembólicos<\/b> quando dura <b>mais de 48 h<\/b>;<\/li><li><b>Taquicardiomiopatia dilatada<\/b> quando dura <b>mais de 1 mês<\/b>.<\/li><\/ul>", "ECG sinusal: normal (o slide deixa um ponto de interrogação, porque pode haver alterações atriais)."]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-flutter-os-prazos", "label": "Flutter: os prazos", "v": "", "li": ["Paroxístico <b>menos de 7 dias<\/b>; persistente <b>mais de 7 dias<\/b>", "Longa data <b>mais de 1 ano<\/b>; permanente = aceito", "Mais de <b>48 h<\/b>: risco de <b>tromboembolismo<\/b>", "Mais de <b>1 mês<\/b>: <b>taquicardiomiopatia<\/b>"]}, {"t": "lance", "q": "Com quanto tempo o flutter traz risco de tromboembolismo?", "a": "Mais de 48 horas."}, {"t": "h2", "v": "Flutter atrial: tratamento"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [45, 46, 47, 49], "cap": "Ablação do istmo cavotricuspídeo e o tratamento do flutter"}, {"t": "img", "src": "img/cm-taqui/s45.webp", "cap": "Slide 45: o cateter de ablação no istmo cavotricuspídeo (seta amarela), entre a veia cava inferior e a tricúspide."}, {"t": "ul", "v": ["<b>Tratamento curativo<\/b>: <b>ablação por cateter<\/b> do istmo cavotricuspídeo, com <b>sucesso de cerca de 90%<\/b>.", "<b>Tratamento paliativo<\/b>:<ul class=\"sub\"><li><b>Cardioversão<\/b>, se o flutter tem <b>menos de 48 h<\/b> ou se o <b>ecocardiograma transesofágico (ETE)<\/b> não mostra trombo: elétrica ou farmacológica (em geral <b>amiodarona ou propafenona<\/b>; também sotalol, ibutilida, dofetilida, flecainida).<\/li><li><b>Controle do ritmo<\/b> (manter sinusal): em geral <b>amiodarona, propafenona ou sotalol<\/b> (também flecainida, dofetilida, dronedarona).<\/li><li><b>Controle da FC<\/b>, se tem <b>mais de 48 h<\/b> ou trombo no ETE: meta de <b>60 a 80 bpm em repouso e menos de 110 no esforço<\/b> (ou só menos de 110); com <b>betabloqueador, verapamil, digital<\/b> e amiodarona (esta só sem trombo ou se já em uso).<\/li><li><b>Anticoagulação<\/b> (quase sempre, pelo risco no <b>CHA2DS2-VASc<\/b>): heparina (IV ou SC), varfarina (VO, com <b>RNI entre 2 e 3<\/b>) ou os anticoagulantes diretos: <b>dabigatrana, rivaroxabana, apixabana e edoxabana<\/b>.<\/li><li>Raramente, <b>ablação da junção AV + marcapasso<\/b> ou ressincronizador.<\/li><\/ul>"]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Por que a amiodarona só \"sem trombo ou já em uso\" no controle de FC: ela pode reverter o ritmo para sinusal, e a volta da contração atrial pode soltar um trombo. Quem decide reverter precisa estar anticoagulado ou com ETE limpo."}, {"t": "atual", "label": "flutter típico", "v": "Nas diretrizes atuais, a <b>ablação do istmo cavotricuspídeo é primeira linha<\/b> no flutter típico recorrente, com sucesso acima de 90%. A anticoagulação segue as mesmas regras da fibrilação atrial.", "src": [["ESC 2019 · Taquicardia supraventricular", "https://doi.org/10.1093/eurheartj/ehz467"], ["Pérez · metanálise da ablação do ICT (2009)", "https://doi.org/10.1161/CIRCEP.109.871665"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-flutter-tratamento", "label": "Flutter: tratamento", "v": "Cura = ablação do <b>istmo cavotricuspídeo<\/b> (cerca de <b>90%<\/b>).", "li": ["Cardioversão se <b>menos de 48 h<\/b> ou <b>ETE sem trombo<\/b>", "Ritmo: amiodarona, propafenona, sotalol", "FC: meta <b>60 a 80 em repouso, menos de 110 no esforço<\/b>", "Anticoagular pelo <b>CHA2DS2-VASc<\/b>"]}, {"t": "lance", "q": "Qual o alvo da ablação do flutter típico?", "a": "O istmo cavotricuspídeo."}, {"t": "h2", "v": "Fibrilação atrial: o que é e como aparece no ECG"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [51, 52, 53, 54], "cap": "O ECG da FA, o registro intracardíaco e a indução por extrassístole"}, {"t": "img", "src": "img/cm-taqui/s51.webp", "cap": "Slide 51: fibrilação atrial no ECG de 12 derivações. Sem onda P e com intervalos RR irregulares."}, {"t": "ul", "v": ["Na fibrilação atrial (FA) os átrios <b>não contraem<\/b>: a atividade elétrica é desorganizada, com centenas de frentes de onda.", "O <b>ECG da FA<\/b> (slides 51 e 52): <b>sem onda P<\/b>, com tremor da linha de base (ondas f) e intervalos <b>RR irregularmente irregulares<\/b>.", "O slide 53 mostra o registro intracardíaco: atividade atrial caótica.", "O slide 54 mostra a <b>indução da FA por uma extrassístole<\/b> atrial."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Três achados para escrever na prova: <b>ausência de onda P<\/b>, <b>ondas f<\/b> e <b>RR irregular<\/b>. A irregularidade é a pista mais forte: o nó AV deixa passar estímulos ao acaso, então nenhum RR é igual ao anterior."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-ecg-da-fibrilacao-atrial", "label": "ECG da fibrilação atrial", "v": "", "li": ["<b>Ausência de onda P<\/b>", "Ondas <b>f<\/b> (linha de base tremida)", "<b>RR irregularmente irregular<\/b>", "Começa, muitas vezes, com uma <b>extrassístole atrial<\/b>"]}, {"t": "lance", "q": "Qual a pista mais forte de FA no ECG?", "a": "RR irregularmente irregular, sem onda P."}, {"t": "h2", "v": "Fibrilação atrial: epidemiologia e prognóstico"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [55, 56, 61, 63], "cap": "Dados epidemiológicos, desfechos (ESC 2020) e fatores de risco"}, {"t": "img", "src": "img/cm-taqui/s55.webp", "cap": "Slide 55: desfechos clínicos da FA segundo a ESC 2020 (morte, AVC, disfunção do VE, declínio cognitivo, depressão, qualidade de vida e internações)."}, {"t": "ul", "v": ["É a <b>arritmia sustentada mais frequente<\/b> na prática clínica (II Diretrizes Brasileiras de FA, 2016).", "População geral: <b>0,5 a 1%<\/b> (Itália 1,9%, Suécia 2,9%). Abaixo de 60 anos, menos de 1%; acima de 80, <b>8%<\/b>. No slide 66: <b>2% dos adultos e 10% acima de 85 anos<\/b>.", "Desfechos (ESC 2020):<ul class=\"sub\"><li><b>Morte<\/b>: risco <b>1,5 a 3,5 vezes<\/b> maior (por IC, comorbidades e AVC);<\/li><li><b>AVC<\/b>: <b>20 a 30% de todos os AVC isquêmicos<\/b> e 10% dos criptogênicos;<\/li><li><b>Disfunção do VE e IC<\/b>: em 20 a 30% dos pacientes com FA;<\/li><li>Declínio cognitivo e demência vascular, depressão (16 a 20%), pior qualidade de vida (mais de 60%) e <b>10 a 40% de internação por ano<\/b>.<\/li><\/ul>", "Framingham (slide 61): quem tem AVC <b>com FA<\/b> sobrevive menos que quem tem AVC sem FA.", "Fatores de risco (slide 63): <b>envelhecimento<\/b>, sexo masculino, genética, hipertensão, insuficiência cardíaca, doença valvar, coronariopatia, doença vascular, diabetes, DRC, obesidade, apneia do sono, DPOC, álcool, tabagismo, sedentarismo ou atividade física intensa e doenças inflamatórias. Quanto mais fatores, maior o risco ao longo da vida."]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-fa-por-que-importa", "label": "FA: por que importa", "v": "A arritmia sustentada mais frequente.", "li": ["<b>0,5 a 2%<\/b> dos adultos; <b>8 a 10%<\/b> acima de 80 a 85 anos", "Mortalidade <b>1,5 a 3,5 vezes<\/b> maior", "<b>20 a 30% dos AVC isquêmicos<\/b>", "IC em 20 a 30%; internação de 10 a 40% ao ano"]}, {"t": "lance", "q": "Que fração dos AVC isquêmicos se deve à FA?", "a": "De 20 a 30%."}, {"t": "h2", "v": "Fibrilação atrial: classificação e evolução"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [62, 65, 66], "cap": "Evolução natural (ESC 2010) e classificação (HRS 2017, ESC 2020)"}, {"t": "img", "src": "img/cm-taqui/s62.webp", "cap": "Slide 62: evolução natural da FA, de silenciosa e paroxística a persistente e permanente, com o lugar de cada tratamento."}, {"t": "ul", "v": ["<b>Primeiro episódio<\/b>: sem diagnóstico prévio.", "<b>Paroxística<\/b>: dura <b>menos de 7 dias<\/b> (reverte sozinha ou com cardioversão; em geral em menos de 48 h).", "<b>Persistente<\/b>: <b>7 dias ou mais<\/b>. <b>Persistente precoce<\/b>: menos de 3 meses.", "<b>Persistente de longa duração<\/b>: <b>mais de 1 ano<\/b>.", "<b>Permanente<\/b>: aceita pelo paciente e pelo médico, <b>sem novas tentativas de reverter<\/b> para ritmo sinusal.", "<b>FA não valvar<\/b>: sem <b>estenose mitral moderada ou grave<\/b> e sem <b>prótese valvar mecânica<\/b>.", "Clínica (slide 66): palpitações, dispneia e cansaço, dor precordial, <b>fenômenos tromboembólicos (mais de 48 h)<\/b> e <b>taquicardiomiopatia dilatada (1 mês)<\/b>.", "A evolução natural (slide 62) vai de <b>silenciosa → paroxística → persistente → longa duração → permanente<\/b>, e o tratamento das condições associadas, a anticoagulação e o controle de FC acompanham todas as fases."]}, {"t": "atual", "label": "classificação nas diretrizes novas", "v": "A diretriz americana de 2023 acrescentou <b>estágios<\/b>: 1 (em risco, com fatores de risco), 2 (pré-FA, com alterações atriais), 3 (FA paroxística, persistente, de longa duração ou após ablação) e 4 (permanente). A ideia é agir antes de a FA aparecer, tratando os fatores de risco. A classificação por tempo do slide continua valendo.", "src": [["ACC/AHA/ACCP/HRS 2023 · FA", "https://doi.org/10.1161/CIR.0000000000001193"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-fa-classificacao", "label": "FA: classificação", "v": "Pelo tempo de duração.", "li": ["<b>Paroxística<\/b>: menos de 7 dias", "<b>Persistente<\/b>: 7 dias ou mais (precoce: menos de 3 meses)", "<b>Longa duração<\/b>: mais de 1 ano", "<b>Permanente<\/b>: decisão de não tentar mais reverter", "<b>Não valvar<\/b>: sem estenose mitral moderada/grave nem prótese mecânica"]}, {"t": "lance", "q": "O que é FA permanente?", "a": "A FA aceita por paciente e médico, sem novas tentativas de reverter."}, {"t": "h2", "v": "Detectar a arritmia: do ECG de bolso ao monitor implantável"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [12, 13, 57, 58, 59, 60], "cap": "Novas tecnologias de detecção e a carga de FA"}, {"t": "img", "src": "img/cm-taqui/s58.webp", "cap": "Slide 58: o ECG \"de bolso\" de 6 derivações (DI, DII, DIII, aVR, aVL, aVF), com os eletrodos nas duas mãos e na perna esquerda, como no triângulo de Einthoven."}, {"t": "ul", "v": ["<b>ECG \"de bolso\"<\/b>: aparelho com <b>6 derivações<\/b> (DI, DII, DIII, aVR, aVL e aVF), ligado ao celular; os dedos e a perna fazem o papel do triângulo de Einthoven.", "<b>ECG \"de pulso\" (smartwatch)<\/b>:<ul class=\"sub\"><li>Relógios mais antigos (Apple Watch séries 1 a 3) usam <b>sensor óptico<\/b> (fotopletismografia) e geram um tacograma: <b>frequência e regularidade<\/b> do pulso.<\/li><li>A partir da série 4, além do tacograma, <b>registram o ECG de uma derivação (DI)<\/b>.<\/li><\/ul>", "<b>Carga de FA (AF burden)<\/b>: quanto tempo a pessoa passa em FA (frequência dos episódios, proporção do tempo e o episódio mais longo). Medida por marcapassos e desfibriladores, monitores de eventos, celular e relógio.", "O slide 60 mostra o <b>monitor de eventos implantável<\/b>, colocado sob a pele do tórax, que registra episódios de FA por anos."]}, {"t": "atual", "label": "relógio que avisa FA", "v": "No Apple Heart Study (419 mil participantes), o relógio usou só o <b>sensor óptico<\/b> de pulso; 0,52% receberam aviso de pulso irregular. Quem recebeu usou um adesivo de ECG por até 7 dias, e quando um novo aviso coincidiu com o adesivo, a FA estava lá em <b>84%<\/b> das vezes (valor preditivo positivo). O aviso do relógio <b>não fecha diagnóstico<\/b>: a FA precisa ser documentada em ECG (12 derivações ou um traçado de pelo menos 30 segundos).", "src": [["Apple Heart Study · NEJM 2019", "https://doi.org/10.1056/NEJMoa1901183"], ["ESC 2024 · Fibrilação atrial", "https://doi.org/10.1093/eurheartj/ehae176"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-deteccao-o-que-cada-aparelho-faz", "label": "Detecção: o que cada aparelho faz", "v": "", "li": ["ECG de bolso: <b>6 derivações<\/b> dos membros", "Relógio antigo: <b>sensor óptico<\/b> (FC e regularidade)", "Relógio série 4+: <b>ECG de 1 derivação (DI)<\/b>", "<b>Carga de FA<\/b>: tempo total em FA; monitor implantável"]}, {"t": "lance", "q": "Quantas derivações tem o ECG de bolso do slide?", "a": "Seis: DI, DII, DIII, aVR, aVL e aVF."}, {"t": "h2", "v": "CHA2DS2-VASc e anticoagulação"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [64, 67, 68, 69], "cap": "O escore, o risco anual de AVC e o algoritmo da ESC 2020"}, {"t": "img", "src": "img/cm-taqui/s67.webp", "cap": "Slide 67: o escore CHA2DS2-VASc (máximo de 9 pontos)."}, {"t": "table", "head": ["Letra", "Fator", "Pontos"], "rows": [["C", "IC congestiva ou disfunção do VE (FEVE de 40% ou menos)", "1"], ["H", "Hipertensão", "1"], ["A2", "Idade de 75 anos ou mais", "2"], ["D", "Diabetes mellitus", "1"], ["S2", "AVC, AIT ou tromboembolismo prévio", "2"], ["V", "Doença vascular (IAM, doença arterial periférica, placa na aorta)", "1"], ["A", "Idade de 65 a 74 anos", "1"], ["Sc", "Sexo feminino", "1"]]}, {"t": "ul", "v": ["O risco de AVC sobe com o escore (slide 68): 0 ponto, 0% ao ano; 1 ponto, 1,3%; 2 pontos, 2,2%; 4 pontos, 4,0%; 9 pontos, 15,2%.", "Algoritmo da ESC 2020 (slide 69):<ul class=\"sub\"><li><b>Risco baixo<\/b> (0 no homem, 1 na mulher): <b>sem antitrombótico<\/b>.<\/li><li><b>1 no homem ou 2 na mulher<\/b>: anticoagulação oral <b>deve ser considerada<\/b> (classe IIa).<\/li><li><b>2 ou mais no homem, 3 ou mais na mulher<\/b>: anticoagulação oral <b>recomendada<\/b> (classe I).<\/li><li>Calcular o <b>HAS-BLED<\/b>. Se for 3 ou mais, corrigir os fatores de sangramento modificáveis e acompanhar de perto. <b>Risco alto de sangramento não é motivo para deixar de anticoagular.<\/b><\/li><\/ul>", "O slide 64 mostra a via <b>ABC<\/b> da ESC 2020: <b>A<\/b>nticoagulação (evitar AVC), <b>B<\/b>etter symptom control (controle de sintomas: FC e ritmo) e <b>C<\/b>omorbidades e fatores de risco cardiovascular."]}, {"t": "atual", "label": "o escore mudou em 2024", "v": "A diretriz europeia de 2024 trocou o CHA2DS2-VASc pelo <b>CHA2DS2-VA<\/b>: tirou o ponto do sexo feminino, porque ele só aumentava o risco junto com outros fatores. Agora a anticoagulação é <b>recomendada com 2 ou mais pontos<\/b> e <b>considerada com 1<\/b>, para homens e mulheres. A via ABC virou <b>AF-CARE<\/b>. E os anticoagulantes diretos (DOAC) são <b>preferidos à varfarina<\/b>, exceto em prótese valvar mecânica e estenose mitral moderada ou grave. A nova <b>Diretriz Brasileira de FA (SBC, 2025)<\/b>, que substituiu a de 2016 citada no slide, seguiu o mesmo caminho e adotou o CHA2DS2-VA.", "src": [["ESC 2024 · Fibrilação atrial", "https://doi.org/10.1093/eurheartj/ehae176"], ["SBC 2025 · Diretriz Brasileira de FA", "https://doi.org/10.36660/abc.20250618"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-cha2ds2-vasc", "label": "CHA2DS2-VASc", "v": "Máximo de 9 pontos.", "li": ["<b>2 pontos<\/b>: idade de <b>75 ou mais<\/b> e <b>AVC/AIT/embolia<\/b> prévia", "<b>1 ponto<\/b>: IC, HAS, diabetes, doença vascular, 65 a 74 anos, sexo feminino", "ESC 2020: anticoagular com <b>2 ou mais (homem) ou 3 ou mais (mulher)<\/b>", "HAS-BLED alto <b>não impede<\/b> anticoagular", "ESC 2024: <b>CHA2DS2-VA<\/b> (sem o sexo)"]}, {"t": "lance", "q": "Com quantos pontos a ESC 2020 recomenda anticoagular um homem?", "a": "Com 2 ou mais."}, {"t": "h2", "v": "Fibrilação atrial: tratamento"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [70], "cap": "Tratamento curativo e paliativo da FA"}, {"t": "ul", "v": ["<b>Tratamento curativo<\/b>: <b>ablação por cateter<\/b>, com sucesso de <b>cerca de 70 a 88%<\/b> (menor que no flutter e na TPSV).", "<b>Tratamento paliativo<\/b> (o mesmo esquema do flutter):<ul class=\"sub\"><li><b>Cardioversão<\/b>, se <b>menos de 48 h<\/b> ou <b>ETE sem trombo<\/b>: elétrica ou farmacológica (em geral amiodarona ou propafenona).<\/li><li><b>Controle do ritmo<\/b>: amiodarona, propafenona ou sotalol (também flecainida, dofetilida, dronedarona).<\/li><li><b>Controle da FC<\/b>, se <b>mais de 48 h<\/b> ou trombo: <b>60 a 80 bpm em repouso e menos de 110 no esforço<\/b> (ou só menos de 110); betabloqueador, verapamil, digital e amiodarona (sem trombo ou se já em uso).<\/li><li><b>Anticoagulação<\/b> quase sempre, pelo CHA2DS2-VASc: heparina, varfarina (<b>RNI 2 a 3<\/b>) ou DOAC (dabigatrana, rivaroxabana, apixabana, edoxabana).<\/li><li>Raramente, <b>ablação da junção AV + marcapasso<\/b> ou ressincronizador.<\/li><\/ul>"]}, {"t": "atual", "label": "cardioversão e ritmo precoce", "v": "A diretriz europeia de 2024 baixou o limite seguro para cardioverter sem preparo: se a FA dura <b>mais de 24 h<\/b> (antes, 48 h), é preciso <b>anticoagular por 3 semanas ou fazer ETE<\/b> antes. Depois da cardioversão, anticoagular por pelo menos 4 semanas. O estudo EAST-AFNET 4 mostrou que <b>controlar o ritmo cedo<\/b> (no primeiro ano do diagnóstico) reduz morte cardiovascular e AVC. O controle \"leniente\" da FC (menos de 110 em repouso) foi validado pelo estudo RACE II. E a ablação passou a ser opção de <b>primeira linha<\/b> na FA paroxística sintomática (ESC 2024), em vez de só depois de falhar o remédio.", "src": [["ESC 2024 · Fibrilação atrial", "https://doi.org/10.1093/eurheartj/ehae176"], ["EAST-AFNET 4 · NEJM 2020", "https://doi.org/10.1056/NEJMoa2019422"], ["RACE II · NEJM 2010", "https://doi.org/10.1056/NEJMoa1001337"]]}, {"t": "escreva", "id": "cm2-cardio-taqui-w-fa-os-quatro-pilares", "label": "FA: os quatro pilares", "v": "Cura = ablação (<b>70 a 88%<\/b>).", "li": ["<b>Anticoagular<\/b> pelo CHA2DS2-VASc (DOAC ou varfarina com RNI 2 a 3)", "<b>Controle de FC<\/b>: 60 a 80 em repouso, menos de 110 no esforço", "<b>Controle do ritmo<\/b>: amiodarona, propafenona, sotalol", "<b>Cardioversão<\/b>: menos de 48 h (ESC 2024: 24 h) ou ETE sem trombo"]}, {"t": "lance", "q": "Qual a meta de FC em repouso no slide?", "a": "De 60 a 80 bpm (menos de 110 no esforço)."}, {"t": "h2", "v": "Ablação da FA: isolar as veias pulmonares"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [71, 72, 73, 74, 75, 76, 77], "cap": "Gatilhos nas veias pulmonares e os casos de ablação do professor"}, {"t": "img", "src": "img/cm-taqui/s72.webp", "cap": "Slide 72: isolamento da veia pulmonar superior esquerda. Depois da ablação, a veia continua em FA, mas o átrio fica em ritmo sinusal (bloqueio de saída)."}, {"t": "ul", "v": ["O slide 71 mostra que a FA é <b>induzida por extrassístoles que nascem na veia pulmonar superior esquerda<\/b> (VPSE).", "Por isso a ablação da FA faz o <b>isolamento elétrico das veias pulmonares<\/b>: uma cicatriz em volta da entrada das veias impede que os disparos cheguem ao átrio.", "No slide 72, depois do isolamento, a veia segue em FA e o átrio fica em <b>ritmo sinusal<\/b>: é o <b>bloqueio de saída<\/b>.", "Nos casos mais avançados (slides 73 a 77), além das veias, a ablação inclui a parede posterior do AE, o teto, a base do apêndice atrial esquerdo, o <b>istmo mitral<\/b> (flutter atípico do AE) e o <b>istmo cavotricuspídeo<\/b> (flutter típico), com mapeamento eletroanatômico (CARTO3).", "O slide 73 é um caso de <b>FA persistente com taquicardiomiopatia dilatada<\/b> (cardiomiopatia induzida pela FA)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A taquicardiomiopatia é a insuficiência cardíaca causada pela própria taquicardia. A boa notícia: ela <b>melhora quando o ritmo ou a FC são controlados<\/b>. Por isso, em quem tem FA e FE baixa, vale pensar em ablação."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-ablacao-da-fa", "label": "Ablação da FA", "v": "", "li": ["Gatilho: extrassístoles das <b>veias pulmonares<\/b>", "Procedimento: <b>isolamento das veias pulmonares<\/b>", "Sucesso: <b>bloqueio de saída<\/b> (veia em FA, átrio em sinusal)", "FA com <b>taquicardiomiopatia<\/b>: o controle do ritmo pode recuperar a FE"]}, {"t": "lance", "q": "De onde vêm os gatilhos da FA?", "a": "Das veias pulmonares."}, {"t": "h2", "v": "FA e flutter na emergência"}, {"t": "slides", "deck": "cm-taqui", "tot": 79, "n": [78], "cap": "Algoritmo para cardioversão da FA e do flutter"}, {"t": "img", "src": "img/cm-taqui/s78.webp", "cap": "Slide 78: abordagem da FA e do flutter na emergência (Manual Prático de Cardiologia SBLC, 2012)."}, {"t": "ul", "v": ["O algoritmo pergunta primeiro: a FA ou o flutter começou <b>há menos de 48 h<\/b>?", "<b>Sim (menos de 48 h)<\/b>: <b>heparina → cardioversão (CV)<\/b>.<ul class=\"sub\"><li>Se voltou ao ritmo sinusal, decide-se a anticoagulação de longo prazo pelos <b>fatores de risco<\/b>: se há, anticoagular; se não, sem anticoagulante.<\/li><li>Se continuou em FA, controle de FC e anticoagulação.<\/li><\/ul>", "<b>Não (mais de 48 h)<\/b>, há dois caminhos:<ul class=\"sub\"><li><b>Estratégia convencional<\/b>: <b>anticoagulação oral por 3 semanas → CV → 4 semanas de anticoagulação<\/b> → considerar anticoagulação de longo prazo pelos fatores de risco.<\/li><li><b>Estratégia com ETE<\/b>: <b>sem trombo<\/b> → heparina → CV → 4 semanas de anticoagulação. <b>Com trombo<\/b> → anticoagulação por 3 semanas e novo exame; se o <b>trombo persiste<\/b>, anticoagulação de longo prazo e <b>controle da FC<\/b> (não cardioverter).<\/li><\/ul>", "E sempre: paciente <b>instável<\/b> (hipotensão, choque, edema agudo, isquemia) vai para <b>cardioversão elétrica imediata<\/b>, com heparina."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> O raciocínio por trás do algoritmo: depois de cerca de 48 h de átrio parado, pode haver trombo no apêndice atrial esquerdo. Reverter para sinusal faz o átrio voltar a contrair e o trombo pode soltar. Por isso, ou se anticoagula 3 semanas antes, ou se olha o átrio por dentro (ETE). E as 4 semanas depois existem porque o átrio leva tempo para voltar a contrair bem (o \"atordoamento atrial\")."}, {"t": "escreva", "id": "cm2-cardio-taqui-w-fa-flutter-cardioverter-ou-nao", "label": "FA/flutter: cardioverter ou não", "v": "A pergunta é: há quanto tempo?", "li": ["<b>Menos de 48 h<\/b>: heparina e <b>cardioversão<\/b>", "<b>Mais de 48 h<\/b>: <b>3 semanas de anticoagulação<\/b> ou <b>ETE sem trombo<\/b> antes", "Depois da cardioversão: <b>4 semanas de anticoagulação<\/b>", "Trombo persistente: <b>não cardioverter<\/b>; controlar a FC e anticoagular", "<b>Instável<\/b>: cardioversão elétrica imediata"]}, {"t": "lance", "q": "O que fazer antes de cardioverter uma FA com mais de 48 h?", "a": "Anticoagular por 3 semanas ou fazer ETE sem trombo."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Quais são as três condições para existir uma reentrada?", "a": "Duas vias de condução, bloqueio unidirecional em uma delas e condução lenta na outra."}, {"q": "Qual é a TPSV mais comum e qual a sua proporção?", "a": "A taquicardia reentrante nodal AV (TRN), com 60 a 70% das TPSV."}, {"q": "O que é o \"frog sign\"?", "a": "A turgência jugular pulsátil na crise de TPSV (típica da TRN), porque o átrio contrai com a tricúspide fechada."}, {"q": "Onde fica a onda P na crise de TRN e qual o RP'?", "a": "No final do QRS (vista em V1), com RP' menor que 70 ms."}, {"q": "Onde fica a onda P na crise de TRAV e qual o RP'?", "a": "Depois do QRS, separada dele, com RP' maior que 70 ms."}, {"q": "O que define a síndrome de Wolff-Parkinson-White?", "a": "Pré-excitação ventricular no ECG (PR curto e onda delta) acompanhada de sintomas (taquiarritmia)."}, {"q": "Qual a forma mais comum de TRAV e como é o QRS nela?", "a": "A ortodrômica (95%), com QRS estreito: desce pelo nó AV e volta pela via acessória."}, {"q": "Qual a sequência de tratamento da TPSV estável na emergência?", "a": "Manobra vagal, depois adenosina IV (6 mg em bolus rápido), depois verapamil IV (se FE maior que 40%) e, se falhar, cardioversão elétrica."}, {"q": "Qual o tratamento curativo da TRN e o da TRAV?", "a": "Ablação por cateter: da via lenta na TRN (cerca de 95%) e do feixe anômalo na TRAV (cerca de 94%)."}, {"q": "Qual a FC atrial do flutter típico e por que a FC ventricular costuma ser 150?", "a": "De 250 a 300 bpm, com condução AV 2:1, o que dá cerca de 150 bpm no ventrículo."}, {"q": "Em quais derivações aparecem as ondas F negativas do flutter típico anti-horário?", "a": "DII, DIII e aVF (o \"serrilhado\")."}, {"q": "Quais os três achados do ECG na fibrilação atrial?", "a": "Ausência de onda P, ondas f e intervalos RR irregularmente irregulares."}, {"q": "Como se classifica a FA pelo tempo?", "a": "Paroxística (menos de 7 dias), persistente (7 dias ou mais), persistente de longa duração (mais de 1 ano) e permanente (sem novas tentativas de reverter)."}, {"q": "Quais itens valem 2 pontos no CHA2DS2-VASc?", "a": "Idade de 75 anos ou mais e AVC, AIT ou tromboembolismo prévio."}, {"q": "Quando se pode cardioverter uma FA sem anticoagulação prévia de 3 semanas?", "a": "Se começou há menos de 48 h (ESC 2024: menos de 24 h) ou se o ecocardiograma transesofágico não mostra trombo."}, {"q": "Qual o alvo da ablação da fibrilação atrial?", "a": "O isolamento elétrico das veias pulmonares, onde nascem as extrassístoles que disparam a FA."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "Homem de 28 anos com palpitações de início e término súbitos. Na crise, FC de 180 bpm, QRS estreito, sem onda P visível, com pseudo-r' em V1. O ECG fora da crise é normal. O diagnóstico mais provável é:", "opts": ["Fibrilação atrial", "Taquicardia reentrante nodal AV", "Flutter atrial com condução 2:1", "Taquicardia reentrante AV antidrômica"], "ok": 1, "exp": "Certa a B: TPSV regular de QRS estreito com a P escondida no fim do QRS (pseudo-r' em V1, RP' menor que 70 ms) e ECG basal normal é a TRN, a mais comum. A está errada porque a FA é irregular. C está errada porque o flutter 2:1 roda perto de 150 e mostra ondas F em DII, DIII e aVF. D está errada porque a antidrômica tem QRS largo. Revise \"TRN: o ECG da crise\"."}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "Sobre a síndrome de Wolff-Parkinson-White, é correto afirmar:", "opts": ["O ECG basal é sempre normal, porque a via acessória só conduz durante a crise.", "A taquicardia mais comum é a antidrômica, com QRS largo.", "O ECG basal pode mostrar PR curto e onda delta, e a síndrome exige sintomas.", "A ablação do feixe anômalo tem sucesso em menos de 50% dos casos."], "ok": 2, "exp": "Certa a C: a via manifesta produz pré-excitação (PR curto e onda delta), e WPW é pré-excitação com sintomas. A está errada porque isso vale só para a via oculta. B está errada: a ortodrômica é 95% dos casos. D está errada: o sucesso da ablação é de cerca de 94%. Revise \"Via acessória e Wolff-Parkinson-White\"."}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "Mulher de 35 anos com TPSV de QRS estreito, PA 120/80 mmHg, sem dor torácica e sem dispneia. A primeira conduta é:", "opts": ["Cardioversão elétrica sincronizada", "Amiodarona IV", "Manobra vagal", "Digital IV"], "ok": 2, "exp": "Certa a C: paciente estável começa pela manobra vagal (de preferência a Valsalva modificada); se falhar, adenosina IV. A está errada porque a cardioversão é para o instável. B e D estão erradas porque não são primeira linha (e saíram do tratamento agudo na ESC 2019). Revise \"TPSV na emergência\"."}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "Homem de 66 anos, hipertenso, com FA há 5 dias, estável. Não fez ecocardiograma transesofágico. A conduta mais adequada para tentar o ritmo sinusal é:", "opts": ["Cardioversão elétrica imediata, sem anticoagulação", "Cardioversão química com amiodarona hoje", "Anticoagular por 3 semanas, cardioverter e manter a anticoagulação por pelo menos 4 semanas", "Ablação da junção AV com marcapasso"], "ok": 2, "exp": "Certa a C: FA com mais de 48 h só é cardiovertida após 3 semanas de anticoagulação (ou ETE sem trombo), mantendo 4 semanas depois. A e B estão erradas pelo risco de embolizar um trombo do apêndice atrial (a amiodarona também pode reverter o ritmo). D está errada porque é uma medida rara, para FA refratária. Revise \"FA e flutter na emergência\"."}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "Mulher de 70 anos, hipertensa e diabética, com FA não valvar. O CHA2DS2-VASc dela é:", "opts": ["2", "3", "4", "5"], "ok": 2, "exp": "Certa a C: idade de 65 a 74 (1) + hipertensão (1) + diabetes (1) + sexo feminino (1) = 4, e a anticoagulação está indicada. A e B esquecem um ou dois itens (em geral o sexo ou a idade). D erraria ao contar a idade como 2, o que só vale a partir de 75 anos. Pelo CHA2DS2-VA da ESC 2024, sem o sexo, ela teria 3 e também anticoagularia. Revise \"CHA2DS2-VASc e anticoagulação\"."}, {"t": "mcq", "src": "Treino · sobre a aula 7", "stem": "ECG com taquicardia regular de QRS estreito, FC de 150 bpm e ondas negativas em dentes de serrote em DII, DIII e aVF. O tratamento curativo de escolha é:", "opts": ["Isolamento das veias pulmonares", "Ablação do istmo cavotricuspídeo", "Ablação da via lenta do nó AV", "Verapamil por tempo indeterminado"], "ok": 1, "exp": "Certa a B: é flutter atrial típico anti-horário (atrial a 300, condução 2:1), cujo circuito passa pelo istmo cavotricuspídeo; a ablação dele cura cerca de 90%. A é o alvo da FA. C é o alvo da TRN. D só controla a FC e não cura. Revise \"Flutter atrial: o circuito e o ECG\"."}]}]}, {"id": "reumato", "nome": "Reumatologia", "area": "Clínica Médica", "prova": "", "cor": "reumato", "aulas": []}, {"id": "pneumo", "nome": "Pneumologia", "area": "Clínica Médica", "prova": "", "cor": "pneumo", "aulas": []}, {"id": "pato", "nome": "Patologia", "area": "Outras matérias", "prova": "", "cor": "pato", "aulas": []}, {"id": "aps", "nome": "Atenção Primária à Saúde", "area": "Outras matérias", "prova": "", "cor": "aps", "aulas": []}, {"id": "psiq", "nome": "Psiquiatria", "area": "Outras matérias", "prova": "", "cor": "psiq", "aulas": [{"id": "ps-conceito", "title": "1. O que é o TOC", "sub": "Conceito, as duas peças (obsessão e compulsão), a história da ideia e a epidemiologia · DSM-5-TR, CID-11, NCS-R e metanálises", "blocks": [{"t": "h2", "v": "Obsessão e compulsão: as duas peças"}, {"t": "ul", "v": ["<b>Obsessões<\/b>: pensamentos, impulsos ou imagens <b>recorrentes e persistentes<\/b>, vividos como <b>intrusivos e indesejados<\/b>, que na maioria das pessoas causam <b>ansiedade ou sofrimento acentuados<\/b>. A pessoa tenta ignorá-los, suprimi-los ou <b>neutralizá-los<\/b> com outro pensamento ou ação (DSM-5-TR).", "<b>Compulsões<\/b>: comportamentos repetitivos (lavar, organizar, verificar) ou <b>atos mentais<\/b> (rezar, contar, repetir palavras em silêncio) que a pessoa se sente <b>compelida<\/b> a executar <b>em resposta a uma obsessão<\/b> ou segundo <b>regras rígidas<\/b>.", "A compulsão visa <b>reduzir a ansiedade<\/b> ou <b>evitar um evento temido<\/b>, mas <b>não tem ligação realista<\/b> com o que pretende evitar, ou é <b>claramente excessiva<\/b>.", "A obsessão é <b>egodistônica<\/b>: a pessoa a reconhece como produto da própria mente (não inserida de fora, como no delírio de inserção de pensamento), mas sente que ela <b>contraria quem ela é<\/b> e o que ela quer.", "A maioria das pessoas com TOC tem <b>obsessões e compulsões<\/b> juntas; compulsões sem obsessão identificável são mais comuns em crianças pequenas, que podem não conseguir explicar o objetivo do ritual."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> \"Obsessão\" vem do latim <i>obsidere<\/i>, sitiar, cercar. A palavra descreve bem a experiência: a pessoa não escolhe o pensamento, é cercada por ele."}, {"t": "table", "head": ["", "Obsessão", "Compulsão"], "rows": [["O que é", "Pensamento, impulso ou imagem", "Comportamento ou ato mental"], ["Como chega", "Intrusiva, indesejada", "A pessoa se sente compelida"], ["Efeito", "<b>Aumenta<\/b> ansiedade, nojo ou sensação de incompletude", "<b>Reduz<\/b> o desconforto, por pouco tempo"], ["Exemplo", "\"E se eu contaminar minha família?\"", "Lavar as mãos até a pele rachar"]]}, {"t": "escreva", "id": "ps-conceito-w-obsessao-e-compulsao", "label": "Obsessão e compulsão", "v": "", "li": ["<b>Obsessão<\/b>: pensamento, impulso ou imagem recorrente, intrusivo e indesejado, que gera ansiedade", "<b>Compulsão<\/b>: comportamento ou ato mental repetitivo para neutralizar a obsessão ou seguir regra rígida", "Compulsão: sem conexão realista ou claramente excessiva", "Obsessão é <b>egodistônica<\/b> e reconhecida como da própria mente"]}, {"t": "lance", "q": "O que torna uma obsessão \"egodistônica\"?", "a": "A pessoa reconhece o pensamento como da própria mente, mas sente que ele contraria quem ela é e o que ela quer."}, {"t": "h2", "v": "O ciclo que mantém o TOC"}, {"t": "ul", "v": ["O TOC funciona como um <b>circuito fechado<\/b> de quatro tempos:<ul class=\"sub\"><li><b>1. Gatilho<\/b>: uma situação, um objeto, um pensamento.<\/li><li><b>2. Obsessão<\/b>: a ideia intrusiva e a interpretação catastrófica dela (\"se eu pensei isso, posso fazer isso\").<\/li><li><b>3. Ansiedade<\/b> (ou nojo, culpa, sensação de \"não está certo\").<\/li><li><b>4. Compulsão ou evitação<\/b>: o ritual, a busca de reasseguramento ou o desvio do gatilho, que <b>aliviam<\/b>.<\/li><\/ul>", "O alívio é um <b>reforço negativo<\/b>: retira um estado aversivo e por isso aumenta a chance de o ritual se repetir. Ao mesmo tempo, a pessoa <b>nunca descobre<\/b> que a ansiedade cairia sozinha e que a catástrofe não aconteceria.", "A <b>evitação<\/b> faz o mesmo papel da compulsão: não tocar na maçaneta, não pegar a faca, não ficar a sós com o bebê. Ela costuma ser a parte menos visível e mais incapacitante do quadro.", "Esse ciclo é a base racional do tratamento psicológico de primeira linha: a <b>exposição com prevenção de resposta<\/b> (EPR) quebra exatamente o tempo 4 (bloco 6)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> O modelo dos dois fatores de <b>Mowrer<\/b> (1960) foi a primeira explicação comportamental: o medo seria <b>adquirido<\/b> por condicionamento clássico e <b>mantido<\/b> por condicionamento operante (o alívio da fuga). Hoje se sabe que a aquisição raramente segue esse roteiro, mas a parte da <b>manutenção<\/b> continua central."}, {"t": "escreva", "id": "ps-conceito-w-o-ciclo-do-toc", "label": "O ciclo do TOC", "v": "", "li": ["Gatilho → obsessão → ansiedade → compulsão/evitação → alívio", "O alívio é <b>reforço negativo<\/b> e mantém o ciclo", "Compulsão dá <b>alívio, não prazer<\/b>", "A EPR atua quebrando a compulsão e a evitação"]}, {"t": "lance", "q": "Por que o alívio depois do ritual mantém o TOC?", "a": "É reforço negativo: retira a ansiedade, aumenta a chance de repetir o ritual e impede a pessoa de aprender que a ansiedade cairia sozinha."}, {"t": "h2", "v": "Pensamento intrusivo é humano; o que muda no TOC"}, {"t": "ul", "v": ["Pensamentos intrusivos de conteúdo agressivo, sexual, blasfemo ou de contaminação são <b>quase universais<\/b>: em estudos clássicos, a grande maioria das pessoas sem transtorno relata pensamentos de conteúdo parecido com o das obsessões (Rachman e de Silva, 1978).", "No inquérito norte-americano NCS-R, <b>mais de um quarto<\/b> dos adultos relatou ter tido obsessões ou compulsões em algum momento da vida, mas só cerca de <b>2%<\/b> preenchia os critérios do transtorno (Ruscio e cols., 2010).", "O que diferencia o TOC não é <b>ter<\/b> o pensamento, e sim <b>o que se faz com ele<\/b>: a importância atribuída, a responsabilidade sentida, a tentativa de suprimir e os rituais para neutralizar.", "A tentativa de <b>suprimir<\/b> um pensamento tende a aumentar sua frequência (o efeito \"urso branco\", descrito por Wegner em 1987)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Essa é uma das mensagens mais terapêuticas da psicoeducação: \"ter esse pensamento não diz nada sobre quem você é\". Muitas pessoas com TOC passam anos acreditando que são perigosas ou más por causa do conteúdo das obsessões."}, {"t": "p", "v": "<span class=\"ps-src\">Fonte: <a href=\"https://doi.org/10.1038/mp.2008.94\" target=\"_blank\" rel=\"noopener\">Ruscio AM e cols. Mol Psychiatry, 2010<\/a><\/span>"}, {"t": "escreva", "id": "ps-conceito-w-intrusao-obsessao", "label": "Intrusão × obsessão", "v": "", "li": ["Intrusões são quase universais", "No TOC muda a <b>interpretação<\/b> (importância, responsabilidade) e a resposta (supressão, ritual)", "Suprimir aumenta a frequência (urso branco)", "O conteúdo não define perigo: define sofrimento"]}, {"t": "lance", "q": "O que diferencia a obsessão de uma intrusão comum?", "a": "A importância e a responsabilidade atribuídas ao pensamento, a tentativa de suprimi-lo e os rituais para neutralizá-lo."}, {"t": "h2", "v": "Uma ideia com dois séculos"}, {"t": "ul", "v": ["<b>Antes da psiquiatria<\/b>: descrições de \"escrúpulos\" religiosos (dúvida torturante sobre ter pecado e confissões repetidas) aparecem em textos de moral religiosa desde a Idade Média e o Renascimento.", "<b>Esquirol (1838)<\/b> descreve a \"monomania raciocinante\": a paciente reconhece o absurdo das próprias ideias e não consegue se livrar delas. É a semente do conceito de <b>insight<\/b>.", "<b>Westphal (1877)<\/b> cunha <i>Zwangsvorstellung<\/i> (\"representação compulsiva\"), de onde vem \"compulsivo\", e insiste que a inteligência está preservada.", "<b>Pierre Janet (1903)<\/b>, em <i>Les obsessions et la psychasthénie<\/i>, descreve a sensação de incompletude (<i>sentiment d'incomplétude<\/i>) e propõe, de forma pioneira, expor o paciente ao que ele evita.", "<b>Freud (1909)<\/b>, no caso do \"Homem dos Ratos\", descreve a neurose obsessiva pela ótica psicanalítica (dúvida, ambivalência, pensamento mágico). A abordagem psicanalítica <b>não demonstrou eficácia<\/b> no TOC em ensaios controlados e deixou de ser tratamento recomendado.", "<b>Victor Meyer (1966)<\/b> descreve a exposição com prevenção de resposta em pacientes internados: nasce o tratamento psicológico que funciona.", "<b>Década de 1960<\/b>: a clomipramina mostra efeito antiobsessivo; nas décadas de 1980 e 1990 chegam os ISRS e os estudos de neuroimagem que localizam o circuito córtico-estriado-tálamo-cortical.", "<b>DSM-5 (2013)<\/b> tira o TOC dos transtornos de ansiedade e cria o capítulo <b>\"Transtorno obsessivo-compulsivo e transtornos relacionados\"<\/b>; a <b>CID-11<\/b> (vigente desde 2022) faz o mesmo."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A mudança de capítulo não negou a ansiedade do TOC. Ela reconheceu o que ele tem de próprio: o comportamento repetitivo, o circuito cerebral, a genética compartilhada com transtornos como o dismórfico corporal e a tricotilomania, e a resposta seletiva a inibidores de recaptação de serotonina."}, {"t": "escreva", "id": "ps-conceito-w-linha-do-tempo", "label": "Linha do tempo", "v": "", "li": ["Esquirol 1838: monomania com crítica preservada", "Westphal 1877: <i>Zwangsvorstellung<\/i>", "Janet 1903: incompletude; Freud 1909: Homem dos Ratos", "Meyer 1966: EPR; anos 60: clomipramina; anos 80–90: ISRS", "DSM-5 2013 e CID-11: capítulo próprio"]}, {"t": "lance", "q": "Em que ano e por quem foi descrita a exposição com prevenção de resposta?", "a": "Victor Meyer, em 1966."}, {"t": "h2", "v": "Epidemiologia: quanto, quem e quando"}, {"t": "ul", "v": ["<b>Prevalência<\/b>: em torno de <b>1 a 3%<\/b> ao longo da vida. No NCS-R (EUA), <b>2,3% na vida<\/b> e <b>1,2% em 12 meses<\/b> (Ruscio, 2010). Em metanálise mundial, <b>1,3% na vida<\/b> (Fawcett, 2020).", "<b>Sexo<\/b>: na vida adulta, as mulheres são um pouco mais afetadas (risco cerca de <b>1,6 vez<\/b> maior na metanálise de 2020); na <b>infância<\/b>, predominam os <b>meninos<\/b>.", "<b>Idade de início<\/b>: distribuição <b>bimodal<\/b>, com um pico na infância e outro no fim da adolescência e começo da vida adulta. Idade média de início em torno de <b>19,5 anos<\/b> nos EUA; cerca de <b>um quarto<\/b> dos casos começa <b>até os 14 anos<\/b> (DSM-5-TR).", "Início <b>depois dos 35 anos<\/b> é incomum e pede investigação de causa orgânica (bloco 4).", "<b>Homens<\/b> têm início mais precoce e mais tiques associados; nas <b>mulheres<\/b>, sintomas de limpeza são mais comuns; nos homens, pensamentos proibidos e simetria (DSM-5-TR).", "Gatilhos de início ou piora reconhecidos: <b>gravidez e pós-parto<\/b>, eventos estressantes, e em crianças, segundo uma hipótese ainda debatida, infecções (bloco 5).", "<b>Atraso para tratar<\/b>: o intervalo entre o início dos sintomas e o tratamento adequado é longo, frequentemente de vários anos, por vergonha, segredo e desconhecimento.", "<b>Carga<\/b>: a OMS chegou a listar o TOC entre as <b>dez condições mais incapacitantes<\/b> do mundo; ele afeta estudo, trabalho, relações e a família inteira."]}, {"t": "table", "head": ["Dado", "Valor", "Fonte"], "rows": [["Prevalência na vida", "2,3% (EUA); 1,3% (mundo)", "NCS-R 2010; Fawcett 2020"], ["Prevalência em 12 meses", "1,2%", "NCS-R 2010"], ["Sexo", "Mulheres 1,6 × (adultos); meninos na infância", "Fawcett 2020; DSM-5-TR"], ["Idade média de início", "19,5 anos; 25% até os 14 anos", "DSM-5-TR"], ["Início após 35 anos", "Incomum: investigar causa secundária", "DSM-5-TR"]]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.4088/JCP.19r13085\" target=\"_blank\" rel=\"noopener\">Fawcett EJ e cols. J Clin Psychiatry, 2020<\/a> · <a href=\"https://doi.org/10.1038/mp.2008.94\" target=\"_blank\" rel=\"noopener\">Ruscio AM e cols. Mol Psychiatry, 2010<\/a><\/span>"}, {"t": "escreva", "id": "ps-conceito-w-epidemiologia", "label": "Epidemiologia", "v": "", "li": ["Prevalência na vida: <b>1 a 3%<\/b> (NCS-R 2,3%; metanálise 1,3%)", "Bimodal: infância (meninos) e fim da adolescência", "Média 19,5 anos; 25% até 14 anos", "Início após 35 anos: investigar causa orgânica", "Gestação e pós-parto: início ou piora"]}, {"t": "lance", "q": "Qual o sinal de alerta na idade de início?", "a": "Início após os 35 anos é incomum e pede investigar causa orgânica."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Qual a diferença de função entre a obsessão e a compulsão no ciclo do TOC?", "a": "A obsessão é intrusiva e aumenta a ansiedade (ou nojo, culpa, incompletude); a compulsão é feita para neutralizar a obsessão e reduzir esse desconforto, o que traz alívio passageiro e reforça o ciclo (reforço negativo)."}, {"q": "Por que dizer que a compulsão dá \"alívio, e não prazer\" é importante para o diagnóstico?", "a": "Porque separa o TOC dos comportamentos impulsivos (jogo, compras, uso de substância), em que o ato traz gratificação; no TOC o ato é feito para escapar de um estado aversivo."}, {"q": "Se pensamentos intrusivos são quase universais, o que torna um pensamento uma obsessão do TOC?", "a": "A interpretação e a resposta: a pessoa dá importância e responsabilidade exageradas ao pensamento, tenta suprimi-lo e o neutraliza com rituais, e isso consome tempo (mais de 1 hora por dia) ou causa sofrimento e prejuízo."}, {"q": "Qual a prevalência aproximada do TOC na vida e qual a idade típica de início?", "a": "Cerca de 1 a 3% ao longo da vida (2,3% no NCS-R; 1,3% em metanálise mundial). Início bimodal, com média por volta dos 19,5 anos e cerca de um quarto dos casos antes dos 14 anos."}, {"q": "O que muda quando os sintomas obsessivos começam depois dos 35 anos?", "a": "Início tardio é incomum e pede investigação de causa secundária (lesão dos núcleos da base ou do lobo frontal, neuroinfecção, doença neurodegenerativa, substância) antes de fechar TOC primário."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Mulher de 26 anos relata que, há dois anos, tem a ideia repetida de que pode ter atropelado alguém ao dirigir. Ao chegar em casa, refaz o trajeto de carro duas ou três vezes para conferir. Reconhece que a ideia é absurda e sente vergonha. Sobre o papel de refazer o trajeto, é correto afirmar:", "opts": ["É um comportamento impulsivo, mantido pela gratificação que produz.", "É uma compulsão de verificação, mantida por reforço negativo: reduz a ansiedade a curto prazo e mantém a obsessão a longo prazo.", "É uma alucinação visual, já que a paciente \"vê\" a cena do atropelamento.", "É um comportamento adaptativo e deve ser estimulado até a paciente se sentir segura."], "ok": 1, "exp": "<b>B<\/b> é a correta: a verificação é feita para neutralizar a dúvida obsessiva (ter atropelado alguém) e traz alívio, o que reforça negativamente o ritual. A pessoa nunca testa a hipótese de que a ansiedade cairia sozinha. <b>A<\/b> está errada porque não há prazer, só alívio; impulsividade é outra família de transtornos. <b>C<\/b> confunde imagem obsessiva (que a paciente reconhece como da própria mente) com percepção sem objeto. <b>D<\/b> inverte o tratamento: verificar mais mantém o TOC; a EPR pede justamente não verificar. Revise: <b>o ciclo do TOC e o reforço negativo<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Sobre a epidemiologia do transtorno obsessivo-compulsivo, assinale a alternativa correta.", "opts": ["A prevalência ao longo da vida é de cerca de 10%, semelhante à da depressão maior.", "O início é tipicamente após os 40 anos, com predomínio absoluto no sexo masculino.", "A distribuição da idade de início é bimodal, com casos de início na infância mais frequentes em meninos e média de início no fim da adolescência.", "O início na gestação e no pós-parto é descrito apenas na psicose puerperal, nunca no TOC."], "ok": 2, "exp": "<b>C<\/b> é a correta: há um pico infantil (com predomínio de meninos, mais tiques) e outro no fim da adolescência; a média de início é de cerca de 19,5 anos (DSM-5-TR). <b>A<\/b> superestima: a prevalência na vida fica em torno de 1 a 3%. <b>B<\/b> está duplamente errada: início após os 35 anos é incomum e pede investigar causa orgânica; e na vida adulta as mulheres são discretamente mais afetadas. <b>D<\/b> está errada: gravidez e pós-parto são gatilhos conhecidos de início ou piora do TOC, com obsessões de causar mal ao bebê. Revise: <b>epidemiologia e idade de início<\/b>."}]}, {"id": "ps-clinica", "title": "2. A clínica do TOC", "sub": "As dimensões de sintomas, os rituais invisíveis, o insight, a acomodação familiar e como o quadro evolui · DSM-5-TR, Y-BOCS e estudos de seguimento", "blocks": [{"t": "h2", "v": "As dimensões de sintomas"}, {"t": "ul", "v": ["O conteúdo varia de pessoa para pessoa, mas se agrupa em <b>dimensões<\/b> que aparecem em diferentes culturas (DSM-5-TR):"]}, {"t": "table", "head": ["Dimensão", "Obsessões típicas", "Compulsões típicas"], "rows": [["<b>Contaminação e limpeza<\/b>", "Germes, sujeira, fluidos corporais, doenças, produtos químicos", "Lavar as mãos, tomar banhos longos, limpar, evitar tocar"], ["<b>Responsabilidade por dano<\/b> (dúvida)", "Ter deixado o gás ligado, a porta aberta, ter atropelado alguém, ter cometido um erro grave", "Verificar, refazer, perguntar, buscar reasseguramento"], ["<b>Simetria, ordem e \"não está certo\"<\/b>", "Necessidade de exatidão; incômodo com assimetria; sensação de incompletude", "Organizar, alinhar, repetir até \"sentir certo\", contar"], ["<b>Pensamentos proibidos ou tabu<\/b>", "Agressivos (machucar alguém), sexuais indesejados, religiosos (blasfêmia, pecado)", "Rituais mentais, rezar, neutralizar, evitar situações, confessar"]]}, {"t": "ul", "v": ["A maioria das pessoas tem sintomas em <b>mais de uma dimensão<\/b>, e o conteúdo pode <b>mudar ao longo da vida<\/b>.", "A antiga dimensão de <b>acumulação<\/b> virou um transtorno próprio no DSM-5 (transtorno de acumulação), porque responde mal aos tratamentos do TOC e tem neurobiologia diferente."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Algumas apresentações ganharam nome na clínica: <b>escrupulosidade<\/b> (TOC religioso ou moral), <b>TOC de relacionamento<\/b> (dúvidas obsessivas sobre amar ou ser amado pelo parceiro, ou sobre defeitos dele), <b>TOC de orientação sexual<\/b>, <b>TOC somático<\/b> (atenção obsessiva à respiração ou à deglutição) e <b>TOC de dano<\/b>. Não são diagnósticos à parte: são TOC com um tema."}, {"t": "escreva", "id": "ps-clinica-w-as-quatro-dimensoes", "label": "As quatro dimensões", "v": "", "li": ["<b>Contaminação<\/b> → lavar, limpar, evitar", "<b>Dano e dúvida<\/b> → verificar, perguntar", "<b>Simetria e ordem<\/b> → organizar, repetir, contar", "<b>Pensamentos proibidos<\/b> (agressivos, sexuais, religiosos) → rituais mentais, evitar", "Acumulação saiu do TOC: virou transtorno próprio"]}, {"t": "lance", "q": "Quais são as quatro dimensões de sintomas do TOC?", "a": "Contaminação; responsabilidade por dano e dúvida; simetria e ordem; pensamentos proibidos (agressivos, sexuais, religiosos)."}, {"t": "h2", "v": "Rituais invisíveis, evitação e reasseguramento"}, {"t": "ul", "v": ["<b>Compulsões mentais<\/b> são comuns e passam despercebidas: rezar uma frase certa, contar, revisar mentalmente o dia, substituir uma imagem \"ruim\" por uma \"boa\", analisar se \"sentiu\" algo.", "<b>Busca de reasseguramento<\/b>: perguntar repetidamente ao parceiro, à família, ao médico ou à internet se está tudo bem (\"você acha que eu fiz mal a alguém?\"). Funciona como compulsão: alivia na hora e aumenta a dúvida depois.", "<b>Evitação<\/b>: deixar de usar banheiro público, de cozinhar, de pegar o bebê no colo, de ir à igreja. Quanto mais evitação, menor o mundo da pessoa.", "<b>Lentidão obsessiva<\/b>: rituais longos tornam tarefas simples (banho, vestir-se, sair de casa) lentíssimas; atrasos crônicos podem ser o único sinal visível.", "<b>Fenômenos sensoriais<\/b>: sensação de \"não está certo\" (<i>just right<\/i>), sensação física que precede o ritual. São mais comuns no TOC com tiques.", "A <b>vergonha<\/b> faz com que muitos escondam os sintomas por anos, inclusive do médico."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Perguntar sobre rituais mentais muda o diagnóstico: alguém que \"só tem pensamentos\" muitas vezes tem compulsões mentais que nunca foram nomeadas. A Y-BOCS inclui uma lista de verificação (checklist) que ajuda a não esquecer nenhum tipo."}, {"t": "escreva", "id": "ps-clinica-w-o-que-procurar-alem-do-obvio", "label": "O que procurar além do óbvio", "v": "", "li": ["Compulsões <b>mentais<\/b> (rezar, contar, revisar)", "Busca de <b>reasseguramento<\/b> (funciona como compulsão)", "<b>Evitação<\/b> (muitas vezes o maior prejuízo)", "Lentidão, atrasos, mãos com dermatite", "Sensação de \"não está certo\""]}, {"t": "lance", "q": "Por que perguntar \"você tem certeza de que está tudo bem?\" pode ser compulsão?", "a": "Porque é busca de reasseguramento: alivia na hora e mantém a dúvida, como qualquer ritual."}, {"t": "h2", "v": "Insight: do bom ao delirante"}, {"t": "ul", "v": ["O DSM-5-TR pede para especificar o grau de <b>insight<\/b>, isto é, o quanto a pessoa reconhece que as crenças do TOC não são verdadeiras:<ul class=\"sub\"><li><b>Insight bom ou razoável<\/b>: reconhece que as crenças são definitiva ou provavelmente falsas.<\/li><li><b>Insight pobre<\/b>: acha que as crenças são provavelmente verdadeiras.<\/li><li><b>Insight ausente / crenças delirantes<\/b>: está completamente convencida de que as crenças são verdadeiras.<\/li><\/ul>", "A <b>maioria<\/b> tem insight bom ou razoável; uma minoria pequena tem insight ausente.", "<b>Insight ausente não muda o diagnóstico para psicose<\/b>: se as crenças delirantes se limitam ao tema do TOC, o diagnóstico é TOC com insight ausente, e o tratamento continua sendo o do TOC.", "O insight pode <b>variar<\/b> na mesma pessoa: piora diante do gatilho, melhora quando ela está calma.", "Insight pobre se associa a quadro mais grave, mais comorbidade e pior resposta ao tratamento (Ruscio, 2010).", "Também se especifica se o TOC é <b>relacionado a tique<\/b>: história atual ou passada de transtorno de tique."]}, {"t": "escreva", "id": "ps-clinica-w-especificadores-do-dsm-5-tr", "label": "Especificadores do DSM-5-TR", "v": "", "li": ["Insight <b>bom ou razoável<\/b>", "Insight <b>pobre<\/b>", "Insight <b>ausente / crenças delirantes<\/b> (continua TOC)", "<b>Relacionado a tique<\/b>: tique atual ou passado"]}, {"t": "lance", "q": "Convicção total restrita ao tema obsessivo, sem outros sintomas psicóticos: qual o diagnóstico?", "a": "TOC com insight ausente/crenças delirantes."}, {"t": "h2", "v": "A família dentro do ritual: acomodação"}, {"t": "ul", "v": ["<b>Acomodação familiar<\/b> é a participação dos familiares nos sintomas: responder às mesmas perguntas, lavar a roupa de novo, evitar certos lugares, esperar o fim dos rituais, mudar a rotina da casa.", "Ela nasce do <b>afeto<\/b> e da tentativa de aliviar o sofrimento, e é quase universal nas famílias de pessoas com TOC.", "O efeito, porém, é o mesmo da compulsão: <b>alivia no curto prazo e mantém o TOC<\/b>. Mais acomodação se associa a sintomas mais graves, mais prejuízo e pior resposta ao tratamento.", "A acomodação também gera <b>desgaste<\/b>, culpa e conflito no familiar ou no parceiro.", "Reduzir a acomodação é parte do tratamento, mas deve ser feito de forma <b>combinada, gradual e com empatia<\/b>, de preferência com orientação do terapeuta, e não de forma brusca ou punitiva (bloco 9)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Existe instrumento para medir isso: a <b>Family Accommodation Scale<\/b> (FAS), criada por Calvocoressi e colaboradores em 1995, com versões para o próprio familiar responder."}, {"t": "escreva", "id": "ps-clinica-w-acomodacao-familiar", "label": "Acomodação familiar", "v": "", "li": ["Participar dos rituais, responder ao reasseguramento, mudar a rotina", "Nasce do afeto; mantém o TOC", "Associa-se a maior gravidade e pior resposta", "Reduzir de forma <b>gradual, combinada e empática<\/b>"]}, {"t": "lance", "q": "Qual o efeito da acomodação familiar no TOC?", "a": "Alivia no curto prazo e mantém o TOC; associa-se a maior gravidade e pior resposta."}, {"t": "h2", "v": "Curso e prognóstico"}, {"t": "ul", "v": ["O curso típico é <b>crônico, com flutuação<\/b> (pioras em fases de estresse, gestação, pós-parto, mudanças de vida). Sem tratamento, remissão completa espontânea é pouco frequente em adultos.", "No seguimento de <b>40 anos<\/b> de Skoog e Skoog (Suécia, coorte de pacientes internados entre 1947 e 1953), <b>83% melhoraram<\/b>, <b>48% se recuperaram<\/b> (20% de forma completa e 28% com sintomas subclínicos), mas <b>48% tiveram TOC por mais de 30 anos<\/b>. Era a época anterior aos tratamentos eficazes.", "No TOC de <b>início na infância<\/b>, uma metanálise mostrou persistência do TOC completo em <b>41%<\/b> e de TOC completo ou subclínico em <b>60%<\/b> na vida adulta (Stewart, 2004): a evolução é melhor do que se pensava.", "<b>Fatores de pior prognóstico<\/b>: início precoce, longa duração antes do tratamento, insight pobre, comorbidades (depressão grave, transtornos de personalidade, uso de substância), acumulação, acomodação familiar intensa e má resposta inicial.", "<b>Com tratamento adequado<\/b>, a maioria melhora de forma significativa; a meta realista costuma ser controle dos sintomas e retomada da vida, e uma parte chega à remissão."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Para comparar estudos, um consenso internacional definiu os desfechos pela Y-BOCS: <b>resposta<\/b> = redução de pelo menos <b>35%<\/b> com melhora global (CGI-I 1 ou 2); <b>resposta parcial<\/b> = redução entre 25% e 35%; <b>remissão<\/b> = Y-BOCS de <b>12 ou menos<\/b> por pelo menos uma semana (Mataix-Cols e cols., 2016)."}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.1001/archpsyc.56.2.121\" target=\"_blank\" rel=\"noopener\">Skoog G, Skoog I. Arch Gen Psychiatry, 1999<\/a> · <a href=\"https://doi.org/10.1111/j.1600-0447.2004.00302.x\" target=\"_blank\" rel=\"noopener\">Stewart SE e cols. Acta Psychiatr Scand, 2004<\/a> · <a href=\"https://doi.org/10.1002/wps.20299\" target=\"_blank\" rel=\"noopener\">Mataix-Cols D e cols. World Psychiatry, 2016<\/a><\/span>"}, {"t": "escreva", "id": "ps-clinica-w-curso-e-desfechos", "label": "Curso e desfechos", "v": "", "li": ["Crônico com flutuação; piora em estresse, gestação e pós-parto", "Skoog (40 anos): 83% melhoram, 48% se recuperam, 20% completamente", "Infância: 41% persistem com TOC completo (60% com completo ou subclínico)", "<b>Resposta<\/b>: Y-BOCS cai ≥ 35%; <b>remissão<\/b>: Y-BOCS ≤ 12"]}, {"t": "lance", "q": "Qual a definição de remissão no TOC?", "a": "Y-BOCS de 12 ou menos por pelo menos uma semana."}, {"t": "h2", "v": "Casos clínicos"}, {"t": "case", "title": "A mãe que não dá banho no bebê", "body": ["Puérpera de 31 anos, seis semanas após o parto, chega chorando. Conta que tem imagens súbitas de afogar o filho na banheira e de derrubá-lo da escada. Sente horror, evita dar banho sozinha, escondeu as facas e pede ao marido que nunca a deixe a sós com o bebê. Dorme pouco, mas está orientada, sem alucinações, e diz: \"eu sei que é absurdo, eu amo meu filho\"."], "ask": "Qual o diagnóstico mais provável e qual o risco real para o bebê?", "reveal": ["TOC de início no pós-parto, com obsessões de dano egodistônicas, evitação e busca de reasseguramento. O risco de a mãe agir sobre essas imagens é baixo: o pensamento a apavora e ela se protege dele.", "O diferencial obrigatório é a <b>psicose puerperal<\/b>: confusão, alucinações, delírios (por exemplo, que o bebê está possuído), ideias vividas como verdadeiras e sem horror. Ali o risco é real e a conduta é de emergência.", "Conduta: psicoeducação (para ela e para o marido), TCC com EPR e, se moderado a grave, ISRS compatível com a amamentação, como a sertralina. Pedir ao marido que deixe de \"vigiá-la\" de forma gradual, porque a vigilância é acomodação."]}, {"t": "case", "title": "O estudante que chega atrasado a tudo", "body": ["Estudante de 19 anos, trazido pela mãe porque perdeu o semestre. Leva duas horas para sair de casa: confere o fogão, as tomadas e a fechadura em séries de oito. Se perde a conta, recomeça. Não sabe explicar por que oito, diz apenas que \"precisa sentir que está certo\". Pisca e pigarreia com frequência desde os 9 anos."], "ask": "Que especificador o DSM-5-TR pede neste caso e por que ele importa?", "reveal": ["TOC <b>relacionado a tique<\/b>, pela história de tiques (piscar e pigarrear desde a infância), com s
