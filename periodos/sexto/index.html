<!doctype html>
<html lang="pt-BR" data-per="p6">
<head>
<script data-tema>try{if(localStorage.getItem("medas-tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>Apostilas · 6º período · xequemate med</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Design-modelo do xequemate med (o mesmo das apostilas da residência, bloco1.html): só as cores de tema mudam por período. */
:root{
  --bg:#030303; --fg:#ebebeb; --muted:#9c9c9c; --line:#1b1b1b; --line-2:#2e2e2e; --raise:#0a0a0a; --surface:#0a0a0a; --surface-2:#101010;
  --red:#c8174a; --red-ink:#ff8fb0; --red-soft:#16070c; --blue:#7f97bd;
  --upd-bg:#080a0d; --upd-line:#3d5072; --upd-ink:#cdd3dc;
  --ok:#5aa883; --bad:#c2414a;
  --brand:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --display:"Libre Caslon Display","Libre Caslon Text",Georgia,serif;
  --head:"Libre Caslon Text",Georgia,serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"Libre Caslon Text",Georgia,serif;
  /* nomes usados pelos diagramas antigos (svg dentro do conteúdo) */
  --ink:#ebebeb; --accent:var(--red-ink); --accent-soft:var(--red-soft); --amber:#d4ad55; --amber-soft:#0c0a06; --ok-soft:#08120d; --bad-soft:#140708; --f-body:var(--body); --f-mono:var(--mono);
  color-scheme:dark;scrollbar-color:#262626 var(--bg);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:18.5px/1.65 var(--body);-webkit-font-smoothing:antialiased;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:0;color:#f5f5f5;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000}
::selection{background:var(--red-soft);color:#fff}
a{color:var(--fg);text-decoration-color:#5a5a5a;text-underline-offset:3px}
a:hover{text-decoration-color:var(--red)}
b,strong{font-weight:600;color:#fff}
i,em{color:#dcdcdc}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kick,.k{font:400 11.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* topo: nome do app com a chama, como nas apostilas da residência */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.top .back{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 0}
.top .back:hover{color:var(--fg)}
.brand{display:inline-flex;align-items:flex-end;font:700 34px/1 var(--brand);letter-spacing:.01em;color:var(--fg);text-decoration:none}
.flame{width:20px;height:28px;margin-left:2px;margin-bottom:2px;overflow:visible;flex:none}
.flame .tongue,.flame .all{transform-box:fill-box;transform-origin:50% 100%}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.flame{color:var(--red)}.flame .sway{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){.flame .sway{animation:mj-sway 7s ease-in-out infinite alternate}}
@keyframes mj-sway{0%{transform:rotate(-2.5deg) scale(1,.98)}50%{transform:rotate(1deg) scale(.98,1.03)}100%{transform:rotate(2.5deg) scale(1.01,.99)}}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}

/* início */
.home{display:flex;flex-direction:column;gap:28px;padding-top:18px}
.home h1{font-size:clamp(30px,7vw,44px)}
h1::after{content:"";display:block;width:48px;height:3px;margin-top:16px;background:var(--red);border-radius:2px}
.lede{color:var(--muted);margin:0}
.disc{display:flex;flex-direction:column;gap:12px}
.disc h2{font-size:clamp(20px,4.6vw,24px);padding-top:16px;background:linear-gradient(var(--red),var(--red)) 0 0/32px 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:2px 8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);background:var(--raise)}
.item:hover{border-color:var(--line-2)}
.item .n{font:600 12px/1.9 var(--mono);color:var(--muted)}
.item b{font:600 16.5px/1.35 var(--head);color:var(--fg)}
.item span:last-child{grid-column:2;font-size:14.5px;line-height:1.45;color:var(--muted)}
.item.lida .n::after{content:" ✓";color:var(--ok)}
.item.lida b{color:var(--muted)}

/* aula */
.head{display:flex;flex-direction:column;gap:12px;padding:18px 0 6px}
.head h1{font-size:clamp(28px,7vw,40px)}
.head .sub{color:var(--muted);font-size:15.5px;line-height:1.5;margin:0}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages button{min-width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 12px/1 var(--mono);color:var(--muted);padding:0 8px}
.pages button[aria-current]{background:transparent;border-color:var(--red);color:#fff}
.pages button.seen:not([aria-current]){color:var(--fg);border-color:var(--line-2)}
.toc{border:1px solid var(--line);border-radius:10px}
.toc summary{list-style:none;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"+";font:600 16px/1 var(--mono);color:var(--muted)}
.toc[open] summary::after{content:"–"}
.toc ol{margin:0;padding:0 14px 8px;list-style:none;counter-reset:t}
.toc li{counter-increment:t}
.toc li button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;font:400 16px/1.4 var(--body);color:var(--fg)}
.toc li button::before{content:counter(t);font:600 12px/1.8 var(--mono);color:var(--muted);min-width:1.6em}
.toc li button[aria-current]{color:#fff;font-weight:600}
.toc small{display:block;color:var(--muted);font:500 12px var(--mono)}

article{display:flex;flex-direction:column;gap:18px;padding-top:22px;overflow-wrap:break-word}
article>*{min-width:0}.box,.qi,.mcq,.case{overflow-wrap:anywhere}
article h2{font-size:clamp(20px,4.6vw,24px);padding-top:16px;margin-top:10px;background:linear-gradient(var(--red),var(--red)) 0 0/32px 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat}
article>h2:first-child{margin-top:0}
article p,article ul,article ol{margin:0}
article ul,article ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
article li::marker{color:var(--muted)}
article ul.sub{margin-top:6px;gap:4px}
article ul.sub li{font-size:.94em;color:#d2d2d2}
cx{display:inline-block;font:500 11.5px/1.4 var(--mono);padding:1px 7px;border-radius:4px;background:var(--upd-bg);color:#8fa6cc;border:1px solid #273042;white-space:nowrap;vertical-align:1px}

/* quadros do modelo: borda fina, faixa colorida à esquerda e um ícone no rótulo */
.box{padding:14px 16px 15px;border:1px solid var(--line);border-left:3px solid;border-radius:6px 12px 12px 6px;display:flex;flex-direction:column;gap:6px;font-size:16.5px;line-height:1.6}
.box p,.box ul{margin:0}.box ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.box b.t{display:flex;align-items:center;gap:8px;font:700 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.box b.t::before{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;border:1px solid currentColor;border-radius:5px;font:600 12px/1 var(--mono);letter-spacing:0}
.law{background:var(--raise);border-left-color:#6b6b6b}.law b.t{color:#bdbdbd}.law b.t::before{content:"§"}
.trap{background:#0e0607;border-color:#1f0d0f;border-left-color:#8c2228;color:#e4d6d6}.trap b.t{color:#e0757b}.trap b.t::before{content:"!"}
.upd{background:var(--upd-bg);border-color:#141a24;border-left-color:var(--upd-line);color:var(--upd-ink)}.upd b.t{color:#8fa6cc}.upd b.t::before{content:"↻"}
.dv{background:#0c0a06;border-color:#221d12;border-left-color:#b8923a;color:#e8e0cc}.dv b.t{color:#d4ad55}.dv b.t::before{content:"≠"}
.lance{background:var(--raise);border-color:var(--line);border-left-color:var(--red)}.lance b.t{color:var(--red-ink)}.lance b.t::before{content:"?"}
.lance .q{font-weight:600;color:#fff}
.src{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
a.btn,.src a{font:500 13px var(--head);text-decoration:none;color:var(--blue);border:1px solid #273042;border-radius:8px;padding:5px 10px}
a.btn:hover,.src a:hover{border-color:var(--blue)}
.src a::after{content:" ↗"}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5;min-width:440px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:700 12px var(--mono);letter-spacing:.04em;color:var(--muted);background:var(--raise)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--raise) 60%,var(--bg))}

figure{margin:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--raise)}
figure img{display:block;width:100%;height:auto;background:#fff}
figure .zb{display:block;width:100%;padding:0;border:0;background:none}
figcaption{padding:10px 14px 12px;font-size:14px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
figure.dia .scroll{overflow-x:auto;padding:12px}
figure.dia svg{display:block;min-width:520px;width:100%;height:auto}
figure.wide>.wk{margin:0}figure.wide{overflow-x:auto}

/* slides da aula: faixa de miniaturas que abre o visor (cada informação mostra de que slide veio) */
.sl{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;background:var(--raise);display:flex;flex-direction:column;gap:10px}
.sl .k{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sl .k span{font:400 14.5px/1.4 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.th{flex:none;width:118px;padding:0;border:1px solid var(--line-2);border-radius:7px;background:#fff no-repeat;position:relative;overflow:hidden}
.th span{position:absolute;right:4px;bottom:4px;font:600 10px/1 var(--mono);background:rgba(0,0,0,.75);color:#fff;border-radius:4px;padding:3px 5px}
figure .th{width:100%;border:0;border-radius:0}
.slimg{display:block;width:100%;background:#fff no-repeat}
.vw{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.vw[hidden]{display:none}
.vw .vt{display:flex;align-items:center;gap:12px;color:var(--muted)}
.vw .vt b{color:#fff}
.vw .vt button{margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;font:500 14px var(--head)}
.vw .st{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:0}
.vw .st .slimg{width:min(100%,calc((100vh - 170px) * var(--ar)));border-radius:6px}
.vw .nv{flex:none;width:42px;height:64px;border:1px solid var(--line-2);border-radius:10px;background:var(--raise);font:400 24px/1 var(--head);color:#fff}
.vw input{width:100%;accent-color:var(--red)}
.vw .mine{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.vw .mine button{font:600 12px/1 var(--mono);border:1px solid var(--line-2);background:none;border-radius:999px;padding:7px 10px;color:var(--muted)}
.vw .mine button[aria-pressed="true"]{color:#fff;border-color:var(--red)}
@media (max-width:560px){.vw .nv{display:none}}

/* questões no padrão do modelo */
.btn2{align-self:flex-start;font:500 14px var(--head);color:var(--fg);background:transparent;border:1px solid #3a3a3a;border-radius:8px;padding:7px 12px}
.btn2:hover{border-color:var(--red)}
.qz{display:flex;flex-direction:column;gap:10px}
.qi{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qi p{margin:0}.qi>p:first-child{font-weight:600}
.a{color:#d6d6d6;border-left:2px solid var(--red);padding-left:12px}
.mcq{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mcq .stem{font-weight:600;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:6px;text-align:left;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:none;font:400 16.5px/1.5 var(--body)}
.opt b{font:600 12px/1.9 var(--mono);color:var(--muted)}
.opt:hover:not([disabled]){border-color:#444}
.opt.ok{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.no{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt[disabled]{cursor:default}
.exp{font-size:15.5px;color:#cfcfcf;padding:4px 2px 0 12px;border-left:2px solid var(--line-2)}
.exp .k{display:block;margin-bottom:4px}
.case{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.case h3{font:600 18px/1.3 var(--head)}
.case p{margin:0}.case .ask{font-weight:600}
.case .out{display:flex;flex-direction:column;gap:8px}
.case.pv{border-color:var(--line-2)}.case.pv>.kick{color:var(--red-ink)}
.calc{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.calc label{font:600 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.calc input{align-self:flex-start;font:400 16px var(--body);color:#fff;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;color-scheme:dark}
.calc .out{margin-top:10px}

/* quadro de semanas (diagnóstico de gravidez) */
.wk{font-size:13.5px;line-height:1.4;min-width:520px}
.wk-h,.wk-r{display:grid;grid-template-columns:54px repeat(3,minmax(0,1fr))}
.wk-h span{padding:9px 10px;font:700 10px/1.35 var(--mono);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--raise);color:var(--muted)}
.wk-r>*{padding:7px 9px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.wk-r b{font:600 15px/1.4 var(--mono);color:var(--red-ink);justify-content:center}
.wk-r.hot b{background:var(--red-soft)}
.wk i{font-style:normal;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px}
.wk-h .c-pre{color:#d4ad55}.wk-h .c-pro{color:var(--red-ink)}.wk-h .c-cer{color:var(--ok)}

/* fim da página */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);min-height:60px}
.pager a:hover{border-color:var(--line-2)}
.pager a span:last-child{font:500 14.5px/1.3 var(--head)}
.pager .nx{grid-column:2;align-items:flex-end;text-align:right;border-color:var(--line-2)}
.endbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.endbar>*{flex:1;min-width:150px;text-align:center}
.endbar [aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.refs{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.ref{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.ref b{font-weight:500;color:var(--fg);font-size:15.5px;line-height:1.45}
.ref .btn{align-self:flex-start}
.note{font-size:15px;color:var(--muted)}
/* modo de leitura: o leitor escolhe no início de cada apostila (passar para o lado, como livro, ou rolar) */
.modo{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.modo .kick{margin-right:4px}
.modo button{font:500 13.5px var(--head);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;color:var(--muted)}
.modo button[aria-pressed="true"]{color:#fff;border-color:var(--red)}
.modo.ask{border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;flex-direction:column;align-items:stretch}
.modo.ask .kick{color:var(--fg)}
.modo.ask button{padding:11px 14px;font-size:15px;text-align:left}
body.bookmode{height:100vh;height:100dvh;overflow:hidden;padding-bottom:0}
body.bookmode .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column}
body.bookmode .top{position:static;background:none}
body.bookmode main{flex:1;min-height:0;display:flex;flex-direction:column}
.bk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.bk-head .kick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bk-head .modo button{padding:5px 10px;font-size:12.5px}
.book{flex:1;min-height:0;position:relative;overflow:hidden;margin-top:14px;touch-action:pan-y}
.cols{position:absolute;top:0;left:0;height:100%;column-gap:48px;column-fill:auto;transition:transform .32s ease}
.cols>*{break-inside:avoid-column}
.cols .ch{break-before:column}
.cols .cover{display:flex;flex-direction:column;gap:14px;break-after:column}
.cols .cover h1{font-size:clamp(30px,8vw,44px)}
.cols .cover .sumario{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.cols .cover .sumario li{counter-increment:s;break-inside:avoid}
.cols .cover .sumario button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;font:400 15.5px/1.4 var(--body);color:var(--fg)}
.cols .cover .sumario button::before{content:counter(s);font:600 11px/1.9 var(--mono);color:var(--muted);min-width:1.6em}
.cols article{padding-top:0;display:block}
.cols article>*{margin:0 0 16px}
.cols article>p,.cols article>ul>li{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.cols article>ul{list-style:none;padding:0}
.cols article>ul>li{text-indent:1.3em;margin:0 0 9px}
.cols article>ul>li::marker{content:""}
.cols article h2{margin-top:0}
.cols figure img{max-height:52vh;object-fit:contain}
.cols .box,.cols .mcq,.cols .case,.cols .qi,.cols .sl,.cols figure,.cols .tw{break-inside:avoid}
.cols h2,.cols .kick,.cols .k,.cols .box b.t{break-after:avoid}
.cols .qz{break-inside:auto}
.cols .fim{break-before:column;display:flex;flex-direction:column;gap:12px}
.cols .fim h2{font-size:24px}
.bk-foot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line)}
.bk-foot button{width:46px;height:40px;border:1px solid var(--line-2);border-radius:10px;background:transparent;font:400 22px/1 var(--head);color:#fff}
.bk-foot button:disabled{opacity:.3}
.bk-foot .where{text-align:center;min-width:0}
.bk-foot .where b{display:block;font:600 12px/1.3 var(--mono);color:var(--fg);letter-spacing:.06em}
.bk-foot .where span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-foot .prog{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}

/* páginas: cada h2 abre uma; o que vem antes do primeiro h2 entra na primeira; a pergunta rápida fecha a página (igual ao app) */
function pages(blocks){const out=[];let pre=[];
  for(const b of blocks){if(b.t==="vera")continue;

function rng(ns){ns=[...new Set(ns)].sort((a,b)=>a-b);const o=[];ns.forEach(n=>{if(o.length&&n===o[o.length-1][1]+1)o[o.length-1][1]=n;else o.push([n,n])});

/* slides: 8º em folhas verticais (k por folha, miniaturas em t.webp); 6º em folhas 2 × 3 (miniaturas em mini.webp, 10 colunas) */
function slStyle(deck,n,th,tot){const i=n-1,S=P.sl[deck];
  if(S){const k=th?S.tot:S.k,j=th?i:i%S.k,u=th?`img/${deck}/t.webp`:`img/${deck}/f${String(Math.floor(i/S.k)+1).padStart(2,"0")}.webp`;
    return {css:`background-image:url(${u});background-size:100% ${k*100}%;background-position:0 ${k>1?(j/(k-1)*100).toFixed(4):0}%`,ar:S.w/S.h}}
  if(P.grid){if(th){const rows=Math.ceil(tot/10),c=i%10,r=Math.floor(i/10);
      return {css:`background-image:url(img/${deck}/mini.webp);background-size:1000% ${rows*100}%;background-position:${c*100/9}% ${rows>1?r*100/(rows-1):0}%`,ar:16/9}}

(()=>{let x0=null;const st=document.querySelector(".vw .st");st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});

  case "prova":return `<div class="case pv"><span class="kick">Questão de prova antiga · ${esc(b.src)}</span><p>${b.stem}</p>${b.ask?`<p class="ask">${b.ask}</p>`:""}<button type="button" class="btn2 rv">Ver a resposta comentada</button><div class="out a" hidden>${b.reveal.map(x=>`<p>${x}</p>`).join("")}</div></div>`;   /* 28/10: provas antigas do 6º (app/provas6.py) */
  case "case":return `<div class="case"><span class="kick">Caso clínico</span><h3>${b.title}</h3>${b.body.map(x=>`<p>${x}</p>`).join("")}${b.ask?`<p class="ask">${b.ask}</p>`:""}<button type="button" class="btn2 rv">Ver o desfecho</button><div class="out a" hidden>${b.reveal.map(x=>`<p>${x}</p>`).join("")}</div></div>`;
  case "naegele":return `<div class="calc" id="naeg"><span class="kick">Calculadora de Näegele</span><label for="nDum">Data da última menstruação</label><input type="date" id="nDum" value="2023-03-26"><label for="nHoje">Data da consulta</label><input type="date" id="nHoje" value="2023-09-28"><div class="out" id="nOut"></div></div>`;
  default:return ""}}
const wrapP=v=>/^\s*<(p|ul|ol|div|table)\b/.test(v)?v:`<p>${v}</p>`;
function lance(b){return `<div class="box lance"><b class="t">Pergunta rápida</b><p class="q">${b.q}</p><button type="button" class="btn2 rv">Mostrar resposta</button><p class="a" hidden>${b.a}</p></div>`}

function wire(root){
  root.querySelectorAll(".th").forEach(t=>t.onclick=()=>{const sl=t.closest(".sl"),mine=sl?sl.dataset.mine.split(",").map(Number):[+t.dataset.n];openVW(t.dataset.deck,+t.dataset.tot,+t.dataset.n,mine)});

    m.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===ok)x.classList.add("ok")});if(+o.dataset.i!==ok)o.classList.add("no");m.querySelector(".exp").hidden=false}));
  root.querySelectorAll(".wrb").forEach(b=>b.onclick=()=>{const w=b.closest(".wr"),id=w.dataset.wr;ESCR[id]=ESCR[id]>0?0:Date.now();save("escrito",ESCR);
    const d=ESCR[id]>0;w.classList.toggle("done",d);w.querySelector(".k b").textContent=d?"✓ escrito":"";b.textContent=d?"Desmarcar":"Marcar como escrito"});

  let h=`<section class="home"><span class="kick">${esc(P.nome)} · apostilas</span><h1>Apostilas</h1><p class="lede">Os slides de cada aula são a base. O que vem de fora aparece em quadro azul (atualização) ou dourado (divergência com a diretriz), sempre com a fonte.</p>`;
  for(const c of P.cat){h+=`<div class="disc"><span class="kick">${esc(c.av)}</span><h2>${esc(c.nome)}</h2><div class="list">`;
    c.secs.forEach((s,i)=>{h+=`<a class="item${LIDAS[s.id]?" lida":""}" href="#${c.id}/resumos/${i}"><span class="n">${String(i+1).padStart(2,"0")}</span><b>${strip(s.t)}</b>${s.s?`<span>${strip(s.s)}</span>`:""}</a>`});
    h+=`</div></div>`}

/* modo de leitura (pedido de 28/10): no início de cada apostila, passar para o lado (livro) ou rolar; a escolha fica no aparelho */
const MODO=()=>{try{return localStorage.getItem(LS("modo"))||""}catch(e){return""}};
const setModo=m=>{try{localStorage.setItem(LS("modo"),m)}catch(e){}};
const ldBt=ask=>(CUR.deck||CUR.multi)?`<button type="button" class="ld" data-lado aria-pressed="${LADO()}">${ask?"▣ Mostrar o slide ao lado do texto (liga e desliga quando quiser)":"▣ Slide ao lado"}</button>`:"";
function modoHtml(cur,ask){return ask
  ?`<div class="modo ask" role="group" aria-label="Como ler esta apostila"><span class="kick">Como prefere ler?</span><button type="button" data-modo="livro">⇆ Passar para o lado, como um livro</button><button type="button" data-modo="rolar">⇅ Rolar para cima e para baixo</button>${ldBt(1)}</div>`
  :`<div class="modo" role="group" aria-label="Modo de leitura"><button type="button" data-modo="livro" aria-pressed="${cur==="livro"}">⇆ Livro</button><button type="button" data-modo="rolar" aria-pressed="${cur!=="livro"}">⇅ Rolar</button>${ldBt(0)}</div>`}
/* slide ao lado: liga/desliga a qualquer momento (fica guardado no aparelho); mostra o slide citado no trecho que está sendo lido */
let CUR={deck:null,tot:0},LDK="";
const LADO=()=>{try{return localStorage.getItem(LS("lado"))==="1"}catch(e){return false}};
function ladoSet(on){try{localStorage.setItem(LS("lado"),on?"1":"0")}catch(e){}ladoApply()}
function ladoApply(){const on=!!(CUR.deck||CUR.multi)&&LADO();document.body.classList.toggle("ld-on",on);
  document.querySelectorAll("[data-lado]").forEach(b=>b.setAttribute("aria-pressed",on));
  if(!on)app.querySelectorAll(".sr.on").forEach(x=>x.classList.remove("on"));
  LDK="";if(onresize)onresize();if(on)ladoPick()}
function ladoShow(n,mine,deck){deck=deck||CUR.sd||CUR.deck;if(!deck)return;const tot=deckTot(deck);n=Math.max(1,Math.min(tot,n));CUR.sd=deck;CUR.n=n;CUR.mine=mine||CUR.mine||[];
  const s=slStyle(deck,n,0,tot);$("ldI").style.cssText=s.css+`;aspect-ratio:${s.ar}`;$("ldI").setAttribute("aria-label","Slide "+n);
  $("ldN").textContent=`${CUR.multi&&P.dk&&P.dk[deck]?P.dk[deck]+" · ":""}Slide ${n} de ${tot}`}
function ladoPick(){if(!document.body.classList.contains("ld-on"))return;
  const els=[...app.querySelectorAll(".sr,.sl")];if(!els.length)return;let pick=null;
  if(document.body.classList.contains("bookmode")){const r=$("bk").getBoundingClientRect();
    for(const e of els){const b=e.getBoundingClientRect();if(b.right<=r.left+4){pick=e;continue}if(b.left<r.right-4){pick=e}break}}
  else{const line=(document.body.classList.contains("ld-on")&&innerWidth<1000?innerHeight-$("lado").offsetHeight:innerHeight)*.42;
    for(const e of els){if(e.getBoundingClientRect().top<=line)pick=e;else break}}
  pick=pick||els[0];const ns=(pick.dataset.ns||pick.dataset.mine||"").split(",").map(Number).filter(Boolean);if(!ns.length)return;
  const key=els.indexOf(pick)+":"+ns[0];if(key===LDK)return;LDK=key;
  app.querySelectorAll(".sr.on").forEach(x=>x.classList.remove("on"));if(pick.classList.contains("sr"))pick.classList.add("on");
  const th=pick.querySelector&&pick.querySelector(".th");ladoShow(ns[0],ns,pick.dataset.deck||(th&&th.dataset.deck)||CUR.deck)}
let ldRaf=0;addEventListener("scroll",()=>{if(ldRaf)return;ldRaf=requestAnimationFrame(()=>{ldRaf=0;ladoPick()})},{passive:true});
$("ldP").onclick=()=>ladoShow(CUR.n-1);$("ldF").onclick=()=>ladoShow(CUR.n+1);$("ldX").onclick=()=>ladoSet(false);

/* "slide N", "slides 5 e 6", "slides 2-3, 10" no texto viram botões que abrem o slide */
function slRefs(root){root.querySelectorAll(".slx").forEach(e=>{e.classList.add("sr");e.setAttribute("role","button");e.tabIndex=0});
  if(CUR.deck){const re=/\bslides?\s+\d+(?:(?:\s*[-–,]\s*|\s+e\s+)\d+)*/g,T=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("button,a,.sl,.slx,.kick,h1,.lado,.vw,script,style")?2:1});
  while(w.nextNode())if(/slides?\s+\d/.test(w.currentNode.nodeValue))T.push(w.currentNode);
  for(const t of T){const v=t.nodeValue,f=document.createDocumentFragment();let i=0;
    for(const m of v.matchAll(re)){const ns=[];for(const r of m[0].replace(/^slides?\s+/,"").split(/\s*,\s*|\s+e\s+/)){const q=r.split(/\s*[-–]\s*/).map(Number);
        if(q.length===2&&q[1]>q[0]&&q[1]-q[0]<40)for(let k=q[0];k<=q[1];k++)ns.push(k);else ns.push(q[0])}
      const ok=ns.filter(n=>n>=1&&n<=CUR.tot);if(!ok.length)continue;
      f.append(v.slice(i,m.index));const b=document.createElement("button");b.type="button";b.className="sr";b.dataset.ns=ok.join(",");b.textContent=m[0];
      b.setAttribute("aria-label","Abrir "+m[0]);f.append(b);i=m.index+m[0].length}
    if(i){f.append(v.slice(i));t.replaceWith(f)}}}
  root.querySelectorAll(".sr").forEach(b=>b.onclick=()=>{const ns=b.dataset.ns.split(",").map(Number),dk=b.dataset.deck||CUR.deck;
    if(document.body.classList.contains("ld-on")){LDK="";app.querySelectorAll(".sr.on").forEach(x=>x.classList.remove("on"));b.classList.add("on");ladoShow(ns[0],ns,dk)}
    else openVW(dk,deckTot(dk),ns[0],ns)})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-modo]");if(!b)return;setModo(b.dataset.modo);route()});

async function livro(cid,bi,pi,c,D,s,PG){
  document.body.classList.add("bookmode");CUR={deck:s.deck||null,tot:s.nsl||deckTot(s.deck),multi:!s.deck&&JSON.stringify(s.blocks).includes('class=\\"slx')};
