intomas de verificação e de \"não está certo\".", "Importa porque esse subgrupo tem início mais precoce, predomínio masculino, fenômenos sensoriais e, no tratamento resistente, responde particularmente bem ao reforço com antipsicótico (bloco 8)."]}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Quais são as quatro dimensões de sintomas do TOC e uma compulsão típica de cada uma?", "a": "Contaminação (lavar, limpar); responsabilidade por dano e dúvida (verificar, perguntar); simetria e ordem (organizar, repetir, contar); pensamentos proibidos agressivos, sexuais ou religiosos (rituais mentais, rezar, evitar)."}, {"q": "Por que a busca de reasseguramento é tratada como compulsão?", "a": "Porque segue a mesma lógica do ritual: é feita para aliviar a ansiedade gerada pela obsessão, alivia por pouco tempo e mantém a dúvida e o ciclo."}, {"q": "Paciente com convicção total de que vai contaminar a família, rituais de limpeza e sem outros sintomas psicóticos: qual o diagnóstico?", "a": "TOC com insight ausente/crenças delirantes. A convicção restrita ao tema obsessivo não muda o diagnóstico para psicose."}, {"q": "O que é acomodação familiar e por que ela importa no tratamento?", "a": "É a participação da família nos sintomas (responder perguntas repetidas, participar dos rituais, mudar a rotina). Nasce do afeto, mas mantém o TOC e se associa a maior gravidade e pior resposta; reduzi-la de forma gradual faz parte do tratamento."}, {"q": "Como o consenso internacional define resposta e remissão no TOC?", "a": "Resposta: redução de pelo menos 35% na Y-BOCS com CGI-I 1 ou 2. Remissão: Y-BOCS de 12 ou menos por pelo menos uma semana."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Homem de 34 anos tem há anos pensamentos intrusivos de empurrar pessoas nos trilhos do metrô. Sente horror, evita estações, e quando precisa ir, fica encostado à parede repetindo uma oração. Nunca agrediu ninguém. Qual a melhor interpretação?", "opts": ["Transtorno explosivo intermitente: os pensamentos indicam impulsividade agressiva.", "Esquizofrenia: os pensamentos são vozes de comando.", "TOC com obsessões agressivas egodistônicas, compulsão mental (oração) e evitação.", "Transtorno de personalidade antissocial, pela temática violenta."], "ok": 2, "exp": "<b>C<\/b> é a correta: o pensamento é intrusivo e causa horror (egodistônico), há neutralização (oração) e evitação, sem história de violência. É a dimensão de pensamentos proibidos. <b>A<\/b> está errada: no transtorno explosivo há ataques reais de agressividade, não pensamentos indesejados que a pessoa combate. <b>B<\/b> está errada: ele reconhece o pensamento como dele, não como voz externa; não há outros sintomas psicóticos. <b>D<\/b> está errada: o antissocial não sente horror do próprio impulso, e a avaliação se baseia em comportamento, não em tema de pensamento. Revise: <b>dimensões de sintomas e egodistonia<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Sobre o curso e o prognóstico do TOC, é correto afirmar:", "opts": ["O curso é tipicamente episódico, com remissão espontânea completa entre os episódios na maioria dos adultos.", "O TOC de início na infância persiste na vida adulta em praticamente todos os casos.", "Início precoce, longa duração sem tratamento, insight pobre e acomodação familiar intensa associam-se a pior prognóstico.", "Remissão é definida por qualquer redução da Y-BOCS acima de 10%."], "ok": 2, "exp": "<b>C<\/b> é a correta e reúne os principais fatores de pior prognóstico descritos na literatura. <b>A<\/b> está errada: o curso típico é crônico com flutuação; remissão espontânea completa é pouco comum. <b>B<\/b> está errada: na metanálise de Stewart (2004), o TOC completo persistiu em cerca de 41% e o completo ou subclínico em 60%. <b>D<\/b> está errada: o consenso define resposta como redução de pelo menos 35% e remissão como Y-BOCS de 12 ou menos. Revise: <b>curso, prognóstico e definições de desfecho<\/b>."}]}, {"id": "ps-diag", "title": "3. Diagnóstico: DSM-5-TR, CID-11 e escalas", "sub": "Critérios A a D, especificadores, CID-11 6B20 e CID-10 F42, o capítulo dos transtornos relacionados, a Y-BOCS e a avaliação inicial", "blocks": [{"t": "h2", "v": "Os critérios do DSM-5-TR"}, {"t": "ul", "v": ["<b>A.<\/b> Presença de <b>obsessões, compulsões ou ambas<\/b>, com as definições do bloco 1 (obsessão: intrusiva, indesejada, que a pessoa tenta ignorar, suprimir ou neutralizar; compulsão: repetitiva, em resposta à obsessão ou a regras rígidas, para reduzir ansiedade ou evitar algo temido, sem conexão realista ou claramente excessiva).", "<b>B.<\/b> As obsessões ou compulsões <b>consomem tempo<\/b> (por exemplo, <b>mais de 1 hora por dia<\/b>) <b>ou<\/b> causam <b>sofrimento clinicamente significativo<\/b> ou <b>prejuízo<\/b> social, profissional ou em outras áreas importantes.", "<b>C.<\/b> Os sintomas <b>não se devem aos efeitos fisiológicos de uma substância<\/b> (droga de abuso, medicamento) <b>nem a outra condição médica<\/b>.", "<b>D.<\/b> A perturbação <b>não é mais bem explicada por outro transtorno mental<\/b>: preocupações excessivas do transtorno de ansiedade generalizada, preocupação com a aparência no transtorno dismórfico corporal, dificuldade de descartar na acumulação, arrancar cabelos na tricotilomania, ruminação de culpa na depressão, ruminação sobre comida nos transtornos alimentares, inserção de pensamento ou delírio nos transtornos psicóticos, comportamentos repetitivos do transtorno do espectro autista, entre outros.", "<b>Especificadores<\/b>: grau de insight (bom ou razoável; pobre; ausente/crenças delirantes) e <b>relacionado a tique<\/b>.", "O DSM-5-TR (2022) é a revisão de texto do DSM-5 (2013): <b>os critérios do TOC não mudaram<\/b>; o texto foi atualizado (prevalência, cultura, suicídio)."]}, {"t": "escreva", "id": "ps-diag-w-criterios-do-dsm-5-tr", "label": "Critérios do DSM-5-TR", "v": "", "li": ["<b>A<\/b>: obsessões, compulsões ou ambas", "<b>B<\/b>: &gt; 1 h/dia <b>ou<\/b> sofrimento <b>ou<\/b> prejuízo", "<b>C<\/b>: não por substância nem condição médica", "<b>D<\/b>: não mais bem explicado por outro transtorno", "Especificar <b>insight<\/b> e <b>relacionado a tique<\/b>"]}, {"t": "lance", "q": "O critério B exige mais de 1 hora por dia?", "a": "Não: é consumo de tempo OU sofrimento OU prejuízo significativo."}, {"t": "h2", "v": "A CID-11 e a CID-10"}, {"t": "ul", "v": ["Na <b>CID-11<\/b> (OMS, em vigor desde 1º de janeiro de 2022), o TOC é o código <b>6B20<\/b>, dentro do agrupamento <b>\"Transtornos obsessivo-compulsivos ou relacionados\"<\/b> (6B20 a 6B2Z).", "A CID-11 usa uma descrição clínica, sem lista fechada de critérios: obsessões e/ou compulsões persistentes, que <b>consomem tempo<\/b> (por exemplo, mais de 1 hora por dia) ou causam sofrimento ou prejuízo significativos.", "Subcategorias pelo insight: <b>6B20.0<\/b> com insight razoável a bom; <b>6B20.1<\/b> com insight pobre a ausente; 6B20.Z não especificado.", "Na <b>CID-10<\/b>, ainda muito usada em prontuários e laudos no Brasil, o TOC é <b>F42<\/b>, nos \"transtornos neuróticos\": F42.0 predominantemente pensamentos obsessivos, F42.1 predominantemente atos compulsivos, F42.2 forma mista, F42.8 outros, F42.9 não especificado.", "A CID-10 pedia sintomas na maioria dos dias por <b>pelo menos 2 semanas<\/b>; a CID-11 tirou esse tempo mínimo e as subdivisões por tipo."]}, {"t": "table", "head": ["", "DSM-5-TR", "CID-11", "CID-10"], "rows": [["Código", "300.3 / F42.2", "6B20", "F42"], ["Capítulo", "TOC e transtornos relacionados", "Obsessivo-compulsivos ou relacionados", "Transtornos neuróticos"], ["Tempo", "&gt; 1 h/dia ou sofrimento ou prejuízo", "Idem", "Maioria dos dias por ≥ 2 semanas"], ["Insight", "3 níveis", "2 níveis (6B20.0 e 6B20.1)", "Não especifica"], ["Tiques", "Especificador \"relacionado a tique\"", "Tique codificado à parte", "Não especifica"]]}, {"t": "div", "v": "O Brasil ainda está em transição da CID-10 para a CID-11: muitos sistemas do SUS, atestados e laudos continuam pedindo o código CID-10 (F42). Para estudar, use a lógica da CID-11 e do DSM-5-TR; para preencher documentos, use o código que o sistema exige.", "src": [["OMS · CID-11, 6B20", "https://icd.who.int/browse/2025-01/mms/en"], ["OMS · CID-10, F42", "https://icd.who.int/browse10/2019/en#/F42"]]}, {"t": "escreva", "id": "ps-diag-w-codigos", "label": "Códigos", "v": "", "li": ["CID-11: <b>6B20<\/b> (6B20.0 insight razoável a bom; 6B20.1 pobre a ausente)", "CID-10: <b>F42<\/b> (F42.0 obsessões; F42.1 compulsões; F42.2 misto)", "CID-11 tirou o tempo mínimo de 2 semanas"]}, {"t": "lance", "q": "Qual o código do TOC na CID-11 e na CID-10?", "a": "6B20 na CID-11 e F42 na CID-10."}, {"t": "h2", "v": "O capítulo dos transtornos relacionados"}, {"t": "ul", "v": ["Desde o DSM-5, o TOC divide capítulo com transtornos que compartilham <b>pensamento repetitivo e/ou comportamento repetitivo<\/b>, genética e circuitos:"]}, {"t": "table", "head": ["Transtorno", "Núcleo", "DSM-5-TR", "CID-11"], "rows": [["<b>TOC<\/b>", "Obsessões e compulsões", "Sim", "6B20"], ["<b>Transtorno dismórfico corporal<\/b>", "Preocupação com defeito percebido na aparência; espelho, comparação, camuflagem", "Sim", "6B21"], ["<b>Transtorno de acumulação<\/b>", "Dificuldade persistente de descartar, com acúmulo que congestiona a casa", "Sim", "6B24"], ["<b>Tricotilomania<\/b>", "Arrancar cabelos ou pelos de forma recorrente", "Sim", "6B25.0"], ["<b>Transtorno de escoriação<\/b> (<i>skin picking<\/i>)", "Beliscar a pele de forma recorrente", "Sim", "6B25.1"], ["<b>Síndrome de referência olfativa<\/b>", "Convicção de exalar mau odor", "\"Outro especificado\"", "6B22"], ["<b>Hipocondria<\/b>", "Medo de ter doença grave", "No capítulo somático (ansiedade de doença)", "6B23"], ["Induzido por substância ou devido a outra condição médica", "Sintomas obsessivo-compulsivos secundários", "Sim", "Codificados à parte"]]}, {"t": "ul", "v": ["<b>Diferença entre os manuais<\/b>: a CID-11 coloca a <b>hipocondria<\/b> e a <b>síndrome de referência olfativa<\/b> no mesmo grupo do TOC; o DSM-5-TR mantém a hipocondria como \"transtorno de ansiedade de doença\", no capítulo de sintomas somáticos.", "Tricotilomania e escoriação são os <b>comportamentos repetitivos focados no corpo<\/b>: o ato costuma vir com tensão e alívio, às vezes com prazer, e frequentemente <b>sem obsessão<\/b> antes."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Os \"relacionados\" respondem de forma diferente: o dismórfico corporal responde a ISRS em dose alta e TCC, como o TOC; a acumulação responde mal aos ISRS; tricotilomania e escoriação respondem melhor à <b>terapia de reversão de hábito<\/b> do que à EPR."}, {"t": "escreva", "id": "ps-diag-w-os-transtornos-relacionados", "label": "Os transtornos relacionados", "v": "", "li": ["Dismórfico corporal, acumulação, tricotilomania, escoriação", "CID-11 inclui hipocondria (6B23) e referência olfativa (6B22)", "Tricotilomania e escoriação: reversão de hábito", "Acumulação: resposta ruim aos ISRS"]}, {"t": "lance", "q": "Que transtorno a CID-11 põe no grupo do TOC e o DSM-5-TR deixa no capítulo somático?", "a": "A hipocondria (no DSM-5-TR, transtorno de ansiedade de doença)."}, {"t": "h2", "v": "A Y-BOCS e outras escalas"}, {"t": "ul", "v": ["A <b>Y-BOCS<\/b> (Yale-Brown Obsessive Compulsive Scale; Goodman e cols., 1989) é o <b>padrão-ouro<\/b> para medir a gravidade e acompanhar o tratamento. É uma entrevista semiestruturada.", "Começa por uma <b>lista de verificação<\/b> de sintomas (para mapear o conteúdo) e depois pontua <b>10 itens<\/b> de 0 a 4: <b>5 para obsessões<\/b> e <b>5 para compulsões<\/b> (tempo ocupado, interferência, sofrimento, resistência e grau de controle). Total de <b>0 a 40<\/b>."]}, {"t": "table", "head": ["Y-BOCS", "Gravidade"], "rows": [["0 a 7", "Subclínico"], ["8 a 15", "Leve"], ["16 a 23", "Moderado"], ["24 a 31", "Grave"], ["32 a 40", "Extremo"]]}, {"t": "ul", "v": ["Pontuação de <b>16 ou mais<\/b> é a habitualmente usada como TOC clinicamente significativo em ensaios clínicos.", "Outras: <b>CY-BOCS<\/b> (versão infantil); <b>DY-BOCS<\/b> (dimensional, por dimensão de sintoma); <b>OCI-R<\/b> (autoaplicável, 18 itens; ponto de corte habitual de 21); <b>Y-BOCS-II<\/b> (versão revisada); <b>BABS<\/b> (Brown Assessment of Beliefs Scale, mede o insight).", "Escala não faz diagnóstico: ela <b>mede<\/b>. O diagnóstico é clínico."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Na prática, aplicar a Y-BOCS no início e a cada poucas semanas transforma \"acho que melhorou\" em número, e é com ele que se decide se o tratamento é adequado ou se é hora de trocar (blocos 7 e 8)."}, {"t": "escreva", "id": "ps-diag-w-y-bocs", "label": "Y-BOCS", "v": "", "li": ["10 itens (5 obsessões + 5 compulsões), 0 a 4 cada, total <b>0 a 40<\/b>", "8–15 leve; 16–23 moderado; 24–31 grave; 32–40 extremo", "≥ 16: clinicamente significativo", "CY-BOCS (criança), DY-BOCS (dimensões), OCI-R (autoaplicável)"]}, {"t": "lance", "q": "Qual a faixa de Y-BOCS do TOC grave?", "a": "De 24 a 31 (32 a 40 é extremo)."}, {"t": "h2", "v": "A avaliação inicial na prática"}, {"t": "ul", "v": ["<b>Perguntas de rastreio<\/b> úteis (o NICE sugere perguntas desse tipo em quem tem fatores de risco ou queixas inespecíficas):<ul class=\"sub\"><li>\"Você lava ou limpa muito?\"<\/li><li>\"Você confere as coisas muitas vezes?\"<\/li><li>\"Há algum pensamento que fica voltando e incomodando, que você gostaria de tirar da cabeça e não consegue?\"<\/li><li>\"Suas atividades diárias levam muito tempo para terminar?\"<\/li><li>\"Você se preocupa com ordem ou simetria?\"<\/li><\/ul>", "<b>História<\/b>: início, curso, conteúdo, rituais (inclusive mentais), evitação, tempo gasto, prejuízo, insight, acomodação da família, tratamentos prévios com dose e duração.", "<b>Comorbidades<\/b> (bloco 4) e <b>risco de suicídio<\/b>, sempre perguntados de forma direta.", "<b>Exame físico<\/b>: dermatite de contato nas mãos (lavagem), escoriações, alopecia (tricotilomania associada), tiques.", "<b>Exames complementares<\/b>: não há exame diagnóstico. Investigação orgânica (neuroimagem, por exemplo) é dirigida pela clínica: <b>início após os 35 anos<\/b>, sinais neurológicos, curso atípico, início abrupto na infância.", "<b>Substâncias e medicamentos<\/b> que podem induzir sintomas obsessivo-compulsivos: estimulantes (anfetamina, cocaína) e alguns antipsicóticos de segunda geração (a <b>clozapina<\/b> é o exemplo mais citado), em especial em pessoas com esquizofrenia."]}, {"t": "p", "v": "<span class=\"ps-src\">Fonte: <a href=\"https://www.nice.org.uk/guidance/cg31\" target=\"_blank\" rel=\"noopener\">NICE CG31 · Obsessive-compulsive disorder and body dysmorphic disorder (2005)<\/a> · <a href=\"https://psychiatryonline.org/pb/assets/raw/sitewide/practice_guidelines/guidelines/ocd.pdf\" target=\"_blank\" rel=\"noopener\">APA Practice Guideline for OCD (2007)<\/a><\/span>"}, {"t": "escreva", "id": "ps-diag-w-avaliacao-inicial", "label": "Avaliação inicial", "v": "", "li": ["Rastreio: lavar, conferir, pensamento que volta, demora, simetria", "Conteúdo + rituais mentais + evitação + tempo + insight + acomodação", "Comorbidades e <b>suicídio<\/b> sempre", "Investigação orgânica se: &gt; 35 anos, sinais neurológicos, início abrupto", "Lembrar: estimulantes e clozapina"]}, {"t": "lance", "q": "Que medicamento antipsicótico pode induzir sintomas obsessivo-compulsivos?", "a": "A clozapina."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Quais os quatro critérios (A a D) do DSM-5-TR para TOC?", "a": "A: obsessões, compulsões ou ambas. B: consomem tempo (mais de 1 hora por dia) ou causam sofrimento ou prejuízo significativo. C: não atribuíveis a substância ou a outra condição médica. D: não mais bem explicados por outro transtorno mental."}, {"q": "Qual o código do TOC na CID-11 e como ele se subdivide?", "a": "6B20, subdividido pelo insight: 6B20.0 com insight razoável a bom e 6B20.1 com insight pobre a ausente."}, {"q": "Que dois transtornos a CID-11 inclui no grupo do TOC e que o DSM-5-TR deixa em outro lugar?", "a": "Hipocondria (6B23), que no DSM-5-TR é transtorno de ansiedade de doença, no capítulo somático; e síndrome de referência olfativa (6B22), que no DSM-5-TR aparece como \"outro transtorno obsessivo-compulsivo especificado\"."}, {"q": "Como é estruturada a Y-BOCS e quais as faixas de gravidade?", "a": "10 itens (5 de obsessões e 5 de compulsões) pontuados de 0 a 4, total de 0 a 40. 0–7 subclínico, 8–15 leve, 16–23 moderado, 24–31 grave, 32–40 extremo."}, {"q": "Quando investigar causa orgânica num quadro obsessivo-compulsivo?", "a": "Início após os 35 anos, sinais neurológicos focais, curso atípico ou início abrupto (especialmente na infância), uso de substância ou de medicamento que possa induzir sintomas."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Homem de 28 anos gasta cerca de 40 minutos por dia em rituais de verificação, mas por causa deles foi demitido de dois empregos por atrasos. Reconhece que as verificações são exageradas. Em relação ao critério B do DSM-5-TR, é correto afirmar:", "opts": ["Não preenche, porque os rituais tomam menos de 1 hora por dia.", "Preenche, porque o critério exige consumo de tempo OU sofrimento OU prejuízo funcional significativo.", "Não preenche, porque o insight está preservado.", "Preenche apenas se houver também obsessões de conteúdo agressivo."], "ok": 1, "exp": "<b>B<\/b> é a correta: o critério B é disjuntivo. \"Mais de 1 hora por dia\" é um exemplo de consumo de tempo, não uma exigência isolada; prejuízo funcional (perder empregos) basta. <b>A<\/b> lê o critério como cumulativo, o que é o erro clássico. <b>C<\/b> está errada: insight preservado é a regra no TOC e entra como especificador, não exclui o diagnóstico. <b>D<\/b> inventa uma exigência de conteúdo: o DSM não exige nenhum tema específico. Revise: <b>critérios A a D<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Paciente com TOC tem Y-BOCS de 30 antes do tratamento e de 19 após 12 semanas de sertralina em dose adequada. Pelo consenso internacional de desfechos, ele apresenta:", "opts": ["Remissão, porque a pontuação caiu mais de 10 pontos.", "Resposta, porque houve redução de cerca de 37%, mas não remissão, porque a Y-BOCS segue acima de 12.", "Ausência de resposta, porque a Y-BOCS final segue na faixa moderada.", "Resposta parcial, porque a redução foi menor que 25%."], "ok": 1, "exp": "<b>B<\/b> é a correta: (30 − 19) / 30 ≈ 37%, acima dos 35% que definem resposta (com melhora global). Remissão exige Y-BOCS de 12 ou menos. <b>A<\/b> confunde pontos absolutos com o critério de remissão. <b>C<\/b> está errada: o critério de resposta é a redução percentual, não a faixa final. <b>D<\/b> erra a conta: a redução foi de 37%, e resposta parcial é entre 25% e 35%. Revise: <b>Y-BOCS e definições de resposta e remissão<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Em relação à classificação do TOC, assinale a correta.", "opts": ["No DSM-5-TR, o TOC continua no capítulo dos transtornos de ansiedade.", "O transtorno de acumulação é um especificador do TOC no DSM-5-TR.", "Na CID-11, o TOC (6B20) integra o grupo dos transtornos obsessivo-compulsivos ou relacionados, que inclui também a hipocondria.", "A CID-11 manteve o tempo mínimo de duas semanas de sintomas da CID-10."], "ok": 2, "exp": "<b>C<\/b> é a correta: a CID-11 agrupa TOC, dismórfico corporal, referência olfativa, hipocondria, acumulação e os comportamentos repetitivos focados no corpo. <b>A<\/b> está errada: desde o DSM-5 (2013) o TOC tem capítulo próprio. <b>B<\/b> está errada: acumulação virou transtorno independente. <b>D<\/b> está errada: a CID-11 retirou o tempo mínimo e usa consumo de tempo ou sofrimento ou prejuízo. Revise: <b>DSM-5-TR × CID-11<\/b>."}]}, {"id": "ps-dif", "title": "4. Diferenciais, comorbidades e suicídio", "sub": "TAG, depressão, personalidade obsessivo-compulsiva, psicose, tiques, autismo, causas orgânicas, comorbidades e o risco de suicídio · DSM-5-TR e coorte sueca", "blocks": [{"t": "h2", "v": "TOC × TAG × depressão"}, {"t": "ul", "v": ["<b>Transtorno de ansiedade generalizada (TAG)<\/b>: preocupações sobre <b>problemas reais da vida<\/b> (dinheiro, saúde, trabalho, família), vividas como excessivas mas <b>coerentes com a pessoa<\/b> (egossintônicas), sem rituais para neutralizá-las.", "<b>TOC<\/b>: obsessões com conteúdo frequentemente <b>bizarro, irracional ou mágico<\/b>, sentidas como <b>estranhas a si<\/b> (egodistônicas), quase sempre acompanhadas de compulsões.", "<b>Depressão<\/b>: a <b>ruminação<\/b> depressiva gira em torno de culpa, fracasso e passado, é congruente com o humor e não costuma vir com ritual. No TOC, a culpa pode existir, mas é amarrada a uma obsessão e a uma neutralização.", "O TOC e a depressão andam muito juntos: a depressão costuma vir <b>depois<\/b> do TOC, como consequência do desgaste."]}, {"t": "table", "head": ["", "TOC", "TAG", "Depressão"], "rows": [["Conteúdo", "Intrusivo, muitas vezes irracional ou tabu", "Problemas cotidianos reais", "Culpa, fracasso, desesperança"], ["Vivência", "Egodistônica", "Egossintônica", "Congruente com o humor"], ["Ritual", "Sim, para neutralizar", "Não (pode haver busca de reasseguramento)", "Não"], ["Curso", "Crônico, flutuante", "Crônico", "Episódico na maioria"]]}, {"t": "escreva", "id": "ps-dif-w-toc-tag-depressao", "label": "TOC × TAG × depressão", "v": "", "li": ["TAG: preocupações reais, egossintônicas, sem ritual", "TOC: intrusão egodistônica + compulsão", "Depressão: ruminação de culpa, congruente com o humor", "Depressão costuma ser <b>secundária<\/b> ao TOC"]}, {"t": "lance", "q": "O que diferencia a preocupação do TAG da obsessão?", "a": "A preocupação do TAG é sobre problemas reais e é egossintônica, sem ritual."}, {"t": "h2", "v": "TOC × personalidade obsessivo-compulsiva"}, {"t": "ul", "v": ["O <b>transtorno da personalidade obsessivo-compulsiva (TPOC)<\/b> é um padrão <b>global e duradouro<\/b> de preocupação com ordem, perfeccionismo e controle, à custa de flexibilidade e eficiência. Começa no início da vida adulta.", "Características do TPOC: perfeccionismo que atrapalha terminar tarefas, devoção excessiva ao trabalho, rigidez moral, dificuldade de delegar, avareza, dificuldade de descartar objetos sem valor, teimosia.", "A diferença essencial é a <b>egossintonia<\/b>: no TPOC a pessoa acha que o jeito dela é o certo e que os outros é que são desleixados. No TOC, a pessoa <b>sofre<\/b> com os próprios pensamentos e rituais.", "No TPOC <b>não há obsessões nem compulsões verdadeiras<\/b>.", "Os dois podem coexistir: o DSM-5-TR descreve TPOC em cerca de <b>23 a 32%<\/b> das pessoas com TOC."]}, {"t": "table", "head": ["", "TOC", "TPOC"], "rows": [["Natureza", "Transtorno com sintomas", "Traço de personalidade, padrão global"], ["Vivência", "Egodistônica, sofrimento", "Egossintônica, \"o certo é assim\""], ["Obsessões e compulsões", "Presentes", "Ausentes"], ["Tratamento", "EPR + ISRS", "Psicoterapia (resposta modesta)"]]}, {"t": "escreva", "id": "ps-dif-w-toc-tpoc", "label": "TOC × TPOC", "v": "", "li": ["TPOC: padrão global de perfeccionismo, ordem, controle", "TPOC é <b>egossintônico<\/b> e não tem obsessões nem compulsões", "TOC é <b>egodistônico<\/b>", "Podem coexistir (23 a 32% dos casos de TOC)"]}, {"t": "lance", "q": "Qual a palavra que separa o TPOC do TOC?", "a": "Egossintonia: no TPOC a pessoa acha que o jeito dela é o certo."}, {"t": "h2", "v": "TOC × psicose"}, {"t": "ul", "v": ["Obsessão com <b>insight ausente<\/b> se parece com delírio, mas o tema é o do TOC, há rituais e não há alucinações nem outros sintomas psicóticos: o diagnóstico é <b>TOC com insight ausente<\/b>.", "No <b>delírio<\/b>, a crença costuma ser egossintônica e acompanhada de outros sintomas: desorganização, alucinações, alteração do afeto. Na <b>inserção de pensamento<\/b>, a pessoa sente que o pensamento foi colocado por outro.", "A <b>esquizofrenia<\/b> e o TOC podem coexistir: sintomas obsessivo-compulsivos aparecem em uma parcela relevante das pessoas com esquizofrenia.", "Antipsicóticos de segunda geração, sobretudo a <b>clozapina<\/b>, podem <b>induzir ou piorar<\/b> sintomas obsessivo-compulsivos, provavelmente pelo antagonismo 5-HT2A.", "<b>Pós-parto<\/b>: obsessão de dano ao bebê (TOC, egodistônica, mãe se protege) × <b>psicose puerperal<\/b> (confusão, alucinações, delírios, risco real): diferencial de emergência."]}, {"t": "escreva", "id": "ps-dif-w-toc-psicose", "label": "TOC × psicose", "v": "", "li": ["Insight ausente restrito ao tema do TOC = TOC", "Delírio: egossintônico + outros sintomas psicóticos", "Clozapina pode induzir sintomas obsessivo-compulsivos", "Pós-parto: obsessão de dano (TOC) × psicose puerperal (emergência)"]}, {"t": "lance", "q": "Obsessão de dano ao bebê com horror e evitação: TOC ou psicose puerperal?", "a": "TOC: egodistônico, a mãe se protege do pensamento."}, {"t": "h2", "v": "Tiques, autismo e causas orgânicas"}, {"t": "ul", "v": ["<b>Tiques<\/b>: movimentos ou vocalizações súbitos, rápidos, recorrentes e não rítmicos, precedidos de uma sensação premonitória, <b>sem obsessão<\/b> por trás. Até <b>30%<\/b> das pessoas com TOC têm transtorno de tique na vida (DSM-5-TR), e muitas pessoas com <b>Tourette<\/b> têm TOC.", "<b>Transtorno do espectro autista<\/b>: comportamentos repetitivos e interesses restritos que costumam ser <b>prazerosos ou reguladores<\/b>, sem obsessão egodistônica; associados a déficit de comunicação social desde cedo. Diferenciar exige olhar para a função do comportamento.", "<b>Causas orgânicas<\/b> de sintomas obsessivo-compulsivos secundários (\"devidos a outra condição médica\"):<ul class=\"sub\"><li>Lesões dos <b>núcleos da base<\/b> e do <b>lobo frontal<\/b> (AVC, trauma, tumor).<\/li><li><b>Coreia de Sydenham<\/b> (febre reumática) e, na hipótese PANDAS/PANS, infecções na infância (bloco 5).<\/li><li>Doenças neurodegenerativas: <b>demência frontotemporal<\/b>, doença de Huntington, doença de Parkinson (e agonistas dopaminérgicos podem dar comportamentos repetitivos e impulsivos).<\/li><li>Encefalites e epilepsia do lobo temporal ou frontal.<\/li><\/ul>", "<b>Substâncias<\/b>: estimulantes (anfetamina, metilfenidato, cocaína) podem induzir rituais e comportamentos repetitivos (<i>punding<\/i>)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Na demência frontotemporal, os comportamentos repetitivos aparecem com desinibição, apatia e perda de crítica, num paciente sem história prévia. É o exemplo clássico de por que início tardio pede investigação."}, {"t": "escreva", "id": "ps-dif-w-tiques-tea-e-organico", "label": "Tiques, TEA e orgânico", "v": "", "li": ["Tique: sem obsessão; até 30% do TOC tem tique na vida", "TEA: repetição prazerosa/reguladora, déficit social precoce", "Orgânico: núcleos da base, frontal, DFT, Sydenham, encefalite", "Estimulantes podem induzir rituais"]}, {"t": "lance", "q": "Que proporção das pessoas com TOC tem tique ao longo da vida?", "a": "Até 30%."}, {"t": "h2", "v": "Comorbidades"}, {"t": "ul", "v": ["A comorbidade é a <b>regra<\/b>: no NCS-R, cerca de <b>90%<\/b> das pessoas com TOC tinham outro transtorno ao longo da vida.", "Pelo DSM-5-TR, ao longo da vida:<ul class=\"sub\"><li><b>Transtornos de ansiedade<\/b>: cerca de <b>76%<\/b> (pânico, ansiedade social, TAG, fobia específica).<\/li><li><b>Transtornos depressivos ou bipolares<\/b>: cerca de <b>63%<\/b>; depressão maior em cerca de <b>41%<\/b>.<\/li><li><b>TPOC<\/b>: 23 a 32%.<\/li><li><b>Tiques<\/b>: até 30%.<\/li><\/ul>", "Também são mais frequentes: transtornos do espectro relacionados (dismórfico corporal, tricotilomania, escoriação), transtornos alimentares (anorexia), TDAH em crianças e uso de substâncias.", "No <b>transtorno bipolar<\/b>, os sintomas obsessivo-compulsivos podem melhorar ou piorar com as fases do humor, e o uso de ISRS exige cuidado com virada maníaca (estabilizar o humor primeiro).", "Comorbidade muda o tratamento: depressão grave pode atrapalhar a EPR; tiques mudam a escolha do reforço; bipolaridade pede estabilizador antes do ISRS."]}, {"t": "escreva", "id": "ps-dif-w-comorbidades-na-vida", "label": "Comorbidades (na vida)", "v": "", "li": ["Qualquer transtorno: ~90% (NCS-R)", "Ansiedade ~76%; humor ~63% (depressão maior ~41%)", "TPOC 23–32%; tiques até 30%", "Bipolar: estabilizar o humor antes do ISRS"]}, {"t": "lance", "q": "Qual a comorbidade mais frequente do TOC ao longo da vida?", "a": "Transtornos de ansiedade, em cerca de 76%."}, {"t": "h2", "v": "Suicídio no TOC"}, {"t": "ul", "v": ["O TOC já foi visto como transtorno de baixo risco de suicídio. Os dados mostram o contrário.", "Pelo DSM-5-TR, cerca de <b>metade<\/b> das pessoas com TOC tem <b>pensamentos suicidas<\/b> em algum momento, e até <b>um quarto<\/b> relata <b>tentativa<\/b>.", "Na coorte sueca de <b>36.788 pacientes<\/b> com TOC (1969 a 2013), comparados com controles pareados, o risco foi muito maior de <b>morte por suicídio<\/b> (razão de chances ≈ <b>9,8<\/b>) e de <b>tentativa<\/b> (≈ <b>5,5<\/b>). O risco <b>diminuiu, mas continuou alto<\/b> mesmo depois de ajustar para comorbidades (Fernández de la Cruz e cols., 2017).", "Nessa coorte, o <b>maior preditor<\/b> de morte por suicídio foi <b>tentativa prévia<\/b>; comorbidade com transtorno de personalidade ou de uso de substância aumentou o risco.", "Fatores associados em outros estudos: depressão comórbida, desesperança, gravidade do TOC e sintomas da dimensão de pensamentos proibidos.", "<b>Conduta<\/b>: perguntar diretamente sobre ideação, plano e tentativas em toda avaliação e reavaliação; tratar a depressão comórbida; atenção ao início do ISRS em jovens (bloco 7)."]}, {"t": "p", "v": "<span class=\"ps-src\">Fonte: <a href=\"https://doi.org/10.1038/mp.2016.115\" target=\"_blank\" rel=\"noopener\">Fernández de la Cruz L e cols. Mol Psychiatry, 2017<\/a><\/span>"}, {"t": "p", "v": "<cx>[Complemento]<\/cx> No Brasil, o <b>CVV<\/b> atende pelo telefone <b>188<\/b> (24 horas, gratuito) e pelo site cvv.org.br; risco iminente é emergência (SAMU 192 ou pronto-socorro)."}, {"t": "escreva", "id": "ps-dif-w-suicidio-no-toc", "label": "Suicídio no TOC", "v": "", "li": ["Ideação em ~metade; tentativa em até 1/4 (DSM-5-TR)", "Coorte sueca: OR ≈ 9,8 para morte por suicídio, ≈ 5,5 para tentativa", "Risco continua alto após ajustar comorbidades", "Maior preditor: <b>tentativa prévia<\/b>", "Perguntar sempre; CVV 188"]}, {"t": "lance", "q": "Qual o maior preditor de morte por suicídio na coorte sueca?", "a": "Tentativa de suicídio prévia."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Qual a diferença essencial entre a preocupação do TAG e a obsessão do TOC?", "a": "A preocupação do TAG é sobre problemas reais do cotidiano e é egossintônica, sem ritual; a obsessão é intrusiva, frequentemente irracional ou tabu, egodistônica e acompanhada de compulsão para neutralizá-la."}, {"q": "Como diferenciar TOC de transtorno da personalidade obsessivo-compulsiva?", "a": "O TPOC é um padrão global e egossintônico de perfeccionismo, ordem e controle, sem obsessões nem compulsões verdadeiras; o TOC tem obsessões e compulsões egodistônicas que causam sofrimento. Podem coexistir."}, {"q": "Que antipsicótico é classicamente associado a indução ou piora de sintomas obsessivo-compulsivos?", "a": "A clozapina (e outros antipsicóticos de segunda geração), possivelmente pelo antagonismo 5-HT2A."}, {"q": "Quais as comorbidades mais frequentes do TOC ao longo da vida, segundo o DSM-5-TR?", "a": "Transtornos de ansiedade (cerca de 76%), transtornos depressivos ou bipolares (cerca de 63%, com depressão maior em 41%), TPOC (23 a 32%) e tiques (até 30%)."}, {"q": "O que mostrou a coorte sueca sobre suicídio no TOC?", "a": "Risco muito aumentado de morte por suicídio (OR ≈ 9,8) e de tentativa (OR ≈ 5,5) em relação a controles, que continuou significativo após ajuste para comorbidades; o maior preditor de morte foi tentativa prévia."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Contador de 45 anos é trazido pela esposa, que se queixa de que ele exige que tudo em casa siga suas listas, refaz o trabalho dos colegas por considerá-lo malfeito, não delega e trabalha nos fins de semana. Ele acha que todos são desleixados e não vê problema no próprio jeito. Não há pensamentos intrusivos nem rituais. O diagnóstico mais provável é:", "opts": ["TOC com insight pobre.", "Transtorno da personalidade obsessivo-compulsiva.", "Transtorno de ansiedade generalizada.", "Transtorno do espectro autista."], "ok": 1, "exp": "<b>B<\/b> é a correta: padrão global, duradouro e egossintônico de perfeccionismo, rigidez e controle, sem obsessões nem compulsões. <b>A<\/b> está errada: TOC exige obsessões e/ou compulsões, e insight pobre não transforma traço de personalidade em TOC. <b>C<\/b> está errada: não há preocupações excessivas e ansiedade como núcleo. <b>D<\/b> está errada: não há déficit de comunicação social desde a infância nem interesses restritos típicos. Revise: <b>TOC × TPOC e egossintonia<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Homem de 58 anos, sem história psiquiátrica, passa a contar repetidamente objetos e a organizar a casa de forma rígida há 8 meses. A esposa nota desinibição, perda de interesse e comentários inadequados. Ele não demonstra incômodo com os comportamentos. A conduta mais adequada é:", "opts": ["Iniciar fluoxetina 20 mg e reavaliar em 12 semanas.", "Encaminhar para exposição com prevenção de resposta.", "Investigar causa orgânica com avaliação neurológica, cognitiva e neuroimagem.", "Diagnosticar TOC com insight ausente e iniciar risperidona."], "ok": 2, "exp": "<b>C<\/b> é a correta: início após os 35 anos, sem crítica, com desinibição e apatia, sugere quadro orgânico, como demência frontotemporal; o critério C do DSM-5-TR exige excluir condição médica. <b>A<\/b> e <b>B<\/b> tratam como TOC primário sem investigar. <b>D<\/b> confunde falta de crítica de origem neurológica com insight ausente do TOC, e a risperidona não é tratamento inicial. Revise: <b>sinais de alerta para causa secundária<\/b>."}]}, {"id": "ps-neuro", "title": "5. Por que acontece: neurobiologia e psicologia", "sub": "Genética, o circuito córtico-estriado-tálamo-cortical, serotonina, dopamina e glutamato, os modelos cognitivo-comportamentais, hábito e a hipótese PANDAS/PANS", "blocks": [{"t": "h2", "v": "Genética: o TOC corre em famílias"}, {"t": "ul", "v": ["O TOC <b>agrega em famílias<\/b>: o risco em parentes de primeiro grau é maior que na população e cai à medida que o parentesco se afasta.", "No estudo populacional sueco com <b>24.768<\/b> pessoas com TOC e seus parentes, a herdabilidade estimada em gêmeos foi de cerca de <b>47%<\/b>, sem efeito relevante do ambiente compartilhado; o ambiente <b>não compartilhado<\/b> (experiências próprias de cada um) pesou pelo menos tanto quanto os genes (Mataix-Cols e cols., 2013).", "A herdabilidade tende a ser <b>maior no TOC de início na infância<\/b>.", "É uma herança <b>poligênica<\/b>: milhares de variantes de efeito pequeno, não \"um gene do TOC\".", "O maior estudo de associação genômica até hoje (<b>53.660 casos<\/b> e mais de 2 milhões de controles) identificou <b>30 loci<\/b> associados ao TOC; o risco genético se concentrou em neurônios excitatórios do córtex e do hipocampo e nos <b>neurônios espinhosos médios do estriado<\/b> com receptores D1 e D2, e foi compartilhado com ansiedade, depressão, anorexia nervosa e síndrome de Tourette (Strom e cols., 2025)."]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.1001/jamapsychiatry.2013.3\" target=\"_blank\" rel=\"noopener\">Mataix-Cols D e cols. JAMA Psychiatry, 2013<\/a> · <a href=\"https://doi.org/10.1038/s41588-025-02189-z\" target=\"_blank\" rel=\"noopener\">Strom NI e cols. Nat Genet, 2025<\/a><\/span>"}, {"t": "escreva", "id": "ps-neuro-w-genetica", "label": "Genética", "v": "", "li": ["Agregação familiar; risco cai com a distância de parentesco", "Herdabilidade ≈ <b>47%<\/b> (Suécia, 2013); ambiente não compartilhado pesa tanto quanto", "Maior no início infantil", "<b>Poligênico<\/b>; GWAS 2025: <b>30 loci<\/b>, estriado (D1/D2), genética compartilhada com Tourette, ansiedade, depressão, anorexia"]}, {"t": "lance", "q": "Qual a herdabilidade estimada do TOC no estudo sueco?", "a": "Cerca de 47%."}, {"t": "h2", "v": "O circuito que não desliga"}, {"t": "ul", "v": ["O modelo mais aceito é o de disfunção dos circuitos <b>córtico-estriado-tálamo-corticais<\/b> (CETC, em inglês CSTC): alças paralelas que saem do córtex frontal, passam pelo estriado (caudado e putâmen), pelo globo pálido e pelo tálamo e voltam ao córtex.", "Áreas implicadas: <b>córtex orbitofrontal<\/b> (valor, consequência, \"isto é perigoso\"), <b>cíngulo anterior<\/b> (detecção de erro e conflito, \"algo está errado\"), <b>caudado<\/b> e <b>tálamo<\/b>.", "Dentro do circuito, duas vias se equilibram: a <b>via direta<\/b> (estriado → pálido interno; libera o tálamo, <b>excita<\/b> o córtex, mantém o comportamento) e a <b>via indireta<\/b> (passa pelo pálido externo e núcleo subtalâmico; <b>freia<\/b> o tálamo). A hipótese clássica é de <b>predomínio da via direta<\/b>: a alça \"fica ligada\" e o alarme não se encerra.", "<b>Neuroimagem funcional<\/b>: hiperatividade do orbitofrontal, do cíngulo anterior e do caudado em repouso, que aumenta com a provocação de sintomas.", "Essa hiperatividade <b>diminui com o tratamento que funciona<\/b>. No estudo clássico de Baxter e cols. (1992), o metabolismo de glicose do caudado direito caiu nos que responderam tanto à <b>fluoxetina<\/b> quanto à <b>terapia comportamental<\/b>, e não nos que não responderam.", "O mesmo circuito é alvo da neurocirurgia (capsulotomia, cingulotomia) e da estimulação cerebral profunda (bloco 8)."]}, {"t": "p", "v": "<span class=\"ps-src\">Fonte: <a href=\"https://doi.org/10.1001/archpsyc.1992.01820090009002\" target=\"_blank\" rel=\"noopener\">Baxter LR e cols. Arch Gen Psychiatry, 1992<\/a><\/span>"}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Modelos mais recentes falam em <b>múltiplas alças<\/b> (sensório-motora, cognitiva, afetiva) e incluem o córtex pré-frontal dorsolateral, a amígdala e o cerebelo. A visão de um único \"circuito do TOC\" é uma simplificação útil para a prova, não o estado final da ciência."}, {"t": "escreva", "id": "ps-neuro-w-o-circuito-cetc", "label": "O circuito CETC", "v": "", "li": ["Córtex <b>orbitofrontal<\/b> + <b>cíngulo anterior<\/b> + <b>caudado<\/b> + <b>tálamo<\/b>", "Hipótese: via <b>direta<\/b> predomina → alça não desliga", "Hiperatividade em repouso e na provocação", "Normaliza com ISRS <b>e<\/b> com terapia (Baxter, 1992)"]}, {"t": "lance", "q": "Que estudo mostrou a normalização do caudado com fluoxetina e com terapia?", "a": "Baxter e cols., 1992."}, {"t": "h2", "v": "Neurotransmissores: serotonina, dopamina e glutamato"}, {"t": "ul", "v": ["<b>Serotonina<\/b>: a principal evidência é <b>farmacológica<\/b>. Só os inibidores potentes da recaptação de serotonina (clomipramina e ISRS) funcionam no TOC; a <b>desipramina<\/b>, tricíclico noradrenérgico, <b>não funciona<\/b> (Leonard e cols., 1989, em crianças e adolescentes). A resposta exige dose alta e mais tempo que na depressão.", "A hipótese serotonérgica é <b>insuficiente<\/b>: cerca de metade dos pacientes não responde bem aos ISRS, e não há um \"déficit de serotonina\" medível no TOC.", "<b>Dopamina<\/b>: estimulantes podem induzir comportamentos repetitivos; o TOC relacionado a tique responde melhor ao reforço com antipsicóticos (antagonistas D2); o estriado é rico em receptores D1 e D2, e a genética de 2025 aponta para essas células.", "<b>Glutamato<\/b>: é o neurotransmissor das projeções córtico-estriatais e tálamo-corticais. Há achados de alterações glutamatérgicas no liquor e na espectroscopia, e genes relacionados (como o transportador <b>SLC1A1<\/b>) foram estudados. Isso motivou ensaios com memantina, N-acetilcisteína, topiramato e riluzol (bloco 8)."]}, {"t": "atual", "label": "Glutamato", "v": "Em metanálise de 2025 com 23 ensaios em TOC, os fármacos glutamatérgicos reduziram em média cerca de 4 pontos da Y-BOCS em relação ao placebo, com certeza moderada, mas com grande heterogeneidade e possível viés de publicação. É uma pista biológica promissora, ainda não um tratamento padrão.", "src": [["Coelho DRA e cols. JAMA Netw Open, 2025", "https://doi.org/10.1001/jamanetworkopen.2024.52963"]]}, {"t": "escreva", "id": "ps-neuro-w-neurotransmissores", "label": "Neurotransmissores", "v": "", "li": ["<b>Serotonina<\/b>: só IRS funcionam; desipramina não (Leonard, 1989)", "Hipótese serotonérgica insuficiente (metade responde mal)", "<b>Dopamina<\/b>: tiques, estimulantes, reforço com antipsicótico", "<b>Glutamato<\/b>: via córtico-estriatal; alvo de pesquisa"]}, {"t": "lance", "q": "Que tricíclico não funciona no TOC e por isso apoia a hipótese serotonérgica?", "a": "A desipramina."}, {"t": "h2", "v": "Os modelos cognitivo-comportamentais"}, {"t": "ul", "v": ["<b>Ponto de partida<\/b> (Rachman, Salkovskis): pensamentos intrusivos são normais; o TOC nasce da <b>interpretação<\/b> deles. Salkovskis (1985) pôs no centro a <b>responsabilidade inflada<\/b>: \"se eu pensei que pode acontecer e não fiz nada, a culpa será minha\".", "O <b>Obsessive Compulsive Cognitions Working Group<\/b> (OCCWG) descreveu seis domínios de crenças disfuncionais:"]}, {"t": "table", "head": ["Domínio", "Exemplo de crença"], "rows": [["<b>Responsabilidade inflada<\/b>", "\"Se alguém se machucar e eu podia ter evitado, a culpa é minha.\""], ["<b>Superestimação da ameaça<\/b>", "\"Se eu não lavar, vou pegar uma doença grave.\""], ["<b>Importância dos pensamentos<\/b>", "\"Ter um pensamento ruim é quase o mesmo que fazer.\""], ["<b>Necessidade de controlar os pensamentos<\/b>", "\"Eu deveria conseguir tirar isso da cabeça.\""], ["<b>Perfeccionismo<\/b>", "\"Se não estiver perfeito, está errado.\""], ["<b>Intolerância à incerteza<\/b>", "\"Preciso ter certeza absoluta de que a porta está trancada.\""]]}, {"t": "ul", "v": ["<b>Fusão pensamento-ação<\/b> (Rachman; Shafran e cols., 1996): acreditar que pensar em algo aumenta a chance de acontecer (fusão de probabilidade) ou que pensar é moralmente equivalente a fazer (fusão moral).", "<b>Supressão paradoxal<\/b>: tentar não pensar aumenta o pensamento (efeito \"urso branco\").", "<b>Neutralização<\/b>: o ritual impede a <b>desconfirmação<\/b> da crença. A pessoa atribui a ausência da catástrofe ao ritual, e não ao fato de que ela nunca aconteceria.", "Esses modelos explicam por que a <b>terapia cognitiva<\/b> (que trabalha as crenças) e a <b>EPR<\/b> (que permite a desconfirmação) funcionam."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> A fusão pensamento-ação é especialmente forte na escrupulosidade religiosa e nas obsessões de dano: \"pensar em machucar é tão grave quanto machucar\". Trabalhar essa crença é, muitas vezes, o que devolve à pessoa a paz para conviver com os próprios pensamentos."}, {"t": "escreva", "id": "ps-neuro-w-crencas-do-toc-occwg", "label": "Crenças do TOC (OCCWG)", "v": "", "li": ["Responsabilidade inflada", "Superestimação da ameaça", "Importância e necessidade de controlar os pensamentos", "Perfeccionismo e intolerância à incerteza", "<b>Fusão pensamento-ação<\/b>: pensar = aumentar chance / = fazer"]}, {"t": "lance", "q": "Qual crença Salkovskis pôs no centro do modelo cognitivo?", "a": "A responsabilidade inflada."}, {"t": "h2", "v": "Hábito, dúvida e a hipótese PANDAS/PANS"}, {"t": "ul", "v": ["<b>Hábito<\/b>: estudos experimentais mostram que pessoas com TOC tendem a ter um <b>desequilíbrio entre comportamento dirigido a objetivo e comportamento habitual<\/b>, com maior tendência a formar hábitos que persistem mesmo quando o resultado perdeu o valor (Gillan e cols., 2011). Nessa visão, a compulsão pode vir antes e a obsessão seria, em parte, uma explicação que a mente cria para o ato.", "<b>Dúvida e incompletude<\/b>: dificuldade de \"sentir\" que uma ação foi concluída (o sinal de \"pronto\" não chega), o que se liga ao cíngulo anterior e à sensação de \"não está certo\" descrita desde Janet.", "<b>PANDAS<\/b> (Swedo e cols., 1998): transtornos neuropsiquiátricos pediátricos autoimunes associados ao estreptococo. Início <b>abrupto<\/b> de TOC ou tiques na infância, com relação temporal com infecção por estreptococo do grupo A, curso em surtos e alterações neurológicas.", "<b>PANS<\/b> (2012): conceito ampliado, sem exigir o estreptococo: início súbito de TOC ou restrição alimentar grave, com outros sintomas neuropsiquiátricos.", "A ideia vem da <b>coreia de Sydenham<\/b>, em que anticorpos contra o estreptococo atacam os núcleos da base e sintomas obsessivo-compulsivos são comuns."]}, {"t": "div", "v": "PANDAS e PANS continuam <b>controversos<\/b>: a ligação causal com o estreptococo não foi firmemente demonstrada, e tratamentos como antibiótico profilático e imunoglobulina têm evidência limitada e conflitante. A conduta consolidada para uma criança com TOC é a mesma (TCC com EPR e, se necessário, ISRS); investigação e tratamento imunológico ficam para centros especializados e quadros típicos de início abrupto.", "src": [["Swedo SE e cols. Am J Psychiatry, 1998", "https://doi.org/10.1176/ajp.155.2.264"], ["Gillan CM e cols. Am J Psychiatry, 2011", "https://doi.org/10.1176/appi.ajp.2011.10071062"]]}, {"t": "escreva", "id": "ps-neuro-w-habito-e-pandas", "label": "Hábito e PANDAS", "v": "", "li": ["TOC: tendência a <b>hábito<\/b> &gt; ação dirigida a objetivo (Gillan, 2011)", "Sinal de \"pronto\" que não chega (incompletude)", "PANDAS: início abrupto, pré-púbere, estreptococo, surtos", "PANS: sem exigir estreptococo", "Evidência causal e terapêutica <b>limitada e debatida<\/b>"]}, {"t": "lance", "q": "Quais os quatro elementos de PANDAS?", "a": "Início abrupto, criança pré-púbere, relação com estreptococo e curso em surtos."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "O que o estudo populacional sueco de 2013 mostrou sobre a herdabilidade do TOC?", "a": "Herdabilidade de cerca de 47% (fatores genéticos aditivos), sem efeito significativo do ambiente compartilhado; o ambiente não compartilhado pesou pelo menos tanto quanto a genética."}, {"q": "Quais as estruturas do circuito córtico-estriado-tálamo-cortical implicadas no TOC?", "a": "Córtex orbitofrontal, cíngulo anterior, estriado (caudado), globo pálido e tálamo, com hipótese de predomínio da via direta sobre a indireta."}, {"q": "O que Baxter e colaboradores mostraram em 1992?", "a": "Que o metabolismo de glicose do caudado direito, aumentado no TOC, diminuiu nos pacientes que responderam tanto à fluoxetina quanto à terapia comportamental, e não nos que não responderam."}, {"q": "Qual a principal evidência a favor do papel da serotonina no TOC e qual sua limitação?", "a": "A resposta seletiva aos inibidores potentes da recaptação de serotonina (clomipramina e ISRS), e não à desipramina. A limitação é que cerca de metade responde mal e não há déficit de serotonina demonstrável, então a hipótese é insuficiente."}, {"q": "O que é fusão pensamento-ação?", "a": "A crença de que pensar em algo aumenta a probabilidade de acontecer (fusão de probabilidade) ou equivale moralmente a fazê-lo (fusão moral)."}, {"q": "Quais as características que definem PANDAS e qual o status dessa hipótese?", "a": "Início abrupto de TOC ou tiques em criança pré-púbere, relação temporal com infecção estreptocócica, curso em surtos e alterações neurológicas. É uma hipótese controversa, com evidência causal e terapêutica limitada."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Sobre a neurobiologia do TOC, assinale a alternativa correta.", "opts": ["A desipramina é tão eficaz quanto a clomipramina, o que demonstra o papel da noradrenalina.", "Estudos de neuroimagem mostram hiperatividade de córtex orbitofrontal, cíngulo anterior e caudado, que se reduz com tratamento eficaz farmacológico ou psicoterápico.", "O TOC é um transtorno monogênico com herança autossômica dominante.", "A herdabilidade do TOC é próxima de 100%, sem papel de fatores ambientais."], "ok": 1, "exp": "<b>B<\/b> é a correta: é o achado central do modelo CETC, e Baxter (1992) mostrou normalização do caudado tanto com fluoxetina quanto com terapia comportamental. <b>A<\/b> está errada: a desipramina não é eficaz, e essa diferença é justamente uma das bases da hipótese serotonérgica. <b>C<\/b> está errada: a herança é poligênica, com dezenas de loci e milhares de variantes de efeito pequeno. <b>D<\/b> está errada: a herdabilidade estimada é de cerca de 47%, e o ambiente não compartilhado pesa pelo menos tanto quanto. Revise: <b>circuito CETC e genética<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Paciente com TOC diz: \"Quando penso que meu pai pode sofrer um acidente, sinto que, se eu não rezar, vai acontecer mesmo, porque eu pensei\". Essa crença exemplifica:", "opts": ["Perfeccionismo.", "Fusão pensamento-ação do tipo probabilidade.", "Delírio de controle.", "Intolerância à frustração."], "ok": 1, "exp": "<b>B<\/b> é a correta: acreditar que pensar num evento aumenta a chance de ele acontecer é a fusão pensamento-ação de probabilidade (Rachman; Shafran, 1996), e a reza é a neutralização. <b>A<\/b> está errada: perfeccionismo é a crença de que tudo deve ser perfeito. <b>C<\/b> está errada: no delírio de controle a pessoa sente que forças externas controlam seus atos ou pensamentos; aqui ela reconhece o pensamento como seu. <b>D<\/b> não é um dos domínios do OCCWG; o domínio vizinho é intolerância à incerteza. Revise: <b>modelos cognitivos e crenças do OCCWG<\/b>."}]}, {"id": "ps-tcc", "title": "6. Tratamento I: princípios e a terapia com exposição", "sub": "Psicoeducação, escolha do tratamento pela gravidade, TCC com exposição e prevenção de resposta (EPR), terapia cognitiva, formatos e o que ainda é pesquisa · APA, NICE, WFSBP, Öst 2015 e Skapinakis 2016", "blocks": [{"t": "h2", "v": "O que dizem as diretrizes"}, {"t": "ul", "v": ["<b>Primeira linha<\/b>, nas três diretrizes de referência: <b>TCC com EPR<\/b> e/ou <b>ISRS<\/b> (APA, 2007; NICE CG31, 2005; WFSBP versão 3, 2022).", "A escolha depende da <b>gravidade<\/b>, da <b>preferência<\/b> do paciente, da <b>disponibilidade<\/b> de terapeuta treinado, das <b>comorbidades<\/b> e da resposta a tratamentos anteriores.", "O <b>NICE<\/b> organiza em <b>cuidado escalonado<\/b> para adultos:<ul class=\"sub\"><li><b>Prejuízo funcional leve<\/b>: TCC de baixa intensidade com EPR (até cerca de 10 horas de terapeuta, autoajuda guiada, grupo).<\/li><li><b>Prejuízo moderado<\/b>: ISRS <b>ou<\/b> TCC mais intensiva com EPR (mais de 10 horas).<\/li><li><b>Prejuízo grave<\/b>: <b>combinação<\/b> de ISRS com TCC com EPR.<\/li><\/ul>", "A <b>APA<\/b> recomenda TCC sozinha como primeira escolha para quem não está gravemente deprimido, quer e consegue fazê-la; ISRS sozinho quando a TCC não está disponível ou o paciente prefere; e combinação em quadros mais graves, com comorbidade ou resposta insatisfatória à monoterapia.", "A <b>WFSBP<\/b> (2022) mantém ISRS e TCC como primeira linha e registra que a <b>TCC pela internet<\/b> foi superior a controles ativos.", "<b>Crianças e adolescentes<\/b>: TCC com EPR, com a família, é a primeira escolha; ISRS entra quando o quadro é moderado a grave ou a TCC não basta (bloco 7)."]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://www.nice.org.uk/guidance/cg31\" target=\"_blank\" rel=\"noopener\">NICE CG31 (2005)<\/a> · <a href=\"https://psychiatryonline.org/pb/assets/raw/sitewide/practice_guidelines/guidelines/ocd.pdf\" target=\"_blank\" rel=\"noopener\">APA Practice Guideline (2007) e Guideline Watch (2013)<\/a> · <a href=\"https://doi.org/10.1080/15622975.2022.2086296\" target=\"_blank\" rel=\"noopener\">WFSBP v3, parte II (Bandelow e cols., 2022)<\/a><\/span>"}, {"t": "div", "v": "As diretrizes da APA (2007) e do NICE (2005) são antigas, mas continuam sendo as referências citadas; as recomendações centrais delas foram confirmadas pelas metanálises e pela diretriz da WFSBP (2022). Na prática, a dificuldade maior não é saber o que fazer, e sim conseguir um terapeuta treinado em EPR.", "src": [["Bandelow B e cols. World J Biol Psychiatry, 2022", "https://doi.org/10.1080/15622975.2022.2086296"]]}, {"t": "escreva", "id": "ps-tcc-w-escolha-inicial-nice-adultos", "label": "Escolha inicial (NICE, adultos)", "v": "", "li": ["Leve: TCC de baixa intensidade com EPR", "Moderado: ISRS <b>ou<\/b> TCC intensiva com EPR", "Grave: <b>ISRS + TCC com EPR<\/b>", "Criança: TCC com EPR + família; ISRS se moderado a grave"]}, {"t": "lance", "q": "Qual o tratamento inicial do TOC grave em adultos pelo NICE?", "a": "ISRS combinado com TCC com EPR."}, {"t": "h2", "v": "Psicoeducação: o primeiro tratamento"}, {"t": "ul", "v": ["Explicar o <b>ciclo<\/b> (gatilho, obsessão, ansiedade, compulsão, alívio) e por que a compulsão mantém o problema.", "Normalizar os <b>pensamentos intrusivos<\/b>: quase todo mundo os tem; o problema é a interpretação e a resposta.", "Separar a <b>pessoa<\/b> do <b>transtorno<\/b>: \"isso é o TOC falando\" ajuda a ganhar distância do pensamento.", "Explicar o racional da <b>EPR<\/b> antes de começar: a ansiedade sobe, atinge um pico e cai, e a crença catastrófica é testada.", "Incluir a <b>família<\/b> ou o parceiro: entender a acomodação e combinar como reduzi-la.", "Explicar o tempo de resposta dos remédios e o que esperar dos efeitos colaterais."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Livros de autoajuda baseados em TCC, usados com orientação de um profissional, fazem parte do cuidado de baixa intensidade do NICE. No Brasil, o manual de Aristides Cordioli (bloco 9) foi escrito justamente para pacientes e terapeutas."}, {"t": "escreva", "id": "ps-tcc-w-psicoeducacao", "label": "Psicoeducação", "v": "", "li": ["O ciclo e o papel da compulsão", "Intrusões são normais", "\"Isso é o TOC falando\"", "Racional da EPR antes de começar", "Família e parceiro incluídos"]}, {"t": "lance", "q": "Que frase ajuda o paciente a ganhar distância do pensamento?", "a": "\"Isso é o TOC falando, não é você.\""}, {"t": "h2", "v": "Exposição com prevenção de resposta (EPR)"}, {"t": "ul", "v": ["É o componente comportamental central da TCC para o TOC, descrito por <b>Victor Meyer<\/b> em 1966 e desenvolvido por <b>Edna Foa<\/b> e colaboradores.", "<b>Exposição<\/b>: entrar em contato, de forma <b>planejada e repetida<\/b>, com o que dispara a obsessão.<ul class=\"sub\"><li><b>Ao vivo<\/b> (in vivo): tocar a maçaneta, sair sem conferir o fogão, segurar a faca enquanto cozinha.<\/li><li><b>Imaginária<\/b>: escrever ou ouvir um roteiro com a consequência temida, quando ela não pode ser reproduzida na realidade (por exemplo, a dúvida de ter causado um acidente).<\/li><\/ul>", "<b>Prevenção de resposta<\/b>: <b>não fazer<\/b> o ritual, a neutralização mental, a evitação nem a busca de reasseguramento durante e depois da exposição.", "<b>Hierarquia<\/b>: lista de situações graduadas pela ansiedade esperada (escala SUDS de 0 a 100), começando nas moderadas e subindo.", "Formato típico de ensaios: cerca de <b>12 a 20 sessões<\/b>, uma ou duas por semana, com <b>tarefas de casa<\/b> diárias; no ensaio de Simpson (2013), 17 sessões duas vezes por semana.", "<b>Como funciona<\/b>:<ul class=\"sub\"><li>Modelo clássico: <b>habituação<\/b> (a ansiedade cai com a permanência na situação).<\/li><li>Modelo atual: <b>aprendizagem inibitória<\/b> (Craske e cols.): a pessoa aprende uma nova associação (\"tocar não é perigoso\", \"eu suporto a incerteza\") que compete com a antiga. A meta passa a ser <b>violar a expectativa<\/b> e <b>tolerar a incerteza<\/b>, e não só esperar a ansiedade baixar.<\/li><\/ul>"]}, {"t": "table", "head": ["Exemplo de hierarquia (contaminação)", "SUDS"], "rows": [["Tocar a maçaneta do próprio quarto", "30"], ["Tocar o corrimão da escada do prédio", "50"], ["Tocar a maçaneta do banheiro de casa e comer sem lavar", "70"], ["Usar um banheiro público e não lavar as mãos por 1 hora", "90"]]}, {"t": "escreva", "id": "ps-tcc-w-epr", "label": "EPR", "v": "", "li": ["<b>Exposição<\/b> ao vivo ou imaginária, planejada e repetida", "<b>Prevenção de resposta<\/b>: sem ritual, neutralização, evitação nem reasseguramento", "Hierarquia graduada (SUDS 0–100)", "12 a 20 sessões + tarefa de casa", "Mecanismo atual: <b>aprendizagem inibitória<\/b> e tolerância à incerteza"]}, {"t": "lance", "q": "Exposição sem prevenção de resposta funciona?", "a": "Não: o ritual depois da exposição cancela o aprendizado."}, {"t": "h2", "v": "Quanto funciona: a evidência"}, {"t": "ul", "v": ["Em metanálise de <b>37 ensaios<\/b> com Y-BOCS, a TCC teve efeito <b>muito grande<\/b> em relação à lista de espera (g = <b>1,31<\/b>) e a condições placebo (g = <b>1,33<\/b>); foi superior aos antidepressivos (g = 0,55); TCC individual e em grupo, e EPR e terapia cognitiva, não diferiram de forma significativa (Öst e cols., 2015).", "Na metanálise em rede de <b>54 ensaios<\/b> e 6.652 pacientes, terapia comportamental reduziu em média <b>14,5 pontos<\/b> da Y-BOCS em relação ao placebo; clomipramina, 4,7; ISRS (como classe), 3,5 (Skapinakis e cols., 2016).", "A própria metanálise em rede alerta: <b>80%<\/b> dos ensaios de psicoterapia permitiam antidepressivo estável, o que favorece a psicoterapia na comparação. A conclusão dos autores é que a <b>combinação<\/b> tende a ser a mais eficaz, pelo menos no TOC grave.", "<b>Abandono e recusa<\/b>: uma parte dos pacientes recusa ou abandona a EPR por medo da exposição; a aliança terapêutica e a graduação adequada reduzem isso."]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.1016/j.cpr.2015.06.003\" target=\"_blank\" rel=\"noopener\">Öst LG e cols. Clin Psychol Rev, 2015<\/a> · <a href=\"https://doi.org/10.1016/S2215-0366(16)30069-4\" target=\"_blank\" rel=\"noopener\">Skapinakis P e cols. Lancet Psychiatry, 2016<\/a><\/span>"}, {"t": "escreva", "id": "ps-tcc-w-evidencia-da-tcc", "label": "Evidência da TCC", "v": "", "li": ["Öst 2015: g ≈ 1,3 vs lista de espera e placebo; TCC &gt; antidepressivo", "Skapinakis 2016: terapia comportamental −14,5 pontos; clomipramina −4,7; ISRS −3,5", "Viés: 80% dos ensaios de terapia tinham pacientes medicados", "No grave: <b>combinação<\/b>"]}, {"t": "lance", "q": "Qual o tamanho de efeito da TCC contra lista de espera em Öst (2015)?", "a": "g ≈ 1,31 (muito grande)."}, {"t": "h2", "v": "Terapia cognitiva, formatos e o que é pesquisa"}, {"t": "ul", "v": ["<b>Terapia cognitiva<\/b>: trabalha as crenças do OCCWG (responsabilidade, ameaça, importância dos pensamentos, incerteza) com experimentos comportamentais. Na prática, é integrada à EPR na TCC.", "<b>Formatos com evidência<\/b>:<ul class=\"sub\"><li><b>Individual<\/b> ou <b>em grupo<\/b>.<\/li><li><b>TCC pela internet<\/b> guiada por terapeuta: superior a controles ativos (WFSBP, 2022); amplia o acesso.<\/li><li><b>Intensiva ou concentrada<\/b>: muitas horas em poucos dias. O <b>tratamento de 4 dias de Bergen<\/b> (Noruega), com exposição concentrada em grupo, tem resultados expressivos em estudos clínicos, inclusive em casos difíceis.<\/li><\/ul>", "<b>Família<\/b>: em crianças, a participação dos pais é parte do tratamento; em adultos, envolver o parceiro reduz a acomodação.", "<b>Terapia de aceitação e compromisso<\/b> (ACT) e intervenções baseadas em <b>mindfulness<\/b>: há ensaios favoráveis, mas evidência menor que a da EPR.", "<b>Psicanálise<\/b> e psicoterapias psicodinâmicas: <b>sem evidência<\/b> de eficácia no núcleo do TOC."]}, {"t": "atual", "label": "Formatos novos", "v": "O tratamento concentrado de Bergen e a TCC guiada pela internet ampliam o acesso e mostram bons resultados, mas ainda dependem de equipes treinadas e de mais estudos comparativos. A <b>D-cicloserina<\/b>, testada para acelerar o aprendizado da exposição, não potencializou a EPR concentrada em ensaio randomizado (Kvale e cols., 2020).", "src": [["Kvale G e cols. JAMA Netw Open, 2020", "https://doi.org/10.1001/jamanetworkopen.2020.13249"], ["Castle D e cols. Compr Psychiatry, 2022", "https://doi.org/10.1016/j.comppsych.2022.152357"]]}, {"t": "escreva", "id": "ps-tcc-w-formatos", "label": "Formatos", "v": "", "li": ["TC integrada à EPR", "Individual, grupo, <b>internet guiada<\/b>, intensiva (Bergen 4 dias)", "Família/parceiro: reduzir acomodação", "ACT e mindfulness: evidência menor", "Psicanálise: sem evidência no TOC"]}, {"t": "lance", "q": "Que formato de TCC a WFSBP registrou como superior a controles ativos?", "a": "A TCC pela internet."}, {"t": "h2", "v": "Casos clínicos"}, {"t": "case", "title": "A hierarquia que travou", "body": ["Paciente de 24 anos com TOC de contaminação está na 6ª sessão de EPR. Faz as exposições no consultório, mas em casa toma um banho longo \"só para tirar a sensação\" depois de cada tarefa. A Y-BOCS não caiu."], "ask": "Por que o tratamento não está funcionando e o que ajustar?", "reveal": ["O banho depois da exposição é uma <b>compulsão<\/b>: ele neutraliza a ansiedade e impede a aprendizagem de que a contaminação temida não traz a catástrofe e de que a sensação passa sozinha.", "Ajuste: tornar a prevenção de resposta explícita e combinada (sem banho extra, sem lavagem compensatória), incluir o banho na hierarquia (banhos com tempo limitado), revisar outras neutralizações sutis (lenço, álcool em gel) e envolver a família para não acomodar."]}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Como o NICE escalona o tratamento inicial do TOC em adultos pela gravidade?", "a": "Prejuízo leve: TCC de baixa intensidade com EPR. Moderado: ISRS ou TCC mais intensiva com EPR. Grave: combinação de ISRS com TCC com EPR."}, {"q": "Quais os dois componentes da EPR e por que os dois são necessários?", "a": "Exposição planejada e repetida ao gatilho, e prevenção da resposta (não fazer ritual, neutralização, evitação nem reasseguramento). Sem a prevenção, o ritual alivia e impede a aprendizagem de que a catástrofe não acontece e de que a ansiedade cai sozinha."}, {"q": "Qual a diferença entre o modelo de habituação e o de aprendizagem inibitória na exposição?", "a": "Na habituação, o objetivo é a ansiedade cair durante a exposição. Na aprendizagem inibitória, o objetivo é aprender uma nova associação que compete com o medo, violando a expectativa catastrófica e tolerando a incerteza, mesmo que a ansiedade não caia muito na sessão."}, {"q": "O que a metanálise de Öst (2015) mostrou sobre a TCC no TOC?", "a": "Efeito muito grande contra lista de espera (g ≈ 1,31) e placebo (g ≈ 1,33), superioridade em relação aos antidepressivos (g ≈ 0,55) e ausência de diferença significativa entre formato individual e em grupo e entre EPR e terapia cognitiva."}, {"q": "Qual a principal limitação na comparação entre psicoterapia e medicação na metanálise em rede de Skapinakis (2016)?", "a": "A maioria dos ensaios de psicoterapia (80%) incluía pacientes já em uso estável de antidepressivo, o que favorece a psicoterapia na comparação com o placebo de comprimido."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Mulher de 30 anos com TOC de verificação, Y-BOCS de 14, sem depressão, motivada para terapia, com acesso a terapeuta treinado. Segundo as diretrizes, a melhor conduta inicial é:", "opts": ["TCC com exposição e prevenção de resposta.", "Clomipramina em dose plena.", "Risperidona associada a ISRS.", "Psicoterapia psicodinâmica de longo prazo."], "ok": 0, "exp": "<b>A<\/b> é a correta: TOC leve, sem depressão importante, com preferência e acesso: TCC com EPR é a primeira escolha (APA; NICE recomenda baixa intensidade no leve). <b>B<\/b> está errada: a clomipramina é segunda linha pela tolerabilidade e não é escolha inicial num quadro leve. <b>C<\/b> está errada: antipsicótico é reforço para resistência, nunca início. <b>D<\/b> está errada: psicoterapia psicodinâmica não tem evidência de eficácia no TOC. Revise: <b>escolha inicial pela gravidade<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Durante a EPR, um paciente com obsessões de ter atropelado alguém pede ao terapeuta: \"me diz só uma vez que eu não atropelei ninguém, aí eu consigo continuar\". A resposta mais adequada do terapeuta, de acordo com o modelo da EPR, é:", "opts": ["Garantir que ele não atropelou ninguém, para reduzir a ansiedade e manter a aliança.", "Acolher a angústia sem dar o reasseguramento, lembrando que ele é uma compulsão e que o objetivo é tolerar a incerteza.", "Interromper a sessão e prescrever benzodiazepínico.", "Pedir que ele refaça o trajeto para confirmar e então seguir a exposição."], "ok": 1, "exp": "<b>B<\/b> é a correta: o reasseguramento funciona como compulsão; dá-lo cancela a prevenção de resposta. O terapeuta valida o sofrimento e mantém o foco na tolerância à incerteza. <b>A<\/b> parece gentil, mas alimenta o ciclo. <b>C<\/b> está errada: benzodiazepínico durante a exposição atrapalha a aprendizagem e não trata o TOC. <b>D<\/b> é a própria compulsão de verificação. Revise: <b>prevenção de resposta e reasseguramento<\/b>."}]}, {"id": "ps-farmaco", "title": "7. Tratamento II: os inibidores da recaptação de serotonina", "sub": "ISRS e clomipramina, doses, tempo de teste, efeitos adversos, manutenção, retirada, gestação, amamentação e infância · APA 2007, Bloch 2010, Skapinakis 2016, POTS 2004", "blocks": [{"t": "h2", "v": "Quais medicamentos funcionam"}, {"t": "ul", "v": ["Só os <b>inibidores potentes da recaptação de serotonina<\/b> (IRS) têm eficácia demonstrada como monoterapia no TOC:<ul class=\"sub\"><li><b>ISRS<\/b>: fluoxetina, fluvoxamina, sertralina, paroxetina, citalopram e escitalopram.<\/li><li><b>Clomipramina<\/b>: o tricíclico mais serotonérgico, primeiro remédio com eficácia comprovada no TOC.<\/li><\/ul>", "Nos EUA, a FDA aprovou para TOC a <b>clomipramina, fluoxetina, fluvoxamina, paroxetina e sertralina<\/b>; citalopram e escitalopram são usados com base em ensaios e diretrizes.", "Os ISRS são <b>equivalentes em eficácia<\/b> entre si; a escolha é feita pelo perfil de efeitos adversos, interações, comorbidades, história de resposta e custo.", "A <b>clomipramina não foi superior aos ISRS<\/b> na metanálise em rede (diferença de −1,2 ponto, sem significância) e é <b>menos tolerada<\/b>; por isso é, em geral, <b>segunda linha<\/b> (Skapinakis, 2016).", "<b>Não funcionam<\/b> como monoterapia: outros antidepressivos sem ação serotonérgica potente (desipramina, bupropiona), <b>benzodiazepínicos<\/b> (aliviam a ansiedade, não as obsessões) e antipsicóticos sozinhos."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> No SUS, a <b>fluoxetina<\/b> e a <b>clomipramina<\/b> estão na Relação Nacional de Medicamentos Essenciais (RENAME), o que faz delas as opções mais acessíveis na rede pública. Confira sempre a lista vigente do seu município."}, {"t": "escreva", "id": "ps-farmaco-w-o-que-funciona", "label": "O que funciona", "v": "", "li": ["<b>ISRS<\/b> (todos equivalentes): fluoxetina, fluvoxamina, sertralina, paroxetina, citalopram, escitalopram", "<b>Clomipramina<\/b>: não superior aos ISRS e menos tolerada → 2ª linha", "Não funcionam sozinhos: desipramina, bupropiona, benzodiazepínico, antipsicótico"]}, {"t": "lance", "q": "Por que a clomipramina é segunda linha?", "a": "Não é superior aos ISRS e é menos tolerada."}, {"t": "h2", "v": "Doses: mais altas que na depressão"}, {"t": "ul", "v": ["Uma metanálise de ensaios com doses fixas mostrou que <b>doses mais altas de ISRS são mais eficazes<\/b> no TOC do que doses baixas ou médias, à custa de mais abandonos por efeitos adversos. Esse padrão de dose-resposta <b>não se vê na depressão<\/b> (Bloch e cols., 2010)."]}, {"t": "table", "head": ["Fármaco", "Dose inicial (mg/dia)", "Alvo usual no TOC (mg/dia)", "Máxima habitual (mg/dia)"], "rows": [["Fluoxetina", "20", "40 a 60", "80"], ["Fluvoxamina", "50", "200", "300"], ["Sertralina", "50", "200", "200"], ["Paroxetina", "20", "40 a 60", "60"], ["Citalopram", "20", "40 a 60 (APA)", "ver caixa abaixo"], ["Escitalopram", "10", "20", "20 (bula); acima, uso off-label"], ["Clomipramina", "25", "100 a 250", "250"]]}, {"t": "ul", "v": ["Doses de acordo com a diretriz da APA (2007). A APA cita doses acima da bula em casos selecionados, com monitorização; isso é decisão de especialista.", "Começar baixo, subir a cada 1 a 2 semanas conforme tolerância, até o alvo; em idosos e com comorbidades clínicas, subir mais devagar."]}, {"t": "div", "v": "<b>Citalopram e QT<\/b>: a APA (2007) cita alvo de 40 a 60 mg e uso ocasional de doses maiores. Em 2011, a <b>FDA<\/b> limitou o citalopram a <b>40 mg/dia<\/b> (20 mg/dia acima de 60 anos e em metabolizadores lentos do CYP2C19) pelo prolongamento dose-dependente do intervalo QT. Na prática atual, prefira outro ISRS quando precisar de dose alta, e faça ECG se usar acima do limite.", "src": [["FDA · comunicado de segurança sobre citalopram (2011/2012)", "https://www.fda.gov/drugs/drug-safety-and-availability/fda-drug-safety-communication-revised-recommendations-celexa-citalopram-hydrobromide-related-potential"], ["Bloch MH e cols. Mol Psychiatry, 2010", "https://doi.org/10.1038/mp.2009.50"]]}, {"t": "escreva", "id": "ps-farmaco-w-doses-no-toc", "label": "Doses no TOC", "v": "", "li": ["Dose-resposta: <b>dose alta = mais eficácia<\/b> (Bloch, 2010)", "Fluoxetina 40–60 (até 80); fluvoxamina 200 (até 300); sertralina 200", "Paroxetina 40–60; escitalopram 20; clomipramina 100–250", "Citalopram: FDA limita a 40 mg (QT)"]}, {"t": "lance", "q": "Qual a dose-alvo usual da fluoxetina no TOC?", "a": "40 a 60 mg/dia (até 80)."}, {"t": "h2", "v": "Tempo: o teste adequado e a manutenção"}, {"t": "ul", "v": ["O efeito começa a aparecer em <b>4 a 6 semanas<\/b> e pode continuar aumentando até <b>10 a 12 semanas<\/b> ou mais.", "<b>Teste adequado<\/b> (APA): <b>8 a 12 semanas<\/b>, com pelo menos <b>4 a 6 semanas na dose máxima tolerada<\/b>. Só depois disso se fala em falha.", "A resposta típica é <b>parcial<\/b>: em média, a Y-BOCS cai cerca de 20 a 40%; poucos pacientes zeram os sintomas só com o remédio.", "<b>Manutenção<\/b>: depois da resposta, manter por <b>1 a 2 anos<\/b> (APA); o NICE recomenda pelo menos <b>12 meses após a remissão<\/b>. A retirada precoce aumenta o risco de recaída, e manter a dose que funcionou é o padrão.", "<b>Retirada<\/b>: lenta e gradual, por exemplo, reduzir 10 a 25% da dose a cada 1 a 2 meses, observando recaída e sintomas de descontinuação (APA). Ter feito EPR protege contra recaída na retirada."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Sintomas de descontinuação (tontura, \"choques\", irritabilidade, insônia, sintomas gripais) são mais intensos com fármacos de meia-vida curta, como <b>paroxetina<\/b> e venlafaxina, e mínimos com a fluoxetina. O material deste projeto sobre a descontinuação da venlafaxina explica a lógica de redução em degraus cada vez menores, que vale para os ISRS."}, {"t": "escreva", "id": "ps-farmaco-w-tempo", "label": "Tempo", "v": "", "li": ["Início do efeito: 4–6 semanas", "Teste adequado: <b>8–12 semanas<\/b>, sendo <b>4–6 na dose máxima tolerada<\/b>", "Resposta costuma ser parcial (Y-BOCS −20 a 40%)", "Manter <b>1–2 anos<\/b> (APA); ≥ 12 meses após remissão (NICE)", "Retirar devagar: −10 a 25% a cada 1–2 meses"]}, {"t": "lance", "q": "O que é um teste adequado com ISRS no TOC?", "a": "8 a 12 semanas, com 4 a 6 na dose máxima tolerada."}, {"t": "h2", "v": "Efeitos adversos e segurança"}, {"t": "ul", "v": ["<b>ISRS<\/b> (efeitos de classe): náusea e sintomas gastrointestinais (no início), cefaleia, insônia ou sonolência, inquietação inicial, <b>disfunção sexual<\/b> (frequente e muitas vezes não perguntada), ganho de peso a longo prazo (mais com paroxetina), sudorese.", "<b>Riscos<\/b> a lembrar:<ul class=\"sub\"><li><b>Hiponatremia<\/b> (SIADH), sobretudo em idosos e com diuréticos.<\/li><li><b>Sangramento<\/b>, sobretudo associado a AINE, antiagregante ou anticoagulante.<\/li><li><b>Síndrome serotoninérgica<\/b> em associações (tramadol, triptanos em excesso, linezolida, IMAO): tremor, clônus, hiperreflexia, hipertermia, agitação.<\/li><li><b>Virada maníaca<\/b> em pessoas com bipolaridade.<\/li><li><b>QT<\/b>: citalopram e escitalopram, dose-dependente.<\/li><li><b>Interações<\/b>: fluvoxamina inibe fortemente o CYP1A2 (aumenta clozapina, teofilina, cafeína e a própria clomipramina); fluoxetina e paroxetina inibem o CYP2D6.<\/li><\/ul>", "<b>Suicidalidade em jovens<\/b>: a FDA mantém alerta em tarja preta para aumento de pensamentos e comportamentos suicidas com antidepressivos em <b>crianças, adolescentes e adultos jovens até 24 anos<\/b>, sobretudo no início do tratamento e nas mudanças de dose. O alerta pede <b>monitorização próxima<\/b>, não deixar de tratar.", "<b>Clomipramina<\/b>: efeitos anticolinérgicos (boca seca, constipação, retenção urinária, visão turva), sedação, hipotensão ortostática, ganho de peso, disfunção sexual, <b>redução do limiar convulsivo<\/b> (risco aumenta acima de 250 mg/dia), <b>alterações de condução cardíaca<\/b> e <b>alta letalidade em superdose<\/b>. Pedir ECG antes em quem tem mais de 40 anos ou doença cardíaca."]}, {"t": "escreva", "id": "ps-farmaco-w-seguranca", "label": "Segurança", "v": "", "li": ["ISRS: GI, disfunção sexual, insônia, hiponatremia, sangramento, síndrome serotoninérgica, mania", "Citalopram/escitalopram: QT", "Fluvoxamina: inibe CYP1A2 (aumenta clomipramina, clozapina)", "Tarja preta: suicidalidade até 24 anos → monitorar", "Clomipramina: anticolinérgico, convulsão &gt; 250 mg, cardiotoxicidade, letal em superdose"]}, {"t": "lance", "q": "Qual o limite de dose do citalopram pela FDA acima de 60 anos?", "a": "20 mg/dia."}, {"t": "h2", "v": "Crianças, gestação e amamentação"}, {"t": "ul", "v": ["<b>Crianças e adolescentes<\/b>:<ul class=\"sub\"><li>Primeira escolha: <b>TCC com EPR<\/b>, com os pais.<\/li><li>No ensaio <b>POTS<\/b> (112 pacientes de 7 a 17 anos, 12 semanas), as taxas de remissão foram de <b>53,6%<\/b> com a combinação TCC + sertralina, <b>39,3%<\/b> com TCC, <b>21,4%<\/b> com sertralina e <b>3,6%<\/b> com placebo. A combinação foi superior a cada um isolado na redução da CY-BOCS, e a TCC sozinha não diferiu da combinação em remissão.<\/li><li>Aprovações da FDA em pediatria: <b>sertralina<\/b> a partir de 6 anos, <b>fluoxetina<\/b> a partir de 7, <b>fluvoxamina<\/b> a partir de 8 e <b>clomipramina<\/b> a partir de 10.<\/li><\/ul>", "<b>Gestação<\/b>:<ul class=\"sub\"><li>O TOC costuma começar ou piorar na gestação e no pós-parto; TOC grave sem tratamento também tem riscos (sofrimento, depressão, prejuízo do vínculo e do autocuidado).<\/li><li>A <b>EPR<\/b> é a primeira escolha quando possível.<\/li><li>Se o ISRS for necessário ou já estiver funcionando, a decisão é <b>individual<\/b>, pesando riscos de tratar e de não tratar; a <b>sertralina<\/b> é das mais usadas e estudadas. A <b>paroxetina<\/b> costuma ser evitada no primeiro trimestre (sinal de malformação cardíaca em alguns estudos). Recém-nascidos expostos no fim da gestação podem ter sintomas adaptativos transitórios.<\/li><\/ul>", "<b>Amamentação<\/b>: <b>sertralina<\/b> e paroxetina passam pouco para o leite e são consideradas compatíveis; a fluoxetina tem meia-vida longa e pode acumular no lactente."]}, {"t": "p", "v": "<span class=\"ps-src\">Fonte: <a href=\"https://doi.org/10.1001/jama.292.16.1969\" target=\"_blank\" rel=\"noopener\">Pediatric OCD Treatment Study (POTS) Team. JAMA, 2004<\/a><\/span>"}, {"t": "escreva", "id": "ps-farmaco-w-populacoes-especiais", "label": "Populações especiais", "v": "", "li": ["Criança: TCC + EPR com a família; POTS: combinado 54%, TCC 39%, sertralina 21%, placebo 4% de remissão", "FDA: sertralina ≥ 6, fluoxetina ≥ 7, fluvoxamina ≥ 8, clomipramina ≥ 10 anos", "Gestação: EPR primeiro; ISRS decisão individual (sertralina); evitar paroxetina no 1º tri", "Amamentação: sertralina compatível"]}, {"t": "lance", "q": "Qual braço teve maior remissão no POTS?", "a": "A combinação TCC + sertralina (53,6%)."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Quais classes de medicamentos têm eficácia como monoterapia no TOC?", "a": "Apenas os inibidores potentes da recaptação de serotonina: os ISRS (fluoxetina, fluvoxamina, sertralina, paroxetina, citalopram, escitalopram) e a clomipramina."}, {"q": "Por que a clomipramina costuma ser segunda linha se foi o primeiro fármaco eficaz no TOC?", "a": "Porque não foi superior aos ISRS em eficácia e é menos tolerada (anticolinérgico, sedação, ganho de peso, risco de convulsão e cardiotoxicidade, letal em superdose)."}, {"q": "O que define um teste adequado com ISRS no TOC?", "a": "Uso por 8 a 12 semanas, com pelo menos 4 a 6 semanas na dose máxima tolerada."}, {"q": "O que a metanálise de Bloch (2010) mostrou sobre a dose dos ISRS no TOC?", "a": "Doses mais altas foram mais eficazes que doses baixas ou médias, com mais abandono por efeitos adversos, um padrão de dose-resposta diferente do da depressão."}, {"q": "Por quanto tempo manter o ISRS após a resposta e como retirar?", "a": "Manter por 1 a 2 anos (APA), ou pelo menos 12 meses após a remissão (NICE). Retirar devagar, reduzindo 10 a 25% da dose a cada 1 a 2 meses, monitorando recaída."}, {"q": "Quais foram as taxas de remissão do POTS?", "a": "Combinação TCC + sertralina 53,6%; TCC 39,3%; sertralina 21,4%; placebo 3,6%."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Homem de 32 anos com TOC moderado iniciou fluoxetina 20 mg/dia há 5 semanas, com boa tolerância e melhora discreta. A conduta mais adequada é:", "opts": ["Trocar para clomipramina, porque o ISRS falhou.", "Aumentar progressivamente a fluoxetina até 40 a 60 mg/dia e reavaliar após completar um teste adequado.", "Associar risperidona, porque a resposta foi insuficiente.", "Associar clonazepam e manter a dose atual."], "ok": 1, "exp": "<b>B<\/b> é a correta: o teste ainda não foi adequado em dose nem em tempo. No TOC, a dose-alvo é mais alta (fluoxetina 40 a 60 mg) e o teste dura 8 a 12 semanas, com 4 a 6 na dose máxima tolerada. <b>A<\/b> declara falha precocemente. <b>C<\/b> antecipa o reforço, que só se indica após pelo menos um teste adequado (e a meta-análise de Bloch sugere 3 meses de IRS em dose máxima). <b>D<\/b> está errada: benzodiazepínico não trata obsessões e pode atrapalhar a EPR. Revise: <b>dose e tempo de teste no TOC<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Paciente de 70 anos com TOC precisa de ISRS em dose alta. Sobre o citalopram, assinale a correta.", "opts": ["Pode ser usado em qualquer dose, pois não tem efeito cardíaco.", "A FDA limita a dose a 20 mg/dia acima de 60 anos pelo risco de prolongamento do QT, por isso outro ISRS é preferível quando se precisa de dose alta.", "É o único ISRS aprovado para TOC em idosos.", "Deve ser associado à fluvoxamina para potencializar o efeito."], "ok": 1, "exp": "<b>B<\/b> é a correta: o prolongamento do QT do citalopram é dose-dependente, e a FDA recomenda até 40 mg/dia, e 20 mg/dia acima de 60 anos. Em idoso que precisa de dose alta, prefira, por exemplo, sertralina. <b>A<\/b> nega um risco documentado. <b>C<\/b> está errada: o citalopram nem tem aprovação da FDA para TOC. <b>D<\/b> combina dois ISRS sem racional e aumenta o risco de síndrome serotoninérgica; a fluvoxamina ainda inibe o metabolismo de vários fármacos. Revise: <b>segurança dos ISRS e divergência APA × FDA<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Adolescente de 13 anos com TOC moderado a grave. Com base no PO
