TS e nas diretrizes, a melhor conduta inicial é:", "opts": ["Sertralina isolada, porque foi o braço com maior taxa de remissão.", "TCC com EPR com participação da família, associada a ISRS (por exemplo, sertralina) pela gravidade, com monitorização de suicidalidade.", "Psicoterapia de apoio isolada até os 18 anos, já que ISRS é contraindicado na adolescência.", "Clomipramina como primeira escolha, por ser a mais estudada em crianças."], "ok": 1, "exp": "<b>B<\/b> é a correta: no POTS a combinação teve a maior remissão (53,6%) e é a recomendação para quadros moderados a graves; ISRS em jovens exige monitorização pela tarja preta. <b>A<\/b> está errada: a sertralina isolada teve a menor remissão entre os ativos (21,4%). <b>C<\/b> está errada: ISRS não é contraindicado (sertralina aprovada desde os 6 anos), e terapia de apoio não substitui EPR. <b>D<\/b> está errada: clomipramina é segunda linha pela tolerabilidade. Revise: <b>TOC na infância e POTS<\/b>."}]}, {"id": "ps-resist", "title": "8. Quando não responde: TOC resistente", "sub": "Definição, checagem do \"falso resistente\", troca, reforço com EPR ou antipsicótico, glutamatérgicos, neuromodulação (EMT profunda, ECP), neurocirurgia e o que é emergente · Bloch 2006, Simpson 2013, Carmi 2019, Alonso 2015, Lopes 2014", "blocks": [{"t": "h2", "v": "O que é resistência e o \"falso resistente\""}, {"t": "ul", "v": ["<b>TOC resistente<\/b> (definição mais usada): resposta insuficiente a pelo menos <b>dois testes adequados<\/b> com IRS (dose e tempo) e, idealmente, a um curso adequado de <b>TCC com EPR<\/b>.", "<b>TOC refratário<\/b>: falha de múltiplas estratégias, incluindo clomipramina e reforços.", "Antes de rotular, conferir o \"<b>falso resistente<\/b>\":<ul class=\"sub\"><li><b>Dose e tempo<\/b> adequados? (8 a 12 semanas, com 4 a 6 na dose máxima tolerada.)<\/li><li><b>Adesão<\/b>? Muitos pacientes tomam de forma irregular por efeitos adversos.<\/li><li>A <b>EPR<\/b> foi feita com prevenção de resposta de verdade, ou foi terapia de apoio?<\/li><li><b>Diagnóstico<\/b> certo? (TPOC, acumulação, TEA, psicose, causa orgânica.)<\/li><li><b>Comorbidades<\/b> não tratadas? (Depressão grave, uso de álcool e drogas, bipolaridade, tiques.)<\/li><li><b>Acomodação familiar<\/b> intensa mantendo o ciclo?<\/li><li>Interação que reduz o nível do fármaco (indutores enzimáticos, tabagismo com fluvoxamina e clomipramina)?<\/li><\/ul>"]}, {"t": "escreva", "id": "ps-resist-w-antes-de-dizer-resistente", "label": "Antes de dizer \"resistente\"", "v": "", "li": ["≥ 2 testes adequados com IRS + EPR adequada", "Conferir dose, tempo e <b>adesão<\/b>", "EPR foi EPR mesmo?", "Diagnóstico e comorbidades", "Acomodação familiar"]}, {"t": "lance", "q": "O que conferir antes de chamar de resistente?", "a": "Dose, tempo, adesão, EPR de verdade, diagnóstico, comorbidades e acomodação."}, {"t": "h2", "v": "O algoritmo depois de um IRS que não bastou"}, {"t": "ul", "v": ["<b>1. Otimizar<\/b>: subir até a dose máxima tolerada e completar o tempo. Na metanálise de Bloch (2006), um quarto dos pacientes ainda respondeu só continuando o IRS em dose máxima, o que sustenta esperar <b>pelo menos 3 meses<\/b> antes de reforçar com antipsicótico.", "<b>2. Acrescentar ou intensificar a EPR<\/b>: é o reforço com melhor evidência.", "<b>3. Trocar de IRS<\/b>: outro ISRS ou a <b>clomipramina<\/b> (depois de 1 ou 2 ISRS).", "<b>4. Reforçar com antipsicótico<\/b> em dose baixa (risperidona, aripiprazol; haloperidol se tiques).", "<b>5. Outras estratégias<\/b> em serviço especializado: doses acima da bula com monitorização, clomipramina intravenosa, combinações, glutamatérgicos, neuromodulação.", "<b>6. Neurocirurgia<\/b> (estimulação cerebral profunda ou cirurgia ablativa) só para TOC grave, crônico e refratário, em centros especializados."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Associar <b>clomipramina a um ISRS<\/b> (em geral fluvoxamina ou outro) é uma estratégia usada por especialistas, mas exige dosagem sérica e ECG: a fluvoxamina eleva muito o nível da clomipramina pela inibição do CYP1A2."}, {"t": "escreva", "id": "ps-resist-w-algoritmo", "label": "Algoritmo", "v": "", "li": ["1. Otimizar dose e tempo (≥ 3 meses na dose máxima)", "2. Acrescentar/intensificar <b>EPR<\/b>", "3. Trocar IRS (outro ISRS → clomipramina)", "4. Reforço com antipsicótico em dose baixa", "5. Especializado: doses altas, IV, combinações, glutamatérgicos, neuromodulação", "6. Neurocirurgia em refratário grave"]}, {"t": "lance", "q": "Quanto tempo de IRS em dose máxima antes de reforçar com antipsicótico?", "a": "Pelo menos 3 meses."}, {"t": "h2", "v": "Reforço: EPR ou antipsicótico?"}, {"t": "ul", "v": ["<b>Antipsicóticos como reforço<\/b> do IRS (metanálise de Bloch, 2006, 9 ensaios, 278 pacientes): diferença absoluta de risco de <b>0,22<\/b> a favor do reforço; cerca de <b>um terço<\/b> dos pacientes resistentes responde. Benefício <b>maior em quem tem tiques<\/b> (diferença de 0,43).", "Evidência mais consistente para <b>risperidona<\/b> (dose baixa, em geral 0,5 a 3 mg/dia) e <b>haloperidol<\/b> (sobretudo com tiques); o <b>aripiprazol<\/b> tem ensaios favoráveis; quetiapina e olanzapina, evidência inconclusiva.", "Riscos: ganho de peso, síndrome metabólica, sintomas extrapiramidais, hiperprolactinemia. Se não houver resposta em <b>4 a 8 semanas<\/b>, retirar.", "<b>EPR contra risperidona<\/b> (Simpson e cols., 2013): 100 adultos com TOC moderado ou pior apesar de IRS em dose terapêutica por 12 semanas, randomizados para acrescentar EPR (17 sessões), risperidona (até 4 mg) ou placebo, por 8 semanas.<ul class=\"sub\"><li>Resposta (queda ≥ 25% da Y-BOCS): <b>80%<\/b> com EPR, <b>23%<\/b> com risperidona, <b>15%<\/b> com placebo.<\/li><li>Sintomas mínimos (Y-BOCS ≤ 12): <b>43%<\/b> com EPR, 13% com risperidona, 5% com placebo.<\/li><li>A risperidona <b>não diferiu do placebo<\/b>.<\/li><li>Conclusão dos autores: oferecer <b>EPR antes de antipsicótico<\/b> a quem continua sintomático com IRS.<\/li><\/ul>"]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.1038/sj.mp.4001823\" target=\"_blank\" rel=\"noopener\">Bloch MH e cols. Mol Psychiatry, 2006<\/a> · <a href=\"https://doi.org/10.1001/jamapsychiatry.2013.1932\" target=\"_blank\" rel=\"noopener\">Simpson HB e cols. JAMA Psychiatry, 2013<\/a><\/span>"}, {"t": "escreva", "id": "ps-resist-w-reforco", "label": "Reforço", "v": "", "li": ["<b>EPR<\/b> &gt; risperidona &gt; placebo (Simpson 2013: 80% × 23% × 15% de resposta)", "Antipsicótico: 1/3 responde (Bloch 2006); melhor com <b>tiques<\/b>", "Risperidona, haloperidol (tiques), aripiprazol; dose baixa", "Sem resposta em 4–8 semanas: retirar"]}, {"t": "lance", "q": "Qual reforço foi superior no ensaio de Simpson (2013)?", "a": "A EPR (80% de resposta × 23% com risperidona)."}, {"t": "h2", "v": "Glutamatérgicos e outras pistas"}, {"t": "ul", "v": ["O papel do glutamato nas alças córtico-estriatais motivou ensaios de reforço com <b>memantina<\/b>, <b>N-acetilcisteína<\/b>, <b>topiramato<\/b>, <b>lamotrigina<\/b> e <b>riluzol<\/b>.", "O conjunto é sugestivo, mas heterogêneo: estudos pequenos, populações e doses diferentes, risco de viés de publicação."]}, {"t": "atual", "label": "Glutamatérgicos", "v": "Metanálise de 2025 (JAMA Network Open) com 23 ensaios em TOC: redução média de cerca de <b>4 pontos<\/b> na Y-BOCS frente ao placebo, com certeza moderada e alta heterogeneidade. Metanálise de 2026 sobre a <b>memantina<\/b>: não sustenta uso de rotina; no TOC resistente, há um sinal que pode justificar discussão cuidadosa fora de bula quando os reforços estabelecidos não servem. A N-acetilcisteína tem resultados inconsistentes.", "src": [["Coelho DRA e cols. JAMA Netw Open, 2025", "https://doi.org/10.1001/jamanetworkopen.2024.52963"], ["Lyndon e cols. CNS Drugs, 2026", "https://doi.org/10.1007/s40263-026-01318-4"], ["Eghdami e cols. Front Psychiatry, 2024", "https://doi.org/10.3389/fpsyt.2024.1421150"]]}, {"t": "ul", "v": ["Outras pistas em estudo: <b>ondansetrona<\/b> (antagonista 5-HT3), anti-inflamatórios (celecoxibe), <b>cetamina<\/b> (efeito rápido e curto em estudos pequenos)."]}, {"t": "escreva", "id": "ps-resist-w-glutamatergicos", "label": "Glutamatérgicos", "v": "", "li": ["Memantina, N-acetilcisteína, topiramato, lamotrigina, riluzol", "Metanálise 2025: ≈ −4 pontos de Y-BOCS, certeza moderada, heterogêneo", "Memantina: não é rotina; talvez no resistente", "Status: <b>emergente<\/b>"]}, {"t": "lance", "q": "Qual o status dos glutamatérgicos no TOC?", "a": "Evidência emergente: sinal moderado, heterogêneo, não é rotina."}, {"t": "h2", "v": "Neuromodulação e neurocirurgia"}, {"t": "ul", "v": ["<b>Estimulação magnética transcraniana profunda (EMTp, dTMS)<\/b>: liberada pela FDA para TOC em <b>2018<\/b>. No ensaio multicêntrico de Carmi e cols. (2019), 6 semanas de EMTp de alta frequência sobre o córtex pré-frontal medial e o cíngulo anterior, após provocação individual de sintomas, reduziram a Y-BOCS em 6,0 pontos contra 3,3 com sham; resposta (≥ 30%) de <b>38,1%<\/b> contra <b>11,1%<\/b>, e de 45,2% contra 17,8% um mês depois.", "<b>EMT repetitiva<\/b> convencional (área motora suplementar, orbitofrontal, pré-frontal dorsolateral): resultados variáveis; considerada pela WFSBP entre as opções para casos resistentes.", "<b>Eletroconvulsoterapia<\/b>: <b>sem evidência<\/b> de eficácia no núcleo do TOC; pode ser indicada pela depressão grave comórbida.", "<b>Estimulação cerebral profunda (ECP, DBS)<\/b>: eletrodos em alvos como cápsula ventral e estriado ventral, núcleo accumbens ou núcleo subtalâmico. A FDA a liberou em 2009 por isenção humanitária. Em metanálise de 31 estudos e 116 pacientes, a Y-BOCS caiu em média <b>45%<\/b> e <b>60%<\/b> responderam (Alonso e cols., 2015). É reversível e ajustável.", "<b>Cirurgia ablativa<\/b>: capsulotomia anterior, cingulotomia anterior. No ensaio <b>brasileiro<\/b> randomizado e controlado com cirurgia simulada da <b>capsulotomia ventral por raios gama<\/b> (USP), <b>3 de 8<\/b> pacientes do grupo ativo responderam em 12 meses, contra nenhum dos 8 do grupo sham; mais 2 responderam até 54 meses (Lopes e cols., 2014).", "Indicação de neurocirurgia: TOC <b>grave<\/b>, <b>crônico<\/b> (em geral 5 anos ou mais), com <b>falha documentada<\/b> de múltiplos IRS, reforços e EPR adequada, avaliado por equipe multidisciplinar em <b>centro especializado<\/b>."]}, {"t": "p", "v": "<span class=\"ps-src\">Fontes: <a href=\"https://doi.org/10.1176/appi.ajp.2019.18101180\" target=\"_blank\" rel=\"noopener\">Carmi L e cols. Am J Psychiatry, 2019<\/a> · <a href=\"https://doi.org/10.1371/journal.pone.0133591\" target=\"_blank\" rel=\"noopener\">Alonso P e cols. PLoS One, 2015<\/a> · <a href=\"https://doi.org/10.1001/jamapsychiatry.2014.1193\" target=\"_blank\" rel=\"noopener\">Lopes AC e cols. JAMA Psychiatry, 2014<\/a><\/span>"}, {"t": "escreva", "id": "ps-resist-w-neuromodulacao", "label": "Neuromodulação", "v": "", "li": ["<b>EMTp<\/b>: FDA 2018; resposta 38% × 11% (Carmi 2019)", "ECT: sem efeito no TOC (só se depressão grave)", "<b>ECP<\/b>: FDA 2009 (humanitária); 60% respondem, −45% Y-BOCS (Alonso 2015)", "Capsulotomia gama (USP): 3/8 × 0/8 (Lopes 2014)", "Neurocirurgia: grave, crônico, refratário, centro especializado"]}, {"t": "lance", "q": "Qual a taxa de resposta à ECP na metanálise de Alonso (2015)?", "a": "60%, com redução média de 45% da Y-BOCS."}, {"t": "h2", "v": "Psicodélicos e o horizonte"}, {"t": "ul", "v": ["A <b>psilocibina<\/b> (agonista 5-HT2A) é estudada no TOC resistente. Os dados ainda são de amostras muito pequenas."]}, {"t": "atual", "label": "Psilocibina", "v": "Em ensaio randomizado de 2026 com <b>15 pacientes<\/b> (doses altas, baixas ou lorazepam como placebo ativo, seguidas de doses altas abertas), não houve eventos adversos graves e 73% responderam ao fim de pelo menos quatro doses altas, com efeito ainda presente, mas menor, em 6 meses. É um sinal interessante, sem controle duplo-cego na fase de maior resposta e com amostra mínima. <b>Não é tratamento<\/b> fora de pesquisa.", "src": [["Moreno FA e cols. J Psychopharmacol, 2026", "https://doi.org/10.1177/02698811261424214"]]}, {"t": "ul", "v": ["Outras frentes: <b>neuromodulação guiada por conectividade<\/b> e por imagem individual, ECP em alça fechada, predição de resposta por genética e neuroimagem."]}, {"t": "escreva", "id": "ps-resist-w-emergente", "label": "Emergente", "v": "", "li": ["Psilocibina: ensaio de 15 pacientes (2026), sinal promissor", "Cetamina: efeito rápido e curto, estudos pequenos", "Fora de pesquisa: <b>não é tratamento<\/b>"]}, {"t": "lance", "q": "A psilocibina é tratamento do TOC?", "a": "Não: é evidência emergente de estudos muito pequenos, só em pesquisa."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Como se define TOC resistente?", "a": "Resposta insuficiente a pelo menos dois testes adequados com inibidor de recaptação de serotonina (dose e tempo) e, idealmente, a um curso adequado de TCC com EPR."}, {"q": "O que conferir antes de rotular um paciente como resistente?", "a": "Dose e tempo adequados, adesão, se a EPR foi feita de verdade, se o diagnóstico está certo, comorbidades não tratadas, acomodação familiar e interações que reduzem o nível do fármaco."}, {"q": "O que mostrou o ensaio de Simpson (2013) sobre reforço do IRS?", "a": "Acrescentar EPR foi superior à risperidona e ao placebo (resposta de 80% × 23% × 15%; sintomas mínimos em 43% × 13% × 5%), e a risperidona não diferiu do placebo."}, {"q": "Em que subgrupo o reforço com antipsicótico tem maior benefício?", "a": "No TOC com tiques comórbidos (diferença absoluta de risco de 0,43 na metanálise de Bloch, 2006)."}, {"q": "Qual técnica de neuromodulação não invasiva foi liberada pela FDA para TOC e com que resultado?", "a": "A estimulação magnética transcraniana profunda (2018), com resposta de 38,1% contra 11,1% do sham no ensaio de Carmi (2019)."}, {"q": "Quais as indicações para neurocirurgia no TOC?", "a": "TOC grave e crônico, com falha documentada de múltiplos IRS, reforços e EPR adequada, avaliado por equipe multidisciplinar em centro especializado."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Mulher de 35 anos com TOC usa sertralina 200 mg/dia há 14 semanas, com boa adesão. A Y-BOCS caiu de 28 para 22. Nunca fez psicoterapia. Qual a melhor próxima etapa?", "opts": ["Acrescentar TCC com exposição e prevenção de resposta, mantendo a sertralina.", "Suspender a sertralina e iniciar clomipramina.", "Acrescentar risperidona 2 mg/dia.", "Indicar estimulação cerebral profunda."], "ok": 0, "exp": "<b>A<\/b> é a correta: o IRS foi adequado e a resposta é parcial (cerca de 21%); a EPR é o reforço com melhor evidência (Simpson, 2013: 80% de resposta com EPR × 23% com risperidona). <b>B<\/b> é uma opção posterior, e suspender a sertralina perde o ganho parcial. <b>C<\/b> é reforço válido, mas de segunda escolha, sobretudo sem tiques e sem ter tentado EPR. <b>D<\/b> é para TOC grave, crônico e refratário a múltiplas estratégias. Revise: <b>algoritmo do TOC resistente<\/b>."}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "Homem de 22 anos com TOC e síndrome de Tourette tem resposta parcial após dois ISRS em dose e tempo adequados e 20 sessões de EPR bem conduzidas. Qual reforço tem melhor evidência para ele?", "opts": ["Benzodiazepínico de longa ação.", "Antipsicótico em dose baixa, como risperidona ou haloperidol, considerando o benefício maior quando há tiques.", "Eletroconvulsoterapia.", "Psilocibina, que já é tratamento padrão para casos resistentes."], "ok": 1, "exp": "<b>B<\/b> é a correta: após IRS adequados e EPR, o reforço com antipsicótico é a próxima etapa, e o benefício é maior no TOC com tiques (diferença de risco de 0,43 em Bloch, 2006). <b>A<\/b> não trata o TOC. <b>C<\/b> não tem eficácia no núcleo do TOC. <b>D<\/b> é evidência emergente de amostra muito pequena, restrita a pesquisa. Revise: <b>reforço com antipsicótico e TOC relacionado a tique<\/b>."}]}, {"id": "ps-vida", "title": "9. O TOC na vida real e as leituras", "sub": "Família, parceiros e como ajudar sem alimentar o ciclo, estigma e linguagem, onde buscar ajuda no Brasil, e a biblioteca do tema: clássicos, livros de referência, literatura e artigos", "blocks": [{"t": "h2", "v": "Como apoiar sem alimentar o ciclo"}, {"t": "ul", "v": ["<b>Entender antes de agir<\/b>: os pensamentos não são desejos, nem traços de caráter. A pessoa sofre com eles; o conteúdo assusta justamente porque contraria o que ela valoriza.", "<b>Validar a emoção, não o conteúdo<\/b>: \"eu vejo que isso está te deixando muito angustiada\" ajuda; discutir se a porta está mesmo trancada, ou garantir pela décima vez que está, alimenta o TOC.", "<b>Reasseguramento é o ponto mais delicado<\/b>: responder sempre alivia na hora e aumenta a dúvida depois. Mas cortar de repente gera conflito e sofrimento. O caminho é <b>combinar<\/b> com a pessoa (de preferência com o terapeuta) uma redução gradual, por exemplo: \"eu respondo uma vez; depois disso, eu fico com você, mas não respondo de novo\".", "<b>Reduzir a acomodação aos poucos<\/b>, como uma hierarquia: escolher uma acomodação de cada vez, combinar antes, manter o combinado com calma.", "<b>Apoiar o tratamento<\/b>: lembrar que a EPR é desconfortável de propósito, reconhecer o esforço, não cobrar resultado imediato.", "<b>Não usar o TOC em discussões<\/b> nem fazer piada com os rituais; não chamar a pessoa de \"a TOC\".", "<b>Lembrar que existe uma pessoa inteira além do transtorno<\/b>: os momentos bons, os planos, o que ela gosta de fazer.", "<b>Cuidar de si<\/b>: quem convive também se cansa; orientação familiar e grupos de apoio ajudam.", "<b>Sinais de alerta<\/b> que pedem ajuda rápida: falas de não aguentar mais, desesperança, ideias de morte, piora intensa com depressão. Perguntar diretamente e buscar ajuda (CVV 188; emergência 192)."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> Uma fórmula que muitos terapeutas ensinam aos familiares combina <b>empatia<\/b> e <b>confiança<\/b>: \"eu sei que isso é muito difícil para você, e eu confio que você consegue aguentar essa ansiedade sem o ritual\". Ela reconhece o sofrimento sem reforçar o TOC. Programas para pais de crianças ansiosas, como o <b>SPACE<\/b> (Lebowitz), foram construídos sobre essa ideia."}, {"t": "escreva", "id": "ps-vida-w-apoiar-sem-alimentar", "label": "Apoiar sem alimentar", "v": "", "li": ["Validar a <b>emoção<\/b>, não o conteúdo", "Reasseguramento: <b>reduzir de forma combinada e gradual<\/b>", "Acomodação: uma de cada vez, combinada antes", "Empatia + confiança: \"é difícil, e eu confio que você aguenta\"", "Sinais de alerta: perguntar e buscar ajuda"]}, {"t": "lance", "q": "Qual a fórmula de empatia e confiança para familiares?", "a": "\"Eu sei que é difícil, e eu confio que você consegue aguentar sem o ritual.\""}, {"t": "h2", "v": "TOC e relacionamentos"}, {"t": "ul", "v": ["O TOC afeta a vida a dois: rituais que envolvem o parceiro, perguntas repetidas, evitação de lugares ou de contato, cansaço dos dois lados.", "O <b>TOC de relacionamento<\/b> é uma apresentação descrita na literatura: dúvidas obsessivas sobre <b>se ama ou é amado<\/b> (\"e se eu não amar de verdade?\"), ou foco obsessivo em <b>defeitos percebidos<\/b> do parceiro, com rituais de comparação, verificação dos próprios sentimentos e busca de reasseguramento. Não é falta de amor: é o TOC escolhendo como alvo aquilo que mais importa para a pessoa.", "Também é comum o TOC se apoiar no parceiro para outras dimensões (contaminação, verificação), o que transforma o parceiro em parte do ritual.", "Há protocolos de TCC <b>com o casal<\/b>, em que o parceiro participa do planejamento das exposições e da redução da acomodação; os estudos são menores, mas mostram benefício.", "A boa notícia: com tratamento, a maioria das pessoas com TOC tem relacionamentos estáveis e satisfatórios."]}, {"t": "p", "v": "<cx>[Complemento]<\/cx> O TOC tende a atacar o que a pessoa mais valoriza: quem preza a fé tem obsessões religiosas; quem ama os filhos, obsessões de machucá-los; quem valoriza o relacionamento, dúvidas sobre ele. Entender isso costuma ser um alívio para os dois."}, {"t": "escreva", "id": "ps-vida-w-relacionamentos", "label": "Relacionamentos", "v": "", "li": ["TOC de relacionamento: dúvida obsessiva sobre amar/ser amado ou defeitos do parceiro", "Não é falta de amor: o TOC ataca o que mais importa", "Parceiro pode virar parte do ritual", "TCC com o casal: planejar exposições e reduzir acomodação"]}, {"t": "lance", "q": "O TOC de relacionamento indica falta de amor?", "a": "Não: o TOC tende a atacar o que a pessoa mais valoriza."}, {"t": "h2", "v": "Estigma, linguagem e onde buscar ajuda"}, {"t": "ul", "v": ["<b>\"Sou meio TOC\"<\/b>: a expressão banaliza um transtorno que pode ser grave e incapacitante. Organização e gosto por limpeza não são TOC.", "Prefira <b>\"pessoa com TOC\"<\/b> a \"TOC\" ou \"obsessiva\": a pessoa não é o transtorno.", "O TOC é <b>tratável<\/b>; quanto antes, melhor. O atraso para buscar ajuda costuma vir da vergonha do conteúdo das obsessões.", "<b>Onde buscar ajuda no Brasil<\/b>:<ul class=\"sub\"><li><b>Atenção primária<\/b> (UBS) e <b>CAPS<\/b>, pela rede de atenção psicossocial do SUS.<\/li><li><b>PROTOC<\/b>: Programa Transtornos do Espectro Obsessivo-Compulsivo do Instituto de Psiquiatria do Hospital das Clínicas da FMUSP, referência em pesquisa e tratamento.<\/li><li><b>ASTOC<\/b>: Associação Brasileira de Síndrome de Tourette, Tiques e TOC (apoio e informação a pacientes e famílias).<\/li><li>Ambulatórios universitários de psiquiatria e de TCC (por exemplo, o programa de TOC do Hospital de Clínicas de Porto Alegre, ligado à UFRGS).<\/li><li><b>CVV 188<\/b> (24 horas, gratuito) em crise emocional; risco iminente é emergência (SAMU 192).<\/li><\/ul>", "Ao procurar terapia, perguntar se o profissional trabalha com <b>exposição e prevenção de resposta<\/b>."]}, {"t": "escreva", "id": "ps-vida-w-ajuda-no-brasil", "label": "Ajuda no Brasil", "v": "", "li": ["UBS e CAPS (RAPS/SUS)", "PROTOC (IPq-HCFMUSP)", "ASTOC (Tourette, tiques e TOC)", "Ambulatórios universitários de TCC", "CVV 188; SAMU 192"]}, {"t": "lance", "q": "O que perguntar ao procurar um terapeuta para TOC?", "a": "Se ele trabalha com exposição e prevenção de resposta."}, {"t": "h2", "v": "A biblioteca do TOC: clássicos"}, {"t": "ul", "v": ["<b>Jean-Étienne Esquirol<\/b>, <i>Des maladies mentales<\/i> (1838): o caso da \"monomania raciocinante\", com crítica preservada. A primeira descrição psiquiátrica moderna.", "<b>Carl Westphal<\/b>, \"Über Zwangsvorstellungen\" (1877): a conferência que dá nome ao fenômeno compulsivo e separa o TOC da loucura.", "<b>Pierre Janet<\/b>, <i>Les obsessions et la psychasthénie<\/i> (1903): a sensação de incompletude e as primeiras ideias de expor o paciente ao que ele teme.", "<b>Sigmund Freud<\/b>, \"Atos obsessivos e práticas religiosas\" (1907) e \"Notas sobre um caso de neurose obsessiva\", o <b>Homem dos Ratos<\/b> (1909): leitura histórica obrigatória; descrição clínica fina da dúvida, da ambivalência e do pensamento mágico. A terapêutica psicanalítica não foi confirmada para o TOC.", "<b>Victor Meyer<\/b>, \"Modification of expectations in cases with obsessional rituals\" (<i>Behaviour Research and Therapy<\/i>, 1966): o artigo que inaugura a exposição com prevenção de resposta.", "<b>Stanley Rachman e Padmal de Silva<\/b>, \"Abnormal and normal obsessions\" (<i>Behaviour Research and Therapy<\/i>, 1978): mostra que pensamentos intrusivos são universais.", "<b>Paul Salkovskis<\/b>, \"Obsessional-compulsive problems: a cognitive-behavioural analysis\" (<i>Behaviour Research and Therapy<\/i>, 1985): o modelo da responsabilidade."]}, {"t": "escreva", "id": "ps-vida-w-classicos", "label": "Clássicos", "v": "", "li": ["Esquirol 1838; Westphal 1877; Janet 1903", "Freud 1909: Homem dos Ratos", "Meyer 1966: EPR", "Rachman e de Silva 1978; Salkovskis 1985"]}, {"t": "lance", "q": "Quem descreveu o \"Homem dos Ratos\"?", "a": "Freud, em 1909."}, {"t": "h2", "v": "Livros de referência e literatura"}, {"t": "ul", "v": ["<b>Livros de psiquiatras e psicólogos de referência<\/b>:<ul class=\"sub\"><li><b>Judith L. Rapoport<\/b>, <i>The Boy Who Couldn't Stop Washing<\/i> (1989): psiquiatra do NIMH que estudou o TOC na infância; casos reais contados com rigor e humanidade.<\/li><li><b>Jeffrey M. Schwartz<\/b>, <i>Brain Lock<\/i> (1996): o psiquiatra da UCLA (coautor do estudo de Baxter) apresenta um método em quatro passos baseado em reatribuir o sintoma ao cérebro (\"não sou eu, é o TOC\").<\/li><li><b>Lee Baer<\/b>, <i>The Imp of the Mind<\/i> (2001): psicólogo de Harvard sobre pensamentos intrusivos \"proibidos\" (agressivos, sexuais, religiosos). Leitura excelente para quem sofre com esse tema.<\/li><li><b>Edna B. Foa e Reid Wilson<\/b>, <i>Stop Obsessing!<\/i> (1991; ed. revista 2001): autoajuda baseada em EPR, escrita por quem desenvolveu o protocolo.<\/li><li><b>Edna B. Foa, Elna Yadin e Tracey Lichner<\/b>, <i>Exposure and Response (Ritual) Prevention for Obsessive-Compulsive Disorder: Therapist Guide<\/i> (2ª ed., 2012): o manual do terapeuta.<\/li><li><b>Jonathan S. Abramowitz<\/b>, <i>Getting Over OCD<\/i> (2009; 2ª ed., 2018): guia de autoajuda baseado em TCC.<\/li><li><b>Aristides Volpato Cordioli<\/b> (UFRGS), <i>Vencendo o transtorno obsessivo-compulsivo<\/i> e <i>TOC: manual de terapia cognitivo-comportamental para o transtorno obsessivo-compulsivo<\/i> (Artmed): a principal referência brasileira, para pacientes, famílias e terapeutas.<\/li><\/ul>", "<b>Divulgação e memórias<\/b>:<ul class=\"sub\"><li><b>David Adam<\/b>, <i>The Man Who Couldn't Stop<\/i> (2014): jornalista científico que tem TOC conta a própria história e a ciência do transtorno.<\/li><\/ul>", "<b>Literatura<\/b>:<ul class=\"sub\"><li><b>John Green<\/b>, <i>Tartarugas até lá embaixo<\/i> (2017): romance cuja protagonista, Aza, vive espirais de pensamentos intrusivos e rituais; o autor tem TOC e escreve com conhecimento de causa.<\/li><\/ul>", "<b>Cinema, com olhar crítico<\/b>: <i>O Aviador<\/i> (2004), sobre Howard Hughes, retrata o agravamento de um TOC de contaminação; <i>Melhor é Impossível<\/i> (1997) popularizou o tema, mas mistura TOC com traços de personalidade e com a ideia de \"cura pelo amor\", que não corresponde à clínica."]}, {"t": "escreva", "id": "ps-vida-w-livros-para-indicar", "label": "Livros para indicar", "v": "", "li": ["Pacientes e famílias: <b>Cordioli<\/b>; Baer; Foa e Wilson; Abramowitz", "Terapeutas: Foa, Yadin e Lichner", "História e ciência: Rapoport; Schwartz; David Adam", "Romance: John Green, <i>Tartarugas até lá embaixo<\/i>"]}, {"t": "lance", "q": "Qual a principal referência brasileira de TCC no TOC?", "a": "Aristides Cordioli (UFRGS)."}, {"t": "h2", "v": "Artigos e diretrizes de alto valor"}, {"t": "ul", "v": ["<b>Classificação<\/b>: American Psychiatric Association, <i>DSM-5-TR<\/i> (2022); Organização Mundial da Saúde, <b>CID-11<\/b>, 6B20 (2022).", "<b>Diretrizes<\/b>:<ul class=\"sub\"><li><a href=\"https://psychiatryonline.org/pb/assets/raw/sitewide/practice_guidelines/guidelines/ocd.pdf\" target=\"_blank\" rel=\"noopener\">APA · Practice Guideline for the Treatment of Patients with OCD (Koran e cols., 2007)<\/a> e Guideline Watch (2013).<\/li><li><a href=\"https://www.nice.org.uk/guidance/cg31\" target=\"_blank\" rel=\"noopener\">NICE CG31 · OCD and body dysmorphic disorder (2005)<\/a>.<\/li><li><a href=\"https://doi.org/10.1080/15622975.2022.2086296\" target=\"_blank\" rel=\"noopener\">WFSBP v3 · parte II: TOC e TEPT (Bandelow e cols., 2022)<\/a>.<\/li><\/ul>", "<b>Epidemiologia e curso<\/b>: <a href=\"https://doi.org/10.1038/mp.2008.94\" target=\"_blank\" rel=\"noopener\">Ruscio, 2010 (NCS-R)<\/a> · <a href=\"https://doi.org/10.4088/JCP.19r13085\" target=\"_blank\" rel=\"noopener\">Fawcett, 2020<\/a> · <a href=\"https://doi.org/10.1001/archpsyc.56.2.121\" target=\"_blank\" rel=\"noopener\">Skoog e Skoog, 1999<\/a> · <a href=\"https://doi.org/10.1111/j.1600-0447.2004.00302.x\" target=\"_blank\" rel=\"noopener\">Stewart, 2004<\/a> · <a href=\"https://doi.org/10.1038/mp.2016.115\" target=\"_blank\" rel=\"noopener\">Fernández de la Cruz, 2017 (suicídio)<\/a>.", "<b>Neurobiologia<\/b>: <a href=\"https://doi.org/10.1001/archpsyc.1992.01820090009002\" target=\"_blank\" rel=\"noopener\">Baxter, 1992<\/a> · <a href=\"https://doi.org/10.1001/jamapsychiatry.2013.3\" target=\"_blank\" rel=\"noopener\">Mataix-Cols, 2013<\/a> · <a href=\"https://doi.org/10.1038/s41588-025-02189-z\" target=\"_blank\" rel=\"noopener\">Strom, 2025 (GWAS)<\/a> · <a href=\"https://doi.org/10.1176/appi.ajp.2011.10071062\" target=\"_blank\" rel=\"noopener\">Gillan, 2011<\/a>.", "<b>Tratamento<\/b>: <a href=\"https://doi.org/10.1016/j.cpr.2015.06.003\" target=\"_blank\" rel=\"noopener\">Öst, 2015<\/a> · <a href=\"https://doi.org/10.1016/S2215-0366(16)30069-4\" target=\"_blank\" rel=\"noopener\">Skapinakis, 2016<\/a> · <a href=\"https://doi.org/10.1038/mp.2009.50\" target=\"_blank\" rel=\"noopener\">Bloch, 2010 (dose)<\/a> · <a href=\"https://doi.org/10.1001/jama.292.16.1969\" target=\"_blank\" rel=\"noopener\">POTS, 2004<\/a> · <a href=\"https://doi.org/10.1038/sj.mp.4001823\" target=\"_blank\" rel=\"noopener\">Bloch, 2006 (antipsicóticos)<\/a> · <a href=\"https://doi.org/10.1001/jamapsychiatry.2013.1932\" target=\"_blank\" rel=\"noopener\">Simpson, 2013<\/a> · <a href=\"https://doi.org/10.1002/wps.20299\" target=\"_blank\" rel=\"noopener\">Mataix-Cols, 2016 (desfechos)<\/a>.", "<b>Resistência e neuromodulação<\/b>: <a href=\"https://doi.org/10.1176/appi.ajp.2019.18101180\" target=\"_blank\" rel=\"noopener\">Carmi, 2019<\/a> · <a href=\"https://doi.org/10.1371/journal.pone.0133591\" target=\"_blank\" rel=\"noopener\">Alonso, 2015<\/a> · <a href=\"https://doi.org/10.1001/jamapsychiatry.2014.1193\" target=\"_blank\" rel=\"noopener\">Lopes, 2014<\/a> · <a href=\"https://doi.org/10.1001/jamanetworkopen.2024.52963\" target=\"_blank\" rel=\"noopener\">Coelho, 2025 (glutamatérgicos)<\/a>.", "<b>Revisões gerais<\/b>: Stein DJ e cols., \"Obsessive-compulsive disorder\", <a href=\"https://doi.org/10.1038/s41572-019-0102-3\" target=\"_blank\" rel=\"noopener\"><i>Nature Reviews Disease Primers<\/i>, 2019<\/a>; Abramowitz JS e cols., \"Obsessive-compulsive disorder\", <i>The Lancet<\/i>, 2009."]}, {"t": "escreva", "id": "ps-vida-w-tres-leituras-essenciais", "label": "Três leituras essenciais", "v": "", "li": ["Stein e cols. 2019 (Nat Rev Dis Primers): panorama", "Skapinakis 2016 (Lancet Psychiatry): tratamento", "Simpson 2013 (JAMA Psychiatry): EPR &gt; risperidona no reforço"]}, {"t": "lance", "q": "Qual revisão dá o panorama atual do TOC?", "a": "Stein e cols., Nature Reviews Disease Primers, 2019."}, {"t": "h2", "v": "Perguntas para revisar"}, {"t": "q", "v": [{"q": "Como apoiar alguém que pede reasseguramento repetido sem alimentar o TOC?", "a": "Validar a emoção sem responder ao conteúdo repetidamente, e combinar com a pessoa (idealmente com o terapeuta) uma redução gradual do reasseguramento, mantendo presença e empatia."}, {"q": "O que é o TOC de relacionamento?", "a": "Uma apresentação do TOC com dúvidas obsessivas sobre amar ou ser amado pelo parceiro, ou foco obsessivo em defeitos percebidos dele, com rituais de verificação, comparação e busca de reasseguramento. Não indica falta de amor."}, {"q": "Qual livro é a principal referência brasileira sobre TCC no TOC?", "a": "Os manuais de Aristides Volpato Cordioli (UFRGS), como \"Vencendo o transtorno obsessivo-compulsivo\"."}, {"q": "Que artigo de 1966 inaugura a exposição com prevenção de resposta?", "a": "Victor Meyer, \"Modification of expectations in cases with obsessional rituals\", Behaviour Research and Therapy."}]}, {"t": "h2", "v": "Questões comentadas"}, {"t": "mcq", "src": "Autoral · estilo residência", "stem": "O namorado de uma paciente com TOC de contaminação pergunta como ajudar. Ela pede que ele troque de roupa e tome banho sempre que chega da rua, e ele faz isso há meses. A orientação mais adequada é:", "opts": ["Continuar atendendo a todos os pedidos, porque isso reduz a ansiedade dela.", "Parar de uma vez todos os comportamentos combinados, sem conversar, para \"quebrar o TOC\".", "Entender que isso é acomodação, e combinar com ela e o terapeuta uma redução gradual, validando a angústia e demonstrando confiança na capacidade dela de tolerá-la.", "Afastar-se até que ela termine o tratamento."], "ok": 2, "exp": "<b>C<\/b> é a correta: a acomodação nasce do afeto, mas mantém o ciclo; a redução deve ser combinada, gradual e empática, como uma hierarquia de exposição. <b>A<\/b> mantém o TOC a longo prazo. <b>B<\/b> tende a gerar crise, conflito e ruptura da aliança; o objetivo é reduzir, não punir. <b>D<\/b> não tem base clínica e retira apoio. Revise: <b>acomodação familiar e como apoiar<\/b>."}]}]}]};

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let qi = Math.floor(Date.now() / 864e5) % FRASES.length;   // começa na frase do dia
function frase(box){
  const [t, a] = FRASES[qi % FRASES.length];
  box.querySelector('.qd-q').innerHTML = `<q>${esc(t)}</q><small>${esc(a)}</small>`;
}
let NEWS;   // cache da página: o doc só é lido uma vez por carga
async function noticias(){
  if(NEWS !== undefined) return NEWS;
  NEWS = null;
  try{
    const db = window.claude && await window.claude.use('db');
    if(db){ const snap = await db.doc('quadros/noticias').get(); NEWS = snap && (snap.data ? snap.data() : snap) || null; }
  }catch(e){ NEWS = null; }
  return NEWS;
}
function mundo(box, n){
  const it = n && Array.isArray(n.itens) ? n.itens : [];
  const body = box.querySelector('.qd-n');
  if(!it.length){ body.innerHTML = '<div class="qd-d">As notícias aparecem aqui assim que a atualização diária rodar.</div>'; box.querySelector('[data-qd-more]').hidden = true; return; }
  const dt = n.atualizado ? new Date(n.atualizado) : null;
  body.innerHTML = `<ol>${it.map((x, i) => `<li class="${i > 2 ? 'more' : ''}"><b>${esc(x.titulo)}</b><span>${esc(x.resumo)}</span>${x.url ? ` <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.fonte || 'fonte')} ↗</a>` : ''}</li>`).join('')}</ol>` +
    (dt && !isNaN(dt) ? `<div class="qd-d">Atualizado em ${dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'})}</div>` : '');
  box.querySelector('[data-qd-more]').hidden = it.length <= 3;
}
async function render(el){
  if(!el) return; css();
  el.innerHTML = `<div class="qd">
    <section class="qd-box qd-fr" aria-label="Frase"><div class="qd-h"><span>Frase</span><button type="button" class="qd-b" data-qd-next>Outra ↻</button></div><div class="qd-q"></div></section>
    <section class="qd-box qd-mu" aria-label="Geopolítica"><div class="qd-h"><span>Mundo · geopolítica</span><button type="button" class="qd-b" data-qd-more hidden>Ver todas</button></div><div class="qd-n"><div class="qd-d">Carregando…</div></div></section></div>`;
  const fr = el.querySelector('.qd-fr'), mu = el.querySelector('.qd-mu');
  frase(fr);
  fr.querySelector('[data-qd-next]').onclick = () => { qi += 1 + Math.floor(Math.random() * (FRASES.length - 1)); frase(fr); };
  mu.querySelector('[data-qd-more]').onclick = e => { const o = mu.classList.toggle('open'); e.target.textContent = o ? 'Menos' : 'Ver todas'; };
  mundo(mu, await noticias());
}
window.Quadros = {render, FRASES};

function css(){ if(document.getElementById('af-css')) return; const st = document.createElement('style'); st.id = 'af-css'; st.textContent = CSS; document.head.appendChild(st); }
function burst(el, n){
  for(let i = 0; i < n; i++){
    const h = document.createElement('span');
    h.className = 'af-h ' + ['', 'p', 'o'][i % 3]; h.textContent = '♥';
    h.style.setProperty('--dx', (Math.random() * 60 - 30).toFixed(0) + 'px');

function fala(who){
  const agora = Date.now();
  seguidos[who] = agora - ult[who] < 6000 ? seguidos[who] + 1 : 1; ult[who] = agora;
  if(seguidos[who] === 6) return MUITO[who];
  const L = FALAS[who]; return L[at[who]++ % L.length];

function bind(btn, who, o){
  css(); o = o || {};
  btn.classList.add('af');
  let timer = null, chuva = null, afagou = false, dito = false;
  const fim = () => {
    clearTimeout(timer); clearInterval(chuva); timer = chuva = null;
    btn.classList.remove('af-on');
    if(afagou && !dito){ dito = true; const [m, t] = fala(who); o.face && o.face(m); o.say && o.say(m, t); }
  };

    afagou = dito = false;
    timer = setTimeout(() => {

      chuva = setInterval(() => burst(btn, 1), 260);

/* a lua de hoje, vista do hemisfério sul (o lado iluminado fica invertido em relação ao norte) */
function moonSVG(){
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14) / 864e5;
  const age = (((Date.now() / 864e5 - ref) % syn) + syn) % syn, f = age / syn;   // 0 nova, .5 cheia
  const k = Math.cos(2 * Math.PI * f), r = 28, waxing = f < .5;
  // no sul, a lua crescente acende do lado esquerdo
  const litLeft = waxing, sx = Math.abs(k) * r;
  const outer = `M32 4 A28 28 0 0 ${litLeft ? 0 : 1} 32 60`;
  const inner = `A${sx.toFixed(2)} 28 0 0 ${(k > 0) === litLeft ? 1 : 0} 32 4`;
  return `<svg class="moon" viewBox="0 0 64 64" role="img" aria-label="Lua de hoje"><circle cx="32" cy="32" r="28" fill="#3B3650"/>
    <path d="${outer} ${inner}" fill="#FFF3C4"/><circle cx="25" cy="22" r="3.5" fill="#000" opacity=".06"/><circle cx="38" cy="38" r="5" fill="#000" opacity=".05"/><circle cx="40" cy="20" r="2.2" fill="#000" opacity=".06"/></svg>`;
}

function slideStyle(deck, n){
  const i = n - 1, f = Math.floor(i / 6) + 1, c = i % 2, r = Math.floor((i % 6) / 2);
  return `background-image:url(img/${deck}/f${String(f).padStart(2, '0')}.webp);background-size:200% 300%;background-position:${c * 100}% ${r * 50}%`;
}
function thumbStyle(deck, tot, n){
  const i = n - 1, rows = Math.ceil(tot / 10), c = i % 10, r = Math.floor(i / 10);
  return `background-image:url(img/${deck}/mini.webp);background-size:1000% ${rows * 100}%;background-position:${c * 100 / 9}% ${rows > 1 ? r * 100 / (rows - 1) : 0}%`;
}

  const pages = []; let intro = [];
  for(const b of a.blocks){ if(b.t === 'h2') pages.push({title:b.v, blocks:[]}); else (pages.length ? pages[pages.length - 1].blocks : intro).push(b); }
  const refs = new Map();
  for(const b of a.blocks){
    if(Array.isArray(b.src)) b.src.forEach(([l, u]) => refs.has(u) || refs.set(u, l));
    if(b.t === 'box' && b.label === '__ref__'){ const [l, u] = b.v.split(' ¦ '); refs.has(u) || refs.set(u, l); }
    for(const [, u, l] of JSON.stringify(b).matchAll(/<a [^>]*href=\\"(https?:[^"\\]+)\\"[^>]*>([^<]+)<\/a>/g)) refs.has(u) || refs.set(u, l);   // artigos citados no texto
  }
  AULAS[a.id] = Object.assign(a, {mat:m, pages, intro, refs:[...refs].map(([u, l]) => ({u, l}))});
}
const plain = s => s.replace(/<[^>]+>/g, '');
const seen = id => store.get('visto:' + id, {});
function markSeen(id, n){ const s = seen(id); s[n] = 1; store.set('visto:' + id, s); }

/* blocos */
function dogBalloon(b){ return '';
  const D = DOGS[b.who] || DOGS.joey;
  return `<div class="vb m-${b.mood} by-${b.who}">${dogAv(b.who, b.mood, '')}<div class="bubble"><span class="who">${D.name}</span>${b.v}</div></div>`;
}
const TRIO = [['mel', 'brava'], ['joey', 'ok'], ['thor', 'medo']];
const ASK = ['mel', 'joey', 'thor'];
const pick = L => L[Math.floor(Math.random() * L.length)];
const REACT = {
  lance: {mel: ['ok', ['Conferiu com a resposta? Errou, relê a página. Sem atalho.', 'Acertou? Então pode virar a página. Com método.']],
    joey: ['ok', ['Era isso. Se acertou, eu sabia. Se errou, eu também sabia.', 'Viu? Nem precisava de esforço. Quase nenhum.']],
    thor: ['medo', ['A-acertou? Que alívio. Eu estava nervoso por você.', 'S-se errou, tudo bem. Eu também tremi nessa.']]},
  ok: {mel: ['manha', ['Correto. Viu o que acontece quando se lê com método?', 'Isso. Agora mereço um petisco.']],
    joey: ['ok', ['Acertou e eu nem precisei acordar. Ótimo trabalho em equipe.', 'Na mosca. Igual eu acertando o sofá de olho fechado.']],
    thor: ['ok', ['A-acertou! Posso sair de baixo da maca!', 'Ufa! Essa me dava medo e você nem tremeu.']]},
  no: {mel: ['brava', ['Errado. Leia o comentário inteiro, não só a letra certa.', 'Não. Volte na página e me traga o porquê.']],
    joey: ['sono', ['Errou? Relaxa, eu erro o horário do despertador todo dia. Lê o comentário.', 'Quase. Quase é a minha especialidade. Lê aí embaixo.']],
    thor: ['medo', ['E-errou... mas é aqui que pode errar, não na prova! Lê o comentário.', 'T-tudo bem, eu também caí nessa pegadinha.']]}
};
const reacao = (who, kind) => { const [m, L] = REACT[kind][who]; return `<div class="re">${dogAv(who, m, '')}<span>${pick(L)}</span></div>`; };
const artBtn = (l, u) => `<a class="art" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`;
/* "slide 5", "slides 21-24": cada número vira botão que abre o slide original */
const SREF = /\b([Ss]lides?)(\s+)(\d+(?:\s*(?:[-–,]|\be\b|\ba\b)\s*\d+)*)/g;
function slideRefs(html, a){
  if(!a.deck || !a.nsl) return html;
  return html.split(/(<[^>]+>)/).map(seg => seg[0] === '<' ? seg : seg.replace(SREF, (m, w, sp, ns) => w + sp + ns.replace(/\d+/g, d =>
    +d >= 1 && +d <= a.nsl ? `<button class="sref" data-deck="${a.deck}" data-tot="${a.nsl}" data-n="${+d}" aria-label="Abrir slide ${+d}">${d}</button>` : d))).join('');
}
function block(b, a){ const h = blockHtml(b, a); return b.t === 'slides' ? h : slideRefs(h, a); }
function blockHtml(b, a){
  switch(b.t){
    case 'p': return `<p>${b.v}</p>`;
    case 'ul': return `<ul>${b.v.map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'box':
      if(b.label === '__aula__') return `<div class="bx aula"><div class="lb">✎ Dito em aula</div>${b.v}</div>`;
      if(b.label === '__prova__') return `<div class="bx prova"><div class="lb">★ Cai na prova</div>${b.v}</div>`;
      if(b.label === '__ref__'){ const [l, u] = b.v.split(' ¦ '); return `<div class="solo">${artBtn(l, u)}</div>`; }
      return `<div class="bx box"><div class="lb">${b.label}</div>${b.v}</div>`;
    case 'caiu': return `<div class="bx prova"><div class="lb">★ Já caiu · ${b.label}</div>${b.v}</div>`;
    case 'atual': return `<div class="bx atual"><div class="lb">⟳ Atualização${b.label ? ' · ' + b.label : ''}</div>${b.v}${b.src.length ? `<div class="refs">${b.src.map(([l, u]) => artBtn(l, u)).join('')}</div>` : ''}</div>`;
    case 'div': return `<div class="bx div"><div class="lb">⚖ Slide × diretriz</div>${b.v}${b.src.length ? `<div class="refs">${b.src.map(([l, u]) => artBtn(l, u)).join('')}</div>` : ''}</div>`;
    case 'vera': return dogBalloon(b);
    case 'slides': return `<div class="strip"><div class="cap">Slides da aula${b.cap ? ' · ' + b.cap : ''}</div><div class="row">${b.n.map(n =>
      `<button class="th" style="${thumbStyle(b.deck, b.tot, n)}" data-deck="${b.deck}" data-tot="${b.tot}" data-n="${n}" aria-label="Abrir slide ${n}"><span>${n}</span></button>`).join('')}</div></div>`;
    case 'img': { const m = b.src.match(/img\/([^/]+)\/s(\d+)\./);
      if(m && a.deck === m[1]) return `<figure class="sl"><button style="${slideStyle(m[1], +m[2])}" data-deck="${m[1]}" data-tot="${a.nsl}" data-n="${+m[2]}" aria-label="Abrir slide ${+m[2]}"></button><figcaption>${b.cap}</figcaption></figure>`;
      return ''; }
    case 'escreva': { const on = store.get('esc:' + b.id, 0);
      return `<div class="esc"><div class="lb">✍ Escreva à mão</div><h4>${b.label}</h4>${b.v ? `<p class="v">${b.v}</p>` : ''}${b.li.length ? `<ol>${b.li.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}<button class="mk${on ? ' on' : ''}" data-esc="${b.id}">${on ? '✓ Escrevi' : 'Marcar como escrito'}</button></div>`; }
    case 'table': return `<div class="tw"><table><thead><tr>${b.head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'case': return `<details class="fc"><summary>Caso: ${b.title}</summary><p>${b.body.join('<br>')}</p><p><b>${b.ask}</b></p><div>${b.reveal.join('<br>')}</div></details>`;
    case 'q': return b.v.map(q => `<details class="fc"><summary>${q.q}</summary><div>${q.a}</div></details>`).join('');
    case 'mcq': return `<div class="mcq" data-ok="${b.ok}" data-who="${ASK[a.blocks.indexOf(b) % 3]}"><div class="src">${esc(b.src)}</div><div class="st">${b.stem}</div>${b.opts.map((o, i) =>
      `<button class="op" data-i="${i}"><b>${'ABCDE'[i]})</b>${o}</button>`).join('')}<div class="ex">${b.exp}</div></div>`;
    case 'lance': { const w = ASK[(a.pages.findIndex(p => p.blocks.includes(b)) + 3) % 3];
      return `<div class="lance" data-who="${w}"><div class="ask">${dogAv(w, 'neutra', '')}<div class="lb">Pergunta<small>Responda antes de virar a página</small></div></div><div class="q">${b.q}</div><button class="btn alt" data-lance>Ver resposta</button><div class="a">${b.a}</div></div>`; }
    case 'svg': case 'html': return `<figure class="sl">${b.v}<figcaption>${b.cap}</figcaption></figure>`;
    default: return '';
  }
}

/* telas */
function topbar(left, title, right){
  return `<header class="top"><div class="wrap">${left}<div class="grow">${title}</div>${right || ''}<button class="ib" data-theme-t aria-label="Tema claro ou escuro">${IC.theme}</button></div></header>`;
}
function ring(p){
  const C = 2 * Math.PI * 17;
  return `<svg class="ring" viewBox="0 0 42 42"><circle cx="21" cy="21" r="17" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="var(--c1)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 21 21)"/><text x="21" y="25" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor" font-family="Sora">${Math.round(p * 100)}%</text></svg>`;
}
function home(){
  document.body.dataset.cor = 'home';
  const areas = {};
  for(const m of DADOS.materias) (areas[m.area] = areas[m.area] || []).push(m);
  return topbar('', 'Sexto Período') + `<main class="wrap">
    <section class="hero">${moonSVG()}<div><h1>Sexto Período</h1><p>Bruna Rossi · Medicina</p></div></section>
    ${Object.entries(areas).map(([area, ms]) => `<div class="sec-t">${esc(area)}</div>` + ms.map(m => `
      <div class="mat" data-cor="${m.cor}"><span class="tag">${esc(m.nome)}${m.prova ? ' · ' + esc(m.prova) : ''}</span><h3>${esc(m.nome)}</h3>
      ${m.aulas.length ? '' : '<p class="soon">Em breve: entra quando os slides chegarem.</p>'}
      ${m.aulas.map(a => { const A = AULAS[a.id], s = Object.keys(seen(a.id)).length;
        return `<a class="aul" href="#/a/${a.id}">${ring(A.pages.length ? s / A.pages.length : 0)}<div class="t"><b>${a.title}</b><span>${a.sub}</span></div></a>`; }).join('')}
      </div>`).join('')).join('')}
    <div class="sec-t">Os assistentes</div>
    <div class="trio" id="trio">${TRIO.map(([w, m]) => `<button type="button" data-af="${w}" aria-label="Fazer carinho em ${DOGS[w].name}"><span class="tb">${dogAv(w, m, '')}</span>${DOGS[w].name}</button>`).join('')}</div>
    <p class="trio-hint">Eles fazem as perguntas do fim de cada página. Toque ou segure em um deles para fazer carinho.</p>
    <div class="trio-say" id="trioSay"></div>
    <div id="quadros"></div>
    <div class="foot">Base: slides e fala dos professores. Complementos e atualizações marcados à parte, com o artigo.</div></main>`;
}
function cover(A){
  document.body.dataset.cor = A.mat.cor;
  const s = seen(A.id), nq = A.blocks.filter(b => b.t === 'mcq').length, qp = A.pages.findIndex(p => /quest/i.test(plain(p.title)));
  return topbar(`<a class="ib" href="#/" aria-label="Início">${IC.home}</a>`, A.mat.nome) + `<main class="wrap"><section class="cover">
    <div class="k">${esc(A.mat.area)} · ${esc(A.mat.nome)}</div><h1>${A.title}</h1><p class="sub">${A.sub}</p>
    <div class="acts"><a class="btn" href="#/a/${A.id}/${(A.pages.findIndex((p, i) => !s[i + 1]) + 1) || 1}">${Object.keys(s).length ? 'Continuar' : 'Começar'}</a>
    ${qp >= 0 ? `<a class="btn alt" href="#/a/${A.id}/${qp + 1}">${nq} questões</a>` : ''}
    <a class="btn alt" href="#/a/${A.id}/artigos">${IC.doc.replace('<svg', '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"')} Artigos (${A.refs.length})</a></div>
    ${A.intro.map(b => block(b, A)).join('')}
    <div class="legend"><div><i style="background:var(--aula-ln)"></i>Dito em aula: o que o professor falou ou anotou; [32:24] é o minuto do áudio</div>
    <div><i style="background:var(--prova-ln)"></i>Cai na prova: ênfase do professor</div>
    <div><i style="background:var(--atual-ln)"></i>Atualização: o que mudou depois do slide, com artigo</div>
    <div><i style="background:var(--div-ln)"></i>Slide × diretriz: quando o slide e a diretriz atual divergem</div>
    <div><i style="background:var(--cx);border-radius:99px"></i>Complemento: explicação de fora do slide</div></div>
    <ol class="toc">${A.pages.map((p, i) => `<li><a class="${s[i + 1] ? 'seen' : ''}" href="#/a/${A.id}/${i + 1}">${plain(p.title)}</a></li>`).join('')}</ol></section></main>`;
}
function page(A, n){
  document.body.dataset.cor = A.mat.cor;
  const P = A.pages[n - 1], N = A.pages.length; markSeen(A.id, n);
  const prev = n > 1 ? `<a class="ib" href="#/a/${A.id}/${n - 1}">‹ Anterior</a>` : `<a class="ib" href="#/a/${A.id}">‹ Sumário</a>`;
  const next = n < N ? `<a class="btn" href="#/a/${A.id}/${n + 1}">${plain(A.pages[n].title)} ›</a>` : `<a class="btn" href="#/a/${A.id}/artigos">Artigos da aula ›</a>`;
  return topbar(`<a class="ib" href="#/a/${A.id}" aria-label="Sumário da aula">${IC.list}</a>`, `${A.title}<small>${n}/${N}</small>`) +
    `<div class="bar"><i style="width:${(n / N * 100).toFixed(1)}%"></i></div><main class="wrap"><article class="page">
    <div class="pn">Página ${n} de ${N}</div><h2 class="pt">${P.title}</h2>${P.blocks.map(b => block(b, A)).join('')}
    <nav class="nav">${prev}${next}</nav></article></main>`;
}
function artigos(A){
  document.body.dataset.cor = A.mat.cor;
  return topbar(`<a class="ib" href="#/a/${A.id}" aria-label="Sumário da aula">${IC.list}</a>`, `${A.title}<small>Artigos</small>`) + `<main class="wrap"><section class="cover">
    <div class="k">Artigos de alto valor</div><h1>Abra direto a fonte</h1><p class="sub">Diretrizes, revisões Cochrane e ensaios citados na apostila. Todos achados no PubMed; o botão abre pelo DOI.</p>
    <div class="alist">${A.refs.map(r => { const [t, ...rest] = r.l.split(' · ');
      return `<a class="acard" href="${esc(r.u)}" target="_blank" rel="noopener"><div class="t">${esc(t)}<small>${esc(rest.join(' · ') || '')}</small></div><span class="go">Abrir</span></a>`; }).join('')}</div>
    <a class="btn alt" href="#/a/${A.id}">‹ Voltar ao sumário</a></section></main>`;
}
function render(){
  const h = location.hash.replace(/^#\/?/, '').split('/');
  let html;
  if(h[0] === 'a' && AULAS[h[1]]){ const A = AULAS[h[1]];
    html = h[2] === 'artigos' ? artigos(A) : +h[2] >= 1 && +h[2] <= A.pages.length ? page(A, +h[2]) : cover(A); }
  else html = home();
  $('#app').innerHTML = html; scrollTo(0, 0);
  if($('#trio')) $$('#trio [data-af]').forEach(btn => { const w = btn.dataset.af;
    Afago.bind(btn, w, {tap: true, face: m => btn.querySelector('.tb').innerHTML = dogAv(w, m, ''),
      say: (m, t) => $('#trioSay').innerHTML = dogBalloon({who: w, mood: m, v: esc(t)})}); });
  if($('#quadros')) Quadros.render($('#quadros'));
}
addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-n],[data-esc],.op,[data-lance],[data-theme-t]'); if(!t) return;
  if(t.dataset.themeT !== undefined){ setTheme(isDark() ? 'light' : 'dark'); return; }
  if(t.dataset.n){ e.preventDefault(); openSlide(t.dataset.deck, +t.dataset.tot, +t.dataset.n); return; }
  if(t.dataset.esc){ const on = !store.get('esc:' + t.dataset.esc, 0); store.set('esc:' + t.dataset.esc, on ? 1 : 0); t.classList.toggle('on', on); t.textContent = on ? '✓ Escrevi' : 'Marcar como escrito'; return; }
  if(t.dataset.lance !== undefined){ const l = t.closest('.lance'); l.classList.add('open'); t.remove(); l.insertAdjacentHTML('beforeend', reacao(l.dataset.who, 'lance')); return; }
  if(t.classList.contains('op')){ const q = t.closest('.mcq'), ok = +q.dataset.ok;
    q.querySelectorAll('.op').forEach((o, i) => o.classList.toggle('ok', i === ok)); if(+t.dataset.i !== ok) t.classList.add('no'); q.classList.add('done');
    q.querySelector('.ex').insertAdjacentHTML('beforebegin', reacao(q.dataset.who, +t.dataset.i === ok ? 'ok' : 'no')); }
});
render();
</script>
<style>.trio,.trio-say,.trio-hint,.sh-trio,.re,#trio,#trioSay,[data-trio],[data-af],.vb,.vera-av{display:none!important}</style>
