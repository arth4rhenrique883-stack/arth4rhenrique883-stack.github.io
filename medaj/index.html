<style>
/* Layout: app de uma tela, bem simples: o nome no centro do preto, o baralho, o resumo e o cartão. */
/* medaj. (28/10): preto predominante, branco, vermelho sutil e mínimos detalhes de azul; só a chama do nome muda de cor. */
/* O Dr. Casa (avatar, falas e casos) continua no código, fora da tela: .casa[hidden]. Para trazê-lo de volta, tirar o hidden do <aside class="casa">. */
:root{
  --bg:#050505; --surface:#0b0b0b; --surface-2:#111111; --line:#1f1f1f; --line-2:#333333;
  --fg:#ebebeb; --muted:#9c9c9c; --dim:#6b6b6b;
  --red:#b02a30; --red-ink:#d0585e; --blue:#7f97bd;
  --bad:#c2414a; --hard:#bdbdbd; --good:#7f97bd; --easy:#5aa883;
  --brand:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;color:inherit}
a{color:var(--fg);text-decoration-color:#5a5a5a;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* barra */
.bar{display:flex;justify-content:center;padding:clamp(28px,8vh,72px) 0 clamp(8px,3vh,24px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.word{font:700 clamp(64px,16vw,104px)/.9 var(--brand);letter-spacing:.01em;display:inline-flex;align-items:flex-end;color:#f5f5f5}
.flame{width:.36em;height:.5em;margin-left:.03em;margin-bottom:.04em;overflow:visible;flex:none}
.app-name{font:500 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.24em;text-transform:uppercase}

/* chama: desenho animado, quente e macabra; a única coisa que muda de cor */
.flame .tongue{transform-box:fill-box;transform-origin:50% 100%}
.flame .all{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .flame .hue{animation:hue 16s linear infinite}
  .flame .eyes{animation:blink 5s steps(1) infinite}
}
@keyframes hue{0%{filter:hue-rotate(0deg) saturate(1.1)}22%{filter:hue-rotate(-28deg) saturate(1.3)}45%{filter:hue-rotate(-95deg) saturate(1.2)}68%{filter:hue-rotate(75deg) saturate(1.25)}84%{filter:hue-rotate(20deg) saturate(1.2)}100%{filter:hue-rotate(0deg) saturate(1.1)}}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.97,1.05) skewX(-2deg)}100%{transform:scale(1.03,.96) skewX(2deg)}}
@keyframes lick{from{transform:rotate(-6deg) scaleY(.94)}to{transform:rotate(5deg) scaleY(1.08)}}
@keyframes blink{0%,92%{opacity:1}93%,96%{opacity:0}97%{opacity:1}}
@keyframes pulse{from{opacity:.45}to{opacity:.85}}

/* painel */
.deckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--display);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:#4a4a4a;background:#141414}
.chip .n{font:700 11px var(--mono);padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip[aria-pressed="true"] .n{color:var(--red-ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font:400 13px/1.3 var(--body);color:var(--muted)}
.stat.hot b{color:var(--red-ink)}

.main{display:block}
.casa[hidden]{display:none!important}

/* cartão */
.card{display:flex;flex-direction:column;gap:16px;min-height:340px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.tag{padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg)}
.tag.new{border-color:#6a2226;color:var(--red-ink)}
.meta .pos{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.q{font:600 clamp(21px,3.4vw,26px)/1.35 var(--body);letter-spacing:0;margin:6px 0 0;text-wrap:balance}
.ans{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ans p{margin:0;font:400 18px/1.65 var(--body)}
.ans .lbl{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ans .read{font:500 13px var(--display);color:var(--blue);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.ans .read:hover{text-decoration:underline}
.spacer{flex:1}
.reveal{align-self:stretch;font:500 15px var(--display);letter-spacing:.02em;padding:14px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:#fff;cursor:pointer}
.reveal:hover{border-color:var(--red)}
kbd{font:500 11px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.7;margin-left:8px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;min-width:0}
.grade b{font:500 14px var(--display)}
.grade small{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.grade.g0{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}.grade.g0 b{color:var(--bad)}
.grade.g3{border-color:color-mix(in srgb,var(--hard) 50%,transparent)}.grade.g3 b{color:var(--hard)}
.grade.g4{border-color:color-mix(in srgb,var(--good) 55%,transparent)}.grade.g4 b{color:var(--good)}
.grade.g5{border-color:color-mix(in srgb,var(--easy) 55%,transparent)}.grade.g5 b{color:var(--easy)}
.grade:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--line-2))}
.done{display:flex;flex-direction:column;gap:14px}
.done h2{font:600 clamp(24px,4vw,32px)/1.15 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.done .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.done .sum div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.done .sum b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.done .sum span{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{font:500 14px var(--display);padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.ghost:hover{border-color:#5a5a5a}

/* Dr. Casa */
.casa{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.casa-top{display:flex;gap:12px;align-items:center}
.avatar{width:96px;height:112px;flex:none}
.who b{display:block;font:600 20px/1 var(--display);letter-spacing:-.02em}
.who span{display:block;font:500 12px/1.35 var(--body);color:var(--muted);margin-top:4px}
.bubble{position:relative;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;font:500 15px/1.55 var(--body);min-height:84px}
.bubble::before{content:"";position:absolute;top:-7px;left:38px;width:12px;height:12px;background:var(--surface-2);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
.bubble.story{border-color:#6a2226}
.bubble .case{display:block;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red-ink);margin-bottom:4px}
.casa .row .ghost{flex:1;font-size:13px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){
  .avatar .cane{transform-box:view-box;transform-origin:165px 236px}
  .avatar.tap .cane{animation:tap .5s ease-in-out 2}
  .avatar .lids{animation:blink 6s steps(1) infinite}
  .avatar .brow-r{transform-box:fill-box;transform-origin:0 100%;transition:transform .25s}
  .avatar.raise .brow-r{transform:translateY(-4px) rotate(-8deg)}
  .avatar.smug .mouth{transform:translateY(-1px)}
}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}

footer{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
footer .linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.confirm{display:inline-flex;gap:8px;align-items:center}
.confirm button{font:500 12px var(--display);padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.confirm .danger{border-color:var(--bad);color:var(--bad)}

@media (max-width:820px){
  .casa{position:static;order:-1;gap:10px}
  .avatar{width:64px;height:75px}
  .who b{font-size:17px}
  .bubble{min-height:0;font-size:14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .card{min-height:0}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
  .done .sum{grid-template-columns:minmax(0,1fr)}
}
/* tablet e toque: alvos maiores, sem dica de teclado */
@media (min-width:700px){
  .wrap{max-width:780px}
  .q{font-size:clamp(24px,3.2vw,30px)}
  .ans p{font-size:20px}
}
@media (min-width:600px) and (max-width:820px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (pointer:coarse){
  kbd{display:none}
  .chip{padding:10px 14px;font-size:14px}
  .reveal{padding:18px;font-size:17px}
  .grade{padding:14px 6px}
  .grade b{font-size:16px}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
}
</style>

/* Estado e repetição espaçada (SM-2 adaptado) */
const DAY=86400000,NEW_PER_DAY=20,KEY="medaj-drcasa-v1";
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/DAY)};
let S={cards:{},days:{},t:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const st=id=>S.cards[id]||{r:0,i:0,e:2.5,due:0,l:0,last:0,seen:0};
function plan(c,q){
  let {r,i,e,l}=c;
  if(q===0) return {r:0,i:0,e:Math.max(1.3,e-.2),l:l+1,again:true};
  const e2=Math.max(1.3,e+(.1-(5-q)*(.08+(5-q)*.02)));
  let i2;
  if(r===0) i2=q===5?4:1;
  else if(r===1) i2=q===3?3:q===4?6:8;
  else i2=Math.max(i+1,Math.round(i*(q===3?1.2:q===4?e2:e2*1.3)));
  return {r:r+1,i:i2,e:e2,l};
}
const fmt=p=>p.again?"agora":p.i===1?"amanhã":p.i<14?p.i+" dias":p.i<60?Math.round(p.i/7)+" sem":Math.round(p.i/30)+" meses";

let deck="all",queue=[],cur=null,shown=false,sess={n:0,ok:0,total:0,streak:0};
const inDeck=c=>deck==="all"||c.ch===deck;
const isNew=c=>!S.cards[c.id];
const newToday=()=>(S.days[today()]||{}).nw||0;
function counts(filter){
  const t=today(),list=CARDS.filter(filter);
  const due=list.filter(c=>!isNew(c)&&st(c.id).due<=t).length;
  const nw=list.filter(isNew).length;
  return {due,nw,avail:due+Math.min(nw,Math.max(0,NEW_PER_DAY-newToday()))};
}
function build(){
  const t=today(),list=CARDS.filter(inDeck);
  const rev=list.filter(c=>!isNew(c)&&st(c.id).due<=t).sort((a,b)=>st(a.id).due-st(b.id).due);
  const nw=list.filter(isNew).slice(0,Math.max(0,NEW_PER_DAY-newToday()));
  queue=[];while(rev.length||nw.length){if(rev.length)queue.push(rev.shift());if(rev.length)queue.push(rev.shift());if(nw.length)queue.push(nw.shift())}
  sess={n:0,ok:0,total:queue.length,streak:0};
}

/* Tela */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function say(text,story){const b=$("bubble");b.classList.toggle("story",!!story);b.innerHTML=story?`<span class="case">Caso do Dr. Casa</span>${esc(text)}`:esc(text)}
function mood(m){const a=$("avatar");a.classList.remove("raise","smug","tap");void a.getBoundingClientRect();if(m)m.split(" ").forEach(x=>a.classList.add(x))}
function renderDecks(){
  const opts=[["all","Tudo"],...Object.entries(CHAPTERS)];
  $("decks").innerHTML=opts.map(([k,l])=>{const c=counts(x=>k==="all"||x.ch===k);return `<button class="chip" type="button" data-deck="${k}" aria-pressed="${deck===k}">${esc(l)}<span class="n">${c.avail}</span></button>`}).join("");
}
function renderStats(){
  const c=counts(inDeck),d=S.days[today()]||{n:0,ok:0};
  $("s-due").textContent=queue.length+(cur?1:0);
  $("s-new").textContent=c.nw;
  $("s-acc").textContent=d.n?Math.round(100*d.ok/d.n)+"%":"–";
  let s=0,t=today();if(!(S.days[t]&&S.days[t].n))t--;while(S.days[t]&&S.days[t].n){s++;t--}
  $("s-streak").textContent=s;
  $("foot-info").textContent=`${CARDS.length} cartões das apostilas medaj. · PRE 4 e PRE 1`;
}
function renderCard(){
  const el=$("card");
  if(!cur){
    if(sess.total===0){
      el.innerHTML=`<div class="done"><h2>Nada para hoje neste baralho</h2><p>Os cartões que você já estudou voltam na data certa. Cartões novos entram ${NEW_PER_DAY} por dia.</p><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(SAY.empty));
    }else{
      const acc=sess.n?Math.round(100*sess.ok/sess.n):0,tm=counts(inDeck);
      el.innerHTML=`<div class="done"><span class="meta">${esc(deck==="all"?"Tudo":CHAPTERS[deck])}</span><h2>Plantão encerrado</h2><div class="sum"><div><b>${sess.n}</b><span>respostas</span></div><div><b>${acc}%</b><span>de acerto</span></div><div><b>${tm.nw}</b><span>cartões novos ainda na fila</span></div></div><div class="row"><button class="ghost" type="button" data-act="ahead">Adiantar 10 cartões</button><a class="ghost" href="${APOSTILA}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir as apostilas</a></div></div>`;
      say(pick(acc>=70?SAY.done:SAY.doneBad));mood(acc>=70?"smug":"raise");
    }
    renderStats();return;
  }
  const s=st(cur.id),fresh=isNew(cur),pos=sess.total-queue.length;
  const pct=sess.total?Math.round(100*(pos-1)/sess.total):0;
  let html=`<div class="meta"><span class="tag">${esc(CHAPTERS[cur.ch])}</span>${fresh?'<span class="tag new">novo</span>':""}<span class="pos">${pos} de ${sess.total}</span></div><div class="progress"><i style="width:${pct}%"></i></div><p class="q">${esc(cur.q)}</p>`;
  if(!shown){
    html+=`<div class="spacer"></div><button class="reveal" type="button" data-act="reveal">Mostrar resposta<kbd>espaço</kbd></button>`;
  }else{
    const g=[[0,"Errei"],[3,"Difícil"],[4,"Bom"],[5,"Fácil"]];
    html+=`<div class="ans"><span class="lbl">Resposta</span><p>${esc(cur.a)}</p><a class="read" href="${APOSTILA}#${cur.sec}" target="_blank" rel="noopener">Ler na apostila: ${esc(SECS[cur.sec]||"")} ↗</a></div><div class="spacer"></div><div class="grades">${g.map(([q,l],k)=>`<button class="grade g${q}" type="button" data-q="${q}"><b>${l}</b><small>${fmt(plan(s,q))} · ${k+1}</small></button>`).join("")}</div>`;
  }
  el.innerHTML=html;renderStats();
}
function next(){cur=queue.shift()||null;shown=false;renderCard();if(cur&&sess.n>0&&Math.random()<.5)say(pick(SAY.ask));}
function grade(q){
  if(!cur||!shown)return;
  const p=plan(st(cur.id),q),t=today(),was=isNew(cur);
  S.cards[cur.id]={r:p.r,i:p.i,e:+p.e.toFixed(2),due:p.again?t:t+p.i,l:p.l,last:Date.now(),seen:(st(cur.id).seen||0)+1};
  const d=S.days[t]||(S.days[t]={n:0,ok:0,nw:0});d.n++;if(q>=3)d.ok++;if(was)d.nw=(d.nw||0)+1;
  sess.n++;if(q>=3){sess.ok++;sess.streak++}else sess.streak=0;
  if(p.again){queue.splice(Math.min(3,queue.length),0,cur);sess.total++}
  if(sess.streak===3||sess.streak===7){say(pick(SAY.streak));mood("smug tap")}
  else{say(pick(SAY["g"+q]));mood(q===0?"raise tap":q===5?"raise":"smug")}
  save();next();renderDecks();
}

/* Salvar: aparelho sempre; conta (claude.ai) quando disponível */
let remote=null,busy=Promise.resolve(),timer=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(timer);timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));busy=busy.then(()=>remote.set(body)).catch(()=>{$("sync").textContent="Não deu para salvar na conta agora. O progresso ficou neste aparelho."})},800)}
}
function merge(o){
  if(!o||!o.cards)return;
  for(const [id,c] of Object.entries(o.cards)){const m=S.cards[id];if(!m||(c.last||0)>(m.last||0))S.cards[id]=c}
  for(const [d,v] of Object.entries(o.days||{})){const m=S.days[d];if(!m||v.n>m.n)S.days[d]=v}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    remote=db.doc("data/users/"+uid+"/drcasa");
    const snap=await remote.get();
    if(snap.exists){merge(snap.data());try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(Object.keys(S.cards).length)save();
    $("sync").textContent="Progresso salvo na sua conta: aparece no celular e no computador.";
    if(!cur||!shown){build();next()}
    renderDecks();
  }catch(e){}
})();

/* Eventos */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-deck],[data-act],[data-q]");if(!b)return;
  if(b.dataset.deck){deck=b.dataset.deck;build();next();renderDecks();say(pick(SAY.hello));return}
  if(b.dataset.act==="reveal"){shown=true;renderCard();say(pick(SAY.reveal));return}
  if(b.dataset.act==="ahead"){const t=today();const pool=CARDS.filter(inDeck).filter(c=>!isNew(c)&&st(c.id).due>t).sort((a,b)=>st(a.id).due-st(b.id).due);const nw=CARDS.filter(inDeck).filter(isNew);queue=pool.concat(nw).slice(0,10);sess={n:0,ok:0,total:queue.length,streak:0};if(!queue.length){say("Não sobrou nada para adiantar. Você zerou o baralho. Vá ler o próximo capítulo.");return}next();say("Adiantando. Ambição é bom, desde que venha acompanhada de sono.");return}
  if(b.dataset.q!==undefined)grade(+b.dataset.q);
});
$("b-case").addEventListener("click",()=>{say(pick(CASES),true);mood("tap")});
$("b-hint").addEventListener("click",()=>{if(!cur){say("Dica: abra a apostila. É onde moram as respostas. Revolucionário, eu sei.");return}say(`Dica: está na seção "${SECS[cur.sec]}" do ${CHAPTERS[cur.ch]}. A resposta eu não dou. Sofrer um pouco também ensina.`);mood("raise")});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if((e.key===" "||e.key==="Enter")&&cur&&!shown&&!e.target.closest("button,a")){e.preventDefault();shown=true;renderCard();say(pick(SAY.reveal));return}
  if(shown&&["1","2","3","4"].includes(e.key)){grade([0,3,4,5][+e.key-1])}
});
$("b-reset").addEventListener("click",()=>{
  const slot=$("reset-slot");
  slot.innerHTML=`<span class="confirm">Apagar todo o progresso? <button class="danger" type="button" id="r-yes">Apagar</button><button type="button" id="r-no">Cancelar</button></span>`;
  $("r-no").onclick=()=>location.reload();
  $("r-yes").onclick=()=>{S={cards:{},days:{},t:Date.now()};save();location.reload()};
});

/* Tema: escuro por padrão */

build();renderDecks();next();say(pick(SAY.hello));
</script>

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
